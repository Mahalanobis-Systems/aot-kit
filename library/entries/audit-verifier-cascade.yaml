  effect: 'When the judge''s agreement with ground truth is no higher than the evaluated model''s score
    (both at least 0.5), no unbiased estimator using the judge''s labels is worth more than twice the
    ground-truth labels (sample-efficiency factor at most 2). Empirically the best possible factor stayed
    below 2 on MMLU and on MT-Bench (GPT-4 as judge), and was often substantially smaller, except when
    flagship models judged the much weaker Llama-2-7b on MMLU; with Llama-3.1-405b''s answer probabilities
    as a soft judge it stayed below 2 for stronger models and slightly exceeded 2 for Llama-3-70b. Per
    MMLU subtask, factors above 2 occurred in 6 of 57 subtasks (Claude judging GPT-4) and 1 of 57 (Llama-3.1-405b
    judging GPT-4). High agreement does not bound bias: GPT-4 (84% accurate) and Llama-3-70b (79%) as
    judges strongly perturbed MMLU model rankings, and models a few points apart would need agreement
    above 99% to be ranked reliably from judge labels alone.'
