# 9.c.iii: Audit a verifier-gated cascade against a gold sample the verifier never sees
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 9.c.iii
legacy_id: T48
slug: audit-verifier-cascade
name: Audit a verifier-gated cascade against a gold sample the verifier never sees
kind: technique
status: card
tiers:
- tier: 4
  why: it governs an escalation topology, which only a production test can judge
levers:
- control-flow
- model
domains:
- general
evidence_domains:
- reasoning
categories:
- verification.spend
- topologies.escalate
summary: 'When a cheap model''s outputs are accepted or escalated by a verifier, measure true error on
  a small gold-labeled sample outside the verifier: metrics measured through the verifier showed about
  3% error while true error was 14-32%. A frontier verifier cuts misses but escalates more than the true
  error rate, erasing the saving. Never train the cheap model on verifier rejects or accepted outputs.'
how: 1. Label a rolling sample (e.g. 100 cases a week) by hand or by the environment. 2. Score the cascade's
  delivered answers on it, separately from the verifier's own accept rate. 3. Alert when true error diverges
  from verifier-measured error.
detect:
  static: a cheap model whose outputs are accepted or escalated by a verifier model, with error measured
    only through the verifier
  traces: escalation rate against the eval's true error rate
  evals: no gold-labeled sample scored independently of the verifier
impact:
  quality:
    effect: improves
    size: medium
    when: 'reveals hidden error: ~3% through the verifier against 14-32% true (Sep 2026)'
    basis: evidence
  cost:
    effect: degrades
    size: small
    when: labeling the audit sample
    basis: evidence
  performance:
    effect: none
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
measure:
- method: monitor
  how: true error on a rolling gold-labeled sample
- method: production-test
  tier: 4
  how: A/B of the cascade against the single strong model
evidence:
- source: 'Rajput et al., "Cheap Verifiers, Large Blind Spots: Measuring the Reliability Cost of Cost-Saving
    Cascades", https://arxiv.org/abs/2609.01345'
  date: '2026-09-01'
  task: Audit cascades with a small gold-labeled sample outside the verifier
  effect: 'Qwen2.5-7B student, gpt-4o-mini verifier, GSM8K corrective loop: verifier-estimated error of
    the delivered stream flat near 3% across rounds while gold user-facing error swung 14% to 32% (5-11x
    gap, 95% intervals separate from round 1, n=300). Synthetic (rho=0.7, 20 seeds): dashboard 4.6% vs
    gold 24.9%. The paper calls an independent gold-labeled audit channel "not optional instrumentation
    but the only instrument that can see the effect" (recommendation, not itself measured as an intervention).'
  direction: supports
  measured: true
  locator: §5 Figure 2; §6 Corollary 2; §7 Figure 5; §10 Implications
- source: 'Rajput et al., "Cheap Verifiers, Large Blind Spots: Measuring the Reliability Cost of Cost-Saving
    Cascades", https://arxiv.org/abs/2609.01345'
  date: '2026-09-01'
  task: Do not assume a cheap LLM verifier catches a capable student
  effect: 'GSM8K, fixed gpt-4o-mini verifier: blind-spot rate beta rises from 0.12 (CI 0.08-0.17) at Qwen2.5-0.5B
    to 0.55 (CI 0.44-0.66) at 14B; 7B-32B plateau around 0.35-0.65. Hard MATH, fixed 7B student: beta
    0.42 (CI 0.32-0.53) with gpt-4o-mini vs 0.05-0.09 with gpt-4.1 / gpt-5-mini. Static, training-free
    sweep, so it holds for any plain cascade.'
  direction: supports
  measured: true
  locator: §5 Figures 3-4
- source: 'Rajput et al., "Cheap Verifiers, Large Blind Spots: Measuring the Reliability Cost of Cost-Saving
    Cascades", https://arxiv.org/abs/2609.01345'
  date: '2026-09-01'
  task: Expect a frontier verifier to eat the cascade saving
  effect: 'Hard MATH L4-5, Qwen2.5-7B student: gpt-4.1 verifier beta ~0.05 but escalation rate 0.46 (CI
    0.39-0.53, n=200) against a 0.39 true error rate, i.e. frontier price on nearly half of traffic. "Low
    blind spot and low cost are not simultaneously available from a fixed verifier."'
  direction: supports
  measured: true
  locator: §5 Figure 4; §1 findings
- source: 'Rajput et al., "Cheap Verifiers, Large Blind Spots: Measuring the Reliability Cost of Cost-Saving
    Cascades", https://arxiv.org/abs/2609.01345'
  date: '2026-09-01'
  task: Do not fine-tune the cheap model on verifier rejects
  effect: 'Qwen2.5-1.5B and 7B students, GSM8K corrective loop, teachers gpt-4o-mini, gpt-4o (cross-family)
    and Qwen2.5-32B (same-family): naive LoRA fine-tuning on rejects degraded the student in every case
    and cumulatively collapsed it (raw error rising to 1 as output format broke). Frozen control stayed
    near 13% error. Single-seed runs.'
  direction: supports
  measured: true
  locator: §5 "The loop degrades the student"; §1
- source: 'Rajput et al., "Cheap Verifiers, Large Blind Spots: Measuring the Reliability Cost of Cost-Saving
    Cascades", https://arxiv.org/abs/2609.01345'
  date: '2026-09-01'
  task: Never recycle verifier-accepted outputs as training labels
  effect: 'Synthetic model only (rho=0.7, 20 seeds, 8 rounds): self-training user-facing error 0.296 vs
    corrective 0.249 (raw error 0.356 vs 0.304); frozen 0.334; oracle-in-loop 0.000. Predicted rise above
    q0*beta0 was not observed.'
  direction: supports
  measured: true
  locator: §6 H3; §7 Table 1, Figure 7a
- source: 'Rajput et al., "Cheap Verifiers, Large Blind Spots: Measuring the Reliability Cost of Cost-Saving
    Cascades", https://arxiv.org/abs/2609.01345'
  date: '2026-09-01'
  task: Random oracle audits are cheap but shallow
  effect: 'Synthetic model only (rho=0.7): auditing 40% of items lowers the corrective floor from 0.25
    to 0.22, vs 0.14 for a 4-verifier ensemble; neither reaches the oracle floor (0) in the tested budget.'
  direction: supports
  measured: true
  locator: §7 H5, Figure 8
- source: 'Zhou et al., "Variation in Verification: Understanding Verification Dynamics in Large Language
    Models", https://arxiv.org/abs/2509.17995'
  date: '2025-09-22'
  task: Pair a weak generator with a strong verifier
  effect: 'Math, difficulty [0.7,0.8), 181 problems, GPT-4o verifier, 64 samples: Gemma2-9B vs Gemma2-27B
