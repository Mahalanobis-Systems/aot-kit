caveats: 'Most of the evidence on how to bound is narrow: the position-cut result is one harness and one
  unnamed model (15 runs per arm), file-only delivery cost two GPT models 7.9 and 11.3 points (the smaller
  loss not significant after correction) but two Claude models nothing detectable on one simulator benchmark,
  the cut-notice results are single-turn tests (one tool output, one answer) on one production archive
  with notice wording that also carried instructions, and the file-window and code-over-JSON results come
  from GPT-4 Turbo in 2024 and single-turn question answering. The current-model case for having a cap
  at all is bundled: the self-evolved harness that took GPT-5.6 Sol from 34% to 90% on BrowseComp-Plus
  also added time limits, compaction and review, and in VeRO''s TerminalBench-2 runs the commit that cut
  context-overflow errors from 13 to 1 moved those tasks into timeouts (16 to 23) with passes unchanged
  at 27 of 89. The cost bound comes from re-scoring public trajectories of two open models with simulated
  caching, and the finding that agents never page from one middleware''s logs, published by its builders
  without a count of the responses covered. No controlled study yet varies cap size, truncation style
  or file offload on current frontier coding agents at matched compute, and none measures security.'
