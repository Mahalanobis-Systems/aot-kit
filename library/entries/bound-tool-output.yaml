- source: 'Pramod Kumar, Raj Kumar Pandey (Pennsylvania State University), "TurnCost: Turns, Not Observations:
    Cache-Aware Loop Engineering for Coding Agents", https://arxiv.org/abs/2610.15093'
  date: '2026-10-10'
  task: 'Re-score 600 published coding-agent trajectories under an exact prefix-cache simulation: measure
    tool-observation sizes, compare deterministic truncation of large observations with delegating them
    to a cheaper model for summarization, decompose trajectory cost into turn count and observation size,
    and classify the agent''s next action after a truncation marker'
  effect: 'Observation size (Table 1): median 118 to 286 tokens by cell, 90th percentile 749 to 1,258,
    99th percentile 4,274 to 6,208, maximum 12,854 to 33,494; edit tools, not logs, produced the largest
    observations (mean 787 against 294 tokens for read and execute). "Across all twenty combinations of
    cell and threshold, B3 [deterministic truncation] matches or very slightly beats R1 [delegation],
    the largest gap being 0.17 percentage points"; "At aggressive thresholds, where nearly every observation
    is delegated, both methods save 11-19%. At conservative thresholds, where only genuinely large observations
    are touched, savings decline toward zero and turn negative in two of the four cells." Cost regression
    over 600 trajectories: turn count R^2 = 0.844, mean observation size R^2 = 0.040. SWE-agent''s 100,000-character
    cap "caps the tail, it does not set the median." Truncation markers appeared on 518 of 56,164 observations
    (0.92%); "After guided truncation, 76.9% of next actions narrow the query and exactly one, 0.2%, terminates
    the trajectory, compared with 44.0% narrowing after bare truncation; no agent repeats the identical
    command."'
  conditions: 'nvidia/Open-SWE-Traces: OpenHands and SWE-agent with Qwen3.5-122B-A10B and MiniMax-M2.5,
    150 trajectories per cell, SWE-rebench-V2 tasks; costs simulated (o200k_base tokenizer, cached input
    at 0.1x, near-ideal caching); the corpus excludes runs that hit the iteration limit, which may thin
    the tail of large observations; quality of truncation or summaries not measured; the cost decomposition
    is associational and partly mechanical; workshop paper (POVC ''26 at ASE 2026)'
  direction: mixed
  measured: true
  locator: Abstract; §4; §5.1 Table 1; §5.2 Table 2; §5.4 Figure 3; §5.6 Figure 4; §5.7; §5.8; §7
- source: Qiankai Xu, "Multi-Task Self-Evolving Harnesses with the Agent as Its Own Optimizer", https://arxiv.org/abs/2609.38372
  date: '2026-09-29'
  task: Let a frozen model solve tasks from a 49-line seed harness (one bash tool, every output appended
    whole, no truncation, timeouts or compaction) and then edit that harness from its own run records
    over five iterations; compare with the seed and with Codex or Claude Code on held-out and out-of-distribution
    benchmarks
  effect: '"All four models added output truncation in Iteration 1, passing only part of an overly long
    output to the model." With GPT-5.6 Sol on BrowseComp-Plus, "a broad rg search can print tens of millions
    of characters, and the seed aborted on 65 tasks for this reason. Receiving truncated output, Iteration
    5 narrows its searches and reads candidate files one at a time, and it answers 57 of these 65 tasks
    correctly." Table 5 (100 BrowseComp-Plus tasks): Seed 34.00, Codex 93.00, Iteration 5 90.00; out-of-distribution
    average +12.47 [+8.6, +16.3] over Seed, "Most of this gain comes from BrowseComp-Plus", the other
    four benchmarks +1.58 on average with an interval including zero. Case studies: a GLM-5.3 seed put
    "a command output of nearly 400,000 characters" into history and failed, while Iteration 5 "shows
    the model only the truncated part and saves the full output to a file"; on a Terminal-Bench 2.1 task
    where about 6 MB was printed, "Claude Code saved the output to a file, showed the model only a short
    preview, and went on to pass the task." Truncation triggered most in retrieval and document tasks,
    never on GAIA2 or tau3-Bench banking, whose tools return short outputs.'
  conditions: GPT-5.6 Sol and GPT-5.6 Luna at high reasoning effort, GLM-5.3 and GLM-5.3-Flash at max;
    Codex or Claude Code as production baselines at the same effort; GPT-5.6 Sol evolved in three independent
    runs, out-of-distribution results from Run 1 only; truncation arrived bundled with command time limits,
