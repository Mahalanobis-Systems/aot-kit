- source: 'Tatiana Petrova, Andrei Mazniak, Radu State (University of Luxembourg), "Agents Don''t Paginate:
    First-Chunk Selection for LLM Tool Responses", https://arxiv.org/abs/2608.26130'
  date: '2026-06-23'
  task: From session logs of a public MCP middleware serving Claude Code, Cursor, Codex CLI and Aider,
    check whether agents request later pages of over-budget tool responses; then, offline on SWE-bench
    Verified, rank the files of a capped file-search result six ways to fill a 1K to 8K-token first chunk,
    and test whether placing the needed file first changes file localization for five models
  effect: '"across the full corpus of session logs the rate of agent-initiated second-chunk requests is
    exactly zero, and after a truncated response the agent moves directly to its next reasoning or editing
    step"; 37% of get_epics and 28% of get_merge_request_diffs calls exceeded an 8K-token budget. Gold
    file ranked first (500 tasks): tool order 24.2%, keyword scorer 35.0%, with fallback 35.8%; adding
    four file-metadata signals cut it by 4.8 pp (p = 0.001). Downstream (Table 2, tool order against keyword
    scorer): Claude Opus 4.7 94.0 against 93.8, Claude Sonnet 4.5 90.8 against 93.0, GLM-5.1 93.3 against
    90.5, gemma4:26b 86.3 against 87.3, gpt-oss:20b 81.8 against 82.5; "accuracy moves by at most +/-2.8
    p.p. and no model shows a significant change"; "what reaches its answer is first-chunk inclusion,
    not the gold''s rank within it."'
  conditions: Pagination finding from one middleware the authors build and deploy (2,607 sessions; the
    number of over-budget responses and whether each advertised a cursor are not reported; "not verified
    externally"); downstream test is a single-turn file-localization probe on 100 tasks where the needed
    file was in the list, one call per cell at temperature 0, 4,800 calls, not a resolve-rate test; candidate
    lists capped at 50 files; Python-only
  direction: mixed
