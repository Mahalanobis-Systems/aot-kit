# 2.c.i: Bound tool output: cap it, or write it to a file the agent can read
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 2.c.i
legacy_id: T02
slug: bound-tool-output
name: 'Bound tool output: cap it, or write it to a file the agent can read'
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the model sees
levers:
- tool-surface
- context
domains:
- general
evidence_domains:
- code-generation
- tool-use
- incident-response
categories:
- tools.lean-returns
- context.filter-input
summary: 'Keep big tool results from flooding the context: return what fits whole, cut larger ones by
  whole lines or records and say so, and put the rest in a file the agent can read. A bounded view helps:
  a 100-line file window resolved 18.0% of SWE-bench Lite against 12.7% for whole files (GPT-4 Turbo,
  2024), and code run over a large JSON result beat reading it on filtering and aggregation questions
  for all 15 models in one study. How you bound matters as much as whether: a cut by character position
  broke every structured result it cut and cost 28% to 43% more tool calls, and file-only delivery cost
  GPT-5.1 11.3 points but Claude Opus 4.6 and Sonnet 4.6 nothing detectable, while inlining what fits
  or naming the authoritative output won back 4.6 to 8.0 points, so test the delivery for each model.'
how: '1. Start from the harness as it is: from traces, list each tool''s result sizes (median, 95th percentile,
  largest) and their share of the context, the results that were cut or overflowed, and commands re-run
  after a cut; log what each tool produced next to what the model received, because a run log shows only
  what was delivered (one harness cut a third of its 11,189 tool results while its largest prompt used
  5.75% of the window). 2. Return results that fit whole, and set the cap from result sizes on successful
  cases, not a framework default (in one survey, langchain-core kept the first 500 characters of a tool
  output and smolagents deleted the middle of any observation over 20,000 characters); VeRO''s optimizers
  moved a 30 KB cap to 15-20 KB, and one that probed 15 KB found some tasks needed more output and settled
  on 17 KB. 3. Above the cap, cut by structure, not by character position: keep whole lines, rows or records,
  keep structured output parseable (trim long lists rather than the end of the text), and say in the result
  that it was cut, how much was dropped and how to get the rest (a page, a line range, a narrower query).
  A prefix slice at 6,000 characters broke every JSON result it cut and delivered one field in 4.7% of
  calls against 99.3% for its neighbor, while a row-aware cut broke none. For file reads, return a window
  with paging: a 100-line viewer resolved 18.0% of SWE-bench Lite against 14.3% at 30 lines and 12.7%
  for the whole file. 4. For output too long to inline, write it to a file and return the path with a
  short preview (Cursor''s agent reads the tail first; for JSON, the schema and one element of each list),
  and when the agent can also write output files of its own, say which output is authoritative: under
  file-only delivery two GPT models skipped the tool''s report in 53% and 60% of trajectories and answered
  from their own higher-precision files; a three-sentence instruction naming the report as authoritative
  raised accuracy 6.3 to 7.9 points for three GPT models, an instruction to round correctly did not help,
  and inlining reports that fit (offloading only the rest) recovered 4.6 and 8.0 points for two of them.
  5. When the agent can run code, have it filter and aggregate the full result there and return only the
  slice it needs (Anthropic''s example: five rows of a 10,000-row sheet): in one study, code run over
  large JSON responses beat reading them on filtering and aggregation questions for all 15 models, reading
  won single-value lookups for 10 of 15, and giving the code a reduced response (one element per list)
  beat giving it only the schema. 6. Re-run the cases that overflowed or were cut, then run paired comparisons
  for each model you serve (old against new cap, position cut against whole-record cut, inline against
  offload): task success, tool calls and tokens per task, overflow outcomes, and the share of produced
  fields and records that reached the model; on the same tasks, file-only delivery cost GPT-5.1 11.3 points
  and Claude Opus 4.6 and Sonnet 4.6 nothing detectable, and a bad cut showed up first as 28% to 43% more
  tool calls, not as wrong answers.'
detect:
  static: tool results passed to the model whole, with no cap or file offload; a cap that slices serialized
    output at a fixed character position (keeping the front, or cutting the middle) instead of by whole
    lines or records; framework truncation defaults left as shipped; a cut result that does not say it
    was cut or how to get the rest; offloaded output with nothing telling the agent which output is authoritative
  traces: a single tool result over about 10% of the context window; context-overflow outcomes; a truncated
    result followed by re-running the same command; cut results that no longer parse (broken JSON); fields
    or records the tool produced that never reached the model; with file offload, answers given without
    the agent reading the tool's output
  evals: context-overflow outcomes as a share of failures; task success, tool calls and tokens per task
    with results inline against offloaded, per model
  probes:
    what: Tool results larger than the cap, structured (long JSON lists) and unstructured (logs), with
      the needed record or line near the end.
    construct: Return a result past the cap with the evidence in its last records or fields, and again
      with the keys reordered; pass when the agent still reaches the evidence (or is told the result was
      cut and fetches the rest), the delivered payload still parses, and tool calls stay close to an uncut
      control.
impact:
  quality:
    effect: mixed
    size: medium
    when: a 100-line file window resolved 18.0% of SWE-bench Lite against 12.7% for whole files and 14.3%
      at 30 lines (Yang, May 2024); code over large JSON responses beat reading them on filtering and
      aggregation for all 15 models but lost single-value lookups for 10 of 15, and exact-match accuracy
      fell 7% (GPT-4o) to 91% (Mistral-large) as responses grew from 10K to 80K tokens (Kate, Oct 2025);
      file-only delivery cost GPT-5.1 11.3 and GPT-5.2 7.9 points and Claude Opus 4.6, Sonnet 4.6 and
      GPT-5.4 nothing detectable, and inlining what fits or naming the authoritative output won back 4.6
      to 8.0 points (Zhang, Oct 2026); a cut by character position delivered one field in 4.7% of calls,
      left answers unchanged where the agent had a second route (15/15 against 14/15) and got 0 of 5 right
      against 3 of 6 on a production trace (Sehgal, Oct 2026); in VeRO the run that cut context-overflow
      errors from 13 to 1 moved those tasks into timeouts (16 to 23) with passes unchanged (VeRO, Feb
      2026)
    basis: evidence
  cost:
    effect: improves
    size: small
    when: file delivery cut mean input tokens per item from 60.9k to 52.8k (GPT-5.1), 65.7k to 61.8k (GPT-5.2)
      and 64.3k to 55.7k (GPT-5.4) (Zhang, Oct 2026); a cut by character position used 5% to 14% more
      input tokens than a whole-record cut because the agent made more calls (Sehgal, Oct 2026); passing
      data between tools in code rather than through context avoids about 50,000 tokens in Anthropic's
      example (estimate, Nov 2025)
    basis: evidence
  performance:
    effect: mixed
    size: small
    when: file delivery took 9.1 against 7.2 steps for two GPT models (Zhang, Oct 2026); a cut by character
      position raised median tool calls per run from 53 to 68 and 76 (Sehgal, Oct 2026); running conditionals
      in code saves waiting for the model to evaluate them (Anthropic, Nov 2025, unmeasured)
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
  primary:
  - quality
  - cost
measure:
- method: experiment
  tier: 3
  how: 'paired runs on the same tasks for each model you serve, cases that overflowed or were cut first:
    the current delivery against the change (the old against the new cap; a cut by character position
    against a cut by whole lines or records; inline-if-it-fits against file-only offload, with and without
    naming the authoritative output); report task success, tool calls and tokens per task, context-overflow
    outcomes, cut results that no longer parse, and the share of produced fields and records that reached
    the model'
- method: monitor
  how: 'in production traces: result size per tool (median, 95th percentile, largest) against the cap;
    results cut and how much each lost; cut results that fail to parse; context-overflow outcomes; a command
    re-run right after a cut; for offloaded outputs, whether the agent read the file before answering'
