  effect: 'Agent overclaim, warped against clear wording (Table 3, 120 answers each): scope 120/120 (100%)
    against 9/120 (8%), +92 pp [+80, +100]; completeness (result cap) 74/120 (62%) against 0/120 (0%),
    +62 pp [+46, +78]; uncertainty 120/120 (100%) against 24/120 (20%), +80 pp [+73, +87]; provenance
    changed little (+6 pp; 94% still overclaimed). Fixed-answer verifier test: "Verifiers accepted the
