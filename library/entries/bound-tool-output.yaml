- source: 'Yuvraj Sehgal, Mahsa Panahandeh, Naser Ezzati-Jivan, "Context Is a Pipeline, Not a Window:
    Information Attrition in LLM Agent Harnesses", https://arxiv.org/abs/2610.36114'
  date: '2026-10-26'
  task: Measure how much of each tool result a root-cause-analysis agent's harness delivered to the model
    when it cut results to a fixed character budget by slicing the serialized JSON, replay recorded results
    through that cut and through a row-aware cut, then put the cut back in a controlled experiment with
    everything else fixed; survey how seven agent frameworks cut tool output
  effect: 'Field data, 720 runs: "a third of all tool results (3,827 of 11,189) were cut before they reached
    the model, and every cut result became broken JSON", while "the single largest prompt used only 5.75%"
    of the window; "One field reached the model in only 4.7% of calls" (of 742) and "A second field, in
    the very same results, reached the model in 99.3% of calls." Replaying 864 recorded results at the
    shipped 6,000-character cap: "Every result over the budget broke under the prefix slice, every time;
    none broke under the row-aware cut"; 50% of process-listing calls broke and 2.5% of all calls were
    affected. On a production-scale trace the shipped slice delivered 30 of 118 early-list records and
    0 of 128 late-list records. Controlled experiment (medians, 15 runs per arm): row-aware cut 14/15
    correct, 53 tool calls, 18 computations, yield 0.61; prefix-slice defect 15/15, 68 calls, 32 computations,
    yield 0.34, input tokens +5%; defect with keys reversed 15/15, 76 calls, 36 computations, yield 0.31,
    tokens +14%: "the cut hurts only where the agent has no second route to the answer, and its cost shows
    up as extra work before it shows up as errors." Production-trace replay: repaired 3 of 6 correct,
    defect 0 of 5. Survey: "langchain-core slices serialized tool output down to 500 characters, keeping
    only the front; smolagents deletes the middle of any observation over 20k characters"; three frameworks
    do not cut tool output at all; one shell middleware "cuts by whole lines and says so".'
  conditions: One harness (a multi-worker agent diagnosing injected faults from Linux kernel traces),
    one unnamed model with a 400K window at temperature 0, one domain; 145 controlled runs over 5 recordings
    per fault class with 3 repeats each; the controlled budget was scaled to the smaller traces; the authors
    reintroduced their own defect under registered predictions; whether the cut causes the field accuracy
    split (0 to 24 of 60 for faults in already-running containers against 40 to 55 of 60) is left open;
    a page-on-request fallback never fired
  direction: mixed
  measured: true
  locator: Abstract; §I; §II Table I; §III-A to III-C, Fig. 1; §IV Table II; §V; §VI
- source: 'Ke Zhang, Sahchit Chundur, Jerry Peprah Owusu, Mohammad Javad Abdolhosseini Qomi, Maziar Raissi,
    "Same Simulation, Different Evidence: Where Retrieved Tool Output Costs LLM Agents Accuracy", https://arxiv.org/abs/2610.26836'
  date: '2026-10-19'
  task: Deliver a geochemistry simulator's report (up to 846.8k characters) inline (head and tail truncated
    to 100,000 characters) or as a file read through a section index (TOC), through keyword search, or
    through a hybrid that inlines reports that fit and indexes the rest; locate where accuracy is lost
    by re-running every logged simulator call, and test instructions that name the authoritative output
    or ask for correct rounding
  effect: 'Pooled TOC minus inline: GPT-5.1 -11.3 pp [-18.0, -4.9] (Holm p=0.005), GPT-5.2 -7.9 pp [-14.9,
    -0.9] (Holm p=0.128, unadjusted 0.032); Claude Opus 4.6 -0.6, Claude Sonnet 4.6 -0.5 and GPT-5.4 +0.2
    pp, "with intervals that include zero"; keyword search "does no better". With the simulation held
    fixed, TOC still cost GPT-5.2 -9.4 pp [-14.5, -4.6]. Under TOC, GPT-5.2 and GPT-5.1 received no part
    of the report in 60.3% and 53.0% of trajectories, answered from their own higher-precision output
    files and chose the truncated neighboring option in 26/35 and 19/27 trap cases (Sonnet 1/35); they
    took 9.1 against 7.2 steps. GPT-5.4 lost about ten points the same way, offset by computing the keyed
    value more often. An instruction that the report is authoritative raised accuracy over all TOC runs
    by +7.9 (GPT-5.2), +6.3 (GPT-5.1) and +7.8 pp (GPT-5.4, to 81.6%, +7.9 above its inline runs); a rounding
    instruction alone moved accuracy +0.6 and +1.2 pp. Hybrid raised accuracy over the TOC control by
    +4.6 (GPT-5.2) and +8.0 pp (GPT-5.1). Mean input tokens per item, TOC against inline: 52.8k against
    60.9k (GPT-5.1), 61.8k against 65.7k (GPT-5.2), 55.7k against 64.3k (GPT-5.4). "Inlining outputs that
    fit is a safe default; when agents can create their own outputs, a harness should state which output
    is authoritative."'
  conditions: PHREEQC; 158 execution-verified multiple-choice items from 19 setups, distractors usually
    one printed digit from the key; 24-step cap; Claude at temperature 0 without extended thinking, GPT
    models at API defaults with no reasoning-effort setting; Gemini 3 Flash left out (no parseable answer
    on 46% of items inline, 71% under TOC); not every model ran or repeated every condition, and the instruction
    comparison rests on one control run per model
  direction: mixed
  measured: true
  locator: Abstract; §2.2; §3 Tables 1-2; §4 Tables 3-4; §5 Table 5; §6; §9
- source: Kiran Kate, Yara Rizk, Poulami Ghosh, Ashu Gulati, Tathagata Chakraborti, Zidane Wright, Mayank
    Agarwal (IBM Research et al.), "How Good Are LLMs at Processing Tool Outputs?", https://arxiv.org/abs/2510.15955
  date: '2025-10-10'
  task: Answer extractive, filtering and aggregation questions over real JSON API responses (24,000 to
    74,000 characters on average) either by reading the response (answer generation) or by writing Python
    that is executed over it (code generation), with or without the response schema, and with the full,
    a reduced (one element per list) or no response in the code prompt
  effect: '"Performance generally declines as response size increases, with GPT-4o experiencing a 7% drop
    and Mistral-large showing the steepest decline at 91%" (10K to 80K tokens, exact match); answer position
    moved accuracy by 5% (GPT-4o) to 75% (Mistral-large). "the total accuracy when generating code is
    better for 13 out of 15 models. However, for extractive questions, answer generation is better for
    10 out of 15 models including a strong code model such as Claude-4-Sonnet"; for filtering and aggregation
    "code generation is more accurate for all the models"; the gap between the two "ranges from 2% to
    47%". For GPT-4o, switching to code turned 40% of aggregation samples from false to true and 2% from
    true to false, but 14% of extractive samples from true to false and 1% from false to true. Adding
    the schema helped code generation for all 15 models. With code generation, "passing the full response
    achieved the highest accuracy across all models", and a reduced response beat none. An oracle projection
    12x shorter (5,056 against 60,968 characters) raised accuracy by 8 to 38 points.'
  conditions: 1,298 question-answer samples from six RapidAPI endpoints; GPT-4o, Claude-4-Sonnet and 13
    open models (8B to 480B+), greedy decoding, zero-shot, exact match; single-turn processing of one
    response, not an agent loop; the oracle projection uses the ground-truth code and is an upper bound;
    text checked against v2 (Jan 2026)
  direction: supports
  measured: true
  locator: Abstract; §1; §2.1 Table 1; §4.1-4.5, Table 2, Figures 3, 6, 7; §4.7.2 Figure 10; App. C.1;
    Limitations
- source: 'John Yang, Carlos E. Jimenez, Alexander Wettig, Kilian Lieret, Shunyu Yao, Karthik Narasimhan,
    Ofir Press, "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering", https://arxiv.org/abs/2405.15793'
  date: '2024-05-06'
  task: Show files through a viewer window of 30 lines, 100 lines or the whole file, and return search
    results capped at 50 matches (over the cap, no results and a request for a more specific query) against
    paging through matches one at a time or having no search tool
  effect: '"The file viewer presents a window of at most 100 lines of the file at a time." SWE-bench Lite
    resolved: 100 lines 18.0%, 30 lines 14.3%, full file 12.7%; "Either too little content ... or too
    much ... lowers performance." "The search commands return at most 50 results for each search query;
    if a search exceeds this number, we do not report the results and instead suggest that the agent write
    a more specific query": summarized search 18.0%, iterative search 12.0%, no search 15.7%; with iterative
    search "agents tend to look through every match exhaustively", which "can exhaust an agent''s cost
    budget or context window".'
  conditions: GPT-4 Turbo; single-configuration ablations of the full SWE-agent setup on SWE-bench Lite
    (300 tasks); the authors ablate their own interface; a 2024 model, so the best window size may differ
    for current models
  direction: supports
  measured: true
  locator: §3 (Search and navigation; File viewer); §5.1 Table 3
- source: 'Alexis Fox, Junlin Wang, Paul Rosu, Bhuwan Dhingra (Duke University), "PRO-LONG: Programmatic
    Memory Enables Long-Horizon Reasoning", https://arxiv.org/abs/2607.20064'
  date: '2026-07-22'
  task: Append every action and the resulting observation, whole, to one log file and have the agent read
    it with file tools, grep and Python instead of carrying it in context; ablate the tools the agent may
    use on the log
  effect: 'Over the same coding agent without the log, +18.0 points on average across frontier models
    on the ARC-AGI-3 public game set, matching or beating harnesses built for each model with 4.2 to 5.8
    times fewer tokens. Tool ladder (GPT-5.5): read only 23.1%, plus grep or regex 27.2%, plus Python 38.3%,
    plus write and edit 41.2%. Compared with no log rather than with inline results.'
  conditions: ARC-AGI-3 public demo set (25 games), 500-action budget; Codex CLI with GPT-5.5, Claude Code
    with Claude Opus 4.6 and Fable 5; logs past 320,000 lines on one game
  direction: supports
  measured: true
  locator: Abstract; §3.1; §3.2 Table 1 (tool ladder); §3.3 tool-call mix
caveats: 'How a result is bounded decides whether bounding helps: a cut by character position silently
  dropped whole fields and broke every structured result it cut, with the cost showing first as extra
  tool calls rather than wrong answers (one harness, one unnamed model, 15 runs per arm), and file-only
  delivery cost two GPT models 7.9 and 11.3 points (the smaller loss not significant after correction)
  but two Claude models nothing detectable on one simulator benchmark, because the GPT models answered
  from their own files instead of the tool''s report. In VeRO''s TerminalBench-2 runs every cap change
  came bundled with other edits: the run that cut context-overflow errors from 13 to 1 moved those tasks
  into timeouts (16 to 23) with passes unchanged at 27 of 89, and three tasks that passed before regressed
  in all three runs, which the authors put down to the output-length and prompt changes optimizers tend
  to make. The file-window and search-cap results used GPT-4 Turbo in 2024 and the code-over-JSON results
  come from single-turn question answering rather than an agent loop, so measure on your own agent and
  models.'
