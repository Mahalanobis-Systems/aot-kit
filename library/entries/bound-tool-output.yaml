    16 samples and seeing some tasks needed more). Filesystem run cut ContextLengthExceeded from 13 to
    1.
  date: 2026-02
- source: repo figure_04 (100 runs, five benchmarks)
  task: mixed
  effect: MAX_TOOL_OUTPUT_CHARS lowered 16 times, raised 13. The only frequently-touched constant lowered
    more often than raised.
  date: 2026-02
