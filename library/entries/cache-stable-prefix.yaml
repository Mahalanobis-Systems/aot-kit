caveats: 'The measured evidence is small: one controlled study on one research benchmark (40 sessions
  per model and cache mode, a 10,000-token system prompt that dominated the prompt), one inference provider''s
  report on its own traffic with open models (its server-side figures mix harness edits with cache eviction),
  and counts of fixed defects; none measures task quality. Caching more is not always better: in that
  study caching only the stable system prompt gave the most consistent latency gains while caching the
  full context raised GPT-4o''s time to first token 8.8%, and a Claude 5-minute write costs 1.25x input
  and expires 5 minutes after the last request that used it started, so short sessions, long gaps or low
  reuse can cost more than no caching. Mechanics differ and change (current Claude minimums alone span
  512 to 4,096 tokens, caches are per model, effort settings are rendered into the prompt), so a layout
  tuned to one provider can miss on another. In one relay study a shared cache leaked membership of known
  prompts across customers on several production routes but yielded unknown text only once (16 bits),
  and its tenant-split cost is modeled, not billed.'
