  effect: '120 defects from 622 candidate PRs. Request side 97 (81%): model-name gating 37 (31%), incompatible
    cache marker 10 (8%), prefix reassembly 15 (13%), volatile value such as a timestamp or UUID in the
    cached prefix 13 (11%), nondeterministic serialization 10 (8%), misplaced marker 3 (3%), cross-turn
    mutation 9 (8%); read side, usage miscount 23 (19%). "108 of 120 (90%) raise no error": 86 (72%) silent
    waste, 22 (18%) wrong telemetry; 12 (10%) crashed, 8 of them incompatible markers. In hermes-agent#754
    a gateway "reassembled the system prompt every turn and lifted cost by roughly 75%"; pruning history
    images after three turns meant "each compaction silently rebuilt the cache instead of hitting it"
    (openclaw#58038); a live timestamp in the system prompt meant "the cache never hit" (goose#2434).
    68% of fixes were small static local edits. CacheLint: precision 0.71 and recall 0.78 on the 120;
    on 571 other repositories 32 true positives of 37 warnings (precision 0.86), 21 confirmed and 18 fixed,
    one in Anthropic''s .NET SDK; without the dated capability table precision fell to 0.05, and gpt-5.4-mini
    answered 5 of 33 dated one-hour-TTL capability facts confidently and correctly.'
  conditions: Ten most-starred multi-provider agent applications on GitHub (OpenClaw, Hermes-Agent, AutoGPT,
    OpenCode, LobeHub, OpenHands, Cline, Goose, Aider, Nanobot), merged PRs to 2026-05-10, three coders
    (Fleiss kappa 0.76 on screening); counts defects that were found and fixed, not hit rates or bills;
