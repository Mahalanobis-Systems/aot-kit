    changed, 61% when reasoning effort changed and 67% when the number of tools changed ("more than 20
    times as likely", re-reading about 40% of the previous prompt); tool-list changes on about 0.5% of
    turns carried 19% of re-read tokens. Lab: of 539 follow-on requests 88% were pure appends and all
    65 breaks came from the harness editing what it had already sent (none from chat templates; idle time,
    restart and resume and sub-agents caused none): OpenCode 1.x''s plan-mode reminder (330 to 2,340 tokens
    re-read a turn), omp replacing an earlier file read (5,846 of 15,520 tokens re-read), effort written
    at token 8 of the GLM-5.3 and DeepSeek V4.1 templates, MCP tools inserted alphabetically mid-list
    (about 1,300 tokens in for OpenCode 1.x on GLM-5.3), the date in the system prompt about 2,000 tokens
    in, and compaction (67,850 tokens re-read over three compactions in OpenCode 2.x, 29,776 over one
    in 1.x). Summarizers that re-serialize the transcript into one new message: "In the largest such workload
    we saw, those calls were only 22% cached." Switching back to an earlier setting hit 10.6k to 27.5k
