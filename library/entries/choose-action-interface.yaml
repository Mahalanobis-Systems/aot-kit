absorbs:
- legacy_id: P06
  name: CodeAct
  group: Prompting Strategies
  source: master
  family: tool
  sub_type: code_execution
  categories:
  - tools.refactor
  note: Emit executable Python instead of JSON tool calls.
  assessment:
    detection:
      static: A tool that accepts a code string and executes it in a sandbox; JSON tool schemas replaced
        or supplemented by a code tool.
      traces: Code blocks as actions; round trips per task; sandbox errors and timeouts.
      evals: Success on data-processing tasks; calls per task.
      judge: Rate generated code for safety and for doing the task in one pass.
      probes:
        what: Tasks that need a loop over many records.
        construct: Data tasks where the JSON-tool route would need more than ten calls (aggregate 50 rows,
          dedupe a list).
      primary:
      - static
      - probes
    qa:
      unit: Sandbox isolation, timeouts, memory and network limits.
      examples: Data-processing probes.
      benchmark: Data-processing or coding benchmark.
      production: Sandbox violation alerts; error rate.
      primary:
      - unit
      - production
    impact:
      cost:
        effect: improves
        magnitude: medium
        note: One program replaces many round trips.
      security:
        effect: degrades
        magnitude: high
        note: Arbitrary code execution; sandbox quality decides everything.
      brand:
        effect: none
        magnitude: low
        note: ''
      governance:
        effect: degrades
        magnitude: medium
        note: Harder to allowlist actions than with named tools.
      quality:
        effect: improves
        magnitude: medium
        note: 'VeRO T12: a code tool was added then removed on MATH; replacing a code interpreter with
          typed functions (T15) was the biggest GAIA gain.'
      latency:
        effect: improves
        magnitude: medium
        note: Fewer round trips.
      primary:
      - security
      - cost
