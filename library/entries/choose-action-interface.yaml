caveats: 'Much of the evidence is bundled, small or self-reported: the harness study changed tools together
  with prompts, file-state tracking and diagnostics; Vercel''s 80%-fewer-tools result also removed prompts
  and context and covers 5 queries; mini-SWE-agent''s 74% is self-reported, Cloudflare''s 1,000-token
  figure is calculated rather than tested and Block''s 30% is one author''s test; and the largest code-execution
  gains (GPT-5.4 18.6% to 71.5%) come from the authors'' own many-call benchmark, with gains of 0.7 to
  11.1 points on independent MCP benchmarks. The best interface depends on the model and the task, so
  a result for one model does not transfer: the same actions as typed calls or as command text differed
  by up to 36.6 points in either direction across six models and three environments, code that calls tools
  scored slightly below typed calls at 2B parameters or fewer, and two frontier coding agents'' pass rates
  moved under 3 points across interfaces while cost moved by up to 24.6%. VeRO flags the narrow calculator
  tool on MATH as intuitively helpful but its test gain (0.86 to 0.88) as within noise, with a MATH baseline
  of 0.87 near the target model''s ceiling.'
