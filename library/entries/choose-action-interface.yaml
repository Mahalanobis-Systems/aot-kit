# 2.a.iii: Choose how the agent acts: typed tools, code execution, or shell, matched to the model and task
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 2.a.iii
legacy_id: T61
slug: choose-action-interface
name: 'Choose how the agent acts: typed tools, code execution, or shell, matched to the model and task'
kind: technique
status: card
tiers:
- tier: 3
  why: it changes the agent's tools within the existing design
levers:
- tool-surface
- model
domains:
- tool-use
evidence_domains:
- code-generation
- tool-use
- data-analysis
- web-research
- reasoning
