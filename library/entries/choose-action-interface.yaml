    the gain held at 30 repeats. Bash-only environment errors per trajectory: 3.11 (Qwen3Coder-30B), 0.35
    (Kimi K2.5), 0.54 (Sonnet 4.5); typed tools cut Qwen3Coder-30B''s broken edits from 1.64 to 0.19 and
    malformed commands from 0.96 to 0.01. Median steps and input tokens, bash-only to typed tools: Qwen3Coder-30B
    64 to 43 and 980K to 662K (-32%); Kimi K2.5 56 to 59 and 950K to 1,141K (+20%); Sonnet 4.5 74 to 80
    and 2,140K to 2,576K (+20%), as the stronger models already chain more operations per bash call (1.40-1.50
    against 1.15). Python actions: mean steps 77 to 46, 65 to 47 and 80 to 55 at similar resolve rates,
    but pass^5 fell for all three models (Qwen3Coder-30B 0.046 to 0.016). On 72 further instances with
    the two open models: typed tools +9.5 and +2.5 points pass^5; Python -0.6M and -0.4M input tokens
    and -25.9 and -15.1 steps.'
