- source: Mak et al., "Is Bash All You Need? An Empirical Study of Tool Interfaces for Enterprise Digital
    Worker Agents", https://arxiv.org/abs/2609.11999
  date: '2026-09-10'
  task: Give a bash-only interface rather than typed tools for enterprise digital-worker tasks
  effect: 'Opus-4.8 and GPT-5.5 on TheAgentCompany and APEX-Agents, five interfaces compared: bash-only
    beats typed tools by 21.8-24.5 pp on TheAgentCompany and 4.8-7.4 pp on APEX-Agents, with 19-72% fewer
    tokens. Adding typed or agent-synthesized tools on top of bash gives no measurable gain; programmatic
    tool calling saves tokens but scores below bash.'
  direction: supports
  measured: true
- source: Patel et al., "The Bitter Lesson of Tool Calling", https://arxiv.org/abs/2608.06370
  date: '2026-08-06'
  task: Call tools from code rather than JSON
  effect: 'BFCL v4, 14 models: programmatic (code) tool calling matches or beats JSON tool calling in
    11; more robust under degraded context, where the JSON baseline loses 2.3% on average.'
  direction: supports
  measured: true
- source: Bin Wu et al. (Anthropic), "Introducing advanced tool use on the Claude Developer Platform",
    https://www.anthropic.com/engineering/advanced-tool-use
  date: '2025-11-24'
  task: Call tools programmatically from code
  effect: Programmatic tool calling cut tokens 37% (43.6k to 27.3k) on complex research tasks.
  direction: supports
  measured: true
- source: 'Matt Carey (Cloudflare), "Code Mode: give agents an entire API in 1,000 tokens", https://blog.cloudflare.com/code-mode-mcp/'
  date: '2026-02-20'
  task: Expose a large API through search and execute in code
  effect: 2,500+ API endpoints behind search() and execute(); the model writes code against the typed
    spec in a sandbox. About 1k tokens against 1.17M, calculated not tested.
  direction: supports
  measured: false
- source: Rizel Scarlett (Block), "8 Things You Didn't Know About Code Mode", https://goose-docs.ai/blog/2026/02/06/8-things-you-didnt-know-about-code-mode/
  date: '2026-02-06'
  task: Use code mode for multi-tool tasks only
  effect: About 30% fewer tokens on identical tasks (one author's test, Opus 4.5); little benefit on single-tool
    tasks; model-dependent. A description mentioning 'long-running task' pulled in the wrong extension;
    explicit imports prevented it.
  direction: mixed
  measured: false
- source: Ankur Goyal (Braintrust) and Andrew Qu (Vercel), "Testing if 'bash is all you need'", https://vercel.com/blog/testing-if-bash-is-all-you-need
  date: '2026-01-22'
  task: Give a typed query tool for structured data, not bash alone
  effect: 'Structured-data questions, Sonnet 4.5: SQL tool 100% accurate, bash 52.7%, basic file tools
    63%; bash used 7x the tokens and cost 6.5x more. SQL plus bash reached 100% with the agent checking
    its own answers, at about 2x SQL''s tokens. Found and fixed 5 wrong expected answers in the benchmark.'
  direction: mixed
  measured: true
caveats: 'The paper flags this as intuitively helpful but the test gain is within noise; MATH
  baseline 0.87 is near the target model''s ceiling.'
