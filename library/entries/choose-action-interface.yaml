summary: 'Choose the agent''s action interface per model and task: typed tools, a shell, or code that
  calls tools. Weaker models do better with typed tools (read, write, edit, grep, a narrow calculator):
  a general code interpreter made a weak agent write boilerplate and fail until it was replaced with typed
  functions, and structured data gets a typed query tool whatever the model (SQL scored 100% against 52.7%
  for bash at a seventh of the tokens; SQL plus bash also reached 100%). Strong models on shell-heavy
  or general office work get bash (on enterprise digital-worker tasks bash-only beat typed tools by 21.8-24.5
  points with fewer tokens, and typed tools on top of bash added nothing), and work that chains many calls
  or processes bulk data gets code that calls the tools, because intermediate results never pass through
  the model: it matched or beat JSON calling for 11 of 14 models on BFCL v4, beat one-at-a-time calls
  on a many-call benchmark for all ten models tested and for small open models from 4B parameters up,
  but not at 2B or below, and a narrow calculator did as well as full code execution on math. The best
  choice is specific to the model and task (two frontier coding agents'' pass rates moved under 3 points
  across interfaces while cost moved by up to 24.6%, and the same actions offered as typed calls or as
  command text moved small models'' scores by up to 36.6 points in either direction), so start minimal,
  add tools per observed failure, provision packages, interpreter state and concurrent commands for code
  and shell, sandbox it (10.a.i), and decide by a paired eval per model.'
how: '1. Start from the baseline: the current interface and model. Log per task success, consistency over
  repeated runs (pass^k), cost, steps, wall-clock time, errors by kind (tools that do not exist, malformed
  commands, broken edits, import or command-not-found errors) and which tools were actually called. Enforce
  the interface in configuration where you can and audit the calls: in one study a restriction set only
  in the prompt still let 7 and 4 explicit edit-tool calls through in 110 runs, and could not rule out
  the same edits made through bash. 2. Probe each model on 20 or more representative cases under each
  candidate interface (typed tools only, bash only, typed tools plus bash, code that calls the tools),
  with the same prompt and budget and several repeats. Do not assume the direction: the same actions offered
  as typed calls or as command text moved small models'' scores by up to 36.6 points, and typed calls
  won in only 8 of 18 model-environment pairs. Signs that a model needs typed tools: frequent environment
  errors under bash (3.11 per trajectory for a weak coding model against 0.35-0.54 for stronger ones;
  typed tools cut its malformed commands from 0.96 to 0.01 per trajectory), bash-only runs that end after
  emitting tools that do not exist (66% of one weak model''s runs), or a model of 2B parameters or fewer,
  where code that calls tools scored slightly below typed calls. 3. Pick the interface per task type.
  Structured data: a typed query tool (SQL 100% against 52.7% for bash), with bash beside it if the agent
  should check its own answers. Shell-heavy coding or office work with a strong model: bash (typed tools
  on top of bash gave no gain on enterprise tasks and raised input tokens 20% for two strong coding models).
  Many dependent calls, loops, filters, joins or bulk data: code that calls the tools as typed functions
  and returns only the result (GPT-5.4 went from 18.6% to 71.5% on one many-call benchmark; 37% fewer
  tokens in Anthropic''s test). Repository edits: measure before dropping native edit tools (code-only
  cost 14.4% more with Claude Code, not significant, with 39.9% more output tokens, but 19.9% less with
  Codex). Where success ties, as it did for two frontier coding agents (pass rates within 3 points across
  default tools, bash only and code only), choose on cost (code-only cost 24.6% less on computation tasks
  with Claude Code). 4. Start minimal (bash, read, write, edit, grep, or one code-execution tool) and
  add a tool only when a trace shows a failure it would have prevented. 5. Provision code and shell: install
  the packages and fixtures the tasks expect; keep interpreter state between code calls (persistent cells
  raised pass rate in all eight matched comparisons by 0.6-5.7 points, several within run-to-run variation,
  and cut follow-up API calls from about 27-30 to 4-8); let the code load tool schemas on demand rather
  than all up front (most of the token savings in that study); allow concurrent commands; and sandbox
  it (10.a.i). 6. Measure: a paired eval per model and task type, interface A against B with the same
  model, prompt and budget and several repeats, comparing success and pass^k, cost, steps, wall-clock
  time and the share of calls made through the assigned interface; re-run it when the model changes.'
detect:
  static: the interface in use (typed tools, code interpreter, bash), the model it serves, and whether
    the environment has the packages and fixtures the tasks need
  traces: bash-only runs emitting tools that do not exist; typed-tool runs re-patching the same file;
    malformed shell commands and broken edits per run (a weak coding model averaged 3.11 environment errors
    per bash-only trajectory against 0.35-0.54 for stronger ones); code errors in routine operations (reading
    a file, searching); import-error or command-not-found spans at the start of runs; calculations done
    in the model's own text; independent commands serialized; long chains of single tool calls that pass
    large intermediate results through the model; calls outside the assigned interface
  evals: success, consistency over repeated runs (pass^k), cost and steps by model under each interface
impact:
  quality:
    effect: mixed
    size: large
    when: typed tools +15.0 points on SWE tasks for a weak model and bash-only +3.6 for a strong one (Fan,
      Sep 2026); typed tools on bash raised a weak model's pass^9 from 0.020 to 0.094 (Xu, Aug 2026);
      typed functions in place of an interpreter took GAIA from 0.07 to 0.24 (VeRO, Feb 2026); bash beat
      typed tools by 21.8-24.5 points on enterprise tasks (Mak, Sep 2026); code that calls tools beat
      one-at-a-time calls for all ten models on a many-call benchmark (GPT-5.4 18.6% to 71.5%) but not
      at 2B parameters or fewer (Mao, Nov 2026); the same actions as typed calls or command text differed
      by up to 36.6 points in either direction (Shi, Oct 2026); two frontier coding agents moved under
      3 points across interfaces (Yang, Jul 2026)
    basis: evidence
  cost:
    effect: improves
    size: large
    when: 'bash-only cut cost 53% for a bash-capable model (Fan, Sep 2026) and used 19-72% fewer tokens
      than typed tools on enterprise tasks (Mak, Sep 2026); calling tools from code cut tokens 37% (Wu,
      Nov 2025), and code-only cut cost 24.6% on computation tasks with Claude and 19.9% on repository
      edits with Codex (Yang, Jul 2026); the wrong choice costs more: bash used 7x the tokens of a SQL
      tool on structured data (Goyal, Jan 2026), typed tools on top of bash raised input tokens 20% for
      two strong models (Xu, Aug 2026), and code-only cost 14.4% more (not significant) on repository
      edits with Claude (Yang, Jul 2026)'
    basis: evidence
  performance:
    effect: mixed
    size: medium
    when: calling tools from code finished chained calls faster for 13 of 14 models (0.32 to 0.96 of the
      JSON time; GPT-5 2.8x slower) (Patel, Aug 2026), Vercel's bash-and-SQL agent went from 274.8 s to
      77.4 s (Qu, Dec 2025) and code actions cut mean steps from 77 to 46, 65 to 47 and 80 to 55 (Xu,
      Aug 2026); but code that calls tools against one-at-a-time calls cut wall time per task for two
      of four models (Gemini 3.1 Pro 117.8 to 44.6 s) and raised it for two (GPT-5.4 mini 14.0 to 19.1
      s) (Mao, Nov 2026), and bash against typed tools was faster in one of four model-benchmark pairs
      (5.1 to 3.0 minutes) and slower in three (Mak, Sep 2026)
    basis: evidence
  security:
    effect: degrades
    size: large
    when: a shell or code interpreter lets the agent run anything its sandbox allows, where typed tools
      and code limited to a typed catalog expose only listed operations; no source here measures attack
      rates by interface, so how much it degrades depends on the sandbox and network policy (10.a.i)
    basis: assessment
  governance:
    effect: degrades
    size: medium
    when: named typed tools are easier to allowlist and audit than free shell or code; one study recommends
      code limited to a typed catalog where policy requires a fixed set of actions (Mak, Sep 2026), and
      a restriction set only in the prompt still let a few edit-tool calls through (7 and 4 in 110 runs)
      (Yang, Jul 2026)
    basis: assessment
  brand:
    effect: unknown
  primary:
  - quality
  - cost
measure:
- method: experiment
  tier: 3
  how: 'paired eval per model and task type, interface A against B (typed tools, bash, typed tools plus
    bash, code that calls the tools) with the same model, prompt and budget and several repeats: success
    and pass^k, cost, steps, wall-clock time, environment errors per run and the share of calls made through
    the assigned interface; where success ties, keep the cheaper interface'
- method: monitor
  how: 'per run in production: interface and model, success, cost, steps, wall-clock time, errors by kind
    (nonexistent tools, malformed commands, broken edits, import or command-not-found errors), calls outside
    the assigned interface and sandbox violations; re-run the paired eval when the model changes'
evidence:
- source: Fan et al., "An Empirical Study of Harness Design for Coding Agents", https://arxiv.org/abs/2609.20804
  date: '2026-09-17'
  task: Match action space to model's shell proficiency and task
  effect: 'T4/128k, planning on. Nemotron-3 30B: typed tools +15.0 pts SWE (25.2 vs 10.2) and +10.1 TB.
    66% of its bash-only TB runs end after emitting tools that don''t exist (trajectory 71->15 turns).
    120B: tools +1.6 SWE / +4.5 TB and shorter runs (101->77, 96->70 turns) at no extra cost. 550B: bash-only
    +3.6 SWE / +5.6 TB with cost -53% / -30% and calls -32% / -24%. Mistral: tools +23.2 on SWE (bash-only
    45.4 vs 68.6; 32.8% of bash-only runs never edit vs 1.2%; file-localization failures 16.0%->41.4%),
    but bash-only +6.7 on TB, where 71.9% of its actions were already bash. Bash-only cuts re-patching
    for all models (e.g. 550B 4.6->1.5) and raises create/replace share on TB (e.g. 28%->64% for 30B).
    The ablation bundles tool availability, prompts, file-state tracking and diagnostics.'
  direction: supports
  measured: true
  locator: §2.2 Table 1; §3.2 'The predefined tool set scaffolds weaker models...', Fig 7; §4 Table 7;
    App 9.3.1 Table 10, 9.5 Tables 11-12
