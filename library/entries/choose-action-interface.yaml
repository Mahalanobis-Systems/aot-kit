categories:
- tools.refactor
- models.workload-fit
summary: 'Decide the action interface deliberately, by model and by task, and provision what it needs.
  The rule the evidence supports: (1) weaker models get typed tools (read, write, edit, grep, a narrow
  calculator); a general code interpreter made a weak agent write boilerplate and fail until it was replaced
  with typed functions. (2) Structured data gets a typed query tool, whatever the model: SQL scored 100%
  against 52.7% for bash at a seventh of the tokens, and SQL plus bash also reached 100%. (3) Strong models
  on shell-heavy or general office work get bash: on enterprise digital-worker tasks bash-only beat typed
  tools by 21.8-24.5 points with fewer tokens, and typed tools on top of bash added nothing. (4) Work
  that chains many calls or processes bulk data gets code execution, because intermediate results never
  pass through the model; calling tools from code matched or beat JSON calling for 11 of 14 models on
  BFCL v4, and a narrow calculator did as well as full code execution on maths. Whichever you choose:
  start minimal and add tools per observed failure; for code or shell, provision the packages and fixtures
  the agent expects, allow concurrent commands, and sandbox it (10.a.i).'
how: '1. Classify the model''s shell and coding ability from a probe run (typed tools against bash-only
  on 20 cases). 2. Pick the interface by the table in the summary; for code execution, install the packages
  the tasks need and set up fixtures. 3. Add tools only when a trace shows a failure a tool would have
  prevented. 4. Paired eval per model: success, cost, steps.'
detect:
  static: the interface in use (typed tools, code interpreter, bash), the model it serves, and whether
    the environment has the packages and fixtures the tasks need
  traces: bash-only runs emitting tools that do not exist; typed-tool runs re-patching the same file;
    code errors in routine operations (reading a file, searching); import-error or command-not-found spans
    at the start of runs; calculations done in the model's own text; independent commands serialized
  evals: success and cost by model under each interface
impact:
  quality:
    effect: mixed
    size: large
    when: typed tools +15.0 points for a weak model; bash-only +3.6 for a strong one (Fan, Sep 2026);
      typed functions in place of an interpreter took GAIA from 0.07 to 0.24 (VeRO)
    basis: evidence
  cost:
    effect: improves
    size: large
    when: bash-only -53% cost for a bash-capable model; chaining tools in code 150k to 2k tokens in one
      example
    basis: evidence
  performance:
    effect: unknown
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
measure:
- method: experiment
  tier: 3
  how: 'paired eval per model, interface A against B: success, cost, steps'
evidence:
- source: Fan et al., "An Empirical Study of Harness Design for Coding Agents", https://arxiv.org/abs/2609.20804
  date: '2026-09-17'
  task: Match action space to model's shell proficiency and task
  effect: 'T4/128k, planning on. Nemotron-3 30B: typed tools +15.0 pts SWE (25.2 vs 10.2) and +10.1 TB.
    66% of its bash-only TB runs end after emitting tools that don''t exist (trajectory 71->15 turns).
    120B: tools +1.6 SWE / +4.5 TB and shorter runs (101->77, 96->70 turns) at no extra cost. 550B: bash-only
    +3.6 SWE / +5.6 TB with cost -53% / -30% and calls -32% / -24%. Mistral: tools +23.2 on SWE (bash-only
    45.4 vs 68.6; 32.8% of bash-only runs never edit vs 1.2%; file-localization failures 16.0%->41.4%),
    but bash-only +6.7 on TB, where 71.9% of its actions were already bash. Bash-only cuts re-patching
    for all models (e.g. 550B 4.6->1.5) and raises create/replace share on TB (e.g. 28%->64% for 30B).
    The ablation bundles tool availability, prompts, file-state tracking and diagnostics.'
  direction: supports
  measured: true
  locator: §2.2 Table 1; §3.2 'The predefined tool set scaffolds weaker models...', Fig 7; §4 Table 7;
    App 9.3.1 Table 10, 9.5 Tables 11-12
- source: Andrew Qu (Vercel), "We removed 80% of our agent's tools", https://vercel.com/blog/we-removed-80-percent-of-our-agents-tools
  date: '2025-12-22'
  task: Replace specialized text-to-SQL tools with bash plus SQL
  effect: 'Claude Opus 4.5, 5 representative queries, old vs new: avg time 274.8s -> 77.4s ("3.5x faster");
    success 4/5 -> 5/5; avg tokens ~102k -> ~61k ("37% fewer"); avg steps ~12 -> ~7 ("42% fewer"). Worst
    case: old "724 seconds, 100 steps, and 145,463 tokens before failing"; new "141 seconds with 19 steps
    and 67,483 tokens" and succeeded. v1 code lists 17 tools. Bundled with the context and prompt removals
    below, so not a single-variable result.'
  direction: supports
  measured: true
  locator: 'v2: The file system is the agent; 3.5x faster table'
- source: Andrew Qu (Vercel), "We removed 80% of our agent's tools", https://vercel.com/blog/we-removed-80-percent-of-our-agents-tools
  date: '2025-12-22'
  task: Drop reasoning-constraining prompts and pre-filtered context
  effect: 'Part of the bundled v1 -> v2 change (5 queries, Opus 4.5, numbers above). "We were constraining
    reasoning because we didn''t trust the model to reason. With Opus 4.5, that constraint became a liability."
    Both code samples show instructions: "", so the size of the prompt change is not visible.'
  direction: supports
  measured: true
  locator: Getting out of the model's way; Lessons learned
- source: 'Barbaste et al., "Harness Engineering: Anatomy, Architecture, and Evolution of Coding Agents
    -- A Source-Code Study of Eleven Systems", https://arxiv.org/abs/2609.00006'
  date: '2026-07-15'
  task: Start with a bash-only tool, add tools per failure
  effect: '"Mini-SWE-Agent''s single-tool design reports 74%+ on SWE-Bench with essentially no tool infrastructure
    (self-reported)"; the paper says it is not comparable head-to-head with Codex''s 69.1% (different
    models, runs, sandboxing).'
  direction: supports
  measured: true
  locator: Recommendation 3 (Sec 16.3); Sec 13.4; Sec 15.2
- source: 'Barbaste et al., "Harness Engineering: Anatomy, Architecture, and Evolution of Coding Agents
    -- A Source-Code Study of Eleven Systems", https://arxiv.org/abs/2609.00006'
  date: '2026-07-15'
  task: Consolidate APIs instead of 1-to-1 wrapper tools
  effect: 'Rec 17 quoting [18]: "a common error we''ve observed is tools that merely wrap existing software
    functionality or API endpoints." Consolidate instead.'
  direction: supports
  measured: false
  locator: Recommendation 17 (Sec 16.9)
- source: Lance Martin, "Agent Design Patterns", https://rlancemartin.github.io/2026/01/09/agent_design/
  date: '2026-01-09'
  task: Give the agent a filesystem and shell
  effect: '"The filesystem gives agents access to persistent context. The shell lets agents run built-in
    utilities, CLIs, provided scripts, or code they write." Examples: Claude Code, Manus virtual computer.'
  direction: supports
  measured: false
  locator: Give Agents A Computer
- source: Lance Martin, "Agent Design Patterns", https://rlancemartin.github.io/2026/01/09/agent_design/
  date: '2026-01-09'
  task: Keep few atomic tools; push actions into bash
  effect: 'Rationale: the GitHub MCP server "has 35 tools with ~26K tokens of tool definitions"; overlapping
