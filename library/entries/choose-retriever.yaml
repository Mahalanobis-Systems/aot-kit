- source: 'Li et al., "Beyond Semantic Similarity: Rethinking Retrieval for Agentic Search via Direct
    Corpus Interaction", https://arxiv.org/abs/2605.05242'
  date: '2026-05-03'
  task: Replace the retriever tool with grep and file reads
  effect: 'BrowseComp-Plus (830 q, 100,195 docs, avg 5,179 words), same Sonnet 4.6 backbone: Qwen3-Embedding-8B
    retrieval agent 69.0% -> DCI-Agent-CC 80.0% (+11.0), cost $1,440 -> $1,016 (-29.4%); beats best retrieval
    baseline GPT-5 + Qwen3-Embed-8B (71.7%). Per-question: 176 DCI-only wins vs 76 retrieval-only wins;
    of the 176, 142 already had at least one gold doc surfaced by the retriever. DCI-Agent-Lite (GPT-5.4
    nano) 62.9% at $93 vs o3 + Qwen3-Embed-8B 66.0% at ~$740. Multi-hop QA over 21M-passage Wikipedia
    (50 q/dataset): DCI-CC avg 83.0 vs ASearcher-Local-14B 52.3 (MuSiQue 74 vs 24). IR ranking NDCG@10
    avg 68.5 (CC) / 56.7 (Lite) vs ReasonRank-32B 47.0; Lite loses to ReasonRank on Economics (32.3 vs
    36.6) and SciFact (72.7 vs 75.5). Wins attributed to fine-grained local inspection of documents already
    reached, not to higher recall.'
  direction: supports
  measured: true
  locator: Abstract; Sec 4.2 (Fig 1, Tables 2-3); Sec 4.3 RQ2 (Fig 4)
