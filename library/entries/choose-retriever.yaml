- source: Stefan Heule, Emily Jia, Naman Jain (Cursor), "Improving agent with semantic search", https://cursor.com/blog/semsearch
  date: '2025-11-06'
  task: Add a semantic code-search tool alongside grep
  effect: 'Offline (Cursor Context Bench): on average 12.5% higher accuracy answering questions with semantic
    search available (6.5%-23.5% depending on model); improved accuracy for every model tested, including
    all frontier coding models. Online A/B (same model, one arm grep-style tools only): agent code retention
    +0.3% with semantic search, +2.6% on codebases with 1,000+ files; dissatisfied follow-up requests
    +2.2% when semantic search was absent. Effect sizes online are diluted because not all requests need
    search. "The combination of these two leads to the best outcomes."'
  direction: supports
  measured: true
  locator: Intro bullets; Offline evals; Online A/B tests; Conclusion
