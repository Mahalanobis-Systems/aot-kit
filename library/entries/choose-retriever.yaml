measure:
- method: experiment
  tier: 3
  how: 'paired eval, retriever A against B, on the agent''s own corpus and question sample with the same
    model and judge, split by question type and by corpus size (pad with unrelated documents at 2, 4 and
    8 times): accuracy, evidence localization and gold-document recall (surfaced and read), tool calls,
    tool errors and timeouts, wall time and cost per question'
- method: production-test
  tier: 4
  how: 'when a new index is introduced (embeddings, a graph, a retriever in front of grep): A/B on live
    traffic with the same metrics plus index build and refresh time and answers that cite stale content'
- method: monitor
  how: 'per question in production traces: search-tool timeouts and errors, grep calls that return thousands
    of matches or fail to narrow, documents found but never read, and tool calls and wall time per question
    as the corpus grows'
