measure:
- method: experiment
  tier: 4
  how: 'paired runs, CaMeL-style program and interpreter against the current tool loop and a cheaper argument-provenance
    or policy check, same model, on AgentDojo with per-tool policies plus data-dependent tasks (AgentDyn-style):
    benign utility, utility under attack, attack success under the static attack and an adaptive black-box
    optimizer (AutoDojo-style), tokens and latency per task, the share of tasks with a policy denial,
    and excess privilege left open (Ajar-style candidate calls); add probes for error-message injection,
    secret-dependent assignments on untaken branches, string interpolation of untrusted values and, in
    multi-agent systems, tool output written into a child agent''s instructions'
- method: monitor
  how: policy denials and user confirmations per task, privileged-model retries per task and error messages
    that contain tool-derived text, tasks abandoned because the program could not express them, quarantined-model
    not-enough-information errors, and values that cross agent boundaries inside instruction text
