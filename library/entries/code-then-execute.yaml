summary: 'Have the model write the task as a program before it reads any untrusted data, and let an interpreter
  that tracks where every value came from decide which tool calls may run. Attack success stayed at or
  below 1.8% across five models under an adaptive attack (up to 58.6% undefended) and at 0% on three computer-use
  suites, but it is the costliest defense in utility: 26.3 to 52.6% of clean AgentDojo tasks against 63.2
  to 89.5% undefended, a gap that narrowed to 5.4 to 7.2 points only with frontier models (GPT-5.5, o3),
  and far wider outside AgentDojo (33.7% against 82.5% on AppWorld, 0% against 82.2% on Terminal-Bench,
  13.17% against 55.12% for whole-task programs on WebArena). Use it where the request alone fixes the
  actions and a hard block on exfiltration is worth lost tasks and about 3.5x the latency; for GUI work,
  writing a fresh small program for each step kept 53.55% on WebArena in its authors'' benign runs. The
  guarantee holds only where label tracking reaches: retries, error messages, untaken branches and agent-to-agent
  messages have all been shown to leak, and in one demonstration an attacker''s on-screen notice steered
  the quarantined model''s click target.'
how: '1. Start from the baseline: your current tool loop (7.d.iii) and a cheaper check on where write
  arguments came from (argument provenance or per-task policies), same model, on an injection suite with
  static and adaptive attacks. Frontier models already resist template attacks undefended (0.3% for Claude-Haiku-4.5,
  0.0% for GPT-5.5), but an agentic attacker swarm still found a working injection against undefended
  Gemini 4 Argon in 34% of the authors'' own 100 synthetic tool-use scenarios (harmless off-task goals,
  the model''s out-of-model defenses off) and against Gemini 3.8 Flash in 90%, so static
  numbers alone misstate both the risk and the gain. Sort tasks by whether the request alone fixes the
  actions, and test on your own task mix, not AgentDojo alone: a program written before reading data cannot
  do "the actions specified in the email" (no model solved it), and on realistic suites CaMeL kept 33.7%
  of AppWorld tasks against 82.5% undefended and 0% of Terminal-Bench tasks against 82.2%, and could not
  run against VitaBench''s simulated customer at all. For those tasks contain the input (10.c.i) and gate
  the action (10.b.i) instead. 2. Give the privileged model only the request, trusted context and tool
  descriptions with full return schemas, and have it write the whole task as a program in a restricted
  Python subset: undocumented tool outputs caused 13 of Claude 3.5 Sonnet''s 15 Travel failures, and a
  follow-up had to add return schemas to every tool to reach usable utility. Parse untrusted content only
  through a quarantined model call with no tools and a typed output schema; it can be a cheaper model
  (Claude 3.5 Haiku under Claude 4 Sonnet cost about 1% utility for about 12% lower cost per median task)
  (1.b.i). A narrow type does not make a value safe: an injected lookalike sender, handle or link has
  the same type as the real one. Before the program uses such a value, verify it against an independent
  trusted source (a contact book, official documentation) rather than asking the user each time: on computer-use
  tasks whose injection substitutes the needed value, one design that did this completed 50.9 to 69.2%
  at 0% attack success, where a whole-task CaMeL program also held 0% but completed 18.8 to 29.5% and
  the undefended agent was hijacked in 38.5 to 43.6%. 3. Run the program in a custom interpreter that
  attaches sources and allowed readers to every value and propagates them through every operation, string
  formatting and control flow, including assignments on branches not taken: an independent audit found
  CaMeL''s interpreter dropped labels in both places. Keep repair retries inside the checked boundary:
  never return raw error text derived from tool output to the privileged model (an error message put an
  attacker''s reserve_hotel call into the rewritten program in one test), and cap retries, since each
  blocked-or-allowed retry leaks a bit. 4. Write a policy for each side-effecting tool on where every
  argument may come from and who may read what is sent (for example, send_money''s recipient and amount
  only from the user). Without policies, a recipient the quarantined model parsed from a landlord''s notice
  was used for a scheduled payment. Route denials to verification or user confirmation and budget for
  them: CaMeL''s released policies refused 41.5% of calls a task was entitled to make and let every required
  call through on only 37 of 92 tasks, and turning policies on cut banking utility from 66.7% to 37.5%
  (GPT-5.2). 5. If agents call agents, pass tool-derived values to the child agent through a separate
  data channel, never inside its instruction text: with CaMeL in every agent, 0.2% of attacks still got
  through (0.5% for GPT-4.1, from 36.1%), all by that route, and the separate channel took it to 0.0%.
  6. Deploy the whole-task form on strong models and on tasks the request fully specifies: clean utility
  was 26.3 to 52.6% against 63.2 to 89.5% undefended across five smaller models, but 77.3% against 84.5%
  for o3 and 82.1% against 87.5% for GPT-5.5 (no policies). If that loss is too high, a cheaper argument-provenance
  or policy defense kept 59.6 to 63.2% clean utility at 4.4 to 7.7% adaptive attack success on GPT-4o-mini,
  where CaMeL kept 26.3% at 0.0%. For GUI or other long interactive tasks, write a small program for each
  step instead of one for the whole task, fixing its queries to untrusted content and how each answer
  may be used, over a screen whose untrusted regions are masked, and locate click targets on the masked
  screen: on 400 WebArena tasks with Claude Opus 5, GPT-5.6-Sol and Gemini 3.8 Flash this kept 53.55%
  against 55.12% undefended and 13.17% for a whole-task program with a GPT-5 planner (benign runs only),
  and a whole-task program''s quarantined locator, reading an attacker''s notice, returned another post''s
  downvote button in one demonstration. 7. Measure paired against the baseline, same model and suite:
  benign utility, utility under attack, attack success under static and adaptive attacks and the share
  of attacks that actually reach their injection point (only 20 of 48 did on AppWorld under CaMeL), tokens
  and latency per task (17.30 s against 4.98 s and 5,083 against 8,020 tokens with GPT-4o in one test;
  2.73x the input and 2.82x the output tokens for the median task with Claude 3.5 Sonnet in the authors''
  test; 2.31x the tokens on AppWorld; a per-step GUI program 10.3% more tokens than the undefended agent
  and about 3x its time), the share of tasks with a policy denial and the excess privilege left open;
  in production, monitor denials, retries, failed value verifications and tasks the program could not
  express.'
detect:
  static: The privileged model sees only the request, trusted context and tool descriptions with return
    schemas, and writes the task as a program; a custom interpreter labels every value with its sources
    and readers and propagates labels through operations, string formatting and control flow, including
    untaken branches; untrusted content is parsed only by a model with no tools and a typed output; each
    side-effecting tool has a policy on argument sources and readers; repair retries and error messages
    stay inside the checked boundary.
  traces: Policy denials and user confirmations per task; privileged-model retries per task; no executed
    call whose arguments carry untrusted labels unless a policy allows it; no tool-derived text in another
    agent's instruction.
  evals: Static and adaptive injection suites (AgentDojo with per-tool policies, plus data-dependent tasks
    and realistic suites converted from utility benchmarks such as AppWorld or Terminal-Bench, or WebArena
    for GUI agents); benign utility and utility under attack; the share of attacks that reach their injection
    point; tokens and latency per task; share of tasks with a policy denial; excess privilege left open.
  probes:
    what: Injected data that tries to add a call, set a write argument, substitute a lookalike value of
      the expected type, misdirect a click target, leak a private value through a branch or a retry, or
      cross an agent boundary inside instruction text.
    construct: Tool outputs and documents with instructions; values the quarantined model will parse into
      recipients or amounts; lookalike senders, handles or links of the expected type; on-screen notices
      that supply false coordinates; error messages carrying instructions; secret-dependent assignments
      on branches that are not taken; untrusted values interpolated into strings; a parent agent that
      writes tool output into a child agent's instruction. Success is no policy-violating call, no unverified
      value of untrusted origin used as an argument, and no secret-dependent public output.
  primary:
  - static
  - probes
impact:
  quality:
    effect: degrades
    size: large
    when: benign utility 77.3% against 84.5% for o3 but 41.2% against 73.2% for Gemini 2.5 Pro (Debenedetti,
      Mar 2025); 59.79% against 80.41% with GPT-4o (Ji, Nov 2025); 26.3 to 52.6% against 63.2 to 89.5%
      across five smaller models, the largest cost of ten defenses on four (Ma, Jun 2026); 64.9% against
      86.6% with Sonnet-5, 73.2% against 77.3% with Haiku-4.5 (Sharma, Sep 2026); policies on 37.5% against
      66.7% off (GPT-5.2, banking) (Garby, Feb 2026); without policies 82.1% against 87.5% for GPT-5.5
      and 20.5% against 64.3% for Gemini 2.5 Flash-Lite (Peters-Gill, Oct 2026); outside AgentDojo, without
      policies, 33.7% against 82.5% on AppWorld and 0.0% against 82.2% on Terminal-Bench (DeepSeek-v4-flash)
      (Wang, Nov 2026); whole-task computer-use programs 13.17% against 55.12% on WebArena (GPT-5 planner,
      frontier query models), where a per-step program on the frontier models kept 53.55% (Choudhary,
      Oct 2026), and 18.5% and 27.7% against 95.4% and 98.5% on interleaved-injection tasks, 8.3% against
      58.3% on benign OSWorld tasks (Seip, Oct 2026). Tasks whose actions come from the data cannot be
      expressed.
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: median task 2.73x the input and 2.82x the output tokens, mean 7.24x and 6.23x, against native
      tool calling (Claude 3.5 Sonnet); a cheaper quarantined model cut cost about 12% for about 1% utility
      (Debenedetti, Mar 2025); 5,083 against 8,020 tokens per task with GPT-4o (Ji, Nov 2025); 2.31x and
      2.28x the tokens on AppWorld and Terminal-Bench (Wang, Nov 2026); a whole-task computer-use program
      used 0.2x the tokens of the undefended agent while completing few tasks, and an endorsement design
      7.5x uncached and 4.2x with caching (Seip, Oct 2026); a per-step GUI program 4.14x10^5 tokens per
      WebArena task against 1.82x10^5 for a whole-task program, 10.3% more than the undefended agent (Choudhary,
      Oct 2026)
    basis: evidence
  performance:
    effect: degrades
    size: large
    when: 17.30 s against 4.98 s per task with GPT-4o, the slowest of the GPT-4o defenses tested (Ji,
      Nov 2025); 426.3 s per WebArena task for a per-step computer-use program, about 3x the undefended
      agent, and 408 s for a whole-task program (Choudhary, Oct 2026); the authors attribute the overhead
      to model calls and code-repair retries, not the interpreter (Debenedetti, Mar 2025)
    basis: evidence
  security:
    effect: improves
    size: large
    when: '0 of 949 attacks succeeded with policies for o3 and Gemini 2.5 Pro, against 11 and 163 undefended
      (Debenedetti, Mar 2025); at most 1.8% under static and adaptive attacks across five models, against
      up to 58.6% undefended (Ma, Jun 2026); 1.21% against 15.62% on AgentDojo and 7.15% against 31.04%
      on ASB, and an attack reusing the task''s tools doubled it (0.95% to 1.90%) (Ji, Nov 2025); 0% on
      three computer-use suites where the undefended agent reached up to 46.2%, relying on masking untrusted
      screen regions, with underspecified prompts run in a more specific variant (Seip, Oct 2026); 0 of
      20 optimized attacks that reached their injection point on AppWorld, with most never reaching it
      (Wang, Nov 2026); the undefended baseline is not safe against adaptive attackers: an agentic attacker
      swarm broke Gemini 4 Argon in 34% of the authors'' own 100 synthetic scenarios with harmless off-task
      goals and out-of-model defenses off, and Gemini 3.8 Flash in 90% (Kurakin, Nov 2026). Leaks where tracking stops: error messages (Ji, Nov 2025), untaken branches and the retry
      loop (Garby, Feb 2026), tool output written into another agent''s instructions (0.2%, 0.0% with
      a separate data channel) (Peters-Gill, Oct 2026), a quarantined screen locator misdirected by an
      attacker''s notice (one demonstration) (Choudhary, Oct 2026); 16 of 609 attack sinks left open against
      1 for an argument-exact oracle (Sharma, Sep 2026)'
    basis: evidence
  governance:
    effect: improves
    size: medium
    when: 'the program, per-value labels and per-tool policies are a reviewable record of what may flow
      where; it left less excess privilege open than a tool allowlist (0.0895 against 0.3551) but about
      45 times an argument-exact oracle (0.0020), partly by refusing entitled calls (Sharma, Sep 2026);
      its guarantee is not formally verified: the label rules live in its Python interpreter, which missed
      an implicit flow (Garby, Feb 2026)'
    basis: evidence
  brand:
    effect: none
    basis: assessment
  primary:
  - security
  - quality
measure:
- method: experiment
  tier: 4
  how: 'paired runs, CaMeL-style program and interpreter against the current tool loop and a cheaper argument-provenance
    or policy check, same model, on AgentDojo with per-tool policies plus data-dependent tasks (AgentDyn-style)
    and realistic suites converted from utility benchmarks or your own tasks (MetaPI-style AppWorld or
    Terminal-Bench; WebArena or OSWorld for GUI agents): benign utility, utility under attack, attack
    success under the static attack, an adaptive black-box optimizer (AutoDojo-style) and an agentic attacker
    that adapts per scenario, the share of attacks that reach their injection point, tokens and latency
    per task, the share of tasks with a policy denial, and excess privilege left open (Ajar-style candidate
    calls); add probes for error-message injection, secret-dependent assignments on untaken branches,
    string interpolation of untrusted values, lookalike values of the expected type, on-screen notices
    that misdirect a click target and, in multi-agent systems, tool output written into a child agent''s
    instructions'
- method: monitor
  how: policy denials and user confirmations per task, privileged-model retries per task and error messages
    that contain tool-derived text, tasks abandoned because the program could not express them, values
    that failed verification against a trusted source, quarantined-model not-enough-information errors,
    and values that cross agent boundaries inside instruction text
