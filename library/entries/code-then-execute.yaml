caveats: 'The guarantee holds only where labels are tracked and policies are written: an audit found leaks
  through untaken branches, the retry loop and string interpolation (Garby, Feb 2026), an error message
  carried an injection into the privileged model (Ji, Nov 2025), tool output written into another agent''s
  instructions got through (Peters-Gill, Oct 2026), an attacker''s notice misdirected a quarantined screen
  locator in one demonstration (Choudhary, Oct 2026), and untrusted data can still choose among the program''s
  branches. Several tests ran CaMeL without its policies (Ji, Nov 2025; Peters-Gill, Oct 2026; Wang, Nov
  2026) or on one 16-task suite with wide intervals (Garby, Feb 2026), the strongest utility figure (77.3%
  for o3) is the authors'' own, and the independent tests that left AgentDojo found the largest losses
  (33.7% on AppWorld and 0% on Terminal-Bench in single runs on one model, with most attacks never reaching
  their injection point; 13.17% for whole-task programs on WebArena). The designs that recover utility
  are their authors'' own: the per-step program was run without attacks, and value verification trusts
  some sites that host user content and still kept only 30.6 to 50.5% of benign tasks. Frontier models
  resist static template attacks undefended (0.3% for Claude-Haiku-4.5, 0.0% for GPT-5.5, 0 of 10 hard
  computer-use attacks for Claude Opus 5 with its API''s built-in classifiers), but an agentic attacker
  swarm still broke Gemini 4 Argon in 34% of the authors'' own synthetic scenarios with harmless off-task
  goals and out-of-model defenses off (Kurakin, Nov 2026), so the case rests
  on adaptive attackers and on a hard block on exfiltration.'
