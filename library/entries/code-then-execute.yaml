summary: 'Have a privileged model turn the trusted request into a small program before any untrusted data
  is read, then run it in an interpreter that labels every value with where it came from and checks a
  per-tool policy before each call, so injected text can neither add actions nor send private data to
  the wrong place. Attack success stayed at or below 1.8% across five models even under an adaptive attack
  (up to 58.6% undefended), but it was the costliest defense in utility: 26.3 to 52.6% of clean tasks
  solved against 63.2 to 89.5% undefended in one independent test, a gap that narrowed to 5.4 to 7.2 points
  only with frontier models (GPT-5.5, o3). Use it where the request alone fixes the actions and a hard
  block on exfiltration is worth lost tasks and about 3.5x the latency; the guarantee holds only where
  label tracking reaches, and retries, error messages, untaken branches and agent-to-agent messages have
  all been shown to leak.'
how: '1. Start from the baseline: your current tool loop (7.d.iii) and a cheaper check on where write
  arguments came from (argument provenance or per-task policies), same model, on an injection suite with
  static and adaptive attacks; frontier models already resist template attacks undefended (0.3% for Claude-Haiku-4.5,
  0.0% for GPT-5.5), so static numbers alone overstate the gain. Sort tasks by whether the request alone
  fixes the actions: a program written before reading data cannot do "the actions specified in the email"
  (no model solved it), so contain those inputs (10.c.i) and gate the action (10.b.i) instead. 2. Give
  the privileged model only the request, trusted context and tool descriptions with full return schemas,
  and have it write the whole task as a program in a restricted Python subset: undocumented tool outputs
  caused 13 of Claude 3.5 Sonnet''s 15 Travel failures, and a follow-up had to add return schemas to every
  tool to reach usable utility. Parse untrusted content only through a quarantined model call with no
  tools and a typed output schema; it can be a cheaper model (Claude 3.5 Haiku under Claude 4 Sonnet cost
  about 1% utility for about 12% lower cost per median task) (1.b.i). 3. Run the program in a custom interpreter
  that attaches sources and allowed readers to every value and propagates them through every operation,
  string formatting and control flow, including assignments on branches not taken: an independent audit
  found CaMeL''s interpreter dropped labels in both places. Keep repair retries inside the checked boundary:
  never return raw error text derived from tool output to the privileged model (an error message put an
  attacker''s reserve_hotel call into the rewritten program in one test), and cap retries, since each
  blocked-or-allowed retry leaks a bit. 4. Write a policy for each side-effecting tool on where every
  argument may come from and who may read what is sent (for example, send_money''s recipient and amount
  only from the user). Without policies, a recipient the quarantined model parsed from a landlord''s notice
  was used for a scheduled payment. Route denials to user confirmation and budget for them: CaMeL''s released
  policies refused 41.5% of calls a task was entitled to make and let every required call through on only
  37 of 92 tasks, and turning policies on cut banking utility from 66.7% to 37.5% (GPT-5.2). 5. If agents
  call agents, pass tool-derived values to the child agent through a separate data channel, never inside
  its instruction text: with CaMeL in every agent, 0.2% of attacks still got through (0.5% for GPT-4.1,
  from 36.1%), all by that route, and the separate channel took it to 0.0%. 6. Deploy it on strong models
  and on tasks the request fully specifies: clean utility was 26.3 to 52.6% against 63.2 to 89.5% undefended
  across five smaller models, but 77.3% against 84.5% for o3 and 82.1% against 87.5% for GPT-5.5 (no policies).
  If that loss is too high, a cheaper argument-provenance or policy defense kept 59.6 to 63.2% clean utility
  at 4.4 to 7.7% adaptive attack success on GPT-4o-mini, where CaMeL kept 26.3% at 0.0%. 7. Measure paired
  against the baseline, same model and suite: benign utility, utility under attack, attack success under
  static and adaptive attacks, tokens and latency per task (17.30 s against 4.98 s and 5,083 against 8,020
  tokens with GPT-4o in one test; 2.73x the input and 2.82x the output tokens for the median task with
  Claude 3.5 Sonnet in the authors'' test), the share of tasks with a policy denial and the excess privilege
  left open; in production, monitor denials, retries and tasks the program could not express.'
detect:
  static: The privileged model sees only the request, trusted context and tool descriptions with return
    schemas, and writes the task as a program; a custom interpreter labels every value with its sources
    and readers and propagates labels through operations, string formatting and control flow, including
    untaken branches; untrusted content is parsed only by a model with no tools and a typed output; each
    side-effecting tool has a policy on argument sources and readers; repair retries and error messages
    stay inside the checked boundary.
  traces: Policy denials and user confirmations per task; privileged-model retries per task; no executed
    call whose arguments carry untrusted labels unless a policy allows it; no tool-derived text in another
    agent's instruction.
  evals: Static and adaptive injection suites (AgentDojo with per-tool policies, plus data-dependent tasks);
    benign utility and utility under attack; tokens and latency per task; share of tasks with a policy
    denial; excess privilege left open.
  probes:
    what: Injected data that tries to add a call, set a write argument, leak a private value through a
      branch or a retry, or cross an agent boundary inside instruction text.
    construct: Tool outputs and documents with instructions; values the quarantined model will parse into
      recipients or amounts; error messages carrying instructions; secret-dependent assignments on branches
      that are not taken; untrusted values interpolated into strings; a parent agent that writes tool
      output into a child agent's instruction. Success is no policy-violating call and no secret-dependent
      public output.
  primary:
  - static
  - probes
