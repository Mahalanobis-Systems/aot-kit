    basis: evidence
  performance:
    effect: degrades
    size: large
    when: 17.30 s against 4.98 s per task with GPT-4o, the slowest of the GPT-4o defenses tested (Ji,
      Nov 2025); the authors attribute the overhead to model calls and code-repair retries, not the interpreter
