caveats: 'The guarantee holds only where labels are tracked and policies are written: an audit found leaks
  through untaken branches, the retry loop and string interpolation (Garby, Feb 2026), an error message
  carried an injection into the privileged model (Ji, Nov 2025), tool output written into another agent''s
  instructions got through (Peters-Gill, Oct 2026), and untrusted data can still choose among the program''s
  branches. Several tests ran CaMeL without its policies (Ji, Nov 2025; Peters-Gill, Oct 2026) or on one
  16-task suite with wide intervals (Garby, Feb 2026), the strongest utility figure (77.3% for o3) is
  the authors'' own, and the independent test that kept the policies found the largest utility cost of
  ten defenses on four of five models (Ma, Jun 2026). Tasks whose actions come from the data cannot be
  expressed at all, and frontier models already resist static template attacks undefended (0.3% for Claude-Haiku-4.5,
  0.0% for GPT-5.5), so the case rests on adaptive attackers and on a hard block on exfiltration.'
