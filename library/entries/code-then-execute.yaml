      Feb 2026), tool output written into another agent''s instructions (0.2%, 0.0% with a separate data
      channel) (Peters-Gill, Oct 2026); 16 of 609 attack sinks left open against 1 for an argument-exact
      oracle (Sharma, Sep 2026)'
    basis: evidence
  governance:
    effect: improves
    size: medium
    when: 'the program, per-value labels and per-tool policies are a reviewable record of what may flow
      where; it left less excess privilege open than a tool allowlist (0.0895 against 0.3551) but about
      45 times an argument-exact oracle (0.0020), partly by refusing entitled calls (Sharma, Sep 2026);
      its guarantee is not formally verified: the label rules live in its Python interpreter, which missed
      an implicit flow (Garby, Feb 2026)'
    basis: evidence
  brand:
    effect: none
    basis: assessment
