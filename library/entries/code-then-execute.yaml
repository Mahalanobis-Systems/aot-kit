    basis: evidence
  security:
    effect: improves
    size: large
    when: '0 of 949 attacks succeeded with policies for o3 and Gemini 2.5 Pro, against 11 and 163 undefended
      (Debenedetti, Mar 2025); at most 1.8% under static and adaptive attacks across five models, against
      up to 58.6% undefended (Ma, Jun 2026); 1.21% against 15.62% on AgentDojo and 7.15% against 31.04%
