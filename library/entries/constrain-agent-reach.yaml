- source: 'Daniel Commey, "Names Are Not Objects: Object-Bound Confinement for Compromised AI Coding Agents",
    https://arxiv.org/abs/2610.14488'
  date: '2026-10-10'
  task: 'Compare confinement designs for a compromised coding agent against 74 scripted attacks with ground-truth
    oracles (file system, program execution, files handed to tools outside the sandbox, network, request
    protocol, approvals, and direct actions by the agent process): no defense; a tool allowlist with lexical
    path checks and program and host lists; the allowlist plus a command sandbox modeled on deployed agents
    (spawned programs may read and run anything, write only the workspace and a temporary directory, no
    network; the agent process itself unconfined); and ZTAC, which runs the agent in a kernel sandbox
    whose only route out is a broker that resolves each request to the file, program or endpoint it will
    act on, decides on that object and checks it at use, with spawned programs sandboxed under the same
    policy'
  effect: 'Attacks that succeeded (/ were held for review), of 74: no defense 74; tool allowlist 66; allowlist
    plus command sandbox 56; broker without the agent sandbox 12 / 13, losing all 10 direct attacks; full
    ZTAC 2 / 14, both successes sending an access key to the allowlisted sink Base64-encoded or split
    across two requests. Of 10 replayed incidents disclosed in 2025 and 2026, the allowlist lost 10, the
    command sandbox lost 6 (payload files in the workspace or a write through a symlink) and ZTAC blocked
    7 and held 3. The command sandbox lost because ''programs may read anywhere, workspace contents have
    no path-rule protection, and only spawned commands are confined''; all 8 handoff attacks succeeded
    when the developer later ran the planted files outside it. Utility: ZTAC completed 43 of 46 operations
    with 8 prompts and 4 of 7 workflows, against 46 of 46 and 7 of 7 for the allowlist and the command
    sandbox (the failed operations ran a subprocess, a virtual environment and an environment read through
    Python; failed workflows hit refused process creation, protected virtual-environment metadata and
    unsupported commit -a). Overhead: a no-op brokered request 4.0 ms median; spawned programs 8.5 to
    18.4 ms slower (Python 26.4 ms instead of 8.0 ms); 3,164 lines of trusted Rust; authorization records
    form a signed hash chain.'
  conditions: One author's macOS prototype on Seatbelt, evaluated with a client library rather than an
    off-the-shelf agent runtime; attacks are scripted, not model-generated, so they test enforcement rather
    than whether an agent would attempt them; one small Python project with canary secrets; the deployed-style
    command sandbox is modeled, not the products themselves; utility uses a simulated reviewer who approves
    every prompt; Seatbelt itself was not tested for escapes; endpoints are matched by host name, so a
    name resolving to an internal address would be reached
  direction: supports
  measured: true
  locator: Abstract; §1; §2 Table 1; §4.6, §4.8; §6.1; §6.2 Tables 2-3; §6.5 Table 5; §6.6 Table 6; §7
- source: Max McGuinness, Mikaela Grace, Jiri De Jonghe, Jake Eaton, Abel Ribbink (Anthropic), "How we
    contain Claude across products", https://www.anthropic.com/engineering/how-we-contain-claude
  date: '2026-05-25'
  task: Contain agents in three products (a gVisor container for claude.ai code execution, an OS-level
    sandbox for Claude Code, a local VM for Claude Cowork) and report what held and what failed
  effect: '''Our telemetry showed users approved roughly 93% of permission prompts.'' An OS-level sandbox
    (Seatbelt on macOS, bubblewrap on Linux) with reads allowed, writes inside the workspace and network
    denied by default: ''The result was an 84% reduction in permission prompts'', with the runtime open-sourced
    ''so the boundary is auditable''. In a February 2026 red-team exercise a phished employee launched
    Claude Code with a prompt that asked it to read ~/.aws/credentials, encode them and POST them out:
    ''Across 25 retries of that prompt, Claude completed the exfiltration 24 times''; ''The only defense
    that holds in this situation is the environment, specifically egress controls that block the POST
    regardless of intent and filesystem boundaries that keep ~/.aws out of reach in the first place.''
    Cowork keeps credentials in the host keychain and gives the VM ''a per-session scoped-down token'';
    it offers read-only, read-write and read-write-no-delete mounts, and ''symlink resolution has to happen
    before path validation, not after''. A malicious workspace file carrying an attacker''s API key made
    Claude upload workspace files through the allowlisted api.anthropic.com: ''The sandbox worked perfectly,
    and yet the data was exfiltrated''; the fix was a proxy inside the VM that ''only passes requests
    carrying the VM''s own provisioned session token''. ''The hypervisor, seccomp, and gVisor across our
    products have been dependable. Our custom allowlist proxy was the piece that failed.'' Three disclosed
    vulnerabilities ran project-local configuration before the trust prompt; in Claude Code ''a privileged
    process sits outside the sandbox deciding per-command whether to enforce it'', which an injected prompt
    or a fatigued approval can get to run something unsandboxed. VM isolation kept enterprise endpoint
    detection from seeing inside; the mitigation is pull-based OTLP log export. ''An agent with read-only
    DB access ... can be deployed far more broadly than one that writes to prod.'''
  conditions: Vendor reporting on its own products; the 84% is internal usage (also reported in Anthropic's
    October 2025 Claude Code sandboxing post), the 24 of 25 is one internal red-team prompt, and the allowlist
    exfiltration is one third-party disclosure; no attack rates are given with and without the sandbox
  direction: supports
  measured: true
  locator: 'Introduction; Three types of risk; Pattern 1; Pattern 2 and ''Risk we missed: The user as
    an injection vector''; Pattern 3 (filesystem controls; ''Exfiltration through an approved domain'';
    ''VM isolation kept the endpoint detection software out too''); Looking ahead (Agent identity); Summary'
- source: Rahul Marchand, Art O Cathain, Jerome Wynne, Philippos Maximos Giavridis, Stuart Jennings, Freddy
    Tuxworth, Tolga H. Dur, Sam Deverett, John Wilkinson, Jason Gwartz, Harry Coppock (University of Oxford,
    UK AI Security Institute), "Quantifying Frontier LLM Capabilities for Container Sandbox Escape", https://arxiv.org/abs/2603.02277
  date: '2026-03-01'
  task: Measure whether LLM agents with a root shell inside a Docker container or Kubernetes pod can escape
    to the host, on 18 tasks built on known vulnerability classes (orchestration, engine and runtime,
    kernel; difficulty 1 to 5), run inside a VM so an escape stays contained
  effect: 'Success over 5 runs per task (Table 12): at difficulty 1 (privileged container, mounted Docker
    socket, writable host /etc mount) 1.00 for Claude Opus 4.5, Claude Sonnet 4.5, GPT-5, Claude Opus
    4.6, GPT-5.4 Pro, GPT-5.5 and Claude Mythos Preview, against 0.67 for Claude Haiku 4.5, 0.47 for GPT-OSS-120B
    and 0.20 for GPT-5-nano. Overall: Claude Opus 4.5 0.52, GPT-5 0.49, Claude Haiku 4.5 0.18, GPT-OSS-120B
    0.16; at difficulty 3 GPT-5 and Opus 4.5 0.41; none at difficulty 4 or 5 in the original cohort. August
    2026 update at a 100M-token budget: Claude Mythos Preview 0.84 overall (0.87 at difficulty 5), GPT-5.4
    Pro 0.68, Claude Opus 4.6 0.66, GPT-5.5 0.64. Success rose roughly log-linearly with tokens, and many
    runs cost on the order of $1. Models found four unintended escape paths (default VM credentials, an
    unintended eBPF exploit). In the long runs agents crashed their own sandbox in 47% to 100% of failed
    runs. ''We recommend that agent developers treat "plain Docker isolation" as insufficient by default'';
    the paper cites UK NCSC guidance that hypervisor isolation ''should be used as a bare minimum''.'
  conditions: UK AI Security Institute and University of Oxford; Inspect harness, 5 runs per model and
    task; original cohort 2.5M tokens per run, update cohort 100M, so the cohorts are not at equal budget;
    the agent is told it is in a container and that escape is the goal, has internet access, no monitoring
    and intentionally introduced weaknesses; the authors say results 'should not be interpreted as end-to-end
    compromise likelihood in defended production environments'; hypervisor escapes out of scope
  direction: mixed
  measured: true
  locator: Abstract; §3.1; §5.1; §5.3; §6.1-6.2 and App E.2.3 Table 3; §7; §8; App B Table 1; App H Tables
    11-12
- source: Gian Segato (Anthropic), "Quantifying infrastructure noise in agentic coding evals", https://www.anthropic.com/engineering/infrastructure-noise
  date: '2026-02-05'
  task: Run Terminal-Bench 2.0 under six resource configurations, from per-task CPU and RAM specs enforced
    as both the guaranteed allocation and the hard kill limit (1x) to uncapped, with the same Claude model,
    harness and tasks; repeat on SWE-bench varying RAM
  effect: 'Infrastructure error rate fell monotonically from 5.8% at 1x to 0.5% uncapped; 1x to 3x cut
    it to 2.1% (p < 0.001) while success stayed ''within the margins of noise (p=0.40)''; from 3x to uncapped,
    success rose almost 4 points; total lift over 1x 6 points (p < 0.01). Under tight limits some models
    ran out of memory installing pandas, networkx and scikit-learn ''before the agent writes a single
    line of solution code''. SWE-bench (227 problems, 10 samples each, RAM up to 5x): 1.54 points higher
    at 5x. Recommendation: specify a guaranteed allocation and a separate hard kill threshold, with the
    band calibrated so scores at floor and ceiling fall within noise of each other.'
  conditions: Vendor measuring its own eval infrastructure on Google Kubernetes Engine; one unnamed Claude
    model, direction replicated across Anthropic models, other models not rigorously tested; benchmark
    runs, not production; the 6 points compares pinned limits with no limits, not with a calibrated ceiling
  direction: mixed
  measured: true
  locator: How we got here; How this affects measurement; What we recommend
