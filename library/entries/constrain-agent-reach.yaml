# 10.a.i: Constrain what the agent can touch
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 10.a.i
legacy_id: T68
slug: constrain-agent-reach
name: Constrain what the agent can touch
kind: technique
status: card
tiers:
- tier: 2
  why: safety containment
levers:
- guardrails
domains:
- general
evidence_domains:
- code-generation
