caveats: 'The measured evidence is small and mostly comes from builders and vendors: the 74-attack comparison
  is one author''s scripted suite against his own system on one small Python project, with the deployed-style
  sandbox modeled rather than run, and the 84% prompt reduction and the 24-of-25 exfiltration are a vendor''s
  reports on its own products, with no attack rates with and without its sandbox. A boundary controls
  where data goes, not what it encodes: both attacks that beat full confinement sent an access key to
  an allowlisted host Base64-encoded or split in two, and a vendor''s sandbox let workspace files leave
  through its own allowlisted API under an attacker''s key. Container isolation erodes as models improve:
  seven frontier models escaped misconfigured containers in every run, and with a 100M-token budget Claude
  Mythos Preview escaped in 84% of runs across all 18 tasks, kernel and runtime exploits included, though
  the agents knew escape was the goal and no one was monitoring. Tight settings cost work: full confinement,
  which refuses process creation, finished 4 of 7 workflows, and memory limits pinned at a benchmark''s
  spec failed 5.8% of runs on one Claude model, with uncapped resources scoring 6 points higher.'
