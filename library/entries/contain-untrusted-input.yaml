summary: 'Treat everything the agent reads from tools, the web, repository files and skills as data, not
  instructions, and keep personal data out of the model''s context. Tokenize PII in the client, wrap untrusted
  results in source-labeled delimiters, scan context files, skills and tool outputs for injection, and
  state which source wins a conflict. These are cheap layers against opportunistic attacks, not a boundary:
  in one study an adaptive attacker reached 99% attack success against delimiter-based spotlighting on
  Gemini 2.5 Pro and 90 to 94% against three injection detectors, and in another none of 14 open-weight
  models reliably kept even two declared priority tiers in order. Choose a detector on your agent''s own
  tool outputs at a low false-positive rate (on AgentDojo, PIGuard, which caught 95.1% of injections on
  BIPIA, caught 2.1% at 1% false positives, while two agent-oriented detectors caught 73.8 and 82.2%),
  scan repository docs first (GPT-5.4 followed an injection in a README or TODO file 2.6 times as often
  as in code or data files), and put consequential actions behind containment that does not depend on
  spotting the attack (6.c.i, 6.c.ii, 10.a.i).'
how: '1. Start from a baseline: list every place personal data and untrusted text enter the context (tool
  and MCP results, web pages, email, repository docs such as README and TODO files, context files such
  as AGENTS.md, skills, tool descriptions, memory), then measure the current agent: plant a canary instruction
  at the start, middle and end of each surface and record attack success, how failed attacks fail, and
  task success with and without the attack. Weight the surfaces by risk: in one study with a fixed payload,
  GPT-5.4 followed it in 86% of runs that read it from a README against 19% from a code file (reconnaissance
  goal), 2.6 times as often on average in README or TODO files as in code or data files, and placing it
  at the end of the content was most effective in all three domains tested. Do not read a low attack rate
  as refusal: 66.8% of GPT-5.4''s and 81.3% of GPT-4o''s failed injections were ignored, not flagged.
  2. Keep sensitive data out of the model: tokenize PII in the client or MCP layer so the model handles
  placeholders while real values flow from tool to tool (Anthropic''s design, unmeasured), and drop untrusted
  segments from the context once the step that needed them is done. 3. Mark untrusted content: wrap tool,
  web and repository-derived text in delimiters that name its source, and defang lookalike closing tags
  inside it (as the Hermes and OpenHands harnesses do). Expect little from this alone: in one AgentDojo
  study, spotlighting moved static attack success from 30% to 28% on Gemini 2.5 Pro and from 35% to 28%
  on Llama 3.3 70B; utility held on Gemini 2.5 Pro (74.23% to 75.26%) but fell from 56.70% to 39.18% on
  Llama 3.3 70B, so measure utility on your model. 4. State a precedence order (operator policy, then
  user, then repository configuration, with tool and external content as data), then test where it holds
  on your model instead of assuming the system message protects it. In one study of 14 open-weight models,
  the data ruled out that any model kept even two declared priority tiers in order in 95% of replies;
  the first of two conflicting lines in one message won 72.42 to 94.66% of decided replies; and in tool
  and file-write tasks a policy sent first in the system message won less often than the same text sent
  first as a labeled user message in every model-mode, by 6.41 to 48.75 points. Probe conflicts across
  messages and placements (sending the policy after the competing line raised its wins by 19.79 to 48.22
  points on Qwen 3, though recency also favors injected lines), and log dropped instructions in the harness:
  at most 2.92% of replies mentioned the conflict. 5. Scan context files, skills and tool outputs, and
  block or quarantine on a match (Hermes blocks a matching context file wholesale and tiers skills as
  builtin, trusted or community). Choose the detector on your own data, not its published scores: replay
  the agent''s benign tool outputs to count false positives as blocked tasks, and measure detection at
  a fixed 1% false-positive rate on injected copies. On AgentDojo tool outputs, two agent-oriented detectors
  caught 73.8 and 82.2% of injections at 1% false positives and Prompt Guard 2 caught 60.9 to 69.4%, while
  PIGuard, which caught 95.1% on BIPIA, caught 2.1%; ProtectAI v2 and PIGuard flagged 30.1% and 29.5%
  of benign tool outputs, enough to stop 69.1% and 59.8% of tasks. Strip markup before scanning (PIGuard''s
  false positives on README chunks fell from 24.6% to 5.6%). 6. Assume an adaptive attacker gets through
  these layers, and contain the consequences with controls that do not depend on recognizing the injection
  (6.c.i, 6.c.ii, 10.a.i, 10.b.i). In one study, a search attack of up to 800 queries reached 99% attack
  success against spotlighting and 95% against prompt sandwiching on Gemini 2.5 Pro, 90 to 94% against
  the Protect AI, PromptGuard and Model Armor detectors and 71% against PIGuard, and 96% against the trained
  MetaSecAlign 70B (5% under the static attack); GPT-5 Mini held best (47% with spotlighting). 7. Measure
  with paired runs on the same tasks, each layer on and off: attack success under static and adaptive
  attacks (an attacker that sees the defense and gets a few hundred queries; most searches in that study
  plateaued after 100 to 200), utility with and without attack, episodes that stayed safe but left the
  user''s task undone, detector false positives on the agent''s own tool outputs and detection at 1% false
  positives, added latency per screened output, and sensitive fields found in model inputs and logs.'
detect:
  static: PII or untrusted content passed to the model unmarked; context files, skills or tool outputs
    loaded without an injection scan; a detector chosen by its public benchmark score; no instruction-precedence
    statement, or one never tested for where it holds
  traces: sensitive fields in model inputs or logs; injected instructions followed; benign tool outputs
    blocked by a detector; failure rows labeled indirect-prompt-injection
  evals: injection attack success under static and adaptive attacks, with utility with and without attack;
    detector false-positive rate on the agent's own tool outputs and detection at 1% false positives;
    data-leak safety evals
  probes:
    what: whether injected instructions in untrusted surfaces are followed, and whether the declared precedence
      holds
    construct: plant a canary instruction at the start, middle and end of each surface the agent reads
      (README, TODO and context files first, then tool results, web pages and skills), and pairs of conflicting
      benign instructions across operator, user and tool seats; success is the canary never executing
      and the higher-precedence line winning
impact:
  quality:
    effect: mixed
    size: medium
    when: 'delimiters left AgentDojo utility unchanged on Gemini 2.5 Pro (74.23% to 75.26%) and GPT-5
      Mini (72.16% to 76.29%) but cut it from 56.70% to 39.18% on Llama 3.3 70B, and with Gemini 2.5 Pro
      utility fell to 39.18% under the Protect AI or PIGuard detector (Nasr, Oct 2025); detectors that
      over-flag stop tasks: ProtectAI v2 and PIGuard flagged about 30% of benign tool outputs, stopping
      69.1% and 59.8% of tasks, while Prompt Guard 2 flagged 0.0 to 0.6% (Liu, Oct 2026)'
    basis: evidence
  cost:
    effect: degrades
    size: small
    when: a detector call per screened output (68M to 1.5B parameters, or a 7 to 8B judge, in one study
      (Liu, Oct 2026)) and delimiter tokens on every untrusted result; tokenizing PII and purging used
      segments can shrink the context; no source priced any of it
    basis: assessment
  performance:
    effect: degrades
    size: small
    when: one classifier or judge pass per screened tool output before the agent can act on it; no source
      timed it
    basis: assessment
  security:
    effect: improves
    size: small
    when: 'against static attacks only: spotlighting cut AgentDojo attack success from 30% to 28% (Gemini
      2.5 Pro) and 35% to 28% (Llama 3.3 70B), and an adaptive search raised it to 99% on both (Nasr,
      Oct 2025); the best detectors caught 73.8 to 82.2% of static AgentDojo injections at 1% false positives
      (Liu, Oct 2026), but adaptive attacks reached 71 to 94% against four detectors with Gemini 2.5 Pro
      (Nasr, Oct 2025); declared precedence is not followed reliably (no open model kept two tiers in
      order in 95% of replies; Laddha, Oct 2026); PII tokenization is unmeasured'
    basis: evidence
  governance:
    effect: improves
    size: medium
    when: keeps personal data out of model inputs and logs when values flow tool to tool through the client
      (Anthropic, Nov 2025, unmeasured); models mentioned an instruction conflict in at most 2.92% of
      replies (Laddha, Oct 2026), so the audit trail of what was dropped or flagged must come from the
      harness
    basis: assessment
  brand:
    effect: unknown
  primary:
  - security
  - governance
measure:
- method: experiment
  tier: 2
  how: 'paired runs on the same tasks with each layer (PII tokenization, delimiters, the precedence statement
    and its placement, the detector) on and off: attack success under static and adaptive attacks, with
    canaries at the start, middle and end of each untrusted surface (repository docs first); utility with
    and without attack; episodes safe but with the user''s task undone; the detector''s false-positive
    rate on the agent''s own benign tool outputs (as blocked tasks) and its detection at 1% false positives;
    added latency per screened output; sensitive fields in model inputs and logs'
- method: monitor
  how: 'in production traces: detector flag rate on tool outputs and tasks stopped by a flag (sample flagged
    outputs for review), canary or known-payload hits, actions taken after reading flagged content, sensitive
    fields in model inputs and logs, and conflicts in which a lower-precedence instruction won'
