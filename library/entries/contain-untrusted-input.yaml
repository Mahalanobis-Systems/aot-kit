caveats: 'No source tests these practices together, and PII tokenization has no measured leak or utility
  result. The measured numbers come from benchmarks with synthetic tool outputs and mostly static attacks,
  so detection rates are upper bounds and detector rankings barely transferred between benchmarks (Kendall
  tau 0.01 to 0.31); in one study adaptive attacks exceeded 80% on most pairs of model and defense, GPT-5
  Mini holding best at 47 to 81%. The precedence results come from 14 open-weight models on short benign
  conflicts, not hosted frontier models or adversarial payloads, and the placement result from one fixed
  payload, mainly with GPT-5.4, counted only when the payload was read. Defenses also cost utility: detectors
  that over-flag stop most tasks, and spotlighting cut Llama 3.3 70B''s AgentDojo utility from 56.70%
  to 39.18%.'
