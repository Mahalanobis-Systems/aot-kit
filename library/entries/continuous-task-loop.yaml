    and 0.17 regression events per run; the four runs "are not a model controlled causal comparison".
    Regression rate over previously passing obligations 7.11% for Claude Code and 4.83% for Codex; agents
    wrote far fewer tests than the native suites. Mean billed tokens per task with continuation: 6.91M
    (Opus 4.7), 8.36M (GPT-5.5).'
  conditions: Twelve models across three vendor loops, eight models in Claude Code and six loops on GPT-5.4;
