caveats: 'No study compares a plain fresh-process loop with one long session, or an operator re-prompting,
  on the same backlog, model and budget: the largest account is one build judged by its author on the
  vendor''s own model, and the one controlled comparison is an automated-research harness whose gain mixes
  fresh contexts with planner-assigned work and harness summaries, with three runs on one task and one
  run elsewhere. Fresh contexts do not stop drift: across fresh-container iterations code erosion rose
  in 77% of agent trajectories (against 53% of human repositories) and quality prompts lowered the level
  but not the rate, on a benchmark with a two-hour limit per run. The vendor''s own plugin loops inside
  one session rather than restarting, and no source measures that design against a fresh process. What
  the loop can finish depends on the model: earlier Opus 4 models "were barely capable of producing a
  functional compiler" and Opus 4.5 could not compile real large projects.'
