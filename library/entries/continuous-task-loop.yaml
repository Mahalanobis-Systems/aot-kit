caveats: 'Still no study runs the plain fresh-process loop against one long session with compaction on
  the same backlog at matched tokens: the benchmark that adds fresh continuation rounds reports tokens
  only with them, its four-loop comparison (Ralph loop lowest at 7.84%) is not controlled for model, and
  the matched-budget persistent-versus-reset study uses separate 30-minute research tasks with one run
  pair per agent. The in-session design''s measured gain is small and unstable: restating the goal raised
  full-task success from 27.50% to 31.25% in the current version of one benchmark but matched no control
  (18.52%) in its first version, both with one open worker model. Fresh contexts and durable notes do
  not stop drift or repeats: erosion rose in 77% of agent trajectories, regressions appeared under every
  loop design tested, and a production loop re-tested a failed setting at least six times despite a note
  forbidding it. The largest builds are single runs judged by their authors, and what a loop can finish
  depends on the model: earlier Opus 4 models "were barely capable of producing a functional compiler".'
