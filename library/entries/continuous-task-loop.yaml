- source: Geoffrey Huntley, "Ralph Wiggum as a “software engineer”", https://ghuntley.com/ralph/
  date: '2025-07-14'
  task: 'Introduces "Ralph": run a coding agent in an endless loop over the same prompt file'
  effect: '"In its purest form, Ralph is a Bash loop. while :; do cat PROMPT.md | claude-code ; done".
    Says it has defects that are "identifiable and resolvable through various styles of prompts." Each
    loop loads the same plan and specifications, and "you need to ask Ralph to do one thing per loop.
    Only one thing", trusting it to choose "the most important thing"; "A common failure scenario for
    Ralph is when the LLM runs ripgrep and comes to the incorrect conclusion that the code has not been
    implemented", which shows up as "multiple implementations"; tests, type checkers and builds are the
    "back pressure" that rejects bad output. No numbers. A note added at the top of the page links a video
    "to learn why the claude code plugin isn''t it".'
  direction: supports
  measured: false
  locator: 'Opening section; first some fundamentals; one item per loop; don''t assume it''s not implemented;
    phase two: backpressure'
  conditions: One practitioner's account of his own projects (a new programming language built with the
    loop); no numbers or comparison
- source: 'Qizheng Zhang, Changxiu Ji, Isaac Sun, Yuetai Li, Shubhangi Upasani, Sherry Ruan, Boyuan Ma,
    Fenglu Hong, Vamsidhar Kamanuru, Yoonho Lee, Yuzhen Mao, Genghan Zhang, Rulin Shao, Qiuyang Mang,
    Andy Dimnaku, Changran Hu, Radha Poovendran, Kunle Olukotun (Stanford, CMU, University of Washington,
    SambaNova, UC Berkeley), "Stateless Language Agents: Scaling Long-Horizon Automated Research", https://arxiv.org/abs/2610.07625'
  date: '2026-10-06'
  task: 'Long unattended automated-research runs of up to 1B tokens in which no agent carries its conversation
    across invocations: the harness keeps candidates and scores, rebuilds a fresh role-specific context
    for every invocation, and a stateless Advisor assigns each next experiment to parallel Workers. Compared
    with EvoX (a fresh coding agent per generation), CORAL (each agent keeps one long-running session,
    resumed after every heartbeat, stall or restart) and SwarmResearch (a long-running coordinator; workers
    resume a parent''s conversation) under the same coding agents, models, evaluators and external token
    counter; ablations continue from shared checkpoints'
  effect: 'Best full-budget result on every task. Anthropic kernel task with Codex (three runs): 1112.0
    ± 8.9 cycles against 1275.7 ± 133.9 for the strongest baseline, whose final result it matched at 67.9M
    against 986.3M tokens (93.1% fewer); with Claude Code (one run) 84.4% fewer. FrontierSWE (four tasks,
    one run each): behind the strongest baseline on all four at 25% of the budget, ahead on all four at
    100%, +4.95 points on average. In one CORAL run the last improvement came at 231M tokens while spending
    continued to 1B; agents "repeatedly declare their candidates optimal and wait, despite prompts to
    continue and restarts", and 98% of the final 1,500 sessions made no tool calls. In a CORAL trace two
    agents built the same feature twice within 13 minutes, the second time despite a posted claim. Removing
    the Advisor''s assignments reduced progress in every checkpoint comparison; a full run without Worker
    context isolation ended at 1336 cycles, 224 worse. The Advisor used under 0.6% of tokens; 1 to 15
    Workers cut elapsed time 6.6 to 7.3x.'
  conditions: Codex CLI with GPT-5.5 and Claude Code with Claude Opus 4.8 at high reasoning effort, the
    same model for Advisor and Workers; FrontierSWE (4 tasks), Anthropic's VLIW SIMD kernel task, SOL-ExecBench
    (3), FrontierCS (1); three runs only for the kernel task with Codex, one run elsewhere; the authors'
    own framework; the baselines differ in more than session reuse, so the gain is not attributable to
    fresh contexts alone; automated research against a scored objective rather than a task backlog
  direction: supports
  measured: true
  locator: §1 Fig. 1; §2.2 Fig. 2(b); §3; §4.1; §4.2 Tables 1-2; §4.3 Table 4; §4.4 Table 5; Appendix
    D.2 Table 9
- source: 'Gabriel Orlanski, Devjeet Roy, Alexander Yun, Changho Shin, Alex Gu, Albert Ge, Dyah Adila,
    Nicholas Roberts, Frederic Sala, Aws Albarghouthi, "SlopCodeBench: Benchmarking How Coding Agents
    Degrade Over Long-Horizon Iterative Tasks", https://arxiv.org/abs/2603.24755'
  date: '2026-03-25'
  task: Agents repeatedly extend their own code over 3 to 8 checkpoints per problem (36 problems, 196
    checkpoints); each checkpoint runs in a fresh Docker container with only the working directory carried
    over and no prior conversation; structural erosion and verbosity tracked per checkpoint and compared
    with the commit histories of 473 open-source Python repositories; two quality prompts tested against
    a plain one
  effect: No agent solved any problem end to end; best strict checkpoint solve rate 14.8% (GPT 5.5). Structural
    erosion rose in 77% of trajectories (53% of human repositories) and verbosity in 75.5%; agent code
    was 2.3x more verbose and 2.0x more eroded than the human repositories. From first to last checkpoint,
    core pass rate fell from 64.6% to 35.5% and mean cost per checkpoint grew 2.2x. An anti-slop prompt
    cut verbosity by 27.5% to 35.6% and erosion by 34.3% to 57.6% against the plain prompt, but quality
    improved from start to end only on GPT 5.4; the two quality prompts raised cost per checkpoint by
    12.1% on average and cut the strict solve rate by 2.4 (anti-slop) and 3.6 points (plan-first).
  conditions: 15 models from six providers in their native CLI harnesses, a two-hour wall-clock limit
    per run, no turn or cost cap; the prompt study on three OpenAI models (GPT 5.4, GPT 5.5, GPT 5.3 Codex);
    the benchmark supplies each checkpoint's spec, so the agent does not pick its next task, and there
    is no per-checkpoint quality gate; numbers from v2 (May 2026)
  direction: mixed
  measured: true
  locator: Abstract; §1 RQ1-RQ4; §3 Setup; §3.1 Table 1, Fig. 2; §3.2 Fig. 3; §3.3 Fig. 4; §3.4 Table
    3, Fig. 5
- source: Nicholas Carlini (Anthropic), "Building a C compiler with a team of parallel Claudes", https://www.anthropic.com/engineering/building-c-compiler
  date: '2026-02-05'
  task: 'Sixteen Claude Code loops build a Rust C compiler from scratch: a bash while-true loop starts
    a fresh headless session per iteration, each in its own container, from the same prompt file; each
    session claims a task with a lock file pushed through git, works, merges, pushes and exits, with progress
    files and READMEs carrying state; the author added a CI gate, a sampled fast test mode, a GCC oracle
    and specialist roles as failure modes appeared'
  effect: '"Over nearly 2,000 Claude Code sessions across two weeks, Opus 4.6 consumed 2 billion input
    tokens and generated 140 million output tokens, a total cost just under $20,000." The 100,000-line
    compiler builds a bootable Linux 6.9 on x86, ARM and RISC-V and has "a 99% pass rate on most compiler
    test suites including the GCC torture test suite", but outputs code less efficient than GCC with all
    optimizations disabled, calls GCC for 16-bit x86, lacks its own assembler and linker, and "New features
    and bugfixes frequently broke existing functionality." Near the end "Claude started to frequently
    break existing functionality each time it implemented a new feature", so the author built a CI pipeline
    "so that new commits can''t break existing code"; 16 agents on the single kernel build kept overwriting
    each other''s fixes until GCC served as a known-good oracle; one agent ran pkill -9 bash and ended
    its loop. "it is easy to see tests pass and assume the job is done, when this is rarely the case."'
  conditions: Claude Opus 4.6, 16 parallel agents, no orchestration agent, no internet access; one project
    run as a capability stress test and judged by its author, a vendor demonstrating its own model; no
    comparison with another harness; earlier Opus 4 models "were barely capable of producing a functional
    compiler" and Opus 4.5 could not compile real large projects
  direction: supports
  measured: true
  locator: Intro; Enabling long-running Claudes; Running Claude in parallel; Lessons from programming
    with Claude agent teams; Stress testing the limits of agent teams (Evaluation); Looking forward
- source: Anthropic (Claude Code repository), "Ralph Wiggum Plugin", https://github.com/anthropics/claude-code/blob/main/plugins/ralph-wiggum/README.md
  date: '2025-11-16'
  task: 'Anthropic''s official Claude Code plugin for the technique: /ralph-loop runs the loop inside
    the current session, where a Stop hook blocks exit and feeds the same prompt back each iteration until
    an iteration cap or an exact completion phrase'
  effect: '"The loop happens inside your current session - you don''t need external bash loops." "--max-iterations
    <n> - Stop after N iterations (default: unlimited)"; "Always use --max-iterations as a safety net
    to prevent infinite loops on impossible tasks"; the completion promise "uses exact string matching,
    so you cannot use it for multiple completion conditions (like "SUCCESS" vs "BLOCKED")". Good fits:
    "Well-defined tasks with clear success criteria" and "Tasks with automatic verification (tests, linters)";
    poor fits: "Tasks requiring human judgment or design decisions" and "Tasks with unclear success criteria".
    Its "Real-World Results" are relayed claims without a source or method. No measurement.'
  conditions: Claude Code plugin documentation and hook script; no evaluation
  direction: mixed
  measured: false
