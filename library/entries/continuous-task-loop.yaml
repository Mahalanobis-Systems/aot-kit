  direction: mixed
  measured: true
  locator: §3.2; §5.1; §5.2 Table 2; §5.3; §5.5; §6.2; Appendix B.1 Tables 7-8
- source: 'Han Li, Zhemin Fang, Rili Feng, Yingqi Zhao, Jiaheng Liu, Pengfei Gao, He Ye, Dayi Lin, Qingwei
