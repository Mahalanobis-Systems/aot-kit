- source: 'Jeremy Qin, Ruizhi Deng, Mohamed Osama Ahmed, Frederick Tung, Leo Feng (RBC Borealis; ELLIS
    Institute Tübingen and Max Planck Institute for Intelligent Systems), "From AutoResearch to Continual
    AutoResearch: Do Agents Learn Across Tasks?", https://arxiv.org/abs/2611.05108'
  date: '2026-11-03'
  task: Ordered streams of three to five related machine-learning research tasks in nine families (synthetic
    AutoML, symbolic regression, time-series forecasting, tabular AutoML), each an autoresearch loop with
    a 30-minute wall-clock budget and hidden test scoring. The same agent either resumes one native session
    and workspace across the stream (stateful) or starts a fresh session and clean workspace for every
    task (reset), with task, model, environment, budget and evaluation matched; a memory ablation gives
    fresh sessions agent-authored insight cards (matched, shuffled or none)
  effect: 'Final outcome, stateful minus reset, in normalized reward points over 32 transfer tasks per
    agent: Opus 5 -0.9, GPT-5.6-Sol -0.8, Kimi K3 +0.4, GPT-5.4 +0.2, Sonnet 4.6 +7.6 (reset outcomes
    79.9, 80.5, 73.1, 72.9 and 70.3). Time-convergence gain was positive for all five (+3.0 to +21.3);
    the mean best-reward gap fell from +24.0 points at 25% of the budget to +1.2 at the deadline, where
    only Kimi K3 and Sonnet 4.6 stayed ahead. Time to first valid solution, stateful/reset: Opus 5 7.7/11.1
    min, GPT-5.6-Sol 6.1/8.5, Kimi K3 9.5/18.7, Sonnet 4.6 7.7/16.3, GPT-5.4 8.4/9.2. With candidate counts
    matched, the Opus 5 and GPT-5.6-Sol gains fell near zero. Insight cards given to fresh sessions changed
    initialization and search but did not consistently improve final results; failure cases show agents
    applying an earlier lesson too broadly. Persistence is "most valuable when budgets are tight".'
  conditions: Sonnet 4.6 and Opus 5 in Claude Code, GPT-5.4 and GPT-5.6-Sol in Codex, Kimi K3 in OpenCode;
