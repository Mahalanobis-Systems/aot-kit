    at Production Scale: Failure Modes and a Multi-Agent Framework", https://arxiv.org/abs/2609.30541'
  date: '2026-09-24'
  task: 'Twelve weeks of unattended AutoResearch loops (an LLM edits a training script and keeps changes
    that improve a held-out metric) on two production book-recommendation systems: System A with 9-19
    hour multi-GPU iterations (60+ iterations over six runs), System B with 6-52 minute single-GPU iterations
    (150+). A durable program file carries findings across jobs and context resets; a pre-execution Code
    Fixer and a stagnation-triggered Criticizer were added as failure modes appeared'
  effect: 'Failure incidence (Table II): infrastructure failures cost 18% of System A iterations and 37%
    of System B''s worst run, including 11 consecutive failed iterations on an evaluator timeout "before
    a human intervened". In System B the agent re-tested 100-epoch training at least six times "despite
    program.md explicitly stating" not to, and in System A about five iterations were lost re-exploring
    recorded failures; stagnation runs of 5+ iterations in both systems; 10 iterations spent on one unproductive
    direction; none of 15 runs met all three usability criteria. The Criticizer fires when the best score
    has not improved by 8% (relative) over 5 iterations: "3 iterations was too frequent (firing on noise);
    8 iterations was too late". The Code Fixer corrected 14 latent bugs in its first pass, one of which
    would have run an 8-GPU job on one device for 10+ hours. Single-agent code-level AutoResearch stalled
    at 4.17% Recall@6 (1.10x the 3.79% hand-tuned baseline) "regardless of iteration count"; with both
    added agents it peaked at 6.90% (1.82x; 1.63x mean across 11 evaluation dates). About 65% of System
    B iterations were productive; 150+ experiments in three weeks; the authors estimate about 8 engineer-weeks
    saved.'
  conditions: Researcher claude-sonnet-4-6, Code Fixer and Criticizer claude-opus-4-6 (System A); one
    production campaign with components added in sequence, so their effects are confounded with campaign
