measure:
- method: experiment
  tier: 2
  how: 'same cases and model at each step budget you run, several runs per arm: no detector, warning only,
    warning plus stop, and a placebo reminder at random moments when testing a controller; report the
    share of runs with a loop (same normalized call and result) and of steps spent in loops, stops and
    cap hits by reason, success overall and on the runs the stop ended (replayed without the stop), tokens,
    turns and wall-clock'
- method: monitor
  how: 'per model in production: share of runs with a loop, warnings issued and whether the repeated call
    recurred in the following steps, stops by reason, cap hits, tokens per session; re-run the experiment
    when the model or harness changes'
