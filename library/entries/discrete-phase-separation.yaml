- source: 'Viral Patel, Boyin Tan, Jason Xue, Youcheng Sun, "PAUSE: Search-Free Steering of Coding Agents
    Before Their First Source-Code Edit", https://arxiv.org/abs/2610.29870'
  date: '2026-10-21'
  task: 'At a coding agent''s first source-code edit (a median of 60% into the run, after exploration,
    reproduction and testing), a separate Planner call reads the task and the transcript and writes one
    repair plan; the same executor then continues its session with the plan appended (resume), or a fresh
    executor starts from the initial repository with only the plan (restart). Controls: no plan, self-reconsideration,
    and the executor''s own model as Planner'
  effect: 'Online with GPT-5.6 Sol as Planner, SWE-bench Verified resolution rose from 50.2% to 65.0%
    (SWE-agent), 37.0% to 43.0% (Pi) and 45.4% to 62.2% (OpenHands); Multilingual 28.3% to 43.0%. On 223
    recorded Qwen3-coder failures: no plan recovered 9 (4.0%), self-reconsideration 13 (5.8%), the executor''s
    own model as Planner 12 (5.4%), GPT-5.6 Sol 79 (35.4%); with Devstral-small 14, 17, 20 and 53 of 174.
    Full benchmark against a 45.6% baseline: Sol plans 58.2% resume and 58.6% restart; Qwen3-30B-Thinking
    plans 43.4% resume and 41.4% restart, with 26 regressions (14.6%) on 178 solved tasks against 10 for
    resuming with no plan. On failures, restart needed "2.0× as many Executor calls" and 22% more executor
    tokens; over 500 tasks 519.1M against 347.4M executor tokens.'
  conditions: Qwen3-coder and Devstral-small executors; GPT-5.6 Sol, Gemini 3.8 Flash, Gemini 3.5 Flash
    Lite and Qwen3-30B-Thinking planners; SWE-agent, Pi and OpenHands; SWE-bench Verified (500) and Multilingual
    (300); offline comparisons one run per task; the Planner reads the transcript without tools and no
    human reviews the plan; the gain mainly reflects a stronger Planner model
  direction: mixed
  measured: true
  locator: §4.1 Table 3; §4.2 Tables 4-5; §4.4 Table 6; §5
- source: 'Kaiming Liu, Yuxuan Liu, Jinrui Ju, Minyuan Ruan, Xuanyu Lei, Peng Li, Yang Liu, "Instructions
    Are Evidence, Not Objectives: Measuring Outcome Alignment of Agents", https://arxiv.org/abs/2610.17757'
  date: '2026-10-13'
  task: 'A two-phase plan mode under partial instructions: a read-only plan phase (editing and submission
    tools withheld) ends by writing PLAN.md, then the same episode executes it; compared with the same
    model, instruction and budget without the plan phase'
  effect: 'Score@1 (share of five requirements passed) and Success@1 (all passed), without vs with plan
    mode: GPT-5.6-Luna 41.6 vs 45.9 and 3.1 vs 3.1; Kimi-K3 68.8 vs 55.3 and 21.9 vs 17.2; DeepSeek-V4.1-Flash
    66.3 vs 55.0 and 25.0 vs 21.9. "the plan mode never raises Success@1"; "the plan-phase agent does
    not infer the complete true requirements, and ... it often stops exploring too early and writes the
    plan."'
  conditions: TiGanEval, 64 tasks (40 software engineering from DeepSWE, 24 research), five requirements
    each, initial instruction deliberately partial; 120 turns and 360 tool calls shared across both phases;
    three models; seed-to-seed deviation within 4.3 Score points on replicated configurations; one context
    across both phases, no human review
  direction: contradicts
  measured: true
  locator: §5.4 Table 6; Appendix F.3; Table 7
- source: Shyam Agarwal, Anmol Singhal, Andrew Macvean, Bogdan Vasilescu, Travis Breaux, "Spec-Driven
    Development as Prescribed and as Practiced", https://arxiv.org/abs/2608.25202
  date: '2026-10-15'
  task: Studied spec-driven development (a spec, design or plan, and tasks written before the agent codes,
    as in Spec Kit, OpenSpec and Kiro) through Reddit discussions, interviews with 21 practitioners including
    eight tool makers, and 266 active repositories from a corpus of 470,795 spec files
  effect: Practitioners "used SDD selectively", skipping it for small tasks, bugs and one-off scripts;
    an estimated 82.0% of specs describe new features. "Most tool users read specs only partially or delegated
    their review to other agents"; 98.3% of spec files with a recorded history have a single author and
    68.5% of inline spec comments were written by bots. Most reported more reliable agent work but "could
    not separate this benefit from improvements in models"; one team found "the spec-driven runs typically
    consume two to three times as many tokens and take about twice as long" and “We couldn’t prove it
    improved the code” (Reddit posts). 77.6% of specs contain implementation detail, 75% of those naming
    classes, functions, file paths or library versions; agents departed from specs during implementation
    and specs went stale; 81.5% of spec files have a single recorded commit. The authors recommend that
    tools "separate specification, implementation, and review contexts".
  conditions: Thematic analysis plus repository mining with LLM-as-judge labels; no controlled comparison;
    token and time figures are self-reported by one team; title, five authors and all cited findings first
    appear in v4 (2026-10-15)
  direction: mixed
  measured: false
  locator: §IV Findings 2, 3, 4, 7, 9, 10; §V-A; §V implications
- source: 'Dipesh KC, Anjila Budathoki, "Handoff Debt: The Rediscovery Cost When Coding Agents Take Over
    Interrupted Tasks", https://arxiv.org/abs/2606.02875'
  date: '2026-06-01'
  task: 'A coding agent is stopped at a fixed point (after its first source edit, first validation result
    or first post-failure edit) and a successor in a fresh context resumes from the frozen repository
    with one of four handoffs: repository only, the raw trace, free-form summary notes, or structured
    notes (changed files, validation evidence, uncertainty, rollback risk, what to verify)'
  effect: 'Same-model takeover (Qwen to Qwen) solved rate: repository only 46.4%, raw trace 52.5% (+6.1,
    p 0.035), summary notes 51.4% (+5.0, p 0.093), structured notes 50.8% (+4.4, p 0.134); median steps
    99, 41, 53 and 55; prompt tokens 1.63M, 811k, 602k and 660k. Across three successors the raw trace
    gained +6.1 to +14.9 points and notes +1.1 to +10.5, notes significant only for Devstral. Median first
    prompt: 87k characters for the raw trace, 9.8k and 10.0k for the notes. For Gemma, notes slightly
    lowered the solved rate on unfinished work (-1.8 and -0.9 points).'
  conditions: 75 SWE-bench Verified tasks, 181 handoff points, 2,172 takeover runs; Qwen3.6-27B predecessor;
    Qwen3.6-27B, Gemma-4-31B and Devstral-Small-2-24B successors; OpenHands-style runtime; one run per
    view, a three-attempt rerun on 40 points agreed; mid-task handoffs, not research-to-plan boundaries
  direction: mixed
  measured: true
  locator: §5.1-5.3 Table 2; Appendix Tables 7, 8, 10
- source: 'Xin Liu, Hongru Song, Ruqing Zhang, Jiafeng Guo, Xueqi Cheng, "CLEAR: Structured Specifications
    for Controllable Long-Horizon ML Research Engineering", https://arxiv.org/abs/2611.06263'
  date: '2026-11-04'
  task: 'Before any code is written, a pipeline turns a research paper into a structured execution specification
    (implementation requirements, component dependencies, interfaces, execution constraints and evaluation
    procedures, built from traceable evidence units that keep their source context) plus a short human-readable
    summary; a planning model then splits the work into specification-bounded subtasks for cheaper coding
    models and repairs only the failing subtask. Ablation: the same system with the planning model reading
    the paper directly instead of the specification steps (w/o specs)'
  effect: 'PaperBench (20 papers): average score 29.87 at $7.91 per paper with the structured specification
    against 24.14 at $10.08 without it ("the average score drops by 19.18% while the average cost increases
    by 27.43%"); average tokens per paper 564,337 against 841,619 ("CLEAR w/o specs therefore consumes
    49.1% more tokens"). The same pipeline with GLM-5 in both roles scored 26.41 at $11.95.'
  conditions: Claude Opus 4.6 planner and Claude Sonnet 4.6 coders; PaperBench graded by GPT-5.4 under
    the official protocol; 24-hour budget per task; the optional human review of the specification was
    not used; no repeated runs or intervals reported; the authors' own system, whose comparisons with
    other systems use different backbone models; ML research engineering from a paper rather than changes
    to an existing codebase
  direction: supports
  measured: true
  locator: §3.1; §4 Implementation details; §5.3 Table 4; §5.4 Table 5
- source: 'Cezar Sas, Sandra Mitrović, Fabio Barth, Georg Rehm, Matteo Salani, "The Code of Theseus: Can
    Agents Rebuild Software from Recovered Design Documents?", https://arxiv.org/abs/2610.20068'
  date: '2026-10-14'
  task: A coding agent rebuilds 29 Commit0 Python libraries from scratch, given an interface contract
    (the modules, classes and functions the tests import) and 30% of the tests, with either the stakeholder
    intent alone (Intent) or the intent plus requirements and architecture documents an LLM recovered
    from the original code (Full); graded on the 70% of tests it never saw and on how closely its module
    structure matches the original
  effect: 'Held-out tests passed: 33.7% Intent against 35.8% Full (+2.1 points, 95% CI [-1.6, +5.8], Holm-adjusted
    p 0.160; 19 libraries better, 1 tied, 9 worse; per library -21.9 to +24.3 points). Module F1 on modules
    the contract does not name: 0.54 against 0.63 (+0.09, CI [+0.05, +0.15], adjusted p 0.005). Task prompt
    1.0k against 4.8k tokens; agent steps 869 against 858 and output tokens 311k against 300k, not significantly
    different; input tokens 38.1M against 40.0M (unadjusted p 0.046, mixed model 0.068). "The artefacts
    shape the structure, not measurably the behaviour." The authors add that the contract and tests already
    fix part of the structure, so "Whether a design improves correctness when the behaviour is less specified
    therefore remains open."'
  conditions: Qwen3.8-Flash-Next agent, three runs per library, condition and document generator under
    the same budget; documents from Gemma4-31B and Qwen3.5-122B; 340 valid runs over 29 libraries of up
    to about 8k lines; the documents are recovered from the reference code rather than written by a research
    phase for the task; no plan review; one agent model
  direction: mixed
  measured: true
  locator: §IV-E; §V-C; §VI-C Tables V-VI; §VII
- source: Xin Zhou, Chun Yong Chong, Kisub Kim, et al., "A Unified Issue Resolution Benchmark for Requirement
    Clarification, Planning, and Code Generation for Coding Agents", https://arxiv.org/abs/2608.09072
  date: '2026-08-10'
  task: 'SWE-RPG: 163 tasks from 31 Python and Java repositories (113 bug fixes, 50 feature additions),
    each with a validated requirement-clarification reference and a gold implementation plan whose steps
    were checked to reproduce the merged patch; agent trajectories are scored against both references,
    and each failed run is attributed to the earliest stage that went wrong (requirement understanding,
    planning, implementation, other)'
  effect: 'Mean resolved rate 31.5% (best 49.7%, OpenCode with Kimi-K3); mean cost $1.59 and 8.5 minutes
    per task. Failure stages across configurations: requirement understanding 24.5% to 46.0% of runs,
    code generation 7.4% to 37.4%, planning 5.5% to 17.8%. Coverage of the gold plan fell from target
    location to implementation approach to constraints and validation: 79.7%, 64.5% and 41.6% for Claude
    Code; 65.6%, 49.0% and 37.1% for Codex; 43.8%, 31.1% and 24.8% for OpenCode ("agents often identify
    where to edit without fully specifying how to implement and verify the change"). Codex and Claude
    Code with DeepSeek-V4-Pro resolved 40.5% and 39.3% with requirement-failure rates of 26.4% and 40.5%.'
  conditions: Claude Code, Codex and OpenCode with Claude-Sonnet-5, DeepSeek-V4-Pro, GLM-5.2, GPT-5.6-Terra,
    MiniMax-M3 and Kimi-K3, two runs per configuration and task; failure stages and plan coverage judged
    by GPT-5.6-Sol (92% exact agreement with human consensus on 50 failed runs, 96% on 50 coverage decisions);
    plans are read from the agents' own trajectories, not from a separate plan phase; diagnostic, no intervention
    tested
  direction: supports
  measured: true
  locator: §3.2; §4; §5.1; §5.2 Figure 6; §5.3 Figure 7
- source: 'Pardis Taghavi, Santosh Bhavani, "Spec Kit Agents: Context-Grounded Agentic Workflows", https://arxiv.org/abs/2604.05278'
  date: '2026-04-07'
  task: On 32 feature requests in five open-source repositories (FastAPI, Airflow, Dexter, Plausible Analytics,
    Strapi), the same agent system either implements directly (Baseline) or first runs GitHub Spec Kit's
    stages, writing SPEC.md, PLAN.md and TASKS.md before implementing (Full); Augmented variants add read-only
    discovery before each phase and validation after it (referenced paths exist, required libraries are
    present, the task list is feasible and ordered, then tests and linters)
  effect: 'Judged quality (1 to 5; completeness, correctness, style, maintainability): Baseline 3.46,
    Full 3.51, Augmented 3.50, Full-Augmented 3.66 (+0.15 over Full, Wilcoxon p < 0.05); discovery-only
    3.53, validation-only 3.57. Repository test compatibility 99.7% to 100% in all configurations. Wall-clock
    time on completed runs: Baseline 14.4 and Augmented 15.5 minutes (15 pairs), Full 24.0 and Full-Augmented
    37.2 minutes (16 pairs). In a blinded human comparison of Full and Full-Augmented pull requests (6
    tasks, 60 votes), raters preferred Full 19 times, Full-Augmented 8 times and tied 33 times.'
  conditions: MiniMax-M2.5 through Claude Code CLI, Claude Opus 4.6 as judge; one run per task and configuration
