caveats: 'The one controlled comparison of a spec-driven tool''s phases against implementing directly
  found little difference (one open model, 32 features, one run each, an LLM judge, plan review auto-approved),
  and no study we found compares the full research, plan and implement split with human review against
  one continuous session on the same tasks. The other measured results cover a plan injected at the first
  edit, where the gain comes from a stronger planner model; a same-session plan mode under deliberately
  partial instructions (64 tasks, three models); mid-task handoffs between 24B to 31B open-weight models;
  design documents recovered from the target code for library rebuilds whose interface the agent is given
  (one open model); a specification ablation inside its authors'' own ML-research system (20 papers, no
  repeated runs reported); and plan coverage read from agents'' trajectories by an LLM judge. Plans can
  hurt: a weaker planner''s plans broke passing runs, a plan written after too little exploration covered
  only part of the task, distilled notes kept less of the solve-rate gain than the raw history, and an
  LLM judge and blinded human raters disagreed on whether repository checks around each phase improved
  the result. The practice evidence is self-reported (practitioners could not separate the benefit from
  model improvements, one team reported two to three times the tokens and about twice the time, and the
  35k-LOC report is one team''s anecdote), and human review time remains unmeasured.'
