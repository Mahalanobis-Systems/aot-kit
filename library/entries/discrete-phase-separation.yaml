- source: Dex Horthy (HumanLayer), "Getting AI to Work in Complex Codebases", https://github.com/humanlayer/advanced-context-engineering-for-coding-agents/blob/main/ace-fca.md
  date: '2025-08-29'
  task: Describes a research, plan, implement workflow for coding agents that keeps context utilization
    low and adds human review between phases
  effect: '"We use a "research, plan, implement" workflow"; reports shipping 35k LOC to BAML in 7 hours
    (3 on research/plans, 4 on implementation). A 7-hour attempt to remove Hadoop dependencies from parquet-java
    "did not go well": "the research steps didn''t go deep enough through the dependency tree". Anecdotal,
