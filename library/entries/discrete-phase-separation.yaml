caveats: 'No study we found compares the full research, plan and implement split with human review against
  one continuous session on the same tasks: the measured results cover a plan injected at the first edit,
  where the gain comes from a stronger planner model, a same-session plan mode with no review under deliberately
  partial instructions (64 tasks, three models), and mid-task handoffs between 24B to 31B open-weight
  models (75 source tasks, one run per view). Plans can hurt: a weaker planner''s plans broke passing
  runs, a plan written after too little exploration covered only part of the task, and distilled notes
  kept less of the solve-rate gain than the raw history. The practice evidence is self-reported: practitioners
  could not separate the benefit from model improvements, one team reported two to three times the tokens
  and about twice the time, and the 35k-LOC report is one team''s anecdote.'
