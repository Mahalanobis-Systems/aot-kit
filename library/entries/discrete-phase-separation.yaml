# 5.c.i: Discrete phase separation
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 5.c.i
legacy_id: P47
slug: discrete-phase-separation
name: Discrete phase separation
kind: pattern
status: card
tiers:
- tier: 4
  why: it splits the work into isolated phases
  proposed: true
levers:
- context
domains:
- general
evidence_domains:
- code-generation
categories:
- context.isolate
summary: 'Run research, planning and implementation as separate agent sessions, each starting from a fresh
  context that holds only the previous phase''s written output (a research document, then a plan file),
  and have a person review that document before the next phase starts. It pays when the plan knows more
  than the implementer would find on its own: on SWE-bench Verified, a plan written by a stronger model
  at the agent''s first edit raised resolution by 6.0 to 16.8 points across three harnesses, and a fresh
  implementer given only that plan did as well as continuing the original session with it (58.6% vs 58.2%)
  while making more calls. The plan is also the risk: plans from the agent''s own model recovered 12 of
  223 failures against 9 with no plan, a weaker planner''s plans broke 14.6% of runs that had passed,
  and with incomplete instructions a read-only plan phase never raised task success and cut requirement
  scores by 11.3 and 13.5 points for two of three models because it stopped exploring early. In practice
  teams use it for large new features, read the specs only partially and see them go stale; no study we
  found tests the full split with review against one continuous session.'
how: '1. Start from one continuous session on your real tasks, with the harness''s own compaction (see
  5.a.i), and record where it goes wrong: the wrong problem solved, the fix put in the wrong place, requirements
  the request left out but the repository shows, rework after review. Split only the tasks that fail that
  way, typically large new features or multi-file changes in unfamiliar code; practitioners skip it for
  small fixes, bugs and one-off scripts, and 82.0% of the public specs studied describe new features.
  2. Research: run a read-only session (no edit tools) that explores the code and writes a research document:
  the relevant files with paths and line references, how the current behavior works, constraints and conventions,
  and requirements the request does not state. Tell it to treat the request as evidence rather than the
  full specification and to keep exploring until it can say how each requirement will be checked; a plan
  phase that stopped exploring early wrote plans covering only part of the task, and HumanLayer traced
  its own failed 7-hour attempt to research that did not go deep enough through the dependency tree. 3.
  Plan: start a fresh session from the request and the research document only, and have it write a plan
  file: every change file by file, the reason for each, and the test or command that validates it. Use
  your strongest model here: a stronger planner''s plans raised resolution by 6.0 to 16.8 points, the
  implementer''s own model as planner recovered 12 of 223 failures against 9 with no plan, and a weaker
  planner''s plans broke 14.6% of passing runs. Keep detail that names classes, functions or library versions
  scoped to this change; it is what goes stale first. 4. Review at each boundary: a person reads the research
  document and the plan before the next phase starts and corrects or rejects them, because a wrong line
  of research or plan turns into many wrong lines of code. Check that the review happens; most spec-driven
  tool users read specs only partially or handed the review to another agent. 5. Implement: start a fresh
  session with the request, the plan file and a structured handoff in fixed fields (files changed or to
  change, validation commands and results, what failed, what is still uncertain, what to verify first),
  and tell it to check the plan against the repository rather than trust it. Notes cost part of the raw
  history''s gain (+4.4 to +5.0 against +6.1 points for the same model), so keep the research transcript
  where the implementer can read it on demand. If research and planning used little context, appending
  the plan to the same session is cheaper: a fresh implementer matched the continuing one (58.6% vs 58.2%)
  but needed 2.0 times the executor calls on failed tasks. 6. After the change merges, update or archive
  the research and plan files so no later session reads them as current (see 4.b.iii). 7. Measure with
  paired runs on the same tasks and models: one continuous session, the plan in the same session, and
  the phase split, with and without the boundary review; report task success, requirement coverage on
  tasks whose request omits requirements, runs the baseline solved that the variant broke, tokens and
  wall time per phase and human review minutes, and label each failure as research, plan, handoff or implementation.'
detect:
  static: Phases with distilled handoffs rather than shared history.
  traces: Phase boundaries and what crosses them; handoff size against the full history; files the implement
    phase re-reads that research already covered; edits made to the plan at review; research or plan files
    older than the code they describe.
  evals: Quality vs monolithic run.
  judge: Rate handoffs for completeness.
  probes:
    what: Multi-file tasks whose request leaves out requirements the repository reveals, where a design
      decision must precede coding.
    construct: Give tasks with a hidden test per requirement and an instruction that states only some
      of them; run one continuous session and the phase split on the same model and budget, and score
      requirement coverage, passing work broken, and tokens per phase.
  primary:
  - static
  - traces
impact:
  quality:
    effect: mixed
    size: medium
    when: 'pays when the plan beats what the implementer finds alone: a stronger model''s plan at the
      first edit +6.0 to +16.8 points on SWE-bench Verified, a fresh implementer from that plan alone
      58.6% vs 58.2% for the continuing session; the implementer''s own model as planner 12 of 223 failures
      recovered against 9 with no plan, and a weaker planner''s plans 43.4% against a 45.6% baseline with
      14.6% of passing runs broken (Patel, Oct 2026); under incomplete instructions a read-only plan phase
      never raised Success@1 and cut Score@1 from 68.8 to 55.3 and 66.3 to 55.0 for two of three models
      (Liu, Oct 2026); distilled notes +4.4 to +5.0 points against +6.1 for the raw history, same model
      (KC, Jun 2026); one team''s 35k LOC in 7 hours, anecdotal (Horthy, Aug 2025)'
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: 'more when the next phase must re-explore: a fresh implementer from the same plan used 2.0 times
      the executor calls and 22% more executor tokens on failed tasks, and 519.1M against 347.4M executor
      tokens on 500 tasks (Patel, Oct 2026); planning itself adds tokens, one team reporting two to three
      times those of direct prompting, self-reported (Agarwal, Oct 2026); fewer when bounded notes replace
      a long history: a same-model successor given notes used 602k to 660k prompt tokens against 811k
      with the raw trace, its first prompt about 10k characters against 87k (KC, Jun 2026)'
    basis: evidence
  performance:
    effect: degrades
    size: medium
    when: 'phases run in sequence and wait for review: a fresh implementer needed 2.0 times the executor
      calls (Patel, Oct 2026); a successor working from notes took a median 53 to 55 steps against 41
      with the raw trace (KC, Jun 2026); one team reported about twice the time, self-reported (Agarwal,
      Oct 2026); 3 of 7 hours went to research and plans (Horthy, Aug 2025); no source measures review
      wait time'
    basis: evidence
  security:
    effect: none
    basis: assessment
  governance:
    effect: mixed
    size: medium
    when: research and plan files are a reviewable record of intent, and reading a 200-line plan instead
      of 2,000 lines of code is the stated point (Horthy, Aug 2025); in practice most spec-driven tool
      users read specs only partially or delegated review to other agents, 98.3% of spec files with history
      had one author, 68.5% of inline spec comments came from bots, and specs went stale as code changed
      (Agarwal, Oct 2026)
    basis: evidence
  brand:
    effect: none
    basis: assessment
  primary:
  - quality
  - governance
measure:
- method: experiment
  tier: 4
  how: 'paired runs on the same tasks, model and budget: one continuous session with compaction, a plan
    in the same session, and the phase split with fresh contexts, each with and without the boundary review;
    include tasks whose instruction omits requirements that hidden tests check; report task success, requirement
    coverage, baseline-solved runs the variant broke, tokens and wall time per phase and review minutes;
    repeat with the planner on a stronger model and on the implementer''s model, and again after a model
    upgrade'
- method: monitor
  how: 'per task: phases run, tokens and time per phase, handoff size, files the implement phase re-reads
    that research already covered, edits made to the plan at review and whether a reviewer opened it,
    failures traced to research, plan or handoff, and research or plan files older than the code they
    describe'
