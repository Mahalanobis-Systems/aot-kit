- source: 'Viral Patel, Boyin Tan, Jason Xue, Youcheng Sun, "PAUSE: Search-Free Steering of Coding Agents
    Before Their First Source-Code Edit", https://arxiv.org/abs/2610.29870'
  date: '2026-10-21'
  task: 'At a coding agent''s first source-code edit (a median of 60% into the run, after exploration,
    reproduction and testing), a separate Planner call reads the task and the transcript and writes one
    repair plan; the same executor then continues its session with the plan appended (resume), or a fresh
    executor starts from the initial repository with only the plan (restart). Controls: no plan, self-reconsideration,
    and the executor''s own model as Planner'
  effect: 'Online with GPT-5.6 Sol as Planner, SWE-bench Verified resolution rose from 50.2% to 65.0%
    (SWE-agent), 37.0% to 43.0% (Pi) and 45.4% to 62.2% (OpenHands); Multilingual 28.3% to 43.0%. On 223
    recorded Qwen3-coder failures: no plan recovered 9 (4.0%), self-reconsideration 13 (5.8%), the executor''s
    own model as Planner 12 (5.4%), GPT-5.6 Sol 79 (35.4%); with Devstral-small 14, 17, 20 and 53 of 174.
    Full benchmark against a 45.6% baseline: Sol plans 58.2% resume and 58.6% restart; Qwen3-30B-Thinking
    plans 43.4% resume and 41.4% restart, with 26 regressions (14.6%) on 178 solved tasks against 10 for
    resuming with no plan. On failures, restart needed "2.0× as many Executor calls" and 22% more executor
    tokens; over 500 tasks 519.1M against 347.4M executor tokens.'
  conditions: Qwen3-coder and Devstral-small executors; GPT-5.6 Sol, Gemini 3.8 Flash, Gemini 3.5 Flash
    Lite and Qwen3-30B-Thinking planners; SWE-agent, Pi and OpenHands; SWE-bench Verified (500) and Multilingual
    (300); offline comparisons one run per task; the Planner reads the transcript without tools and no
    human reviews the plan; the gain mainly reflects a stronger Planner model
  direction: mixed
  measured: true
  locator: §4.1 Table 3; §4.2 Tables 4-5; §4.4 Table 6; §5
- source: 'Kaiming Liu, Yuxuan Liu, Jinrui Ju, Minyuan Ruan, Xuanyu Lei, Peng Li, Yang Liu, "Instructions
    Are Evidence, Not Objectives: Measuring Outcome Alignment of Agents", https://arxiv.org/abs/2610.17757'
  date: '2026-10-13'
  task: 'A two-phase plan mode under partial instructions: a read-only plan phase (editing and submission
    tools withheld) ends by writing PLAN.md, then the same episode executes it; compared with the same
    model, instruction and budget without the plan phase'
  effect: 'Score@1 (share of five requirements passed) and Success@1 (all passed), without vs with plan
    mode: GPT-5.6-Luna 41.6 vs 45.9 and 3.1 vs 3.1; Kimi-K3 68.8 vs 55.3 and 21.9 vs 17.2; DeepSeek-V4.1-Flash
    66.3 vs 55.0 and 25.0 vs 21.9. "the plan mode never raises Success@1"; "the plan-phase agent does
    not infer the complete true requirements, and ... it often stops exploring too early and writes the
    plan."'
  conditions: TiGanEval, 64 tasks (40 software engineering from DeepSWE, 24 research), five requirements
    each, initial instruction deliberately partial; 120 turns and 360 tool calls shared across both phases;
    three models; seed-to-seed deviation within 4.3 Score points on replicated configurations; one context
    across both phases, no human review
  direction: contradicts
  measured: true
  locator: §5.4 Table 6; Appendix F.3; Table 7
- source: Shyam Agarwal, Anmol Singhal, Andrew Macvean, Bogdan Vasilescu, Travis Breaux, "Spec-Driven
    Development as Prescribed and as Practiced", https://arxiv.org/abs/2608.25202
  date: '2026-10-15'
  task: Studied spec-driven development (a spec, design or plan, and tasks written before the agent codes,
    as in Spec Kit, OpenSpec and Kiro) through Reddit discussions, interviews with 21 practitioners including
    eight tool makers, and 266 active repositories from a corpus of 470,795 spec files
  effect: Practitioners "used SDD selectively", skipping it for small tasks, bugs and one-off scripts;
    an estimated 82.0% of specs describe new features. "Most tool users read specs only partially or delegated
    their review to other agents"; 98.3% of spec files with a recorded history have a single author and
    68.5% of inline spec comments were written by bots. Most reported more reliable agent work but "could
    not separate this benefit from improvements in models"; one team found "the spec-driven runs typically
    consume two to three times as many tokens and take about twice as long" and “We couldn’t prove it
    improved the code” (Reddit posts). 77.6% of specs contain implementation detail, 75% of those naming
    classes, functions, file paths or library versions; agents departed from specs during implementation
    and specs went stale; 81.5% of spec files have a single recorded commit. The authors recommend that
    tools "separate specification, implementation, and review contexts".
  conditions: Thematic analysis plus repository mining with LLM-as-judge labels; no controlled comparison;
    token and time figures are self-reported by one team; title, five authors and all cited findings first
    appear in v4 (2026-10-15)
  direction: mixed
  measured: false
  locator: §IV Findings 2, 3, 4, 7, 9, 10; §V-A; §V implications
- source: 'Dipesh KC, Anjila Budathoki, "Handoff Debt: The Rediscovery Cost When Coding Agents Take Over
    Interrupted Tasks", https://arxiv.org/abs/2606.02875'
  date: '2026-06-01'
  task: 'A coding agent is stopped at a fixed point (after its first source edit, first validation result
    or first post-failure edit) and a successor in a fresh context resumes from the frozen repository
    with one of four handoffs: repository only, the raw trace, free-form summary notes, or structured
    notes (changed files, validation evidence, uncertainty, rollback risk, what to verify)'
  effect: 'Same-model takeover (Qwen to Qwen) solved rate: repository only 46.4%, raw trace 52.5% (+6.1,
    p 0.035), summary notes 51.4% (+5.0, p 0.093), structured notes 50.8% (+4.4, p 0.134); median steps
    99, 41, 53 and 55; prompt tokens 1.63M, 811k, 602k and 660k. Across three successors the raw trace
    gained +6.1 to +14.9 points and notes +1.1 to +10.5, notes significant only for Devstral. Median first
    prompt: 87k characters for the raw trace, 9.8k and 10.0k for the notes. For Gemma, notes slightly
    lowered the solved rate on unfinished work (-1.8 and -0.9 points).'
  conditions: 75 SWE-bench Verified tasks, 181 handoff points, 2,172 takeover runs; Qwen3.6-27B predecessor;
    Qwen3.6-27B, Gemma-4-31B and Devstral-Small-2-24B successors; OpenHands-style runtime; one run per
    view, a three-attempt rerun on 40 points agreed; mid-task handoffs, not research-to-plan boundaries
  direction: mixed
  measured: true
  locator: §5.1-5.3 Table 2; Appendix Tables 7, 8, 10
