caveats: 'The large gains come from benchmarks built so that memory is needed, and the biggest is Databricks''
  own (114 cases from its own agent, scored by an LLM judge); the independent tests that found small or
  negative effects used largely self-contained tasks (WebArena, SWE-style coding, 50-task benchmark streams),
  mostly open or mid-size models, and intervals that often cross zero, and none of them compares memory
  with a budget-matched baseline on tasks that depend on earlier ones. Memory makes tasks depend on their
  order, so they cannot run in parallel and a transient failure silently changes what later tasks see.
  It helps weaker models and unsolved tasks more and can break tasks a strong model already solves: where
  one record moved two solvers in opposite directions, the one weaker without memory gained in 61 of 64
  cases. The 87.5% poisoning rate needs an attacker model trained against a copy of the agent; handcrafted
  payloads scored 0.0% on GPT-5.4 and Sonnet 4.6.'
