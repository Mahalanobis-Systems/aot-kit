caveats: 'The large gains come from benchmarks built so that memory is needed, and the biggest are vendors''
  tests of their own products (Databricks'' 114 cases scored by an LLM judge; Anthropic''s single CL-Bench
  task, whose text gives no run counts or intervals), while on the independent benchmark built for such
  task sequences the raw history in the prompt matched or beat every dedicated memory system and the best
  system captured 25.4% of the available gain, with structured memory run mostly on GPT-5.4 over sequences
  of tens of tasks. No study yet gives a stateless agent the memory''s tokens as extra budget on tasks
  that depend on earlier ones; the independent tests that matched budgets or found small or negative effects
  used largely self-contained tasks (WebArena, SWE-style coding, 50-task benchmark streams), mostly open
  or mid-size models, and intervals that often cross zero. Effects depend on the model in both directions:
  self-written memory added 0.034 reward for Sonnet 4.6 and 0.317 for Opus 4.7 on one task, a fixed record
  helped the solver weaker without memory in 61 of 64 split cases, and benign notes drove unsafe actions
  in about 80% of episodes for Sonnet 4.6 but about 5% for Fable 5, in scenarios built to probe that failure
  that do not show how often it occurs in deployment. Memory makes tasks depend on their order, so they
  cannot run in parallel and a transient failure silently changes what later tasks see; the 87.5% poisoning
  rate needs an attacker model trained against a copy of the agent (handcrafted payloads scored 0.0% on
  GPT-5.4 and Sonnet 4.6), and brand is an assessment.'
