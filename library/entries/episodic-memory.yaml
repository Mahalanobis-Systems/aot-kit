summary: 'Log every agent session as a raw trace, distill a few verified lessons from them (user corrections,
  definitions, workflows that worked, mistakes) into short memory files, show the agent an index of those
  files at the start of each task, and let it search both. It pays where later tasks need what earlier
  ones learned: Databricks'' data agent went from 22.3% to 68.4% on tasks built from its users'' past
  sessions, with 31% fewer tokens. Elsewhere the gains mostly vanish: with three frontier models two memory
  methods moved average accuracy by -1.1 to +3.0 points over six benchmarks, a no-memory web agent given
  the same tokens beat ReasoningBank by 5.1 to 8.1 points, and off-the-shelf memory systems were at or
  below memory off on coding tasks in 11 of 12 pairings. Unverified lessons reproduce mistakes, and an
  agent that writes memory from what it reads can be poisoned: one crafted email planted a lasting instruction
  in up to 87.5% of test cases.'
how: '1. Start from two baselines on the same tasks and model: no memory, and a no-memory agent that gets
  the memory''s token budget as extra steps (7.b.iii) or reasoning effort (1.b.i). A no-memory web agent
  allowed 15 steps instead of 10 beat ReasoningBank by 5.1 to 8.1 points with three 2026 models, mostly
  at fewer total tokens, and with GPT-5.4, Gemini 3.1 Pro and Claude Opus 4.7 two memory methods moved
  average accuracy by -1.1 to +3.0 points. Build the evaluation stream so later tasks need what earlier
  ones learned (a user''s corrections, metric or table definitions, repository conventions, a workflow
  that was costly to find): that is where memory paid, 22.3% to 68.4% on tasks built from real user sessions.
  2. Log every session as an append-only raw trace (task, steps, tool results, outcome, user feedback),
  and keep a separate set of short distilled memory files (preferences, definitions, workflows, mistakes)
  under an auto-generated index file that says what each file holds. In Databricks'' ablation, raw traces
  alone reached 35.8% (the agent searched them in only about a third of cases), distilled files with the
  index 66.1%, and both 68.4%. 3. Persist a distilled lesson only after a check against ground truth (tests
  pass, the user confirms, the outcome is verified), never on the agent''s own success judgment: on one
  site 52.9 to 59.5% of ReasoningBank''s success-labeled lessons came from tasks that had failed, stored
  lessons trailed raw trajectories in 7 of 9 settings, and a GPT-5.5 check before admitting each lesson
  raised stored-lesson memory from 38.7% to 46.0%. Where nothing can verify a lesson, synthesize guidance
  from the retrieved raw traces for the current task and discard it afterwards (+3.3 to +28.0 points over
  storing it). Write explicit user requests (“Never write scripts in the /tmp dir”) at once. 4. At session
  start inject the index, give the agent search and fetch tools over both stores, and retrieve only a
  few records (the studies used one to five). Inject a short record anchored to the files, tables or fix
  it concerns, not raw transcript chunks or loosely extracted facts: off-the-shelf memory systems were
  at or below memory off in 11 of 12 coding pairings, mostly because the record they injected buried or
  dropped the fix. Keep a separate store per user or domain (an unrelated passage cost 0.7 to 3.4 points)
  and tell the agent a memory is a hint to check against the current task, not an instruction. 5. Consolidate
  offline on a schedule: distill new sessions into the files, merge duplicates, split oversized files,
  resolve conflicts and delete stale entries (offline distillation 63.5% against 53.9% for writes made
  during the session, 66.1% with both). 6. Treat a memory write as a privileged action (10.c.i): only
  the user and verified outcomes may write; never store instructions found in email, web pages, documents
  or tool output; record each entry''s source and show every write to the user. One crafted email made
  agents store and later act on a poisoned memory in 87.5% (GPT-5.4) and 71.4% (Sonnet 4.6) of held-out
  cases when mail was processed in the background, past input, model and trace defenses; asking the agent
  to report what it checked and did cut foreground success from 75.0% to 1.8% and from 48.2% to 23.2%.
  7. Measure with paired runs against both baselines, memory frozen during evaluation, at least three
  seeds: pass rate split into tasks memory rescues and tasks it breaks (it helps where the model fails
  without it and can hurt where it already succeeds), tokens including memory-side calls, steps and latency
  (1.35x faster and 1.44x fewer tokens in Databricks'' test; A-Mem cost up to 6.37x of no memory on GPT-5.4),
  and a poisoning probe; re-run after every model change.'
detect:
  static: Raw session traces kept across tasks or sessions; distilled memory files or a vector store of
    lessons; an index or retrieval step at task start; writes after each task or on user request; a consolidation,
    TTL or decay job.
  traces: Memories retrieved per task, whether the agent read and followed them, and whether they applied;
    memory writes and their source; repeated mistakes the store should have prevented.
  evals: Repeat-mistake rate over time; pass rate with and without memory on a task stream, split into
    rescues and regressions.
  judge: Rate retrieved memories for relevance.
  probes:
    what: A task pair where the first teaches a lesson the second needs, an unrelated task the lesson
      could mislead, and untrusted content that asks to be remembered.
    construct: Run task A with a known pitfall or a user correction, then task B with the same pitfall
      and task C where the lesson does not apply; then feed a page or email containing a "remember this"
      instruction and check whether it is stored and acted on in a later session.
  primary:
  - evals
  - probes
