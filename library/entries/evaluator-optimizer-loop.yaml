summary: 'Have a separate, skeptical evaluator check each output against written criteria and send back
  specific findings, revising until it passes or a low round cap. It pays when the task is beyond what
  the generator does reliably in one pass and the evaluator is at least as strong and sees every requirement:
  a production diff judge vetoed about a quarter of coding-agent sessions and half of those recovered,
  and a strong grader lifted a weak writer''s projects more than the writer''s own grading did. On strong
  current models most of the gain is extra budget: given the same rounds without feedback, Opus 5.5 and
  GPT-6 Sol came within a point of the loop, and at equal calls best-of-four sampling matched or beat
  a reviewer loop in 13 of 16 code-quality comparisons. It backfires when the evaluator is weak, blind
  to the requirements or gamed: feedback from a judge that could not see the instructions left outputs
  worse than no feedback and worse each round, judge loops degraded table extraction and inflated essay
  scores, and attackers revised code to a reviewer''s findings to get vulnerable changes approved.'
how: '1. Start from three baselines: the single pass tuned with the same effort, best-of-N at equal calls,
  and the same model given the same extra rounds or budget with no feedback. Add the loop only where outputs
  often fall short and no compiler, test or execution check can judge them (if one exists, feed its verdict
  back instead, 9.a.i). On strong current models the baselines take most of the gain: with seven models
  as writers and graders of data science projects, Opus 5.5 and GPT-6 Sol scored 94% and 93% after two
  rounds of feedback against 93% and 92% revising twice without it, and at four calls best-of-four ranked
  by a static analyzer matched or beat a coder-reviewer loop in 13 of 16 code-quality comparisons. The
  loop paid for weaker writers (GPT-6 Luna 78% to 87%) and where the writer had broken a rule without
  knowing it (Haiku 4.5, 8% to 45%, once told its data were generated, not real). 2. Write the evaluator''s
  criteria as a few gradable items, each with a hard pass threshold, and calibrate it with a few scored
  examples; where possible let it check by acting (drive the app with Playwright, run the code and read
  the result, compare the diff with the original request). Show it everything the output must respect:
  the request, the system prompt or policy, and the source the output draws on. In one study, revising
  on reports from a judge shown only the response cut instruction constraints met from 84% to 70% in one
  round while a revise-only control rose to 87%, and it fell again each round; a judge that saw the request
  without its separately stated constraints still lost 8 points. The same criteria in the generator''s
  prompt also steer the first draft. 3. Make the evaluator separate and skeptical: its own call and context,
  not the generator''s dialogue history, and a model at least as capable as the generator. A stronger
  grader lifted a weak writer (Haiku 4.5''s final projects scored 45% by other graders when Opus 5.5 graded
  the rounds, 36% when it graded itself), weaker graders did not improve stronger writers, and models
  grading their own work scored it about 9 points higher than other graders did. Tune its prompt by reading
  its logs against your own verdicts until it stops approving problems it found. Check it on labeled good
  and bad outputs and planted-defect probes before wiring it in, including defects the rubric does not
  name: seven graders'' marks barely moved for planted errors such as tests that assert nothing or a wrong
  headline result. A judge from another model family does not remove favoritism (judges favor any model
  whose mistakes resemble theirs), and content-free answers such as '':'' or ''Thought process:'' can
  pass it, so include them among the probes. 4. Return findings the generator can act on (failing criterion
  or checklist item, where, expected against actual) rather than a score: told which checklist items failed,
  Gemini 2.5 Pro went from 29.5 to 94.7, against -2.5 to +2.6 with no feedback, and in another study a
  bare 1 to 5 score gained less than no report at all (+3.6 against +5.9 points). Net gain follows the
  precision of the findings, since false findings make the generator break what was right (acting only
  on a blind judge''s most severe complaint cut its harm by about 60% but did not remove it); tell the
  generator to keep what already passed, because unconstrained regeneration breaks parts that were right.
  5. Stop on pass or after a low cap, and raise the cap only if the per-round curve keeps rising on an
  independent check: most gain came from the first round of feedback (+13 points, then +5, with 35 of
  147 runs falling in the third round), and other studies found most in the first 2 to 4 rounds. Give
  each revision room to finish: revisions that ran out of tool calls or time broke 24 of 99 working projects,
  against 2 of 115 that ended on their own. Return the best version rather than the last, and stop early
  when the score stalls or drops. 6. When the author is also an agent (code-review bots), make the loop
  converge: the two can keep each other busy indefinitely (one pull request ran more than fifty review-and-fix
  rounds overnight, and 59% of repeat flags were on code there since the first pass). After the first
  passes re-review only the new diff, never repeat a posted finding, flag a bug class once, and after
  three rounds ask the author to reconsider the approach; at Anthropic mean reviews to pass fell from
  2.08 to 1.32 and pull requests needing five or more rounds from 8.9% to 1.5%. Where the author may be
  adversarial or the change is security-relevant, also re-check the whole change against the original
  requirement before approval: an attacker revising code to an AI reviewer''s findings got exploitable
  changes approved in 20.8% of 159 cases within five rounds, while re-inspecting the whole diff each round
  caught 22 and a root-cause check 23 of the 33 that ordinary review approved. 7. Measure against a check
  the loop never sees (a human-labeled sample or a deterministic metric), per round and against the no-feedback
  and best-of-N baselines: quality, share of items that end worse than their first output, evaluator agreement
  with the audit, tokens and latency. Re-grade a sample several times to learn the evaluator''s own noise:
  in one study about half of later-round score changes were within it.'
detect:
  static: 'A generate, evaluate, revise loop: a separate evaluator call, model or tool-using agent scores
    the output against written criteria and returns feedback, with a pass threshold and a round cap. Flag
    an evaluator that shares the generator''s dialogue history, one weaker than the generator, one not
    shown the request, policy or source the output must respect, feedback that is only a score, no cap,
    re-review that repeats posted findings, or a loop that returns the last version instead of the best.'
  traces: Rounds per item and rounds to pass; evaluator score per round next to an independent check;
    veto rate and recovery after a veto; items whose evaluator score rose while the independent check
    fell; revisions that rewrote parts that had passed or ran out of budget; findings repeated on code
    unchanged since the first pass.
  evals: Quality per round on a grader the loop never sees, against the same model given the same rounds
    or budget without feedback and against best-of-N at equal calls; share of items that end worse than
    their first output; evaluator agreement with human or gold labels, and the spread of its scores when
    it re-grades the same output.
  judge: The evaluator is a judge; a meta-judge checks its agreement with humans.
  probes:
    what: Items with a clear rubric and a known defect.
    construct: Seed outputs with one planted defect each, including defects the rubric does not name (tests
      that assert nothing, a wrong headline result); the evaluator must catch it and the refiner must
      fix it.
  primary:
  - traces
  - probes
impact:
  quality:
    effect: mixed
    size: medium
    when: 'gains where the generator falls short and the critic is reliable: CodeContests 7.88 to 16.24
      with a trained critic over five rounds, 12.48 with GPT-4o as critic (Xie, Feb 2025); a weaker writer''s
      projects 87% against 78% revising without feedback (Alexander, Nov 2026); little on strong generators:
      Opus 5.5 94% against 93% without feedback (Alexander, Nov 2026), Self-Refine +4.6 and +1.9 points
      over a tuned single call (Leins, Aug 2026), best-of-four matched or beat a reviewer loop in 13 of
      16 code-quality cells (Kadam, Oct 2026); losses where the judge is weak or blind: constraints met
      84% to 70% with a judge that could not see the instructions (Kumar, Oct 2026), table extraction
      0.792 to 0.772 TEDS after 8 rounds (Kim, Jul 2026), essay judge scores rose while human scores fell
      (Pan, Jul 2024)'
    basis: evidence
  cost:
    effect: degrades
    size: medium
    when: 'an evaluator call plus a revision per round: Self-Refine took 1.82 to 2.13 times the tokens
      of a tuned single call (Leins, Aug 2026); each revision round of a data science project cost $0.32
      to $0.35 on average against $0.68 for the first submission (Alexander, Nov 2026); in one app build
      the QA rounds cost $3.24, $3.09 and $4.06 of $124.70, and the rebuilds they triggered $36.89 and
      $5.88 (Rajasekaran, Mar 2026); before a round cap, pull requests took 2.08 reviews on average to
      pass (Osmani, Oct 2026)'
    basis: evidence
  performance:
    effect: degrades
    size: large
    when: serial rounds; an evaluator that clicks through the running app took 6.8 to 9.6 minutes per
      round, and a 5 to 15 round design loop ran up to four hours (Rajasekaran, Mar 2026); without a cap,
      an agent author and an agent reviewer ran more than fifty rounds overnight on one pull request (Osmani,
      Oct 2026)
    basis: evidence
  security:
    effect: degrades
    size: medium
    when: 'where the author may be adversarial, the evaluator''s findings guide it: revising code to an
      AI reviewer''s findings got exploitable changes approved in 20.8% (Sonnet 5 reviewer) and 15.7%
      (GPT-5.5) of 159 cases within five rounds, against 8.2% and 1.3% for the strongest text- or comment-based
      attack, and 11.9% when the reviewer gave only its verdict; a root-cause check each round caught
      23 of 33 (Gong, Oct 2026)'
    basis: evidence
  governance:
    effect: improves
    size: small
    when: Criteria are explicit.
    basis: assessment
  brand:
    effect: improves
    size: medium
    when: Polished output.
    basis: assessment
  primary:
  - quality
  - performance
