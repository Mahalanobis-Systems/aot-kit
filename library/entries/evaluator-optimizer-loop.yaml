    grades a generator's frontend or full-stack app and sends its critique back for the next round
  effect: '"tuning a standalone evaluator to be skeptical turns out to be far more tractable than making
    a generator critical of its own work". Out of the box the evaluator would "identify legitimate issues,
    then talk itself into deciding they weren''t a big deal and approve the work anyway"; it took several
    rounds of prompt tuning. Design loop: 5 to 15 iterations; scores "improved over iterations before
    plateauing", and the author "regularly saw cases where I preferred a middle iteration over the last
    one". App build on Opus 4.6: QA rounds cost $3.24, $3.09 and $4.06 of a $124.70 run and caught display-only
    and stubbed core features; the evaluator "is worth the cost when the task sits beyond what the current
    model does reliably solo."'
