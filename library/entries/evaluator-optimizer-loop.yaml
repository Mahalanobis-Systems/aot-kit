caveats: 'Most studies are small or single-run (one app per harness, 150 Bash questions, 23 essays, one
  single-author study of 147 runs on one assignment), and the largest critic gain came from a critic trained
  for its generator, which is closer to 7.c.ii; prompted critics, GPT-4o included, helped less and over
  five rounds cut MBPP+ from 77.83 to 74.60. On outputs with no deterministic check the evaluator''s own
  error decides the sign: judges tied, inflated scores, missed planted errors and were gamed when they
  shared the generator''s blind spots or context or could not see the requirements, and in one study about
  half of later-round score changes fell within the grader''s own repeat noise. Gains shrink as generators
  improve: Anthropic found the evaluator unnecessary overhead for tasks within the newer model''s reach,
  the strongest current writers came within a point of the loop when given the same rounds without feedback,
  and in one study the loop helped only the weakest of six generators. The code-review convergence figures
  are a vendor''s before-and-after on its own pull requests, the blind-judge harm was measured with small
  open responders, and the 2 to 4 round finding comes from a setup where ground truth decided which answers
  got feedback, so it describes a best case.'
