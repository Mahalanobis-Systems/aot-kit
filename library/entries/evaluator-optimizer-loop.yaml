- source: 'Nitish Kumar, Prateik Pothuneedi, Greg Bandak (Hosho), "The Anatomy of a Blind Spot: What an
    LLM Judge Must Be Shown, and How Much", https://arxiv.org/abs/2610.15938'
  date: '2026-10-11'
  task: 'A judge''s defect report goes back to the model that wrote the output, which revises it; a programmatic
    checker (IFEval''s constraint checker, GSM8K''s answer key, HaluEval answers) scores the revision.
    Arms: a judge shown only the output (blind), one also shown the instruction or source (informed),
    typed constraint ids, a perfect checker certificate, and a no-report control told only to revise;
    one and three rounds; report channel varied (1 to 5 score, free text, typed ids); 83 predictions committed
    before running'
  effect: 'IFEval, 1,080 responses and 1,664 constraints, one round: constraints passing 84% before; blind
    judge 70% (-0.145, breaking 331 constraints and fixing 90), no-report control 87% (+0.025, fixing
    98 and breaking 56), informed judge 88% (+0.038), certificate 90%; "a blind judge''s reports leave
    the system worse off than no report at all". Over three rounds the blind judge''s pass rate fell from
    0.851 to 0.731, 0.706 and 0.683, while the informed judge gained +0.048, +0.025 and +0.002 and the
    no-report control ended at 0.899. A judge shown the user''s request with the constraints removed (as
    if they sat in a system prompt) still gave -0.080, 13.9 points below the no-report control. Report
    channel: a bare 1 to 5 score +0.036, below the no-report control''s +0.059; free text +0.059; certificate
    +0.074; net gain followed report precision. Acting only on the most severe complaint cut a blind judge''s
    harm from -0.101 to -0.038. On GSM8K an instruction to revise with no content broke 69 of 265 correct
    solutions. With Claude Haiku 4.5 as judge, the blind judge again ended below the start on all three
    corpora (-0.092 on IFEval) and the informed judge improved all three (+0.071, +0.157, +0.057).'
