- source: Rohan Alexander, "Iterated creation, grading, and revision of data science projects by language
    models", https://arxiv.org/abs/2611.05548
  date: '2026-11-03'
  task: 'A writer model with a shell and file tools builds a complete data science project (download,
    clean, test and analyze a dataset, write a short paper); a neutral executor runs it and a grader model
    scores it against a 26-item rubric with comments; the writer revises twice. Every model is both writer
    and grader (49 pairs, three runs each); controls: two revision rounds with the same budget and no
    feedback, and one session with the whole budget; all seven graders also score the first and final
    submissions'
  effect: 'Scored by each run''s own grader, the average rose from 59% to 76% (+13 points after the first
    feedback round, +5 after the second, when 35 of 147 runs fell); by writer +3 points for Opus 5.5 (92%
    to 95%) and +46 for Haiku 4.5. Scored by the six other graders, final submissions averaged 73% with
    feedback, 65% after revising twice without feedback and 63% from one session with the whole budget:
    Opus 5.5 94%, 93% and 95%; GPT-6 Sol 93%, 92% and 90%; GPT-6 Luna 87%, 78% and 85%; Haiku 4.5 45%,
    8% and 0% ("the grader tells it that its data are generated"). "For these writers most of what looks
    like the effect of feedback is the effect of being able to do more work." Haiku 4.5''s final projects
    got 45% from the other graders when Opus 5.5 graded the rounds against 36% when it graded itself;
    GPT-6 Sol''s got 91% with Haiku 4.5 as grader against 95% with Opus 5.5: "weaker models generally
    do not improve stronger models". Self-grading ran about 9 points above other graders; 45% of second-round
    and 51% of third-round score changes were within the grader''s own repeat-grading noise. 26 of 294
    revisions broke a working project, 24 of them when the writer ran out of tool calls or time (2 of
    the 115 revisions that ended on their own broke one). Of seven planted errors in one submission, only
    fabricated data moved the graders'' average mark much (95% to 14%); the others left it at 90% to 95%.'
  conditions: Seven models (Claude Opus 5.5, Claude Haiku 4.5, GPT-6 Sol, GPT-6 Luna, DeepSeek V4.1 Flash,
    Gemini 3.8 Flash, GLM-5.3 Flash) as writers and graders; one undergraduate-style assignment; 147 runs
    of three rounds (60 tool calls and 40 minutes for the first, 40 and 30 for each revision); graders
    see the files, an execution report and the rubric; no human grading of the model projects (on 56 student
    projects the graders' marks were far below teaching assistants', mean absolute error 13.9 to 48.1
    points); single author; $675 in total
  direction: mixed
  measured: true
  locator: Abstract; §2.3; §3.2; §3.3; §3.4; §4; Appendices 2, 5, 6, 7
