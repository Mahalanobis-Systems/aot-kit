    second judge (GPT-6.1 Sol) rated the loop better on 1 of 4 models and worse on 2; "much of their reported
    gain over a single shot is a budget effect". On Codeforces contests held after every model''s cutoff
    no technique differed from best-of-n or the single shot beyond the interval on any model; on Opus
    5.5 the reviewer loop scored 65.86% pass@1 against 69.82% for the single shot and 68.03% for best-of-four.
