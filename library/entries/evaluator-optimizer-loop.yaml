caveats: 'Most studies are small or single-run (one app per harness, 150 Bash questions, 23 essays), and
  the largest critic gain came from a critic trained for its generator, which is closer to 7.c.ii; prompted
  critics, GPT-4o included, helped less and over five rounds cut MBPP+ from 77.83 to 74.60. On outputs
  with no deterministic check the evaluator''s own error decides the sign: judges tied, inflated scores
  and were gamed when they shared the generator''s blind spots or context. Gains shrink as generators
  improve: Anthropic found the evaluator unnecessary overhead for tasks within the newer model''s reach,
  and in one study the loop helped only the weakest of six generators. The 2 to 4 round finding comes
  from a setup where ground truth decided which answers got feedback, so it describes a best case.'
