    33 (20.8%). Letting the attacker also edit the PR text and reply to the reviewer: 70 of 159 (44.0%).
    "reviewers accept repairs of reported problems while overlooking surviving vulnerabilities." Defenses
    on the 33 attacks default review approved: re-inspecting the whole diff each round caught 22, checking
    the vulnerability''s root cause 23, a blocking static scan 20, a different model (Fable 5.1) 18, executing
