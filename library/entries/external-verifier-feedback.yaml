  task: Run a frontier model in a loop that edits one proof file, shows Lean compiler feedback after every
    edit, enforces final validation and starts another round with the verdict after each rejection; compare
    with loops that leave stopping to the model or regenerate the whole proof
  effect: 'Same Claude model (Opus 4.8): native Claude Code solved 63 FATE-X problems, Claude Code with
    h1''s Lean tools and prompt 73, and h1, which also enforces validation and another repair round after
    rejection, 83 (PutnamBench subset 81 / 95 / 99). Of 30 problems h1 solved where native Claude Code
    stopped without an accepted proof, 28 ended with an artifact the validator rejected; on one problem
    Claude Code with the tools resubmitted an unchanged file 170 times while h1 edited after each of 17
    rejections and succeeded. Same Gemini 3 Flash and $20 cap: AxProverBase, which regenerates a complete
    proof after each feedback round, solved 18 Putnam100 problems against h1''s 69, at $17.39 per problem
    (89% of it output) against $9.00 (34%). With only the working file and compiler feedback (no search
    tools, REPL or language server) h1 solved 49 Putnam100 and 49 FATE-X problems against 69 and 63 with
    all tools. Reflecting after every turn gave 50 and 39 solves against 72 and 65 every ten turns, at
    roughly twice the cost per solve. Gemini 3.1 Pro solved 99 Putnam100 problems at $5.34 each with high
    reasoning effort against 89 at $20.63 with low effort.'
  conditions: Lean 4 formal proofs; PutnamBench subset (100), FATE-X (100), FormalConjectures; Claude
    Opus 4.8, Gemini 3 Flash, Gemini 3.1 Pro and others under fixed dollar caps per problem; ablations
    are one run per arm; the authors ran the Claude Code and AxProverBase comparisons and note they could
    not control Claude Code's internal retries; the 63 to 73 to 83 steps also change prompt and tools,
    so they are not pure enforcement effects; a proof checker is a near-perfect check that most tasks
    lack; independent of the practice.
