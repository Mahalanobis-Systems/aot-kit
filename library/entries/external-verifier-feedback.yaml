summary: 'Have the harness check every output with something the model cannot fool, such as tests, a compiler,
  a schema or policy check, execution or a solver, and send the verdict back for another try. With a current
  reasoning model, resampling until a sound checker accepted added up to 18.2 points where a comparable
  loop judged by an LLM critic moved accuracy between -2.7 and +3.1; pass/fail with the first error is
  usually enough, generated SQL can be repaired from execution errors, and checking SQL against governed
  rules took 0.15 retries per question in one system. The check works only if the harness enforces it
  and the agent cannot change it: an agent left to decide when to stop gave up on 30 solvable problems,
  28 of them with a proof the validator had rejected, agents edited or special-cased tests they could
  see (a test-feedback loop raised cheating on impossible tasks from 33% to 38%), and visible tests overstated
  held-out correctness by 43-48 points for one frontier agent building whole systems. So keep tests read-only
  or hidden, score on a held-out check, let the agent flag a check it thinks is broken, and do not add
  a same-model critique step (7.c.i): on older models it cut accuracy (GPT-3.5 on CommonsenseQA 75.8%
  to 38.1%), and a verification tool one optimizer added raised GAIA 5.75 points but cut SimpleQA 17.8.'
how: '1. Start from the baseline: on the eval set or recorded runs, log how often outputs reach the user
  failing a check you could have run (build, tests, type or schema check, SQL that fails EXPLAIN or names
  a table that does not exist, a policy rule), plus pass rate, rounds, tokens and latency per task. Set
  aside a held-out check the agent never sees (hidden tests, gold answers or review) to score the change,
  because the loop will optimize whatever check it is given. 2. Pick the sound check the task admits and
  wire it to every output: compiler, type checker, linter or language-server diagnostics after each edit;
  unit tests; JSON or schema validation; for plans, proofs and puzzles a validator, proof checker or solver;
  for tool use, the policy written as code that rejects a violating call (it raised one agent''s safety
  score from 48.75% to 58.34%). For SQL, run EXPLAIN and execute, check for hallucinated tables and columns
  and repair from the error (removing one fixer cut successful compilation from 95% to 76%), validate
  against approved metrics, joins, filters and row-level security where they exist, and run read-only
  with timeouts and row caps (10.a.i). 3. Put the check where the agent cannot change it: keep tests and
  checker config read-only or hidden (hiding tests cut cheating on impossible tasks to near zero but cost
  legitimate solves; read-only kept performance and stopped test edits but not special-casing), and do
  not let the agent write the check it is judged by (9.c.i). Judge coverage, not the green light: frontier
  agents saturated visible feature tests while failing held-out tests that combine those features, by
  43-48 points for one agent building whole systems. 4. Enforce it in the harness, not the prompt: accept
  no answer until the check passes, and on a failure start another round with the verdict and require
  an edit before resubmitting (one agent resubmitted an unchanged proof 170 times). Feed back pass/fail
  with the first concrete error (compiler message, failing test, violated rule); in one planning study
  more detail than pass/fail helped only on Blocksworld (60% to 87%). Let the agent edit in place with
  feedback after every edit rather than regenerate the whole output (69 against 18 proofs at the same
  model and budget). Where only the final answer can be checked, resample until the check accepts; where
  intermediate states can be checked, check them during the run (on a maze task 88.8% with a final-answer
  check against 97.9% with checks during the run). 5. Bound the loop and give it an exit: cap rounds (one
  SQL system allowed three revisions and averaged 0.15 per question), stop runs that repeat or stall (7.b.i)
  and size budgets so productive runs can finish (7.b.iii). Let the agent flag a check it believes is
  wrong, or abstain when no answer passes, instead of working around it: an abort option cut GPT-5''s
  cheating on impossible tasks from 54% to 9%. 6. Where no sound check exists, do not substitute the model''s
  own critique: with a current reasoning model a comparable loop judged by an LLM critic moved accuracy
  by -2.7 to +3.1 points while resampling until a sound checker accepted added up to 18.2. Check completion
  against the environment (9.b.iii), use a trained detector (9.b.ii) or spend on parallel samples with
  a vote (9.c.ii), and test any added verification step on every task type. 7. Measure: run the paired
  eval at equal budget with no check, pass/fail feedback, full error text and resampling until the check
  passes; report end quality on the held-out check, the check-failure rate on the first attempt and on
  returned outputs, rounds per task, tokens and latency, and gaming signals (test or checker edits, special-cased
  inputs, identical resubmissions); add probes whose tests contradict the specification, where any pass
  is gaming.'
detect:
  static: no step runs the build, tests, linter, schema check, policy rules or execution on the output
    before it is returned, or the agent can finish without the check passing; tests or checker config
    the agent can write to; a critique or reflect step where the same model reviews its own answer with
    no tool output or environment state in the loop
  traces: errors a compiler, test, schema or policy check would catch reaching the final answer; SQL errors
    and hallucinated table names; runs that end after a failed or never-run check; identical resubmissions
    after a rejection; edits to test files, special-cased test inputs or overloaded comparisons; answers
    changed after a critique turn with no new external information; failure rows labeled tool-feedback-neglect
    or satisficing
  evals: failures a deterministic check would have flagged; a gap between the pass rate on checks the
    agent saw and on held-out checks; accuracy before and after any critique step
  probes:
    what: Tasks whose visible tests contradict the specification, so any pass is gaming, and tasks scored
      on a held-out check that combines features the visible tests check one at a time.
    construct: Change one expected value in a visible test, or duplicate a test with a conflicting expected
      output, and keep the task only if both a reference solution and an empty one fail it; run the agent
      with its feedback loop on and count passes, test-file edits and special-cased inputs; for held-out
      checks, write tests that compose the features the visible tests cover separately and compare the
      two pass rates.
impact:
  quality:
    effect: improves
    size: large
    when: 'sound check in the loop: Blocksworld 40% to 87% (Stechly, Feb 2024); removing an SQL fixer
      cut successful compilation from 95% to 76% (Chen, Jul 2025); resampling until a sound checker accepted
      raised ZebraLogic-XL from 79.2% to 97.4% where a comparable LLM-critic loop reached 82.3%, and policy
      checks written as code took a Qwen3-30B agent on telecom tasks from 32.17% to 42.11% (87.70% with
      rules debugged on traces) (Bhat, Feb 2026); exposing the Lean validator and enforcing it lifted
      the same Claude model from 63 to 83 FATE-X proofs (Moalla, Oct 2026); limits: agents game checks
      they can see or edit (GPT-5 passed 54% of impossible SWE-bench tasks; Zhong, Oct 2025) and visible
      tests overstated held-out correctness by 43-48 points for Claude Code on 30 systems-building tasks
      (Zhao, May 2026); same-model critique cut GPT-3.5 on CommonsenseQA from 75.8% to 38.1% (Huang, Oct
      2023)'
    basis: evidence
  cost:
    effect: degrades
    size: small
    when: 'retries add calls only when the check fails: 0.15 retries per question (at most 2), with the
      system''s 5x tokens coming from its grounding prompt rather than the retries (Pillai, Jul 2026);
      resampling until a sound checker accepted used 106% to 270% of one attempt''s tokens and checks
      inside the trace 62% to 153%, below one attempt where feedback cut unproductive reasoning (Bhat,
      Feb 2026); loop design matters more than the check: the same model cost $9.00 per problem editing
      in place against $17.39 regenerating the whole proof each round, and reflecting after every turn
      about doubled the cost per solve (Moalla, Oct 2026)'
    basis: evidence
  performance:
    effect: degrades
    size: small
    when: governed SQL with its validate-and-retry loop took 7.8 s against 6.1 s per question for direct
      text-to-SQL (about 1.3x), mostly from its larger prompt (Pillai, Jul 2026); each failed check adds
      a model call and a check run
    basis: evidence
  security:
    effect: improves
    size: medium
    when: 'policy rules written as code that reject unsafe tool calls raised AgentSafetyBench safety from
      48.75% to 58.34% (72.31% with per-task checks) for one Qwen3-30B agent (Bhat, Feb 2026); SQL checked
      against row-level-security rules and retried had 0 violations on four models where ungoverned single-pass
      baselines leaked on 7.5% to 13% of adversarial questions, though only the governed arm was given
      the user''s access predicate (Pillai, Jul 2026); a check the agent can edit is itself a target:
      agents edited tests or special-cased them to pass (Zhong, Oct 2025)'
    basis: evidence
  governance:
    effect: improves
    size: medium
    when: 'rules enforced by a check held at zero filter violations with no run-to-run variance across
      four models, against 41% to 48% for ungoverned baselines, but weaker models executed fewer queries
      (Pillai, Jul 2026, confounded as above); an option to flag a broken check leaves a record instead
      of a silent workaround (Zhong, Oct 2025); a passing check certifies only what it covers: visible
      tests were saturated while held-out tests failed (Zhao, May 2026)'
    basis: evidence
  brand:
    effect: unknown
  primary:
  - quality
measure:
- method: experiment
  tier: 3
  how: 'paired eval at equal budget: no check, the check with pass/fail and first-error feedback, full
    error text, resampling until the check passes, and any proposed critique step; score end quality on
    a held-out check the agent never sees (hidden tests, gold answers or review) as well as the check-failure
    rate on the first attempt and on returned outputs, rounds per task, tokens and latency; include probes
    whose tests contradict the specification, where any pass is gaming'
- method: monitor
  how: 'in production traces: share of outputs returned without a passing check, rounds to pass, runs
    that hit the round cap, identical resubmissions, edits to test files or checker config, special-cased
    inputs, and flags or abstentions; audit a sample of passed outputs against a held-out check or human
    review, since the loop''s own pass rate can rise while true correctness does not'
