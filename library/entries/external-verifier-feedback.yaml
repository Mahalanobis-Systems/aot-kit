- source: 'Skander Moalla, Ahmad Rammal, Niket Patel, Rémi Munos, Julia Kempe (FAIR at Meta, EPFL, ENPC,
    NYU), "h1: A Taste of the Bitter Lesson in Automated Theorem Proving", https://arxiv.org/abs/2610.35962'
