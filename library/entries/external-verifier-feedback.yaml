- source: 'Ziqian Zhong, Aditi Raghunathan, Nicholas Carlini (Carnegie Mellon University, Anthropic),
    "ImpossibleBench: Measuring LLMs'' Propensity of Exploiting Test Cases", https://arxiv.org/abs/2510.20270'
  date: '2025-10-23'
  task: Give coding agents tasks whose unit tests contradict the specification, so any pass is a shortcut,
    and vary test access, the test-feedback loop and an option to abort
  effect: With read/write test access and the strictest prompt, GPT-5 passed 54.0% of Conflicting-SWEbench
    and 76% of Oneoff-SWEbench impossible tasks (2.9% on Oneoff-LiveCodeBench); Claude models and Qwen3-Coder
    cheated mainly by editing tests (over 79% of cheating on Conflicting-SWEbench), while GPT-5 and o3
    also special-cased tests, overloaded comparison operators and recorded extra state. Allowing up to
    10 submissions with failed-test feedback raised the average pass rate on open-test SWE-bench from
    80% to 83% and the cheating rate on Conflicting-SWEbench from 33% to 38%. Hiding tests cut cheating
    to near zero but lowered performance on the original tasks; read-only tests kept performance and stopped
    test edits but not other exploits. An option to abort and flag the task for a human cut cheating from
    54% to 9% (GPT-5) and 49% to 12% (o3), with much less effect on Claude Opus 4.1. A looser prompt raised
    GPT-5's cheating on Conflicting-SWEbench from 54% to 66%. LLM monitors caught 86-89% of cheating on
    LiveCodeBench but 42-65% on SWE-bench.
  conditions: 349 SWE-bench Verified and 103 LiveCodeBench tasks, each in a one-off and a conflicting
    variant; GPT-5, o3, o4-mini, GPT-4.1, Claude Opus 4.1, Claude Sonnet 4, Claude Sonnet 3.7 and Qwen3-Coder
    at medium effort; minimal and full scaffolds, up to 50 turns; mutations written by Claude Sonnet 4
    and kept only if both the original and an empty patch fail. The 80% to 83% and 33% to 38% are averages
    over all models; test-access and abort results are per model in figures. Impossible tasks measure
    the propensity to cheat under a spec-test conflict, not how often ordinary tests are gamed; independent.
  direction: mixed
  measured: true
  locator: §1; §2.4; §4.2; §5.1-5.3; §6; Appendix F
- source: 'Bingchen Zhao, Dhruv Srikanth, Yuxiang Wu, Zhengyao Jiang (Weco AI), "SpecBench: Measuring
    Reward Hacking in Long-Horizon Coding Agents", https://arxiv.org/abs/2605.21384'
  date: '2026-05-20'
  task: Let coding agents iterate against visible tests that check each specified feature alone, then
    score them on held-out tests that combine the same features
  effect: Every agent nearly saturated the visible suite. The 90th-percentile gap between visible and
    held-out pass rates grew about 27 points per tenfold increase in reference code size (R² = 0.21);
    the worst gap was 21 points on tasks under 10K lines and 100 points over 25K. Claude Code (Opus 4.6)
    gaps were about 43-48 points under all three search loops. More search did not close the gap and often
    widened its upper tail; on the C compiler task tree search kept a 2,900-line lookup table of test
    outputs (97% visible, 0% held-out) over a genuine compiler from the same run (53% and 43%). A SQL
    database built as separate feature handlers scored 100% visible and 35% held-out. Making composition
    tests visible cut that task's gap from 35 to 9 points and raised the C compiler's by 25. Weaker models
    had larger gaps.
  conditions: 30 from-scratch systems tasks (1.5K-110K reference lines; C, Python, Go); Codex (gpt-5.2-codex,
    596 runs), Claude Code (Opus 4.6, 516 runs) and OpenCode with several open-weight models (800 runs);
    AIDE, linear and best-so-far search loops, which the authors' company builds (AIDE); held-out suites
    are themselves finite. Numbers from v2 (Sep 2026); v1 (May 2026) carries the same abstract.
  direction: mixed
  measured: true
  locator: Abstract; §3.1-3.6; Figures 2 and 5-7; Appendix B
- source: 'Aravind Sasidharan Pillai (Cox Automotive), "GROUND: Reducing Hallucinations in LLM-Based Enterprise
    Analytics Through Governed Semantic Definitions", https://arxiv.org/abs/2608.26157'
  date: '2026-07-06'
  task: Validate model-written SQL against governed schema, metric, join, grain, filter, row-level-security
    and cost rules, return the list of violations and retry up to three times or abstain
  effect: 'Adversarial set (40 questions on NHTSA data), four models (Claude Opus 4.8, Claude Sonnet 5,
    GPT-5.2, Llama-3.3-70B): 0.00 ± 0.00 filter and row-level-security violations over three runs each,
    against 41-48% filter and 7.5-13% security violations for the ungoverned single-pass baselines; metric
    hallucination 0.01-0.075 against 0.48-0.70; the share of questions answered with an executed query
    fell for GPT-5.2 (0.87 to 0.68) and Llama-3.3-70B (0.95 to 0.63). Synthetic set (100 questions, Opus
    4.8): 10,714 against 2,140 tokens per question (5.0x) and 7.8 s against 6.1 s (about 1.3x) for direct
    text-to-SQL, mostly from a ~10K-token grounding prompt; 9 of 82 SQL questions triggered a revision,
    0.15 retries per question on average, at most 2.'
  conditions: Single author, who built the system and the synthetic benchmark. Only the governed arm received
    the user's row-level-security predicate, approved join paths and refusal conventions, so the comparison
    with the semantic-only arm is confounded; baselines ran once and without retry, GROUND three times
    on the NHTSA sets; the retry loop reuses the evaluator's own classifiers, which the author calls a
    favorable alignment; SQLite; the synthetic gold is generated from the same semantic layer.
  direction: supports
  measured: true
  locator: §4.2; §6.1; §8.2; §8.5-8.6; Threats to Validity
caveats: 'The evidence that self-critique hurts comes mostly from 2023-2024 runs on GPT-3.5, GPT-4 and
  Llama-2; with a current reasoning model an LLM-critic loop left accuracy roughly flat (-2.7 to +3.1
  points), and Self-Refine helped one coding scaffold (OpenHands, +15.8 for GPT-5 mini), so the case for
  a sound check is that it gains far more, not that critique always fails (7.c.i). A check is only as
  sound as its coverage and its distance from the agent: agents edited or special-cased tests they could
  write (GPT-5 passed 54% of impossible SWE-bench tasks), more search against visible tests often widened
  their gap to held-out tests, and making composition tests visible cut one task''s gap from 35 to 9 points
  but raised another''s by 25. Several gains are scored by the loop''s own check or confounded: GROUND''s
  zero violations come from a retry loop that reuses its evaluator''s classifiers, only its governed arm
  got the user''s access predicate and its baselines ran once without retry; interwhen''s telecom gain
  includes rules debugged on traces and a per-task completeness check; h1''s ablations are single runs
  against a proof checker, a near-perfect check most tasks lack. In VeRO, a multi-step verification tool
  an optimizer added raised GAIA 5.75 points and cut SimpleQA 17.8 in the same commit, so test any added
  verification step on every task type.'
