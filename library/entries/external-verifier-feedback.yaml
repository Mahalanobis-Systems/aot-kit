  effect: 'Qwen3-30B-A3B-Thinking, accuracy against one attempt (Game of 24 / ZebraLogic-XL / Verina-Code
    / Verina-Spec: 95.0 / 79.2 / 56.1 / 25.4): generate-and-test revising on an LLM critic''s feedback,
    up to four rounds, 96.1 / 82.3 / 53.4 / 25.9 at 92-120% of the tokens (-2.7 to +3.1 points across
    all seven tasks); best-of-4 with the same model as critic 97.4 / 70.8 / 56.6 / 27.0 at about 4x; resampling
    until a sound final-answer checker accepts, up to four rounds, 99.49 / 97.40 / 64.02 / 33.33 at 106-270%
    (+18.2 on ZebraLogic-XL); verifier feedback inside the trace in one run 97.2 / 90.6 / 71.6 / 37.0
    at 62-134% (62-153% across all seven tasks). On Maze and SpatialMap, where the final-answer check
    could not decide, resampling stayed at 88.80 and 74.80 (one attempt 88.5 and 74.7) while checks inside
    the trace reached 97.73 and 84.73 in one run and 97.93 and 85.33 with the same four-round budget.
    Agentic: telecom tasks (tau2-bench, solo) pass^4 32.17% to 42.11% with checks derived from the policy
    alone and 87.70% with rules debugged on traces plus a per-task completeness check, at 96.93% of the
