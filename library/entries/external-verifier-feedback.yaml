legacy_id: T43
slug: external-verifier-feedback
name: Feed back a sound external verifier's verdict; never the model's own critique
kind: technique
status: card
tiers:
- tier: 2
  why: 'error recovery: catches outputs the check can reject'
- tier: 3
  why: when repairs change answer quality
