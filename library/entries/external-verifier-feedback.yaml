# 9.a.i: Feed back a sound external verifier's verdict; never the model's own critique
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 9.a.i
legacy_id: T43
slug: external-verifier-feedback
name: Feed back a sound external verifier's verdict; never the model's own critique
kind: technique
status: card
tiers:
- tier: 2
  why: 'error recovery: catches outputs the check can reject'
- tier: 3
  why: when repairs change answer quality
levers:
- control-flow
domains:
- general
evidence_domains:
- reasoning
- data-analysis
- code-generation
- planning
- web-research
categories:
- verification.external
summary: 'Run a check the model cannot fool on its output (compiler, tests, schema validation, execution,
  EXPLAIN on generated SQL, a solver) and feed the verdict back; a pass/fail verdict is enough, and resampling
  until the check accepts works about as well as detailed feedback. Repair generated SQL from execution
  errors and check for hallucinated tables; run it read-only with timeouts. Do not add a step where the
  model critiques or re-checks its own answer with no external signal: it lowered accuracy in every study,
  and a multi-step self-verification tool that helped on GAIA (+5.75%) cost 17.8 points on SimpleQA.'
how: 1. Identify the sound check the task admits (build, tests, schema, execution). 2. Run it on each
  output before returning; feed pass/fail back and let the agent retry, or resample until it passes. 3.
  If no sound check exists, do not substitute a model critique; use 9.b.iii or 9.b.ii instead. 4. Measure the
  check-failure rate and end quality.
detect:
  static: no step runs the build, tests, linter, schema check or execution on the output before it is
    returned; a critique or reflect step where the same model reviews its own answer with no tool output
    or environment state in the loop
  traces: errors a compiler, test or schema check would catch reaching the final answer; SQL errors and
    hallucinated table names; answers changed after a critique turn with no new external information;
    failure rows labeled tool-feedback-neglect or satisficing
  evals: failures a deterministic check would have flagged; accuracy before and after any critique step
impact:
  quality:
    effect: improves
    size: large
    when: 'external verifier: Blocksworld 40% to 87% (2024); SQL compilation 66% to 96% (LinkedIn, 2025);
      model-only critique: negative in every study, e.g. GPT-3.5 75.8 to 38.1'
    basis: evidence
  cost:
    effect: degrades
    size: small
    basis: evidence
  performance:
    effect: degrades
    size: small
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
measure:
- method: before-after
  tier: 2
  how: rate of outputs failing the check, same cases
- method: experiment
  tier: 3
  how: paired eval of end quality
