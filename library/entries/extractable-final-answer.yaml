measure:
- method: before-after
  tier: 2
  how: 'same cases and model, before and after: accuracy under one stated extraction protocol, parse rate,
    and the rates of no answer, refusal, echoed placeholder, malformed answer and answer cut off by a
    limit; score strictly (the stated format) and leniently (any recognizable answer) side by side, and
    re-score a sample with a symbolic or model-based equivalence check (for agents, by reading failed
    runs); when the answer format or submission path changes, run old and new on the same questions for
    each model and count answers that flip from right to wrong; for the forced answer, cut runs at the
    generation or turn budget and compare forcing the answer from a held-back reserve against returning
    nothing, counting forced answers that are readable but wrong apart from correct ones'
- method: monitor
  how: 'in production traces: parse rate and no-answer rate per model and prompt version (an outlier parse
    rate for one model on one prompt is a format defect, not a model result); refusals and explanations
    returned as answers; where each returned answer came from (agent, forced at the limit, harness fallback)
    and how often each is right; runs ended by a provider or harness error that still report an answer;
    and the share of answers read only by a fallback parser'
