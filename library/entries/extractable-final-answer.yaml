      or strict and lenient, scores side by side exposed 5.45 to 8.49 points of grader false negatives
      on a web-agent benchmark (Gan, Oct 2026) and a leaderboard parser whose fix moved 185 of 215 cells
      (Huang, Oct 2026)'
    basis: evidence
