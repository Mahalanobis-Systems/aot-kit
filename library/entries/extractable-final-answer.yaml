    the ordering mattered little. Under three prompt perturbations on GSM8K, the smallest reasoning-first
    advantage across 24 combinations was +37 points (GPT-4o JSON). Structured-output schema violations
    were zero.'
  conditions: GPT-4o, Gemini-Flash-2.0, Claude-Sonnet-4.5, Llama-3.1-8B and Gemma3-4B; GSM8K, MMLU, LogicBench
    and Spider; temperature 0, 5 runs; the free-form baseline was partly scored by a faulty parser (empty
    extraction 29.8% on MMLU and 45.2% on LogicBench for Gemma3-4B), so comparisons with free-form are
    not like for like, while answer-first against reasoning-first is
  direction: supports
  measured: true
  locator: §3.2; §4, Table 1; App. A.3 Table 3; App. F
- source: 'Mingguang Chen, Bo Qu, Licheng Wang, "The Calibration Floor: Format Repair Can Masquerade as
    Self-Correction at Small-to-Mid Scale", https://arxiv.org/abs/2608.04355'
  date: '2026-08-05'
  task: 'Audit answer extraction in a self-revision study: count answers that are missing (output cut
    off by the token budget before the answer marker) or echo the prompt''s placeholder, force a short
    answer-only continuation on those rows, and re-extract every answer by grammar-constrained decoding
    over the valid answers'
  effect: Missing answers and a "literally echoed placeholder token" (the prompt specified '#### <answer>')
    were "both silently scored as incorrect"; the revision prompt "regularly exhausted the token budget
    before reaching the marker". In the frontier arm, 28% and 49% (Hy3, GSM8K and MMLU) and 22%, 32% and
    38% (Nemotron, GSM8K, MMLU and MATH) of initial answers were missing or echoed the placeholder. Appending
    "Therefore, my final answer is" (32 tokens, no new turn) passed the decision rule in 6 of 8 fidelity-clean
    cells; on 4B GSM8K it "recovers correct answers on 63.5% of the rows that the full two-round revision
    protocol only recovers 19.2% of the time". Grammar-constrained re-extraction reached 0% bad answers
    in all 14 cells where it ran and closed a median 71% (range 55-100%) of the gap between the apparent
    effect and the content effect. A computer-algebra grader turned 92/326, 86/313 and 54/185 string-graded
    MATH rows from wrong to right, none the other way. A permissive multiple-choice fallback "matching
    any standalone letter anywhere in truncated reasoning prose" was found to be a bug.
  conditions: Qwen3.5 0.8B to 9B (4-bit MLX) and Gemma-4-12B, plus Tencent Hy3 and Nemotron-3-Ultra-550B
    through a free API tier (n=200, unsealed, Hy3 retired mid-collection); ARC, MMLU, CommonsenseQA, TruthfulQA-MC1,
    GSM8K, MATH, TriviaQA; 29 admitted cells; the forced-continuation arm is exploratory by the authors'
    account (run on reconstructed pre-fix prompts, its '#### X' fallback added after inspecting parser
    failures); the paper's subject is measuring self-correction, not harness design
  direction: supports
  measured: true
  locator: Abstract; §4.9-4.10, §4.12-4.13, §4.15; §9.1; §9.8; §11
- source: Ivan Yee Lee, Loris D'Antoni, Taylor Berg-Kirkpatrick, "The Format Tax", https://arxiv.org/abs/2604.03616
  date: '2026-04-04'
  task: 'Request JSON, XML, Markdown or LaTeX output, with and without grammar-constrained decoding, against
    a free-form baseline, and test two ways of separating reasoning from formatting: a second call that
    reformats a free-form answer, and a thinking phase before the formatted output'
  effect: 'Open-weight models: of 144 cells, 76 showed significant effects, "72 in the tax direction and
    only 4 in the credit direction"; of 39 cells with a significant effect, 36 (92%) were already present
    under the format-requesting prompt alone. Constrained decoding raised format compliance from 55.7%
    to 92.2% while accuracy was 57.3% without it and 55.7% with it, against 61.5% free-form. Few-shot
    examples and schema descriptions "leave the majority of the degradation intact". "2-Turn significantly
    improves accuracy in 42 of 72 model-task-format comparisons (p<0.05, average +6.8 pp), while significantly
    worsening only 2"; thinking "significantly improves 43 of 72 comparisons (+9.2 pp average)" but 11
    (15%) significantly worsen. Closed models: gpt-5-nano -5.2 pp without constrained decoding and -8.0
    pp with it; claude-haiku-4.5, grok-4.1-fast and gpt-5.4-nano near-zero or positive without it. Scoring:
    a deterministic MATH-500 extractor missed correct answers embedded in format markup; against an LLM
    judge it failed 3.3% (free-form), 4.4% (JSON), 4.9% (XML), 10.5% (Markdown) and 5.8% (LaTeX) of judged
    rows that the judge accepted, with 0.1% the other way, and switching to the judge cut the measured
    MATH-500 tax from -10.1 to -6.6 pp.'
  conditions: qwen3-32b, qwen3-8b, olmo3.1-32b, olmo3-7b, smollm3-3b and nemotron3-nano (vLLM), and gpt-5-nano,
    gpt-5.4-nano, claude-haiku-4.5 and grok-4.1-fast (native structured outputs); MATH-500, GPQA-Diamond,
    ZebraLogic and WritingBench; the source and decoupling analyses cover open-weight models only; gpt-5.4-nano
    degraded sharply under grammar enforcement on non-JSON formats; the authors exclude function calling,
    where constraints encode correctness
  direction: mixed
  measured: true
  locator: §3.3; §4.1-4.3, Tables 3-5; §5; §7; App. E Table 7; App. G Tables 8-9
