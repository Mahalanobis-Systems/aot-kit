- source: 'Liang-Hsun Huang, Min-Yi Chen, Chao-Chun Chuang, Yu-Wei Liu, Che-Yu Wu, Po-Feng Lee, "OpenTWBench
    (Open Taiwan Benchmark): Taiwan-Domain Knowledge Evaluation for Large Language Models, and How the
