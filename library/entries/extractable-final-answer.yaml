summary: 'Put the final answer in one marked place after the reasoning, read it with a parser you have
  checked, and when a run hits its limit, spend a reserved last step on the answer and label it as forced.
  It pays wherever a parser or grader reads the answer: an instructed \boxed{} answer scored 93.9% where
  pattern-matching free text scored 20.8% on the same questions and model, answer-first JSON took GPT-4o
  from 95.60% to 55.34% on GSM8K, a nine-token answer cue held inside a 2,048-token budget raised two
  small thinking models by 8.0 and 7.0 points, and human review found 5.45 to 8.49 points of GPT-5.5 web-agent
  successes that a strict grader had rejected. Formats still cost models working near their limits (a
  long JSON schema took Claude Haiku 4.5 from 88.7% to 52.5% on hard math, and a forced submit-tool call
  took GPT-4o-mini from 60% to 10%), which reasoning first and formatting second mostly recovered. The
  limits: no study here tests a forced answer at an agent''s turn cap (in one audit no run that hit the
  action limit had finished its task), the forced-answer results come from small models on math, and lenient
  parsers and unlabeled fallback answers both hide failures.'
how: '1. Start from a baseline that separates wrong answers from unreadable ones: score a run as is and
  report the parse rate beside accuracy, then list runs with no extractable answer (none at all, a refusal,
  an echoed placeholder, output cut off before the answer marker, a loop that ended at its turn cap) and
  runs whose working holds the right value while the returned answer does not; in one public corpus of
  failed multi-agent runs, 23 of 95 ended with no answer at all (a stall, a cut-off output or an exhausted
  budget). Re-score a sample with a symbolic or model-based equivalence check, and for agents read the
  failed runs: a deterministic MATH-500 scorer rejected 3.3% (free text) to 10.5% (Markdown) of responses
  an LLM judge accepted, with 0.1% the other way, in another study a computer-algebra grader turned roughly
  28% of string-graded MATH rows from wrong to right, and human review of GPT-5.5 on WebArena-Lite recovered
  5.45 to 8.49 points of success the automatic evaluator had rejected (answers in a strict format, completed
  states a string rule missed, valid results followed by an invalid stop action). 2. State the format
  once, in the prompt''s format section (3.a.iv): one marker the harness reads (\boxed{}, ''Final answer:''
  or a named field), placed at the end of the response, and the allowed values by name (''one of A, B,
  C, D'') rather than a bracketed placeholder or an example value. On identical questions and model, an
  instructed \boxed{} answer scored 93.9% where pattern-matching the bare question''s free text scored
  20.8%; an example letter from another alphabet made one model answer in that alphabet (58.2%, last place)
  until the prompt named the letters (83.9%, 100% parse rate), and in another study a ''#### <answer>''
  placeholder was echoed verbatim and scored as wrong. 3. Keep the reasoning ahead of the format: let
  the model work in free text or a thinking phase and commit to the answer at the end, and in a JSON or
  XML answer put the reasoning fields before the answer field (answer-first JSON took GPT-4o from 95.60%
  to 55.34% on GSM8K; answer-first XML left two small models at 10.98%). If a format request still costs
  accuracy, as it did for every open-weight model in one study and for closed models on tasks near their
  limits in another (a 1,774-character JSON schema took Claude Haiku 4.5 from 88.7% to 52.5% on hard math
  while Claude Sonnet 4.6 held 88.7% against 89.3%, and Claude Opus 4.7 lost 5.3 points on AIME, not significant
  on its own), answer freely first and convert the answer to the format in a second call: that significantly
  improved 42 of 72 comparisons (6.8 points on average) and significantly worsened 2; reasoning first
  and formatting second within one response recovered 80% (Haiku) and 87% (GPT-4o-mini) of the lost accuracy;
  and a thinking phase significantly improved 43 comparisons and worsened 11 (thinking settings are 1.b.i).
  If the answer is submitted through a tool, leave room to reason before the call: forcing the tool call
  took GPT-4o-mini from 60% to 10% on 100 hard math problems because it emitted only the arguments, while
  submitting through the tool in a second round held 59%. Constrained decoding guarantees the shape (format
  compliance 55.7% to 92.2%) but not the answer (accuracy 57.3% without it, 55.7% with it, 61.5% free-form),
  so apply it to the final answer after the reasoning, not to the whole response. 4. Harden extraction:
  strip markup, normalize numbers and units, compare by value, take the last marked answer, and record
  refusals, empty answers and echoed placeholders as their own outcomes rather than as wrong answers.
  Do not let a lenient fallback fill the gaps unseen: a leaderboard that read the marker where present
  and any option letter otherwise scored models that ignored the format leniently and compliant ones strictly,
  and fixing it moved 185 of 215 published cells; keep strict and lenient (or raw and corrected) scores
  side by side. 5. Hold back room for the answer inside the budget and force it when the loop or the generation
  reaches that reserve: give the model its work so far and ask only for the answer in the stated format
  (for example by closing the thinking block and appending ''Final answer: \boxed{'', or ''Therefore,
  my final answer is''), constrained to the valid answers where they can be listed. With 64 of 2,048 output
  tokens held back, a nine-token cue of that kind turned every empty endpoint into an answer in the main
  run and raised two small thinking models by 8.0 and 7.0 points on 100 GSM8K questions (7.0 and 10.0
  on a repeat) at under 1% change in tokens and wall time, and it beat reading the cut-off output with
  a lenient parser (90 and 87 correct against 84 and 81); in an earlier small-model study a forced continuation
  recovered correct answers on 63.5% of no-answer rows in one cell, against 19.2% for a full revision
  turn, and constrained re-extraction made every answer parseable. Count forced answers apart from correct
  ones: 6 and 5 of the newly answered questions were readable but wrong. In an agent, hold back the last
  turn the same way, but expect it to return partial work: in the WebArena-Lite audit none of 40 failed
  GPT-5.5 runs that used up a 25-action budget had completed the task (mean verified progress 56.2%).
  Raising the limit is not the fix (sizing it is 7.b.iii): doubling a generation cap from 8,192 to 16,384
  tokens cut unparsed responses only from 15.9% to 14.0%, though where a long format is what fills the
  output a higher cap does help (Claude Haiku 4.5 under JSON: 52.5% at 2,048 tokens, 84.0% at 8,192).
  6. Record where each returned answer came from (the agent''s own answer, a forced answer at the limit,
  a harness fallback, or none) and report runs the harness ended apart from agent errors: in one public
  corpus of multi-agent failures, a provider''s content filter killed the orchestrator in 26 of 58 runs
  and the experiment script then printed a final answer in 25 of them that no agent had produced, which
  the corpus blamed on another agent in 21. 7. Measure on the same cases, per model, before and after:
  accuracy under one stated protocol, parse rate, no-answer, refusal and malformed-answer rates, strict
  against lenient score, and answers that flip from right to wrong when the format changes; for agents,
  also how each run ended (answered, forced at the limit, harness fallback, crash) and the accuracy of
  each group. Format defects are model-specific: the same placeholder left 828 of one model''s answers
  on one subject unparsed (827 of them real answers in the wrong alphabet) and cost another model 17 of
  60,389 responses.'
detect:
  static: no answer-format statement, or one shown only as a bracketed placeholder or an example value
    the model may copy; a structured answer schema with the answer field before the reasoning; a submit
    tool forced on the first call, with no room to reason before it; extraction that assumes a marker,
    or falls back to any matching letter or number anywhere in the text; string matching with no number,
    unit or markup normalization; no forced answer, and no budget held back for one, when the loop or
    the generation ends on a budget; harness fallback answers written without a label saying where they
    came from
  traces: runs ending with no extractable answer (none, an echoed placeholder, output cut off before the
    answer marker, a turn cap reached); refusals or explanations returned as answers; numbers in the wrong
    format or wrapped in markup; runs ending at the limit with a correct value in context; runs ended
    by a provider or harness error that still report a final answer; forced or fallback answers not marked
    as such; parse rates that differ sharply between models on the same prompt
  evals: failures where the working was right but the submitted answer was not (instruction-grader-mismatch);
    a gap between strict and lenient scores, between the deterministic scorer and a symbolic or model-based
    equivalence check, or between an agent benchmark's automatic score and a human-corrected one
  probes:
    what: 'Solved cases whose answer the harness may fail to read: output cut off at the limit, answers
      in equivalent forms, and each candidate answer format.'
    construct: Take cases the agent solves, re-run them with the run or generation cut off just before
      the answer, with the answer requested in each candidate format (free text with a marker, JSON or
      XML with the answer field first and last), and with gold answers written in equivalent forms (a
      fraction or a decimal, units, LaTeX, the option text instead of its letter); pass when the harness
      returns a parseable answer and the extractor scores it as a careful manual read would.
