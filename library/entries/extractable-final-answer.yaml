caveats: 'Most of the evidence comes from single-call benchmarks: no study here measures a forced final-answer
  turn at an agent''s turn cap, the forced-answer results are small models on math (an exploratory probe
  on models up to 9B whose fallback parser was added after inspecting failures, and a nine-token cue on
  two 4B and 8B thinking models over 100 GSM8K questions, where 6 and 5 of the newly answered questions
  were still wrong), and in the one agent audit none of the 40 GPT-5.5 runs that hit the action limit
  had finished the task. Format costs depend on the model and on how hard the task is for it: Claude Haiku
  4.5 paid little or no format tax in one study but lost 36.2 points on hard math in another (mostly output
  cut off at 2,048 tokens), Claude Opus 4.7 lost 5.3 points on AIME (not significant on its own) while
  Claude Sonnet 4.6 showed no significant loss, Claude Sonnet 4.5 scored higher with answer-first JSON
  on GSM8K (96.13% against 87.79%), and a thinking phase made 11 of 72 comparisons significantly worse.
  The largest extraction effect (20.8% to 93.9%) is one subject and one model and changes the prompt as
  well as the parser, and the agent grader audit is one rollout per task on 165 tasks, with corrections
  that mix answer formatting and missed state changes. The governance result comes from one corpus of
  released multi-agent traces, and in VeRO the format reminder alone was mixed on GPQA (train 0.54 to
  0.60, test 0.54 against a 0.61 baseline).'
