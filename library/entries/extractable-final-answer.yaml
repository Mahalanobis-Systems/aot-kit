caveats: 'Most of the evidence comes from single-call benchmarks, not agent loops: no outside study here
  measures a final-answer turn at an agent''s turn cap, and the forced-answer result is one exploratory
  probe on small models (up to 9B) whose parser fallback was added after inspecting failures, failing
  its rule in 2 of 8 cells. Format costs depend on the model: three recent closed models paid little or
  no format tax while every open-weight model tested did, Claude Sonnet 4.5 scored higher with answer-first
  JSON on GSM8K (96.13% against 87.79%), and a thinking phase made 11 of 72 comparisons significantly
  worse. The largest extraction effect (20.8% to 93.9%) is one subject and one model and changes the prompt
  as well as the parser, and lenient fallback parsing is not a free fix: on one leaderboard it scored
  models that ignored the format leniently and compliant ones strictly. In VeRO the format reminder alone
  was mixed on GPQA (train 0.54 to 0.60, test 0.54 against a 0.61 baseline).'
