  effect: 'Table 1, GSM8K, free-form / JSON answer-first / JSON reasoning-first: GPT-4o 88.78 / 55.34
    / 95.60; Gemini-Flash-2.0 79.38 / 63.08 / 95.53; Claude-Sonnet-4.5 86.50 / 96.13 / 87.79 (XML: 62.35
