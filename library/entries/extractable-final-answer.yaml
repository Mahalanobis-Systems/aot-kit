  date: '2026-10-14'
  task: 'Hold questions and model fixed and vary only the measurement apparatus: the answer instruction
    and extraction rule, the format example in the system prompt, a leaderboard''s fallback parser, and
    the generation cap'
  effect: 'Pattern-matching an option letter from the free-form output of the bare question (no system
    prompt), against instructing the model to end with \boxed{X} and counting unparseable responses as
    wrong: "On the same civics subject and the same model, pattern reports 20.8% and box reports 93.9%";
    the matcher once extracted "W", not an option. A system-prompt format example that used a traditional
    Chinese ordinal as its placeholder made Mistral-Large-675B answer in that alphabet: "827 of 828 ''unparsed''
    responses on one subject were in fact real answers in the wrong alphabet", scoring 58.2% (last place);
    naming the alphabet ("one of A, B, C, D") without an example letter gave 83.9% with a 100% parse rate
    (first place), while the same defective prompt cost Qwen3.8-27B 17 of 60,389 responses. A leaderboard
    that read the \boxed{} answer where present and any option letter otherwise scored low-compliance
    models leniently: a model writing \boxed{} on 6% of items sat two places above one writing it on 95%;
    correcting it moved 185 of 215 published cells, 122 by more than a point and 49 by more than ten.
    Doubling the generation cap from 8,192 to 16,384 tokens changed accuracy by +0.21% at 1.72x the wall-clock
    cost and cut unparsed responses only from 15.9% to 14.0%.'
