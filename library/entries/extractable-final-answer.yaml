      budget raised two small thinking models by 8.0 and 7.0 points on 100 GSM8K questions (Chang, Oct
      2026), and a forced short continuation recovered correct answers on 63.5% of no-answer rows against
      19.2% for a full revision, in one cell (Chen, Aug 2026); human review recovered 5.45 to 8.49 points
      of GPT-5.5 web-agent successes a strict automatic evaluator had rejected (Gan, Oct 2026); limits:
      none of 40 GPT-5.5 runs that used up a 25-action budget had finished the task (Gan, Oct 2026); a
      long JSON schema cost Claude Haiku 4.5 36.2 points on hard math and Claude Opus 4.7 5.3 points on
      AIME (not significant alone), Claude Sonnet 4.6 showed no significant loss (89.3% against 88.7%),
      and a forced tool call took GPT-4o-mini from 60% to 10% (Fan, Jun 2026), while three recent closed
      models, Claude Haiku 4.5 among them, paid little or no format tax on the benchmarks of another study
      (Lee, Apr 2026); Claude Sonnet 4.5 scored higher with answer-first JSON on GSM8K (96.13% against
      87.79%) (Kumar, Oct 2026); and the format reminder alone was mixed on GPQA, train 0.54 to 0.60 and
      test 0.54 against a 0.61 baseline (VeRO, Feb 2026)'
    basis: evidence
  cost:
    effect: degrades
    size: small
    when: stating the format and hardening extraction add nothing per run; converting the answer to the
      format in a second call means two inference calls instead of one (Lee, Apr 2026); the forced answer
      at the limit is one short continuation or call on the runs that need it (a 32-token continuation
      in Chen, Aug 2026), and held inside the budget a nine-token cue left total output tokens 0.63% and
      0.60% below first-box stopping alone (Chang, Oct 2026)
    basis: evidence
  performance:
    effect: none
    when: no added latency on runs that answer in the stated format; with the answer cue held inside a
      2,048-token budget, request wall time was 0.80% and 0.71% shorter than first-box stopping alone
      in single-request runs (Chang, Oct 2026); the optional second formatting call, or a forced answer
      turn in an agent, adds one sequential call on the runs that use it, which no source here times
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: mixed
    size: small
    when: 'a fallback answer that is not labeled hides harness failures: in 25 of 58 runs of one public
      multi-agent failure corpus a script printed a final answer that no agent had produced after a provider
