- source: Jiapeng Li (Microsoft), "Where Does Exactly-Once Live? Model, Harness, and Tool-Contract Effects
    on Duplicate Side Effects in LLM Agents", https://arxiv.org/abs/2609.29095
  date: '2026-09-24'
  task: Inject twelve fault modes at the service boundary of six simulated services exposed over MCP (lost
    acknowledgements, misleading HTTP 500s, late commits of timed-out requests, redelivery, partial batches,
    429s, 503s, outages, schema drift) and grade every episode against a ledger of committed effects,
    crossing nine current models, a minimal scaffold and three production agent CLIs, the native tool
    contract and one with idempotency keys on every write, and recovery policies from prompt guidance
    to harness wrappers (transparent client retries, retrying only 429 and 503, verify-before-retry, a
    contract-driven guard, wait-then-verify)
  effect: Six frontier models duplicated a write whose acknowledgement was lost in 0.5% of episodes (they
    read back first) and after a misleading 500 in 8%, but late commits in 56% and redelivered requests
    in 74%; the two weaker models duplicated lost-acknowledgement writes in 18%. Explicit faults (503,
    429, outage, schema drift) caused duplicates in 0.4%. After a lost acknowledgement, agents that read
    back before re-issuing duplicated 13.4% of writes on eventually consistent read paths against 0.8%
    on strongly consistent ones. Transparent client retries ("timeouts, 5xx and 429 responses up to three
    times with exponential backoff, mimicking common client defaults") cut exactly-once success from 72%
    to 50% and raised duplicates to 50%, while retrying only 429 and 503 left it at the vanilla level
    (80%, 77%, 74%, 59% against 79%, 77%, 74%, 59% for four models). With a key offered on every write,
    agents attached keys in 98% of episodes and duplicates fell from 28% to 4%; no late-commit re-issue
    that reused the original key duplicated (0 of 432), against 68% of 56 re-issues whose first attempt
    carried no key and 2 of 2 with a new key. Under heavy-tailed in-flight delays, waiting an hour before
    verifying reached 84% exactly-once success at 49.9 simulated minutes per episode, against 94% at 1.5
    minutes with keys and the guard. Copilot CLI, Hermes and Codex CLI duplicated at 27%, 29% and 30%
    against 26% for the minimal scaffold (harness share of explained variance 0% to 3%); the guard raised
    late-commit duplicates for GPT-6 Sol from 50% to 71%. Agents reported the task completed in 90% of
    the 1,279 episodes in which they had duplicated an effect.
  conditions: gpt-6-astra, gpt-6-sol, gpt-5.6-sol, claude-opus-5.5, gemini-3.8-flash and grok-4.7 (frontier),
