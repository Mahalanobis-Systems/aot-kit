- source: 'Antonio Ken Iannillo, Joshua Segun Owotogbe, Roberto Natella, Francesco Avallone, Kristina
    Kudryavtseva, Indika Kumara, "Tool-Calling LLM Agents Under Realistic MCP Faults: Scale Does Not Purchase
    Fault Tolerance", https://arxiv.org/abs/2610.32555'
  date: '2026-10-23'
  task: Inject MCP tool faults drawn from a profile calibrated on 57,240 issue and pull-request threads
    from 1,774 MCP server repositories (explicit errors, wrong or invalid output, delays, silent drops;
    permanent, intermittent or transient) into three agent stacks that all return tool errors to the model,
    and record quality, completion and what the agent does after each failure
  effect: 'Profile: "91.3% permanent, 8.0% intermittent, 0.75% transient; EXPLICIT_ERROR/PERMANENT alone
    carries 65.6%" (N=13,824 classified failures). Pooled, "task completion score drops 60% (8.08 to 3.23)";
    completion fell from 95-100% without faults to 88-97%. LangChain absorbed faults best; MCPBench lost
    a further 0.93 points relative to LangChain (p=0.048) and the OpenAI Agents SDK a further 0.84 (p=0.074),
    which the authors "treat as suggestive rather than established". After a failure the next action was
    a different tool 57% of the time, a final answer 22% and a retry 21%; "Precise fault diagnosis, for
    instance distinguishing a permanent error from a transient one, is absent in all examined traces."
    38 runs made three or more consecutive calls to the same failing tool; the longest had "12 consecutive
    retries over 22 tool calls and 47,761 tokens", the costliest "52 tool calls, 107,849 tokens". The
    120B model kept no larger share of its fault-free score than the 20B (p=0.96).'
  conditions: gpt-oss-20B and gpt-oss-120B served locally (MXFP4, 16K context); MCP-Bench plan-and-execute
    loop, OpenAI Agents SDK and LangChain create_agent with loop bounds of 40, 40 and 25; 25 single-server
    MCP-Bench tasks, 3 seeds, 1,350 cells; gpt-4o-mini judge; GitHub issues over-represent persistent
    failures, so the profile is a stress test, and only 9 of 1,905 fired faults were transient or intermittent;
    the stack effect is confounded with fault exposure
  direction: mixed
  measured: true
  locator: Abstract; §4 (Profile synthesis, What is calibrated, Table 2); §5.2-5.3; §6.1-6.3; §7; App.
    F Table 6; App. G
- source: 'Dolly Sah, Tanmay Sah, Harshul Jain, Tanya Sah, "UndoBench: Separating Task Competence from
    Recovery Capability in Tool-Using AI Agents", https://arxiv.org/abs/2610.05622'
  date: '2026-10-04'
  task: 'Inject a fault after a write tool''s mutation commits but before its reply arrives (and, in extensions,
    before dispatch and mid-mutation) and compare recovery policies: naive retry, client-side idempotency
    keys, a zero-privilege mutation journal, server-side idempotency on every endpoint, and verify-before-retry'
  effect: 'Lost-reply faults, 2,880 paired trials: nominal success 83.54% against 46.72% conditional recovery.
    Naive retry ("re-issuing tool calls up to 3 times with exponential backoff upon receiving any error"):
    42.77% recovery and duplicate external effects in 53.33% of trials; client-side idempotency keys:
    53.49% and 45.42%, since only three endpoints deduplicated and "retrying unacknowledged calls blindly
    produced duplicates in 100% of trials across five workflows". Commercial models under naive retry:
    duplicates in 65.62% (Gemini 3.8 Flash) and 51.25% (GLM-5.2) of trials, recovery 21.08% and 21.89%.
    Server-side idempotency on every endpoint: 97.24% recovery and 0.00% duplicates, against 33.20% with
    standard keys. Faults before dispatch: naive retry recovered 78.44% with zero duplicate effects among
    3,028 nominally capable trials. On four composite workflows verify-before-retry recovered 75.00% after
    commit against 43.13% for naive retry, and 25.89% against 0.00% mid-mutation.'
  conditions: Llama-3.1-8B and Llama-3.2-3B (Q4) under direct tool calling and LangGraph (equivalent within
    10 points), plus Gemini 3.8 Flash and GLM-5.2 in a secondary extension; 12 held-out workflows in 8
    domains on mocked APIs (SQLite, local Git, mocked Stripe and AWS), one fault per run, 20 seeds; the
    +10.72-point gain from client-side keys had a bootstrap CI of 0 to +24.23 and adjusted p=1.00; verify-before-retry
    was evaluated post hoc; the authors' own journaling baseline ran at parity with naive retry
  direction: mixed
  measured: true
  locator: Abstract; §3 (Recovery Baselines); §4.1-4.3, Tables 1-2; §4.5 Table 3; §5 Table 4; §6; Limitations
- source: 'Yixuan Li, Yiyun Zhou, Yao Long Teng, Fuchao Yang, Yanchen Deng, Zhiyi Lyu, Xuyu Dong, Feng
    Chen, Bo An, "Finding the Right Fit: Model-Harness Interactions across Agent Tasks", https://arxiv.org/abs/2610.00917'
  date: '2026-10-01'
  task: Cross four configurable harnesses with five current models on three agent benchmarks, and code
    how each harness handed failures back (malformed calls, provider stream errors, output-capped turns)
    in matched trajectories
  effect: In ten matched Terminal-Bench 4 pairs, "Almost all responses were model-initiated (180 of 192)"
    and diagnosis or a targeted patch resolved the signal in 116 of 133 cases; "The decisive difference,
    however, was usually not whether the model could repair an error but whether the harness returned
    the failure as usable feedback." OpenHands' repeat detector "ended 55 runs, 48 of them Kimi re-issuing
    an edit call without its required content argument, and only one of these runs scored above zero."
    openJiuwen re-prompts the model after a turn is cut by the output cap ("100 runs resumed, 48 of which
    went on to score above zero"). "Turns cut off by provider stream errors (25 of Kimi's 62 PI runs on
    TB4) and sandbox stalls are scored as failures". Kimi K3 on Terminal-Bench 4 scored 11.11% (OpenHands),
    17.46% (DeepSeek Harness), 11.11% (PI) and 28.57% (openJiuwen).
  conditions: Claude Opus 5, GPT-6 Astra, GLM-5.3, Kimi K3 and DeepSeek V4 Pro via OpenRouter pinned to
    first-party providers, high reasoning effort; OpenHands, DeepSeek Harness, PI and openJiuwen, plus
    Codex and Claude Code natively; TUA-Bench (120), ALE-CLI (99) and Terminal-Bench 4 (63); 66 configurations,
    6,204 scored trajectories; retries and limits at each harness's defaults; the failure-handling counts
    come from the authors' coding of final attempts, and harness score gaps bundle error handling with
    tools, prompts and limits
  direction: supports
  measured: true
  locator: Abstract; §3.2; Table 1; §5.1; App. A Table 5
- source: 'Gou Tan, Zhensu Sun, Jieke Shi, et al., "AgentChaos: Chaos Engineering for Agent Systems via
    Programmatic Fault Injection", https://arxiv.org/abs/2608.06790'
  date: '2026-08-07'
  task: Inject faults into model API responses at runtime (errors, timeouts, empty, truncated, corrupted
    and schema-violating content or tool-call arguments) across five agent systems and four backbones,
    and measure the drop in pass@1, call counts and how failures surface
  effect: 'All systems degraded, pass@1 dropping "from 0.87% (Mini-SE on SWE-bench Pro) to 49.66% (MapCoder
    on HumanEval+ under GPT-5.2)", and the ranking held across backbones. With Claude-Sonnet-4.5: "Most
    tool call faults cause Δpass@1 below 5% (e.g., error ranges from -12.5% to 4.05%), because tool error
    handling catches them before they propagate to subsequent agents", but tool-call truncation cost MapCoder
    52.63 points "because its pipeline passes corrupted tool call arguments to the next stage without
    validation"; on MAD, "empty content causes a 38.46% drop, close to error content (37.5%) and higher
    than timeout content (22.33%)". Under faults AutoGen went from 1.72 to 7.3 LLM calls (4.24x) and from
    0.47 to 3.07 tool calls (6.55x) "because faulty responses trigger repeated retries"; silent failures
    (plausible wrong output with no warning) were 21.82% to 65.71% of failed tasks. The authors advise
    "output validation after each LLM API call, such as checking finish_reason, verifying code syntax
    completeness, and confirming that tool call arguments match the expected schema."'
  conditions: AutoGen, MAD, MapCoder, EvoMAC and Mini-SE reimplemented on Google ADK; Claude-Sonnet-4.5,
    GPT-5.2, DeepSeek-V3.2 and Seed-1.8 at temperature 0.7; HumanEval, MBPP, HumanEval+, MBPP+, MMLU-Pro,
    MATH-500 and SWE-bench Pro; 65 fault configurations, about 4.6 triggered tasks each; error and timeout
    faults are written into the body of a successful response, so provider-level HTTP retries are not
    exercised
  direction: supports
  measured: true
  locator: Abstract; §4.3; §5.1-5.3, Tables 3, 4, 6, 7; §6.1-6.2
caveats: 'Fail-soft handling is necessary but not sufficient: in VeRO removing all 11 crashes turned only
  3 and 1 of them into passes, a tool fix crashed one agent outright, and even with errors returned to
  the model, calibrated MCP faults cut task-completion scores by 60% (Iannillo, Oct 2026). Retries help
  only where failures are transient and the call is safe to repeat: 91.3% of failures mined from MCP issue
  threads were permanent (a stress profile, since issues over-represent reproducible bugs), agents retried
  permanent failures on their own, and blind retries of writes duplicated them in 53.33% of trials in
  a benchmark with mocked APIs and one fault per run; no study here tests marking errors as not retryable.
  The fault-injection studies are small or synthetic (about 4.6 triggered tasks per fault configuration
  in one, two gpt-oss models on an easy benchmark in another, 12 workflow clusters with verify-before-retry
  tested post hoc in a third), and harness comparisons bundle error handling with tools, prompts and limits,
  so measure the effect in your own agent.'
