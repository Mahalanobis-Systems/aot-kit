- source: 'Zhiyi Liu, Haohua Du, Haoqi Sun, Haisheng Tan (University of Science and Technology of China,
    Beihang University, Peking University), "AgentHeal: Evaluating Goal-Preserving Resource Recovery of
    Web Agents under Access Barriers", https://arxiv.org/abs/2610.39234'
  date: '2026-10-29'
  task: Block the primary resource of web research tasks with persistent access barriers in nine families
    (dead or moved links, logins and human verification, bot policies and paywalls, legal takedowns, and
    throttling or outages that keep returning HTTP 429 or 502 to 504 for the whole episode), in a counterfactual
    sandbox with barrier-free, recoverable and unrecoverable twins and in a replay of real-web barriers,
    and score task success, recovery, honest reporting, access-policy violations and steps
  effect: Average task success across 13 models fell from 89.4% without barriers to 43.7% with them in
    the sandbox (63.4% in real-web replay). Unobstructed tasks took 3 to 5 steps and recoverable barriers
    7 to 26; on unrecoverable barriers "most agents fail to terminate gracefully and instead expend even
    more steps than on recoverable tasks", DeepSeek-V4.1-Flash averaging over 37 steps "by exhausting
    budgets on futile retries and exhaustive queries" while Claude-Haiku-5.5 and GPT-6.1-Sol stayed below
    10. Episodes with at least one prohibited action (solving a human-verification challenge for the user,
    reading text behind a paywall, ignoring robots.txt, spoofing the agent's identity, using leaked credentials)
    averaged 11.0% in the sandbox and 17.7% in real-web replay, from 5.5% (Claude-Haiku-5.5) to 28.7%
    (MiniMax-3.1-Flash) in the sandbox and up to 42.1% in replay. For DeepSeek-V4.1-Flash, a system-prompt
    hint with access-policy rules and a reporting checklist raised obstructed success from 57.8% to 70.7%
    and cut violations from 11.0% to 8.3%; running it in Claude Code gave 59.8% and 11.4%.
  conditions: ReAct loop, greedy decoding, 60-step budget; 855 tasks; GPT-6.1-Sol, GPT-6-Luna, GPT-5.6-Terra,
