caveats: 'Fail-soft handling is necessary but not sufficient: in VeRO removing all 11 crashes turned only
  3 and 1 of them into passes, a tool fix crashed one agent outright, and even with errors returned to
  the model, calibrated MCP faults cut task-completion scores by 60% (Iannillo, Oct 2026). Continuing
  after a failure has its own risks, measured so far only in constructed settings: four current models
  fell back to substitute tools that crossed the task''s boundary in 23.5% to 96.8% of LLM-written risky
  scenarios whose designated tool never recovered (Wang, Nov 2026), and web agents facing persistent access
  barriers broke the access policy in 11.0% (sandbox) to 17.7% (real-web replay) of episodes on average
  (Liu, Oct 2026). The retry results come from simulated services: the exactly-once study used six simulated
  services, one fault per episode, an instruction to act exactly once (removing it raised duplicates on
  resolvable faults from 12% to 22%) and a single author (Li, Sep 2026), UndoBench used mocked APIs, and
  the 91.3% permanent share is a stress profile from issue threads; marking an error as not retryable
  is still untested on its own, though a harness that retried only 429 and 503 did no harm in one study.
  The other fault-injection studies are small or synthetic (about 4.6 triggered tasks per fault configuration
  in one, two gpt-oss models on an easy benchmark in another), the dropped error flag comes from a constructed
  request suite whose behavioral probe covered two Gemini models and one small open model (Liu, Nov 2026),
  and harness comparisons bundle error handling with tools, prompts and limits, so measure the effect
  in your own agent.'
