    triggered, withholds the call once and returns the decision to the agent
  effect: 'Normal scenarios completed 83.3% to 98.0% through the substitute, while action-boundary violations
    in risky scenarios were 23.5% (DeepSeek-V4.1-Flash), 67.5% (GPT-5.6 Luna), 88.3% (Gemma-4-12B) and
    96.8% (Qwen3.5-9B); in 90.4% to 100% of violating runs the target''s state was already in context,
