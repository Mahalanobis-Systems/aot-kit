summary: 'Keep a failed call from ending the run: validate tool calls and model responses, return tool
  errors to the agent as results, and retry only failures that are transient and safe to repeat. Concretely,
  guard the parser against calls in an unexpected shape (a string where a dict is expected, a missing
  required argument), catch errors inside tools (bad file format, failed fetch, extraction failure) and
  return a usable message instead of raising, replace custom extraction code (HTML, tables) with a standard
  parser, and retry rate limits, timeouts and server errors with backoff and a bounded count, returning
  exhaustion to the loop as a result. The harness often decides the outcome: under injected faults, tool-call
  faults that tool error handling caught cost under 5 points while unchecked truncated arguments cost
  one pipeline 52.63 points, and in real benchmark runs a repeat detector that ended runs after repeated
  malformed calls, with no final message to the model, ended 55 runs, only one of which scored above zero.
  The limits: fixing crashes rarely turned them into passes (3 and 1 of 11 in one study), a tool fix can
  break the agent outright, 91.3% of failures mined from MCP server issues were permanent so retrying
  them only burns tokens, and blindly retrying a write whose reply was lost duplicated it in 53.33% of
  trials, so retry writes only with server-side idempotency or after checking whether the first call landed.'
how: '1. Start from the harness as it is: from traces, list unhandled exceptions by tool and by parser,
  and runs the harness ended rather than the model (a repeat detector after malformed calls, a provider
  stream error, the output cap); then inject faults at the tool and model-API boundaries (explicit errors,
  timeouts, rate limits, empty and truncated responses, malformed arguments) for a baseline, since in
  two fault-injection studies robustness varied with the agent system more than with the model. 2. Validate
  every call and response before using it: add type guards where calls and results are built (a tool call
  emitted as a string rather than a dict crashed one agent), check each model response''s finish_reason,
  emptiness and tool-call arguments against the tool''s schema, and return the validation error as the
  tool result (its wording is 7.b.ii). Empty or truncated responses arrive as successful calls and bypass
  error handling: tool-call faults that error handling caught cost under 5 points of pass@1, while a pipeline
  that passed truncated arguments on unchecked lost 52.63 points. When the same malformed call repeats,
  warn the model before a repeat detector (7.b.i) ends the run: a detector that ended runs after repeated
  malformed edit calls, with no final message, ended 55 runs and one scored above zero, while the same
  model repaired such failures in other harnesses. 3. Wrap each tool body; on error return a short result
  marked as an error that the model can act on (what the error says is 7.b.ii). 4. Replace hand-written
  HTML or table extraction with a library parser. 5. Retry in the harness only what is transient: rate
  limits, timeouts, server errors and dropped streams from the model provider or a read-only tool, with
  backoff and a bounded count (provider stream errors cut off turns in 25 of one model''s 62 runs in one
  harness, all scored as failures). Resume a turn cut off by the output cap instead of ending the run:
  one harness resumed 100 such runs and 48 went on to score above zero. Return permanent errors at once,
  marked as not retryable: 91.3% of failures mined from MCP server issues were permanent, and in the traces
  examined, agents left to decide never told permanent from transient failures and retried a failing tool
  up to 12 times in a row. When the count runs out, return that to the loop as a result. 6. For tools
  with side effects, retry automatically only if the call failed before it was sent, the server honors
  an idempotency key, or a check shows the first call did not land; gate irreversible writes with 10.b.i.
  Blind retries (up to 3, with exponential backoff) of writes whose reply was lost duplicated them in
  53.33% of trials; client-side keys helped only on endpoints that deduplicate; server-side idempotency
  on every endpoint gave 97.24% recovery with no duplicates, and checking before retrying raised recovery
  from 43.13% to 75.00% on four composite workflows. 7. Re-run the errored cases first (a tool fix can
  crash the agent outright), then the full set, then paired runs with the same injected faults: task success,
  runs ended by the harness, recovery per fault type, retries per failure, duplicate side effects, and
  LLM calls and tokens per task.'
detect:
  static: parsing that assumes a fixed call shape; model responses used without checking finish_reason,
    empty content or tool-call arguments against the schema; tool bodies with no try/except; custom HTML
    or table extraction code; retry wrappers that retry every error, including permanent ones and writes
    without an idempotency key the server honors
  traces: runs ending in an unhandled exception (AttributeError, parse or fetch errors) rather than an
    answer; tool spans returning empty or garbled text; failure rows labeled tool-recovery-failure or
    observation-failure; requests failing on rate limits or transient server errors with no retry, or
    with retries exhausted; failure rows labeled service-failure or recovery-failure-external; runs ended
    by the harness rather than the model (a repeat detector after malformed calls, a provider stream error,
    the output cap); three or more consecutive calls to a tool that keeps failing; a write retried after
    a timeout and committed twice
  evals: crash outcomes as a share of failures; request-failure outcomes
  probes:
    what: 'Faults at the tool and model-API boundaries: malformed calls, errors, timeouts, empty and truncated
      responses, permanent failures, and lost replies on writes.'
    construct: Wrap the model client and each tool so a seeded schedule returns an explicit error, a timeout,
      a rate limit, an empty or truncated response, or arguments missing a required field, as permanent
      and as transient faults, and drop the reply after a write commits; pass when the run continues to
      an answer or a reported failure, no permanent fault is retried, retries stay within the bound, and
      no write is committed twice.
impact:
  quality:
    effect: improves
    size: medium
    when: 'tool-call faults caught by tool error handling cost under 5 points of pass@1, while a pipeline
      that passed truncated arguments on unchecked lost 52.63 points (Tan, Aug 2026); a repeat detector
      ending runs on malformed calls ended 55 runs, one scoring above zero, and resuming output-capped
      turns let 48 of 100 runs go on to score (Li, Oct 2026); after lost replies on writes, server-side
      idempotency gave 97.24% recovery against 33.20%, and verify-before-retry 75.00% against 43.13% (Sah,
      Oct 2026); limits: VeRO removed all 11 parser crashes in 2 of 3 runs but only 3 and 1 became passes,
      and a table-extraction fix crashed one agent (validation 0.10) until a standard parser took it to
      0.86 (VeRO, Feb 2026); calibrated MCP faults still cut task-completion score from 8.08 to 3.23 with
      errors returned to the model (Iannillo, Oct 2026)'
    basis: evidence
  cost:
    effect: degrades
    size: small
    when: no extra calls when nothing fails; under injected faults, retries raised AutoGen's LLM calls
      per task from 1.72 to 7.3 (4.24x) while a pipeline that failed early used fewer (0.71x) (Tan, Aug
      2026); agents retried a failing MCP tool three or more times in a row in 38 runs, the costliest
      of these runs reaching 52 tool calls and 107,849 tokens (Iannillo, Oct 2026)
    basis: evidence
  performance:
    effect: none
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: mixed
    size: medium
    when: blind retries (up to 3, with exponential backoff) of writes whose reply was lost duplicated
      the external effect in 53.33% of trials, 65.62% with Gemini 3.8 Flash and 51.25% with GLM-5.2; server-side
      idempotency took duplicates to 0.00%, and retries of calls that failed before dispatch caused none
      in 3,028 capable trials (Sah, Oct 2026)
    basis: evidence
  brand:
    effect: unknown
  primary:
  - quality
measure:
- method: experiment
  tier: 2
  how: 'paired runs on the same tasks and model, the harness as is against the change, with faults injected
    at the tool and model-API boundaries at fixed steps: explicit errors, timeouts, rate limits, empty
    and truncated responses, malformed or schema-violating arguments, permanent as well as transient failures
    (most real MCP failures are permanent), and lost replies on write calls; report task success, runs
    ended by the harness rather than the model, recovery per fault type, retries per failure, duplicate
    external effects, and LLM calls and tokens per task; re-run the errored cases first, since a tool
    fix can crash the agent'
- method: monitor
  how: 'in production traces: unhandled-exception and crash outcomes; runs ended by the harness (repeat
    detector, provider stream error, output cap); schema-validation failures of tool calls per model and
    provider; request failures and retries per request by error class, and retry exhaustion; consecutive
    calls to a failing tool; writes committed twice (same idempotency key or same arguments)'
