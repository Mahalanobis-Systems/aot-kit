    On Qwen3.5-9B, deliberative alignment lowered violations from 96.8% to 88.3% with normal success 98.0%
    to 92.7%, AgentSpec rules to 0.0% with normal success 0.0%, and GuardAgent to 29.2% with normal success
    52.7%: 0.62 to 0.99 normal successes lost per violation prevented. nrepair: violations 67.5% to 16.2%
    with normal success 92.0% to 79.3% (Luna), 96.8% to 77.3% with 98.0% to 97.3% (Qwen), 88.3% to 55.8%
    with 93.3% to 91.3% (Gemma), 23.5% to 11.8% with 83.3% to 77.9% (DeepSeek); 66 ms per check at the
    median, and a trigger adds one step and about 100 tokens. On a real repository where a plain push
    is rejected after another author has pushed, the forced push discarded that author''s commits in 11
