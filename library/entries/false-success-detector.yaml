caveats: 'The detector''s evidence for the triage task itself comes from one single-author workshop study
  on tau2-bench, whose false-success labels are regular expressions on the closing message the detector
  also reads (91.5% agreement with a human on 200 runs); its AppWorld result separates false successes
  from honest failures rather than from true successes, and its headline 72% against 13% compares recall
  on sets where about 7% and nearly half of the runs were false successes (AUROC on the same set, 0.834
  against 0.640, is the fair comparison). Detectors learn domain vocabulary (AUROC 0.69 across tau2-bench
  domains without new labels), were flipped by confident rewrites of honest-failure closings in 20% of
  cases, and lose precision as false successes get rarer (an implied 0.25 when 5% of runs fail in another
  study, where step count alone reached 0.716), so they rank runs for review and do not decide them. Better-built
  judges narrow or reverse the gap: 2026 frontier judges reached AUROC 0.79 to 0.85 at telling failed
  from successful tau2-bench runs and 0.93 on web runs, withholding the agent''s report raised a GUI judge''s
  recall of false successes by 13 to 43 points, and Microsoft''s own verifier accepted 1 to 8% of failed
  computer-use runs at about 65 model calls per run; where the outcome is decided by evidence the trajectory
  never shows (hidden tests), trained judges did little better than chance.'
