    (XGB) / 0.827 (DeBERTa-v3), against 0.640 for the best LLM judge; on the judges'' own tau2-bench set
    the detector scored 0.834 (Figure 7). On AppWorld API-call sequences, 0.915 (LR) / 0.953 (XGB) separates
    false successes from honest failures (all failed runs; the honest-failure label is the agent''s own
    status=fail), not from true successes; judges there scored 0.537 at best on the same contrast, where
    a judge that called every run failed would score about 0.5. At a 10% flag rate the detector (XGB)
    recovers 72% of false successes [95% CI 63-80] at 50% precision vs 13% [8-17] for the best judge (Sonnet
    4.5 no_closing); at 5%, 51% vs 6%. The two recalls come from different sets: the reported precision
    and recall imply about 7% false successes in the detector''s test data (616 of 8,762 runs in the corpus)
    and about 45% in the judge''s set (about 95 false against 105 true successes), where flagging 10%
    of runs can catch at most about a fifth of the false successes. 1.19 ms per CPU inference vs ~4,000
    ms per judge call (~3,300x). Cross-domain zero-shot transfer drops to 0.69 (airline<->retail); cross-generation
    (tau-v1 -> tau2) 0.68-0.73; rewriting honest-failure closings in confident style flips the detector
    on 10/50 (20%) and GPT-4o and Sonnet 4.5 judges on 11/45 (24%).'
