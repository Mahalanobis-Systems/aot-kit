summary: 'To catch agent runs that claim success but failed, rank finished runs with a small model trained
  on your own labeled runs and send the top of the ranking to human review, instead of asking an LLM judge
  that reads the agent''s own claim. In one study on tau2-bench customer-service runs, no LLM judge exceeded
  AUROC 0.65 and judges took confident closing messages as proof, while TF-IDF classifiers trained on
  a corpus with 616 labeled false successes reached 0.83 to 0.85 on unseen tasks and caught 72% of false
  successes when flagging 10% of runs (half the flags were false alarms); in a second study, a 4B judge
  fine-tuned on about 2,600 labeled tau2-bench runs told failed from successful runs better than two 2026
  frontier judges (AUROC 0.899 against 0.794 and 0.847), at about 1% of the strongest one''s inference
  cost. It pays where the trajectory itself shows the failure and labels exist: each new domain needs
  50 to 100 more labeled examples per class, precision falls as false successes get rarer, and on web
  and computer-use runs a frontier judge (AUROC 0.929) and an engineered verifier that checks every screenshot
  (1 to 8% of failed runs accepted) did as well or better.'
how: '1. Start from the baseline: how runs are marked complete today (the agent''s own status, an LLM
  judge, or nothing) and a labeled sample of finished runs. Label each run from the environment''s end
  state, never from the agent''s words (9.b.iii), as true success, false success (the agent claims success,
  the state shows failure) or honest failure (the agent says it failed or hands off), and triage only
  the runs that claim success. Report the false-success share (in one study 45 to 48% of failures in single-control
  tau2-bench domains, 3% in a domain where the simulated user could check state, and 75.8% among AppWorld
  agents that write an explicit status), and score the current judge and a content-blind baseline on the
  same runs: step count alone separated failed from successful tau-bench runs at AUROC 0.716 in one study.
  2. Check that the trajectory records the evidence a reviewer would use (tool results, state-changing
  calls and what they returned). Where the outcome is decided by something the trajectory never shows,
  such as hidden tests, judges trained on the runs reached only AUROC 0.53 to 0.65 on code repair in one
  study, and nothing could be decided automatically. 3. Train the detector on the labeled runs, split
  by task so no task is in both training and test: unigram and bigram TF-IDF features (up to 30,000) of
  the closing message and trajectory text, or of the sequence of API calls (method plus endpoint), with
  class-balanced logistic regression. In one study this reached AUROC 0.849 on unseen tau2-bench tasks
  from a corpus of 616 labeled false successes and 8,146 successes, and a fine-tuned 184M-parameter DeBERTa
  did no better (0.827). With a few thousand labels, a small fine-tuned judge is the stronger option:
  a 4B model prompted to treat the agent''s claims as no evidence and scored by its probability of answering
  SUCCESS rather than FAIL reached AUROC 0.899 after fine-tuning on about 2,600 labeled tau2-bench runs
  (0.903 after a further RL stage). For an open-weight agent with no failure labels yet, a reference fitted
  on a few tens of verified successful runs can rank runs by their distance from it (AUROC 0.787 from
  the agent''s own activations in one tau-bench study, against 0.551 for text embeddings). 4. Recalibrate
  for each new domain and agent version. Zero-shot transfer between tau2-bench airline and retail fell
  to AUROC 0.69; adding 50 to 100 labeled false successes and honest failures per class from the new domain
  raised logistic regression from 0.693 to 0.788 to 0.827, while XGBoost fell from 0.657 to 0.538; runs
  from an earlier benchmark generation transferred at 0.68 to 0.73. Refit a label-free reference when
  the agent changes: in one study a stale reference fell from 0.818 to 0.793 after the agent''s sampling
  changed, and refitting restored 0.814. 5. If an LLM judge stays in the loop (as a second opinion or
  in an ensemble), keep the agent''s own success claims out of its input and have it check the trace:
  in one GUI-agent study, withholding the agent''s report raised a judge''s recall of false successes
  by 13.3 and 43.4 points for two models, and in the tau2-bench study the best judge condition was the
  one with the closing message removed (0.640). A 75/25 blend of detector and judge scores raised AUROC
  from 0.834 to 0.855 there. 6. Flag the top r% of runs by score for human review, with r set by review
  capacity, and never fail a flagged run automatically. Precision depends on how rare false successes
  are: 50% at a 10% flag rate (72% caught) on test data where about 7% of runs were false successes (616
  of 8,762), and, in another study, an implied 0.25 when 5% of runs fail and 0.06 when 1% do. To let part
  of the queue be decided without review, certify the threshold with a task-level bootstrap (resample
  tasks, not runs): a certificate that treated runs as independent claimed 98% automation while its realized
  error exceeded the budget in 17.5% of task resamples, and under the task-level certificate the fine-tuned
  4B judge could auto-reject 29.7% of tau2-bench runs with at most 10% error. 7. Measure on a fresh labeled
  sample split by task, against the current judge and the step-count baseline on the same runs: AUROC,
  recall and precision at the chosen flag rate, and the false-success share, since recall at a fixed flag
  rate depends on it (in the tau2-bench study the detector''s 72% and the judge''s 13% came from sets
  where about 7% and nearly half of the runs were false successes). Relabel a random sample each period
  to catch drift.'
detect:
  traces: runs that end with a success claim; the closing message, the tool-call sequence and whether
    any state-changing call succeeded are the detector's inputs; read-only call sequences that end in
    a completion claim
  evals: on a labeled sample split by task, false successes above a few percent of runs that claim success;
    a completion judge whose AUROC is close to that of step count or transcript length, or whose verdicts
    change when the agent's report is removed
  static: completion decided by the agent's own status field, or by an LLM judge whose prompt includes
    the agent's final message or self-report
