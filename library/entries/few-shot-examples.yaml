  date: '2025-07-11'
  task: Serve an LLM log parser that retrieves five similar labeled examples per request on a self-hosted
    vLLM engine, and rewrite each request's example set to share a cached prefix with earlier requests
    (find the recent example set with the longest shared prefix, swap in its copy of any example with
    the same log template, reorder to match), against plain prefix caching; the full system also tunes
    engine settings
  effect: Prefill accounted for "an average of 85.4% of the latency across 16 datasets", and with plain
    prefix caching the average hit rate was 55.17% when parsing distinct log messages, because similarity
    ordering puts even the same examples in a different order. The example rewrite raised the prefix-cache
    hit rate 1.23 times over plain prefix caching on average (up to 2.1 times on HDFS). Removing it from
    the full system raised p95 latency by 46.97% (6.43 s to 9.45 s) and cut throughput by 32.02% (32.95
    to 22.4 requests per second). Average parsing accuracy was unchanged with the rewrite (PA 96.0 to
    96.7, GA 92.8 to 93.1), but GA fell from 67.8 to 54.4 on Proxifier.
