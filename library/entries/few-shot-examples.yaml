    zero-shot. Of 53 tasks the student failed and the teacher solved, an LLM judge attributed 48, 33 of
    them to coverage gaps: "retrieved examples did not demonstrate necessary API usage, disambiguation
    strategy, error handling, or other pivotal behavior".'
