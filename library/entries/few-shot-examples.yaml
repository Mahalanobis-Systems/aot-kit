  - quality
measure:
- method: experiment
  tier: 3
  how: 'paired runs on held-out cases, never the example pool: zero-shot with an explicit output format
    and a robust extractor, against fixed examples and against examples retrieved per query (1 to 5),
    per model and again after each model change, plus a bigger model zero-shot where that is the alternative;
    for agents, examples retrieved at each step against none; report accuracy (for data agents, sliced
    by questions on custom metrics or business logic and by questions that need several past queries),
    output-format errors, input tokens, cache hit rate, steps and latency, over several runs'
- method: monitor
  how: 'per request: which examples were retrieved and their similarity, whether the answer followed a
    retrieved pattern, output-format errors, input tokens and cache hit rate; weekly: failed questions
    or agent steps with no relevant example (gaps in the pool), questions that needed several past queries,
    and examples that no longer run after schema or metric changes'
