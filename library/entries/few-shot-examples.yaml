caveats: 'The large gains come from data agents and tool-using agents on small or purpose-built sets:
  13 questions in one Genie space, 133 LLM-judged questions in one run at LinkedIn, two benchmarks built
  so that past queries are needed (one generated and screened by LLMs), and AppWorld and ALFWorld with
  examples from runs on the same benchmarks'' training tasks and a non-reasoning GPT-4.1-mini student;
  the only few-shot test of a named 2026 thinking model (GPT-5.4 Thinking, 0.71 to 0.96 F1) comes from
  a synthetic test run through the chat app, three runs, with examples of one class. On strong instruction-tuned
  and reasoning models solving math, examples mostly align the format and can hurt (eight examples tied
  zero-shot for Qwen2.5-72B, few-shot prompts collapsed on LSAT and CommonsenseQA in the same study''s
  appendix, five examples lowered o1-preview on four of six medical benchmarks), and no source tests a
  2026 thinking model on math or reasoning benchmarks. Retrieved examples are not reliably better than
  fixed ones and have limits: they did not beat zero-shot on a tool-selection benchmark, low-precision
  retrieval misled the model, questions combining several past queries scored 29.7% against 56.7%, and
  most agent failures were gaps no example covered; examples also add input tokens, and caching savings
  are measured only on one self-hosted log-parsing server, where swapping in cached examples lowered grouping
  accuracy on one of 16 datasets. Security, governance and brand effects are unmeasured, and VeRO lists
  adding examples where the problem calls for validation as an anti-pattern.'
