- source: Deepak Panigrahy, Stephen Abkin, Aakash Tyagi, David Kebo Houngninou, Rabi Mahapatra (Texas
    A&M University), "Repeating Work Can Lower Energy per Successful Goal in LLM Agents", https://arxiv.org/abs/2611.10315
  date: '2026-11-06'
  task: Inject one transient failure (malformed reply, rate limit, tool error or timeout) early or late
    in live runs of tasks the model solves reliably, then compare restart (task and tools from the beginning),
    resume (keep conversation and current tool state, continue with an error notice), grounded resume
    (adds the tools' actual state) and rollback (restore conversation and tools to the start of the interrupted
    turn), each with the prefix cache kept or cleared, by energy per successful goal with failed runs
    counted
  effect: 'Main study, Qwen3 30B, 30 tasks, 1,920 goals: after early failures with a warm cache, restart
    completed 112 of 120 goals and resume 91 of 120, and restart used 22% less energy per successful goal
    (95% CI 9 to 35%); after late failures resume used 24% less than restart (10 to 36%). Time per successful
    goal: early, restart 20.3 s against resume 25.9 s; late, resume 21.3 s against restart 27.7 s. After
    late tool errors: restart 28 of 30, resume 24, grounded resume 26, warm rollback 27, cold rollback
    29. Rollback had the lowest observed energy per successful goal after tool failures: 22.5% below warm
    resume early (1.1 to 42.6%) and 20.2% below warm restart late (6.8 to 31.2%); its savings over restart
    early (2.9%) and resume late (3.6%) were within task variation. As one fixed policy, warm rollback
    cost 6.5% above the cheapest recovery per condition on average (at most 18%), against 10.1% for cold
    rollback, 15.2% for warm resume and 18.7% for warm restart. Restart''s early success edge held at
    temperature 0.7 (58 against 47 of 60), on Mistral Small 3.2 24B (31 against 26 of 32), gpt-oss 20B
    (43 against 29 of 48) and Qwen3 4B (40 against 24 of 40). A warm prefix cache cut uncached prompt
    tokens 86% (85 to 87%) but recovery energy 8% (6 to 10%) at contexts up to 7,333 tokens. On held-out
    tasks a rule using the failure type and calls already made used 7.6% less energy per successful goal
    than always resuming and 22.0% less than always restarting, choosing warm rollback in 98 of 111 decisions.'
  conditions: BFCL multi-turn base tasks each model solved reliably (30 main, 28 held out), one failure
