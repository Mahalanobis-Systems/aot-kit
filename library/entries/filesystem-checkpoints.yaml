  date: '2026-04-30'
  task: 'Inject one crash per task and compare recovery for sandboxed agents: restart from scratch, conversation
    only, conversation plus files, a full file-and-process checkpoint every turn, and Crab (classifies
    each turn''s net file and process changes, checkpoints only what changed at turn boundaries, overlaps
    snapshots with the model call)'
  effect: '100 solved tasks per setup, one crash each: Crab, restart and every-turn full checkpoints recovered
    100%; conversation plus files 100% on SWE-bench but 28% (Claude Code) and 42% (iFlow-cli) on Terminal-Bench;
    conversation only 13% and 8% on Terminal-Bench and 9% on SWE-bench. Crab stayed within 0 to 1.9% of
    fault-free time; restart added up to 1.52x (Terminal-Bench) and 1.67x (SWE-bench); full checkpoints
    every turn were 3.06x and 3.78x slower at 64 and 96 sandboxes per host (Claude Code, Terminal-Bench).
    Up to 87% of turns needed no checkpoint; file snapshots took about 20 to 100 ms and process snapshots
    700 to 1,000 ms; p95 exposed checkpoint delay 0.44% of task time at 64 sandboxes. Live-model pilot
