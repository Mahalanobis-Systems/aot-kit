- source: Guanlong Wu, Dahui Li, Ke Jiang, Jianyu Niu, Cong Wang, Yinqian Zhang, "Safe to Resume? Breaking
    Execution Continuity of Agent Execution via Rollback", https://arxiv.org/abs/2608.29381
  date: '2026-08-29'
  task: 'Security study of checkpoint and rollback in five agent systems (LangGraph, CrewAI, Hermes, Cline,
    E2B): five failure modes, three end-to-end attacks, a rollback-validated prevalence study, and a microbenchmark
    of effect and checkpoint ordering'
  effect: 'Across 1,735 framework-task executions (one random recovery point each): incomplete internal
    state coverage in 1,166 (67.2%), inconsistent checkpoint state in 489, external state mismatch in
    198, divergent nondeterministic replay in 1,174 (67.7%), unrecorded external effects in 40 (2.3%).
    E2B''s full sandbox snapshots showed no incomplete or inconsistent internal state but still allowed
    external mismatch and replay divergence; Cline and Hermes, which restore files and conversation separately,
    were the only systems with inconsistent restored state (249 and 240 executions). Attacks: a Hermes
    workspace rollback kept a passing malware scan and released the uncleaned repository; a Cline task-history-only
    restore re-ran a forwarding rule on the live mailbox the service had switched to; a LangGraph payment
    node re-ran after a failure between payment and checkpoint, paying twice under one approval. With
    a failure injected between an external effect and its checkpoint write, execute-then-commit repeated
    or skipped the effect in 90 of 96 workflows (93.8%) and commit-then-execute in 93 (96.9%). 1,357 context-dependent
    references ("now", "current state") in checkpointed state; 30 of 30 sampled findings were exploitable.'
  conditions: 347 traces (241 Terminal-Bench, 106 AgentBench OS, DB and ALFWorld), DeepSeek-v4 as the
    agent and in the authors' detection pipeline (98.7% precision, 99.9% recall on manual inspection);
    a failure counts only when marked security-relevant; LangGraph and CrewAI ran one fixed agent-tool
    workflow; the authors say counts are not a security ranking of frameworks
  direction: mixed
  measured: true
  locator: §II Table I; §IV; §V-A to V-C; §VI-C Table II; §VI-D Tables III and IV
- source: 'Yu Zhuang, Kefei Chen, Yitong Duan, Shuxin Zheng, Jian Li, Xu-Yao Zhang, "AgentRewind: Recoverable
    Execution for Long-Horizon LLM Agents", https://arxiv.org/abs/2608.14380'
  date: '2026-08-14'
  task: 'Let the agent rewind to an earlier step: restore the workspace (a git commit per model or tool
    call in a bare repository outside the project) and the conversation together, serve the retained prefix
    from the log, and add a note on the abandoned attempt; compared with continuing, restarting with notes
    from failed attempts, and per-action safety review'
  effect: 'MettleBench (82 tasks), GPT-5.4 with mini-SWE-agent, success / checklist progress: continue
    62.2% / 81.4%, restart with experiences 78.0% / 88.8%, safety review 34.1% / 54.4%, AgentRewind 87.8%
    / 94.3%; GPT-5.4 mini success: 33.7%, 43.1%, 36.2%, 51.2%. Other harnesses with GPT-5.4, continue
    against AgentRewind: FnCallAgent 58.5% / 81.7%, smolagents CodeAgent 67.1% / 82.9%. Terminal-Bench
    2.0 (89 tasks): continue 78.7%, restart with experiences 70.8%, AgentRewind 83.1%. From 50 stuck endpoints,
    recovery 30.0% against 8.0% for continuing. Ablation: without workspace rewind 43.9%, without conversation
    rewind 65.9%, without the note 51.2%. Network requests and external-service calls are not undone;
    the retained prefix is served from the log, so they do not fire again.'
  conditions: Authors' own benchmark (criteria written by an LLM under their protocol) and runtime; temperature
    0, three runs, 74.7% of task-strategy-model triples agree across runs; no step, time or token limit
    and no cost reported; the success gain over restart with experiences is not significant for GPT-5.4
    mini after Holm correction
  direction: supports
  measured: true
  locator: AgentRewind Framework section; Tables 1 to 5; App. B Table 13; App. C.4 and C.5; App. D
- source: 'Sajjad Khan, "Resume Means Resume: A Machine-Checked Conformance Contract for Checkpoint, Interrupt,
    and Resume Semantics in Workflow Persistence Layers", https://arxiv.org/abs/2608.03836'
  date: '2026-08-04'
  task: Define six resume properties (including effect exactly-once and consume-once), model-check them,
    and measure five agent workflow frameworks' checkpoint, interrupt and resume APIs with a deterministic
    LLM-free harness and an external effect ledger, plus live-model runs
  effect: 'LangGraph 1.2.9 (in-memory, SQLite and PostgreSQL savers): after a SIGKILL following a durable
    write, resume re-executed the completed task (effect count 1 before, 2 after), and killing after each
    of five persistence writes re-executed completed work at all four incomplete boundaries ("exactly-once
    across interrupts, at-least-once across crashes"); a second resume with a different approval value
    was served the first decision; schema-invalid state was persisted silently. CrewAI 1.15.2 checkpoint
    restore re-ran a completed effect-bearing method (effect counter 2) while its state, rebuilt from
    initial values, looked correct. pydantic-graph 1.x refused to restore after a crash inside a node.
    Concurrent resumes of one parked interrupt (2 to 16 racers): 2,628 gated effects where exactly-once
    predicts 400 over 40 cells, every racer firing in 36 of 40 cells, 16 fires from one approval in 10
    of 10 runs at 16 racers; a compare-and-swap gate in the shared store served one racer. An embedded
    DBOS 2.27.0 worker conformed on every probed cell, running each step''s effect once across process
    death; an OpenAI Agents SDK file-backed session restore did not re-invoke a tool in a live run.'
  conditions: Pinned releases; pure-Python probes with no model calls (crashes by exception and by SIGKILL),
