summary: 'Save the agent''s state at every step, and back up anything a tool call will change outside
  the workspace, so a failed or stuck run rolls back instead of starting over. It pays when restores are
  complete and consistent: with one crash injected per solved task, restoring conversation, files and
  processes recovered every task within 1.9% of fault-free time, against 8 to 13% of Terminal-Bench tasks
  for resuming from the conversation alone, and a rewind that restored workspace and conversation together
  with a note on what failed raised success on long engineering tasks from 62.2% to 87.8% (GPT-5.4), though
  in an independent study rollback without the note did no better than the note alone. Built-in checkpoints
  in Claude Code, Codex and similar harnesses cover only the workspace, and six frontier agents backed
  up state they changed elsewhere before only 15.2% of documented regret moments, while a harness hook
  that backs up before each state-changing call covered all of them at $0.014 per task. Resuming is not
  always cheaper than restarting (with small open models, restarting after an early failure succeeded
  more often: 112 against 91 of 120 runs), and the risks are side effects and partial restores: framework
  checkpointers re-ran completed steps after a real crash, and restores that bring back some state but
  not the rest let approvals carry over to the wrong action.'
how: '1. Start from the baseline: restart the run from scratch on a crash, and resume from the conversation
  history alone (what most framework checkpointers and hosted agents restore). On 100 solved tasks per
  setup with one injected crash each, restart recovered every task but added up to 1.52x (Terminal-Bench)
  and 1.67x (SWE-bench) to completion time, and conversation-only resume recovered 8 to 13% of Terminal-Bench
  tasks and 9% of SWE-bench tasks (Wu, Apr 2026). Compare on live runs too, not only replays, and count
  failed runs in the cost: on 30 multi-turn function-calling tasks with one injected transient failure
  (Qwen3 30B), restarting after an early failure completed 112 of 120 runs against 91 for continuing with
  the error in context, and used 22% less energy and 20.3 s against 25.9 s per successful goal, while
  after a late failure continuing was 24% cheaper (Panigrahy, Nov 2026). 2. Checkpoint what the next step
  depends on, not only the transcript: at each turn boundary (after tool results, before the next model
  call) record the conversation and the workspace together, for example a commit per step in a bare git
  repository kept outside the project''s own history, with secrets excluded and caches dropped (Zhuang,
  Aug 2026), and add a process or sandbox snapshot when the task leaves services running or packages installed:
  conversation plus files recovered 100% on SWE-bench but only 28 to 42% on Terminal-Bench, where processes
  matter (Wu, Apr 2026). Always restore conversation and workspace from the same point: inconsistent restored
  state appeared only in the two tools that let files and conversation be restored separately, and a workspace
  rollback that kept the agent''s passing malware scan released the uncleaned repository (Wu, Aug 2026).
  3. Back up state the agent changes outside the workspace, in the harness, before the call runs: built-in
  checkpoints in Claude Code, Codex, Hermes, OpenHands and OpenClaw cover the workspace or the agent''s
  own file edits only, and six frontier agents (including Claude Opus-5, GPT 5.6-Sol, Gemini 3.7-Flash
  and DeepSeek V4-Pro) backed up such state before only 15.2% of 205 documented regret moments, a rate
  set by the model (68.3 to 73.3% for Opus-5, 0 to 1.7% for DeepSeek V4-Pro across three harnesses) rather
  than the harness. Add a pre-tool-call hook that rewrites deletes into moves to a trash folder, pairs
  package installs with a record of the installed versions, snapshots files, and sends other state-changing
  calls (scripts, database, mail and cluster tools) to a lightweight backup subagent that logs how to
  restore each one: it backed up every regret-moment action, restored state to 92.2% similarity against
  33.8% for reconstructing it afterward, cost $0.014 and 55K tokens per task against $0.344 and 382K for
  telling the main agent to back up (which covered 81.4%), and left pass rates unchanged on 40 outside
  tasks; server-generated IDs and third-party replies could not be restored (Li, Oct 2026). 4. Size checkpoints
  to what changed: skip turns with no net file or process change (up to 87% of turns), take file snapshots
  (about 20 to 100 ms) where only files changed and process snapshots (700 to 1,000 ms) only where processes
  changed, and run them during the next model call; that kept a crashed run within 1.9% of fault-free
  time, while a full checkpoint every turn was 3.78x slower at 96 sandboxes per host, worse than restarting
  (Wu, Apr 2026). 5. Treat external side effects that cannot be backed up (payments, messages, deploys,
  approvals) as the hard part: record each call and its result in a durable ledger keyed by the step,
  outside the checkpoint, and on resume return the recorded result instead of calling again. Test this
  with a real kill, not a raised exception: LangGraph 1.2.9 re-ran a completed step whose result was durably
  written after a SIGKILL, CrewAI 1.15.2''s checkpoint restore re-ran a completed effect while its state
  looked correct, and an embedded DBOS engine ran each step''s effect once (Khan, Aug 2026). Ordering
  the effect and the checkpoint write does not close the gap: with a failure between them, execute-then-commit
  repeated or skipped the effect in 90 of 96 workflows and commit-then-execute in 93 (Wu, Aug 2026); use
  idempotency keys or a transactional effect record (2.b.i). Make resumes single-shot and re-check what
  a restore carries forward: claim a parked step or approval in the shared store with a compare-and-swap
  before running it (when 2 to 16 processes resumed one parked approval, every racer fired the gated effect
  in 36 of 40 cells) (Khan, Aug 2026). After any restore, re-validate approvals, checks and external bindings
  (the active account or mailbox, recipients) against the live world, and store concrete values (timestamps,
  object IDs, versions) rather than references such as "now" or "current state": rollback re-ran a test
  mail-forwarding rule on a live mailbox and paid an invoice twice under one approval (Wu, Aug 2026);
  gate irreversible actions (10.b.i). 6. Use checkpoints for rollback, not only crash recovery. When a
  call failure reaches the agent, consider rolling back conversation and tool state together to the start
  of the interrupted turn and rerunning it instead of continuing with the error in context: in one study
  with small open models this had the lowest energy per successful goal after tool failures (22.5% below
  continuing early, 20.2% below restarting late), and a rule that mostly chose it used 7.6% less energy
  per successful goal than always continuing and 22.0% less than always restarting on held-out tasks (Panigrahy,
  Nov 2026). For stuck runs, give the agent a rewind tool that restores workspace and conversation to
  an earlier step and adds a short note on what failed. On 82 long engineering tasks with GPT-5.4 this
  raised success from 62.2% (continue) and 78.0% (restart with notes) to 87.8%, and recovered 30% of 50
  stuck runs against 8%; rewinding the conversation without the workspace scored 43.9%, below not rewinding
  (Zhuang, Aug 2026). Carry lessons across the rollback but not the abandoned branch''s claims about current
  state: in an independent replication on ALFWorld, ScienceWorld and GAIA with three open models, rollback
  with such a note beat the strongest baseline by 3.04 to 6.57 points, while rollback alone (69.37%) did
  no better than the note alone (70.48%) on ScienceWorld with DeepSeek-V3, and an earlier rollback method
  scored below a plain ReAct agent with DeepSeek-V3 (47.72% against 62.86%) (Yu, Sep 2026). Roll back
  to the checkpoint before the step that caused the failure, not only the last command, and rebuild a
  repaired state from its recorded steps before trusting it: in environment setup with GPT-5.4, checkpointing
  each validated stage and repairing from it reached 90.7% against 53.7% for per-command rollback and
  77.8% for in-place repair, and leaving repairs out of the recorded steps cut success to 25.9% (Li, Nov
  2026). External effects are not rewound, so keep steps 3 and 5; for branching search over snapshots
  see 7.c.v. 7. Measure with crash- and fault-injection runs on tasks the agent already solves, on live
  runs as well as replays: one fail-stop per task at a random step and one transient call failure early
  and one late, recovered by restart, transcript-only resume, continuing with the error, rollback to the
  start of the turn and your checkpoints, scoring recovery correctness, redo time and tokens per successful
  goal (failed runs included), duplicate effects counted in a ledger the agent cannot see, restored-state
  similarity for state outside the workspace, and checkpoint and backup latency exposed in fault-free
  runs; for rollback, compare runs with and without the rewind tool and the note at a fixed token budget.'
detect:
  static: What a checkpoint covers (transcript only, workspace files, sandbox processes, state changed
    outside the workspace such as installed packages, database rows, mail or cluster configuration, a
    ledger of external effects) and when it is written; whether state outside the workspace is backed
    up by the harness before the call rather than left to the model; whether resume serves recorded tool
    results or re-executes them; whether conversation and workspace can be restored from different points;
    whether a parked step or approval is claimed atomically before it runs; which recovery runs after
    a call failure (restart, continue with the error, roll back the turn); resume logic on start.
  traces: Resume and rollback events and the recovery chosen after each failure; steps re-executed after
    a resume; an external effect issued twice for one step; state-changing calls outside the workspace
    with no backup recorded; checkpoint and backup latency exposed on the critical path; rollbacks per
    run and what followed them.
  evals: 'Recovery from injected crashes (a real kill, not only an exception) and from transient call
    failures early and late, on live runs of tasks the agent already solves, against restart, transcript-only
    resume and continuing with the error: recovery correctness, redo time and tokens per successful goal
    with failed runs counted, duplicate effects in an external ledger, and restored-state similarity for
    state outside the workspace.'
  probes:
    what: Kill mid-run and resume.
    construct: Kill right after an expensive step, after each durable write, and between an external effect
      and its checkpoint; resume and confirm the step is not redone and the effect fires once in a ledger
      the agent cannot see; resume one parked approval from two processes at once; roll back after a validation
      or approval and confirm it does not carry over to the restored files or a changed external binding;
      change state outside the workspace (upgrade a package, update a row through a database tool, delete
      a mail) and confirm it was backed up before the call and restores to match a copy taken beforehand.
  primary:
  - probes
impact:
  quality:
    effect: improves
    size: medium
    when: after one injected crash, restoring files and processes recovered 100% of solved tasks against
      28 to 42% for conversation plus files and 8 to 13% for conversation only on Terminal-Bench (Wu,
      Apr 2026); a rewind tool restoring workspace and conversation raised success from 62.2% (continue)
      and 78.0% (restart with notes) to 87.8% on 82 long tasks with GPT-5.4, and from 78.7% to 83.1% on
      Terminal-Bench 2.0, but rewinding the conversation without the workspace scored 43.9% (Zhuang, Aug
      2026); an independent replication with three open models gained 3.04 to 6.57 points over the strongest
      baseline, while rollback alone (69.37%) matched the note alone (70.48%) (Yu, Sep 2026); after an
      early transient failure restarting completed 112 of 120 runs against 91 for continuing with the
      error, and after late tool errors rolling back the interrupted turn completed 27 and 29 of 30 against
      24 (Panigrahy, Nov 2026); validated-stage checkpoints reached 90.7% against 53.7% for per-command
      rollback in environment setup (Li, Nov 2026); harness backups restored state outside the workspace
      to 92.2% similarity against 33.8% for reconstruction, with pass rates unchanged (Li, Oct 2026);
      framework checkpointers re-ran completed steps after a crash (Khan, Aug 2026)
    basis: evidence
  cost:
    effect: improves
    size: medium
    when: 'a crash with no checkpoint re-runs prior work: restart added up to 1.52x to 1.67x completion
      time against within 1.9% with checkpoints, and forking from a checkpoint instead of re-running a
      shared prefix cut RL rollout tokens 40.0 to 64.2% (Wu, Apr 2026); rolling back the interrupted turn
      had the lowest energy per successful goal after tool failures and cost 6.5% above the cheapest choice
      on average against 15.2% for continuing and 18.7% for restarting, but continuing after an early
      failure cost 22% more than restarting, and a warm prefix cache cut uncached prompt tokens 86% but
      recovery energy only 8% (Panigrahy, Nov 2026); harness backups added $0.014 and 55K tokens per task
      (Li, Oct 2026); the rollback study reports no token cost and set no budget (Zhuang, Aug 2026)'
    basis: evidence
  performance:
    effect: mixed
    size: medium
    when: checkpointing only turns with net changes and overlapping snapshots with the model call kept
      a crashed run within 1.9% of fault-free time, with p95 exposed delay of 0.44% at 64 sandboxes per
      host; a full file-and-process checkpoint every turn was 3.06x and 3.78x slower at 64 and 96 sandboxes,
      worse than restarting (up to 1.52x); process snapshots took 0.7 to 1.0 s against 20 to 100 ms for
      file snapshots (Wu, Apr 2026); time per successful goal was 20.3 s for restarting against 25.9 s
      for continuing after early failures, and 27.7 s against 21.3 s after late ones (Panigrahy, Nov 2026);
      harness backups took 23.3 s per regret-moment action against 34.1 s when the main agent backed up
      (Li, Oct 2026); rolling back to an earlier setup stage was the slowest recovery action, 9.9 to 38.0
      minutes (Li, Nov 2026)
    basis: evidence
  security:
    effect: mixed
    size: medium
    when: 'restores combine state from different points: incomplete internal state in 67.2% of 1,735 executions
      across five frameworks, and attacks that kept a passing malware scan for an uncleaned repository,
      re-ran a mail-forwarding rule on a live mailbox and paid twice under one approval (Wu, Aug 2026);
      2 to 16 processes resuming one parked approval each fired its effect (Khan, Aug 2026); rollback
      also restores a known-good state after a destructive action, such as overwritten test fixtures (Zhuang,
      Aug 2026), and backups before every state-changing call covered all 205 documented regret moments
      while a destructive-command guard routed through the same backups covered 8.1% (Li, Oct 2026)'
    basis: evidence
  governance:
    effect: mixed
    size: medium
    when: 'per-step commits and checkpoints give a reviewable history and an undo (Young, Nov 2025; Zhuang,
      Aug 2026), and a backup log records how to restore each backed-up action, with backup scope set
      from stated user preferences matching human labels at 84.5% F1, but built-in checkpoints in five
      harnesses cover only the workspace or native edits (Li, Oct 2026); framework records can misstate
      what happened: CrewAI''s restore re-ran an effect while its state looked correct, and LangGraph
      persisted schema-invalid state silently and served a second, different approval the first answer''s
      branch (Khan, Aug 2026)'
    basis: evidence
  brand:
    effect: none
    basis: assessment
