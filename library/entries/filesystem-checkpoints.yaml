caveats: 'The quality gains come from the authors'' own systems: rollback was tested on the authors''
  own 82-task benchmark with one model family, no token or step limit and no cost reported, and 74.7%
  of task-strategy-model triples agreed across three runs (Zhuang, Aug 2026); the crash-recovery comparison
  replays recorded traces of tasks the agents had already solved (Wu, Apr 2026). A restored run is not
  a replay: with a live model, conversation plus files recovered 34% against 48% under replay because
  the agent''s corrective actions perturbed the run (Wu, Apr 2026), and widely used framework checkpointers
  differ in what they re-execute, so a framework''s exactly-once claim has to be tested with real kills
  (Khan, Aug 2026). Checkpoints cannot undo external effects and ordering the effect and the checkpoint
  write does not fix that (90 and 93 of 96 workflows still repeated or skipped the effect); the security
  study''s prevalence counts come from its own model-built detection pipeline (98.7% precision on manual
  inspection) at one recovery point per run (Wu, Aug 2026).'
