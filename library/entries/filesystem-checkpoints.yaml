    author who also ships a repair layer (Remit); existence results, no prevalence claimed
  direction: mixed
  measured: true
  locator: Abstract; §II Table I; §VI-A to VI-G; Tables V and VI
- source: 'Tianyuan Wu, Chaokun Chang, Lunxi Cao, Wei Gao, Wei Wang, "Crab: A Semantics-Aware Checkpoint/Restore
