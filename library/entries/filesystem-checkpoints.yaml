- source: 'Xu Li, Simon Yu, Minzhou Pan, Yiyou Sun, Zhaorun Chen, Bo Li, Weiyan Shi, "Back Up Before You
    Regret: Measuring Backup Awareness and Automating Backup in Coding Agents", https://arxiv.org/abs/2610.28934'
  date: '2026-10-20'
  task: Build 205 executable multi-turn tasks from user-reported moments of regret at lost state, with
    the affected state placed outside the harness's built-in backups; measure whether coding agents back
    it up before the action, then add BackUpper, a pre-tool-call hook that rewrites commands into reversible
    ones (a delete becomes a move to a trash folder), pairs commands with backups (a package install with
    a record of installed versions), snapshots files, and sends other state-changing calls to a lightweight
    backup subagent that logs how to restore
  effect: 'Six frontier models passed 81.5% to 92.2% of tasks (mean 86.1%) but backed up the regret-moment
    state in 15.2% on average, four below 10% (GPT 5.6-Sol 5.9%, DeepSeek V4-Pro 2.9%); Claude Opus-5,
    the highest, missed it in 35.6%; 72.0% of runs completed the task without a backup. On a 60-task subset
    run in Claude Code, Codex and Hermes, rates varied by at most 5 points within a model (Opus-5 68.3%
    to 73.3%, GPT 5.6-Sol 5.0% to 8.3%, DeepSeek V4-Pro 0% to 1.7%), and GPT 5.4, 5.5 and 5.6-Sol stayed
    at 5.0% to 6.7%. Built-in backups in Hermes, OpenClaw, OpenHands, Claude Code and Codex cover the
    workspace or native edits; none covers state changed through external tools. BackUpper backed up every
    regret-moment action on all six models; restored state averaged 92.2% character-level similarity to
    the original against 14.3% without restoration and 33.8% for reconstruction afterward by Claude Opus-5.
    Instructing the main agent to back up reached 81.4%, a destructive-command guard routed through the
    same backups 8.1%, BackUpper without its per-tool backup notes 77.6%. Backup overhead per task: 55K
    tokens and $0.014 against 382K and $0.344 when the main agent was instructed to back up (cost assumes
    full cache hits); latency 23.3 s against 34.1 s per regret-moment action; 0.82 MB of storage per task
    on 40 terminal tasks, 64% less than copying affected files. On 40 Terminal-Bench 4 and DeepSWE tasks
    pass rates were unchanged (52.5% GPT 5.6-Sol, 45.0% Claude Opus-5) while the share of out-of-workspace
    changes backed up rose 76.9 and 52.9 points. Backup scope set from stated user preferences matched
    human labels at 84.5% F1. Server-generated fields such as post IDs and third-party replies cannot
    be restored.'
  conditions: RegretBench (205 tasks over terminal, PostgreSQL, browser, email and Kubernetes, the last
