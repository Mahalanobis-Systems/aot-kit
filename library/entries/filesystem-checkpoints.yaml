measure:
- method: experiment
  tier: 2
  how: 'crash- and fault-injection runs on tasks the agent already solves, on live runs as well as replays:
    one fail-stop per task at a random step (SIGKILL of the agent process or sandbox, not a raised exception),
    recovered by restart, transcript-only resume, transcript plus files, and the full checkpoint, plus
    one transient call failure early and one late, recovered by restarting, continuing with the error
    in context and rolling back conversation and tool state to the start of the turn; score recovery correctness,
    redo time and tokens per successful goal with failed runs counted, duplicate external effects counted
    in a ledger the agent cannot see, and exposed checkpoint latency in fault-free runs; add probes that
    change state outside the workspace (packages, database rows, mail, cluster configuration) and compare
    the restored state with a copy taken before the call, probes that kill right after each durable write
    and between an effect and its checkpoint, resume one parked approval from two processes, and roll
    back after a validation; for rollback, paired runs with and without a rewind tool and with and without
    a note on the abandoned attempt, on long tasks at a fixed token budget (success, tokens, rewinds per
    run)'
- method: monitor
  how: resume and rollback events per run and the recovery chosen after each failure, steps re-executed
    per resume, external effects issued more than once per step key, approvals consumed more than once,
    state-changing calls outside the workspace with no backup recorded, backup cost, latency and storage
    per task, checkpoint latency exposed on the critical path, checkpoint size and retention, and task
    outcomes after each rewind
