caveats: 'The quality gains come mostly from the methods'' own authors: rollback was tested on the authors''
  own 82-task benchmark with one model family, no token or step limit and no cost reported (Zhuang, Aug
  2026), the independent replication used open models on ALFWorld, ScienceWorld and GAIA and gained 3.04
  to 6.57 points (Yu, Sep 2026), the stage-checkpoint ablation is 54 environment-setup tasks with GPT-5.4
  and its headline gains set best-of-three runs against baselines'' own protocols (Li, Nov 2026), and
  the backup results come from the authors'' 205-task benchmark scored by an LLM judge (95.3% agreement
  with people) and cannot restore server-generated IDs or third-party replies (Li, Oct 2026). The crash-recovery
  comparison replays recorded traces of tasks the agents had already solved (Wu, Apr 2026); the one live
  comparison of restart, continuing and rollback used small open models (mainly Qwen3 30B) on 30 function-calling
  tasks, measured energy on one node, and found the cheapest recovery varied with the failure point and
  model (Panigrahy, Nov 2026), and with a live model conversation plus files recovered 34% against 48%
  under replay because the agent''s corrective actions perturbed the run (Wu, Apr 2026). Checkpoints cannot
  undo external effects and ordering the effect and the checkpoint write does not fix that (90 and 93
  of 96 workflows still repeated or skipped the effect), the security study''s prevalence counts come
  from its own model-built detection pipeline (98.7% precision on manual inspection) at one recovery point
  per run (Wu, Aug 2026), and widely used framework checkpointers differ in what they re-execute, so a
  framework''s exactly-once claim has to be tested with real kills (Khan, Aug 2026). No source measures
  checkpoints or backups in production use, and none compares them with restart at matched compute on
  current frontier thinking models in live runs.'
