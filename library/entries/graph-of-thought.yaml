  per task, or from papers proposing a successor method; in independent comparisons graph methods trailed
  chain-of-thought or direct answering on GPQA and step-by-step math, GoT ranked below tree search on
  a six-task suite with the highest share of runs both costlier and worse, and the one cost-matched study
  (one model, 50 items per set, not merge-shaped tasks) found a two-call reasoning graph tied chain-of-thought
  self-consistency while its structure changed no answer. Evidence on reasoning models is thin: a competing
  method''s paper reports a GoT baseline on o3-mini and DeepSeek-R1 between 0.7 below and 1.3 above self-consistency,
  without describing the GoT setup or counting tokens, and a one-call benchmark found o3-mini already
  sorts lists of up to 256 items with a sorting score of 0.990, so the original GPT-3.5 sorting gains
  may not carry over; no source runs the original GoT on long merge tasks with a current model. The later
  graph methods (Adaptive GoT, Network-of-Thought) are different designs; Adaptive GoT reports no cost
  figures, and an independent rerun with token counts found it worse than chain-of-thought on HotpotQA
  (72.0 vs 86.0) at substantially more tokens. Results vary run to run (the top strategy won only 77%
  of head-to-head runs in one benchmark), and only two of these sources report repeated runs.'
