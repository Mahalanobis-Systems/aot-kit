caveats: Most gains come from hand-built graphs on synthetic merge tasks run with GPT-3.5 on 100 samples
  per task, or from papers proposing a successor method; in some independent comparisons graph methods
  trailed chain-of-thought or direct answering on GPQA and step-by-step math, and GoT ranked below tree
  search on a six-task suite and had the highest share of runs both costlier and worse. No source compares
  GoT with self-consistency or best-of-N at matched tokens, and none tests the original GoT on reasoning
  models. The later graph methods (Adaptive GoT, Network-of-Thought) are different designs; Adaptive GoT
  reports no cost figures, and an independent rerun with token counts found it worse than chain-of-thought
  on HotpotQA (72.0 vs 86.0) at substantially more tokens. Results vary run to run (the top strategy won only 77% of head-to-head runs in one benchmark),
  and only two of these sources report repeated runs.
