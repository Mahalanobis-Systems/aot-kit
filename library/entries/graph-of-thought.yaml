summary: 'Graph-of-Thought runs one task as a graph of model calls: split the input into parts, generate
  and score several candidates per part, keep the best, then merge the partial results and refine the
  merged answer. It paid on merge-shaped tasks that one call gets wrong as inputs grow: on sorting it
  made fewer errors than Tree-of-Thought at lower cost (median error about 62% lower in the original paper;
  12.7 against 18.4 mistakes at 5.0 against 15.9 cents in a re-implementation), but it cost far more than
  one chain-of-thought call. Independent 2025-2026 comparisons are mixed: graph methods mostly beat chain-of-thought
  on Game of 24 and multi-hop QA but trailed it or direct answering on GPQA and step-by-step math at several
  times the tokens; on a six-task suite GoT ranked below tree search and had the highest share of runs
  both costlier and worse. No study compares GoT with self-consistency at matched tokens.'
how: '1. Start from one chain-of-thought call and from self-consistency or best-of-N with a vote at the
  same total tokens (9.c.ii); add a graph only where one call fails on inputs that split into parts whose
  results can be merged (sorting, set intersection, keyword counting, merging documents, questions that
  combine several sources) and the failures grow with input size. On step-by-step math (GSM8K, MATH-500)
  graphs lost to a single call with GPT-4o-mini and Qwen2.5-7B, at far more tokens where counted. 2. Write
  the graph of operations for the task class up front, as the original framework does (a controller executes
  a fixed plan through a per-task prompter, parser and scorer): split the input into parts small enough
  that one call usually gets each right (16 elements in the paper), Generate several candidates per part
  (k=5), Score them and KeepBestN(1), Aggregate pairs of partial results with several attempts each, Score
  and keep the best again, and add a refine step on the merged result; merge level by level up to the
  final answer. 3. Score with code wherever the task allows (the paper''s sorting and set scorers count
  errors); an LLM scorer is noisier, and in one benchmark replacing search strategies'' heuristic evaluator
  with an exact one raised quality and cut run-to-run variance. Without a trustworthy score, keeping the
  best of k is close to a random pick. 4. Hold cost down: run independent nodes in parallel and cache
  repeated calls (parallel execution took GoT sorting from 259 s to 30 s per instance); trim few-shot
  examples in node prompts, which dominate once the task is split finely; pass compact summaries instead
  of whole parent contexts; route leaf subtasks to a smaller model while planning and the final merge
  stay on the strong one, under a token budget that caps depth, branching and node count (one router cut
  output tokens 79.1% against Adaptive GoT). 5. Tune k, part size and depth on a held-out set with cost
  capped at the untuned level (one framework cut sorting mistakes from 12.7 to 12.1 at no extra cost).
  6. Measure on a paired set against chain-of-thought and self-consistency at matched input-plus-output
  tokens, per model and per input size, over repeated runs (the top strategy won only 77% of head-to-head
  runs in one benchmark): accuracy on a deterministic grader, tokens, wall-clock latency and cost per
  correct answer.'
detect:
  static: 'A controller that runs a fixed or generated graph of model calls on one task: split the input,
    generate several candidates per part, score and keep the best, aggregate partial results and refine
    the merge (GoT''s Generate, Score, KeepBestN, Aggregate). Flag independent nodes run one after another,
    every node on the strongest model, an LLM scorer where code could check, and no cap on depth, branching,
    nodes or tokens.'
  traces: 'Per item: nodes and model calls, input and output tokens per node, aggregation and refine steps,
    scorer verdicts beside an independent check, budget-cap hits, wall-clock time. In a single-call agent,
    errors that grow with input size (dropped, duplicated or miscounted elements) mark where a split-and-merge
    graph could help.'
  evals: Accuracy against chain-of-thought and self-consistency at matched tokens, sliced by input size;
    cost and latency per correct answer.
  judge: Rate whether each merge kept all information from its inputs without duplication (retention and
    redundancy, as in GoT's document-merging score).
  probes:
    what: Tasks whose sub-results must be merged, at growing input sizes, plus a sequential control.
    construct: Sorting, set-intersection, keyword-counting or document-merge inputs at 32, 64 and 128
      elements (or more documents), checked by code, plus step-by-step math items where a graph should
      not beat one chain-of-thought call.
  primary:
  - evals
