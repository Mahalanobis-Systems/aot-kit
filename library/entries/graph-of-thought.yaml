summary: 'Run one task as a graph of model calls: split the input into parts, generate and score several
  candidates per part, keep the best, then merge the partial results and refine the merged answer. It
  paid on merge-shaped tasks that one GPT-3.5 call got wrong as inputs grew (sorting median error about
  62% below Tree-of-Thought in the original paper; 12.7 against 18.4 mistakes at 5.0 against 15.9 cents
  in a re-implementation), at far more cost than one chain-of-thought call, but one o3-mini call now sorts
  lists of up to 256 items with a sorting score of 0.990. Independent comparisons are mixed: graph methods
  mostly beat chain-of-thought on Game of 24 and multi-hop QA but trailed it or direct answering on GPQA
  and step-by-step math at several times the tokens, and GoT ranked below tree search on a six-task suite
  with the highest share of runs both costlier and worse. In the one study matched on calls, a two-call
  reasoning graph only tied chain-of-thought self-consistency, and the graph''s own typed edges changed
  no answer.'
how: '1. Start from one chain-of-thought call on the current reasoning model and from self-consistency
  with chain-of-thought votes at the same total tokens or calls (9.c.ii); a vote over bare answers is
  a weak baseline (78/58/70 against 98/90/82 with chain-of-thought votes in one study). Add a graph only
  where that call fails on inputs that split into parts whose results can be merged (sorting, set intersection,
  keyword counting, merging documents, questions that combine several sources) and the failures grow with
  input size. Check this first: one o3-mini call scored 0.990 on sort order and 0.965 on keeping the input
  items over lists of 2 to 256 items, and beat GPT-4o significantly only at 256 items; its residual errors
  were dropped or added items on long, token-heavy lists. On step-by-step math (GSM8K, MATH-500) graphs
  lost to a single call with GPT-4o-mini and Qwen2.5-7B, at far more tokens where counted. 2. Write the
  graph of operations for the task class up front, as the original framework does (a controller executes
  a fixed plan through a per-task prompter, parser and scorer): split the input into parts small enough
  that one call usually gets each right (16 elements in the paper), Generate several candidates per part
  (k=5), Score them and KeepBestN(1), Aggregate pairs of partial results with several attempts each, Score
  and keep the best again, and add a refine step on the merged result; merge level by level up to the
  final answer. 3. Score with code wherever the task allows (the paper''s sorting and set scorers count
  errors, including dropped and added items); an LLM scorer is noisier, and in one benchmark replacing
  search strategies'' heuristic evaluator with an exact one raised quality and cut run-to-run variance.
  Without a trustworthy score, keeping the best of k is close to a random pick. Do not count on structure
  the model labels itself: in one paired ablation, typed support and contradict edges and a structural
  stop rule changed no answer, because the model declared a conflict on only 4.0% of questions (an added
  step that read the edges repaired one item). 4. Hold cost down: run independent nodes in parallel and
  cache repeated calls (parallel execution took GoT sorting from 259 s to 30 s per instance); trim few-shot
  examples in node prompts, which dominate once the task is split finely; pass compact summaries instead
  of whole parent contexts; route leaf subtasks to a smaller model while planning and the final merge
  stay on the strong one, under a token budget that caps depth, branching and node count (one router cut
  output tokens 79.1% against Adaptive GoT). 5. Tune k, part size and depth on a held-out set with cost
  capped at the untuned level (one framework cut sorting mistakes from 12.7 to 12.1 at no extra cost).
  6. Measure on a paired set against chain-of-thought and chain-of-thought self-consistency at matched
  input-plus-output tokens (or calls, if tokens are not logged), per model and per input size, over repeated
  runs (the top strategy won only 77% of head-to-head runs in one benchmark), plus an ablation that keeps
  the calls but drops the structure (a second reflection pass, or self-consistency with as many samples
  as the graph makes calls): in one study a two-call reasoning graph tied two-sample chain-of-thought
  self-consistency (98 vs 98, 92 vs 90, 82 vs 82). Report accuracy on a deterministic grader, tokens,
  wall-clock latency and cost per correct answer.'
detect:
  static: 'A controller that runs a fixed or generated graph of model calls on one task: split the input,
    generate several candidates per part, score and keep the best, aggregate partial results and refine
    the merge (GoT''s Generate, Score, KeepBestN, Aggregate). Flag independent nodes run one after another,
    every node on the strongest model, an LLM scorer where code could check, and no cap on depth, branching,
    nodes or tokens.'
  traces: 'Per item: nodes and model calls, input and output tokens per node, aggregation and refine steps,
    scorer verdicts beside an independent check, budget-cap hits, wall-clock time. In a single-call agent,
    errors that grow with input size (dropped, duplicated or miscounted elements) mark where a split-and-merge
    graph could help.'
  evals: Accuracy against one chain-of-thought call on the current reasoning model and against chain-of-thought
    self-consistency at matched tokens or calls, sliced by input size, plus a same-calls ablation without
    the graph structure; cost and latency per correct answer.
  judge: Rate whether each merge kept all information from its inputs without duplication (retention and
    redundancy, as in GoT's document-merging score).
  probes:
    what: Tasks whose sub-results must be merged, at growing input sizes, plus a sequential control.
    construct: Sorting, set-intersection, keyword-counting or document-merge inputs at 32, 64, 128 and
      256 elements (or more documents), checked by code for order and for dropped or added items, run
      first as one call on the current reasoning model, plus step-by-step math items where a graph should
      not beat one chain-of-thought call.
  primary:
  - evals
impact:
  quality:
    effect: mixed
    size: medium
    when: 'gains on merge-shaped tasks with GPT-3.5: sorting 128 numbers, median error about 62% below
      ToT (Besta, Aug 2023), 12.7 against 18.4 mistakes in a re-implementation (Fricke, Feb 2026); one
      o3-mini call already scores 0.990 on sorting lists of up to 256 items (Herbold, Apr 2025); a generalized
      GoT on Qwen3-30B beat CoT on multi-hop QA (MoreHopQA 73.0 vs 68.0) and Game of 24 (72.0 vs 58.0)
      but trailed it on GPQA (59.6 vs 63.1) (Liu, Mar 2026); GPT-4.1 Nano six-task suite 0.336 vs CoT
      0.279 and CoT-SC 0.227, below ToT-BFS 0.415 (Potamitis, Dec 2025); below direct answering on MATH-500
      (73.24 vs 74.96) and GSM8K (88.76 vs 90.95) with Qwen2.5-7B (Hao, May 2025); graph reasoning 82.0
      vs CoT 89.5 on GSM8K (Huang, Mar 2026); a two-call reasoning graph tied cost-matched CoT-SC on deepseek-chat
      (GSM8K 98 vs 98, MATH 92 vs 90, BBH 82 vs 82) (Liu, Oct 2026); a GoT baseline on o3-mini and DeepSeek-R1
      within 0.7 below to 1.3 above CoT-SC (Teng, Feb 2025)'
    basis: evidence
  cost:
    effect: degrades
    size: large
    when: 'many calls per item: costs "much higher" than IO and CoT (Besta, Aug 2023); 9,468 output and
      16,826 input tokens per GPQA question against 4,965 and 247 for CoT (Liu, Mar 2026); mean cost 0.0099
      against 0.0003 for CoT and 0.0014 for CoT-SC, and the highest joint cost-quality failure rate of
      nine strategies, 43.3% (Potamitis, Dec 2025); two calls per question for a reasoning graph, with
      accuracy per call below one-call reflection on all three sets (Liu, Oct 2026); cheaper than ToT:
      over 31% at 128 elements (Besta, Aug 2023), 5.0 against 15.9 cents (Fricke, Feb 2026)'
    basis: evidence
  performance:
