caveats: 'Each measured gain rests on one benchmark and few runs: Cube''s vendor study (99 questions on
  one 25-table schema), a single-author ablation on DABStep in which 294 of 332 hard tasks are fee questions,
  no run was repeated and the author maintains the lookup library tested, and BIRD studies with gemini-1.5-pro
  or models no larger than Gemini 2.5 Flash. The lookup-over-prompt result is confounded and bounded:
  the looked-up contract restated the manual as per-metric entries with SQL expressions and settled three
  points the manual left open, the pasted manual still led on easy tasks on all four models, and Cube''s
  internal test favored the prompt for its 4 KB document. On EntSQL, concise evidence beat whole documents
  only when experts wrote it per question, and even then Claude Code reached 20.3% against 84.0% for experts
  on a 212-question sample. Past a modest share of the window, loading the whole schema costs more than
  it returns; that is 8.b.ii.'
