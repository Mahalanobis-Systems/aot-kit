# 5.b.i: Give the model the schema it queries, in context: descriptions, keys, codes, sample values
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 5.b.i
legacy_id: T40
slug: ground-queries-in-schema
name: 'Give the model the schema it queries, in context: descriptions, keys, codes, sample values'
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the model sees
levers:
