caveats: 'No study isolates the split as Anthropic built it, two first prompts on one harness, against
  one agent keeping the same state files (4.b.iii), and none tests an append-only list; the two controlled
  comparisons come from their authors'' own frameworks, bundle per-round planning and an independent tester
  or auditor with the fresh sessions, and neither matches tokens, one matching passes and the other nothing
  (45 game builds with one run each; WeaveBench, OSWorld and Terminal-Bench tasks rather than app builds,
  with the OSWorld baselines on a different tool set). The vendor accounts (Anthropic, Cursor, OpenAI)
  are single builds judged by their authors, and the factory observations come from two deployments of
  two to three weeks at one company. The advice conflicts on freezing the plan: Anthropic forbids editing
  the test list, while a frozen first plan lost 8.13 points to per-loop replanning and Cursor dropped
  up-front planning as too rigid, yet agents allowed to change their own CI loosened checks. The need
  and the cost shift with the model and task: Anthropic dropped resets for Opus 4.5 and sprints for Opus
  4.6 but kept the planner, one Codex session ran about 25 hours, one-conversation full-stack builds went
  from 3.1% to 53.1% fully working across three releases of one model family, and one round-based loop
  used 24% fewer tokens than a single session on one benchmark and 2.3 times as many on another.'
