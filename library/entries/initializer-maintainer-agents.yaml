caveats: 'No study isolates the split as Anthropic built it, two first prompts on one harness, against
  one agent keeping the same state files (4.b.iii); the one controlled comparison is one framework, one
  model setup and 45 game-building tasks with one run each, and its roles add an independent tester and
  per-loop planning. The vendor accounts (Anthropic, Cursor, OpenAI) are single builds judged by their
  authors, mostly on the vendors'' own models, with no quality numbers. The advice conflicts on freezing
  the plan: Anthropic forbids editing the test list, while a frozen first plan lost 8.13 points to per-loop
  replanning and Cursor dropped up-front planning as too rigid; an append-only list sits between them
  and is untested. The need shifts with the model: Anthropic dropped resets for Opus 4.5 and sprints for
  Opus 4.6 but kept the planner, and one Codex session ran about 25 hours without a separate setup role.'
