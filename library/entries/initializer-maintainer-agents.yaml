summary: 'Give the first session of a multi-session build a setup-only prompt (expand the spec into a
  JSON list of end-to-end tests, all failing, and write an init script, a progress file and a first commit)
  and every later session a maintainer prompt that reads that state, re-tests what passed, builds one
  failing item, verifies it end to end and commits. A separate up-front spec step pays when the model
  would otherwise start building and under-scope, and it is cheap: Anthropic kept its planner on Opus
  4.6 for that reason at $0.46 of a $124.70 run, and in one controlled study a planning call before a
  single development pass raised a game-building score from 49.58 to 59.71. Freezing that first plan is
  the weak part: in the same study a plan written once and built over three fresh sessions scored 63.39,
  above 58.24 for one session continued for three passes but below 71.52 when each session replanned from
  test results, and Cursor dropped its one-time planner as too rigid. No study compares the split with
  one agent keeping the same state files (4.b.iii), Anthropic''s two "agents" differ only in their first
  prompt, and strong models narrow the need: one Codex session ran about 25 hours on spec, plan and status
  files.'
how: '1. Start from one agent with one prompt that keeps the 4.b.iii state files (spec, plan, progress
  log, git history) in one continuous session with compaction, and log what goes wrong across a multi-session
  build: it starts building before it specs and under-scopes, tries to one-shot and runs out of context
  mid-feature, declares the job done early, or breaks features that had passed. A strong model may need
  nothing more: one Codex session with a spec, a milestone plan it wrote first, a runbook and a status
  file ran about 25 hours. 2. If it under-scopes or one-shots, give the first session a setup-only prompt
  on the same harness, tools and system prompt (in Anthropic''s version the first user prompt is the only
  difference), chosen by the harness when no feature list exists yet. It expands the spec into a JSON
  list of end-to-end tests ordered by priority, each with steps and all failing (over 200 for Anthropic''s
  claude.ai clone), and writes an init script that installs, starts the app and runs a smoke test, a progress
  file and a first git commit. Keep it at product level rather than implementation detail, since spec
  errors cascade downstream; ask for a concrete number of items ("20-100 tasks", not "many"); and review
  the spec itself, since a weak one set Cursor''s first browser on an architecture that could not grow
  into a full browser. 3. Give every later session a maintainer prompt with a fixed contract: read the
  progress file, the list and the git log; run the init script and re-test one or two core passing items,
  marking any regression failing and fixing it first; take the highest-priority failing item and only
  that; verify it end to end as a user would (browser automation for a web app); change only that item''s
  status; commit, update the progress file and leave a merge-ready state. 4. Let the plan move with the
  evidence instead of freezing it: allow each session, or a planning step at its start that cannot edit
  code, to append items for defects and requirements the build exposes and to re-prioritize, never to
  delete or weaken an item. In one study a plan frozen after the first loop scored 63.39 against 71.52
  when it was revised each loop from test results. 5. Keep each role narrow: check each session''s work
  outside the maintainer''s own pass flags (7.c.iii, 9.b.iii), and do not give one agent planning, coding,
  review, merging and the completion decision at once; Cursor''s agent that held all of them stalled and
  claimed premature completion. 6. Measure with paired runs on the same specs and model at matched sessions
  and tokens: one agent with the 4.b.iii files, setup plus maintainer, and setup plus a maintainer that
  may append items; score with an end-to-end suite the agents never see (features passing, spec features
  never built, regressions reopened), plus tokens, the setup session''s share and wall time; re-run after
  a model upgrade, since Anthropic dropped context resets for Opus 4.5 and sprints for Opus 4.6 but kept
  the planner.'
detect:
  static: Two entry points; a progress file and feature list; bootstrap and per-session flows.
  traces: Session handoffs; progress file updates; whether each session starts by reading state and running
    the smoke test; items removed or reworded in the feature list; sessions declaring the project done
    with items failing; a first-session plan never revised after tests expose new defects.
  evals: Multi-session completion rate.
  probes:
    what: A multi-session project.
    construct: A spec of a few dozen testable features built over several fresh-context sessions and scored
      by an end-to-end suite the agents never see; include a defect that only surfaces once a later feature
      is built, and check that later sessions add it to the list rather than edit or drop items.
  primary:
  - probes
