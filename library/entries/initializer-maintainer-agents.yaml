- source: Wilson Lin (Cursor), "Towards self-driving codebases", https://cursor.com/blog/self-driving-codebases
  date: '2026-02-05'
  task: 'Successive harnesses for building a web browser over weeks: one agent nudged to "keep going"
    on its own plan; equal agents sharing a state file; an up-front planner handing its plan to an executor,
    workers and a judge; a continuous executor that also planned; and finally recursive planners that
    never code plus workers that hand results back to them'
  effect: 'One agent on its own plan: "The model lost track of what it was doing, frequently stopped to
    proclaim success despite being far from it". With a separate planner, "Doing all planning upfront
    also made it hard for the system to dynamically readjust as new issues were discovered", and "The
    next version removed the independent planner." The executor that then planned, spawned, reviewed,
    merged and judged would "sleep randomly, stop running agents, do work itself ... and claim premature
    completion"; "it was being given too many roles". The final design keeps planners that never code
    and keep receiving worker handoffs. The first browser "converged on an architecture that was unfit
    to evolve into a full browser. This was a failure of the initial specification." "Generate 20-100
    tasks" instead of "generate many tasks" gave "very different wider behavior".'
  conditions: Opus 4.5 at first, then GPT-5.1 and GPT-5.2; one research project (a browser) run with hundreds
