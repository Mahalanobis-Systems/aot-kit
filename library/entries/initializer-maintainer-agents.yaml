    is tasked with making incremental progress in every session, while leaving clear artifacts for the
    next session." The two are one harness: "We refer to these as separate agents in this context only
    because they have different initial user prompts. The system prompt, set of tools, and overall agent
    harness was otherwise identical." Working on one feature at a time "turned out to be critical"; no
    numbers are reported, and "it''s still unclear whether a single, general-purpose coding agent performs
    best across contexts, or if better performance can be achieved through a multi-agent architecture."'
