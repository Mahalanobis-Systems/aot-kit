- source: 'Phan Binh Nguyen Lam, Nguyen Thai Anh, "ViAdminShift: A Vietnamese Benchmark for Event-Level
    Knowledge Updates Built from the 2025 Administrative Reform", https://arxiv.org/abs/2611.03171'
  date: '2026-11-02'
  task: Give the same current date in different places (today's date in the system prompt, "as of <date>"
    in the question, an earlier turn, a prior get_current_date result, an offered date tool) and ask about
    addresses whose province changed in a 2025 reform the models know about
  effect: With a plain system prompt, 78-100% of answers were old-only (outdated). With reasoning off,
    today's date in the system prompt left 68-100% old-only answers for 10 of 12 models; with reasoning
    on, it still left 70-78% for GPT-6 and Kimi-K3. Without reasoning, "as of" in the question lowered
    the old-only rate against the system-prompt date for all eight models shown (GPT-6 -74 points), though
    10-86% stayed old-only for all but one; with reasoning, it left no old-only answer for seven of eight
    models. Offered a get_current_date tool without a call instruction, five of six models without reasoning
    never called it; with the date as a tool result or in an earlier turn, 69-99% of answers stayed old-only.
    Having a model told the date rewrite each question first lowered old-only answers but inserted the
    old province as a premise into 7 of 80 questions (9%).
  conditions: Post hoc; 80 absorbed province-free addresses (T1np), single runs, plus a check on 300 units
    for six models with reasoning off; GPT-6, GPT-6-Luna, Kimi-K3, Claude Opus and Sonnet models, GLM-5.3,
    HY4, Muse-Glimmer and others; Vietnamese; repeats varied aggregate rates by up to 10 points
  direction: mixed
  measured: true
  locator: Abstract; Sec. 4.3; Sec. 5.3, Fig. 7; Sec. 6
- source: 'Lingfei Qian, Yan Wang, Xueqing Peng, Yupeng Cao, Yuechen Jiang, Zhuohan Xie, Anke Xu, Wenbo
