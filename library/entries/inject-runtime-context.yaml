caveats: 'Few studies isolate the date on agent tasks, and the newest are small: the placement results
  are post hoc, on 80 Vietnamese addresses in single runs, and the search-agent gain is one model on 320
  questions with instructions added on top of the date. Models fall back on their training prior: with
  reasoning off, a date in the system prompt, an earlier turn or a date tool left most answers about a
  changed fact outdated, having a model rewrite each question with the date inserted the old fact as a
  premise into 9% of them, and a declared past date changed what GPT-5 claimed to know (39% to 1%) but
  not its accuracy (0.76 to 0.75). On tasks that do not depend on time the date only adds variance, and
  chain-of-thought amplifies it, so fix the date in evals; some chat templates and providers already add
  a date, so check the model is not seeing two. Any per-request value placed before the cached prefix
  turns every call into a cache write (3.b.i).'
