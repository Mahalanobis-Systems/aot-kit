    to 0.43). Inside its knowledge window GPT-5 labeled 99% of dated answers as predictions at 0.82 accuracy,
    against 0.39 after its boundary.
  conditions: FinDendro, 2,226 facts 1999-2026 (1,340 controlled, chance about 0.27); GPT-5, DeepSeek-V3.2,
