caveats: 'Few studies isolate the date on agent tasks; the measured support is indirect: a stated year,
  absolute against relative dates, the time remaining in a negotiation. On tasks that do not depend on
  time the date only adds variance, and chain-of-thought amplifies it, so fix the date in evals. Some
  providers already add a date server-side, so check the model is not seeing two. Any per-request value
  placed before the cached prefix turns every call into a cache write (3.b.i).'
