summary: 'Tell the model the runtime facts it cannot know: today''s date and timezone, the working directory,
  OS and git state, the tools available, the user and locale. Inject them after the cached prefix, as
  a date rather than a timestamp, refresh them when they change, and when an answer depends on the date,
  state it in the question as well. The measured gains are on time-sensitive work: absolute dates beat
  relative ones, stating the time remaining each turn raised deal closure under deadlines, injecting vetted
  package versions cut code tasks with a known vulnerability from 36.70-55.70% to 10.90-27.60% across
  ten models, and instructions to resolve relative dates against the injected one took one search agent
  from 16.0% to 30.6%. The limits: in one study, with reasoning off, a date in the system prompt, an earlier
  turn or a date tool left most answers about a changed fact outdated, a stated past date does not hide
  what a model knows, and on tasks that do not depend on time the date only adds variance.'
how: '1. Start from the baseline: with the date fixed, run a slice of time-, environment- and user-sensitive
  tasks with no injected block, including facts that changed after the model''s cutoff, and record outdated
  answers, stale dates in queries, questions asking the user for facts the system holds, tool calls spent
  discovering the environment, and cache-read tokens per call. 2. List the runtime facts your tasks depend
  on: date and IANA timezone, working directory, OS and shell, git status, the tools or skills available,
  the user and locale, and for code that names dependencies the versions to use. In one study, injecting
  a vetted version for each library cut tasks with a known vulnerability from 36.70-55.70% to 10.90-27.60%
  across ten models, where an instruction to avoid vulnerable versions moved it by -2.2 to +4.3 points.
  3. Inject them after the cached prefix, in a trailing block or a message in the conversation, never
  under a cache breakpoint; keep the date to the day, and serve time of day through a clock tool or the
  shell, with an instruction to call it. Where the answer depends on the date, also state it in the request
  itself ("as of <date>"): in one study, with reasoning off, today''s date in the system prompt left 68-100%
  outdated answers about a changed fact for 10 of 12 models, five of six models never called an offered
  date tool, and the date in an earlier turn or a tool result left 69-99% outdated, while "as of" in the
  question left none for seven of eight models with reasoning on. 4. State dates as absolute values, and
  resolve relative dates ("last quarter") to absolute ones before the model sees them; tell a search agent
  to resolve relative dates against the injected date before calling tools and to keep dates it retrieves
  apart from the current one (one agent went from 16.0% to 30.6% as these instructions were added). 5.
  Refresh on change: resend the block when a value changes and after compaction or resume; if the run
  has a deadline, inject the time remaining each turn. 6. Fix the date in evals and report it, and check
  the chat template and the provider for a date you did not add. Do not rely on a stated past date to
  hide later knowledge in backtests: GPT-5 kept 0.75 accuracy against 0.76 with the date declared, while
  its claims of prior knowledge fell from 39% to 1%. Run the baseline slice with and without the injection,
  and with the date in the system prompt against the question, and watch cache-read tokens.'
detect:
  static: Prompt templates contain runtime placeholders (date, time, user, locale, tool availability).
    Absence where tasks are time- or user-sensitive is the signal.
  traces: Model guesses the date or year, asks the user for information the system already has, builds
    queries with stale dates, takes a retrieved past date as today, gives a fact as it was before a known
    change (or names the old value first), never calls an offered clock or date tool.
  evals: Failures concentrated on time-sensitive or user-specific items.
  judge: Flag outputs that assume stale state.
  probes:
    what: Tasks whose answer depends on today's date, relative dates, locale or the current user.
    construct: Take a template task and parametrize it on 'today', 'last quarter', user timezone and defaults;
      the correct answer changes with the injected value. Add questions about facts that changed after
      the model's cutoff, with the date in the system prompt and, separately, in the question.
  primary:
  - static
  - probes
impact:
  quality:
    effect: mixed
    size: medium
    when: 'time-sensitive work: deal closure 0.04 to 0.32 with the time remaining stated each turn (Sehgal,
      Jan 2026); answers 24-35% worse with relative than with absolute dates (Wallat, 2024); a search
      agent 16.0% to 30.6% with instructions to resolve dates against the injected one (Zhou, Mar 2026).
      Today''s date in the system prompt left 68-100% outdated answers for 10 of 12 models with reasoning
      off, where "as of" in the question left none for seven of eight with reasoning (Phan, Nov 2026).
      On tasks that do not depend on time, the date moved scores by up to 14% with no good date to fix
      (Sanz-Guerrero, Sep 2026)'
    basis: evidence
  cost:
    effect: none
    when: if the block sits after the cached prefix; a date in the system prompt cost Claude Code cache
      hits until it was moved out (Feb 2026)
    basis: evidence
  performance:
    effect: none
    size: small
    when: a short block after the cached prefix; no source measures latency
    basis: assessment
  security:
    effect: improves
    size: medium
    when: 'for code that pins dependencies: injected vetted versions cut tasks with a known vulnerability
      from 36.70-55.70% to 10.90-27.60% across ten models (Wang, May 2026). Injected state is also a small
      injection surface (not measured)'
    basis: evidence
  governance:
    effect: mixed
    size: small
    when: User data in the prompt needs retention rules.
    basis: assessment
  brand:
    effect: improves
    size: small
    when: Fewer obviously wrong dates.
    basis: assessment
  primary:
  - quality
measure:
- method: before-after
  tier: 3
  how: with the date fixed, run a time-sensitive slice (including facts that changed after the model's
    cutoff) with and without the injected block, and with the date in the system prompt against in the
    question; count outdated answers, including answers that name the old value first, and compare cache-read
    tokens per call before and after
- method: monitor
  how: questions asking the user for facts the system holds, date errors and outdated answers in outputs,
    stale dates in search queries, calls to any clock or date tool, cache-hit rate
