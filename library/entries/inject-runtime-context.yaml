  direction: supports
  measured: true
  locator: Sec. 6.3, Tables 10 and 11
- source: Wenjie Zhou, Yuan Gao, Xin Zhou, Hao Fu, Zhongjian Miao, Wei Chen, Bo Chen, Xiaobing Zhao, "Benchmarking
    Real-Time Question Answering via Executable Code Workflows", https://arxiv.org/abs/2604.16349
  date: '2026-03-16'
  task: Inject the current timestamp into a search agent's system prompt and add instructions to anchor
    on it, resolve relative dates before tool calls and keep retrieved dates apart from the current one,
    on questions whose answers change daily
  effect: With Qwen3-235B and only the system prompt varied, accuracy rose from 16.0% (original DeepResearch
    prompt) to 24.6% with real-time awareness, 28.2% with time anchoring and relative-time resolution,
    and 30.6% after distinguishing retrieved historical dates from the current time. "Temporal Confusion",
