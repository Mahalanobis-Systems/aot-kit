summary: 'Give the agent the goal, the tools and the acceptance checks and let it choose the sequence
  of steps, instead of coding a fixed workflow; the goal, permissions, budget and evaluation stay outside
  the agent. It pays when the path depends on what the agent finds and the model is strong: a GPT-5.5
  optimizer that composed its own process beat two prescribed pipelines in 12 of 14 comparisons at a median
  34.3% of the target-interaction budget, but a medium model did better with the pipeline. Where the procedure
  is known and the constraints are hard, or the model is small, a coded workflow wins: 35.56% against
  10.40% for same-model ReAct on TravelPlanner, and 45.3% against 6.7% for a 4B tool-calling agent on
  WebArena-Verified at 98.6% lower cost. Agent-decided steps also cost more per task: 2.7x to 3.6x the
  input tokens in one RAG comparison.'
how: '1. Start from two baselines on the same model, tools and task set: the fixed workflow you have or
  would write (code picks the steps, the model fills bounded nodes) and an agent loop (7.d.iii) that gets
  the goal, the same tools and the same acceptance checks and picks its own steps. 2. Keep the ends outside
  the agent in both designs: the goal, permissions, budget caps and the acceptance check or evaluator,
  so only the route is delegated. 3. Sort tasks by whether the path is known. Where the steps and constraints
  are stable (a runbook, a recurring task family, hard business rules), code the path and enforce the
  constraints in code: on TravelPlanner a coded workflow passed 35.56% against 10.40% for same-model ReAct,
  and writing the same rules into the baselines'' prompts left them 12.7 to 20.2 points behind (37.20
  against 17.00 to 24.50). Where the next step depends on what is found, let the agent choose: it rewrote
  retrieval queries better than a fixed rewrite step (NDCG@10 55.6 against 52.8). 4. Delegate the route
  only to a model that can carry it: a GPT-5.5 optimizer that composed its own process beat two prescribed
  pipelines in 12 of 14 comparisons, but with a medium model the pipeline won by 3.50 to 9.68 points and
  a 4B model produced no valid action; on WebArena-Verified, code-owned control held 44.7 to 45.3% while
  a tool-calling agent scored 30.0% on a 120B model and 12.7% and 6.7% on 20B and 4B models. 5. Mix within
  one task: keep fixed steps the agent does worse (a fixed reranker scored 49.5 NDCG@10 against 43.9 when
  the agent re-retrieved on its own), and enforce preconditions on irreversible actions in code (10.b.i);
  for a task family you run often, move recurring decisions out of the loop into code and keep the model
  for the semantic steps (76.0 to 91.8% fewer LLM calls in one study). 6. Measure paired runs on the deployed
  model and one cheaper tier: success, constraint violations, LLM calls, tokens and latency per task,
  and spread over at least three runs; agent-orchestrated RAG used 2.7x to 3.6x the input tokens and 1.4x
  to 1.5x the time of a fixed pipeline. Re-run the comparison when the model changes.'
detect:
  static: Minimal orchestration code; the agent decides the sequence.
  traces: 'Variety of action sequences across tasks of the same type: one sequence recurring across most
    tasks suggests code could own the path; widely varying sequences on a known procedure suggest constraints
    are being missed.'
  evals: Success, constraint violations, LLM calls, tokens and latency per task for the agent loop against
    a fixed workflow, per model tier.
  judge: Rate whether autonomy was used well.
  probes:
    what: Tasks with a known procedure and hard constraints, and tasks whose next step depends on what
      is found.
    construct: Pair runbook-style tasks whose plans must satisfy rules (no repeats, a required order)
      with open-ended lookups whose route cannot be fixed in advance; run both designs on both, on the
      deployed model and a smaller one.
  primary:
  - traces
impact:
