  how: distinct action sequences per task type, steps and cost per task, procedure and policy violations
    caught by checks, compliance late in long runs against early, hand-offs and early stops, cap-hit rate,
    route transitions blocked by the permitted-call graph, and sequences that recur often enough to compile
    into code
