    effect: mixed
    size: large
    when: 'an agent-decided route wins with a strong model where the path depends on findings: 12 of 14
      comparisons against prescribed pipelines with a GPT-5.5 optimizer (Xue, Aug 2026); query rewriting
      NDCG@10 55.6 against 52.8 for a fixed step (Ferrazzi, Jan 2026). A coded workflow wins on known
      procedures and with smaller models: 35.56% against 10.40% for ReAct on TravelPlanner (Qiu, Aug 2025);
      a medium optimizer did 3.50 to 9.68 points better with the pipeline (Xue, Aug 2026); 45.3% against
      6.7% for a 4B tool-calling agent on WebArena-Verified (Li, Sep 2026)'
    basis: evidence
  cost:
    effect: degrades
    size: medium
    when: 'more model calls per task: code-owned control cut LLM calls by 76.0 to 91.8% and deployed cost
      by 74.4 to 98.6% against a tool-calling agent, offline training excluded (Li, Sep 2026); agent-orchestrated
      RAG used 2.7x to 3.6x the input tokens of a fixed pipeline (Ferrazzi, Jan 2026). Not always: an
      agent-composed optimizer used a median 34.3% of a fixed pipeline''s target-interaction budget (Xue,
      Aug 2026)'
    basis: evidence
  performance:
    effect: degrades
    size: medium
    when: agent-orchestrated RAG took 1.4x to 1.5x the end-to-end time (Ferrazzi, Jan 2026); a tool-calling
      agent took longer per task than a code-owned harness in all six settings (Li, Sep 2026); 14.0 steps
