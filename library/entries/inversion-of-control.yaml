  conditions: BrowseComp-Plus and WebArena-Verified; 200 training, 50 gate and 50 final tasks each; deployed
    on gpt-oss-120b, gpt-oss-20b and Qwen3.5-4B; harness trained offline with GPT-5.6-terra or GPT-5.4
