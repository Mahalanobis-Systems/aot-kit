caveats: 'Each study is small or tests the authors'' own method: the optimizer comparison is one run per
  cell, the RAG comparison caps a single-tool agent at three turns, the code-harness results have confidence-interval
  half-widths of 7 to 13 points on 50 tasks and exclude the offline optimization cost, and the coded-workflow
  paper encodes the benchmark scorer''s constraints and has a cross-model table whose caption and figures
  disagree. The winner depends on the model and the task, so a result on one model tier does not transfer:
  prescribed structure helped a medium model and was required for a weak one. The coded workflow''s advantage
  narrowed on open-ended ScienceWorld tasks that need discovery, where both designs failed. The older
  evidence here (a pattern-library listing and a definition) is unmeasured.'
