    basis: assessment
  governance:
    effect: degrades
    size: medium
    when: 'rules stated only in the prompt get broken: 835 commonsense-constraint violations for ReAct
      against 11 for a coded workflow on 1,000 tasks (Qiu, Aug 2025); the agent''s route varied more than
      a staged pipeline''s (larger edits and more churn in all 8 paired runs), though final pass/fail
      agreement was at least 0.78 in 7 of 8 (Xue, Aug 2026)'
    basis: evidence
  brand:
