- source: 'Xue, Yang, "Rethinking Self-Evolving Agents: Do We Still Need Prescribed Optimization Pipelines?",
    https://arxiv.org/abs/2608.09629'
  date: '2026-08-10'
  task: Let an optimizer model compose its own skill-improvement process (OEO) under the same objective,
    data, operations, budget and sealed evaluator as two prescribed pipelines (SkillOpt, GEPA), then vary
    optimizer capability
  effect: With GPT-5.5 as optimizer, OEO beat SkillOpt in 7 of 8 settings and tied 1, and beat GEPA in
    5 of 6 (GEPA's one lead 0.21 points), using a median 34.3% of SkillOpt's target-interaction token
    budget; optimizer tokens slightly exceeded SkillOpt's budget in 3 settings. With a medium optimizer
    (Qwen3.5-27B) SkillOpt led by 9.68 points on LiveMath and 3.50 on SearchQA; a weak optimizer (Qwen3.5-4B)
    produced no executable action under the open interface, while the pipeline still ran. OEO made larger
    edits and had more revision churn in all 8 paired runs, but pass/fail agreement with SkillOpt's result
    was at least 0.78 in 7 of 8.
  conditions: SearchQA (n=1,400), SpreadsheetBench (280), OfficeQA (172), LiveMathematicianBench (124);
    target models Qwen3.5-4B and GPT-5.5; one optimization run per cell; the authors' own method
  direction: supports
  measured: true
  locator: Abstract; §3.1 Table 2; §3.3 Table 4; §4; App. A.1
- source: Ferrazzi, Cvjeticanin, Piraccini, Giannuzzi, "Is Agentic RAG worth it? An experimental comparison
    of RAG approaches", https://arxiv.org/abs/2601.07711
  date: '2026-01-12'
  task: Compare a fixed enhanced RAG pipeline (semantic router, HyDE rewriting, reranker) with an agent
    that decides whether and how to retrieve, rewrite and re-retrieve
  effect: Query rewriting NDCG@10 55.6 for the agent against 52.8 for the fixed pipeline on average (51.7
    against 43.9 on NQ). Intent routing F1 98.8 and 99.8 against 95.7 and 96.6 on two narrow domains,
    but 64.6 against 87.9 on FEVER. Document refinement 43.9 against 49.5 for a fixed reranker; the agent
    re-retrieved in 10% of cases. The agent used 2.7x and 3.6x the input tokens, 1.7x and 1.8x the output
    tokens and 1.5x and 1.4x the time (FiQA, CQADupStack-EN, averaged over five models). Answer quality
    rose with model size at similar rates for both designs.
  conditions: FiQA, NQ, FEVER, CQADupStack-EN; 500 valid and 500 invalid queries per dataset for routing;
    single-tool agent capped at three turns; GPT-4.1-nano and Qwen3 0.6B to 32B in the model and cost
    tests; answer quality judged by Selene-70B
  direction: mixed
  measured: true
  locator: Tables 3, 4, 5 and 9; §3.5; §4
- source: 'Qiu et al., "Blueprint First, Model Second: A Framework for Deterministic LLM Workflow", https://arxiv.org/abs/2508.02721'
