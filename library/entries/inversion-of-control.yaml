caveats: 'Each study is small or tests the authors'' own method: one optimization run per cell, a single-tool
  RAG agent capped at three turns, code-harness results with confidence-interval half-widths of 7 to 13
  points that exclude offline cost, a coded workflow that encodes the scorer''s constraints (with a cross-model
  table whose caption and figures disagree), a state machine tested on one procedure (three seeds on Sonnet
  4.6, where its pre-registered prediction against the resumed baseline failed), a compiled workflow whose
  public test covers one tau2-bench domain of 40 tasks without a simulated user, and an injection study
  of 16 tasks on o4-mini and GPT-4o with the authors'' own attacks. The winner depends on model tier and
  task: prescribed structure helped a medium model and was required for a weak one, enforcement gained
  little where the plain agent already held the procedure, the coded workflow''s lead narrowed on ScienceWorld
  tasks that need discovery, and in the incident study one call over rule-selected evidence also beat
  every hand-crafted agent, so part of that gain comes from not fixing the investigation rather than from
  the loop. No study compares an agent-chosen route with a coded workflow at matched cost on the top frontier
  models (the incident study stopped below them) in real business workflows; the production comparison
  used a Sonnet 4.0 agent and the platform''s own completion flags, which counted some runs with no successful
  tool call as complete. The older evidence here (a pattern-library listing and a definition) is unmeasured.'
