caveats: 'The large gains come from very large corpora (data rooms, multi-million-token inputs) and from
  setups that also change other things (a REPL holding the corpus, RL training), so they do not isolate
  the sub-agent; on bounded tasks with a strong single agent the gain vanished or reversed (repository
  questions, MLE-bench, generic roles on ProgramBench, about 100K-token reasoning inputs), and on 166
  tool-heavy work tasks both closed models (GPT-5.6 Sol, Claude Sonnet 5) lost more tasks with sub-agents
  than they gained while some open models gained. The hand-off is the new failure point: it caused 41.8%
  of delegated-search failures, usually with a confident wrong answer; failed or unverified sub-agent
  results caused most of the tasks GPT-5.6 Sol and Claude Sonnet 5 lost to delegation; and a 32B model
  lost 85% of discovered facts across an orchestrator-subagent boundary, against 3-6% for gpt-4.1-mini.
  Delegation can buy quality at a high price: recursive delegation beat compaction on long-horizon coding
  (42.4% against 38.1%) at $1,749.73 against $681.22, and the same agent closing its own subtasks matched
  it at $460.77. Several studies are small, single-run or by the method''s authors (one run per repository
  over 98 milestones, a 4-point success gap over 120 robot episodes without a test, 14 data rooms for
  the depth test, 16-30 facts per cell), and Harvey''s hold-out sets are unreleased.'
