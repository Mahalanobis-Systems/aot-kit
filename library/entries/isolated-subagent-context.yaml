categories:
- context.isolate
summary: 'Hand a context-heavy side task (code search, reading many files, documents or logs) to a sub-agent
  that starts with a fresh context and only the tools it needs, and have it return a short result or file
  references so the parent''s context stays small. It pays when the parent would otherwise read far more
  than it can hold: on legal data rooms of up to 80M tokens, delegating bounded reading raised rubric
  pass rate from 23.3% to 62.4% across seven models. It is not a default win: on bounded repository questions,
  delegated exploration scored 46.2% against 65.2% for an indexed single agent at 2.3 times the cost per
  correct answer, with 41.8% of its failures at the hand-off, mostly silent; generic sub-agent roles and
  a second level of delegation also lost quality.'
how: '1. Start from the single agent: run it on your tasks and log peak context, tokens per task and which
  tool outputs fill the window; if the material is a corpus you can index, try a retriever before delegating
  (see 8.a.i), since indexed retrieval beat delegated exploration on bounded repository questions. 2. Delegate
  only side tasks whose raw output is large and not needed again (codebase search, reading many files,
  documents or logs) and whose result fits a short contract; keep work whose steps share a lot of context
  in the parent. 3. Define each sub-agent as a task-specific role with an input-output contract: the objective,
  the inputs it gets, an output schema (findings with file paths, line ranges or document ids, plus what
  it did not cover) and a length cap; avoid generic lifecycle roles such as requirements, design or code
  generation. 4. Start it with a fresh context and a self-contained brief, not the parent''s routing messages
  or whole history, and give it only the tools it needs: read-only search and read tools for exploration,
  no delegation tool (depth 1), and a turn cap. 5. Protect the hand-off: have it write long outputs to
  files and return references (see 6.b.iii), have the parent forward or quote its findings instead of paraphrasing
  them, and require it to list every policy- or risk-relevant fact it found. 6. Measure with a paired
  eval of the single agent against the delegating one on the same tasks and models: success, cost per
  correct answer, total and parent tokens, the parent''s peak context and latency; then label failures
  where the sub-agent''s transcript holds a fact that the parent''s answer lacks.'
detect:
  static: 'A sub-agent call with a fresh context, a scoped tool list and a summary or file-reference return;
    or a single agent that reads large search results, file sets, documents or logs into its own context.
    Warning signs: generic lifecycle sub-agents, sub-agents that inherit the full history or can delegate
    further, a parent that paraphrases sub-agent output.'
  traces: 'Sub-agent spans: tokens consumed inside vs returned; the parent''s peak context; empty returns;
    facts present in the sub-agent transcript but missing from the parent''s answer (hand-off breakdowns,
    usually silent); share of the corpus read.'
  evals: 'Single agent vs delegation (and vs an indexed retriever) on search-heavy tasks: success, cost
    per correct answer.'
  judge: 'Summary fidelity against the sub-agent''s full transcript: facts found but not returned, claims
    returned but not supported.'
  probes:
    what: Broad search then synthesis.
    construct: Multi-document questions where the answer needs facts from several sources.
  primary:
  - traces
impact:
  quality:
    effect: mixed
    size: large
    when: 'Large corpora: +39.1 points rubric pass rate on legal data rooms (Grupen, Sep 2026); folding
      sub-tasks out of context 0.567 vs 0.540 for a 327K-context agent with the same RL on BrowseComp-Plus,
      at a 10x smaller active context (Sun, Oct 2025); sub-calls lifted GPT-5 on OOLONG 36.0 to 56.0 but
      cut Qwen3-Coder on CodeQA 66.0 to 56.0 (Zhang, Dec 2025). Bounded tasks: 46.2% vs 65.2% for an indexed
      single agent (Oskooei, Aug 2026); task-specific sub-agents +5.91 and +4.46 points, generic ones
      lower (Hu, Sep 2026); medal rate 45.2% vs 55.7%, CIs overlapping (Brilliantov, Sep 2026); depth
      2 cost 19 points (Grupen, Sep 2026)'
    basis: evidence
  cost:
    effect: mixed
    size: large
    when: 'More total tokens (Piriyakulkij, Sep 2026): 2.3x cost per correct answer for delegated search
      (Oskooei, Aug 2026), cost up for six of seven models in a delegating harness while Opus 5 fell from
      ~$18 to ~$7 per data room (Grupen, Sep 2026); single-agent tokens grew with distractor domains while
      sub-agent setups stayed flat (Fu-Hinthorn, Jun 2025)'
    basis: evidence
  performance:
    effect: mixed
    size: small
    when: Each fresh sub-agent must gather its own context; median latency was lower with delegation for
      two models and higher for two (Oskooei, Aug 2026); RL rollouts slowed from 48 to 74 minutes per
      step as the trained root sent more sub-agents (Grupen, Sep 2026). Parallel speedups belong to 6.b.iii
    basis: evidence
  security:
    effect: mixed
    size: medium
    when: Depends on tool scoping (see 5.c.ii).
    basis: assessment
  governance:
    effect: degrades
    size: small
    when: Nested traces.
    basis: assessment
  brand:
    effect: none
    basis: assessment
  primary:
  - quality
  - cost
measure:
- method: experiment
  tier: 4
  how: 'Paired eval on the same tasks and models: the single agent against the same agent with a delegated
    sub-agent (and against an indexed retriever where the corpus allows): success, cost per correct answer,
    total tokens, the parent''s peak context and latency; code each failure by mechanism, including hand-off
    breakdowns where the sub-agent found the answer and the parent lost or misreported it.'
- method: monitor
  how: 'Per sub-agent call: tokens consumed inside against tokens returned, empty returns, sub-agent count
    against task size and the share of the corpus read; on a sample, have a judge check whether the facts
    in the sub-agent''s transcript reach the parent''s answer (fact attenuation).'
