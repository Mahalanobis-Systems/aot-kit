caveats: 'The large gains come from very large corpora (data rooms, multi-million-token inputs) and from
  setups that also change other things (a REPL holding the corpus, RL training), so they do not isolate
  the sub-agent; on bounded tasks with a strong single agent the gain vanished or reversed (repository
  questions, MLE-bench, generic roles on ProgramBench). The hand-off is the new failure point: it caused
  41.8% of delegated-search failures, usually with a confident wrong answer, and a 32B model lost 85%
  of discovered facts across an orchestrator-subagent boundary, against 3-6% for gpt-4.1-mini. Several
  studies are small or chart-only (14 data rooms for the depth test, 16-30 facts per cell, SkillsBench
  accuracies in figures), and Harvey''s hold-out sets are unreleased.'
