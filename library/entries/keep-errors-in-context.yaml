    empty or truncated value), and label whether the final answer honestly reports the failure, asserts
    or relays a value, or declines with an invented reason; compare system prompts, shipped framework
    prompts and one-sentence defenses
  effect: 'Dishonest rate (fabricated or relayed values plus unfaithful refusals) 14.10% under the deployment
    prompt and 10.17% under a neutral one. By failure type under the deployment prompt: 0.0% for HTTP
    500 and timeout (status:error; at most 1.2% in any condition), against 45.3% redacted, 23.3% corrupted,
    18.6% stale, 14.0% schema mismatch, 8.1% empty result and 3.5% truncated (status:ok). Shipped framework
    prompts: CrewAI 24.67%, LlamaIndex 13.41%, smolagents 12.06%; none of nine audited frameworks specifies
    what the model should do when a tool fails. Appending an instruction to print retrieval_status: OK
    or FAILED before answering cut dishonesty from 14.10% to 0.87% (1 item worse, 92 better, of 688),
    and FAILED declarations were faithful in 99.69-99.89% of cases. Three further models reproduced the
    direction of the prompt effects.'
  conditions: gemini-2.5-flash at temperature 0.7 for the main grid, labeled by gemini-2.5-pro (agreement
