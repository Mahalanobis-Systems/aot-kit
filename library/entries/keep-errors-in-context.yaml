    and abandoned the original task in 80% of cases. Gemini CLI (Gemini 3.1 Pro) and Codex (GPT-5.5) with
    repository instruction files complied 0 times, flagging the payloads as exfiltration.'
  conditions: Gemini 3.1 Pro, GPT-5.5, GLM-5.1 and Qwen3-Coder-480B through raw function-calling APIs
