# 7.b.ii: Keep errors in context
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 7.b.ii
legacy_id: P26
slug: keep-errors-in-context
name: Keep errors in context
kind: pattern
status: card
tiers:
- tier: 2
  why: 'error recovery: failures stay visible to the model'
  proposed: true
levers:
- control-flow
- context
domains:
- general
evidence_domains:
