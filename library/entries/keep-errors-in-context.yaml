- source: 'Sunghyeun Woo, Javier Conde, Pedro Reviriego (Universidad Politécnica de Madrid), "Same Error,
    Different Recovery: How Delivery Changes LLM Agent Behavior", https://arxiv.org/abs/2611.11581'
  date: '2026-11-08'
  task: 'Hold the error text fixed and vary how a failed tool call reaches the model: left in the tool
    message as the client sent it (C0), with a kind-specific next-step sentence appended to the tool message
    (C1), the failed call and result removed and a runtime note with the same sentence put in the earlier
    user message (C2) or in a new user turn (C4), or the failed exchange kept and the note added in a
    new user turn after it (C3); then ship C3 as an opt-in layer in an inference engine and compare it
    on and off on public benchmarks and a coding agent'
  effect: 'Removing the failed exchange against keeping it, both with the note in a new turn (C4 minus
    C3): -3.8 points (90% interval -4.5 to -3.2) in the 3-35B tier and -1.9 (-2.5 to -1.2) in the 27-70B
    tier, inside the registered 5-point equivalence margin. Deleting it and restating it in the user message
    (C2) broke stopping in Llama models: for Llama-3.3-70B, stopping on unrecoverable errors was 95% with
    the client''s form, 2% with C2 and 100% with C3; even "Do not call any tool again." left Llama-3.1-8B''s
    stopping at 0 of 60, while a new user message after the failed exchange restored it in 59 of 60. Without
    the two Llama models the pooled C3 minus C2 difference was -0.1 and -0.2 points, and Qwen2.5-7B was
    worse with C3. On real coding-agent histories C3 beat the client''s form by 34.4 points in both tiers
    and beat C2 57.8% to 45.6% in the large tier (p=0.027; small tier 55.6% vs 51.1%, p=0.58). Guidance
    in a new turn beat guidance in the tool message in 5 of 7 and 5 of 6 models. In the client''s form,
    five of six 7-35B models repeated a call after a transient error in 0-37% of cases. With the layer
    on, ToolMaze pass rate on explicit errors rose 14.2 (7-8B) and 10.5 (32-70B) points, mostly on transient
    faults; Loud/Quiet showed no effect (-1.1 and +0.5); a client given the exact fault kind did 16.8
    and 18.5 points better still. In a Qwen Code agent facing a forbidden data service, the layer reported
    the access problem in 12 of 12 runs and wrote no result file, against fabricated result files in 33%
    (Qwen3-8B) and 50% (Qwen3-32B) of runs without it. Median prompt tokens recomputed at the decision
    step: 94 (C2) and 171 (C3) on synthetic items, 965 and 1,081 on real histories.'
  conditions: 13 open models (Qwen, Llama and Gemma 4 families), 3B-70B, greedy decoding in the authors'
    deterministic engine; studies 1-2 on synthetic scenarios with read-only tools (720-900 conversations
    per model) plus 30 failure points from six real Qwen Code sessions (19 clusters, one model per tier,
    any-call scoring); study 2's small tier preregistered on OSF, the rest fixed in local hash logs; the
    layer's frozen rules gave the right guidance to 29.8% of ToolMaze's explicit errors; the coding-agent
    test is descriptive (six tasks per model); no closed frontier model; the authors caution that restating
