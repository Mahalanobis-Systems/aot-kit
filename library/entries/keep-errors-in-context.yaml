    https://arxiv.org/abs/2508.21433'
  date: '2025-08-29'
  task: Replace environment observations older than a window with a placeholder while keeping all reasoning
    and actions (observation masking), or summarize old turns with an LLM, against the full raw history
  effect: 'Observation masking "halves cost relative to the Raw Agent while matching, and sometimes slightly
    exceeding, the solve rate of LLM-Summary" (Qwen3-Coder 480B: 53.4% raw, 54.8% masking, 53.8% summary;
    Gemini 2.5 Flash with thinking: 40.4%, 36.4%, 31.4%). Summaries lengthened runs (Gemini 2.5 Flash:
    52 turns against 44 with masking and 50 raw), "suggesting they mask failure signals that would otherwise
    prompt earlier termination." On error content: "SWE-agent directly elides retries due to syntax errors
