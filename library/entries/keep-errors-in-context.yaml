caveats: 'No study isolates keeping versus hiding an error on a frontier agent: the closest measurements
  are a bundled linter change on one model (+3 points on SWE-bench Lite), a benchmark that compares explicit
  with silent tool failures, and a single-author study of 135M-1.7B models in which the verbatim failed
  call raised repeats while deleting it was worse. Failures that accumulate hurt: wrong answers in a model''s
  own history lowered its later accuracy in non-thinking models (not fixed by scale, absent in one thinking
  family), and on HumanEval restarting fresh after 2-3 failed fixes beat continuing for all six models
  tested. What the error says matters as much as whether it is shown: a step the agent cannot take cut
  recovery from 82% to 45%, and for failures in the agent''s own call the wording barely mattered.'
