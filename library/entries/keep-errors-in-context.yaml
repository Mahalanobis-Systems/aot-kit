  date: '2025-07-18'
  task: Leave failed actions and their errors in the context instead of cleaning up the trace
  effect: '"one of the most effective ways to improve agent behavior is deceptively simple: leave the wrong turns
    in the context." No numbers.'
  direction: supports
  measured: false
  locator: Keep the Wrong Stuff In
- source: 'Akshit Sinha, Arvindh Arun, Shashwat Goel, Steffen Staab, Jonas Geiping, "The Illusion of Diminishing
    Returns: Measuring Long Horizon Execution in LLMs", https://arxiv.org/abs/2509.09677'
  date: '2025-09-11'
  task: Counterfactually inject a chosen rate of wrong answers into the model's own earlier turns of a
    long, fully specified execution task (a running sum over key lookups) and measure accuracy at turn
    100; test thinking, a self-verification prompt and a sliding context window as fixes
  effect: '"as we increase the rate of injected errors into the context, accuracy at turn 100 consistently
    degrades further." Frontier non-thinking models (Kimi-K2, DeepSeek-V3, Qwen3-235B-Instruct-2507) "remain
    susceptible to self-conditioning"; Qwen3 thinking models "do not self-condition—the accuracy of the
    models at turn 100 remains stable, regardless of the error rate in its context." "Prompting to self-verify
    does not suffice to fix the self-conditioning effect completely"; keeping only the most recent turns
    (a sliding window) improved performance "significantly" on Gemma3 12B. From a manual reading of annotated
    agent failures the authors "estimate that roughly 20% of GAIA, 48% of ALFWorld, 33% of WebShop failures
    are similar to self-conditioning." The text gives no per-model numbers for the injection experiment
    (plotted in Figure 5 only).'
  conditions: Qwen3 4B-32B and Gemma3 4B-27B, plus frontier models via OpenRouter; synthetic key-value
    task, 100 samples; the injected errors are unflagged wrong answers in the model's own turns, not tool
    error messages; the sliding window suits only tasks without long-range dependencies
  direction: contradicts
  measured: true
  locator: §3.2 Results 3-5, Figures 5-6; Appendix A; Appendix C.1-C.2, Figures 9-10
- source: 'Esmail Gumaan, "Feedback That Backfires: Why Small Language Model Agents Repeat the Call They
    Just Watched Fail", https://arxiv.org/abs/2608.23651'
  date: '2026-08-24'
  task: Measure whether a failed tool call and its error message in the transcript make the model less
    likely to emit the same call again; compare harnesses that keep the transcript verbatim, add a do-not-repeat
    instruction, delete the failed step (clean restart), replace the failed call with a runtime-generated
    description of the failure, or block previously failed strings at the decoder
  effect: 'Keeping the failed call and its error made a repeat more likely for all 6 models: "Over a fixed
    candidate set the probability of repeating the failed call rises from 0.06 to 0.54"; "the failed call''s
    surface form accounts for 83% of the damage, while the semantic contribution of marking it failed
    is small and inconsistent in sign". The runtime description "removes 76% of the inversion at no token
    cost". In rollouts (Qwen2.5-0.5B, 24 tasks) success and exact-repeat rate were 0.42 and 31% verbatim,
    0.33 and 80% with the failed step deleted, 0.33 and 16% with the description, 0.42 and 8% with the
    decoder ban, 0.58 and 24% with a do-not-repeat instruction; deleting the failed attempt "is the worst
    harness we measured for repetition".'
  conditions: 6 instruction-tuned checkpoints, 135M-1.7B, 4 families; the author's own synthetic tool-calling
    environment and MBPP program repair (real Python tracebacks, which quote the failing line); greedy
    decoding; single author; within each family the effect shrinks with model size and is untested above
    1.7B; the description and the ban cut repeats but did not raise task success
  direction: mixed
  measured: true
  locator: Abstract; §6.1 Table 3; §6.4-6.5; §8.3 Table 8; §10-11
- source: 'Tobias Lindenbauer, Igor Slinko, Ludwig Felder, Egor Bogomolov, Yaroslav Zharov, "The Complexity
