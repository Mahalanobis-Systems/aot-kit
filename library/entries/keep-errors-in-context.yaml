caveats: 'Two harness ablations now separate showing a failure from hiding it, both on open-weight models:
  across 13 models (3B-70B), deleting the failed exchange did 1.9-3.8 points worse than keeping it and,
  when the note replaced it in the user message, broke stopping in Llama models, and on four current models
  a contract note on silently failed results raised completion from 10.9% to 28.1%, with no net gain where
  most runs succeeded anyway and as many harms as rescues on clean runs; no ablation covers a closed frontier
  model, and the honesty result (at most 1.2% dishonest answers on status:error, up to 45.3% on status:ok)
  rests on one 2025 model with a same-family judge. Failures that accumulate hurt: in 135M-1.7B models
  the verbatim failed call raised repeats (though deleting it was worse), wrong answers in a model''s
  own history lowered its later accuracy in non-thinking models (not fixed by scale, absent in one thinking
  family), and on HumanEval restarting fresh after 2-3 failed fixes beat continuing for all six models
  tested. What the error says matters as much as whether it is shown: naming the next step or the recovery
  tools carried the measured gains while more diagnostic detail did not measurably help, a step the agent
  cannot take cut recovery from 82% to 45%, and for failures in the agent''s own call the wording barely
  mattered. Third-party error text is also an injection channel: in one small red-team study frontier
  models followed instructions planted in tool errors through raw APIs, though two coding CLIs with approval
  gates blocked them.'
