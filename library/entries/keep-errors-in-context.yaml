- source: Xiaonan Xu, Wenjing Wu, "MCP Error Messages Written for Developers Hurt the Most Capable Agents
    Most", https://arxiv.org/abs/2609.35381
  date: '2026-09-28'
  task: Return different error texts for the same failed call (a generic notice, the cause only, the cause
    plus a correct next step, the cause plus a step the agent cannot take) and, on the harness side, strip
    next-step sentences from the error text with a one-sentence prompt before the model reads it
  effect: On expired credentials, recovery was 61% with "Operation failed.", 82% with the cause, and 45%
