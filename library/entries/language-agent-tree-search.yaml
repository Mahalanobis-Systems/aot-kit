caveats: 'Most gains are measured against a single ReAct run, not against retries or best-of-N at the
  same spend; where that comparison was made, results split: retries beat LATS on HumanEval, best-of-N led
  on GAIA (matched on samples, not tokens, one run) and no search policy beat best-of-N significantly
  on MLE-bench, while tree search beat re-ranking at about equal compute on VisualWebArena and MCTS beat
  best-of-N on three of four backbones in one study that used a trained reward model. The value signal is the bottleneck: a ground-truth reward
  reached 43.5% against 37.0% with GPT-4o''s estimate, naive tree search lowered WebArena-lite success
  from 54.84% to 51.61% until destructive-action handling was added, and SWE-Search''s value function
  picked the resolving patch 73% of the time. Search needs states that can be restored, which Docker containers
  and live websites do not reliably provide; the positive results come from sandboxes, and the one production
  study fell from 91.3% on its benchmark to 65.1% on 37 incidents. Most action-level results use GPT-4o-era
  models; on stronger open-weight reasoning backbones one study found no search policy significantly
  better than another and that maximum reasoning effort starved the search of nodes.'
