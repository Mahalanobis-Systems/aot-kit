summary: 'Language Agent Tree Search runs the agent as a Monte Carlo tree search over its own actions:
  sample several next actions, execute each in the environment, score the resulting states with the model,
  reflect on failed endings, and back the scores up the tree until a branch succeeds or the budget runs
  out. Against a single ReAct run it raised success on web, coding and incident-diagnosis tasks (VisualWebArena
  18.9% to 26.4%, SWE-bench Lite +23% relative across five models, root-cause accuracy 39.8% to 91.3%, though
  those baselines got about a quarter of the tokens). At equal spend the results split: on HumanEval plain
  retries scored 92.0% at $2.51 against LATS''s 88.0% at $134.50, while on VisualWebArena tree search
  (32.0%) beat re-ranking whole runs (30%) at about equal compute. It needs an environment
  whose states can be restored and kept free of irreversible side effects. It cost 3.8 to 14.1 times the
  tokens or dollars of a single run in most studies (over 50 times simple retries on HumanEval) and 7.6
  to about 10 times the wall time.'
how: '1. Start from the cheap baselines on the same model and tasks: the ReAct loop (7.d.iii) with retries
  on failed checks, and best-of-N whole runs picked by a vote, a judge or a test (9.c.ii), each given
  the tokens and wall time the search would get; add search only where a gap remains. Read-only
  diagnosis (searching over hypotheses with tools that only list, search and compare logs and metrics)
  suits it best, since every branch is safe to explore. 2. Make every node
  restorable before searching: reset the environment and replay the action prefix, commit the workspace
  per node (git), or snapshot the sandbox, and check that a restored state matches the original. Docker
  containers with background processes do not checkpoint reliably and replays can diverge; where states
  cannot be restored, use one-step lookahead (sample K actions, a critic picks one) plus selection among
  whole runs, or simulate candidate actions with an LLM world model instead of executing them. 3. Validate
  each proposed action before running it, before adding any search: that alone raised WebArena-lite success
  from 47.74% to 53.55%, most of the gain, while adding naive tree search lowered it to 51.61% until destructive
  actions were handled. Keep exploration off irreversible actions: flag likely destructive actions before execution (form submits,
  Enter, buttons that are not navigation) and confirm after (POST, PUT, DELETE or PATCH requests), defer
  them until the search commits, drop the states they make unreachable, and on live systems restrict expansion
  to non-destructive actions or gate them (10.b.i). 4. Build the search: select by UCT, expand 3 to 5
  sampled actions and execute each, score the new state with the model after it sees the observation plus
  self-consistency over several samples (with state-specific value prompts; where a sound signal such
  as tests or the environment''s reward exists, use it, 9.a.i), write a reflection on each failed ending
  and feed it to later expansions, and backpropagate. 5. Bound and parallelize: cap iterations or nodes
  per task and search time per state, expand siblings concurrently with prefix caching on, and on reasoning
  models choose the effort setting that leaves room for enough nodes in the time budget (maximum effort completed
  18.5 search nodes per run against 62.8 at medium, 1.b.i). 6. Choose
  the final answer with a checked selector: the value function picked the resolving patch 73% of the time
  and a separate discriminator 84%, so compare the selector''s choice with outcomes. 7. Measure against
  step 1 at matched tokens and wall time, per model and task difficulty: success, tokens, LLM calls, wall
  time, restore time and destructive actions executed during exploration; re-check after a model upgrade,
  since the gain flipped with backbone capability.'
detect:
  static: 'A search loop over agent actions: UCT or best-first selection, expansion of several sampled
    actions executed in the environment, a model-scored value (often with self-consistency), reflections
    on failed endings, backpropagation, and a way to restore earlier states (reset and replay, a commit
    per node, snapshots). Flag search over actions with side effects and no restore path or destructive-action
    gate, and search with no simpler baseline at a matched budget.'
  traces: Nodes expanded and LLM calls per item; tokens and wall time per item; restore or replay time;
    value of the chosen trajectory against its actual outcome; destructive actions executed during exploration.
  evals: Success against ReAct with retries and best-of-N with a vote or judge at equal tokens and wall
    time, per model and task difficulty.
  judge: Rate reflections used as value estimates.
  probes:
    what: Multi-step tasks with recoverable mistakes.
    construct: Tasks where the first plan is usually wrong, feedback identifies why, and the environment
      can be reset between branches; add a few whose only path passes an irreversible action.
  primary:
  - evals
impact:
  quality:
    effect: mixed
    size: medium
    when: 'gains over a single ReAct run: VisualWebArena 18.9% to 26.4% (Koh, Jul 2024), SWE-bench Lite
      +23% relative across five models (Antoniades, Oct 2024), root-cause accuracy 39.8% to 91.3% (Naakka,
      May 2026); at equal spend simpler methods matched or won: HumanEval 88.0% against 92.0% for retries
      (Kapoor, Jul 2024), GAIA best-of-N 63.03 against beam search 56.97 and tree search 55.76 at equal sampling
      width (Zhu, Jun 2025); search won: VisualWebArena 32.0% against 30% for re-ranking at about equal
      compute (Koh, Jul 2024), MCTS beat best-of-N at equal trajectory count on 3 of 4 backbones (Chen,
      Feb 2025); no search policy significantly better than best-of-N within one harness (Brilliantov,
      Sep 2026)'
    basis: evidence
  cost:
    effect: degrades
    size: large
    when: LATS cost $134.50 against $2.51 for retries on HumanEval (Kapoor, Jul 2024); SWE-Search $576.00
      against $40.86 with GPT-4o and about 5x on four other models (Antoniades, Oct 2024); MCTS agents
      used 7.2x to 10.1x ReAct's tokens (Yu, Oct 2024); LATS averaged 71.0 LLM calls per request (Kim,
      Jun 2025); 156K against 41K tokens per investigation (Naakka, May 2026)
    basis: evidence
  performance:
    effect: degrades
    size: large
    when: tree search took 749.2 to 972.1 s per VisualWebArena task against 68.3 to 87.7 s for a reactive
      agent (Gu, Nov 2024); 9.1 against 1.2 minutes per root-cause investigation (Naakka, May 2026); some
      LATS tasks ran over 2 hours (Kapoor, Jul 2024); expanding 16 children in parallel instead of 1 cut
      LATS latency by 196.3 s on average (Kim, Jun 2025)
    basis: evidence
  security:
    effect: degrades
    size: medium
    when: exploratory branches execute real actions; irreversible ones (placing an order, submitting a
      form) cannot be backtracked, so search outside a sandbox needs a non-destructive action space or
      gating (Koh, Jul 2024; Gu, Nov 2024); a conservative pre-execution check flagged actions of which
      about 37% were truly destructive (Dihan, Dec 2025)
    basis: evidence
  governance:
    effect: none
    basis: assessment
  brand:
    effect: none
    basis: assessment
