caveats: 'No study yet compares exploration with the full schema on current frontier thinking models at
  matched compute: the catalog result on Claude Opus 5 and GPT-5.6 Sol compares iterative routing with
  a one-shot pick (not compute-matched, no token counts), and the Claude Opus 4.7 result compares a raw
  schema with a compressed one, in the compression method''s own paper, not with exploration. The case
  for exploring within a database still rests mostly on AutoLink''s own ablations (Spider 2.0-Lite, a
  DeepSeek-V3 policy): a competing team''s rerun found it kept every needed field on 31.55% of questions
  over schemas of 506 or more fields, and in the one independent comparison against the full schema (eight
  linking methods, none an exploration agent, GPT-4.1 doing the linking) the full schema won for GPT-4.1
  and Gemini 2.5 Pro at every size, on large schemas drawn mostly from 221 Spider 2 questions and padded
  Bird schemas. Exploration costs time and needs a capable, bounded policy: latency comes from self-hosted
  14B models and from one company''s warehouse agent (two anonymized configurations, 50 questions, three
  repeats), where the reasoning configuration over-explored and changed its tables between runs, and an
  untrained 4B model exploring from no schema lost 17.0 points. Security is unmeasured: no source tests
  what sample-value probes expose or how read-only roles and row-level permissions hold up under an agent''s
  exploratory SQL.'
