# 8.b.ii: Link large schemas by exploration: start broad, grow the linked set with probing queries, favor recall
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 8.b.ii
legacy_id: T71
slug: link-large-schemas
name: 'Link large schemas by exploration: start broad, grow the linked set with probing queries, favor
  recall'
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the model sees
levers:
- knowledge-access
- control-flow
domains:
- data-analysis
evidence_domains:
- data-analysis
categories:
- retrieval.query
summary: 'When a schema is too large to load whole, link the tables and columns a question needs by exploration
  rather than by one up-front retrieval or by loading everything: start from all table names plus the
  top retrieved columns, give the agent a column-level vector index, metadata probes and trial queries
  to grow the linked set, favor recall over minimizing noise, and cap the exploration turns low.'
how: 1. Build a column-level vector index of the schema. 2. Seed each question with all table names plus
  the top retrieved columns. 3. Give the agent actions to retrieve more columns, probe metadata and sample
  values with exploratory SQL (results capped at a few rows, with a timeout), and test sufficiency with
  a minimal executable query. 4. Cap exploration at a few turns. 5. Paired eval on schema-linking recall
  (share of needed columns kept), execution accuracy and tokens.
detect:
  static: a large schema (too many tables to load whole) linked by a single up-front retrieval, or loaded
    whole into every prompt
  traces: queries against non-existent columns or the wrong tables on a large schema; prompt tokens dominated
    by the schema
  evals: schema-linking recall and execution accuracy on the large-schema subset
