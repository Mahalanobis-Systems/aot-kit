caveats: 'The case for exploration still rests mostly on AutoLink''s own ablations (Spider 2.0-Lite, a
  DeepSeek-V3 policy), which compared it with other linkers but not with sending the full schema to the
  generator; in a competing team''s rerun on Spider 2.0-Snow with GLM-5.1, it kept every needed field
  on 31.55% of questions over schemas of 506 or more fields, at 8.00% precision overall, and its linked
  schemas trailed a non-iterative linker downstream. Whether to link at all depends on schema size and
  model: in the one independent comparison against the full schema (eight linking methods, none an exploration
  agent like AutoLink, with GPT-4.1 doing the LLM-based linking), the full schema won for GPT-4.1 and
  Gemini 2.5 Pro at every size, and most of its large schemas came from 221 Spider 2 questions and Bird
  schemas padded with generated tables. Exploration costs time and needs a capable policy: AutoLink''s
  latency figures come from self-hosted 14B models, an untrained 4B model exploring from no schema lost
  17.0 points, and AutoLink''s authors found a reasoning model a worse policy because its instruction
  following degraded.'
