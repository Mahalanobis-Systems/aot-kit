summary: 'When a database schema is too large to load whole, let the agent find the tables and columns
  each question needs by exploring it, instead of retrieving once up front. Seed it with all table names
  plus the top retrieved columns, give it a column index, metadata probes and trial queries, favor recall
  and cap the turns low; over a catalog of many databases, let it search and inspect before it chooses
  (exact database sets 53.52% against 21.88% for a one-shot pick, averaged over seven current models,
  in one study not matched for compute). First check that the schema really is too large, and compress
  it before deciding: in one independent comparison the whole schema gave GPT-4.1 and Gemini 2.5 Pro their
  best accuracy at every size tested, and writing repeated columns once and collapsing sharded tables
  cut 1,000- to 10,000-column schemas from 166K to 14.3K tokens and raised Claude Opus 4.7 from 12.6%
  to 20.7%. The limits: an independent rerun of AutoLink kept every needed column on 31.55% of the largest
  Spider 2.0-Snow schemas (its authors report 91.2% on Spider 2.0-Lite), exploring took 45 to 131 s per
  question with self-hosted 14B models, and in one company''s warehouse agent a reasoning model overran
  its exploration budget on 77% of traces and changed its tables between repeats on 41 of 50 questions.'
how: '1. Start from the baselines: count the schema''s tokens as you would send it (names, types, descriptions,
  sample values) against the model''s window, and run the full schema (where it fits, 5.b.i) and a one-shot
  column retrieval on the same questions before adding exploration. In one independent comparison, the
  full schema gave GPT-4.1 and Gemini 2.5 Pro their best accuracy at every schema size tested (0.37 to
  0.58), no linking method beat it by more than a point under 1,000 columns for any model class, and linking
  (done by GPT-4.1) paid only for economy and open generators on larger schemas (0.29 against 0.19 and
  0.16 at 1,000 to 2,500 columns). 2. Before you decide the schema is too large, compress it once, offline:
  write each repeated group of columns (audit, status) once, collapse families of identically shaped sharded
  tables into one template, and replace long column descriptions with short shared tags. In one study
  on Spider 2.0-Snow with Claude Opus 4.7, this cut databases of 1,000 to 10,000 columns from 166K to
  14.3K input tokens and raised execution accuracy from 12.6% to 20.7%; at 10,000 or more columns the
  raw 2.6M tokens fit no model tested, while the compressed 34.7K gave 63.1% strict recall and 14.5% accuracy;
  under 1,000 columns it changed little (33.8% to 35.1%). It also stacks with exploration: on databases
  over 5,000 columns it cut AutoLink''s tokens from 61.0K to 26.2K and raised its accuracy from 19.6%
  to 21.4% (DeepSeek-V3.2). 3. Build a column-level vector index of the schema (1.4 s per database on
  one H100 in one study) and check what it finds on your own questions: on enterprise schemas of 244 to
  971 tables with names and keys only, off-the-shelf search put every needed table in its top 15 for 21.8%
  to 41.0% of questions, a zero-shot 8B reranker over the top 100 for 50.3% to 77.1%, and a scorer trained
  on the customer''s own example questions for 69.2% to 89.5%. Seed each question with all table names
  plus the top retrieved columns (strict recall 79.2% with the top 5 columns, 91.2% with the top 100)
  rather than starting from nothing: an untrained 4B model exploring with no schema in context lost 17.0
  points on BIRD against having the schema (an 8B model lost 2.0). 4. If the catalog spans many databases,
  choose the databases first, and let the agent search and inspect catalog evidence (schemas, capabilities,
  relationships) over several turns rather than pick from a few retrieved ones in one call: averaged over
  seven current models, Claude Opus 5 and GPT-5.6 Sol among them, an iterative router found the exact
  set of needed databases for 53.52% of 815 mostly multi-database tasks, against 21.88% for a one-shot
  pick after inspecting up to three retrieved databases (not compute-matched, no token counts). Run over
  a 53-database, 102,341-column catalog with no target database given, AutoLink used 635K to 652K tokens
  per question, and in that study removing the database-shortlisting step lowered column recall in all
  six settings. 5. Give the agent actions to retrieve more columns with its own queries (removing this
  cost 6.7 to 7.6 points of strict recall, the largest ablation), to probe metadata and sample values
  with exploratory SQL (results capped at a few rows, with a timeout, 2.c.i), and to test sufficiency
  with a minimal executable query before it writes the answer (in one pilot, making the agent commit to
  a verified schema first cut hallucinated tables and columns from 26.4% of failures to 2.8%). Favor recall,
  then keep the set small: in a regression over 183,825 generated queries, column recall dominated accuracy
  (coefficient 3.382, against 0.096 for column precision), yet the linked set''s size still cost accuracy
  (-0.429 per log column count). AutoLink''s linked sets ran at 8.00% field precision in an independent
  rerun, held 9.5 to 24.9 times more columns than a hierarchical linker, and raised SQL-generation tokens
  (65.82K against 45.53K to 52.41K), so track the set''s size next to recall. 6. Cap exploration at a
  few turns (strict recall 89.2% at 4 turns against 91.2% at 10, with 3.72 to 5.79 turns used) and budget
  for latency: AutoLink took 45 to 131 s of linking per question on BIRD-dev with self-hosted 14B models,
  against about 4 s for a single linking prompt. A reasoning model now uses the tools but tends to over-explore:
  AutoLink''s authors avoided one because it broke the action format, while in one company''s warehouse
  agent a reasoning configuration made 6.4 schema lookups per trace against 0.77 for a faster one with
  the same tools, stopped refusing (0% against 73%) and used the required table in 50% of scored finance
  runs against 0%, but overran its schema-exploration budget on 77% of traces, hit the tool-round limit
  on 16% of runs, took 119 s against 41 s on average, and changed its table set or reading of the question
  across three repeats on 41 of 50 questions. 7. Measure with paired runs on your own large schemas, split
  by schema size, against the full schema (raw and compressed, where it fits) and one-shot retrieval,
  with the production model and a cheaper one, repeating each question at least three times: strict linking
  recall (questions whose linked set holds every needed column; for a catalog, the exact set of needed
  databases), linked-set size, execution accuracy, whether the same tables are chosen across repeats,
  schema lookups and runs that end at a budget, tokens for linking and for generation, and wall-clock
  per question.'
detect:
  static: a schema too large to load whole, or over about 1,000 columns with an economy or open model,
    linked by a single up-front retrieval or sent whole in every prompt; a raw schema full of repeated
    column groups or families of identically shaped sharded tables, sent or linked uncompressed; databases
    in a multi-database catalog picked in one call from a few retrieved candidates; a linking or exploration
    step in front of a schema that fits a flagship model's window, with no full-schema comparison
  traces: queries against non-existent columns or the wrong tables on a large schema; prompt tokens dominated
    by the schema; schema prompts that overflow the window; exploration runs that end at the turn cap,
    overrun the schema-lookup budget or spend tens of seconds linking per question; different tables chosen
    for the same question across runs
  evals: strict schema-linking recall and execution accuracy on the large-schema subset, with no full-schema
    (raw or compressed) or one-shot retrieval baseline, or from a single run per question
impact:
  quality:
    effect: mixed
    size: large
    when: exploring a catalog over several turns found the exact set of needed databases for 53.52% of
      815 tasks against 21.88% for a one-shot pick, averaged over seven current models including Claude
      Opus 5 and GPT-5.6 Sol (Luo, Oct 2026); AutoLink kept every needed column on 91.2% of Spider 2.0-Lite
      questions against 64.0% for the best full-schema linker (Wang, Nov 2025), but an independent rerun
      on Spider 2.0-Snow got 73.11% overall and 31.55% on schemas of 506 or more fields, and its linked
      schemas gave 32.88% execution accuracy against 36.75% for a non-iterative linker (Zheng, May 2026);
      against sending the whole schema, linking lost for GPT-4.1 and Gemini 2.5 Pro at every size and
      won only for economy and open models on schemas of 1,000 or more columns (0.29 against 0.19 and
      0.16 at up to 2,500) (Luoma, May 2026); compressing a 1,000- to 10,000-column schema raised Claude
      Opus 4.7 from 12.6% to 20.7%, and AutoLink from 19.6% to 21.4% on schemas over 5,000 columns (Liu,
      Jun 2026); an untrained 4B model exploring with no schema lost 17.0 points on BIRD, while an RL-trained
      one matched the full schema (64.9% against 64.8%) (Jian, Mar 2026); in a production warehouse agent,
      a reasoning configuration that explored more used the required table in 50% of scored finance runs
      against 0% (Kolli, Aug 2026)
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: 21.2K against 171.9K tokens per question for full-schema linkers on Spider 2.0-Lite (Wang, Nov
      2025); in a rerun on Spider 2.0-Snow, 77.93K linking tokens against 240.34K and 580.80K for two
      other linkers, but its larger linked schemas raised generation tokens to 65.82K against 45.53K to
      52.41K (Zheng, May 2026); 635K to 652K tokens per question over a 53-database catalog (Xu, Aug 2026);
      under 1,000 columns, LLM-based linkers used more tokens than sending the full schema (Luoma, May
      2026); compressing the schema first cut AutoLink from 61.0K to 26.2K tokens per question on schemas
      over 5,000 columns, and a raw 1,000- to 10,000-column schema from 166K to 14.3K (Liu, Jun 2026)
    basis: evidence
  performance:
    effect: degrades
    size: large
    when: AutoLink's linking took 45 to 131 s per question on BIRD-dev with self-hosted 14B models against
      about 4 s for a single linking prompt, and 465 to 638 s on a 53-database Spider 2.0-Snow catalog
      (Xu, Aug 2026); an agentic column-by-column linker took 32 to 352 s per question and was infeasible
      above 2,500 columns (Luoma, May 2026); a trained 4B exploring agent took 0.6 s against 0.4 s with
      the schema in context (Jian, Mar 2026); in a production warehouse agent, the configuration that
      explored more took 119 s per question on average (p90 234 s) against 41 s (86 s) and hit the tool-round
      limit on 16% of runs (Kolli, Aug 2026)
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: degrades
    size: small
    when: in one company's warehouse agent, the reasoning configuration that made 6.4 schema lookups per
      trace changed its table set or interpretation across three repeats on 41 of 50 questions (21 of
      50 for the faster configuration) and used a non-canonical source-of-truth table on 15 of 30 finance
      runs, though both configurations avoided a prohibited table on every scored run (Kolli, Aug 2026);
      one company, two anonymized model configurations, not a test with exploration switched off
    basis: evidence
  brand:
    effect: unknown
  primary:
  - quality
  - cost
measure:
- method: experiment
  tier: 3
  how: 'paired runs on the same questions over your own large schemas, split by schema size (columns),
    with the production model and a cheaper one: the full schema raw and compressed where it fits, one-shot
    column retrieval, and exploration, each question run at least three times; report strict linking recall
    (for a multi-database catalog, the exact set of needed databases), linked-set size, execution accuracy,
    whether the same tables are chosen across repeats, tokens for linking and for generation, and wall-clock
    per question'
- method: monitor
  how: 'in production traces: queries that reference tables or columns outside the linked set or the schema,
    schema lookups per question, exploration turns and runs ending at the turn or tool-round cap, different
    tables chosen for the same or near-identical questions, linked-set size, the schema''s share of prompt
    tokens, and linking wall-clock per question'
