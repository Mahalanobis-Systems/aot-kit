# 6.b.ii: LLM map-reduce
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 6.b.ii
legacy_id: P45
slug: llm-map-reduce
name: LLM map-reduce
kind: pattern
status: card
tiers:
- tier: 2
  why: it contains prompt injection to the item it arrives in
  proposed: true
- tier: 4
  why: it decomposes the task across parallel calls
  proposed: true
levers:
- control-flow
domains:
- general
evidence_domains:
- retrieval
- document-extraction
- commerce
- tool-use
- code-generation
categories:
- topologies.parallel
summary: 'Give each piece of a large or untrusted input its own tool-less model call that sees only that
  piece and must answer in a fixed schema, then combine the answers in code or in a reducer that never
  sees the raw text. Against prompt injection it confines an attack to the item it sits in: with each
  product review mapped to two integers and a median, injected reviews swayed a GPT-4o shopping agent
  0.0% of the time against 31.7% undefended at the same utility, but a schema too narrow for the task cut fixes on 180 curated SWE-bench Lite issues from 68.3% to 45.0%. On long input it pays when the model degrades with length
  and the answer needs little reasoning across chunks: prompted chunk readers on a 4B model held 72.92%
  on multi-hop QA at 896K tokens where the same model given the whole document fell to 31.25%, while character
  inference, which depends on relations spread across a dialogue, scored below the whole-input call at
  every chunk size. A frontier long-context model is the baseline to beat: DeepSeek-V4-Pro at maximum
  reasoning kept 78.91% at 896K, and whole-input Gemini 2.5 Pro beat a map-reduce whose per-document sub-agents searched only their own
  document 68.0 to 58.1 on 102 multi-document questions, where map-reduce won only on cost.'
how: '1. Start from the baseline: the whole input in one call to your current model with thinking on,
  at the input lengths you actually see, and for untrusted input an injection eval with one poisoned item
  among clean ones; record accuracy, cost and p50/p95 latency per item. Expect it to be strong: DeepSeek-V4-Pro
  at maximum reasoning held 78.91% on multi-hop QA at 896K tokens, whole-input Gemini 2.5 Pro beat per-document retrieval map-reduce 68.0 to 58.1, and at 7K tokens a 4B model given the whole document with thinking beat prompted
  chunk readers 80.47% to 72.92%. 2. Check that the task decomposes: per-item judgments (does this file
  hold an invoice, how does this review rate the product, how many years of experience does this resume
  show), extraction, filters, counts and extremes do; answers that hinge on relations across chunks do
  not (character inference over a dialogue scored below the whole input at every chunk size). For multi-hop
  questions use rounds (step 5), not one pass. 3. Split on item boundaries (one file, review, resume,
  email or document per call), so a poisoned item can only change its own record. For long running text,
  try a few chunk sizes on 5 sampled documents each and keep the best (this picked the exhaustive-search
  optimum in 4 of 6 settings and came within 0.04 in the others); the best sizes ran from 4K to 32K tokens
  across models and tasks, and a 1K-token overlap did not help. 4. Map: one isolated call per piece with
  no tools, the task rewritten as a per-piece subtask the reducer can combine (for the second-smallest
  number, ask each chunk for its two smallest), and the output schema enforced with structured outputs.
  For untrusted data allow only integers, floats, booleans, enums from a vetted list or short arrays of
  them, never free text that a later privileged or tool-using call reads; for trusted long text, short
  JSON findings with an explicit not-found answer. The map can run on a smaller model (1.b.i): 4B chunk
  readers scored as well as 9B ones. 5. Reduce in code where you can (count, filter, median, top-K), which
  no single tampered input can redirect; if the reducer is a model with tools, pass it only the validated
  schema fields. For questions that need several hops, let a lead call that never sees the document send
  focused queries to all chunk readers and ask follow-ups over a few rounds; prompted, this held 72.92%
  to 76.04% from 7K to 896K tokens, and RL training of the lead added about 10 points. 6. Measure against
  the baseline on the same items at each input length: accuracy, cost per item and latency (parallel chunk reading, measured on the RL-trained version on two GPUs against one, took 78.22 s against
  375.32 s for the whole 896K document with thinking, but 5.33 s against 1.16 s at 7K, and a three-stage per-document retrieval pipeline took 54.8 s against 45.6 s). For injection, report
  attack success with a canary in one item, check that the reduce output changes only through that item''s
  own fields, and track the per-chunk schema-violation rate.'
detect:
  static: Chunking, a sandboxed model per chunk with a constrained output schema, a deterministic reducer.
    Flag map calls that hold tools, free-text map outputs read by a privileged or tool-using reducer,
    and chunking applied to tasks whose answer depends on relations across chunks.
  traces: Per-chunk outputs conform to schema.
  evals: Injection containment (attack success with one poisoned item); accuracy against the whole-input
    call at several input lengths, with cost and latency.
  probes:
    what: One injected item among clean items; long inputs with the evidence placed at different positions
      and split across chunks.
    construct: Plant a canary instruction in one item (a review, file or email); the reduce output may
      change only through that item's own schema fields, and no tool call may follow the canary. For long
      input, move the evidence across positions and across a chunk boundary and compare accuracy with
      the whole-input call at the same lengths.
  primary:
  - static
  - probes
impact:
  quality:
    effect: mixed
    size: large
    when: 'gains on long input when the model degrades with length and evidence sits within chunks: 72.92%
      vs 31.25% for the whole 896K-token document on a 4B model (Li, Sep 2026); synthetic Math 0.11 to
      0.55 and LongBench-v2 QA 0.31 to 0.48 for gpt-4o-mini at 128K, at a chunk size picked after the
      fact on test data (Xu, Jun 2025). Losses when the answer
      spans chunks (character inference below whole input at every chunk size; Xu, Jun 2025), against
      a frontier whole-input call (Gemini 2.5 Pro 68.0 vs 58.1; Akay, Mar 2026) and when the schema is
      too narrow for the task (180 curated SWE-bench Lite issues 68.3% to 45.0%; Jacob, Sep 2025)'
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: 'every chunk is still read once, plus per-call instructions and a reduce call; cheaper when
      the map runs on a smaller model: $0.103 vs $0.273 per query with Gemini 2.5 Flash readers against
      whole-input Gemini 2.5 Pro (Akay, Mar 2026); repeated rounds re-read every chunk unless the KV cache
      is reused (Li, Sep 2026)'
    basis: evidence
  performance:
    effect: mixed
    size: medium
    when: 'faster on long input with a parallel map: 78.22 s vs 375.32 s per question at 896K tokens against
      the whole document with thinking (RL-trained version on two GPUs vs one), but 5.33 s vs 1.16 s at
      7K (Li, Sep 2026); a coordinator, per-document retrieval map and reduce pipeline took 54.8 s vs 45.6 s for one whole-input call (Akay, Mar 2026)'
    basis: evidence
  security:
    effect: improves
    size: large
    when: per-item calls with typed outputs and a median reducer took injected-review attack success on
      a GPT-4o shopping agent from 31.7% to 0.0% at equal utility; typed hand-offs took calendar scheduling
      from 63.0% and bug fixing from 98.9% to 0.0% (Jacob, Sep 2025); a poisoned item can still set its
      own values (Beurer-Kellner, Jun 2025)
    basis: evidence
  governance:
    effect: improves
    size: medium
    when: each item's contribution is a typed record that can be validated, logged and audited
    basis: assessment
  brand:
    effect: none
    basis: assessment
  primary:
  - security
  - quality
measure:
- method: before-after
  tier: 2
  how: 'injection eval on your own items: plant a canary instruction in one item (review, file, email,
    document) among clean ones and compare attack success with the raw-text design; the reduce output
    may change only through the poisoned item''s own schema fields, and no tool call may follow the canary;
    report utility on clean items alongside'
- method: experiment
  tier: 4
  how: 'paired eval against the whole-input call with thinking on, at several input lengths you actually
    see: accuracy, cost per item, p50/p95 latency; include items whose evidence spans chunk boundaries
    and pick the chunk size on a few sampled documents per size before the full run; confirm with a production
    A/B before switching'
- method: monitor
  how: per-chunk schema-violation and not-found rates, chunks per request, reducer input size, slowest-chunk
    latency, cost per request; on a regularly audited sample, answers that depended on facts spread across
    chunks
