caveats: The injection result is one study with one fixed payload per case and no adaptive attacker; containment
  holds by construction only for instruction injection, a poisoned item can still lie about itself, and
  a free-text map output read by a privileged reducer gives the protection up. The long-input gains come
  from packed or synthetic benchmarks (HotpotQA paragraphs padded with distractors, synthetic number lists),
  from 2024 non-reasoning models in one study and 4B to 9B models in another, where beyond 262K tokens
  the whole-input baseline ran on a context stretched with YaRN. The one comparison against a frontier
  long-context model on real documents is a 102-question study whose map ran on a cheaper model, so its
  cost gap mixes the split with the model change; PARSER's headline 11x latency cut is against a sequential
  memory agent, and its 6.3-point lead over DeepSeek-V4-Pro needs RL on the lead agent and shrinks to
  0.3 points out of distribution.
