  direction: mixed
  measured: true
  locator: §4.2-4.4; §5.1 Table 1; §5.2 Table 2; §5.4 Table 4; §6 Latency overhead; Appendix B
- source: Dennis Jacob, Emad Alghamdi, Zhanhao Hu, Basel Alomair, David Wagner, "Preventing Prompt Injection
    with Type-Directed Privilege Separation", https://arxiv.org/abs/2509.25926
  date: '2025-09-30'
  task: 'A quarantined model with no tools reads untrusted data and may hand back only ints, floats, booleans,
    enums or short arrays of them, enforced with structured outputs. Shopping: each product review is
    mapped to two 0-10 integers (support, relevance) and the privileged agent takes the medians; calendar:
