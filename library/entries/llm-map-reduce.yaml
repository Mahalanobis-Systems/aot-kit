- source: Beurer-Kellner et al., "Design Patterns for Securing LLM Agents against Prompt Injections",
    https://arxiv.org/abs/2506.08837
  date: '2025-06-10'
  task: 'Names the LLM map-reduce pattern: isolated sub-agents process each piece of untrusted data, and
    a reduce step combines their constrained outputs'
  effect: 'Proposed as a design pattern with "provable resistance to prompt injection"; analyzed for trade-offs
    and case studies, not benchmarked. Two reduce designs: one that "does not use an LLM, and simply applies
    operations that are robust to tampering of individual inputs", or an LLM reducer with "safety constraints
    on the outputs of the map operation ... (e.g., a regex that ensures the output of map is a number)".
    A malicious file "is now restricted to tricking the “map” LLM into marking the file as an invoice";
    "there may be tasks where such a strict decomposition is impossible".'
  direction: supports
  measured: false
  locator: Sec 3.1 (3) The LLM Map-Reduce Pattern; case studies Sec 4.1 (5), 4.6 (3), 4.7 (3)
- source: 'Kun Li, Zexuan Qiu, Tianhua Zhang, Irwin King, Helen Meng (CUHK), "PARSER: Read in Parallel,
    Reason in Depth for Long-Context LLM Agents", https://arxiv.org/abs/2609.06702'
  date: '2026-09-06'
  task: Chunk-bound sub-agents (one per 4,096-token chunk, no thinking, JSON findings or abstain) read
    the whole document in parallel; a lead agent that never sees the document scatters focused queries
    and gathers findings over up to 12 rounds. Compared with the same model and DeepSeek-V4-Pro given
    the whole document, and with sequential chunk-by-chunk memory agents (MemAgent, ReMemR1)
  effect: 'HotpotQA Sub_EM, Qwen3.5-4B, 7K / 896K tokens / average: prompted PARSER (no RL) 72.92 / 72.92
    / 74.42; whole document with thinking 80.47 / 31.25 / 65.82; whole document without thinking 75.78
    / 34.38 / 64.36; untrained MemAgent 69.53 / 19.79 / 45.05. RL on the lead: average 84.57 (9B lead
    86.79). DeepSeek-V4-Pro whole document, maximum reasoning: 82.03 / 78.91 / 80.47. 2WikiMultiHopQA
    averages: prompted PARSER 82.85, Qwen3.5-4B whole with thinking 75.49, DeepSeek-V4-Pro 88.18, RL PARSER
    87.04 (9B 88.48). One reader on the whole document instead of chunks: average 73.76, 53.13 at 896K;
    16K, 64K and 128K chunks 83.59, 81.84, 80.34 vs 84.57 at 4K. 2B / 4B / 9B readers: 78.26 / 84.57 /
    84.77. Latency per question at concurrency 1, RL-trained PARSER on two GPUs vs baselines on one: 896K 78.22 s vs 375.32 s whole document with thinking,
    185.42 s without, 876.20 s MemAgent; 7K 5.33 s vs 1.16 s whole document without thinking.'
  conditions: Qwen3.5-4B and 9B lead agents, frozen Qwen3.5-4B readers; DeepSeek-V4-Pro (1M context, reasoning
    effort Max); HotpotQA (in-distribution, Wikipedia paragraphs packed with distractors) and 2WikiMultiHopQA,
