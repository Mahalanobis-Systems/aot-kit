caveats: The injection evidence is three studies with fixed payloads and no attacker adapting to the split
  (one payload per case in one, 649 replayed attacks on one model without utility in another), and the
  third shows the split does not stop data an item forges (a fake record or field got through a quarantined
  reader 25.0% of the time on GPT-5.2, where fixed instruction payloads already failed almost always undefended);
  containment holds by construction only for instruction injection, and a free-text map output read by
  a privileged reducer gives the protection up. The long-input gains come mostly from packed or synthetic
  benchmarks and 4B to 14B models, often with an RL-trained lead, where the open-model whole-input baselines
  ran on contexts stretched with YaRN or truncated to 128K; the two comparisons against a frontier long-context
  model on real documents are a 102-question study whose map ran on a cheaper model (map-reduce lost 58.1
  to 68.0) and one LongBench v2 run in which a Gemini 3 Pro lead tied its own whole-input call (thinking
  level and run count not stated), both by the method's authors, so their cost gaps mix the split with
  a model change. A single map pass lost to a truncated whole-input call on real long documents, and with
  GPT-5 as the lead, sub-calls lowered accuracy on two of three tasks against the same harness without
  them; PARSER's headline 11x latency cut is against a sequential memory agent, and its 6.3-point lead
  over DeepSeek-V4-Pro needs RL on the lead agent and shrinks to 0.3 points out of distribution. The per-item
  agent study behind structured reports per item is not compute-matched and was run with the model's vendor,
  and governance is unmeasured.
