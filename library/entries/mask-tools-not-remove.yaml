  effect: 'Prompt caching guide: a change to tools ("tool names, descriptions, schemas, ordering, or tool-specific
    instructions") breaks prefix reuse. "When the tools your application needs vary between requests,
    change which tools are callable while keeping their definitions stable to preserve reusable prefixes":
    set tool_choice to "none" "instead of removing the tool definitions", use allowed_tools "to restrict
    which tools are callable while keeping the supplied `tools` list stable", and with tool search "Discovered
    tools are appended at the end of context, preserving earlier reusable content." Function calling guide:
    configure allowed_tools to "not modify the list of tools you pass in, so you can maximize savings
    from prompt caching." Vendor guidance, no numbers.'
