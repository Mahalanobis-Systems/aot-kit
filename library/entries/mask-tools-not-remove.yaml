summary: 'When the tools an agent may use change mid-task (by mode, phase or permission), declare every
  tool once, keep the definitions byte-stable, and restrict the choice another way: OpenAI''s allowed_tools
  or tool_choice "none", Anthropic''s appended tool_removal and tool_addition blocks, a decode-time logit
  mask or grammar on self-hosted models, and a harness check that rejects calls outside the allowed set.
  It pays in long sessions with cached prefixes, because editing the tool list invalidates everything
  after it; on the newest Claude models an edited tool list also makes replayed thinking blocks fail with
  an error. The evidence is vendor guidance plus indirect measurements: caching cut agent cost 41-80%
  against a prefix broken on every call, and schema-enforced tool calling nearly eliminated calls to nonexistent
  tools (3 against 34). No study compares masking with removal directly, and keeping disallowed tools
  in view has its own measured cost (one unneeded tool cut answer rates from 98.2% to 63.5%).'
how: '1. Start from the baseline: find where the harness rebuilds the tool list per turn (by mode, phase,
  permission or connected MCP servers) and log a hash of the tools array on every request with the cache
  read and write tokens, so each mid-session change and the cache miss after it is visible. 2. Declare
  the full tool set once at session start, in a fixed order with deterministic serialization, and give
  tools that switch on and off together a shared name prefix (browser_, shell_) so a group can be allowed
  or blocked as one. Add tools unknown at the start by appending them (tool search with defer_loading,
  OpenAI''s additional_tools input item, Anthropic''s tool_addition block), never by editing the array.
  3. Write availability as a state machine in the harness (state to allowed set) and enforce it without
  touching the definitions: on OpenAI, tool_choice {"type": "allowed_tools", ...} or "none"; on Claude,
  an appended system message with tool_removal or tool_addition blocks (beta), because a tool_choice change
  there re-reads the message history and forced tool choice and prefill are rejected on recent models;
  on self-hosted models, a logit mask or grammar over the allowed names, or a prefill up to the shared
  name prefix. 4. Keep a harness-side check whatever the provider: validate every call against the current
  allowed set and the full registry, return an error result that names what is allowed instead of executing
  or silently dropping the call, and leave earlier calls to now-unavailable tools in the history. 5. Keep
  the model able to stop and to decline: do not force a tool call on every turn, and keep a final-answer
  or no-tool path inside any mask. 6. If tools stay visible but disallowed for long stretches, check accuracy,
  since a visible unneeded tool can lower answer rates: add a one-sentence note that tools are optional
  and narrow in scope, and move groups that are rarely allowed behind deferred loading (see the tool-surface
  entry, 2.a.i). 7. Measure with paired runs on sessions that change availability midway, the list rebuilt
  per state against the stable list plus a restriction: cache read share, cost per task, time to first
  token, calls to unavailable or undefined tools, task success and turns to finish, per model and provider.'
detect:
  static: Tool list rebuilt per turn from mode, phase, permissions or connected servers (a tools array
    filtered by state, or prompt text that co-varies with the active toolset); no allowed-tools or tool_choice
    restriction, appended tool_removal or tool_addition blocks, decode-time mask, or harness check of
    each call against the allowed set.
  traces: A different tools-array hash between turns of one session, followed by cache reads near zero
    (provider cache diagnostics name the tools as the point of divergence); on Claude, tool_choice changing
    between turns; calls to tools no longer defined or not allowed; on recent Claude models, 400 errors
    on replayed thinking blocks after a tool edit.
  evals: Cache hit rate; invalid tool call rate.
  probes:
    what: Sessions where a tool becomes unavailable midway.
    construct: State transitions that disable a tool the model used earlier.
  primary:
  - static
  - traces
