caveats: 'No study measures masking against removing tools on the same agent: the cache case rests on
  vendor documentation and on measurements of caching in general, and the saving scales with how often
  the tool set changes and how long the prefix is. Masking keeps disallowed tools in view, and visibility
  has a measured cost: one unneeded tool cut answer rates from 98.2% to 63.5% across six models, and per-step
  pruning beat a full list with the retrieved tools emphasized on small on-device models. Mechanisms differ
  by provider: on Claude a tool_choice change still re-reads the message history, and forced tool choice
  and prefill are rejected on recent models, so Manus''s prefill recipe now applies mainly to self-hosted
  models, where forcing a call every turn made weak models loop. The constrained-decoding results come
  from small open models, adversarial probes and single-step runs.'
