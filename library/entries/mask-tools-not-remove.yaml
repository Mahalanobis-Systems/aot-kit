caveats: 'No study measures masking against removal on cache cost within one multi-turn session: the cache
  case rests on vendor documentation and on measurements of caching in general, and the saving scales
  with how often the tool set changes and how long the cached history is. Removal has measured advantages
  where the tool list dominates the prompt: on single requests over about 450 tools, pruning to 10 per
  request matched a cached full list on billed cost and won on accuracy and latency (one study, one provider),
  one unneeded visible tool cut answer rates from 98.2% to 63.5%, and per-step pruning beat a full list
  on small models. The security comparison is one small coding-agent study on one open model, where the
  execution-time check, not visibility, decided whether forbidden actions ran. Mechanisms differ by provider
  and keep changing: on Claude a tool_choice change re-reads the message history and is not allowed inside
  a message thread, forced tool choice and prefill are rejected on recent models, so Manus''s prefill
  recipe now applies mainly to self-hosted models, where the grammar and constrained-decoding numbers
  come from small open models.'
