measure:
- method: experiment
  tier: 3
  how: 'paired runs on probe sessions where the allowed tool set changes midway (a mode or phase switch,
    a revoked permission, a tool the model used earlier becoming unavailable): the tool list rebuilt per
    state against stable definitions with the provider''s restriction (allowed_tools or tool_choice, tool_removal
    blocks, or a decode-time mask) plus a harness check; compare cache read share and cost per task, time
    to first token, calls to unavailable or undefined tools, task success and turns to finish, per model
    and provider'
- method: monitor
  how: 'per session: a hash of the tools array on every request, with cache read and write tokens on the
    turn after any change (or the provider''s cache diagnostics); calls rejected for naming an unavailable
    or undefined tool; sessions that hit the turn cap while a tool call was forced on every turn'
