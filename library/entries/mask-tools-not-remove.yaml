- source: Anthropic, "Mid-conversation system messages and tool changes" (Claude API docs), https://docs.claude.com/docs/en/build-with-claude/mid-conversation-system-messages
  date: '2026-07-24'
  task: Declare the full tool set up front and withdraw or re-offer tools mid-conversation with appended
    tool_removal and tool_addition blocks
  effect: '"The `tools` array sits even earlier in the hashed request prefix than the top-level `system`
    field, so editing it invalidates the prompt cache for the entire conversation." Instead, "declare
    the full tool set in `tools` up front, then use `tool_addition` and `tool_removal` blocks to offer
    a tool to the model, or withdraw it, from a specific point in the conversation onward. The `tools`
    array itself never changes, so the cached prefix stays intact." Since September 22, 2026 a tool_addition
    block can carry a full definition for a tool unknown at the start. The docs do not say whether a call
    to a withdrawn tool is blocked. No numbers.'
