  conditions: SheetCopilot (112 multi-turn tasks, 2.88 turns on average) and SpreadsheetBench 2 (221 workflows,
    4.76 turns); pairs GPT-5.6 Sol/Luna, Sol/Claude Haiku 4.5, Claude Opus 4.8 high/low effort; GPT-5.6
    Luna as router; one harness; router costs exact only for the Opus pair; no intervals reported; escalation,
    de-escalation and random ran in a separate harness
  direction: mixed
  measured: true
  locator: Abstract; §4 Figure 2, Table 3, Table 4; Figure 3; Figure 4 and switch-cost analysis
- source: 'Junlong Li, Jindong Jiang, Yonggan Fu, Jiarui Yao, Hanrong Ye, Wonmin Byeon, Peter Belcak,
    Hao Zhang, "AgentBaton: Efficient Model Collaboration in Agentic Tasks", https://arxiv.org/abs/2610.35959'
  date: '2026-10-25'
  task: Hand a long-horizon agentic task from one model to another partway through (capable-to-efficient
    vs efficient-to-capable; history in context or as a log file), at fixed checkpoints and with a trained
    handoff detector
  effect: 'DeepSWE v1.1, fixed checkpoints, capable to Qwen3.8-27B: Kimi K3 at 45% 72.57% vs 73.45% capable-only,
    -61.5% cost; GPT-5.6 Sol at 60% 67.26% vs 68.10%, -47.9%; GLM-5.3 at 30% 61.1%, matching its baseline,
    -82.4%. Efficient-to-capable: later handoffs to GLM-5.3 and Kimi K3 lost accuracy; to GPT-5.6 Sol
    at 30% 70.80% vs 68.10% but only -6.1% cost. Prompting the capable model to hand off: Kimi K3 never
    did, GLM-5.3 on 6 of 113 tasks. Detector: API cost -65.9% on average over 11 pairs and two benchmarks,
    up to +8.8 points; 12 of 22 pair-benchmark settings improved accuracy or lost under 5% relative. Against
    a reproduced per-turn router (MTRouter): 46.7-86.6% lower cost at matched or better accuracy in four
    settings.'
  conditions: Terminal-Bench 2.1 and DeepSWE v1.1 (113 tasks); capable models GPT-5.6 Sol, Kimi K3, GLM-5.3
    (max effort), plus Claude Opus 5 and Gemini 3.8 Flash in the main table; efficient Qwen3.8-27B (xhigh)
    and GPT-5.6 Luna; detector trained on 4,000 SWE-rebench V2 trajectories; the authors' own method
  direction: supports
  measured: true
  locator: Abstract; §3.1 Table 1; §3.2 Figure 3; §4 Table 2; §5 Tables 3-4
- source: Xiaonan Xu, Wenjing Wu (Georgia Tech, CU Boulder), "Low Reasoning Effort Is Enough for Routine
    Office Work by Language-Model Agents", https://arxiv.org/abs/2608.03169
  date: '2026-08-04'
  task: Run the same routine office tasks (each with an item the rules block and a forbidden tool that
    would complete it) at low and max reasoning effort; check rule following from final state and record
    tokens and latency
  effect: 'Forbidden tool used in 0 runs at either level (difference at most 4.30 points on Terra and
    6.38 on Sol at 95% confidence). Median per trajectory, low vs max: output tokens 483 vs 861.5 (Terra)
    and 539 vs 937.5 (Sol); response latency 37.4 vs 47.0 s (Terra) and 52.6 vs 65.9 s (Sol), ''about
    43% fewer output tokens and 20% less time''; tool calls 16 vs 16 and 16 vs 17.'
  conditions: GPT-5.6 Terra and Sol via the Responses API; 14 simulated office tasks x 3 versions; 6 runs
    per cell on Terra, 4 on Sol; 840 runs; rule following only, task difficulty low; up to 20 or 32 tool
    steps
  direction: supports
  measured: true
  locator: Abstract; §3.2; §4.1 Table 1; §4.2 Table 2
- source: 'Yao Ma, Xuwei Tan (Coinbase), "Part 2/3 Owning Intelligence Series: How Coinbase Built, Evaluated,
    and Post-Trained a Fraud Agent", https://www.coinbase.com/blog/part-two-owning-intelligence-series'
  date: '2026-10-07'
  task: Swap the model behind a fraud-review agent call site for the next version in its family, with
    the prompt, context and risk-to-decision policy fixed, and score on a fixed replay benchmark
  effect: 'Newer vs earlier version, percentage points: Sonnet 4.6 to Sonnet 5 recall -22.2, dollar-weighted
    recall -22.9; Opus 4.5 to Opus 5 recall -0.8, lower on all four metrics; GPT-5.4 to GPT-5.6 (sol)
    precision +11.5, recall -20.7, dollar-weighted recall -21.8. ''Across all three pairs, the newer version
    had lower recall, F1, and dollar-weighted recall.'''
  conditions: 16,140 historical transactions across 7,293 users, 813 confirmed fraud, from nine weeks
    before the agent's rollout; decision agent only; point estimates (Figure 1), no absolute scores or
    intervals; vendor case study (the evaluator is not the model vendor)
  direction: mixed
  measured: true
  locator: Results; Figure 1; What This Means for Model Selection
- source: Dex Horthy, with Gabe Orlanski (HumanLayer), "SlopCodeBench update 10/2026 - Opus 5.5 update,
    Astra improves by 1.5% over gpt-5.5, xhigh considered harmful", https://github.com/humanlayer/advanced-context-engineering-for-coding-agents/blob/main/benchmarking-new-models-on-slop-code-bench.md
  date: '2026-10-15'
  task: Run coding agents at medium and xhigh effort through all 36 SlopCodeBench problems (196 checkpoints)
    and compare strict passes and estimated cost
  effect: 'Medium to xhigh strict passes of 196: Opus 5.5 28 to 25 (4.22x cost), GPT-6 SOL 30 to 26 (2.11x),
    GPT-6 Astra 29 to 32 (2.91x). ''higher effort was not a reliable way to buy more strict passes in
    these runs.'' Opus 5.5 xhigh code had less flagged slop (77.75% vs 94.25% of source lines on 28 matched
    problems). Cheapest campaign GPT-6.1 SOL Medium $178.51 with 29 strict passes; Fable 5.1 XHigh $1,550.07
    with 26.'
  conditions: pinned v1.0 catalog, stock just-solve prompt, seed 42; one run per model and setting; estimated
    costs; practitioner write-up
  direction: supports
  measured: true
  locator: '''more effort == more spend'' table; complete-campaign table; code quality section'
- source: 'Chenpan Li, Thies Brockmoeller, Stefanie Jegelka, Sharut Gupta, Nikolaos Karalias (TU Munich,
    MIT CSAIL), "On the Fragility of Tasks under Composition: Implicit Budgeting in Language Models",
    https://arxiv.org/abs/2610.27190'
  date: '2026-10-19'
  task: Compose several independently solvable tasks into one prompt and measure per-task reasoning tokens
    and accuracy; batch tasks by measured or predicted fragility
  effect: 'Per-task reasoning shrinks approximately as a power law in the number of composed tasks. GPQA-Diamond,
    random batches of six: -10.5 pp accuracy, -60.9% tokens (eight-model mean); fragility-aware (measured)
    +0.2 pp, -32.8%. Averaged over models and datasets except AIME, measured fragility saved 43% of tokens
    at +0.6 pp; the deployable linear predictor saved 31.0% with at most 0.5 pp loss per dataset. Claude
    Opus 5 (medium effort) on GPQA-Diamond: isolated 89.5% at 689 tokens; random k=6 -0.9 pp, -18%; measured
    fragility -0.4 pp, -24%; predictor -2.0 pp, -0.5%.'
  conditions: Qwen3 4B Thinking, 8B, 14B, Qwen3.8 27B, three R1 distills, Claude Opus 5 (GPQA-Diamond
    only, fewer trials); GPQA-Diamond, GSM8K, MATH-500, MMLU-Redux, StrategyQA, AIME, integrals, OneWordQA;
    43% uses fragility measured on the same tasks
  direction: supports
  measured: true
  locator: §3.1; §4.1 Table 1; §4.2; App. A.1.6 Table 2
caveats: 'Most effort sweeps on agentic tasks run each setting once (the eight-model sweep and the SlopCodeBench
  comparison), and a four-rollout check found lost lower-effort tasks at rates comparable to chance, so
  compare settings on repeated runs and tasks gained and lost, not one aggregate score. Effort and model
  do not move uniformly: higher effort raised strict passes for one of three coding models and its code
  had less flagged slop for another, escalating after a failed check needs a reliable external check and
  cost more than fixed top effort for four of eight models on Terminal-Bench, and none can cost more than
  low when the agent compensates with extra calls. Routing per query or turn often matched but did not
  beat the best single setting: a history-aware router stayed within a point of the expensive model at
  no cost saving, a cheap model or low effort alone matched or beat it in two of three pairs, self-chosen
  effort did no better than random allocation, and within-turn de-escalation trailed the fixed models
  on average on spreadsheets while capable-first handoffs in coding saved 65.9% on average but lost 5%
  or more relative accuracy in 10 of 22 settings (the authors'' own method). Newer generations can regress
  on a narrow task (one fraud benchmark, point estimates only), and packing several items into one call
  cuts reasoning per item, so re-run the site''s eval on every upgrade or batching change.'
