absorbs:
- legacy_id: P03
  name: Chain-of-thought
  group: Prompting Strategies
  source: both
  family: prompt
  sub_type: instructions
  categories:
  - prompts.reasoning-effort
  note: Zero-shot or few-shot reasoning steps; buys compute before acting.
  assessment:
    detection:
      static: Prompt asks for step-by-step reasoning; reasoning parameter enabled on the model call; output
        schema has a reasoning field.
      traces: Reasoning tokens present before the answer; their length relative to task difficulty.
      evals: Accuracy on multi-step items vs single-step; tokens per item.
      judge: Is the reasoning load-bearing or post-hoc; is it verbose for the task.
      probes:
        what: Multi-step arithmetic or logic tasks with a plausible wrong shortcut.
        construct: Three or more dependent steps; a shortcut answer that is wrong; a known ground truth.
      primary:
      - evals
      - probes
    qa:
      unit: Reasoning field present when required by the schema.
      examples: Probe set; check the shortcut answer is avoided.
      benchmark: MATH or GPQA-style reasoning benchmark.
      production: Tokens per item and accuracy on sampled traffic.
      primary:
      - benchmark
      - production
    impact:
      cost:
        effect: degrades
        magnitude: medium
        note: More output tokens per item.
      security:
        effect: none
        magnitude: low
        note: ''
      brand:
        effect: mixed
        magnitude: low
        note: Exposed reasoning can read badly to end users.
      governance:
        effect: improves
        magnitude: low
        note: Reasoning is inspectable.
      quality:
        effect: improves
        magnitude: medium
        note: Task-dependent; VeRO found reasoning tasks bounded by the target model, T13 regressed on
          GPQA.
      latency:
        effect: degrades
        magnitude: medium
        note: Longer generations.
      primary:
      - quality
      - cost
