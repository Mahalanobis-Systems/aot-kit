summary: Pick the model per role or call site rather than one model everywhere, and set its reasoning
  effort and sampling parameters per site; tune each role's prompt to its model (GEPA raised every model
  tested at lower cost). Give the agent explicit effort budgets by query class (e.g. one agent and 3-10
  tool calls for simple fact-finding) so simple queries are not over-served. Upgrade the model generation
  before doubling token budgets. A prompt that forces stepwise reasoning is the same lever from the prompt
  side and hurt on GPQA; prefer the model's own effort setting.
how: 1. From traces, list call sites and their token, cost and error profile. 2. For each, run a small
  model grid (cheaper, specialist, effort levels) on the eval slice that exercises it. 3. Optimize each
  site's prompt for its model. 4. Add per-query-class budgets. 5. Paired eval per call site.
detect:
  static: one model and one effort setting for every call site; no per-query-class budget
  traces: simple queries using as many steps, tokens or sub-agents as complex ones; a call site whose
    cost dominates with no quality reason; retries exhausted or timeouts at one site
  evals: 'quality and cost per call site, per model; price not predicting quality across the measured
    configurations (in an email-triage agent we measured: Spearman 0.12)'
impact:
  quality:
    effect: improves
    size: medium
    when: 'Genie: 81.4% to 91.6% with a model per role (May 2026); in an email-triage agent we measured,
      the best recall came from gpt-5-nano at low effort'
    basis: evidence
  cost:
    effect: improves
    size: large
    when: Genie 2.13x to 0.95x cost
    basis: evidence
  performance:
    effect: unknown
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
measure:
- method: experiment
  tier: 3
  how: paired eval per call site and per query class
