  assessment:
    detection:
      static: A classifier step and a branch table; different models or prompts per branch.
      traces: Route distribution; branch changes mid-task; fallback rate.
      evals: Routing accuracy on labeled intents; per-branch quality.
      judge: Label the correct route for sampled traffic.
      probes:
        what: Ambiguous inputs at route boundaries.
        construct: A labeled set per route plus boundary cases written to sit between two routes.
      primary:
      - evals
      - probes
    qa:
