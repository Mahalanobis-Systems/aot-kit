summary: 'Start each call site at a low reasoning effort and a model chosen on its own eval, instead of
  the top setting everywhere: on agentic coding tasks that every effort level solved, xhigh effort cost
  2.5 to 5.3 times low effort, and on Terminal-Bench every one of eight models lost some tasks its lowest
  level had solved. Pick the model per role or call site and tune each role''s prompt to its model (a
  model per role raised one data agent from 81.4% to 91.6% at lower cost; GEPA raised every model tested
  at lower cost), give explicit effort budgets by query class (e.g. one agent and 3-10 tool calls for
  simple fact-finding), and where an external check exists, escalate effort only after a verified failure,
  which matched or beat fixed top effort''s success for all eight models, mostly at lower cost. Choose
  by measured cost and quality per task, not list price or release date: a model at a fifth of the per-token
  price cost only 3.2 times less per task and passed 16.4% of tasks against 27.1%, and the newer generation
  of each of three model families lost recall on one fraud benchmark (by up to 22.2 points), so try a
  newer model before doubling token budgets but benchmark it on the site''s eval first. Routers that pick
  model or effort per query or turn often matched but did not beat the best single choice, and a prompt
  that forces stepwise reasoning is the same lever from the prompt side and hurt on GPQA; prefer the model''s
  own effort setting.'
how: '1. From traces, list call sites and their token, cost, latency and error profile; the baseline is
  the current model and effort at each site. Count realized cost per task (input including cache reads,
  reasoning and output, calls per task), not list price: in one spreadsheet-agent study Claude Haiku 4.5,
  at a fifth of GPT-5.6 Sol''s input price, made about 41 calls per session against about 25 and cost
  only 3.2 times less per task while passing 16.4% against 27.1%. 2. For each site, run a small model
  grid (cheaper, specialist, effort levels) on the eval slice that exercises it. Sweep effort from the
  lowest level up rather than max it: in one eight-model sweep, on tasks every level solved, low to xhigh
  raised mean cost 2.51 to 5.34 times in the GPT-5.6 and Claude Sonnet 5 cases reported for Terminal-Bench
  and SWE-Bench Pro (up to 42 times across models and benchmarks), largely through longer trajectories
  (GPT-5.6-sol 14.7 to 28.4 calls), and on Terminal-Bench every model lost some tasks its lowest level
  had solved; xhigh cost 2.11 to 4.22 times medium on SlopCodeBench while strict passes fell for two of
  three models (one run each); Claude Opus 4.8 at low effort passed more multi-turn spreadsheet tasks
  than at high for 27 to 46% less cost. Forced extra thinking cut GSM8K accuracy from 87.3% to 70.3% (1,100
  to 15,980 thinking tokens), majority-voted parallel traces beat one long trace at the same budget (+10.1%),
  and stopping once a candidate answer appears cut reasoning tokens by 24.5% for a 2.9-point accuracy
  drop. Include ''none'' in the sweep but count its calls: GPT-5.6-luna made 21.5 calls at none against
  5.4 at low and cost 4.58 times as much. 3. Where the site has an external correctness check (tests,
  a verifier), run it at the lowest effort and retry at the top effort only after a failed check. Across
  eight models this matched or beat fixed top effort on every benchmark, at median cost savings of 25.3%
  (AIME), 41.5% (GPQA) and 15.5% (corrected SWE-Bench Pro), with cheaper runs for four of eight models
  on Terminal-Bench (GPT-5.6-sol 83.0% to 88.6% success at 17.4% lower cost); letting the model pick its
  own effort from the task description did no better than random allocation. 4. Optimize each site''s
  prompt for its model (GEPA raised every model tested as a table-search sub-agent at lower cost), and
  keep per-model prompt variants and metadata in a registry so a model swap does not need code changes.
  5. Add per-query-class budgets (e.g. one agent and 3-10 tool calls for simple fact-finding, 2-4 sub-agents
  for comparisons). If a multi-turn agent routes per user turn, give the router the session history (at
  a matched offloading rate it raised pass rate from 25.0% to 28.3%) and switch down early rather than
  up late: at that study''s prices a switch to a cheaper model recovered its lost prompt cache in about
  1.25 calls, an upward switch never did. In long coding tasks, let the capable model start and hand the
  rest to the cheaper one, not the reverse: on DeepSWE, handoffs to Qwen3.8-27B at 30 to 60% of the trajectory
  kept accuracy within a point of the capable model at 47.9 to 82.4% lower cost, while cheap-first handoffs
  saved little (6.1% for GPT-5.6 Sol) or lost accuracy. 6. Re-run the site''s eval before any model upgrade,
  under the existing prompt and decision policy: on one fraud benchmark the newer Sonnet lost 22.2 recall
  points and the newer GPT 20.7, although general benchmarks improved. Do not pack several items into
  one call at a reasoning-heavy site, since per-item reasoning shrinks with the number of items (random
  batches of six lost 10.5 points on GPQA-Diamond, eight-model mean). 7. Paired eval per call site and
  query class, with repeated runs: success, tasks gained and lost against the current setting (not only
  the aggregate), realized cost per task, calls per task and latency per model and effort level.'
detect:
  static: one model and one effort setting (often the top one) for every call site; no per-query-class
    budget; a model or version upgrade shipped without re-running the site's eval; several items packed
    into one call at a reasoning-heavy site
  traces: simple queries using as many steps, tokens or sub-agents as complex ones; a call site whose
    cost dominates with no quality reason; trajectories that grow longer (more calls, more self-verification)
    at higher effort on tasks a lower setting already solves; many calls per task at effort none; retries
    exhausted or timeouts at one site
  evals: 'quality and cost per call site, per model; price not predicting quality across the measured
    configurations (in an email-triage agent we measured: Spearman 0.12)'
impact:
  quality:
    effect: improves
    size: medium
    when: 'Genie: 81.4% to 91.6% with a model per role (May 2026); in an email-triage agent we measured,
      the best recall came from gpt-5-nano at low effort; escalating effort only after a failed check
      raised Terminal-Bench success for all eight models tested, e.g. GPT-5.6-sol 83.0% to 88.6% (Sun,
      Oct 2026); Opus 4.8 at low effort beat high on multi-turn spreadsheets, 31.2% vs 29.5% and 36.7%
      vs 32.1% (Parashar, Oct 2026); limits: newer generations lost 20.7 and 22.2 recall points on one
      fraud benchmark (Ma, Oct 2026), and cheap-first model handoffs lost accuracy (Li, Oct 2026)'
    basis: evidence
  cost:
    effect: improves
    size: large
    when: Genie 2.13x to 0.95x cost (May 2026); on tasks every level solved, low to xhigh effort cost
      2.51-5.34x on agentic benchmarks and up to 42x across all benchmarks, and escalating only after
      a failed check saved a median 15.5 to 41.5% against fixed top effort (Sun, Oct 2026); xhigh cost
      2.11-4.22x medium on SlopCodeBench (Horthy, Oct 2026); a capable-then-cheap model handoff cut API
      cost 65.9% on average over 11 model pairs (Li, Oct 2026); a history-aware per-turn router saved
      nothing ($0.369 vs $0.365 per task) where the cheap setting alone was as good (Parashar, Oct 2026)
    basis: evidence
  performance:
    effect: improves
    size: medium
    when: low instead of max effort cut median response time per run by 20% (37.4 vs 47.0 s and 52.6 vs
      65.9 s for two GPT-5.6 tiers) on routine office tasks (Xu, Aug 2026); at higher effort GPT-5.6-sol's
      SWE-Bench Pro trajectories grew from 14.7 to 28.4 calls (Sun, Oct 2026); step-by-step prompts made
      reasoning models' requests 20-80% (10-20 s) slower (Meincke, Jun 2025); escalating after a failed
      check adds a second full run on those tasks
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
  primary:
  - cost
  - quality
measure:
- method: experiment
  tier: 3
  how: 'paired eval per call site and per query class: each candidate model and effort level (from the
    lowest, including none where offered) on the same items, with repeated runs; success, tasks gained
    and lost against the current setting, realized cost per task (input incl. cache reads, reasoning,
    output), calls per task and latency; for escalation or routing policies, charge both attempts and
    the router calls'
- method: monitor
  how: 'per call site in production: cost per task, calls per trajectory, latency, escalation or routing
    rate and quality on sampled traffic; re-run the site''s eval on every model or provider version change
    before switching'
