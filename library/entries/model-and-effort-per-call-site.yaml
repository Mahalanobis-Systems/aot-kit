# 1.b.i: Match the model and its effort to each call site and query class
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 1.b.i
legacy_id: T65
slug: model-and-effort-per-call-site
name: Match the model and its effort to each call site and query class
kind: technique
status: card
tiers:
