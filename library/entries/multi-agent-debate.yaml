caveats: 'The matched-compute evidence is closed-form QA, math and multi-hop questions: open models from
  0.6B to 109B in one unreviewed study (100 problems per task) and, on current reasoning models, one study
  that matched the requested thinking cap rather than the spend (debate used several times the single
  call''s thinking tokens), graded by an LLM judge and with Gemini''s token counts unreliable; the one
  frontier study of open-ended output measures how useful 44 authors found length-normalized reports,
  not correctness, and its authors built the debate tools. Heterogeneity is contested: mixing models lifted
  debate over the models'' average and over a vote of their first answers, but not over the strongest
  member on three of five benchmarks (100 problems each, so most single-benchmark gaps are within sampling
  noise, and no token accounting), and the study that matched generations found the roster vote ahead
  (-1.04 points). Debate results are fragile to evaluation details: a different answer parser, the one
  behind Du et al.''s 2023 gains, reversed debate against the vote on GSM8K, and in one study a capped
  thinking budget and context overflow each moved the comparison by about two to four points before correction.
  The judge-panel result is a single-author preprint on code correctness at temperature 0 with non-random
  attrition (600 candidates down to 291), and the security results come from one benchmark, mostly GPT-4o
  with one debate round and templated payloads, where stronger models resisted collusion far better (28.30%
  against 6.90% and 3.28%).'
