summary: 'Several model instances answer the same question, read each other''s answers and revise over
  one or more rounds, and a vote or judge settles the final answer. It beats a single answer on closed-form
  reasoning (+3.3 to +6.6 points across 23 open models where tasks had headroom), but a plain majority
  vote over the same number of independent samples gets the same gain: in budget-matched tests debate
  tied or lost to the vote on every task, GPQA Diamond at full thinking budget included, at 1.6x the wall-clock
  and 3.4x the tokens, and a vote over the first-round answers alone beat every debate variant on average, though mostly on
  one arithmetic task (0.99 vs 0.76; Choi, NeurIPS 2025). Mixing model families lifted debate above the average of its single-model runs
  in one study but lost to a vote over the same mixed roster in another (-1.04 points over 80 teams),
  and with frontier models on real paper feedback, authors ranked a single pass above two debate tools
  that spent 9x and 30x the tokens. Treat debate as an experiment against a vote at matched compute, worth
  keeping only where the vote is often wrong while some agent has the right answer.'
how: '1. Start from the cheap baselines on your own items: the single pass at full thinking budget (1.b.i)
  and a majority vote over as many independent generations as the debate would spend (agents x rounds)
  from the same model or roster (9.c.ii). Across 23 open models debate with 3 agents and 3 rounds tied
  or lost to a 9-sample vote on every task, never significantly ahead (GPQA Diamond 54.9 vs 54.3, CommonsenseQA
  80.6 vs 78.3), and a vote over 5 first-round answers beat every debate variant on average (Qwen2.5-7B 0.7691 vs at best
  0.7377), mostly on one arithmetic task (0.99 vs 0.76); on the other six benchmarks the two averaged about
  0.73 each. Build debate only where the vote leaves headroom. 2. Give every arm the same
  final-answer format and extractor, and parse the last answer an agent states, since debate replies quote
  their peers'' answers (9.b.i). With Du et al.''s parser debate beat the vote on GSM8K (0.7533 vs 0.6700);
  with a fixed answer format the vote won (0.9400 vs 0.8867). 3. To use several models, pool them and
  vote before adding debate, and compare any mixed debate against a vote over the same mixed roster and
  against the strongest model alone. Mixing GPT-4o-mini and Llama-3.1-70B lifted every debate framework
  over the mean of its single-model runs (Society of Minds 76.7 vs 74.3 and 69.9), but no vote over that
  mix was run; across 80 three-model teams where it was, debate lost 1.04 points to it, and in the 19
  team-task cells where mixed debate beat the team''s best member by 10 points or more, the roster vote
  gained more (+16.4 vs +13.5). Do not add persona prompts on small models: they cost 2.1 to 4.4 points.
  4. If debate stays, run one exchange after the first answers and stop. In mixed-team debate accuracy
  went from 84.6% (vote over first answers) to 87.2% after one exchange and stayed at 87.0-87.5% through
  five rounds; Decentralized debate fell from 0.7377 at two rounds to 0.7050 at five. Letting an agent
  keep an answer that matched the last majority raised debate to 0.7625, still below the vote (0.7691).
  5. Size the context window to agents x rounds x per-turn budget, thinking tokens included, and give
  the debate and the vote the same thinking budget. With long-thinking models at 16-32K windows, 93-100%
  of some cells'' final-round answers came back empty (one GPQA cell 0.24 at 16K vs 0.82 at 131K); three
  40K-budget thinkers reached 100-112K-token prompts by round 3; and a 4,096-token thinking cap left on
  some reasoning models hurt the single-shot arm more than debate, creating a 3.2-point debate lead that
  became -0.6 at the full budget. 6. For open-ended output with no answer to vote on (reviews, critiques,
  reports), compare against a single pass of equal length, ranked blind by the people who use it, not
  by an LLM judge: authors ranked a single Claude Opus 4.8 pass (mean rank 1.59) above a cross-family
  debate (2.25) and a multi-agent workshop (2.16) that cost 9x and 30x the tokens, and an external AI
  judge agreed with them at only 0.14 and would have reversed the verdict. 7. Measure on held-out items
  with ground truth: paired accuracy of debate against the vote at matched generations, with confidence
  intervals; total tokens including re-read transcripts (3.4x the vote''s, though generated tokens matched
  at 1.06x) and wall-clock (1.6x); empty or truncated final answers; and how often debate changes the
  vote''s answer and in which direction. Re-run on model upgrades.'
detect:
  static: Several agents answer the same question, see each other's answers and revise over rounds, with
    a vote, judge or synthesizer at the end. Flag it when the eval has no majority-vote arm at the same
    number of generations, when more than one exchange round runs, when transcripts can outgrow the context
    window (agents x rounds x per-turn budget, thinking included), when agents get persona prompts, or
    when arms parse answers differently.
  traces: Rounds per item; share of items where the final answer differs from the first-round vote and,
    on items with ground truth, whether the change fixed or broke it; right-to-wrong and wrong-to-right
    flips per round; empty or truncated final-round answers; prompt and total tokens per round.
  evals: Accuracy against a majority vote over the same number of independent generations (same model,
    or the same mixed roster) and against the single pass at full thinking budget, with the same answer
    extractor; for open-ended output, blind ranking by intended users against a single pass of equal length.
  judge: 'Secondary only: an external AI judge agreed with paper authors at 0.14 and would have reversed
    their ranking of debate against a single pass; for open-ended output rank with intended users, and
    balance any judge panel across vendors.'
  probes:
    what: Items where the first-round majority is wrong but at least one agent is right, mixed with items
      where the majority is right.
    construct: Sample N independent answers per item; keep items where the vote is wrong but a correct
      answer is present (the only place debate can beat the vote) and items where the vote is right (where
      debate can only break it); debate must fix the first without breaking the second.
  primary:
  - evals
  - probes
