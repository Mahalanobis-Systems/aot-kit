measure:
- method: experiment
  tier: 4
  how: 'paired eval on held-out items with ground truth: debate (agents x rounds) against a majority vote
    over the same number of independent generations from the same model or the same mixed roster, and
    against the single pass at full thinking budget; identical answer format and extractor in every arm;
    context window at least agents x rounds x per-turn budget; accuracy with paired confidence intervals,
    total tokens including re-read transcripts, wall-clock; for open-ended output, blind ranking by the
    intended users against a single pass of equal length'
- method: monitor
  how: 'per item: rounds run, empty or truncated final-round answers, prompt and total tokens, latency,
    share of items where debate changes the first-round vote; on a regularly audited sample, whether those
    changes fix or break the answer'
