- source: Tomas Havranek, Zuzana Irsova, "Does Multi-Agent Debate Improve AI Feedback on Research Papers?",
    https://arxiv.org/abs/2607.14713
  date: '2026-07-16'
  task: 'Pre-registered, identity-masked comparison of three feedback reports per paper, all rewritten
    to a common length and template: a single pass by one frontier model; mad-research, where two model
    families critique the paper, argue each other''s points in an anonymized round and a fresh instance
    synthesizes; and paper-workshop, a single-model panel that argues contested points. The papers'' authors
    ranked the three by usefulness for improving the paper'
  effect: 'Mean rank (1 = most useful), 44 papers: single pass 1.59 [1.39, 1.82], mad-research 2.25, paper-workshop
    2.16; the single pass was first on 55% of papers and ranked above mad-research on 32 of 44 and above
    paper-workshop on 30 of 44 (contrasts -0.66 [-1.00, -0.32], Holm p=0.005; -0.57 [-0.95, -0.16], Holm
    p=0.026; pre-registered hypothesis that a debate tool would win not supported). Cost per paper: 1
    call, 27,000 tokens, $0.20; about 6 calls, 238,000 tokens, $1.87; about 10 calls, 800,000 tokens,
    $7.20 (tokens 1:9:30). An external AI judge (Gemini) agreed with the authors at rank correlation 0.14
    (95% CI -0.05 to 0.32) and would have ranked paper-workshop first.'
  conditions: Claude Opus 4.8 for the single pass and the workshop, Claude Opus 4.8 with GPT-5.5 for mad-research,
    late June 2026; 55 published or accepted economics meta-analyses, rankings for 44 from 47 authors;
    the workshop ran in a light configuration; reports normalized to about 1,000 words; measures perceived
    usefulness, not correctness; the authors built both debate tools and expected them to win
  direction: contradicts
  measured: true
  locator: §2.2-2.4 Table 1; §4.1 Table 3; §4.2 Table 4; §4.5
- source: 'Leonardo Ferreira, Gardenia Liu, Kaden Zheng, "Beyond Symmetric Agents: Cognitive Diversity
    and Multi-Agent Debate in Small Language Models", https://arxiv.org/abs/2609.35875'
  date: '2026-09-26'
  task: Du et al.-style debate (3 agents x 3 rounds, majority vote at the end) against a generation-budget-matched
    self-consistency control (9 independent samples, majority vote), varying persona, temperature and
    model diversity; mixed-model teams compared with votes over the same rosters in matched proportions
  effect: 'Mean accuracy over 23 models, solo / debate / SC-9: GSM8K 87.9 / 91.2 / 91.0; MMLU 69.9 / 76.5
    / 76.8; CommonsenseQA 72.6 / 78.3 / 80.6 (sampling +2.3, p=0.011); arithmetic 91.2 / 91.5 / 90.6;
    biography claim precision 54.6 / 55.6 / 64.6. GPQA Diamond at full thinking budget 49.1 / 54.3 / 54.9
    (debate - SC-9 = -0.6 [-2.2, +1.0]; a 4,096-token thinking cap left on some reasoning models had shown
    debate +3.2). Debate took 1.6x the wall-clock and 3.4x the total tokens of SC-9 (generated tokens
    1.06x) because each round re-reads peers'' transcripts. 80 three-model teams: debate 88.4 vs roster
    vote 89.4 (-1.04 [-1.61, -0.52]; second seed -0.93); five-agent quads tied (+0.04, +0.56); one cell
    favored debate (weak-duplicated quads on MMLU, +2.80). Rounds, not budget-matched: 84.6 for a vote
    over first answers, 87.2 after one exchange, 87.0-87.5 through five rounds. Mixed teams overturned
    63.7% of wrong round-one majorities against 42.9% for homogeneous ones. Persona prompts cost 2.1 to
    4.4 points. Context overflow left Qwen3.5-27B seven-agent cells 93-100% empty in the final round at
    16-32K windows; fixing it moved debate vs sampling from -1.84 to -0.06 points.'
  conditions: 23 open-weight models from 0.6B to 109B (17B active), eleven vendor families, including
    reasoning models (R1-Distill-Qwen-14B and -32B, Qwen3 and Qwen3.5 thinkers); 100 problems per task
    (biography 40 subjects), seed 42 plus a second-seed slice; paired bootstrap CIs; local serving on
    2x RTX 3090; preprint submitted to ICLR 2027
  direction: contradicts
  measured: true
  locator: §5.1 Table 1; §5.2 Figure 1; §5.3 Table 2; §5.5; Appendix D Tables 10, 13; Appendix G; Appendix
    H Table 18
- source: 'Hyeong Kyu Choi, Xiaojin Zhu, Sharon Li, "Debate or Vote: Which Yields Better Decisions in
    Multi-Agent Large Language Models?", https://arxiv.org/abs/2508.17536'
  date: '2025-08-24'
  task: 'Separates voting from debate: a majority vote over 5 agents'' first-round answers against Decentralized,
    Sparse and Centralized debate after 2, 3 and 5 rounds; models debate as a martingale over agents''
    beliefs; tests updates biased toward the last majority'
  effect: 'Average over seven benchmarks, Qwen2.5-7B-Instruct: vote 0.7691; best debate 0.7377 (Decentralized,
    2 rounds), 0.7050 at 5 rounds; single agent 0.7205. Llama3.1-8B-Instruct: vote 0.7242; best debate
    0.6990 (Sparse, 2 rounds); single agent 0.6203. Qwen2.5-32B GSM8K: vote 0.9433 vs best debate 0.9400.
    Three GPT-4 agents: vote equal or ahead on three of four benchmarks (CommonsenseQA debate 0.8788 vs
    vote 0.8721). Mean per-agent accuracy stayed flat across rounds. Most of the vote''s average lead comes from arithmetic
    (0.99 vs 0.76); on the other six benchmarks vote and best debate average about 0.73 each, debate slightly
    higher on four. Answer extraction reversed the GSM8K
    result: with Du et al.''s parser debate 0.7533 vs vote 0.6700; with a fixed final-answer format debate
    0.8867 vs vote 0.9400. Persona-diverse agents: vote ahead on GSM8K (0.9367 vs 0.8900), debate ahead
    on MMLU professional medicine (0.8419 vs 0.8235). Keeping an answer that matched the last majority
    (MAD-Conformist) raised two-round debate to 0.7625, below the vote.'
  conditions: N=5 agents (3 for GPT-4), simultaneous talk, temperature 1.0, 512-token limit; the vote
    uses only the 5 first-round answers while debate adds 5 generations per round; 100 to 300 items per
    benchmark (arithmetic, GSM8K, MMLU professional medicine and formal logic, HellaSwag, CommonsenseQA,
    HH-RLHF labeling); one run per debate configuration; NeurIPS 2025 spotlight
  direction: contradicts
  measured: true
  locator: §3.2 Table 1; §4 Figure 4, Appendix E; §5.2 Table 2; §6 Tables 3-4; Appendix F Table 9; Appendix
    G Table 10
- source: Hangfan Zhang, Zhiyao Cui, Jianhao Chen, Xinrun Wang, Qiaosheng Zhang, Zhen Wang, Dinghao Wu,
    Shuyue Hu, "Stop Overvaluing Multi-Agent Debate -- We Must Rethink Evaluation and Embrace Model Heterogeneity",
    https://arxiv.org/abs/2502.08788
  date: '2025-02-12'
  task: Five debate frameworks (Society of Minds, Multi-Persona, Exchange-of-Thoughts, ChatEval, AgentVerse)
    at about 6 calls against single-agent, chain-of-thought and self-consistency baselines; then Heter-MAD,
    where each agent call goes at random to GPT-4o-mini or Llama-3.1-70B
  effect: 'Debate frameworks significantly beat chain-of-thought in at most 5 of 36 model-benchmark scenarios
    (13.9%; ANOVA, p<0.05); Multi-Persona in none. Self-consistency scored highest in most cases where it applies
    and used added tokens more efficiently than debate. GPT-4o-mini, CoT vs Society of Minds: MMLU 80.73
    vs 74.73, HumanEval 78.05 vs 68.09, GSM8K 93.60 vs 94.93, MATH 72.87 vs 75.40. Mixing models raised
    every framework over the mean of its two single-model runs (+2.7% to +8.2% relative; Heter-SoM 76.7
    average vs 74.3 on GPT-4o-mini and 69.9 on Llama-3.1-70B), but Heter-AgentVerse (74.0) stayed below
    AgentVerse on GPT-4o-mini alone (75.7). No vote over the mixed models was run.'
  conditions: gpt-4o-mini-2024-07-18, claude-3-5-haiku, Llama-3.1-8B and -70B; MMLU, MMLU-Pro, CommonsenseQA,
    ARC-Challenge, AGIEval, GSM8K, MATH, HumanEval, MBPP; temperature 1; 3 runs; position paper, v1 titled
    "If Multi-Agent Debate is the Answer, What is the Question?"
  direction: mixed
  measured: true
  locator: §3.2 Figure 2, Table 3, Figure 4, Figure 6 (Appendix D); §4.2 Table 4
