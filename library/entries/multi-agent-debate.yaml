summary: 'Let several model instances answer the same question, read each other''s answers and revise
  over one or more rounds, then settle the answer with a vote or a judge. It beats a single answer on
  closed-form reasoning (+3.3 to +6.6 points across 23 open models where tasks had headroom), but cheaper
  baselines get the same gain: a majority vote over as many samples tied or beat it on every task while
  debate took 1.6x the wall-clock and 3.4x the tokens, and on current reasoning models (Gemini 2.5, Qwen3,
  an R1 distill) one call given the same thinking cap matched it on multi-hop questions on average (0.427
  vs 0.420). Mixing mostly frontier models let debate beat a vote over their first answers by 4 to 12
  points, yet it beat the roster''s strongest model alone on only two of five benchmarks, and on paper
  feedback authors ranked a single frontier pass above debate tools that spent 9x and 30x the tokens.
  Debate also has costs beyond tokens: one round made a code-correctness judge panel nearly unanimous
  (39.5% to 95.2%) with accuracy flat and every wrong verdict unanimous, and when debaters read untrusted
  files an injected request led to unauthorized reads or writes on 96.43% of tasks, 1.93 times a single
  agent''s rate. Treat it as an experiment against a vote and the strongest single model at matched compute,
  worth keeping only where the vote is often wrong while some agent has the right answer.'
how: '1. Start from the cheap baselines on your own items: one call with the whole thinking budget (1.b.i)
  and a majority vote over as many independent generations as the debate would spend (agents x rounds)
  from the same model or roster (9.c.ii). At the same thinking cap, one call matched or beat a two-debater
  debate with a judge on multi-hop questions at every cap from 500 tokens up (averages 0.418 vs 0.388
  at 1,000 and 0.427 vs 0.420 at 5,000 over Gemini 2.5 Flash and Pro, Qwen3-30B-A3B and DeepSeek-R1-Distill-Llama-70B)
  while debate spent more of the cap (2,376 vs 635 thinking tokens in one cell); debate was clearly ahead
  only on Gemini 2.5 Pro MuSiQue (0.470 vs 0.419 at 5,000, 0.455 for a longer-thinking single-call prompt).
  Across 23 open models debate with 3 agents and 3 rounds tied or lost to a 9-sample vote on every task,
  never significantly ahead (vote 54.9 vs debate 54.3 on GPQA Diamond, 80.6 vs 78.3 on CommonsenseQA),
  and a vote over 5 first-round answers beat every debate variant on average (Qwen2.5-7B 0.7691 vs at
  best 0.7377), mostly on one arithmetic task (0.99 vs 0.76); on the other six benchmarks the two averaged
  about 0.73 each. Build debate only where these leave headroom. 2. Give every arm the same final-answer
  format and extractor, and parse the last answer an agent states, since debate replies quote their peers''
  answers (9.b.i). With Du et al.''s parser debate beat the vote on GSM8K (0.7533 vs 0.6700); with a fixed
  answer format the vote won (0.9400 vs 0.8867). 3. To use several models, compare any mixed debate against
  the roster''s strongest model alone and against a vote over the same roster at matched generations;
  if the members are unequal, the strongest model alone is the bar. With four-model rosters mixing GPT-5,
  o3-mini, o4-mini, Claude Opus 4 and 4.5, Sonnet 4.5 and older models on 100 problems per benchmark,
  a vote over the members'' first answers fell below the strongest member on all five benchmarks (HLE
  14 vs 29, MMLU-Pro 83.0 vs 86.5); debate recovered part of that (4 to 12 points over the vote) but beat
  the strongest member alone only on MMLU-Pro (87.0 vs 86.5) and GPQA Diamond (80.0 vs 78.0) and trailed
  it on SimpleQA (48.0 vs 52.0), HLE (26.0 vs 29.0) and MATH-500 (70.0 vs 73.5), with agents averaging
  expert and non-expert views. Where generations were matched, across 80 open three-model teams debate
  lost 1.04 points to the roster vote; mixing GPT-4o-mini and Llama-3.1-70B lifted every debate framework
  over the mean of its single-model runs (Society of Minds 76.7 vs 74.3 and 69.9), with no vote over that
  mix. Do not add persona prompts on small models: they cost 2.1 to 4.4 points. 4. If debate stays, run
  one exchange after the first answers and stop, and size the context window to agents x rounds x per-turn
  budget, thinking tokens included, with the same thinking budget for the debate and the vote. In mixed-team
  debate accuracy went from 84.6% (vote over first answers) to 87.2% after one exchange and stayed at
  87.0-87.5% through five rounds; Decentralized debate fell from 0.7377 at two rounds to 0.7050 at five,
  and letting an agent keep an answer that matched the last majority raised debate to 0.7625, still below
  the vote (0.7691). With long-thinking models at 16-32K windows, 93-100% of some cells'' final-round
  answers came back empty (one GPQA cell 0.24 at 16K vs 0.82 at 131K); three 40K-budget thinkers reached
  100-112K-token prompts by round 3; and a 4,096-token thinking cap left on some reasoning models hurt
  the single-shot arm more than debate, creating a 3.2-point debate lead that became -0.6 at the full
  budget. 5. When the panel is a judge or verifier, record the blind first-round votes and act on them
  before any peer exposure: send split votes to an executable check or a person, and never read post-debate
  agreement as confidence. On 291 code-correctness candidates, one round took a seven-provider judge panel
  from 39.5% to 95.2% unanimity while majority accuracy moved from 91.8% to 92.4%; 96.3% of flips followed
  the displayed peer majority, a second look with no peers produced 79.6% of the convergence, and by round
  3 all 22 wrong verdicts were unanimous where 16 of 24 had been split votes before debate; an execution
  check substituted for one judge corrected 8 of 2,037 decisions before debate and changed none after.
  For open-ended output with no answer to vote on (reviews, critiques, reports), compare against a single
  pass of equal length, ranked blind by the people who use it, not by an LLM judge: authors ranked a single
  Claude Opus 4.8 pass (mean rank 1.59) above a cross-family debate (2.25) and a multi-agent workshop
  (2.16) that cost 9x and 30x the tokens, and an external AI judge agreed with them at only 0.14 and would
  have reversed the verdict. 6. If agents read untrusted content or the debate can act, treat every peer
  message as untrusted input: give debaters read-only tools at most, and allow the aggregator only the
  writes the user''s task authorizes, since agreement among agents that read injected content is not authorization
  (10.c.i, 10.b.i). With five GPT-4o agents, one round and write tools held only by the orchestrator,
  an instruction injected into a file the task reads was amplified over a single agent in 11 of 12 comparisons
  on AgentDojo workspace tasks (asked for an unauthorized read, the debate made unauthorized reads or
  writes on 96.43% of tasks, 1.93 times the single agent''s rate), and in one workspace task an injected
  request to read a bill ended in a payment that all five agents endorsed and the orchestrator executed,
  which the single agent did not make. Answer attacks were partly absorbed when the aggregator weighed
  evidence (poisoned retrieval succeeded 0.74 times as often as on one agent); three colluding agents
  of five turned 28.30% of correct answers wrong with GPT-4o and 6.90% with GPT-5, and a compromised orchestrator
  succeeded every time. 7. Measure on held-out items with ground truth: paired accuracy of debate against
  the vote at matched generations, against the single call at full thinking budget and, for a mixed roster,
  against its strongest model alone, with confidence intervals; total tokens including re-read transcripts
  (3.4x the vote''s, though generated tokens matched at 1.06x) and wall-clock (1.6x); empty or truncated
  final answers; how often debate changes the first-round vote''s answer and in which direction; for judge
  panels, the share of wrong verdicts that were split before debate and unanimous after; with tools, unauthorized
  reads and writes under injected content against a single agent. Re-run on model upgrades.'
detect:
  static: Several agents answer the same question, see each other's answers and revise over rounds, with
    a vote, judge or synthesizer at the end. Flag it when the eval has no majority-vote arm at the same
    number of generations, or, for a mixed roster, no arm for its strongest model alone; when more than
    one exchange round runs; when transcripts can outgrow the context window (agents x rounds x per-turn
    budget, thinking included); when agents get persona prompts; when arms parse answers differently;
    when a judge panel's votes are recorded or routed only after judges have seen each other's verdicts;
    or when debaters hold write tools, or the aggregator can make writes the user's task did not authorize,
    while any agent reads untrusted content.
  traces: Rounds per item; share of items where the final answer differs from the first-round vote and,
    on items with ground truth, whether the change fixed or broke it; right-to-wrong and wrong-to-right
    flips per round; unanimity before and after the first exchange; empty or truncated final-round answers;
    prompt and total tokens per round; tool calls outside the task's authorized set by any agent or the
    aggregator.
  evals: Accuracy against a majority vote over the same number of independent generations (same model,
    or the same mixed roster), against the single pass at full thinking budget and, for a mixed roster,
    against its strongest model alone, with the same answer extractor; for judge panels, accuracy and
    the share of errors flagged by split votes against the blind first-round vote; for debates that read
    untrusted content or can act, unauthorized reads and writes under injected content against a single
    agent; for open-ended output, blind ranking by intended users against a single pass of equal length.
  judge: 'Secondary only: an external AI judge agreed with paper authors at 0.14 and would have reversed
    their ranking of debate against a single pass; for open-ended output rank with intended users, and
    balance any judge panel across vendors.'
  probes:
    what: Items where the first-round majority is wrong but at least one agent is right, mixed with items
      where the majority is right.
    construct: Sample N independent answers per item; keep items where the vote is wrong but a correct
      answer is present (the only place debate can beat the vote) and items where the vote is right (where
      debate can only break it); debate must fix the first without breaking the second.
  primary:
  - evals
  - probes
