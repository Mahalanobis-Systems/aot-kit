caveats: 'Most matched-compute evidence is closed-form QA and math on open models from 0.6B to 109B (100
  problems per task in the 23-model study, an unreviewed preprint), where there is an answer to vote on;
  the one frontier-model study measures how useful 44 authors found length-normalized reports, not correctness,
  and its authors built the debate tools. Heterogeneity is contested: mixing GPT-4o-mini with Llama-3.1-70B
  lifted every debate framework over the two models'' average, but no vote over that mix was run and one
  mixed framework stayed below its GPT-4o-mini-only run (74.0 vs 75.7), while the study that did run a
  roster vote found the vote ahead (-1.04 points for debate). Debate results are fragile to evaluation
  details: a different answer parser reversed debate against the vote on GSM8K, and in one study a capped
  thinking budget and context overflow each moved the comparison by about two to four points before correction.
  Biasing agents toward the last majority narrowed the gap to the vote but did not close it (0.7625 vs
  0.7691), and Du et al.''s original gains (GSM 85.0 vs an 81.0 vote) came from a 2023 ChatGPT model with
  an answer parser that, rerun on Qwen2.5-7B, cut the vote''s GSM8K score far more than debate''s (0.6700
  vs 0.9400 for the vote, 0.7533 vs 0.8867 for debate).'
