  effect: 'With the same model, prompt, tools and data access, one agent given 1 to 893 perturbations
    plateaued in steps and tool calls; at 893 it cited 11 references, the distributed agents 711x more.
    Across 20 matched report pairs, each rated by three blinded experts, distributed-agent interpretations
    were preferred in 45 of 60 judgments (75%), the single agent''s in 10 (16.7%), 5 ties. Median recall
