- source: Ethan Yang, Xiangcheng Shi, "Does Multi-Agent Collaboration Pay When Agents Serve Users? Testing
    Agent Scaling in Dual-Control Settings", https://arxiv.org/abs/2610.27655
  date: '2026-10-20'
  task: Compare the stock single agent on τ²-bench with a centralized team built from the same model (an
    orchestrator that plans and talks to the customer, a database agent that alone calls tools, a policy
    advisor) under one completion-token ledger per episode capped at 4x the single agent's 75th-percentile
    spend, pre-registered; plus an uncapped team arm and one agent running the team's plan-and-review
    cycle in one context under the same cap
  effect: Team worse than the single agent in 12 of 13 valid cells (gain interval excluding zero in each)
    and tied in the 13th; weighted mean gain -28 points (95% CI -44 to -12) over the 12 cells of the primary
    fit. On the two cells below 45% single-agent accuracy, where the 45% rule predicts a team gain, it
    lost 13 and 22 points, and without a ceiling at best drew level at 5.5x the single agent's median
    token spend. Exhausted episodes carried 74% of the mean loss (-22.4 of -30.5 points); the team did
    not detectably reduce wrongful database writes. Dollar cost 1.4x to 3.1x the single agent per cell;
    the single agent was more accurate and cheaper in 11 of 12 priced cells. One agent running the plan-and-review
    steps in one context at the same ceiling did not differ detectably from the stock agent, and the team
    lost to it on both cells below 45% (e.g. 12.0% vs 36.0%).
