  direction: supports
  measured: true
  locator: 06-26 post, "Context Quarantine"
- source: Lance Martin, "Agent Design Patterns", https://rlancemartin.github.io/2026/01/09/agent_design/
  date: '2026-01-09'
  task: Fan out independent checks to isolated sub-agents
  effect: Claude Code team "uses sub-agents in code review to independently check different possible issues.
    A similar map-reduce pattern can be used for tasks like updating lint rules or migrations."
  direction: supports
