    on Commit0-Lite and 55.5 on PaperBench (single agent 57.2). 8 engineers scored lower than 4 on Commit0-Lite.
    CAID used 168.3 and 313.3 iterations against the single agent''s 66.8 and 84.5; doubling the single
    agent''s limit to 200 changed little or lowered scores. A single agent first and CAID after it: PaperBench
    66.8 at 3883.9 s and cost 9.7 (Claude Sonnet 4.5). Authors: "wall-clock runtime is not substantially
    reduced despite parallel execution"; integration stays sequential and test-gated.'
  conditions: OpenHands agent SDK v1.11.0; Claude Sonnet 4.5, MiniMax 2.5, GLM 4.7; Commit0-Lite (16 repositories,
    success only if all tests pass) and PaperBench Code-Dev (judged by gpt-5-mini); single agent 100 iterations,
    manager 50 and each engineer 80, two rounds; one run per configuration, one-sided paired t-tests across
