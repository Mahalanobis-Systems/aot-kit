  date: '2026-10-18'
  task: Build one project from one spec with a plan written as a task graph (each task lists the files
    it owns, the interfaces it consumes and produces, and the tests it must pass), run tasks that share
    no files and no dependencies at the same time, and enforce rules with hooks (the coordinator cannot
    edit project code; tests run in the background)
  effect: 'Static site generator plus spreadsheet engine, 177 hidden tests: an earlier build averaged
    25.1 min over three runs (21.4 / 23.2 / 30.5) against 33.6 min for the stock superpowers workflow
    (21.2 / 31.9 / 47.6), 25% less, 177/177 every run. The latest build ran once in 16.1 min with 21 agents,
    up to 18 at once, 177/177; the author''s "52% less time" compares this one run with the stock three-run
    mean. On a smaller project (89 tests): 8.8 vs 34.4 min, dispatching 10 agents up to five at once against
