- method: production-test
  tier: 4
  how: 'A/B the team against one agent at the same token or cost budget (and one agent running the same
    plan-and-review steps where feasible), several runs per arm, split by task shape (independent breadth
    vs sequential): success, tokens and cost, wall-clock, conflict and rework rate (merge conflicts, overwritten
    or redone work, parts that pass alone but fail together) and sub-agent reports later found wrong'
