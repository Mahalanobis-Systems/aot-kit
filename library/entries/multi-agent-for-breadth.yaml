    detection:
      static: An orchestrator that spawns workers at runtime and synthesizes results; a task queue.
      traces: Delegation tree; worker count per task; synthesis step present.
      evals: End-to-end quality on open-ended tasks; cost per task.
      judge: Rate decomposition and synthesis quality.
      probes:
