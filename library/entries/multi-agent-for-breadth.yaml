  direction: supports
  measured: false
  locator: Sec 11.2.3; Sec 11.5; Sec 11.7; Sec 11.9
- source: Drew Breunig, "How Long Contexts Fail / How to Fix Your Context", https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
