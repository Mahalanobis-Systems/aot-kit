- source: Rishabh Mediratta, Lingyun Xiao, Peter Stone, Joydeep Biswas, Elias Stengel-Eskin (UT Austin),
    "Decentralized Multi-Agent Coordination and Communication in Shared Codebases", https://arxiv.org/abs/2611.00314
  date: '2026-10-30'
  task: Give two coding agents separate requirements on one repository (contradictory pairs that must
    edit the same code incompatibly, complementary pairs that must share an interface) and compare one
    agent holding both requirements, one agent delegating each requirement to a sub-agent, serial hand-offs,
    and parallel agents unaware or aware of each other, with or without a message channel; parallel edits
    merged by concatenation, git merge or a model reconciler, best of the three counted
  effect: 'Claude Code with Claude Opus 4.8, joint pass rate (cost relative to the single agent), contradictory
    / complementary: single agent 62% (1.00) / 86% (1.00); lead delegating to two sub-agents 58% (1.58)
    / 77% (1.18); one hand-off A then B 54% (1.18) / 77% (1.12); parallel unaware 16% (1.17) / 57% (1.14);
    parallel aware 26% (1.14) / 60% (1.21); parallel with messages 20% (1.42) / 63% (1.43); parallel with
    sync points 22% (1.63) / 71% (1.43). Six open-weight configurations, mean: single agent 60% / 72%,
    parallel unaware 19% / 53%. In 58% of contradictory parallel failures each half passed its own tests
    but no combination passed; 53% of complementary failures merged but diverged on a name, signature
    or data shape; 92% of single-agent failures were competence failures. About a third of messages were
    never read and 21-23% were read before the recipient''s first edit. When agents were given each other''s
    requirement, 85% of contradictory conversations assigned an owner to the contested code, conflicts
    fell from 67% to 18% of runs, and runs with an owner passed 61% against 29%.'
  conditions: 'ParallACT: 155 instances from 11 repositories built on SWE-Bench Pro (85 contradictory,
    70 complementary; part model-generated); Claude Opus 4.8 (high effort) on the 85 built on v1 (50 contradictory,
    35 complementary); Claude Code and Codex with Qwen3.8 Flash Next, DeepSeek V4 Flash and GLM 5.3 Flash
    on all 155; requirements from separate principals, built to conflict or interlock; cost = input +
