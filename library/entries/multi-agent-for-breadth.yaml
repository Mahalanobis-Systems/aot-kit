caveats: 'Most gains are not compute-matched: the +90.2% research result came at about 15x a chat''s tokens,
  and the same vendor found token usage alone explained 80% of the variance on a browsing eval; at a matched
  budget the gain held mainly on decomposable tasks, in one study whose coding cells had 20 tasks (intervals
  of about 20 points) and whose 45% capability rule did not transfer to customer-service conversations.
  That contradicting study''s team planned without seeing the tool schemas (a deviation its authors label),
  and the coding evidence comes from purpose-built benchmarks (conflicting requirements from separate
  principals; 16 library repositories and a set of papers, one run each) and one practitioner''s own plugin
  on one project, so effect sizes will differ on your tasks. Speed gains need the parts to run truly in
  parallel: sequential, test-gated merges made a coordinated coding team slower than one agent, and the
  25% faster coding build was measured against a workflow that dispatched sub-agents one at a time, not
  against a single agent.'
