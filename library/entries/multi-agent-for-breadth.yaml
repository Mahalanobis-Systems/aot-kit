evidence:
- source: Jeremy Hadfield, Barry Zhang, Kenneth Lien, Florian Scholz, Jeremy Fox, Daniel Ford (Anthropic),
    "How we built our multi-agent research system", https://www.anthropic.com/engineering/multi-agent-research-system
  date: '2025-06-13'
  task: Orchestrator-worker with capable lead, cheaper parallel subagents
  effect: '"a multi-agent system with Claude Opus 4 as the lead agent and Claude Sonnet 4 subagents outperformed
    single-agent Claude Opus 4 by 90.2% on our internal research eval" (n not given; "excel especially
    for breadth-first queries"). Cost: "agents typically use about 4x more tokens than chat interactions,
    and multi-agent systems use about 15x more tokens than chats". Poor fit: "domains that require all
    agents to share the same context or involve many dependencies between agents ... most coding tasks".
    Why it works: "Multi-agent systems work mainly because they help spend enough tokens to solve the
    problem"; on BrowseComp "token usage by itself explains 80% of the variance" (with the number of tool
    calls and model choice, three factors explain 95%).'
  direction: supports
  measured: true
  locator: Benefits of a multi-agent system; Architecture overview for Research
