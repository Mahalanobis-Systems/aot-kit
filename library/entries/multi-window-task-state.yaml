caveats: 'Most measured gains come from deep-research and long-horizon coding systems built around their
  authors'' own memory design, often on one model and small samples (one ablation used 10 queries, another
  does not state its run count), and no controlled study isolates a plain progress file under a forced
  reset. Model-written notes are not free memory: Cognition found them incomplete, Vending-Bench agents
  wrote notes they never read, and a stale written standard led agents to the worse form on every contested
  decision, so read-back and upkeep must be enforced. The need depends on the model: Anthropic needed
  resets with handoff files for Sonnet 4.5 but dropped them for Opus 4.5, so measure per model and again
  after an upgrade.'
