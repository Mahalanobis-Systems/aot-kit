# 4.b.iii: Keep plan, progress and results in files when work outlives one context window
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 4.b.iii
legacy_id: P21
slug: multi-window-task-state
name: Keep plan, progress and results in files when work outlives one context window
kind: pattern
status: card
tiers:
- tier: 4
  why: it moves task state outside the context window
  proposed: true
levers:
- state
domains:
- planning
evidence_domains:
