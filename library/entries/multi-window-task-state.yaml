caveats: 'Most measured gains come from systems built around their authors'' own memory design, often
  on one model and small or synthetic samples (one ablation used 10 queries and the BrowseComp check 150
  questions on one backbone, and the structured-handoff and state-tracking results come from synthetic
  tasks), and no controlled study isolates a plain progress file under a forced reset. Model-written state
  is not free memory: Cognition found notes incomplete, Vending-Bench agents wrote notes they never read,
  a model rewriting its own state ledger dropped entries until it answered at chance, a stale written
  standard led agents to the worse form on every contested decision, and a fact corrupted before a reset
  was never caught, so let code apply updates, keep each fact''s source and enforce read-back. The need
  depends on the model and the history: Anthropic needed resets for Sonnet 4.5 but not Opus 4.5, a 120B
  reasoning reader gained 0.04 from explicit state at 256 events and 0.12 at 1,024, a checkpoint-and-reset
  prompt cost a 7B model 3.9 points, and the full history beat a compact handoff where it fit, so measure
  per model and again after an upgrade. The fresh-context result comes from optimization tasks with a
  scored objective, where it won on 6 of 11 tasks, and under a stricter status check structured handoffs
  scored below recent transcripts for five of six receivers.'
