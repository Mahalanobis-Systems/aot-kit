categories:
- memory.resume
- memory.externalize
summary: 'When a task spans context resets (compaction, a truncation limit, a new session), have the agent
  keep what the next window needs in files and read them back at the start of each window: the plan and
  a progress list, decisions and open items, intermediate results too large to hold in context, and for
  coding a structured test list and an init script. In measured studies, mostly of deep-research and long-horizon
  coding agents, state kept outside the history beat a growing or compacted one: Anthropic''s memory tool
  plus context editing gained 39% on agentic search against 29% for context editing alone. The limits:
  model-written notes were incomplete or never read back, a stale file misled agents more than no file,
  and a stronger model needed resets less. Within one window this adds nothing a re-injected task list
  (7.b.iv) doesn''t.'
how: '1. Start from the harness as it is (compaction or truncation only) on tasks that really run past
  one window, and log what breaks after each reset: work redone, decisions or user constraints lost, work
  declared done too early. 2. In the first window, before real work, have the agent create the state files:
  a structured list of features or tests (JSON, every item failing, with an instruction that items are
  never removed or rewritten, only marked passing), a free-text progress log, a decisions and open-items
  file that also holds the user''s constraints, and for coding an init script that starts the app and
  runs a smoke test; commit them to git. 3. Write large intermediate results (sources, query results,
  documents, logs) to files and keep only the path and a one-line note in context. 4. Start every later
  window with a fixed resume step written into the prompt: read the progress log, the decisions file,
  the test list and the git log, run the init script and the smoke test, then take one open item. Do not
  leave reading optional; agents write notes they never read. 5. Update at fixed points: when an item
  passes an end-to-end check, mark it, append to the log and commit; before a reset, write the handoff.
  Rewrite the files in place so they describe the present and delete stale entries, because agents follow
  a written file over the code. 6. Keep harness-side safety nets instead of relying on model-written notes
  alone: keep compaction or the harness''s own state capture, re-append the constraint list after every
  compaction, and choose a fresh window or compaction per model. 7. Measure with paired runs that force
  a reset midway, with and without the files and the resume step: completion, steps redone, constraint
  violations after the reset, tokens and wall time, per model; re-run after a model change.'
detect:
  static: A plan or todo file, a progress log, a decisions and open-items file, and for coding a structured
    test list and an init script, kept outside the context window, plus a start-of-window step that reads
    them back.
  traces: Context resets followed by re-exploration or redone steps; notes written but never read back;
    user constraints or decisions violated after compaction; work declared done after a reset; state files
    older than the code they describe.
  evals: Completion rate and redone work on tasks longer than one window, with a reset forced midway.
  probes:
    what: Tasks longer than one context window.
    construct: A multi-hour coding task with a test suite; force a reset midway.
  primary:
  - probes
