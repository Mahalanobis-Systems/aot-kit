summary: 'Keep a long task''s plan, progress, decisions and large results in files, and start every new
  context window by reading them back. In measured studies, mostly of deep-research, coding and autoresearch
  agents, state kept outside the history beat a growing or compacted one: Anthropic''s memory tool plus
  context editing gained 39% on agentic search against 29% for context editing alone, a checkpoint of
  progress and verified facts plus a self-chosen reset took Claude Sonnet 4 from 22.7% to 30.7% on 150
  BrowseComp questions with the same tools, and fresh contexts over the same workspace beat one compacted
  session at equal compute (0.55 against 0.45 normalized score). Form matters: a structured handoff beat
  a narrative summary of the same length (52.1% against 42.8% of tasks fully completed, GPT-5.4), and
  state updated by code answered access questions at 0.80 where a ledger the model rewrote itself fell
  to chance. The limits: the full history still beat a compact handoff where it fit, a strong reasoning
  model needed explicit state only for long histories, a 7B model lost accuracy with the extra tools,
  and stale, wrong or unread notes misled agents, so enforce read-back, let code apply updates, measure
  per model, and within one window use a re-injected task list (7.b.iv) instead.'
how: '1. Start from the harness as it is (compaction or truncation only) on tasks that really run past
  one window or carry a long history, and log what breaks after each reset: work redone, decisions or
  user constraints lost, work declared done too early. Where the full history still fits, keep it as the
  baseline to beat: in one study it beat a compact handoff (57.9% against 52.1% of tasks fully completed
  with GPT-5.4), and a 120B reasoning model read a 256-event log almost as well as the extracted state
  (0.95 against 0.99). 2. In the first window, before real work, have the agent create the state files:
  a structured list of features or tests (JSON, every item failing, with an instruction that items are
  never removed or rewritten, only marked passing), a progress log, a decisions and open-items file that
  also holds the user''s constraints, and for coding an init script that starts the app and runs a smoke
  test; commit them to git. Keep the handoff structured (facts, commitments, completed actions, remaining
  work), not a narrative: at the same length it fully completed 52.1% of tasks against 42.8% (GPT-5.4).
  Record next to each verified fact where it came from (file, URL, test), since a fact corrupted before
  a reset was never caught afterward. 3. Write large intermediate results (sources, query results, documents,
  logs) to files and keep only the path and a one-line note in context. 4. Start every later window with
  a fixed resume step written into the prompt: read the progress log, the decisions file, the test list
  and the git log, run the init script and the smoke test, then take one open item. Do not leave reading
  optional; agents write notes they never read. 5. Update at fixed points: when an item passes an end-to-end
  check, mark it, append to the log and commit; before a reset, write the handoff. Have code, not the
  model, apply changes to structured state: keep one keyed entry per item or constraint that the model
  may update but not drop, and retire an entry only by an explicit rule (done, superseded). A ledger the
  model rewrote itself dropped entries it judged inactive and fell to chance (0.50), against 0.80 when
  the model only parsed each event and code applied it. Keep free-text files describing the present and
  delete stale ones, because agents follow a written file over the code. 6. Keep harness-side safety nets
  instead of relying on model-written notes alone: keep compaction or the harness''s own state capture,
  re-append the constraint list after every compaction, and choose a fresh window or compaction per model.
  Where you reset, do it at task boundaries or on a fixed schedule rather than waiting for a stall: fresh
  contexts over the same workspace beat one compacted session at equal compute (0.55 against 0.45 normalized,
  better on 6 of 11 tasks), and a plateau trigger did not fire before the budget ran out in 15 of 25 runs.
  Check weaker models first: a checkpoint-and-reset prompt gained 4.8 to 8.0 points with Claude Sonnet
  4 but cost a 7B model 3.9 points. 7. Measure with paired runs that force a reset midway, with and without
  the files and the resume step, and against the full history where it fits: completion, steps redone,
  completed actions repeated, constraint violations after the reset, tokens and wall time, per model and
  with several runs; add a copy that corrupts one state entry before the reset; re-run after a model change.'
detect:
  static: A plan or todo file, a progress log, a decisions and open-items file, and for coding a structured
    test list and an init script, kept outside the context window, plus a start-of-window step that reads
    them back.
  traces: Context resets followed by re-exploration or redone steps; notes written but never read back;
    entries that vanish from the state between windows; completed actions repeated after a reset despite
    a completion record; user constraints or decisions violated after compaction; work declared done after
    a reset; state files older than the code they describe.
  evals: Completion rate and redone work on tasks longer than one window, with a reset forced midway,
    against carrying the full history where it fits.
  probes:
    what: Tasks longer than one context window.
    construct: A multi-hour coding task with a test suite; force a reset midway, and in a second copy
      corrupt one state entry before the reset.
  primary:
  - probes
