impact:
  quality:
    effect: improves
    size: medium
    when: 'tasks past one window or with long histories: memory tool plus context editing +39% against
      +29% (Anthropic, Sep 2025); checkpoint plus reset 22.7% to 30.7% on BrowseComp with Claude Sonnet
      4, but 17.5 to 13.6 on GAIA for a 7B model (Zhu, Oct 2026); fresh contexts over the same workspace
      0.55 against 0.45 for one compacted session at equal compute (Cai, Oct 2026); a report rewritten
      into each rebuilt context +12.7 (o3) and +19.2 (DeepSeek-V3.1) points on BrowseComp over ReAct (Chen,
      Nov 2025); structured handoff 52.1% against 42.8% for a narrative summary, full history 57.9% (Li,
      Oct 2026); code-applied state 0.80 against 0.50 for a model-kept ledger, and only +0.04 for a 120B
      reasoning reader at 256 events (Guo, Nov 2026); without todo, checklist and log files 52.76 to 48.69
      RACE on 10 queries (Zhu, Feb 2026); model-written notes alone degraded Devin (Cognition, Sep 2025);
      a stale convention file cut better-form decisions from 33% with no file to 0% (Mohammadi, Aug 2026)'
    basis: evidence
  cost:
    effect: improves
    size: medium
    when: 'where the state replaces a growing history: 314K against 1,078K input tokens per GAIA trajectory
      at about the same accuracy (20.4% against 19.4%), peak context 14.3K against 30.6K, for an 8B model
      (Zhu, Oct 2026); 1.3k against 28.1k tokens per decision on a 1,024-event log, though building the
      state costs one parser call per event (Guo, Nov 2026); 61% and 22% fewer tokens on tau3-Bench Airline
      and Retail (Li, Sep 2026); file I/O under 0.03% of wall time (Zhu, Feb 2026); resets add token overhead
      (Rajasekaran, Mar 2026) and an agent sometimes spent more tokens writing summaries than solving
      the problem (Cognition, Sep 2025), both unmeasured'
    basis: evidence
  performance:
    effect: mixed
    size: small
    when: 21.8 against 45.3 model calls per GAIA trajectory with checkpoints and resets for an 8B model
      (Zhu, Oct 2026); with a state-recovery memory, minutes per DeepSWE task rose from 42.0 to 54.2 under
      one harness and fell from 103.8 to 75.3 under another (Xu, Oct 2026); resets add latency (Rajasekaran,
      Mar 2026)
    basis: evidence
  security:
    effect: none
    basis: assessment
  governance:
    effect: improves
    size: medium
    when: 'constraints and permissions kept outside the summary: a constraint registry appended after
      compaction raised compliance by 39.5 to 42.6 points, and after compaction an agent deleted emails
      without approval in 30 of 100 sessions against none before (Wang, Jul 2026); permission state applied
      by code answered whether a service may act at 0.80 to 0.89 against 0.64 to 0.73 for the same readers
      reading the full log with a reasoning trace, while a ledger the model kept itself dropped components
      and fell to chance (Guo, Nov 2026)'
    basis: evidence
  brand:
    effect: none
    basis: assessment
  primary:
  - quality
measure:
- method: experiment
  tier: 4
  how: 'paired runs on tasks longer than one window, forcing a reset (or capping the window) midway: the
    harness as is against the same harness with state files and a fixed resume step, and against carrying
    the full history where it still fits; completion, steps redone and completed actions repeated after
    the reset, constraint violations after the reset, tokens and wall time, per model with several runs;
    add a copy in which one state entry is corrupted before the reset; re-run after a model change'
- method: monitor
  how: 'per reset: whether the first actions read the state files, steps redone, completed actions repeated,
    items marked done that fail their test, entries that vanish from the state between windows, state
    files older than the code or plan they describe, and the share of tokens spent writing notes'
