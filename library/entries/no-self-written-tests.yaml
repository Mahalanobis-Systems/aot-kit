# 9.c.i: Drop ad-hoc test-writing prompts; tell test-heavy models not to write tests
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 9.c.i
legacy_id: T51
slug: no-self-written-tests
name: Drop ad-hoc test-writing prompts; tell test-heavy models not to write tests
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the agent does, so quality must be checked
levers:
- control-flow
domains:
- code-generation
evidence_domains:
- code-generation
categories:
- verification.spend
summary: 'Telling a coding agent to write its own tests mostly buys cost, not fixes, so drop the instruction
  and tell test-heavy models not to. In one prompt study on SWE-bench Verified, asking GPT-5.2 for tests added
  19.8% output tokens and resolved the same 359 of 500 tasks, and telling two test-heavy models not to write
  tests cut input tokens 33 to 49% for a non-significant loss of 1.8 to 2.6 points. The checks agents run for
  themselves are weak: in another study 46.0% of the passing checks one agent ran also passed on the unpatched
  code. Keep a test the patch must ship with. A test written before the fix, shown to fail and hardened against
  wrong fixes is a different change, with its own gains and costs.'
how: '1. Start from the current agent''s traces as the baseline: measure the share of API calls and tokens
  spent writing tests and, separately, running them; whether new test files hold assertions or only print values;
  and, for each check that passed after the agent''s first edit, whether it also passes when replayed on the
  unpatched code. In one study of GPT-5.6-sol on 110 tasks, 46.0% of replayable passing checks also passed
  on the unpatched code, and 23.8% of runs submitted with no other kind of passing evidence. 2. Remove instructions
  that ask for tests or reproduction scripts, including testing cues in the scaffold''s default prompt. 3.
  For models that write tests in most tasks (four of six models in one study did so in 83.0% to 98.6% of tasks),
  add an instruction not to write new test files or scripts: on SWE-bench Verified this cut input tokens 49.0%
  and 32.9% and API calls 35.4% and 24.5% for Kimi K2 Thinking and DeepSeek v3.2 Reasoner, for a non-significant
  loss of 2.6 and 1.8 points. Don''t add a test request to a model that rarely writes tests: GPT-5.2 then wrote
  tests on 322 more of 500 tasks, used 19.8% more output tokens and resolved the same 359. 4. Keep a test where
  it is part of the deliverable rather than a self-check: if reviewers expect a fix to ship with a fail-to-pass
  test, ask for it in the patch. Code owners reviewing Google''s AI-generated fixes strongly preferred that,
  and asking Gemini 2.5 Pro for a fix plus a reproduction test gave plausible fixes for a similar number of
  bugs as asking for the fix alone. 5. Measure with paired runs on the same tasks, with and without the instruction,
  and several runs per arm, because single runs move many tasks both ways (83.2% of tasks kept their outcome
  in one study while net changes were at most 13 of 500): resolve rate with an exact McNemar test, input and
  output tokens, API calls and wall-clock per task.'
detect:
  static: a prompt or scaffold default (such as a reproduce-the-issue step) that tells the agent to write tests
    or scripts as a self-check
  traces: test files written with print statements and no assertions; test writing and running over about 20%
    of tokens; passing checks that also pass when replayed on the unpatched code; runs that submit right after
    their own new test passes
  evals: resolve rate unchanged between runs with and without agent tests
impact:
  quality:
    effect: none
    size: small
    when: prompting for or against agent tests changed resolve rate by 0 to 2.6 points on SWE-bench Verified,
      none significant (Chen, Feb 2026)
    basis: evidence
  cost:
    effect: improves
    size: medium
    when: told not to write tests, two test-heavy models used 32.9% and 49.0% fewer input tokens and 14.0%
      and 43.1% fewer output tokens; asked to, GPT-5.2 used 9.0% more input and 19.8% more output tokens (Chen,
      Feb 2026)
    basis: evidence
  performance:
    effect: improves
    size: small
    when: API calls fell 24.5% and 35.4% when test-heavy models were told not to write tests and rose 5.5%
      when GPT-5.2 was asked to (Chen, Feb 2026); no study timed the change itself
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: degrades
    size: small
    when: 'if suppression also drops the test a fix should ship with: code owners reviewing Google''s AI-generated
      fixes strongly preferred fixes with a fail-to-pass reproduction test, and 39% of human-written null-pointer
      fixes there changed a test (Cheng, Jan 2026); keep such tests in the patch'
    basis: evidence
  brand:
    effect: unknown
  primary:
  - cost
measure:
- method: experiment
  tier: 3
  how: 'paired runs on the same tasks with and without the test instruction, several runs per arm: resolve
    rate with an exact McNemar test, input and output tokens, API calls and wall-clock per task'
- method: monitor
  how: 'in production traces: the share of tokens and API calls spent writing and running tests, logged separately;
    new test files with prints and no assertions; the share of passing checks that also pass when replayed
    on the unpatched code; runs that submit right after their own new test passes'
