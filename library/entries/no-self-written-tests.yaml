caveats: 'The case for dropping tests rests on one prompt study (mini-SWE-agent on SWE-bench Verified, one
  run per arm, two models per direction, counting only files named like tests), and the share of weak checks
  comes from one model family on 110 tasks. It covers ad-hoc self-checks only: in 2026 studies, tests made
  into real checks (written before the fix, shown to fail on the unpatched code, then hardened against wrong
  fixes or written by a separate strong model and frozen) raised resolve rate, at about twice the cost per
  issue. Apart from 120 internal bugs at Google, all results come from Python issue-resolution benchmarks.'
