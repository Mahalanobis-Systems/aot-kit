- source: 'Wei Zhang, Lirong Xiang, Charles Fleming (University of Illinois Urbana-Champaign, Cornell
    University, Cisco), "Know When to Escalate: Critic-Guided Adaptive Execution for Cloud-Local Embodied
    Agents", https://arxiv.org/abs/2610.30587'
  date: '2026-10-22'
  task: 'CARE: a local model acts by default; a critic scores the local proposal (every step on Habitat,
    every third step elsewhere) and hands control to a cloud model when its confidence falls below an
    escalation threshold, keeping it there until confidence rises above a higher return threshold; a shared
    handoff memory (recent transitions plus a summary of verified progress and open failures) goes to
    whichever model acts, and the cloud action is generated speculatively alongside the critic. Compared
    with local-only, cloud-only, their ReAct variants, a fixed cloud-planner and local-executor hierarchy
    (Hi Robot), per-step routing (a RouteLLM adaptation) and feedback-triggered cloud replanning (AdaPlanner),
    and with random and periodic hand-offs at matched cloud use'
  effect: 'Success / median episode time / median time between actions, cloud-only vs CARE: Habitat 91.7%
    / 49.62 s / 4.61 s vs 92.5% / 32.36 s / 0.80 s; EmbodiedBench 80.0% / 40.07 s / 4.41 s vs 75.0% /
    37.28 s / 3.14 s; VLABench 85.0% / 23.67 s / 2.47 s vs 87.5% / 22.62 s / 1.31 s, with the cloud making
    24.4% to 34.4% of executor requests. Local-only 64.2%, 40.0%, 71.2%; RouteLLM-style routing 55.8%,
    53.8%, 73.8%; the best collaboration baseline 6.3 to 18.3 points below CARE. On Habitat instances
    local-only failed: at about 20% cloud use CARE, random and periodic hand-offs were similar; at 30-50%
    CARE 88.4% to 93.0% vs 74.4% to 79.0%; periodic needed over 70% cloud use to reach 93.0%. Handoff
    memory at 20 recorded escalation states: full 100%, episodic only 90%, observation only 75%, none
    25%. Critic evaluation added 0.15 to 2.45 s across latency percentiles.'
  conditions: Claude Sonnet 4.6 as cloud planner and executor; one Qwen3.6-35B-A3B checkpoint as local
