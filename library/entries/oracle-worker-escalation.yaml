summary: 'Let a cheap model do the work and call an expensive one only when a trigger fires: a cascade
  escalates when the cheap answer looks unreliable or fails a check, a router picks the model before the
  call, and an advisor or critic brings a stronger model in mid-task. It pays when the trigger really
  separates the cheap model''s failures: two-model cascades beat the best single model at the same budget
  by 2.1 to 8.2 points on average across budgets, a learned consult policy recovered 44% to 81% of the
  gap to the strong model on three agent benchmarks at 34.5% to 48.1% of its cost, and a small grader''s
  stated confidence sent 7% of decisions to the large model for 76% lower cost and 61% lower median latency
  (kappa 0.802 vs 0.819). Speed gains need a cheap model that is actually faster and rare escalation:
  a strong model reviewing a 4B model''s drafts only at state-changing actions came within a point of
  it on two customer-service benchmarks in 41% to 54% of its wall time, but with cloud models on MCP-Atlas
  it scored 8.9 to 12.9 points lower with no time saved. The trigger is the weak link: none of six commercial
  routers beat a random mix of two well-chosen models at matched cost, escalating a web agent''s least
  self-consistent actions did worse than escalating at random, a third to fifth model in a cascade added
  at most 0.43 points, and in Anthropic''s tests the advisor bought about what more effort does (1.7 points
  for 2.1 times the cost on coding).'
how: '1. Start from single-model baselines on your own tasks: the cheap and the strong model alone, each
  across effort settings (the strong one at low effort too), priced per completed task and timed (median
  and p95), plus a random mix of the two at the same spend. A pairing must beat that whole curve: Anthropic''s
  coding advisor pairing (90.1% at $2.92 per attempt) landed on its executor''s own effort curve (88.4%
  at $1.38 on high, 91.1% at $4.11 on xhigh), and no commercial router beat the random mix. Picking one
  model per call site statically is 1.b.i. 2. If the outcome is checkable (tests, a schema, a sound verifier),
  try the simplest cascade first: run cheap and escalate only the failures. Opus 5.5 at low effort with
  its failures re-run at high solved about 97% for about $0.17 a task, against 95.3% for $0.29 with everything
  at high, a figure computed task by task from existing runs rather than run end to end. A checker that
  passes bad work lets those failures through, so audit it on a gold sample (9.c.iii). 3. Use two models,
  not a ladder: allowing three to five models did not raise mean test accuracy in 118 of 135 comparisons
  (at most +0.43 points), and even with true query difficulty known a two-model roster was within 1 point
  of the best roster of any size. Take the cheap model from the cost-accuracy frontier; in one 26-model
  set it trailed the strongest by 1.6 points at a 96% discount. 4. Measure the trigger before trusting
  it, against escalating at random at the same rate and cost. For a confidence-score cascade, check how
  well the score separates the cheap model''s errors from the strong model''s: log-probability scores
  reached AUROC 0.63 to 0.80 for the cheap model''s correctness yet beat random escalation at the same
  escalation rate (not the same cost) by only about 0.3 points on MATH, and in a computer-use agent token-probability
  uncertainty predicted subgoal failure at AUROC 0.488 to 0.540. A confidence the cheap model states in
  its answer (a 0 to 100 field after its verdict, no extra call) can work if it varies: in one grading
  task Claude Haiku 4.5''s (AUROC 0.857, 13 distinct values) sent 7% of decisions to Claude Opus 4.6 for
  kappa 0.802 against 0.819 for Opus alone, while Gemini 3.1 Flash-Lite''s took 3 values and its cascade
  could not close the gap at any threshold. Do not assume sample agreement works in agents: escalating
  a web-shopping agent''s least self-consistent actions succeeded less often than escalating at random
  (4.5% against 16.0% at a 20% escalation budget, 41.0% against 50.5% at 60%), while a probe trained on
  where the weak and strong models'' actions differ beat random (21.0% and 76.5%). For a pre-call router,
  check it against the random two-model mix at the same spend (commercial routers trailed it by 1.0 to
  10.5 points). 5. In agents, decide inside the run on execution evidence and workflow phase rather than
  up front or on the agent''s own sense of being stuck, and cap consults. On OSWorld, escalating on runtime
  uncertainty scored 71.65% against 59.92% for routing at the start (not cost-matched). On SWE-bench Verified,
  a learned policy at 2.78 consults per episode solved 48.0%, fixed triggers (before committing to an
  approach, before finishing, on stalls) 41.3%, random placement at similar volume 28.0%, and the orchestrating
  model left to choose (not volume-matched) made 0.41 consults per episode, 77% of them in the last third;
  on Terminal-Bench the learned policy only tied the fixed triggers (34.7% each). If a model decides when
  to escalate, make it a separate, capable judge: on Terminal-Bench a GPT-5.4-mini judge reached 71.91%
  where the 9B worker judging itself reached 50.56% (cloud model alone 74.16%). Once a critic hands control
  to the strong model, keep it there until the critic clears a higher return threshold, and give both
  models one shared record of verified progress and recent failures: an embodied agent run this way stayed
  within 5 points of the cloud model alone while the cloud made 24% to 34% of its action requests, beat
  random and periodic hand-offs on tasks the local model failed alone at 30% to 50% cloud use (88.4% to
  93.0% against 74.4% to 79.0%; no difference at about 20%), and resumed 20 recorded hand-off states successfully
  every time with the shared record against 25% without it. Where latency matters, let the cheap model
  draft and run read-only calls, hold its first state-changing action for the strong model to review in
  one pass, accept the longest valid prefix by meaning and repair the first bad step: within 1 point of
  the strong model on tau2-Bench in 41% to 54% of its wall time, while exact-match review dropped Retail
  to 82.5%; in coding, cloud help on write and edit steps tracked success most. Do not re-run whole agent
  tasks on the strong model after a failed self-check: that cascade cost $59.68 against $45.90 for the
  strong model alone. 6. Watch the consult rate and whether the advice is used. Sonnet 5.5 at its default
  effort never consulted on 20 SWE-bench Pro problems; a pairing that consulted on most tasks at default
  effort consulted on few once its effort was lowered, and then scored below the executor alone; with
  the advisor tool attached but never called, GPQA cost 12% to 25% more (its definition is about 1,000
  prompt tokens per request); ignored advice made up 58% of the learned policy''s remaining SWE-bench
  failures. A consult that fires on most tasks can cost more than the strong model alone (1.8 times on
  chart reading), and escalating on the weak model''s own progress check made more strong-model calls
  than the strong model alone (18.5 against 13.8 per airline task) and took longer (385.2 s against 305.2
  s). 7. Measure on held-out tasks with gold outcomes over several seeds: success, cost per completed
  task (counting failed cheap attempts, strong-model tokens and the context resent with each review or
  consult) and median and p95 wall time against every step-1 baseline, plus escalation or consult rate;
  re-run at every model or price change. Run step-level switching live, not by stitching logged runs:
  after an early model swap in one SWE-bench pilot only 3% to 8% of the states a replay would score still
  occurred, and replay missed all 5 success-relevant outcomes. Expect a speed gain only if the cheap model
  is faster than the strong one: with a local 4B model about as slow as hosted ones, wall time did not
  fall, and reviewed drafts raised compute by 30% to 87%.'
detect:
  static: Two models with an escalation call from worker to oracle.
  traces: Escalation or consult rate and when it fires (turn of the first consult, share in the last third
    of the run); the trigger score's distribution (a stated confidence stuck on a few values cannot separate
    failures); strong-model share of tokens and cost; median and p95 wall time of escalated against kept
    tasks; escalated tasks whose outcome changed; advice the worker then ignored.
  evals: Success, cost and wall time per completed task against each model alone across effort settings,
    against random escalation at the same rate and against a random mix of the two at the same spend;
    step-level switching run live, not scored by replaying logged trajectories.
  judge: Whether escalations were warranted.
  probes:
    what: Tasks the worker solves, tasks only the oracle solves, and tasks neither solves.
    construct: Run both models alone on a sample and label each task worker-solves, oracle-only or neither;
      the trigger should escalate the oracle-only tasks and leave the rest with the worker.
  primary:
  - traces
  - evals
impact:
  quality:
    effect: mixed
    size: medium
    when: 'gains where the trigger separates failures: two-model cascades +2.1 to 8.2 points over the
      best single model at the same budget, on average across budgets (Bouchard, May 2026); a learned
      consult policy recovered 44% to 81% of the cheap-to-strong gap on SWE-bench Verified, Terminal-Bench
      2.1 and tau2-bench (Sowietzki, Oct 2026); on OSWorld, escalation on the weak model''s own uncertainty
      67.94% against 61.72% for random escalation at about the same rate (Q. Wang, Oct 2026); within 1
      point of the strong model on tau2-Bench with review at write boundaries (Z. Wang, Oct 2026), -5.0
      to +2.5 points of a cloud-only embodied agent (Zhang, Oct 2026), and kappa 0.007 to 0.026 below
      the large grader with stated-confidence escalation (Burleigh, Mar 2026); FrugalGPT matched GPT-4
      on three 2023 tasks (Chen, May 2023). Losses where it does not: six commercial routers 1.0 to 10.5
      points below a random two-model mix at matched cost (S. Wang, Oct 2026); 8.9 to 12.9 points below
      cloud-only on MCP-Atlas with a local 4B drafter (Z. Wang, Oct 2026); self-consistency and token-entropy
      triggers below random escalation in a web-shopping agent (Noorani, Oct 2026); Anthropic''s advisor
      +1.7 points on coding at the edge of noise, within noise on GPQA with no consults, 7 points lower
      on chart reading (Anthropic, Oct 2026)'
    basis: evidence
  cost:
    effect: mixed
    size: large
    when: 'cheaper than the strong model alone when escalation is selective: 34.5% to 48.1% of its cost
      with a learned consult policy (Sowietzki, Oct 2026); 33% to 63% lower cloud spend within 3.4 points,
      local compute excluded (Shi, Oct 2026); 49% to 81% lower for stated-confidence grading cascades
      (Burleigh, Mar 2026); 59.2% to 98.3% less at matched accuracy on 2023 classification tasks (Chen,
      May 2023); re-running only failures at high effort about 40% below an all-high run, computed from
      existing runs (Anthropic, Oct 2026). Dearer when escalation is frequent or task-level: the coding
      advisor pairing cost 2.1 times its executor alone, GPQA 12% to 25% more with no consults, and a
      pairing that consulted on 88% of chart tasks 1.8 times the strong model alone (Anthropic, Oct 2026);
      verify-then-escalate cost $59.68 against $45.90 for the strong model alone on SWE-bench Verified
      (Sowietzki, Oct 2026); reviewing a cheap model''s drafts cut API cost only to 59% to 81% of strong-only,
      since each review resends the context, and raised compute by 30% to 87% (Z. Wang, Oct 2026)'
    basis: evidence
  performance:
    effect: mixed
    size: medium
    when: 'faster where the cheap model is faster and escalation is rare: 41% to 69% of the strong model''s
      wall time with review at write boundaries on tau2-Bench, AutomationBench and VitaBench (Z. Wang,
      Oct 2026); 28.8% to 82.6% lower median time between actions and 4.4% to 34.8% lower median episode
      time for a critic-triggered embodied agent (Zhang, Oct 2026); 61% to 82% lower median latency for
      stated-confidence grading cascades, with a slow tail of escalated cases (Claude p95 8,228 ms against
      2,888 ms small-only) (Burleigh, Mar 2026). No gain or slower when the cheap model is as slow as
      the strong one (a local 4B drafter: 108 to 215 s against 105 to 151 s per MCP-Atlas task) or escalation
      is frequent (a self-evaluation trigger: 385.2 s against 305.2 s per airline task) (Z. Wang, Oct
      2026); each consult is a serial strong-model call on the critical path (about 1.4 per coding attempt;
      Anthropic, Oct 2026)'
    basis: evidence
  security:
    effect: none
    basis: assessment
  governance:
    effect: improves
    size: small
    when: an explicit escalation policy can be read and audited (the learned policies consult in 4 to
      9 of 24 states; Sowietzki, Oct 2026); count the strong model's tokens separately, since Anthropic
      reports advisor tokens per iteration rather than in the top-level usage totals
    basis: assessment
  brand:
    effect: none
    basis: assessment
