caveats: 'The agent results are small, single-run or the authors'' own methods: the learned consult policy
  used one Gemini pair on 40 to 50 held-out tasks with 3 seeds (success standard deviations up to 7.2
  points) and outcome-screened development tasks, the critic study tuned its thresholds on the evaluation
  instances and ran once in simulation, the hidden-state trigger ran once on 262 OSWorld tasks and needs
  an open-weight worker, and Anthropic''s advisor figures are internal, sometimes single runs on Claude
  models, from a living page whose August 2026 revision rated the advisor more favorably (closing 60%
  to 90% of the gap). Trigger evidence is thin and mixed: stated confidence was tested on one grading
  task with no random baseline, self-consistency lost to random in one web-shopping agent whose strong
  model was a task-trained policy, the cascade study tested only log-probability and trained scores on
  older open and GPT-4o-class models, and the router study is single-turn with a random pair picked from
  the frontier with hindsight. Speed gains need a faster cheap model and rare escalation (no wall-time
  gain with a local 4B model as slow as hosted ones, compute up 30% to 87%), and step-level switching
  scored by replaying logged runs is unreliable (one pilot on small open models). FrugalGPT''s 98% is
  its best of three 2023 classification datasets (59.2% and 73.3% on the other two), and a cheap verifier
  used as the trigger can hide most of the cascade''s errors, so measure true error outside it (9.c.iii).'
