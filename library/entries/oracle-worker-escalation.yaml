summary: 'Let a cheap model do the work and call an expensive one only when a trigger fires: a cascade
  escalates when the cheap answer looks unreliable or fails a check, a router picks the model before the
  call, and an advisor tool lets a cheap agent consult a stronger model mid-task. It pays when the trigger
  really separates the cheap model''s failures: a two-model cascade beat the best single model at the same budget by 2.1 to 8.2 points on average across
  budgets, a learned consult policy recovered 44% to 81% of the gap to the strong
  model on three agent benchmarks at 34.5% to 48.1% of its cost, and re-running only the failures of a low-effort run at high effort matched an all-high run for about
  40% less (computed task by task from existing runs, not run end to end). The trigger is the weak link:
  none of six commercial routers beat a random mix of two well-chosen models at matched cost (the worst
  trailed by 10.5 points), a third to fifth model in a cascade added at most 0.43 points, and agents left
  to decide for themselves consulted rarely and late. In Anthropic''s tests on current models the advisor
  bought about what more effort does (1.7 points for 2.1 times the cost on coding) and scored 7 points
  lower on chart reading, where it was configured but consulted on 1 of 300 tasks.'
how: '1. Start from single-model baselines on your own tasks: the cheap and the strong model alone, each
  across effort settings (the strong one at low effort too), priced per completed task, plus a random
  mix of the two at the same spend. A pairing must beat that whole curve: Anthropic''s coding advisor
  pairing (90.1% at $2.92 per attempt) landed on its executor''s own effort curve (88.4% at $1.38 on high,
  91.1% at $4.11 on xhigh), and no commercial router beat the random mix. Picking one model per call site
  statically is 1.b.i. 2. If the outcome is checkable (tests, a schema, a sound verifier), try the simplest
  cascade first: run cheap and escalate only the failures. Opus 5.5 at low effort with its failures re-run
  at high solved about 97% for about $0.17 a task, against 95.3% for $0.29 with everything at high, a figure
  computed task by task from existing runs rather than run end to end. A
  checker that passes bad work lets those failures through, so audit it on a gold sample (9.c.iii). 3.
  Use two models, not a ladder: allowing three to five models did not raise mean test accuracy in 118
  of 135 comparisons (at most +0.43 points), and even with true query difficulty known a two-model roster
  was within 1 point of the best roster of any size. Take the cheap model from the cost-accuracy frontier;
  in one 26-model set it trailed the strongest by 1.6 points at a 96% discount. 4. Measure the trigger
  before trusting it. For a confidence-score cascade, check how well the score separates the cheap model''s
  errors from the strong model''s: log-probability scores reached AUROC 0.63 to 0.80 for the cheap model''s
  correctness yet beat random escalation at the same escalation rate (not the same cost) by only about 0.3 points
  on MATH. For a pre-call router, check
  it against the random two-model mix at the same spend (commercial routers trailed it by 1.0 to 10.5
  points). 5. In agents, trigger consults on execution evidence and workflow phase rather than on the
  agent''s own sense of being stuck, and cap them. On SWE-bench Verified, a learned policy at 2.78 consults
  per episode solved 48.0%, fixed triggers (before committing to an approach, before finishing, on stalls)
  41.3%, random placement at similar volume 28.0%, and the orchestrating model left to choose (not volume-matched) made 0.41 consults per episode, 77% of
  them in the last third; on Terminal-Bench the learned policy only tied the fixed triggers (34.7% each). Do not re-run whole agent tasks on the strong model
  after a failed self-check: that cascade cost $59.68 against $45.90 for the strong model alone. 6. Watch
  the consult rate and whether the advice is used. Sonnet 5.5 at its default effort never consulted on
  20 SWE-bench Pro problems; a pairing that consulted on most tasks at default effort consulted on few
  once its effort was lowered, and then scored below the executor alone; with the advisor tool attached
  but never called, GPQA cost 12% to 25% more (its definition is about 1,000 prompt tokens per request);
  ignored advice made up 58% of the learned policy''s remaining SWE-bench failures. A consult that fires
  on most tasks can cost more than the strong model alone (1.8 times on chart reading). 7. Measure on
  held-out tasks with gold outcomes over several seeds: success and cost per completed task (counting
  failed cheap attempts and strong-model tokens) against every step-1 baseline, escalation or consult
  rate, and latency on escalated tasks; re-run at every model or price change.'
detect:
  static: Two models with an escalation call from worker to oracle.
  traces: Escalation or consult rate and when it fires (turn of the first consult, share in the last third
    of the run); strong-model share of tokens and cost; escalated tasks whose outcome changed; advice
    the worker then ignored.
  evals: Success and cost per completed task against each model alone across effort settings and against
    a random mix of the two at the same spend.
  judge: Whether escalations were warranted.
  probes:
    what: Tasks the worker solves, tasks only the oracle solves, and tasks neither solves.
    construct: Run both models alone on a sample and label each task worker-solves, oracle-only or neither;
      the trigger should escalate the oracle-only tasks and leave the rest with the worker.
  primary:
  - traces
  - evals
impact:
  quality:
    effect: mixed
    size: medium
    when: 'gains where the trigger separates failures: two-model cascades +2.1 to 8.2 points over the best single model at the same budget, on average across
      budgets (Bouchard, May 2026); a learned consult policy recovered 44%
      to 81% of the cheap-to-strong gap on SWE-bench Verified, Terminal-Bench 2.1 and tau2-bench (Sowietzki,
      Oct 2026); FrugalGPT matched GPT-4 on three 2023 tasks (Chen, May 2023). Losses where it does not:
      six commercial routers 1.0 to 10.5 points below a random two-model mix at matched cost (Wang, Oct
      2026); Anthropic''s advisor +1.7 points on coding at the edge of noise, within noise on GPQA with
      no consults, 7 points lower on chart reading (Anthropic, Oct 2026)'
    basis: evidence
  cost:
    effect: mixed
    size: large
    when: 'cheaper than the strong model alone when escalation is selective: 34.5% to 48.1% of its cost
      with a learned consult policy (Sowietzki, Oct 2026); 59.2% to 98.3% less at matched accuracy on
      2023 classification tasks (Chen, May 2023); re-running only failures at high effort about 40% below an all-high run, computed from existing runs
      (Anthropic, Oct 2026). Dearer when escalation is frequent or task-level: the coding
      advisor pairing cost 2.1 times its executor alone, GPQA 12% to 25% more with no consults, and a
      pairing that consulted on 88% of chart tasks 1.8 times the strong model alone (Anthropic, Oct 2026);
      verify-then-escalate cost $59.68 against $45.90 for the strong model alone on SWE-bench Verified
      (Sowietzki, Oct 2026)'
    basis: evidence
  performance:
    effect: mixed
    size: small
    when: each escalation or consult is a serial strong-model call on the critical path (about 1.4 per
      coding attempt), and a re-run failure takes two runs of wall-clock time (Anthropic, Oct 2026); work
      the cheap model finishes may be faster, which no source here times
    basis: assessment
  security:
    effect: none
    basis: assessment
  governance:
    effect: improves
    size: small
    when: an explicit escalation policy can be read and audited (the learned policies consult in 4 to
      9 of 24 states; Sowietzki, Oct 2026); count the strong model's tokens separately, since Anthropic
      reports advisor tokens per iteration rather than in the top-level usage totals
    basis: assessment
  brand:
    effect: none
    basis: assessment
  primary:
  - cost
  - quality
