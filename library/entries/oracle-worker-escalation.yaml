  effect: 'WebShop end-to-end success at about 20% / 40% / 60% of actions escalated (200 tasks): random
    16.0% / 20.0% / 50.5%; self-consistency 4.5% / 14.5% / 41.0%; token entropy 4.0% / 15.0% / 40.5%;
    weak-strong disagreement probe 6.5% / 26.0% / 71.5%; corrected disagreement probe 21.0% / 46.0% /
    76.5%. On BFCL both disagreement probes beat the best label-free baseline (figure only). On Math-500,
    self-consistency and semantic entropy approached the corrected-disagreement probe as budget and sample
    count grew and slightly beat it at a 50% budget for N>1; they did worse on Spider and AceCode, where
