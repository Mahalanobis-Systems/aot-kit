caveats: 'The agent results are small or vendor-run: the learned consult policy was tested on one Gemini
  model pair in one framework, on 40 to 50 held-out tasks per benchmark with 3 seeds (success standard
  deviations up to 7.2 points) and outcome-screened development tasks, and Anthropic''s advisor figures
  are internal, sometimes single runs on Claude models, from a living page whose August 2026 revision
  rated the advisor more favorably (closing 60% to 90% of the gap). The router and cascade studies are
  single-turn QA, math and code with list-price costs; the router study''s random baseline uses a pair
  picked from the frontier with hindsight, and the cascade study tested only log-probability and trained
  scores on older open and GPT-4o-class models, not verbalized confidence, self-consistency or judges.
  FrugalGPT''s 98% is its best of three 2023 classification datasets (59.2% and 73.3% on the other two).
  A cheap verifier used as the trigger can hide most of the cascade''s errors, so measure true error outside
  it (9.c.iii).'
