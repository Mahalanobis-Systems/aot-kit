    and median latency 61%, 64% and 82% lower than always-large (Claude median 2,066 ms vs 5,300 ms; p95
    8,228 ms vs 14,806 ms, small alone 2,888 ms). Small-model kappa on kept vs escalated decisions 0.831
    vs 0.211 (Claude). Claude Haiku 4.5 alone (0.783) scored above GPT-5.4 (0.770).'
