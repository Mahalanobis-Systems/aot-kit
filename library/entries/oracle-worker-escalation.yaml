- source: 'Lingjiao Chen, Matei Zaharia, James Zou, "FrugalGPT: How to Use Large Language Models While
    Reducing Cost and Improving Performance", https://arxiv.org/abs/2305.05176'
  date: '2023-05-09'
  task: 'LLM cascade: learn which cheaper models to try first and when to escalate to a stronger one'
  effect: '"FrugalGPT can match the performance of the best individual LLM (e.g. GPT-4) with up to 98%
    cost reduction or improve the accuracy over GPT-4 by 4% with the same cost". The 98% is the best of
    three datasets: the cost of matching the best single model fell 98.3% on HEADLINES (GPT-4), 73.3%
    on OVERRULING (GPT-4) and 59.2% on COQA (GPT-3).'
  conditions: 12 commercial LLM APIs from 5 providers at March 2023 prices; three classification and reading-comprehension
    datasets (HEADLINES, OVERRULING, COQA); cascades of up to three models with a DistilBERT scorer trained
    on labeled examples from the same distribution
  direction: supports
  locator: Abstract; §3 Table 3; Figure 3
  measured: true
- source: Anthropic, "Optimizing for cost and intelligence" (Claude Platform docs), https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence
  date: '2026-10-17'
  task: 'Measured the advisor strategy (a cheaper executor consults a stronger advisor through the advisor
    tool) against the executor alone at the same effort and against single-model effort curves; also computed
    a verifier-triggered escalation: run every task at low effort and re-run only the failed ones at high
    effort'
  effect: 'Internal agentic-coding benchmark, Opus 5.5 at high with a Fable 5.1 advisor: 90.1%, "1.7 points
    over the executor alone, at the edge of run-to-run noise", for $2.92 per attempt, about 2.1 times
    the executor alone, about 1.4 consults per attempt; it "lands about on Claude Opus 5.5''s own effort
    curve, so the advisor bought about what more effort does" (Opus 5.5 alone 88.4% at $1.38 on high,
    91.1% at $4.11 on xhigh). GPQA Diamond, Haiku 5.5 or Sonnet 5.5 with an Opus 5.5 advisor: consulted
    on none of 198 questions, score within noise, 12% and 25% more cost per question. Chartography, Opus
    5.5 at low with a Fable 5.1 advisor: consulted on 1 of 300 tasks, 61.7 against 68.7 alone, "beyond
    run-to-run noise"; an August pairing that consulted on 88% of tasks matched Fable 5.1 alone at medium
    (65.0 vs 67.5) at about 1.8 times its cost. Sonnet 5.5 at high consulted on 0 of 20 SWE-bench Pro
    problems; on DeepSWE a low-effort Sonnet 5 executor with an advisor scored 23 points above itself
    alone. Escalation on failure, SWE-bench Pro subset, Opus 5.5: low then high on failures 96.4% to 97.5%
    for about $0.17 a task; everything at high 94.8% to 95.8% for $0.29; high re-run on its own failures
    96.9% for $0.31 ("Use this policy for the saving, not the lift"); the escalation figures were computed
    task by task from existing runs, not run separately.'
  conditions: Anthropic-internal runs, August to October 2026, list prices, Claude models only; internal
    coding benchmark of 370 repository tasks (pairing five attempts per task, some single-model points
    one run); GPQA Diamond 198 questions, two runs; Chartography 100 charts, three runs, spreads up to
    10 points; SWE-bench Pro 478-problem subset, two runs per effort; undated living page, figures from
    the revision archived 2026-10-17 (page first archived 2026-08-15)
  direction: mixed
  measured: true
  locator: Combine models; Advisor strategy table; Re-run failures at higher effort; Benchmarks referenced
    3, 9, 10, 11, 13
- source: 'Pascal Sowietzki, Steffen Holter, Yannick Metz, Emil Kasper, Raphael Baur, Mennatallah El-Assady
    (ETH Zurich), "Ask Your Advisor: Learning When to Consult Stronger Models in Agentic Systems", https://arxiv.org/abs/2610.13870'
  date: '2026-10-09'
  task: A cheap executor in a Magentic-One agent may consult a stronger advisor, at most 4 times per episode,
    at workflow contact points; a tabular policy learned by Monte Carlo control on development tasks chooses
    Silent or Consult from execution evidence. Compared with FrugalGPT, RouteLLM and AutoMix (task-level
    cascade, router, verify-then-escalate), consulting once at the start, Anthropic-style fixed triggers,
    consulting at every point, the orchestrating LLM deciding, and random placement at matched volume
  effect: 'Success and run cost (mean of 3 seeds), executor alone / advisor alone / learned policy: SWE-bench
    Verified 18.0% $11.48 / 62.0% $45.90 / 48.0% $22.09; Terminal-Bench 2.1 21.3% $9.76 / 51.3% $60.99
    / 34.7% $24.93; tau2-bench telecom 72.5% $5.07 / 98.3% $22.50 / 93.3% $7.77, i.e. 68.2%, 44.4% and
    80.6% of the gap recovered at 48.1%, 40.9% and 34.5% of the advisor-alone cost. SWE-bench at similar
    consult volume: learned 48.0% (2.78 consults per episode), fixed start, end and stall triggers 41.3%
    (2.75), random 28.0% (2.53); consulting at every point 34.0%; orchestrating LLM deciding (not volume-matched) 29.3% with 0.41 consults per episode, 77% of them in the final third. Task-level baselines on SWE-bench: FrugalGPT
    31.3% at $22.61, RouteLLM 30.0% at $25.03, AutoMix 52.0% at $59.68. On Terminal-Bench the learned
    policy and the fixed triggers tied at 34.7%. Ignored advice was the primary mode in 58% of the learned
    policy''s remaining SWE-bench failures.'
  conditions: gemini-3-flash-preview at low effort as executor, gemini-3.1-pro-preview at high as advisor;
    held-out tests of 50 (Verified-Mini), 50 and 40 tasks; 3 seeds, success standard deviations 1.2 to
    7.2 points across conditions; development tasks screened by outcome; one model pair, one agent framework
  direction: supports
  measured: true
  locator: §4; §5 Tables 2-3; §5.1 Table 4; §5.4; Appendix B.1-B.2; Appendix C.1 Table 12
- source: Sam Wang, Julia White, Sahibzada Allahyar, Dhruv Atreja, Urchade Zaratiana, Kelton Zhang, "Dynamic
    LLM Routers are Often Misguided", https://arxiv.org/abs/2610.02762
  date: '2026-10-02'
  task: Ran six commercial routers (OpenRouter auto and auto-beta, Azure, Not Diamond, vLLM Semantic Router,
    Nadir, Orca) in 14 settings, generating and grading every routed answer the same way, against a router
    that randomly picks between Gemini 3.7 Flash and Opus 5 (high) at matched cost; then built a two-model
    router that escalates on predicted difficulty
  effect: 'Every setting trailed the random two-model mix: from -1.0 ± 1.8 points (vLLM SR) to -10.5 ±
    2.8 (Orca adaptive); OpenRouter auto -3.3 to -5.5, Not Diamond -4.1 to -8.8, Azure -2.2 to -8.4. Only
    the smallest gap (vLLM SR) is within error; the other 13 settings trail significantly. No
    router''s choices correlated with query difficulty above gamma +0.20. Gemini 3.7 Flash alone trailed
    Opus 5 (high) by 1.6 points at a 96% discount, and even with true difficulty known a two-model roster
    was never more than 1 point below the best roster of any size. The authors'' difficulty router stayed
    within noise of random routing at every budget ("a well-chosen roster leaves little to route"); with
    gpt-oss-20b (low) as the cheap model, it and a difficulty oracle underperformed random routing at
    every budget.'
  conditions: Single-turn queries; 17 benchmarks in 8 categories (coding, instruction following, knowledge,
    math, QA, office, tool use, HLE), 800 evaluation and 2,508 training queries; 26 models from June and
    August 2026, one generation per query, OpenRouter costs; patterns replicated on RouterBench, SPROUT
    and LLMRouterBench
  direction: contradicts
  measured: true
  locator: Abstract; §3; §4 Table 1; §6.1 Figure 4; §7; Limitations
- source: Dylan Bouchard, "Is Escalation Worth It? On the Depth of LLM Cascades", https://arxiv.org/abs/2605.06350
  date: '2026-05-07'
  task: Optimized cascade model sequences and deferral thresholds from a pool of eight models at 500 budgets
    with nine deferral scores (five log-probability scores, two trained on the cheap model's correctness,
    two trained on the gain from escalating), comparing caps of one to five models on held-out queries
  effect: Two-model cascades beat the best single model affordable at each budget by 2.1 to 8.2 points of mean
    test accuracy, averaged across the budget range (MMLU +2.30 to +3.93, TriviaQA +5.27 to +7.20, MATH +2.13 to +3.46, SimpleQA
    +6.18 to +8.22, LiveCodeBench +4.65 to +7.32). Allowing more than two models did not raise mean test
    accuracy in 118 of 135 comparisons and added at most 0.43 points. The seven confidence-based scores
    had AUROC 0.63 to 0.80 for the cheap model's correctness, and their accuracy gain over escalating at random at equal escalation rates (not equal cost) was 0.03
    to 3.20 points (MATH 0.26 to 0.36). With simulated scores at AUROC 0.9 that track
    only the current model's errors, a third model helped on four of five benchmarks; the gain disappeared
    once the score also tracked difficulty shared across models.
  conditions: Single-turn; Llama 3.1-8B, Qwen2.5-7B, GPT-4o mini, GPT-oss-20B, DeepSeek-V3, Llama 3.3-70B,
    GPT-4o and MiniMax-M2.7 at May 2026 list prices; MATH levels 3-5, MMLU, TriviaQA, SimpleQA, LiveCodeBench,
    about 1,000 to 2,000 queries each, 50 calibration/test splits; no self-consistency, verbalized-confidence
    or judge triggers; one author
  direction: supports
  measured: true
  locator: Abstract; §4.1; §4.3 Table 1; §4.4 Table 2; Appendix C, Table 25
