    for Computer-Use Agents", https://arxiv.org/abs/2610.22280'
  date: '2026-10-15'
  task: A weak open-weight computer-use agent guided by a Claude Opus 5 Manager (subgoal planning and
    verification) escalates a task to Opus 5 at the start or mid-run when its own hidden states look more
    like those of past failed trajectories (pooled LDA distance, no extra forward pass); after hand-off
    a Shadow layer probes the weak model every third step and can make the strong agent re-decide at higher
    effort. Compared with random escalation at matched rates, StepWise, Progress Advantage, and always-on
    Opus 5 and Sonnet 4.5
  effect: 'Qwen3.5-35B-A3B, success and cost per task: alone 37.40%; + Manager 41.15% ($0.1372); + escalation
    67.94% ($0.4050); full LEASH 73.66% ($0.4117, 64.1% of tasks escalated) against random escalation
    of 64.4% of tasks 61.72% ($0.3768) and always-on Opus 5 72.90% ($0.5094). Full LEASH beat random escalation
    by 6.55 to 11.94 points across four weak models. Gates (with Manager, without Shadow): initial only
    59.92% ($0.3122), runtime only 71.65% ($0.4169). Runtime AUROC for subgoal failure: pooled LDA 0.609
    and 0.575, best token-probability statistic 0.488 and 0.540. On an escalation-prone subset, LEASH
    timing 64.6% at $0.67 vs shuffled timing 60.4% at $0.79.'
