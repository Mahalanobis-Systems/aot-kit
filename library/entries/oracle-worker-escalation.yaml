    EvoCUA-8B, Qwen3.5-35B-A3B, Nemotron-3-Nano-Omni (30B-A3B), Qwen3.8-27B; Claude Opus 5 as Manager
    and strong executor; always-on references run without the Manager; costs from OpenRouter reference
    prices, local models included at reference prices; needs the weak model's hidden states and a reference
    bank of about 99 tasks; the authors' own method
