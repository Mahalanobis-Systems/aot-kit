- source: 'Ashritha Gonuguntla (Carnegie Mellon University), "The Replay Gap: Static Evaluation of Model
    Switching in LLM Agents Scores the Wrong World", https://arxiv.org/abs/2608.08239'
  date: '2026-08-08'
  task: 'Tested whether per-step model switching in agents can be scored by replaying logged trajectories:
    forked live SWE-bench Verified runs at 30% and 70% of their length, re-ran the prefix in a fresh container,
    continued each fork with the other model (swap) or the same model (control), and compared the results
    with a log-stitching replay evaluator'
  effect: Swaps exceeded same-model controls by +0.25 to +0.66 normalized post-fork edit distance (95%
    CIs exclude zero), rewriting 61-94% of post-fork actions; 74-77% of early swaps diverged at the first
    post-fork action vs 6-35% of controls; replay validity (share of post-fork states a replay evaluator
    scores against the right state) 3.2% and 8.0% for early swaps, 34.4% and 39.4% for late ones. All
    five outcome flips occurred in swap arms (upgrades rescuing unsolved instances, a downgrade losing
    the one solve), none across 359 control forks. The replay evaluator got 0 of 5 success-relevant calls
    right (patch similarity 0.00 to 0.11). The larger model exhausted the 50-step budget without submitting
    more often (24 of 30 vs 17 of 30 base runs, one run pair).
  conditions: mini-SWE-agent on SWE-bench Verified, 50-step budget, 28k context; Qwen3-4B-Instruct (FP8)
    and Qwen3-14B (AWQ, thinking off) on one 24 GB GPU at temperature 0; six run pairs of 30 instances,
    717 scored branch pairs from about 900 rollouts; resolution rates 0-3%; a workshop pilot
