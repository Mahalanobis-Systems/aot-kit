caveats: The current-model accuracy and cost result rests on one study's first 100 BrowseComp tasks, where
  68% against 66% is two tasks, and its headline 62.2% is set against the score OpenAI reported for GPT-5
  high in a different harness (Lin, Feb 2026). On coding agents the evidence that same-turn batches buy
  little comes from one team's own 4,265 Claude Code and Codex sessions (Zhu, Jun 2026) and from 1.04x
  on SWE-bench Lite, the 1.40x needs futures and per-tool read/write declarations and the paper's May
  2026 version reported a 3.3-point lower resolve rate on GPT-5.2, not significant (Feng, May 2026), and
  the 1.27x to 1.35x from speculative run-ahead used open-weight main agents and a drafter fine-tuned
  on the benchmark's trajectories, at about 2.1 s of extra compute per second saved (Yu, Sep 2026). The
  arrival-order result replays fixed evidence packets with one or two searches on multi-hop questions
  (Ren, Oct 2026), the privacy result uses generated sensitive-topic tasks scored by LLM adversaries (Mohammadi,
  Jun 2026), the loss on dependent calls comes from an LLM-judged benchmark whose same-model ablation
  gives numbers for two of four models (Xu, Nov 2025), and the largest speedups are with gpt-3.5-turbo
  against ReAct (Kim, Dec 2023). No source measures races or security effects of a side-effecting tool
  misclassified as read-only in plain concurrent batches, and brand is unmeasured.
