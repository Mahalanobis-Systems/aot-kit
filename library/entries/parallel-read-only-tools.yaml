summary: 'Run the independent read-only tool calls a model emits in one turn at the same time, and keep
  calls that write, share state or need another call''s result in the order the model emitted them. It
  pays where a task has many slow, independent lookups: told to make three parallel search or scrape calls
  per turn, GPT-5 scored 68% against 66% on 100 BrowseComp tasks in half the turns, at 35.9% lower cost
  and 40.6% less time, and native parallel calls ran 1.61x to 2.76x faster than one call per step on parallel
  search questions. Coding agents rarely batch: steps averaged 1.2 tool calls across 4,265 Claude Code and
  Codex sessions over 23 models (a measure of all tools, not only reads, from a paper that tests no batching).
  They gain little from it: running same-turn batches concurrently gave 1.04x on SWE-bench Lite, and
  same-turn dispatch recovered 54 of 9,315 seconds of tool time; the larger gains came from overlapping tool time with decoding
  through futures (1.40x) or sandboxed speculative run-ahead (1.27x to 1.35x at an unchanged SWE-bench
  Verified resolve rate, with extra drafter compute). Wider is not better (five or eight calls per turn
  scored 60% and 63%), batching calls that depend on each other costs accuracy (GLM-4.5 completed 63.1%
  of compound tasks when parallelizing against 71.8% sequentially), acting on results before the whole
  batch is back makes what the agent fetches next depend on arrival order, and speculative read-only calls
  still reveal a user''s sensitive topic to the services they reach.'
how: '1. Start from the baseline: the same agent, model and tasks with parallel calls off (disable_parallel_tool_use
  in Claude''s tool_choice, or your provider''s equivalent), and with them on but executed one at a time;
  record accuracy, turns, tokens, cost and p50/p95 wall-clock per task, the share of wall-clock spent
  inside tools, and the average number of tool calls per tool-calling turn. Expect the gain to track how
  much slow, independent lookup work a task has: native parallel batches ran 1.61x to 2.76x faster than
  ReAct on 2-way and 8-way parallel search questions (gpt-3.5-turbo), but coding agents rarely batch and
  their tool time sits in a few slow commands. Across 4,265 Claude Code and Codex sessions over 23 models steps
  averaged 1.2 tool calls (median 1), and Claude''s calls under 1 s, counting all tools rather than reads
  alone, were 70% of calls but under 1% of tool time (the study tests no batching, and its authors argue
  more calls per step would cut model round trips);
  in published Claude and Codex SWE-Marathon trajectories, same-turn dispatch recovered 54 of the 9,315
  s spent in tools, and running a model''s same-turn batches concurrently gave 1.04x on SWE-bench Lite
  (GPT-5.6 Sol). Hiding tool time can give at most 1/(1 - f) for a run that spends a share f of its wall-clock
  in tools. 2. Classify every tool by what it reads and writes. Search, fetch, grep, glob, file reads
  and other lookups can run together; anything with side effects, shared state (a shell session, a browser,
  a working directory) or an ordering requirement cannot. Default unknown tools to serial, and classify
  shell commands per command (one harness locked the whole repository for python, pytest and any command
  its rules did not match). Declaring a read set and a write set per tool lets the harness run non-conflicting
  calls together while conflicting ones keep the model''s order. 3. Dispatch each batch in the harness,
  not the model: the provider APIs leave execution order, partial failure and races to you. Run the safe
  calls concurrently, run the rest in the order the model emitted them, and when a call fails cancel only
  the calls that depend on it. Return one result per call, all in the next message and before any text
  (results sent as separate messages teach Claude to stop batching), with is_error and a short reason
  for any call not run or that failed because its prerequisite had not completed; the model reissues it
  next turn. Make the next model call wait for every result it depends on: when a search agent decided
  after two of six parallel results had arrived, the documents it went on to retrieve differed across
  arrival orders by 11.6 to 23.8 points more than across repeats, and its accuracy moved from 36.1 points
  below to 8.9 points above waiting, depending on the task and how it read results (DeepSeek-V4-Flash,
  GPT-5.6). If parts of a task may go ahead early, release each part only once its own results are complete
  and pick among competing calls by a fixed rule, not by completion order: this kept arrival-order disagreement
  within 1.0 point of repeat variation at the accuracy of waiting for everything and responded 3.1% to
  3.9% sooner, while giving a shared search to the first-ready request added 21.6 points of disagreement.
  4. Prompt for it, at a modest width: "whenever you need to perform multiple independent operations,
  invoke all relevant tools simultaneously rather than sequentially" plus "Only batch tool calls that
  are independent of each other." With GPT-5 on 100 BrowseComp tasks at a 100-turn limit, three to four
  search or scrape calls per turn scored 68% against 66% for one, in 23.8 against 45.7 turns, while five
  and eight scored 60% and 63%; a wide-then-narrow schedule (3, then 2, then 1 per turn) reached 74%,
  and letting the model choose reached 72%. Open-weight models gained little (DeepSeek-V3.2 38% to 39%),
  so measure before relying on it. 5. Keep dependent steps sequential: where later calls need earlier
  results, parallel scheduling cost GLM-4.5 8.7 points of task completion (63.1% against 71.8% sequential),
  and QwQ-32B put dependent calls in one batch and completed 29.36%. Leave those workflows serial, or
  plan them as an explicit dependency graph (the LLMCompiler planner ran 1.40x to 3.74x faster than ReAct).
  6. Where tools are slow, overlap them with decoding, and count what that costs. Returning placeholders
  (futures) and filling in results at turn boundaries gave 1.40x on SWE-bench Lite and 1.26x on BFCL web
  search with no significant accuracy change, and with no read/write declarations it still helped by overlapping
  decoding with serialized calls. Where the wait lies across turns, a runtime that drafted the agent''s
  next calls, ran them in copy-on-write sandboxes and committed them in order only after re-checking every
  file they read gave 1.31x on 100 SWE-bench Verified tasks, 1.35x on 28 Terminal-Bench 2.0 tasks and
  1.27x on 18 SWE-Marathon sessions at an unchanged 41.7% resolve rate (Qwen3.8-27B main agent; DeepSeek
  V4 Pro gave the same 1.24x geometric mean on SWE-Marathon), against 1.16x for prefetching only the next
  side-effect-free call; tasks under 15% tool time gained 1.07x and those over 40% gained 1.60x, and it
  cost 1.6M drafter tokens per task and about 2.1 s of speculative compute per second saved, with network
  sends and untraceable commands run serially. Gate speculative calls to external services before they
  are sent: abandoned speculative lookups let an LLM adversary recover a user''s hidden sensitive topic
  in 0.97 of static-plan tasks against 0.44 without speculation (0.49 against 0.34 with a Claude Opus
  4.7 planner); a read-only restriction or an allow-list left that unchanged, while rewriting arguments
  to generic terms or routing the call to an internal substitute cut it to 0.04 and 0.00, and speculation
  itself saved 5.4% to 12.3% of p50 latency. 7. Measure paired against the baseline on tasks with and
  without dependent calls: accuracy, turns, cost and p95 latency per task, the share of wall-clock in
  tools, average calls per tool-calling turn, calls returned as is_error because a prerequisite had not
  run, and probes that put a read and a write to the same resource in one batch. Where results can be
  used before a batch completes, replay the same results in several arrival orders and compare what the
  agent fetches next against repeat runs; with speculation, also count drafter tokens and compute, discarded
  runs, and speculative calls sent to external services that the agent never used.'
detect:
  static: Each tool marked read-only (safe to run together) or as having side effects, shared state or
    ordering needs, with unknown tools defaulting to serial; read-only calls in a batch dispatched concurrently;
    the rest run in model-emitted order; all results returned in one message before any text, and the
    next model call waits for the results it depends on; a parallel-calls instruction in the prompt; any
    speculative calls run in isolated sandboxes, commit in order after validation and pass an issue-time
    policy before reaching external services.
  traces: Average tool calls per tool-calling turn near 1 on tasks with independent lookups (parallelism
    unused); a large share of wall-clock in a few slow tool calls between single-call turns (slack across
    turns that batching cannot reach); overlapping spans for calls that touch the same resource; calls
    that failed because a prerequisite in the same batch had not run; model calls issued before the results
    they depend on had arrived; speculative calls to external services that the agent never used.
  evals: Accuracy, turns, cost and p95 latency with parallel calls off and on, on tasks with and without
    dependent calls; race-condition failures.
  probes:
    what: Batches that mix reads and writes to the same resource, or hold a call that needs another call's
      output; the same batch results delivered in different orders; speculative calls whose arguments
      carry a sensitive user topic.
    construct: A read that depends on a write in the same batch; a call whose argument must come from
      another call in the same batch; a shell command treated as read-only that writes a file another
      call reads; one batch's results replayed in several arrival orders, comparing what the agent fetches
      next with repeat runs; a request on a sensitive topic, checking what speculative calls send to external
      providers before the agent commits to them.
  primary:
  - static
  - traces
impact:
  quality:
    effect: mixed
    size: medium
    when: 68% against 66% in half the turns at three parallel calls per turn on 100 BrowseComp tasks,
      60% and 63% at five and eight, 38% to 39% for DeepSeek-V3.2 (Lin, Feb 2026); 63.1% against 71.8%
      forced sequential for GLM-4.5 on compound tasks with dependencies, 29.36% for QwQ-32B, which batched
      dependent calls (Xu, Nov 2025); no significant change from futures on SWE-bench Lite, 79.3% against
      79.0% (Feng, May 2026), or from speculative run-ahead on SWE-bench Verified, 41.7% against 41.7%
      (Yu, Sep 2026); deciding before a batch's results were all back moved accuracy from 36.1 points
      below to 8.9 points above waiting, by task and reasoning program (Ren, Oct 2026); native parallel
      calls 77.00% against 72.47% on Movie Recommendation and 87.32% against 89.09% on ParallelQA for
      ReAct (Kim, Dec 2023). A tool with side effects classified read-only can race; no source measures
      that in plain concurrent batches.
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: 'lower for parallel batches: $65.7 against $102.5 per 100 BrowseComp tasks (35.9% less) at three
      calls per turn (Lin, Feb 2026); native parallel calls 1.81x to 3.33x cheaper than ReAct (Kim, Dec
      2023); sequential scheduling raised DeepSeek-R1 from 11.6k to 12.6k tokens per task (Xu, Nov 2025).
      Higher with speculation: 1.6M drafter tokens and 1,480 drafter GPU-seconds per task on top of the
      main agent''s 8.3M tokens, and sandbox CPU from 2,760 to 4,310 s (Yu, Sep 2026); 4.03 provider calls
      per task against 1.03 without speculation (Mohammadi, Jun 2026)'
    basis: evidence
  performance:
    effect: improves
    size: medium
    when: 904.2 s against 1,522.6 s per task (40.6% less) (Lin, Feb 2026); native parallel calls 1.61x
      to 2.76x faster than ReAct on parallel search questions (Kim, Dec 2023); 1.04x on SWE-bench Lite
      for concurrent batches alone, 1.40x with read/write declarations and decoding during calls (Feng,
      May 2026); speculative run-ahead 1.31x, 1.35x and 1.27x on three coding benchmarks, 1.07x on tasks
      under 15% tool time and 1.60x over 40%, while same-turn dispatch recovered 54 of 9,315 s of tool
      time in Claude and Codex trajectories (Yu, Sep 2026); 1.2 tool calls per step in 4,265 Claude Code
      and Codex sessions, where tools took 59.8% of response time (Zhu, Jun 2026); 5.4% to 12.3% at p50
      from speculative external calls (Mohammadi, Jun 2026); 3.1% to 3.9% from releasing each completed
      sub-question early (Ren, Oct 2026); 361.6 s against 423.6 s sequential for DeepSeek-R1 (Xu, Nov
      2025)
    basis: evidence
  security:
    effect: mixed
    size: medium
    when: 'speculative calls to external services reveal what the agent inferred: an adversary recovered
      a hidden sensitive topic in 0.97 of static-plan tasks against 0.44 without speculation (0.49 against
      0.34 with a real planner), unchanged by a read-only restriction or allow-list and cut to 0.04 and
      0.00 by rewriting arguments or routing to an internal substitute before dispatch (Mohammadi, Jun
      2026); sandboxed run-ahead with validated in-order commit had no false accepts in 4,010 audited
      commits and caught 20 of 20 injected hidden dependencies, with network sends blocked (Yu, Sep 2026).
      No source measures a side-effecting tool misclassified as read-only in plain concurrent batches.'
    basis: evidence
  governance:
    effect: mixed
    size: small
    when: acting on parallel results as they arrive makes the evidence an agent gathers depend on arrival
      order (11.6 to 23.8 points above repeat variation), which the authors flag for auditing an agent's
      conclusions, while waiting for the batch or releasing each completed sub-question kept it within
      repeat variation (Ren, Oct 2026); runtime logs of speculative calls exposed nearly as much as provider
      logs, 0.24 against 0.26 recovery (Mohammadi, Jun 2026)
    basis: evidence
  brand:
    effect: none
    basis: assessment
  primary:
  - performance
  - cost
