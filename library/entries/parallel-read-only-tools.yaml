summary: 'Let the model put several independent read-only tool calls (searches, fetches, file reads) in
  one turn and have the harness run them at once, while calls that write, share state or need another
  call''s result run one at a time in the order the model emitted them. It pays where a task has many
  slow, independent lookups: told to make three parallel search or scrape calls per turn, GPT-5 scored
  68% against 66% on 100 BrowseComp tasks in half the turns, at 35.9% lower cost and 40.6% less time,
  and native parallel calls ran 1.61x to 2.76x faster than one call per step on parallel search questions.
  The gain shrinks where tool work is fast or sequential (1.04x on SWE-bench Lite, 1.40x once the harness
  declared each tool''s reads and writes and kept decoding during calls), wider is not better (five or
  eight calls per turn scored 60% and 63%), and batching calls that depend on each other costs accuracy
  (GLM-4.5 completed 63.1% of compound tasks when parallelizing against 71.8% sequentially).'
how: '1. Start from the baseline: the same agent, model and tasks with parallel calls off (disable_parallel_tool_use
  in Claude''s tool_choice, or your provider''s equivalent), and with them on but executed one at a time;
  record accuracy, turns, tokens, cost and p50/p95 wall-clock per task, and the average number of tool
  calls per tool-calling turn. Expect the gain to track how much slow, independent lookup work a task
  has: native parallel batches ran 1.61x to 2.76x faster than ReAct on 2-way and 8-way parallel search
  questions (gpt-3.5-turbo), but running a model''s same-turn batches concurrently instead of one by one
  gave 1.04x on SWE-bench Lite (GPT-5.6 Sol). 2. Classify every tool by what it reads and writes. Search,
  fetch, grep, glob, file reads and other lookups can run together; anything with side effects, shared
  state (a shell session, a browser, a working directory) or an ordering requirement cannot. Default unknown
  tools to serial, and classify shell commands per command (one harness locked the whole repository for
  python, pytest and any command its rules did not match). Declaring a read set and a write set per tool
  lets the harness run non-conflicting calls together while conflicting ones keep the model''s order.
  3. Dispatch each batch in the harness, not the model: the provider APIs leave execution order, partial
  failure and races to you. Run the safe calls concurrently, run the rest in the order the model emitted
  them, and when a call fails cancel only the calls that depend on it. Return one result per call, all
  in the next message and before any text (results sent as separate messages teach Claude to stop batching),
  with is_error and a short reason for any call not run or that failed because its prerequisite had not
  completed; the model reissues it next turn. 4. Prompt for it, at a modest width: "whenever you need
  to perform multiple independent operations, invoke all relevant tools simultaneously rather than sequentially"
  plus "Only batch tool calls that are independent of each other." With GPT-5 on 100 BrowseComp tasks
  at a 100-turn limit, three to four search or scrape calls per turn scored 68% against 66% for one, in
  23.8 against 45.7 turns, while five and eight scored 60% and 63%; a wide-then-narrow schedule (3, then
  2, then 1 per turn) reached 74%, and letting the model choose reached 72%. Open-weight models gained
  little (DeepSeek-V3.2 38% to 39%), so measure before relying on it. 5. Keep dependent steps sequential:
  where later calls need earlier results, parallel scheduling cost GLM-4.5 8.7 points of task completion
  (63.1% against 71.8% sequential), and QwQ-32B put dependent calls in one batch and completed 29.36%.
  Leave those workflows serial, or plan them as an explicit dependency graph (the LLMCompiler planner
  ran 1.40x to 3.74x faster than ReAct). 6. Where tools are slow, also let decoding continue while calls
  run: returning placeholders (futures) and filling in results at turn boundaries gave 1.40x on SWE-bench
  Lite and 1.26x on BFCL web search with no significant accuracy change, and with no read/write declarations
  it still helped by overlapping decoding with serialized calls. 7. Measure paired against the baseline
  on tasks with and without dependent calls: accuracy, turns, cost and p95 latency per task, average calls
  per tool-calling turn, calls returned as is_error because a prerequisite had not run, and probes that
  put a read and a write to the same resource in one batch.'
detect:
  static: Each tool marked read-only (safe to run together) or as having side effects, shared state or
    ordering needs, with unknown tools defaulting to serial; read-only calls in a batch dispatched concurrently;
    the rest run in model-emitted order; all results returned in one message before any text; a parallel-calls
    instruction in the prompt.
  traces: Average tool calls per tool-calling turn near 1 on tasks with independent lookups (parallelism
    unused); overlapping spans for calls that touch the same resource; calls that failed because a prerequisite
    in the same batch had not run.
  evals: Accuracy, turns, cost and p95 latency with parallel calls off and on, on tasks with and without
    dependent calls; race-condition failures.
  probes:
    what: Batches that mix reads and writes to the same resource, or hold a call that needs another call's
      output.
    construct: A read that depends on a write in the same batch; a call whose argument must come from
      another call in the same batch; a shell command treated as read-only that writes a file another
      call reads.
  primary:
  - static
  - traces
impact:
  quality:
    effect: mixed
    size: medium
    when: 68% against 66% in half the turns at three parallel calls per turn on 100 BrowseComp tasks,
      60% and 63% at five and eight, 38% to 39% for DeepSeek-V3.2 (Lin, Feb 2026); 63.1% against 71.8%
      forced sequential for GLM-4.5 on compound tasks with dependencies, 29.36% for QwQ-32B, which batched
      dependent calls (Xu, Nov 2025); 79.3% against 79.0% on SWE-bench Lite, no significant change (Feng,
      May 2026); native parallel calls 77.00% against 72.47% on Movie Recommendation and 87.32% against
      89.09% on ParallelQA for ReAct (Kim, Dec 2023). A tool with side effects classified read-only can
      race; no source measures that.
    basis: evidence
  cost:
    effect: improves
    size: medium
    when: $65.7 against $102.5 per 100 BrowseComp tasks (35.9% less) for three parallel calls per turn
      (Lin, Feb 2026); native parallel calls 1.81x to 3.33x cheaper than ReAct (Kim, Dec 2023); sequential
      scheduling raised DeepSeek-R1 from 11.6k to 12.6k tokens per task (Xu, Nov 2025)
    basis: evidence
  performance:
    effect: improves
    size: medium
    when: 904.2 s against 1,522.6 s per task (40.6% less) (Lin, Feb 2026); native parallel calls 1.61x
      to 2.76x faster than ReAct on parallel search questions (Kim, Dec 2023); 1.04x on SWE-bench Lite
      for concurrent batches alone, 1.40x with read/write declarations and decoding during calls (Feng,
      May 2026); 361.6 s against 423.6 s sequential for DeepSeek-R1 (Xu, Nov 2025)
    basis: evidence
  security:
    effect: mixed
    size: small
    when: 'No source measures it: a call with side effects classified read-only can run alongside, or
      ahead of, a check it should follow.'
