caveats: 'The current-model accuracy and cost result rests on one study''s first 100 BrowseComp tasks,
  where 68% against 66% is two tasks, and its headline 62.2% compares a full-set run with GPT-5 medium
  against the score OpenAI reported for GPT-5 high in a different harness, not a single-call run (Lin,
  Feb 2026). The speedup depends on the workload: concurrent batches alone gave 1.04x on SWE-bench Lite,
  the 1.40x also needs futures and per-tool read/write declarations, and the same paper''s May 2026 version
  reported 1.44x with a 3.3-point lower resolve rate on GPT-5.2, not significant (Feng, May 2026). The
  loss on dependent calls comes from an LLM-judged benchmark whose same-model ablation gives numbers for
  two of four models (Xu, Nov 2025), the largest speedups are with gpt-3.5-turbo against ReAct (Kim, Dec
  2023), and no source measures races or security effects of a misclassified tool.'
