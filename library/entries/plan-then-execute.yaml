summary: 'Commit the agent''s tool calls, writes above all, from the trusted request before it reads any
  tool output, and have code reject any other write and any write argument the request did not supply.
  On AgentDojo, plan-first designs cut attack success below 1% (0.69% against 13.16% for a tool graph;
  0.52% against 15.62% in an independent test), but a strict plan cost 15 to 43 points of benign utility,
  and where every task needs data-dependent planning they kept 0 to 30% utility against 53% undefended
  (GPT-4o); one design that re-plans only within a tool whitelist kept 51% at 2% attack success in its
  authors'' test. The plan alone does not stop injected data from choosing the values of planned calls:
  a tool graph let 47.92% and 67.36% of parameter-poisoning attacks through, a plan layer added nothing
  over input isolation against task tampering on five current models (7.0% against 6.6%), and branch steering
  reached 89.5% against a plan-first computer-use agent. Checking each write''s recipient, amount, object
  and destination against values the request states let 0 of 13,935 attacks through on 15 open models
  of 1.7B to 35B parameters, at 29.0% utility under attack against 50.2% undefended.'
how: '1. Start from the baseline: your current tool loop (7.d.iii) and, as the cheapest plan-first variant,
  a tool filter that only fixes the tool set from the request (in an independent GPT-4o test it kept 70.10%
  of AgentDojo tasks against 80.41% undefended, at 4.59% average attack success against 23.69%). Run both
  on an injection suite that includes tasks whose actions depend on what the agent reads (AgentDojo has
  only 6 of 97) and attacks that keep the task''s own tools but tamper with the values it needs: undefended
  Claude Sonnet 4.5 held template attacks to 0.87% on a data-dependent benchmark, but planted false amounts,
  rules or state claims still succeeded against it 11.1% of the time (11.1% to 23.2% across five current
  models). 2. Sort your tasks by whether the request alone fixes the actions. Where the next write depends
  on what is read (act on the to-do list in this file), a fixed plan fails: plan-first defenses kept 0
  to 30% utility on such tasks against 53.33% undefended (GPT-4o). Either mark that step in the plan for
  a re-plan that may add only tools from a whitelist fixed up front, with a declared source for each write
  argument (one design kept 51% utility at 2% attack success there, against 53% utility and 39% attack
  success undefended, in its authors'' GPT-4o test), or contain the input (10.c.i) and gate the action
  (10.b.i). 3. Give a planner only the user request, the tool descriptions and trusted context, and have
  it emit the calls in order or as a dependency graph: each node a tool call, each argument a literal
  from the request or a placeholder filled from a named earlier node''s output. Pin the tool descriptions
  it reads, since they are planner input too, and classify each tool as read-only or write in code from
  its name and schema rather than leaving the security decision to the model: tool graphs written by the
  agent''s own model admitted attacks on 13 of 15 open models (1.7B to 35B). Spend on the planner rather
  than the executor: an o4-mini planner over a GPT-4o-mini executor raised utility under attack from 57.07%
  to 64.39% for $7.99 against $6.73, planning being about 20% of tokens (1.b.i). 4. Commit the writes:
  execute in dependency order with a controller that rejects any write not in the plan, so the executor
  may add read-only lookups and fill placeholders but never add, drop or reorder a write. A strict graph
  cost 15.5 points of benign utility (52.58% against 68.04%) and read-only expansion brought it to 64.95%;
  in another study a planner allowed to append writes after reading let 53 of 7,432 attacks through, where
  committed writes let none. Treat the URL or destination of a lookup as a write argument: on eight open
  models a tool graph with read-only expansion let 69 of 168 attacks that fetch an attacker''s URL succeed
  (85 undefended, 0 with destinations checked). Never return raw tool output or error messages to the
  planner to re-plan: in one study an error message and an email that reached the planner each put an
  attacker''s call into the plan. 5. Bound in code what each planned write may do before it runs: every
  argument that decides whom or what it affects (recipient, account, amount, object identifier, channel,
  URL) must equal a value the request states or come from a trusted record named for it, else ask the
  user (free-text bodies such as a message are not covered). The plan alone does not do this: a tool graph
  let 47.92% (Qwen3.6-27B) and 67.36% (GPT-4o) of parameter-poisoning attacks through, against 93.06%
  and 57.64% undefended; against task tampering, in action-level audits of two of the five models (GLM-5 and
  Sonnet 4.5), no plan-position check blocked an attacked call and only the argument checklist blocked
  any (0 of 26 and 3 of 31); branch steering reached 89.5% against a plan-first computer-use agent until per-branch
  constraints took it to 0% at 97% of benign utility. Exact request grounding let 0 of 13,935 attacks
  through across 15 open models (106 of 7,432 without it, on eight of them); budget for confirmations,
  since values that appear only in tool output become questions to the user (8 to 12% of that design''s
  failures, where they went unanswered). Where an injected instruction targets a write tool the plan already
  uses, answer it with a simulated call so the executor fills the real one from the request (attack success
  4.77% to 0.64% in one study). 6. Measure paired against the baseline, same suite and model: benign utility,
  utility under attack, attack success scored on write arguments, confirmation requests, tokens and latency
  per task (a tool graph used 2.4x the input tokens and 1.9x the time, a strict plan-first design 0.54x
  the tokens and 2.7x the time, committed writes with request grounding 17.1k tokens per episode against
  28.0k undefended, whitelisted re-planning 1.87x the time and 4.23x the tokens). Add adaptive attacks
  that reuse planned tools with attacker arguments, tamper with amounts, rules or state the task reads,
  craft values that meet branch conditions, send lookups to attacker URLs and reach the planner through
  errors; in production, monitor rejected calls, confirmation requests and write arguments or lookup destinations
  taken from tool output.'
detect:
  static: Write calls are committed from the request before any untrusted data is read, and the executor
    can add only read-only lookups; read and write tools are classified in code from their schemas; every
    authority argument of a write (recipient, account, amount, object identifier, destination) and every
    lookup destination is checked in code against values the request states or a trusted record, else
    the user is asked; raw tool output and error messages never go back to the planner.
  traces: Executed writes are a prefix of the committed writes, in order; executed calls equal the planned
    calls plus read-only lookups; each write argument and lookup destination traces to the request, a
    trusted record or a user confirmation, not to tool output.
  evals: Injection suite attack success scored on write arguments, benign utility and utility under attack,
    on tasks that include data-dependent ones and attacks that keep the task's tools but change their
    values; confirmation requests, tokens and latency per task.
  probes:
    what: Injected data that tries to add a tool call, change the arguments of a planned call, tamper
      with a value, rule or state the task reads, steer a planned branch, or send a lookup to an attacker's
      URL.
    construct: Documents and tool outputs with instructions to call an extra tool or to send a planned
      write to an attacker's account or URL; planted records that keep the task's tools but assert a false
      amount, policy or state; records that carry the user's own descriptor; crafted values that satisfy
      a branch condition; error messages carrying instructions. Success is no unplanned write and no authority
      argument or lookup destination taken from untrusted data.
  primary:
  - static
  - traces
impact:
  quality:
    effect: mixed
    size: large
    when: benign utility about even for a tool graph with read-only expansion (67.01% against 68.04%)
      and higher under attack (58.77% against 54.30%) (An, Aug 2025), but 40.1% against 59.4% for the
      same design across 15 open models (1.7B to 35B) and 55.7% against 90.7% on the strongest of them
      (Xu, Nov 2026); 37.11% against 80.41% for a strict plan-first design (Ji, Nov 2025); 0 to 30% against
      53.33% on data-dependent tasks (Li, Feb 2026), 51% against 53% with whitelisted re-planning (Wang,
      May 2026); committed writes with request grounding 29.0% under attack against 50.2% (Xu, Nov 2026);
      adding a plan layer to input isolation cut benign completion from 98.0% to 88.9% with no security
      gain (Zhang, Nov 2026); Sonnet-5 in both roles 38.8% against 51.0% with ReAct, but a gpt-5 planner
      lifted a small executor from 23.5% to 36.8% (Zingrillo, Oct 2026)
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: 2.4x the input tokens for a tool-graph design (An, Aug 2025) and 60.5k against 28.0k tokens
      per episode across 15 open models (1.7B to 35B), where committed writes with request grounding used
      17.1k (Xu, Nov 2026); 0.54x the tokens for a strict plan-first design and 0.65x for a tool filter,
      from fewer turns (Ji, Nov 2025); 4.23x for whitelisted re-planning (Wang, May 2026); $0.627 against
      $0.291 per task with Sonnet-5 in both roles, $0.332 with a gpt-5 planner over a locally served executor
