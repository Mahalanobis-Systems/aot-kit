      s against 5.32 s for whitelisted re-planning (Wang, May 2026)
    basis: evidence
  security:
    effect: improves
    size: large
    when: 'attack success below 1% on static benchmarks: 0.69% against 13.16% on AgentDojo (An, Aug 2025);
      0.52% against 15.62% on AgentDojo and 0.00% against 31.04% on ASB (Ji, Nov 2025); 0 of 13,935 with
