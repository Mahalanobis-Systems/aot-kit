caveats: 'Most attack-success numbers here come from static template attacks: the one independent adaptive
  test raised a plan-first design 3.9x (to 1.91%) by reusing planned tools with attacker arguments, and
  an email that reached the planner''s context put an attacker''s tool into the plan in a case study.
  Utility depends on how plannable the tasks are: AgentDojo has 6 data-dependent tasks in 97, and on a
  benchmark where all tasks are, plan-first defenses lost most of their utility; that benchmark shares
  authors with one of the defenses it tests, and the 89.5% branch-steering figure is on its authors''
  own benchmark. A fixed plan does not stop injections in the user prompt (Beurer-Kellner, Jun 2025) or
  in tool descriptions the planner reads, and frontier models already resist template attacks without
  a defense (0.87% for undefended Claude Sonnet 4.5), so the guarantee matters most against attackers
  stronger than today''s benchmarks.'
