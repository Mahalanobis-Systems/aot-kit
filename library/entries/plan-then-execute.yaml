measure:
- method: experiment
  tier: 4
  how: 'paired runs, plan-first against the current loop and a tool filter, same model, on an injection
    suite that includes data-dependent tasks and helpful third-party instructions (AgentDojo or ASB plus
    AgentDyn-style tasks; WASP or STEER-Bench for browser agents) and attacks that keep the task''s tools
    but change their values (task-tampering and parameter-poisoning cases): benign utility, utility under
    attack, attack success scored on write arguments, confirmation requests, tokens and latency per task;
    add adaptive attacks that reuse planned tools with attacker arguments, craft values that meet branch
    conditions, send read-only lookups to attacker URLs and reach the planner through error messages'
- method: monitor
  how: calls the controller rejected as unplanned, writes the executor tried to add, read-only expansions
    per task, confirmation requests for authority values found only in tool output, tasks abandoned because
    the plan did not fit, and write arguments or lookup destinations whose values came from tool output
    rather than the request or a trusted record
