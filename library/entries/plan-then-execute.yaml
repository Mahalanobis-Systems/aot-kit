caveats: 'The plan fixes which tools run, not what values they get: without argument bounds a tool graph
  let 47.92% and 67.36% of parameter-poisoning attacks through and a plan layer added nothing over input
  isolation against task tampering on five current models, while the bounded design''s 0 of 13,935 comes
  from its authors'' test on open models of 1.7B to 35B with thinking off and AgentDojo''s tasks, at 21
  points less utility under attack than undefended. Most attack numbers come from static template attacks:
  the one independent adaptive test raised a plan-first design 3.9x (to 1.91%) by reusing planned tools,
  and an email that reached the planner''s context put an attacker''s tool into the plan in a case study;
  a fixed plan also does not stop injections in the user prompt (Beurer-Kellner, Jun 2025) or in tool
  descriptions the planner reads. Utility depends on how plannable the tasks are: AgentDojo has 6 data-dependent
  tasks in 97, the benchmark built from such tasks shares authors with one of the defenses it tests, the
  89.5% branch-steering figure is on its authors'' own benchmark, and the re-planning design that kept
  utility on data-dependent tasks is its authors'' GPT-4o test, which excluded 2 of 60 tasks and lets
  the re-planner read the observation. Frontier models resist template attacks undefended (0.87% for Claude
  Sonnet 4.5) but not task tampering (11.1%), and no source here compares a plan-first defense with a
  current frontier model running its vendor''s built-in defenses.'
