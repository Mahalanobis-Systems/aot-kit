# 7.a.ii: Prompt chaining with gate checks
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 7.a.ii
legacy_id: P13
slug: prompt-chaining-with-gates
name: Prompt chaining with gate checks
kind: pattern
status: card
tiers:
- tier: 4
  why: it decomposes one call into a gated chain
  proposed: true
levers:
- control-flow
domains:
- general
evidence_domains:
- structured-output
- retrieval
- data-analysis
- code-generation
- reasoning
- incident-response
categories:
- orchestration.route
summary: 'Split a task that decomposes cleanly into fixed steps into a chain of model calls, one goal
  per call, with a gate between steps: a schema check, an assertion, or a run against the real system,
  and an LLM check only for subjective criteria. On a gate failure, rerun only the failed step with its
  output and the error. The trade is latency and tokens for accuracy and inspectable intermediate outputs;
  it pays on tasks beyond what one call does reliably, and less as models improve.'
how: '1. Start from a single call tuned with the same effort; chain only if the task splits cleanly into
  fixed steps. 2. Give each step one goal and a handoff the next step can validate against a schema. 3.
  Gate in code first: schema validation or assertions; where you can, run the output against the real
  system (execute the query) instead of asking the model whether it is valid; use an LLM check with hard
  thresholds only for subjective criteria. 4. On a failure, rerun only the failed step with its previous
  output and the error message; cap retries, then stop or continue with a warning; keep outputs that already
  passed. 5. Run new gates in warn-only mode first and review each halt for false alarms. 6. Log each
  step''s output and gate result; compare the chain with the single call on success, tokens and latency,
  per model.'
detect:
  static: A fixed sequence of model calls with checks between them rather than one prompt.
  traces: Stage outputs; gate failures; retries per stage; the whole chain rerun when one step fails.
  evals: Per-stage and end-to-end quality.
  judge: Rate each stage's output.
  probes:
    what: Inputs that should fail at each gate.
    construct: One adversarial input per gate condition.
  primary:
  - static
  - traces
impact:
  quality:
    effect: improves
    size: medium
    when: 'tasks beyond what one call does reliably: well-formatted JSON 37.6% to 98.8% with assertions
      and retry (DSPy Assertions, 2023); over a tuned single call, orchestration gained at most 4.6 points
      (Leins, Aug 2026); 37% of gate halts were false alarms in one study (Elina, Sep 2026)'
    basis: evidence
  cost:
    effect: degrades
    size: medium
    when: 'more calls: orchestration took about 2 to 4 times the tokens of a single call (Leins, Aug 2026);
      a fixed chain that reran downstream steps cost 1,632 tokens per retry against 904 for one prompt,
      and 436 when only the failed step reran (Asthana, May 2026)'
    basis: evidence
  performance:
    effect: degrades
    size: medium
    when: serial calls; with gates, one model got faster and the other markedly slower (Dhage, Aug 2026)
    basis: evidence
  security:
    effect: improves
    size: small
    when: Gates can check policy.
    basis: assessment
  governance:
    effect: improves
    size: medium
    when: Checkpoints are auditable.
    basis: assessment
  brand:
    effect: improves
    size: small
    basis: assessment
  primary:
  - quality
  - governance
