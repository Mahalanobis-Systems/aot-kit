  date: '2026-08-25'
  task: Wrap an agent in fixed states, output validation, bounded retry, then a schema check on the plan
    before any tool runs
  effect: Validation and bounded retry alone improved reproducibility in one of four model-task cells
    and degraded it in two. With the plan checked against a schema, three of four cells reached a reproducibility
    rate of 1.000 and task success of 100%. Token cost fell in every cell; latency fell for one model
    and rose markedly for the other.
  conditions: Qwen-2.5-7B-Instruct, Gemma-3-27B; synthetic finance and legal tasks; N=100 per cell
  direction: mixed
  measured: true
  locator: Abstract; §6
- source: 'Elina, "Maat: Independent Deterministic Contract-Based Governance for Multi-Agent LLM Workflows",
