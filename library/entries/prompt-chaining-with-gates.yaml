caveats: 'Chains cost latency and tokens: on tasks a current strong model already solved, a three-call
  chain cost 3.2 times as much and took 3.2 times as long for no gain, and a chain that reruns downstream
  steps on a failure can cost more per retry than one prompt. Gates misfire and can mislead retries: in
  one study 37% of halts were false alarms, enough to turn a gain into a loss; in another, a markdown
  fence hid the real violation from the retry message. The benefit depends on the model and shrinks as
  models improve: Anthropic dropped a step-by-step breakdown when a stronger model arrived, tuned single
  calls came within a few points of orchestration, and where a chain did win, the typed gate added at
  most 0.013 F1 over the split alone (7-8B models, one dataset). Several studies are small (one app, one
  run, one benchmark category), and the agent-loop comparison is a single preliminary study on one model.'
