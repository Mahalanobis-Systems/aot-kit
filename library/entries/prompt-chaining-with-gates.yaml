  date: '2026-09-27'
  task: Check every agent-to-agent handoff against a workflow contract in code, with no model in the check
  effect: On paired trials, rubric score +7.7% to +29.1% in five workflows and flat in one; model-call
    cost fell 17-53% where halts came early. Of 94 halts, 35 (37%) were false alarms from validator defects;
