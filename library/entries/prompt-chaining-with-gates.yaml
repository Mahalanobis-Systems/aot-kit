caveats: 'Chains cost latency and tokens, and a fixed chain that reruns downstream steps on a failure
  can cost more per retry than one prompt; rerun only the failed step. Gates misfire: in one study 37%
  of halts were false alarms, enough to turn a gain into a loss. The benefit depends on the model and
  shrinks as models improve: Anthropic dropped a step-by-step breakdown when a stronger model arrived,
  and tuned single calls came within a few points of orchestration. Several studies are small (one app,
  one run).'
