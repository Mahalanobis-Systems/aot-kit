caveats: 'The 2022 gains came from few-shot text prompting on PaLM-540B, and a 2024 study found the interleaved
  reasoning in that template mattered little next to the choice of examples. The newer comparisons are
  single studies with limits: the pipeline that matched the loop on banking cases ran four open models
  with reasoning off, the fixed pipeline the loops beat on SWE-bench ran without its own test validation
  and with one run per pairing, and the compiled plan that beat ReAct needs a trusted API per site, ran
  its compiler inside coding-agent harnesses at high or medium reasoning effort while ReAct called the
  models directly, and cost 2.0 to 4.4 times more. Harness and reasoning effects depend on the model:
  two of three production harnesses were within 5 points on 447 tasks while the third trailed by up to
  9.2, six harnesses spread 28 to 44 points on lightweight models, and switching thinking off cost one
  harness 11 points and moved two others by less than the noise. Every tool result feeds the next action,
  so untrusted content can steer the loop: contain it (10.c.i) or commit to a plan before reading it (6.c.i,
  6.c.ii), and compare harnesses only on large task pools.'
