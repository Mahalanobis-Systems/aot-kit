caveats: 'The 2022 gains came from few-shot text prompting on PaLM-540B, and ReAct alone trailed chain-of-thought
  on HotpotQA; a 2024 study found the interleaved reasoning in that template mattered little next to the
  choice of examples. Whether reasoning between calls helps depends on the model and harness: switching
  thinking off cost one harness 11 points and moved two others by less than the noise. Every tool result
  feeds the next action, so untrusted content can steer the loop: contain it (10.c.i) or commit to a plan
  before reading it (6.c.ii). Harness comparisons need large task pools.'
