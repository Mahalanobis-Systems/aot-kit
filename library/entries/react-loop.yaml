categories:
- orchestration.loop
summary: 'Run the agent as a loop: the model reasons, calls a tool, reads the result and picks the next
  step, until it answers or hits a cap. The loop is the common default for tasks that need several dependent
  tool calls; the 2022 text template (Thought/Action/Observation lines in a few-shot prompt) is not. On
  current models, use native tool calling, carry the model''s reasoning across tool calls, bound the whole
  feedback path, and keep the per-step preamble small: with the model fixed, the harness around the loop
  moved cost per task by up to 3x and pass rate by less than the noise.'
how: '1. Use the provider''s native tool calling, not a text Thought/Action/Observation template. 2. Loop:
  call the model, run every tool call it returns, append each result to the history (errors included,
  as observations), and call again; stop on a final answer or an explicit finish tool. 3. Let the model
  reason before each action (interleaved or adaptive thinking; a think tool on models without it), and
  pass its reasoning back unchanged across tool calls. 4. Cap steps, cost and wall time on the whole feedback
  path, retries and handoffs included; count a cap hit as a failure (7.b.iii sizes the caps, 7.b.i catches stalls).
  5. Keep the per-step preamble (system prompt and tool schemas) small; it is re-sent every step. 6. Paired
  eval against the current design (one call or a fixed workflow), per model: success, steps, cost per
  task, cap-hit rate.'
detect:
  static: A loop that alternates model call and tool dispatch, feeds results back, and has a max-iteration
    guard; check that the guard bounds the whole feedback path (retries, handoffs), not just the outer
    loop.
  traces: Thought before each action; observations used in the next thought; loops that ignore results.
  evals: Success on tool-use tasks; steps per task; tool error rate.
  judge: Do thoughts inform the next action or are they boilerplate.
  probes:
    what: Tasks needing two to four dependent tool calls.
    construct: 'Chain lookups: find X, then use X to fetch Y; the second call cannot be guessed.'
  primary:
  - static
  - traces
impact:
  quality:
    effect: improves
    size: large
    when: 'tasks that need several dependent tool calls: text-to-SQL 45.9 to 72.2 on EHR-SQL over a single
      shot, but 78.5 to 79.1 on BIRD (Lu, Aug 2026); ALFWorld 71 against 45 for acting without reasoning
      (Yao, 2022)'
    basis: evidence
  cost:
    effect: degrades
    size: medium
    when: one model call per step, each re-sending the preamble and history; with the model fixed, cost
      per task differed by up to 3x across harnesses (Liu and Han, Oct 2026)
    basis: evidence
  performance:
    effect: degrades
    size: medium
    when: serial round trips, one per step
    basis: evidence
  security:
