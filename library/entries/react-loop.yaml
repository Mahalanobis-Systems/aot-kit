      Maps tasks +9 to +28 points for loops keeping the full history (Khoee, Oct 2026). No gain over a
      one-decision pipeline when lookups can be precomputed (88.8% against 90.5%, Huyut, Nov 2026); a
      compiled plan beat ReAct by 11.1 points on web tasks with a trusted API (Chow, Nov 2026)'
