    size: medium
    when: Autonomous tool actions need scoping.
    basis: assessment
  governance:
    effect: mixed
    size: medium
    when: Every action must be logged to be auditable.
    basis: assessment
  brand:
    effect: none
    basis: assessment
  primary:
  - quality
  - performance
