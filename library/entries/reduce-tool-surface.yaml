  direction: supports
  measured: true
- source: Repantis et al., "How Many Tools Should an LLM Agent See? A Chance-Corrected Answer", https://arxiv.org/abs/2605.24660
  date: '2026-05-23'
  task: Show an adaptive shortlist of tools rather than a fixed top-k
  effect: 'Registries of 20-3,251 tools, chance-corrected coverage metric, RL-trained adaptive-depth selector:
    BFCL (370 tools) 90.3% coverage while showing about 7 tools, against 90.8% at fixed depth; hard ToolBench
