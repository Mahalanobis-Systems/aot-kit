# 2.a.i: Reduce the tool surface: remove and consolidate tools, then defer the rest behind search
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 2.a.i
legacy_id: T60
slug: reduce-tool-surface
name: 'Reduce the tool surface: remove and consolidate tools, then defer the rest behind search'
kind: technique
status: card
tiers:
- tier: 1
  why: removing tools that are never called, verified unchanged on the hand-labeled set
- tier: 3
  why: consolidating or deferring changes what the model sees and chooses
levers:
- tool-surface
- context
domains:
- tool-use
evidence_domains:
