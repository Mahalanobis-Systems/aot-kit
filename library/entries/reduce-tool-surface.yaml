- source: 'Yitian Zheng, Zhaorun Chen, Haoyu Li, Bo Li, "GatewayBench: Unified Capability and Security
    Evaluation Platform for MCP Gateways", https://arxiv.org/abs/2610.23449'
  date: '2026-10-16'
  task: 'Compare MCP gateways that list every connected tool (flattened: AgentCore, Agentgateway, LiteLLM,
    Lunar MCPX) with gateways that expose discovery meta-tools (hierarchical: Enkrypt layered discovery,
    Strata search, Bifrost virtual filesystem) as 0, 500, 1,000 or 1,500 task-irrelevant real MCP tool
    definitions are added, on benign and attack tasks'
  effect: 'Benign task success, flattened against hierarchical means, 0 to 1,500 added tools: GPT-5.4
    87.2% to 83.3% against 85.1% to 85.6%; GPT-5.1 75.3% to 65.3% against 47.5% to 42.0%; OpenClaw with
    GPT-5.1 86.7% to 80.7% against 71.8% to 68.0% (the layered-discovery gateway fell to 23.3% with GPT-5.1,
    calling hallucinated tools). Tokens per turn (GPT-5.4) 8.3k to 233.3k flattened against 9.1k to 12.6k
    hierarchical; task time 20.8 s against 30.1 s with no added tools and 64.1 s against 38.7 s at 1,500,
    the advantage reversing between 500 and 1,000. Indirect attack success with no added tools 47.2% against
    30.9% (GPT-5.4) and 42.5% against 15.6% (OpenClaw); tool-injection attack success (OpenClaw, GPT-5.1)
    51.5% falling to 40.6% for flattened gateways as tools were added against about 16% (15.4% to 17.1%)
    for hierarchical ones, with no separation for injection through environment content; under GPT-5.4
    tool injection 53.9% to 45.1% against about 31%, and among hierarchical gateways about 20% (Bifrost)
    to 41% (Enkrypt). Direct prompt injection (GPT-5.4) 44.2% against 44.7%.'
  conditions: 450 DTap tasks in CRM, finance and travel (150 benign, 150 direct-attack, 150 indirect-attack)
    with judges that check the final environment state; added tools are mock definitions from 251 real
    MCP servers (11,118 tools) filtered to be unrelated to the task domain; GPT-5.1 and GPT-5.4 with the
    OpenAI Agents SDK, GPT-5.1 with OpenClaw; default gateway settings; single run; the authors read the
    low attack rates under GPT-5.1 with the Agents SDK as capability collapse; a smaller MCP-Universe
    check (158 to 358 added tools, three gateways) was flat; independent
  direction: mixed
  measured: true
  locator: §3 Table 1; §5.1; §5.2 Table 2, Table 3, Figure 4, Figure 5; App A.1-A.3
- source: 'Sam Partee, River Stevens, Thierry Damiba, Valerie Fanelle (Arcade.dev), "Tool Recommendation
    for Multi-Step Agents: Finding Every Tool a Task Needs", https://arxiv.org/abs/2610.23707'
  date: '2026-10-16'
  task: Replace a 100-tool static list with three gateway meta-tools over an 8,200-tool catalog (SelectTools
    returns the five top-ranked full definitions per task description, UseTool runs one under the user's
    own credentials, ListApps lists reachable apps; 993 tokens of definitions with the auth tool), and
    compare paired end-to-end sessions
  effect: 'Against the 100-tool list: input tokens -17.2% [-25.3, -8.6] and total bill -5.5% [-12.0, +1.3]
    with Codex (327 pairs), -39.6% [-49.3, -24.5] and -21.8% [-28.9, -10.9] with Claude Code (81 pairs);
    bill -13.6% [-18.4, -7.4] across both, lower in all 14 runs (2.6% to 40.0%); completion 276 against
    273 of 327 (McNemar p = 0.80) and 74 against 76 of 81. Median input change by searches per workflow:
    one search -28.2% (n = 153), three +32.3%, four or more +43.8%; on 14 short lookups against catalogs
    of 8-37 tools, +22.0%. 85% (search) and 87% (static) of Codex input was served from cache, so "a 17%
    to 40% cut in input tokens became a 5% to 22% cut in the bill". The first search covered every required
    tool in 304 of 327 Codex sessions; of 24 missed required calls, 13 were never returned by any search,
    10 came back later for a task the first call never asked about, and one was a ranking error. Cost
    model: a static list is cheaper below about 25 to 28 tools or above about 0.63 searches per tool call.
    ToolRet Completeness@10 45.2 against 28.8 for BM25.'
  conditions: Codex 0.144.6 with gpt-5.6-luna (30 workflows, 11 runs) and Claude Code 2.1.291 with Sonnet
    5, its own tool search off (34 workflows, 2-3 runs), in a seeded tenant (Gmail, Slack, Drive, Salesforce,
    Jira, Confluence, Zendesk); list prices; in the Claude Code runs the search arm also kept tool results
    over 14 KB out of context (the 40.0% bill cut is the large-result run, -7.9% on the 21 suite workflows);
    the break-even is modeled and assumes large results kept out of context; the vendor's own system,
    not reproducible outside it
  direction: supports
  measured: true
  locator: §2.1-2.3; §3.2-3.4; §4.1-4.3, Table 3, Figure 3; §5; App A Table 4
- source: 'Zichuan Xu, Yuyang Dong, Makoto Onizuka, Chuan Xiao, "ToolBottleneckBench: Measuring Tool-Agent
    Performance under Controlled Pressures and Fixed Harness Budgets", https://arxiv.org/abs/2610.21098'
  date: '2026-10-15'
  task: Vary only the number of tool schemas the model sees (8, 32, 128; the added tools are near-duplicates
    of the needed ones that never return a record) on fixed tasks, record which harness limit ended each
    failed episode, and raise the per-request completion cap to test the menu penalty
  effect: 'Growing the visible menu from 8 to 128 schemas changed verified task success by -12.3 pp [-14.6,
    -9.9] with the menu narrowed after the first operational call and -17.5 pp [-20.2, -14.9] with the
    full menu kept visible; 34 of 36 families degraded. Episodes cut off at the 1,024-token completion
    cap rose from 1.6% to 13.6%, 391 of 411 truncated episodes at 128 schemas ended before any call, and
    70.2% of truncated first responses held only reasoning tokens; within pairs that neither menu truncated
    the effect was -1.5 pp; the 8 configurations that never truncated ranged -2.1 to +2.8 pp, and in the
    6 truncation-heavy configurations a 16,384-token cap moved the penalty from -43.7 to -2.7 pp [-4.7,
    -0.9]. Per configuration (narrowed menu): Claude Opus 5.5 0.0, GPT-6.1 Sol 0.0, Claude Sonnet 5 -9.0,
    DeepSeek V4 Pro -24.3, Gemini 3.8 Flash -52.1, GLM-5.3 -53.5. Mean prompt tokens per episode (full
    menu) 15,714 at 8 schemas and 37,659 at 128. At 2,048 registered tools the required tools were in
    19.4% of a flat lexical retriever''s 16-tool shortlists and 77.8% of a connector-first router''s.
    On ToolSandbox, exposing all tools instead of the authored scope changed full success by -2.9 pp [-7.0,
    0.5] and added 16,916 tokens per episode.'
  conditions: 21 model and provider configurations from 7 organizations; 36 synthetic enterprise task
    families (accounting, email, file, calendar) graded exactly; frozen budgets (1,024-token completion
    cap, 128,000-token episode budget); one run per configuration per core cell (repeats disagree on 12.1%
    of conditions); the narrowed menu uses the ground truth (oracle-assisted); the 16x sweep covers 8
    configurations; independent
  direction: mixed
  measured: true
  locator: §3.2-3.3, Table 1; §5.1-5.3, Figure 2; App C Table 4; App E.1 Table 9; App K Table 14
- source: 'Demetris Paschalides, Moysis Symeonides, George Pallis, Marios D. Dikaiakos, "MCP-GRANITE Benchmark:
    GRANularity Interface TEsting for MCP-Based LLM Agents", https://arxiv.org/abs/2609.24161'
  date: '2026-09-21'
  task: 'Expose the same capability set over MCP at four granularities with the same prompts: 8-10 single-purpose
    tools, 4 task-level tools grouped by task class, 2 tools split into read and write with an action
    parameter, or one catch-all tool'
  effect: 'Task completion (mean over nine models, 95% CI): 4 tools 0.49 [.39, .59], 8-10 tools 0.42 [.31,
    .52], 2 tools 0.42 [.32, .53], 1 tool 0.36 [.25, .50], reported as +16.4% over 8-10 tools and +33.6%
    over one tool; argument accuracy 0.40 against 0.20 for 8-10 tools; runs ending without any tool call
    10.7%, 10.2%, 14.6% and 28.2%; tool-selection F1 highest with 2 tools (0.71). Four tools gave the
    highest completion for 8 of 9 models; in a logistic regression with model size, quantization, domain
    and difficulty, four tools raised completion odds 1.36x [1.12, 1.66] and one tool lowered them 22%.
    "A 3.2B model at the optimal granularity outperforms a 20.9B model at a mismatched one."'
  conditions: Nine locally served quantized models from 268M to 20.9B parameters (Qwen3 14.8B, Llama 3.2
    3.2B, GPT-OSS 20B and others) on Ollama with a T4 GPU, Google ADK agent; 81 scenarios in 9 edge and
    IoT domains on mock MCP servers; 3 repetitions, 8,748 runs; at most 10 tools; independent
  direction: supports
  measured: true
  locator: §III-A; §V-B Table II, Table III; §V-C
