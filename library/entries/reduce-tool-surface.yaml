  date: '2026-01-06'
  task: Sync MCP tool descriptions to per-server folders
  effect: '"In an A/B test, we found that in runs that called an MCP tool, this strategy reduced total
    agent tokens by 46.9% (statistically significant, with high variance based on the number of MCPs installed)."
    No n, model or quality metric given.'
  direction: supports
  measured: true
  locator: 4. Efficiently loading only the MCP tools needed; footnote 1
- source: 'Adam Jones, Conor Kelly (Anthropic), "Code execution with MCP: Building more efficient agents",
