summary: 'Give an agent only the tools its tasks need, and put the rest behind tool search once the catalog
  is large. Remove tools no task uses, then merge overlapping ones into a few task-level tools (rewording
  cannot separate tools that genuinely overlap), but not into one catch-all tool: four task-level tools
  beat both 8-10 single-purpose tools and a single tool for small local models. Every listed tool costs
  tokens on every turn and costs some models accuracy: a related but unnecessary tool cut six models''
  pooled answer rate on questions they could answer unaided from 98.2% to 63.5% (two were unaffected),
  and growing the list from 8 to 128 tools cost 12.3 to 17.5 points across 21 current model configurations,
  mostly in those where the longer list used up a tight output cap (their 43.7-point loss fell to 2.7
  once the cap was raised sixteenfold). Deferral pays at scale with a capable model (12.6k against 233.3k
  tokens per turn with 1,500 extra tools, success held level, fewer successful tool-injection attacks),
  but a weaker model lost 14.9 to 27.8 points driving discovery, search is slower and dearer on small
  catalogs (break-even about 25-28 tools in one vendor''s cost model) and when the agent searches three
  or more times, and under prompt caching token savings overstate the bill (17.2% fewer input tokens,
  5.5% lower bill), so consolidate first and measure per model.'
how: '1. Start from the baseline, per model: from traces over the eval set, list each tool''s call count,
  the cases where it was needed, wrong-tool calls, tokens of tool definitions per request, searches per
  task, latency, billed cost with prompt caching on, and responses cut off at the output cap before any
  call. 2. Remove tools with no calls and no needing case, and tools the agent''s credentials cannot use.
  Do not leave a tool in tasks it does not serve: a related but unnecessary tool cut six models'' pooled
  answer rate on questions they could answer unaided from 98.2% to 63.5% (two models were unaffected);
  where it must stay, a one-sentence note on its scope raised the answer rate by up to 45.6 points in
  that study (2.b.ii). 3. Consolidate: find overlapping pairs (similar names or descriptions, or cases
  routed to the wrong one of the pair) and merge them; rewording cannot separate tools whose scopes genuinely
  overlap (2.a.ii). Group by task class, with an action or method parameter for closely related operations,
  but do not collapse a server into one catch-all tool: across nine small local models, four task-level
  tools completed 0.49 of tasks against 0.42 for 8-10 single-purpose tools, 0.42 for one read and one
  write tool, and 0.36 for a single tool, with which 28.2% of runs called no tool. 4. If what remains
  is still large, keep a small core of frequently used tools loaded and defer the rest behind tool search,
  per-server files or expandable groups of under about 10 tools each. Thresholds differ: Anthropic recommends
  deferral from 10 tools or 10k tokens of definitions; one vendor''s cost model puts the break-even against
  a static list at about 25-28 tools; in one benchmark GPT-5.4 lost 0.5 points with 1,000 unrelated tools
  listed (87.2% to 86.7%) and 3.9 at 1,500, while tool search held level. First check that the model can
  drive discovery: with GPT-5.1, gateways that exposed tools through discovery scored 14.9 to 27.8 points
  below flat lists on the same tasks, while with GPT-5.4 they matched (85.1% against 87.2%). 5. Check
  search on your own requests: build probes from real multi-step tasks, label the full set of tools each
  needs (including the tools that produce the IDs later calls consume), and score completeness (every
  needed tool returned), not recall. At 2,048 registered tools a flat lexical retriever returned the needed
  tools in 19.4% of its shortlists against 77.8% for a router that picked the server first; one vendor''s
  ranker covered every needed tool on the first search in 304 of 327 sessions, most misses coming from
  how the agent split the task. Count searches per task: against a 100-tool list one search cut session
  input a median 28.2%, while three or more raised it 32.3% to 43.8%. 6. Keep the prompt cache intact:
  keep the loaded core and the order of definitions fixed, and add discovered tools by appending (deferred
  loading, a tool-addition block) rather than rebuilding the list mid-session (3.b.ii, 3.b.i). Judge cost
  in dollars with caching on: with 85% to 87% of input served from cache, 17.2% fewer input tokens became
  a 5.5% lower bill (an interval that includes zero). 7. Measure with a paired eval per model, old tool
  set against new (and flat list against search where deferring), several runs per arm: success, search
  completeness, wrong-tool calls, calls and searches per task, tokens, billed cost, latency, and responses
  truncated at the output cap. Give reasoning models enough output budget for the tool list before blaming
  the tools: with a 1,024-token cap, going from 8 to 128 tools cost six truncation-heavy configurations
  43.7 points, against 2.7 at 16,384. Where MCP servers come from third parties, add tool-injection probes:
  in one benchmark, gateways that exposed tools through discovery held tool-injection attack success at
  about 16% against 40.6% to 51.5% for flat lists with GPT-5.1, and about 31% against 45.1% to 53.9%
  with GPT-5.4; with GPT-5.1 discovery also cost up to 5.5 points of task success.'
detect:
  static: more than about 10 tools, or more than about 10k tokens of tool definitions, in every prompt;
    an MCP client or gateway that sends every connected server's tools on every request; duplicate or
    near-duplicate tool names or descriptions (73% of audited MCP servers have repeated names); tools
    the agent's credentials cannot use; a whole server collapsed into one catch-all tool
  traces: tools never called across the eval runs; tool-use coverage below the eval's needs (share of
    needing cases where the right tool was loaded and chosen; GitHub measured 69% for a static list);
    calls to a tool where none was needed; failure rows labeled incorrect-tool-selection concentrated
    on one pair of tools; first responses cut off at the output cap on long tool lists; three or more
    tool searches per task, or needed tools that search never returned
  evals: accuracy falling as tools are added (an ablation over catalog size, with unrelated and with near-duplicate
    tools); paired eval, current tool set against a reduced one; completeness of tool search on labeled
    multi-tool requests
impact:
  quality:
    effect: improves
    size: medium
    when: GitHub +2-5 points on SWE-bench with 40 to 13 tools (Nov 2025); Anthropic tool search 49% to
      74% (Opus 4, Nov 2025); 8 to 128 listed tools -12.3 points across 21 configurations, -43.7 to -2.7
      in truncation-heavy ones once the output cap was raised sixteenfold, 0.0 for Claude Opus 5.5 and
      GPT-6.1 Sol (Xu, Oct 2026); flat lists -3.9 to -10.0 points at 1,500 extra tools while tool search
      held level, but tool search 14.9-27.8 points below flat lists with GPT-5.1 (Zheng, Oct 2026); four
      task-level tools 0.49 task completion against 0.42 for 8-10 tools and 0.36 for one tool on small
      local models (Paschalides, Sep 2026); a related unnecessary tool cut the pooled answer rate from
      98.2% to 63.5% (Paturi, Sep 2026)
    basis: evidence
  cost:
    effect: improves
    size: medium
    when: tool-definition tokens -85% (Anthropic, Nov 2025); agent tokens -46.9% in an A/B (Cursor, Jan
      2026); 12.6k against 233.3k tokens per turn with 1,500 extra tools (Zheng, Oct 2026); against a
      100-tool list, input -17.2% but bill only -5.5% under prompt caching with Codex (-39.6% and -21.8%
      with Claude Code, which also offloaded large results), while short lookups over 8-37 tools used
      22.0% more input and three or more searches 32.3-43.8% more (Partee, Oct 2026, vendor's own system)
    basis: evidence
  performance:
    effect: mixed
    size: medium
    when: consolidation faster (GitHub -400 ms response time, Nov 2025); tool search slower with no extra
      tools (30.1 s against 20.8 s per task) and faster at 1,500 (38.7 s against 64.1 s), crossing between
      500 and 1,000 (Zheng, Oct 2026); dynamic toolsets 2-3x calls and about 50% slower (Speakeasy, Nov
      2025)
    basis: evidence
  security:
    effect: improves
    size: medium
    when: 'gateways exposing tools through discovery: tool-injection attack success about 16% against
      40.6-51.5% for flat lists (GPT-5.1) and about 31% against 45.1-53.9% (GPT-5.4), no difference for
      injection through returned content or the user prompt, and a spread across discovery designs (about
      20-41%) as wide as the gap (Zheng, Oct 2026; one benchmark, single run)'
    basis: evidence
  governance:
    effect: unknown
  brand:
    effect: unknown
  primary:
  - quality
  - cost
