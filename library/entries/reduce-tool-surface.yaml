  effect: '"This lets the agent load only the definitions it needs for the current task. This reduces
    the token usage from 150,000 tokens to 2,000 tokens, a time and cost saving of 98.7%." (single Google
    Drive to Salesforce example; model not stated.) Cloudflare reports similar findings ("Code Mode").'
  direction: supports
  measured: true
  locator: Code execution with MCP improves context efficiency
