caveats: 'Most numbers come from one study each, often on synthetic tasks or mock servers with single
  runs (the menu-size and gateway benchmarks), small local models (the granularity study) or older models
  (the unnecessary-tool study), and many are vendors measuring their own products (Anthropic, GitHub,
  Cursor, Speakeasy, Arcade). How much an extra tool costs depends on the model, its output budget and
  how close the tool is to the needed ones: 1,500 unrelated tools cost GPT-5.4 3.9 points, 120 near-duplicate
  tools cost Claude Opus 5.5 and GPT-6.1 Sol 0.0 points, and a related unnecessary tool left two of six
  models unaffected while cutting another''s answer rate by 76 points. Deferral has failure modes of its
  own: weaker models fail to drive discovery, retrievers miss needed tools (a flat lexical retriever had
  them in 19.4% of its shortlists at 2,048 tools), each search re-sends the conversation, and token savings
  shrink in dollars under caching. Exposing tools through discovery lowered tool-injection attack success
  in one benchmark, but the spread between discovery designs (about 20% to 41%) was as wide as the gap
  to flat lists, and it did nothing against injection through what tools return.'
