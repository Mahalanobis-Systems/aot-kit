# 2.a.i: Reduce the tool surface: remove and consolidate tools, then defer the rest behind search
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 2.a.i
legacy_id: T60
slug: reduce-tool-surface
name: 'Reduce the tool surface: remove and consolidate tools, then defer the rest behind search'
kind: technique
status: card
tiers:
- tier: 1
  why: removing tools that are never called, verified unchanged on the hand-labeled set
- tier: 3
  why: consolidating or deferring changes what the model sees and chooses
levers:
- tool-surface
- context
domains:
- tool-use
evidence_domains:
- tool-use
- code-generation
categories:
- tools.refactor
- context.filter-input
summary: 'Offer the agent only the tools the task needs. First remove tools no task uses; then consolidate
  tools with overlapping scopes (read and write tools with a method parameter, tools grouped around jobs),
  because rewording cannot separate tools that genuinely overlap. Then keep a small core always loaded
  and defer the rest: names and one-line purposes in the prompt, full definitions loaded on demand through
  tool search, per-server files or expandable groups. Defer once definitions exceed about 10k tokens or
  10 tools; keep deferred groups under about 10 tools each. Every tool offered has a cost even when not
  called: one irrelevant tool cut accuracy from 98.2% to 63.5%. Deferral costs extra calls (2-3x) and
  time (about 50%), so consolidate first.'
how: 1. From traces over the eval set, list each tool's call count and the cases where it was needed.
  2. Remove tools with no calls and no needing case. 3. Find overlapping pairs (similar names or descriptions,
  or cases routed to the wrong one of the pair) and merge them; a method parameter often replaces several
  tools. 4. If what remains exceeds about 10 tools or 10k tokens, keep a core loaded and defer the rest
  behind search or expandable groups. 5. Run the paired eval, old set against new, and compare coverage,
  success, calls and latency.
detect:
  static: more than about 10 tools, or more than about 10k tokens of tool definitions, in every prompt;
    duplicate or near-duplicate tool names or descriptions (73% of audited MCP servers have repeated names);
    tools the agent's credentials cannot use
  traces: tools never called across the eval runs; tool-use coverage below the eval's needs (share of
    needing cases where the right tool was loaded and chosen; GitHub measured 69% for a static list);
    calls to a tool where none was needed; failure rows labeled incorrect-tool-selection concentrated
    on one pair of tools
  evals: accuracy falling as tools are added (an ablation over catalog size); paired eval, current tool
    set against a reduced one
impact:
  quality:
    effect: improves
    size: medium
    when: GitHub +2-5 points on SWE-bench with 40 to 13 tools (Nov 2025); Anthropic tool search 49% to
      74% (Opus 4); one irrelevant tool cost 34.7 points on questions answerable without tools (Sep 2026)
    basis: evidence
  cost:
    effect: improves
    size: large
    when: definitions -85% (Anthropic); -46.9% tokens (Cursor A/B); deferral alone raises call count
    basis: evidence
  performance:
    effect: mixed
    size: medium
    when: consolidation faster (GitHub -400 ms); deferral about 50% slower with 2-3x calls (Speakeasy)
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
measure:
- method: verify-fix
  tier: 1
  how: replay the hand-labeled set after removing unused tools
- method: experiment
  tier: 3
  how: 'paired eval, old tool set against new: success, coverage, calls, latency'
