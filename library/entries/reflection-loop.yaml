caveats: Most of the evidence is math, code and puzzles with ground truth; the form-critique gains come
  from Self-Refine's 2023 GPT-3.5 and GPT-4 runs against one-step generation, not against best-of-N at
  equal compute, and no source here measures the loop's wall-clock latency (only calls, steps and tokens).
  Reflexion's signals are sometimes close to an oracle (HotpotQA graded by exact match against the gold
  answer), its HumanEval gain did not hold against plain retries in an independent rerun, and the one
  current-model test against fresh retries (three low-cost models with thinking off, 100 WebShop goals,
  six trials) found gains on two models and a loss on the third, while the agent-summary result is a 100-task
  ablation without intervals inside a paper proposing a parallel-plus-sequential method. The supporting
  2026 study runs at temperature 0 against a single zero-shot answer with no sampling baseline, and the
  29-model study mixes protocols across settings, its largest gain starting from an unusually low 17.44%
  on GSM8K. The two 2026 self-review studies measure error detection, not the accuracy of a revise loop
  (one at low reasoning effort, one with simple single-turn prompts), and trained self-correction (SCoRe)
  is the one result where same-model revision beat parallel sampling at the same number of samples, but
  it needs multi-turn RL on the model itself.
