caveats: Most of the evidence is math, code and puzzles with ground truth; the form-critique gains come
  from Self-Refine's 2023 GPT-3.5 and GPT-4 runs against one-step generation, not against best-of-N at
  equal compute, and no source here measures the loop's latency. Reflexion's signals are sometimes close
  to an oracle (HotpotQA graded by exact match against the gold answer), and its HumanEval gain did not
  hold against plain retries in an independent rerun. The supporting 2026 study runs at temperature 0
  against a single zero-shot answer with no sampling baseline, and the 29-model study mixes protocols
  across settings, its largest gain starting from an unusually low 17.44% on GSM8K. Trained self-correction
  (SCoRe) is the one result where same-model revision beat parallel sampling at the same number of samples,
  but it needs multi-turn RL on the model itself.
