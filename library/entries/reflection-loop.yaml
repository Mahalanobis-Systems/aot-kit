    answer and written solution (told not to revise it); confidence is scored as an error detector (AUROC),
    and questions are split into easy and hard by whether a separate reference model solved them; GPT-5.6
    Sol and Gemini 3.8 Flash also rate each other's answers
  effect: 'Review moved AUROC beyond sampling error in 22 of 46 model-benchmark pairs, raising it in 13
    and lowering it in 9, by up to +0.27 and -0.09 (Gemini 3.8 Flash on LiveCodeBench v6 0.542 to 0.815).
    On MATH-500, GPT-5.6 Sol (96.8% correct) went from near chance to 0.989: 14 of its 16 errors fell
    from 100% to 0% confidence, and in 13 of those the written solution already contradicted the answer.
    Hard questions were 14% to 18% of answers but 47% to 77% of errors; within them answer-time AUROC
    was 0.49 to 0.63 and "no confidence setting lifts it above 0.64 for any model"; review moved within-hard
    AUROC by -0.027 to +0.022 for three models and from 0.486 to 0.524 (+0.038) for Gemini 3.8 Flash.
    In cross-review, a wrong answer matching the evaluator''s own got 94.0% (GPT) and 86.9% (Gemini) confidence
    against 78.0% and 68.8% for a correct answer the evaluator had missed, and a second model raised AUROC
    only where it had answered correctly (+0.083 and +0.070; -0.007 and -0.113 where it had also erred).'
  conditions: GPT-5.6 Sol and Grok 4.6 at low reasoning effort, Qwen3.8-27B (thinking, some retries with
    thinking off) and Gemini 3.8 Flash; 38,238 items per model from 15 benchmarks (knowledge, math, reasoning,
    code, multimodal, long-context); review is confidence on a fixed answer, not a revision, and its prompt
    names the answer as the model's own; difficulty set by Gemini 3.7 Flash
  direction: mixed
  measured: true
  locator: §2.1-2.5; Figures 2-4; Appendix A.6, F.2-F.3
- source: 'Yu Bai, Yukai Miao, Dawei Wang, et al., "VRL-Bench: Benchmarking agents on computer control
    tasks under finite trial budgets", https://arxiv.org/abs/2609.12404'
  date: '2026-09-11'
  task: Reflexion (a reflection written after each failed trial and passed with earlier ones to the next
    trial) against memory-free retry under the same six-trial and interaction budgets, all conditions
    sharing the first trial, on MiniWoB and WebShop; then a replay sweep in Reflexion's own ALFWorld and
    HotPotQA settings that withholds the stored reflections from the next trial with probability 0, 0.25,
    0.5, 0.75 or 1
  effect: 'Success within six trials, retry against Reflexion: MiniWoB DeepSeek-V4-Flash 87.3 vs 88.9,
    GPT-5.4 nano 82.5 vs 85.9, GLM-4.7-FlashX 82.5 vs 81.2; WebShop 45.0 vs 51.0, 39.0 vs 55.0 (+16 points,
    95% CI [+8, +25]) and 50.0 vs 46.0. "None of the three existing verbal updates improves SR@6 over
    memory-free retry in every setting." Per WebShop task, retry against Reflexion: 39,118 vs 120,545,
    21,703 vs 78,506 and 46,880 vs 96,955 tokens (2.1 to 3.6 times); 18.79 vs 32.76, 15.34 vs 26.03 and
    21.73 vs 32.95 model calls (15.3 to 21.7 against 26.0 to 33.0). Replay with a GPT-4o-mini actor: on
    ALFWorld full replay reached 76.1% at trial 3 and plateaued, withholding the reflections a quarter
    of the time reached 81.3% and no replay 74.6% (mean cumulative success +7.1 points over no replay,
    95% CI [+0.9, +13.3]); on HotPotQA full replay finished at 49% against 50% with no replay.'
  conditions: DeepSeek-V4-Flash, GPT-5.4 nano and GLM-4.7-FlashX with thinking disabled (GPT-5.4 nano
    at effort none); MiniWoB 640 cases (64 task families x 10 seeds), WebShop first 100 human-test goals;
    six trials, stop at first success; trials and interactions matched, tokens and calls not; replay sweep
    134 ALFWorld and 100 HotPotQA cases, 3,324 episodes, one model; the authors' own scheduler (VEX2)
    is not counted here
  direction: mixed
  measured: true
  locator: §2.2; §3 Table 1, Figure 2; §4 Figure 4; Appendix D.6, D.10 Tables 11-12
- source: Joongwon Kim, Wannan Yang, Kelvin Niu, et al. (Meta Superintelligence Labs), "Scaling Test-Time
    Compute for Agentic Coding", https://arxiv.org/abs/2604.16529
  date: '2026-04-16'
  task: Coding agents run 16 rollouts per task; each rollout is turned into a structured summary (hypotheses,
    progress, failure modes) and a second round of 16 rollouts starts in fresh containers conditioned
    on the rollout's own summary (single-rollout), on 4 random first-round summaries (random-K) or on
    4 picked by tournament voting over summaries (select-K)
  effect: 'Mean pass@1 on 100 SWE-bench Verified tasks, first round to second: Claude-4.5-Sonnet 69.87
    to 70.87 with its own summary, 75.06 with random-K and 78.06 with select-K; Gemini-3.1-Pro 72.69 to
    73.75, 76.94 and 79.25 (gains of +1.00 and +1.06 with the own summary, +5.19 and +4.25 with random-K,
    +8.19 and +6.56 with select-K). With its own summary Claude-4.5-Sonnet passed all 16 runs on 40 of
    100 tasks against 51 with four random summaries. The full pipeline (select-K, a second round, a tournament
    pick of the final rollout) raised Claude-4.5-Opus from 70.94 to 77.60 on SWE-bench Verified and 46.95
    to 59.09 on Terminal-Bench v2.0, and its second-round rollouts took 14.31 steps against 41.23.'
  conditions: Claude-4.5-Opus, Claude-4.5-Sonnet, Gemini-3.1-Pro, Gemini-3-Flash, GPT-5 (0825); mini-SWE-agent
    on SWE-bench Verified, Terminus 1 on Terminal-Bench v2.0; reasoning settings not stated; the summary
    ablation uses two models and 100 tasks, N=16, K=4, no intervals, and runs the second round for passing
    rollouts too; the full pipeline is the authors' method and is compared with single attempts, not with
    best-of-N at equal rollouts
  direction: mixed
  measured: true
  locator: §2.2-2.4; §3.2.2 Table 1, Figure 7; §3.3 Tables 3-4
- source: 'Dipika Khullar, Jack Hopkins, Rowan Wang, Fabien Roger, "Self-Attribution Bias: When AI Monitors
    Go Easy on Themselves", https://arxiv.org/abs/2603.04582'
  date: '2026-03-04'
  task: The same model rates an action or code patch for correctness or risk in the turn that produced
    it, in a follow-up turn after it (implicit self-attribution), or with the identical artifact presented
    in a new context inside a user turn (baseline), on its own outputs (on-policy) and on fixed ones (off-policy)
  effect: 'Models "rate their own actions as safer and more correct than identical content with no implicit
    attribution", most when "the generation and the rating happen in the same turn". SWE-bench patch correctness:
    ratings separated passing from failing patches at AUROC 0.99 in the baseline format against 0.89 (same
    turn) and 0.92 (previous turn) on-policy, while off-policy both self-attributed formats scored 0.99,
    so static monitor evaluations miss the drop. "In one of our settings, self-attribution bias makes
    it 5 times more likely that a monitor approves a code patch that followed a prompt injection." In
    computer-use settings self-favoring reversals were 5 to 10 times more common than the reverse; changing
    Claude-Sonnet-4''s reasoning budget "has no consistent effect"; stating authorship explicitly barely
    moved scores. The authors call the failures "relatively easy to avoid by pulling the transcript and
    action to be classified in a new context".'
  conditions: '10 models: Claude-3.5-Haiku, Claude-4-Sonnet, Claude-4.1-Opus, Gemma-3-27B, Gemini-2.5-Pro,
    GPT-OSS-20B and 120B, GPT-4o, GPT-5-Nano, GPT-5-Mini, GPT-5; SWE-bench patches checked by tests, SWE-bench
    issues with injected unsafe comments, computer-use and email-leak scenarios, MMLU and ethics questions;
    detection only, no revision; the authors call their datasets and prompts simple and did not study
    long multi-turn agents'
  direction: contradicts
  measured: true
  locator: Abstract; §1; §3.1-3.3; §4.1-4.3, Figures 2-7; §5
