  effect: 'ALFWorld: ReAct + Reflexion completed "130 out of 134 tasks"; the ReAct-only agent, which also
    reset and retried, stopped improving: "performance increase halts between trials 6 and 7". HotpotQA
    (CoT with the gold context, exact-match success signal): self-reflection gave "an 8% absolute boost
    over the episodic memory learning advantage". Pass@1, GPT-4 single sample vs Reflexion: HumanEval
    Python 80.1 vs 91.0; MBPP Python 80.1 vs 77.1, where its self-generated tests passed wrong solutions
    (false-positive rate 16.3% against 1.4% on HumanEval). Ablation on the 50 hardest HumanEval Rust problems:
    base 0.60, self-reflection without test generation 0.52, tests without self-reflection 0.60, both
