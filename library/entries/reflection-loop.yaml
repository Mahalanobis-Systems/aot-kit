summary: 'The same model critiques and revises its own output for a few rounds (Self-Refine), or after
  a failed attempt writes a short lesson it carries into the next try (Reflexion). It pays when the critique
  has something to stand on, such as a failing test, an error, an environment reward or a checkable constraint
  (Reflexion on hard Rust problems went from 0.60 to 0.68 with its tests and fell to 0.52 without them),
  or when it judges form rather than correctness. Asked only to re-check whether an answer is right, models
  often break right ones as well as fix wrong ones: one revision pass lowered accuracy in 20 of 28 BoolQ
  settings across open-weight models, every RefineBench model (GPT-5 and o1 included) moved by -2.5 to
  +2.6 points over five turns, and plain retries against the tests beat Reflexion on HumanEval at lower
  cost. Revision can still help long reasoning (one study found significant gains on BBEH Non-Choice for
  all five models and on HLE for two), but there it turned up to 13.25% of right answers wrong against
  at most 2.1% on checkable SAT constraints, so gate the loop by how checkable the answer is. On reasoning
  models an outer loop mostly adds tokens: over five self-refinement turns on RefineBench, o1 went from
  18.5 to 18.3 and DeepSeek-R1 from 8.1 to 7.9.'
how: '1. Start from the baselines on your own items: the single pass with the model''s own thinking on
  or a higher effort (1.b.i), and retries or best-of-N at the same tokens (9.c.ii). Plain retries against
  HumanEval''s example tests scored 92.0% for $2.51 where Reflexion scored 87.8% for $3.90. 2. Add the loop only
  where the critique has a signal to work from (a failing test, a compiler or runtime error, an environment
  reward, a constraint the model can check such as a formula, required fields or a length limit) or where
  it judges form (tone, format, coverage of required items) rather than correctness. If the check is sound,
  feed its verdict back instead (9.a.i); if the critic needs written criteria and its own context, use
  7.c.iii. Do not add an outer "check your answer" step on a reasoning model with thinking on. 3. Put
  the signal or the checklist into the critique prompt: the error, the failing test, the list of requirements
  (given the full checklist, Gemini 2.5 Pro scored 44.5 points above open self-refinement, which gained
  1.8 over five turns). On a non-reasoning model, try appending "Wait" after its
  own output before the critique: 14 such models fixed injected errors in their own output 64.5% less
  often than the same errors in the user''s message, and appending "Wait" cut that gap by 89.3%. Use a neutral instruction that keeps the answer unless something contradicts
  it; on BoolQ every refinement prompt lowered mean accuracy, and more forceful ones added more harmful
  flips than helpful ones. 4. Cap rounds at one to three and stop when the check passes or the critique
  finds nothing to fix; Self-Refine capped at four, with most of the gain in the first iterations. 5.
  Keep the first answer unless the revision is better by the metric: accept it only when the check passes
  or the score rises, otherwise return the original. A trained gate took Qwen2.5-7B on BoolQ to 86.02% where always
  revising gave 72.32%, though the author flags the gate''s gains as unverified. 6. When attempts repeat (agent episodes, test-driven retries), store each failure''s
  short verbal reflection and give the last few to the next attempt (Reflexion kept 1 to 3); that is where
  reflection beat plain retry: 130 of 134 ALFWorld tasks while the retry-only agent stopped improving
  after six trials. 7. Measure on held-out items with ground truth the loop never sees: accuracy per round
  against both baselines at matched tokens, the share of right answers turned wrong and of wrong ones
  fixed per round (one untrained model turned 15.8% of MATH problems from right to wrong), and tokens
  and latency per item; re-run on every model upgrade.'
detect:
  static: A step where the same model critiques its own output and a step that revises it (a reflect,
    critique or "double-check your answer" call), or verbal reflections stored between attempts, with
    a round cap. Flag a loop that re-checks correctness with no test, error, environment signal or explicit
    checklist in the critique, no cap, one that always returns the last revision, and an outer reflect
    step on a reasoning model with thinking on.
  traces: Rounds per item; share of rounds whose critique changes the answer; on items with ground truth,
    right-to-wrong and wrong-to-right flips per round; whether the critique cites a test, error or requirement
    or only restates the answer; tokens per round.
  evals: Accuracy per round against the single pass and against retries or best-of-N at equal tokens;
    share of initially right answers the loop breaks.
  judge: Rate critiques for specificity.
  probes:
    what: Correct outputs mixed with outputs carrying one detectable defect.
    construct: Plant one defect in some outputs (missing required item, off-by-one, failing test) and
      leave the others correct; the loop must fix the defects and leave the correct outputs unchanged.
  primary:
  - traces
  - probes
