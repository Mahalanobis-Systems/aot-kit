# 3.a.iv: Restructure the system prompt: every requirement once, up front, in named sections; nothing the model doesn't need
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 3.a.iv
legacy_id: T04
slug: restructure-system-prompt
name: 'Restructure the system prompt: every requirement once, up front, in named sections; nothing the
  model doesn''t need'
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the model sees
levers:
- prompt
domains:
- general
evidence_domains:
- code-generation
- reasoning
categories:
- prompts.structure
summary: 'Rewrite the system prompt so that each requirement the task has (constraints, the answer format,
  the completion check, how to work efficiently, the domain procedure) is stated once, up front, in a
  named section, and remove instructions the model does not need. Adding structure and removing bulk are
  the same edit seen from two sides: what stays is what the eval shows the model needs. A domain procedure
  section is worth adding only when failures cluster on a step an expert would take; write it from those
  failures, from a domain expert, or by searching prompt variants against the eval (GEPA).'
how: 1. List the requirements the task actually has, from the task spec and from failures.
  2. Put each in one named section; put the answer format and completion check in their own sections.
  3. Cut everything else, and shorten tool descriptions and checklists with it (the TerminalBench run
  cut the prompt from 7 lines to 3). 4. Add a domain procedure only if failures cluster on a step; derive
  it from those failures or an expert, or generate and test variants with GEPA. 5. Run the paired eval
  on development and held-out cases; keep only sections that earn their place.
detect:
  static: system prompt with no named sections; requirements repeated, contradictory, or absent (no answer
    format, no completion criteria); prompt plus tool descriptions over about a quarter of the context
    window
  traces: failure rows labeled instruction-following-failure or instruction-grader-mismatch where the
    requirement was never in the prompt; prompt tokens the largest share of input per step; context-overflow
    outcomes
  evals: an ablation that removes a section and shows no loss (cut it), or failures that cluster on one
    step of the task procedure (add it)
