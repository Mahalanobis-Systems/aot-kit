- source: 'Elias Lumer, Sahil Sen, Vamse Kumar Subbiah, Kevin Paul, "Reflective Prompt Optimization of
    a Deep-Research Agent: A Topic-Disjoint, Multi-Seed Protocol for Measuring Transferable Gains and
    Prompt-Level Overfitting", https://arxiv.org/abs/2610.12601'
  date: '2026-10-08'
  task: Optimize the two system prompts (orchestrator and researcher) of a multi-agent deep-research agent
    with GEPA, evaluate on topic-disjoint held-out tasks over three seeds, ablate the memorized content
    the optimizer wrote into the prompts, and compare against a hand-written prompt that keeps only the
    optimizer's describable rules
  effect: Held-out citation reward 0.702 to 0.781 (+0.079, bootstrap 95% CI [0.051, 0.107], n=500 tasks
    over 254 topics; 287 wins, 66 ties, 147 losses); three seeds gave +0.079, +0.130 and +0.112 (mean
    0.107) against validation gains of +0.202, +0.290 and +0.147, so selecting on the 24-task validation
    set overstated the transferable gain "about 2.6 times" in the main run. Memorized answer-key sections
    made up 52% of the winning orchestrator prompt and 39% of the researcher prompt by word count and
    added no reward even on the training questions they encode (+0.090 there against +0.079 held out).
    The two candidates that grew longer (orchestrator up to 3,261 words) regressed on validation. A recipe
    prompt with the memorized content removed (answer first, one claim per citation, verified page content,
    corpus-only URLs, sequential numbering) recovered +0.047 of the +0.083 total on 100 held-out tasks
    (about 57%; CI [-0.011, +0.106]); the further +0.036 from the full prompt was not significant. Collapsing
    per-dimension feedback to one scalar made held-out transfer negative (-0.021 against +0.075). Policy
    tokens per query rose about 32% (146.0k to 193.1k); latency was 138.8 s against 159.9 s for the seed
    on 6 queries.
  conditions: GPT-5.4 agent, GPT-5.5 reflector at high effort, GPT-5-mini and GPT-5.4-mini judges; frozen
    news corpus; train and validation 24 tasks each, test 500; 240 rollouts; LLM-judged composite citation
    reward (judge-human agreement 77.8% and 80.0% on 45 pairs, one annotator); the recipe is the optimized
    prompt minus memorized content, not an independent rewrite; cost and latency from 6 queries per prompt;
    one agent, task and domain
  direction: supports
  measured: true
  locator: Abstract; §3.1-3.6; §4.2 Tables 3-5; §4.3 Table 6; §4.4 Table 7; §4.5 Table 8; §4.6 Table 9;
    §4.7; §5 Table 11; §6
- source: 'Atul Anand, Sourav Chattaraj, "Instruction Stacking Collapse: A Benchmark and the Capability-Dependent
    Value of Prompt Compilation", https://arxiv.org/abs/2608.02639'
  date: '2026-07-31'
  task: Stack 1 to 20 verifier-checked instructions from six categories in one system message, map pairwise
    conflicts, and rewrite the stack once with an "instruction compiler" (cluster and merge by category,
    add a precedence note where two rules conflict, reformat as a numbered checklist with reasoning first
    and format last) reused across queries, against token-padded and reordered controls
  effect: 'Follow rate fell from about 0.96 with one instruction to 0.604 (Claude Sonnet 4.6), 0.433 (Gemini
    2.5 Flash) and 0.201 (GPT-5-mini) with twenty (advice task). 15 of 231 pairs are logically impossible
    ("output JSON" is jointly unsatisfiable with nine others), and about 12% of the satisfiable pairs
    failed together more often than their single rates predict. Pooled over stacks of 8 to 20, the compiled
    prompt recovered +11.0 points for GPT-5-mini (cluster CI [+7.9, +14.5]), +3.3 for Gemini 2.5 Flash
    ([+1.2, +5.5]) and -1.2 for Sonnet 4.6 ([-4.7, +2.2], p=0.49); at twenty instructions Sonnet went
    from 0.627 to 0.560 (p=0.037 at that size only). Padding and reordering controls did not reproduce
    the gain. Within families the gain at twenty instructions shrank as models got stronger: Haiku +9.0,
    Sonnet -6.7, Opus -2.0; GPT-5-nano +6.0, GPT-5-mini +11.8, GPT-5.5 +4.0; Flash-Lite +7.0, Flash +5.0,
    Pro -1.0 points (Spearman -0.85, single seed).'
  conditions: Claude Sonnet 4.6, GPT-5-mini and Gemini 2.5 Flash at temperature 0, plus a single-seed
    ladder of nine models at stack 20; 30 random stacks per size x 10 items; open-ended advice task, with
    GSM8K and HumanEval as checks; Sonnet 4.6 does all compiling; stacks sampled without screening for
    feasibility; the compiler is compared only with the raw stacked prompt, not with a competently hand-written
    one; the pre-registered effect size (d>=0.5) was missed (best d=+0.43)
  direction: mixed
  measured: true
  locator: Abstract; §1; §3; §4.1 Table 4; §4.2; §5.1-5.5 Tables 5-7; §6 Limitations; App. E-H
- source: 'Netanel Eliav, "Prompt Design at Scale: How Format, Instruction Count, and Context Length Shape
    Instruction Adherence and Hallucination in Large Language Models", https://arxiv.org/abs/2607.19257'
  date: '2026-07-21'
  task: Put 10 to 160 programmatically checked rules in the system prompt or the user turn, rendered as
    markdown, plain text, prose or a table, and measure all-rules compliance and per-rule adherence for
    each model; separately measure recall over a 2k to 512k-token context in the same four formats
  effect: 'Share of responses meeting every rule at N=10, 40 and 80: Claude Sonnet 5 0.938, 0.238, 0.000;
    Gemini Flash 0.919, 0.312, 0.019; Claude Haiku 0.850, 0.119, 0.000; Qwen 35B 0.725, 0.100, 0.000;
    Qwen 27B 0.588, 0.094, 0.006; zero for all at N=120 and 160. "No model shows a consistent, meaningful
    markdown advantage": markdown minus plain adherence was small and changed sign across N; Qwen 35B
    favored plain text at five of six N, by 4.8 points at N=160. Gemini Flash alone fell 18.1 (prose)
    and 13.7 (table) points below plain at N=40. Moving the rules from the system prompt to the user turn
    changed adherence at N=160 by +6.6 (Haiku), +5.1 (Qwen 35B), -8.7 (Gemini Flash), -1.8 (Qwen 27B)
    and not significantly for Sonnet 5. Rendering the context corpus as markdown cost 1.258x plain-text
    tokens (prose 1.221x, table 1.367x).'
  conditions: claude-sonnet-5, claude-haiku-4-5, gemini-3.5-flash and two self-hosted Qwen models with
    reasoning off, provider default temperatures; 20 trials per (model, N, format, placement) cell, 4,800
    trials; rules are word-count, exact-text and include or forbid-word constraints on a short essay,
    five of them fixed at every N; single author, not peer reviewed; the advice to treat about 40 rules
    as a redesign point is the author's recommendation, not tested
  direction: mixed
  measured: true
  locator: Abstract; §3.3 Table 3; §4.1-4.5 Tables 4-6; §8; §9
- source: 'Thibaud Gloaguen, Niels Mündler-Sasahara, Mark Niklas Müller, Veselin Raychev, Martin Vechev,
    "Evaluating AGENTS.md: Are Repository-Level Context Files Helpful for Coding Agents?", https://arxiv.org/abs/2602.11988'
  date: '2026-02-12'
  task: Run four coding agents with no context file, an LLM-generated one (made with each agent's recommended
    initialization command) and the developer-committed one, on SWE-bench Lite and on 138 issues from
    12 repositories that ship context files; remove one section at a time; analyze what the agents did
    in their traces
  effect: LLM-generated files reduced the average resolution rate by 0.5% (SWE-bench Lite) and 2% (CTXbench)
    (p=0.87 and 0.37), added 2.45 and 3.92 steps per task and raised cost 20% and 23% (p<0.001%). Developer-written
    files raised resolution 2.4% (p=0.21), did significantly better than LLM-generated ones (p=0.038),
    and added 3.34 steps and up to 19% cost. Instructions were followed (uv used 1.6 times per task when
    mentioned, under 0.01 when not), but overviews did not shorten the steps before the agent touched
    a relevant file. Removing the testing, overview or tooling section from GPT-5.2's generated files
    changed no accuracy significantly; dropping the testing section cut cost from $0.4715 to $0.3730 (CTXbench,
    p=0.023) and from $0.3272 to $0.2756 (SWE-bench, p=0.0035). With all other repository documentation
    removed, LLM-generated files raised resolution 2.7% on average. LLM-generated files raised GPT-5.2's
    reasoning tokens 22% on SWE-bench.
  conditions: Claude Code with Sonnet 4.5, Codex with GPT-5.2 and GPT-5.1 mini, Qwen Code with Qwen3-30b-coder;
    SWE-bench Lite (300) and CTXbench (138 Python instances with LLM-written task descriptions and tests,
    manually reviewed); one sample per instance and setting; developer files average 641 words in 9.7
    sections; context files rather than the system prompt, though loaded into the agent's context on every
    run; numbers from v3 (Sep 2026)
  direction: supports
  measured: true
  locator: Abstract; §3 Table 1; §4.1-4.4 Tables 2-3, Figs. 4-6; App. B Table 7, Figs. 12-13
caveats: 'Restructuring is not a reliable gain on its own: in VeRO''s TerminalBench study a rewrite into
  three named sections scored 45% on a 20-task subset but broke as many passing tasks as it fixed on the
  full set (6 new passes, 6 regressions), the run that cut the prompt hardest had the best pass rate (12
  new passes, 6 regressions) but also shortened tool descriptions, set the output cap to 17 KB and left
  11 parser crashes in place, and on reasoning tasks (GPQA, MATH) VeRO''s optimizers, including its prompt-only
  variant, gained little or nothing. The value depends on the model: a merge-and-rank rewrite of stacked
  rules helped smaller models and was neutral to negative for the strongest (Claude Sonnet 4.6 went from
  0.627 to 0.560 at twenty instructions, significant only at that size), format effects were small and
  changed sign between models, and a hand-written version of the deep-research optimizer''s rules recovered
  about 57% of its gain with a confidence interval that included zero. The newer studies are narrow: synthetic,
  verifier-checked rules on three to five models (20 trials per cell in the format study), one agent with
  a judge-scored reward in the optimizer study, and Python repositories with one sample per setting in
  the context-file study, so measure the change on your own agent.'
