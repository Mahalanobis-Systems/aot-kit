# 3.a.iv: Restructure the system prompt: every requirement once, up front, in named sections; nothing the model doesn't need
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 3.a.iv
legacy_id: T04
slug: restructure-system-prompt
name: 'Restructure the system prompt: every requirement once, up front, in named sections; nothing the
  model doesn''t need'
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the model sees
levers:
- prompt
domains:
- general
evidence_domains:
- code-generation
- reasoning
- web-research
categories:
- prompts.structure
summary: 'State each requirement once, in its own named section near the top of the system prompt, and
  cut what the model does not need. It pays most where rules have piled up or crowd out the task: with
  80 rules in one prompt at most 1.9% of responses met them all across five current models, a one-call
  rewrite that merged and ranked stacked rules recovered 11.0 points of follow rate for GPT-5-mini, and
  generated repository context files raised coding agents'' cost 20% and 23% with no significant gain
  in success. The limits: the same rewrite did nothing for Claude Sonnet 4.6 (-1.2 points), markdown against
  plain text made no reliable difference in one study, and in VeRO''s TerminalBench runs a three-section
  rewrite broke as many passing tasks as it fixed while the hardest cut gave the best pass rate (37.1%).
  Add a domain procedure section only when failures cluster on a step an expert would take, and judge
  any section an optimizer writes on held-out cases (on one deep-research agent the gain was 0.079 held
  out against 0.202 on the validation set).'
how: '1. Start from the current prompt as the baseline: run it on development and held-out cases and record
  pass rate, which cases pass and fail, compliance with each rule, steps, input tokens and cost per task.
  List every instruction the model receives (system prompt, context files such as AGENTS.md, checklists)
  and the requirements the task actually has, from the task spec and from failures. 2. Cut what the model
  does not need: content it can find or would do anyway (repository overviews, restated documentation),
  duplicated rules, and leftovers such as answers to specific eval cases. Across four coding agents, LLM-generated
  context files changed success by -0.5% and -2% while adding 20% and 23% to cost, their overviews did
  not shorten the search for the relevant file, and dropping only the testing section cut cost per task
  from $0.4715 to $0.3730 with no significant change in accuracy; the same files helped (+2.7%) only once
  the repository''s other documentation was removed. Keep what the model cannot infer, such as non-standard
  conventions and requirements (developer-written files did better than generated ones). In VeRO''s TerminalBench
  run, cutting the prompt from 7 lines to 3 and its checklist from 10 lines to 4, with shorter tool descriptions
  (2.a.ii) and a tighter output cap in the same commit, gave the best pass rate, 37.1%, and context-overflow
  failures fell from 13 to 2. 3. State each remaining requirement once, in a named section, and give the
  answer format and the completion check their own sections (what the format says and how the answer is
  read is 9.b.i). Merge duplicates and settle conflicts: where two rules cannot both hold (JSON output
  with markdown headers), drop one or say which wins. Keep the count down, since compliance falls as rules
  stack: three models followed about 96% of instructions given one at a time but 20% to 60% with twenty,
  and in another study the share of responses meeting every rule fell from 0.59-0.94 with 10 rules to
  at most 0.019 with 80; that author recommends treating about 40 rules as the point to split them across
  turns, tools or a validation check (not tested). A one-call rewrite that grouped rules by kind, merged
  duplicates, added a precedence note for conflicts and listed reasoning rules first and format rules
  last recovered 11.0 points of follow rate for GPT-5-mini and 3.3 for Gemini 2.5 Flash but -1.2 for Claude
  Sonnet 4.6, so expect the most from smaller models. 4. Pick one consistent way to mark sections (headings
  or tags) and do not expect the format itself to buy accuracy: across five current models none showed
  a reliable markdown advantage over plain text for a block of rules, and the one consistent difference
  favored plain text (4.8 points for one Qwen model at 160 rules). Test your own model anyway: Gemini
  Flash fell 18.1 points with 40 rules written as prose, and moving the same rules from the system prompt
  to the user turn changed adherence by -8.7 to +6.6 points depending on the model. 5. Add a domain procedure
  section only if failures cluster on a step; write it from those failures or from an expert, or generate
  variants with an optimizer such as GEPA. If an optimizer writes it, judge it on held-out cases that
  share no topic with those it saw, over several seeds, and strip case-specific content: on a deep-research
  agent GEPA''s held-out gain was 0.079 against 0.202 on its 24-task validation set, memorized answers
  made up 52% and 39% of the two winning prompts without adding reward, the two longer candidates regressed,
  and a hand-written prompt keeping only the rules it found recovered about 57% of the gain. 6. Run the
  paired eval, old against restructured prompt, on the full development and held-out sets, not a subset
  (a VeRO rewrite scored 45% on a 20-task subset, then broke as many passing tasks as it fixed); report
  new passes and regressions per case as well as the net, compliance per rule, context-overflow failures,
  steps, tokens and cost; keep only sections that earn their place, and re-run after any model change.'
detect:
  static: system prompt with no named sections; requirements repeated, contradictory, or absent (no answer
    format, no completion criteria); pairs of rules that cannot both hold (JSON output and markdown headers);
    several dozen or more simultaneous rules in one prompt; context files that restate what the agent
    can find in the repository (overviews, directory listings); case-specific facts or answers left in
    the prompt by an optimizer; prompt plus tool descriptions over about a quarter of the context window
  traces: failure rows labeled instruction-following-failure or instruction-grader-mismatch where the
    requirement was never in the prompt; prompt tokens the largest share of input per step; context-overflow
    outcomes
  evals: an ablation that removes a section and shows no loss (cut it), especially one that also lowers
    cost; failures that cluster on one step of the task procedure (add it); compliance per rule that falls
    as rules are added, or pairs of rules that fail together more often than each fails alone; an optimized
    prompt whose validation gain far exceeds its held-out gain
  probes:
    what: One deterministic check per rule in the prompt, run with all rules, with each rule alone and
      with each section removed.
    construct: Enumerate every instruction in the system prompt and context files, write a verifier for
      each, and score responses on the same inputs with all rules, with each rule alone and with each
      section removed; flag sections whose removal changes nothing but cost (cut candidates) and pairs
      of rules that fail together more often than their single rates predict (conflicts to settle).
impact:
  quality:
    effect: mixed
    size: small
    when: 'restructuring: a one-call rewrite of stacked instructions +11.0 points of follow rate for GPT-5-mini,
      +3.3 for Gemini 2.5 Flash, -1.2 (not significant) for Claude Sonnet 4.6 (Anand, Jul 2026); a dedicated
      verification section +4.75 to +5.0 points on GSM-Plus (Cemri, Mar 2025); a three-section rewrite
      gave 6 new passes and 6 regressions on TerminalBench, and MATH validation +0.10 with train -0.07
      (VeRO, Feb 2026); an optimizer-written procedure on a deep-research agent +0.079 held-out reward
      (Lumer, Oct 2026); cutting: TerminalBench +6.8 points where the prompt crowded out context, GPQA
      train -0.04 where the optimizer could change only prompts, tool descriptions and parameters (VeRO,
      Feb 2026); repository context files changed coding-agent success by -2% to +2.4%, none significant
      (Gloaguen, Feb 2026); format: no reliable markdown advantage over plain text across five models
      (Eliav, Jul 2026)'
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: 'cutting saves: LLM-generated context files raised cost 20% and 23% and developer-written ones
      up to 19% with no significant gain in success, and dropping one testing section cut cost per task
      from $0.4715 to $0.3730 (Gloaguen, Feb 2026); adding can cost more: followed instructions brought
      extra testing and exploration (2.45 to 3.92 more steps per task) (Gloaguen, Feb 2026), and an optimized
      deep-research prompt raised policy tokens per query about 32%, 146.0k to 193.1k, on 6 queries (Lumer,
      Oct 2026); context rendered as markdown costs 1.258x the tokens of plain text (Eliav, Jul 2026)'
    basis: evidence
  performance:
    effect: improves
    size: small
    when: 'cutting saves steps: context files added 2.45 to 3.92 steps per task and raised GPT-5.2''s
      reasoning tokens 22% on SWE-bench (Gloaguen, Feb 2026); an optimizer-written prompt added no latency
      (138.8 s against 159.9 s per query, 6 queries) (Lumer, Oct 2026)'
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
  primary:
  - quality
  - cost
measure:
- method: experiment
  tier: 3
  how: 'paired eval, old against restructured prompt, on the full development and held-out sets (topics
    disjoint from any an optimizer saw), over several runs or seeds and for each model in use: pass rate
    with new passes and regressions per case, compliance per rule from one deterministic check per rule,
    context-overflow failures, steps, input tokens and cost per task; remove one section at a time to
    find sections that cost tokens without changing outcomes'
- method: monitor
  how: 'in production: violation rate per rule and format-compliance rate on sampled traffic, prompt tokens
    as a share of input per step, steps and cost per task, and prompt growth (rules and lines added since
    the last restructure); re-run the paired eval when the model changes, since the value of a rewrite
    depended on the model'
