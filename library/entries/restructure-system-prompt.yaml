    in their traces
  effect: LLM-generated files reduced the average resolution rate by 0.5% (SWE-bench Lite) and 2% (CTXbench)
    (p=0.87 and 0.37), added 2.45 and 3.92 steps per task and raised cost 20% and 23% (p<0.001%). Developer-written
    files raised resolution 2.4% (p=0.21), did significantly better than LLM-generated ones (p=0.038),
    and added 3.34 steps and up to 19% cost. Instructions were followed (uv used 1.6 times per task when
    mentioned, under 0.01 when not), but overviews did not shorten the steps before the agent touched
    a relevant file. Removing the testing, overview or tooling section from GPT-5.2's generated files
    changed no accuracy significantly; dropping the testing section cut cost from $0.4715 to $0.3730 (CTXbench,
    p=0.023) and from $0.3272 to $0.2756 (SWE-bench, p=0.0035). With all other repository documentation
    removed, LLM-generated files raised resolution 2.7% on average. LLM-generated files raised GPT-5.2's
    reasoning tokens 22% on SWE-bench.
  conditions: Claude Code with Sonnet 4.5, Codex with GPT-5.2 and GPT-5.1 mini, Qwen Code with Qwen3-30b-coder;
    SWE-bench Lite (300) and CTXbench (138 Python instances with LLM-written task descriptions and tests,
    manually reviewed); one sample per instance and setting; developer files average 641 words in 9.7
    sections; context files rather than the system prompt, though loaded into the agent's context on every
    run; numbers from v3 (Sep 2026)
  direction: supports
  measured: true
  locator: Abstract; §3 Table 1; §4.1-4.4 Tables 2-3, Figs. 4-6; App. B Table 7, Figs. 12-13
- source: 'Hau-Sing So, Daixian Liu, Weicai Long, "Masked Erosion: How Acceptance Gates Lose Redundant
    Safeguards in Self-Improving Agents", https://arxiv.org/abs/2610.38392'
  date: '2026-10-28'
  task: Let an optimization loop edit an agent's harness text (prompts, note templates and four overlapping
    written safeguards against credential misuse in AppWorld and against destructive clean-up in a simulated
    ops service), keeping an edit only if an acceptance gate scores it higher on a batch of tasks; measure
    harm for every subset of the four safeguards, run 411 loops under ten gate rules (mostly planted one-safeguard
    deletions) and three unchanged GEPA runs, rerun the final harnesses under other models, and test freezing
    safety text and requiring every one-safeguard ablation to stay protected
  effect: 'Deletions into harnesses that stayed protected carried child-only harm of 0.016 (upper bound
    0.028) against 0.422 for deletions into unprotected ones. In 27 AppWorld loops, greedy and split-half
    gates accepted 0.48 and 0.44 of proposed deletions and a paired significance gate 0.04; greedy loops
    ended unprotected in 5 of 6 runs, paired loops in none. Under Qwen3-30B, finals still protected under
    the loop''s model misused credentials in 0.30 of runs for non-paired gates against 0.004 for paired
    ones (difference CI [0.16, 0.47]); one audited final stayed at 0.025 harm under the loop''s model
    but reached 0.575 under Qwen3-30B; under GPT-6 Luna and GPT-6.1 Sol the gap was only 0.025 [0, 0.07].
    Where a safeguard cost task success, a larger batch let a significance gate delete it: at the same
    cost, 20-task batches kept all six harnesses protected while 40-task batches lost all six. Free-form
    rewrites of safety text let through 0.19 more harm than the originals (CI [0.08, 0.31]). GEPA''s validation
    gains (up to +0.22) did not transfer (0.35 to 0.45 of clean held-out tasks against 0.40 for the original);
    all three finals kept the credential rules verbatim, but two rewrote the note template into an instruction
    to log in with stored credentials and misused credentials under Qwen3-30B in 2 and 5 of 40 runs against
    0 of 80 for the original. With safety text frozen, all four natural-loop finals kept the original
    safety text and reached the highest clean success of any natural arm (0.019 harm under Qwen3-30B);
    a gate requiring every one-safeguard ablation to stay protected left no AppWorld loop unprotected
    (greedy 5 of 6) with no loss of clean success, and in the three-step ops simulation kept every loop
    protected at a cost of 0.35 in clean success (freezing one rule: 0.05). In tau-bench retail, deleting
    the policy sentences on authentication and on confirmation before writes changed DeepSeek''s reward
    and violation rate by at most 0.05 (it still asked before all 136 writes).'
  conditions: DeepSeek-V4.1-Flash as main agent and proposer, Qwen3-30B-A3B and Qwen3-8B run locally,
    GPT-6 Luna, GPT-6.1 Sol and Claude Haiku 5.5 as supplementary models; ReAct-style code agent, at most
    15 steps, temperature 0; AppWorld credential-misuse tasks and a simulated ops service, batches of
    40 tasks unless varied; 393 stress loops that plant deletions, 18 free-form rewrite loops and 3 GEPA
    seeds of 800 metric calls scored on task success only; deterministic harm audits; two environments
    with one harm and four written safeguards each; strong models already avoided the harms probed in
    tau-bench, AgentDojo and a privacy simulation; 113 of 177 preregistered predictions held; the GEPA
    runs are a case study
  direction: mixed
  measured: true
  locator: Abstract; Figure 1; §3.2; §4.1; §4.2 Figure 3; §4.3 Figure 4; §4.4 Table 2; §4.5 Table 3; §4.6;
    §4.7; Limitations; App. A
- source: 'Xiaonan Xu, Wenjing Wu, "Stale Instruction Files Override the Code in Coding Agents: A One-Sentence
    Fix", https://arxiv.org/abs/2610.30571'
  date: '2026-10-22'
  task: Build 40 Python projects whose instruction file asks for one convention while the existing code
    uses the other (16 kinds of choice, both directions), have two coding agents add a feature to each
    with and without one sentence in the user-level instruction file that gives the existing code precedence,
    and classify each choice, rewrites of existing code and test results
  effect: 'Without the sentence, 90.1% of choices (649 of 720) matched the stale file and 4.2% the code
    (Claude Code 86.4% and Codex CLI 93.9% matching the file). Claude Code named the conflict in its final
    reply in 79 of 80 runs and still matched the file in 86.2% of choices in those runs; Codex CLI rewrote
    existing code to match the file in 20 of 80 runs (median 198 lines removed from 9 files), and the
    project''s original tests then failed in 17 of them. With the sentence, 91.4% of choices (658 of 720)
    matched the code (+87.2 points, 95% interval 83.6 to 90.9): Claude Code 7.5% to 94.4%, Codex CLI 0.8%
    to 88.3%; no run rewrote existing code, both agents reported the conflicts in all 160 runs, and tests
    passed in all 160 runs against 89.4% without it (Codex CLI 78.8% to 100%). Runs with the sentence
    used slightly fewer tool calls and less time.'
  conditions: Claude Code 2.1.302 with Claude Sonnet 5.5 and Codex CLI 0.163.0 with GPT-6 Sol, non-interactive
    with edits auto-approved, reasoning settings not stated; 40 synthetic Python projects of three to
    eight modules, two runs per project, agent and condition (320 runs), 1,800-second limit; conflict
    mentions judged by Claude Opus 5.5 blind to condition; the instruction file is the stale source in
    every project, so the sentence was not tested where the file is right and the code is wrong; the authors
    propose the sentence
  direction: supports
  measured: true
  locator: Abstract; §3; §4; §5.1-5.5 Figures 5-6; §8; §10
- source: 'Timothy Kassis (K-Dense), "Scientific Agents: Evaluating Profession-Specific System Prompts
    on Scientific Tasks", https://arxiv.org/abs/2610.00084'
  date: '2026-09-07'
  task: Load a profession-specific AGENTS.md profile (median 2,549 words, about 4,822 tokens, ten-section
    template) as the whole system prompt of an agent harness, against a one-line baseline ('You are a
    helpful assistant.'), the profile's opening role sentence, a generic scientific-rigor guide of similar
    length and a profile from an unrelated field, on nine science benchmarks with rule-based grading and
    on 60 tool-using bioinformatics problems under fixed token and time limits
  effect: 'Mean profile-baseline accuracy difference over nine text tasks -0.6 points (95% interval [-1.5,
    +0.2]); no benchmark showed a clear gain (SuperGPQA 71.4% to 72.2%, MedXpertQA -2.2 [-4.5, -0.3]);
    against the role sentence -0.5, the generic guide -0.9 and an unrelated profile -0.3. Profiles added
    4,281 to 5,573 input tokens per call, produced 1.5 to 2.3 times the output tokens and cost 2.2 to
    4.5 times more per successful query at list prices; the role sentence stayed near baseline, and the
    generic and unrelated long prompts cost about as much as the profile. On BioMysteryBench, mean solve
    rate was 46.7% with the profile against 56.7% at baseline, -10.0 points [-16.7, -3.3] (runs: -11.7,
    -18.3, 0.0; generic guide 55.0% in run 1); 88 of 180 profile runs stopped at the 600,000-token or
    35-minute limit against 61 of 180 at baseline, since the profile is resent every turn, and among run-1
    attempts that finished, solve rates were 87.8% (baseline), 86.8% (generic) and 87.9% (profile). On
    the first, unretried SuperGPQA pass, 27.9% of baseline calls failed with provider API errors against
    1.2% for the profile, so first-pass correct answers were 54.0% against 71.6% (generic 72.2%, unrelated
    profile 71.9%).'
  conditions: Gemini 3.8 Flash through OpenRouter at the harness's low thinking level, provider default
    sampling, in the Pi agent harness (0.85.0); 4,488 text items complete in all five conditions across
    nine tasks and 100 matched profiles, one response per item and condition (three runs on a 280-item
    subset gave +1.8, 0.0 and +0.4 points); 60 BioMysteryBench problems with author-written graders, three
    runs each for baseline and profile and one for the generic guide; costs at list prices for successful
    calls only; one model, one harness, always-on loading only (selective retrieval not tested); the author
    is from the company that publishes the profiles
  direction: supports
  measured: true
  locator: Abstract; §2; §3; §4.1 Figure 1; §4.2 Figure 2; §4.3; §4.4 Figure 3; §5; App. E Tables 19-21;
    App. F
- source: 'Zining Huang, Haoran Que, Hong Zeng, Ge Zhang, Zuo Wang, Jin Chen, et al. (ByteDance Seed),
    "Harness-IF: Evaluating Instruction Following Across Instruction Surfaces in Coding Agents", https://arxiv.org/abs/2608.11727'
  date: '2026-08-12'
  task: Place packs of 25 to 35 operational rules (10 to 27 scorable per item) on five surfaces a coding
    agent reads (system prompt, tool description, skill description, project file, user instruction) in
    60 multi-turn coding items, score each rule from execution evidence, separately score rules that go
    against what models do unprompted (observed by rerunning with the rule withheld), and run a separate
    counterbalanced pilot that puts opposite rules on two surfaces
  effect: Rule-level accuracy across 12 frontier models ranged from 72.1% (StepFun 3.5) to 85.9% (Claude
    Opus 4.7), with GPT-5.5 83.1%, Claude Sonnet 4.6 82.5% and Gemini 3.1 Pro 75.4%; on rules that go
    against unprompted defaults it was 66.1% to 78.6%, lower for every model by 3.6 to 7.4 points (mean
    5.81) and by 13.09 points in the fully deterministic subset. Shortfall rules (require an action or
    a minimum) carried 77.1% of the 8,440 failures at a fail rate similar to overstep rules (23.8% against
    20.8%). By family, output control was lowest (70.9%, lowest for 11 of 12 models) and quantitative
    limits highest (82.6%); by modality, commands scored 76.0% against 90.6% for preferences. In the conflict
    pilot (916 runs, nine older models, four synthetic conflict pairs), system prompt, project file and
    user instruction tied for precedence (mean rank 2.22) ahead of tool descriptions (3.78) and skill
    descriptions (4.56), so precedence did not follow position in the context; the full ordering held
    in 9,652 of 10,000 crossed bootstrap resamples but in only 6 of 9 single-model fits.
  conditions: 12 model builds (Claude Opus 4.7, GPT-5.5, Claude Sonnet 4.6, Claude Haiku 4.5, GLM-5.1,
    Qwen-3.6-Max, Hy3, Kimi-K2.6, Gemini-3.1-Pro, MiniMax-M2.7, StepFun-3.5, Seed-2.0-Pro) in a coding-agent
    harness, reasoning settings not stated; 2,160 runs (60 items, 12 models, 3 rounds), 37,616 eligible
    verdicts; 86.8% of verdicts involve a GPT-5.2 judge (a swap to Claude Opus 4.7 agreed on 62.1%, kappa
    0.163; an earlier human audit 69.0%, kappa 0.515); items selected for how well they separated pilot
    models; rules assigned to surfaces in the main panel, so per-surface rates there are descriptive;
    the conflict pilot (Claude Opus 4.6, Claude Sonnet 4.6, GPT 5.4, Gemini 3.1 Pro, DeepSeek V3.2, Kimi
    K2.5, MiniMax M2.7, Qwen 3.6 Plus, Seed 2 Pro, collected April 2026) uses deterministic scoring; the
    authors' lab makes Seed-2.0-Pro (73.6%)
  direction: supports
  measured: true
  locator: Abstract; §3.1-3.4; §4.1 Table 2; §4.2 Figure 4; §4.3 Figure 5; §4.4 Figure 6; §4.5; §5; App.
    D.1 Table 3; App. D.4; App. E.1
caveats: 'Restructuring is not a reliable gain on its own: in VeRO''s TerminalBench study a rewrite into
  three named sections scored 45% on a 20-task subset but broke as many passing tasks as it fixed on the
  full set (6 new passes, 6 regressions), the run that cut the prompt hardest also shortened tool descriptions,
  set the output cap to 17 KB and left 11 parser crashes in place, and on reasoning tasks (GPQA, MATH)
  VeRO''s optimizers, including its prompt-only variant, gained little or nothing. The value depends on
  the model: a merge-and-rank rewrite of stacked rules helped smaller models and was neutral to negative
  for the strongest (Claude Sonnet 4.6 went from 0.627 to 0.560 at twenty instructions, significant only
  at that size), format effects were small and changed sign between models, a hand-written version of
  the deep-research optimizer''s rules recovered about 57% of its gain with a confidence interval that
  included zero, and safety rules lost to cutting caused harm mainly under weaker models (a gap of 0.025
  under two strong models). The newer studies are narrow: the agent cutting result is one model (Gemini
  3.8 Flash at low thinking), one harness and 60 tool-using tasks run three times, from the company that
  publishes the profiles, and there the one-line prompt failed far more often on the first API call (27.9%
  of calls against 1.2%); the precedence sentence covers 40 synthetic Python projects, two agents and
  two runs per cell; 86.8% of the frontier rule-following verdicts come from an LLM judge (62.1% agreement
  with a second judge) and its precedence order from a pilot on nine older models; and the safeguard study
  covers two environments with four written rules each. Earlier format and context-file studies are also
  narrow (synthetic verifier-checked rules with 20 trials per cell; Python repositories with one sample
  per setting), no study yet restructures, rather than shortens or adds to, a frontier thinking agent''s
  own system prompt at matched compute, and governance and brand effects are unmeasured, so measure the
  change on your own agent.'
