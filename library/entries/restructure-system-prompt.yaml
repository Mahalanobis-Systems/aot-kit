caveats: Intermediate 20-task subset showed 45% and misled the optimizer; full evaluation regressed previously-passing
  tasks. 12 new passes against 6 regressions; the same run left 11 AttributeError crashes in
  place. Helps when the prompt was crowding out task context; hurts on reasoning tasks where
  the prompt carried procedure.
