    size: small
    when: 'adds: MAST +4.7 to +5.0 points on GSM-Plus (2025), VeRO MATH validation +0.10 with train -0.07;
      cuts: TerminalBench +6.8 points where the prompt crowded out context, GPQA train -0.04 where the
      prompt carried procedure'
    basis: evidence
  cost:
