absorbs:
- legacy_id: P01
  name: System prompt altitude and sectioned structure
  group: Context Engineering
  source: master
  family: prompt
  sub_type: formatting
  categories:
  - prompts.structure
  note: Balance specific vs vague; XML/markdown sections; tell the model what to do, not what not to do.
  assessment:
    detection:
      static: Parse prompt strings. Check for section delimiters (XML tags or headings), total length,
        ratio of MUST/NEVER/CRITICAL phrasing, long if-then rule lists (too specific) or no actionable
        rules (too vague), contradictory rules.
      traces: Outputs that violate a stated format or tool rule; sections the model never acts on.
      evals: Format-compliance rate; failure categories that map to a prompt section.
      judge: Rate the prompt for altitude, organization and contradictions; flag redundant tokens the
        model ignores.
      probes:
        what: One task per rule in the prompt, plus paraphrased versions of the same task.
        construct: Enumerate every instruction in the prompt; write an input that can only pass if that
          instruction is followed; paraphrase to test robustness to wording.
      primary:
      - static
      - probes
    qa:
      unit: 'Prompt lint: required sections present, length cap, no placeholder left unrendered, no contradictory
        rules.'
      examples: Run the per-rule probe set; every rule exercised at least once.
      benchmark: Task benchmark before and after at the same budget.
      production: Instruction-violation and format-compliance rates on sampled traffic.
      primary:
      - unit
      - examples
    impact:
      cost:
        effect: improves
        magnitude: low
        note: Shorter, stable prompts cache better.
      security:
        effect: none
        magnitude: low
        note: ''
      brand:
        effect: improves
        magnitude: low
        note: Consistent tone and format.
      governance:
        effect: improves
        magnitude: low
        note: Rules are readable and auditable.
      quality:
        effect: improves
        magnitude: medium
        note: VeRO T04 and T07 show restructuring can help or be net zero; the paper counts prompt edits
          as the lowest-leverage arm.
      latency:
        effect: improves
        magnitude: low
        note: Fewer prompt tokens.
      primary:
      - quality
