    et al.), "Toward Efficient Agents: A Survey of Memory, Tool Use, and Planning", https://arxiv.org/abs/2601.14192'
  date: '2026-01-20'
  task: Rewrite and compress tool documentation for retrieval
  effect: Described as reducing token overhead and redundant calls. No numbers are quoted.
  direction: supports
