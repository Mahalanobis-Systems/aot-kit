provenance:
  layer: target
  origin: observed
  change_type: tool
  sub_type: api
  harness_role: tool_surface
  action: reword
caveats: 'Most of the controlled evidence is narrow: the parameter-name and privilege results come from
  single-turn selection without execution (five tasks, thinking off or minimal) and from 544 simulated
  scenarios with nothing enforced, and the production result is three servers with 5 to 11 held-out tasks,
  one run each, judged by an LLM, where content scores fell on two. On a curated customer-service benchmark,
  description-only rewrites (the optimizer''s own, DRAFT, ToolObserver and GEPA) did not significantly
  raise reward, the one significant gain needed changes to tool code and did not hold when averaged over
  five agent models, and a rerun of an unchanged toolset scored 0.92 points lower and cost 13% more, so
  small differences are noise. Effects are model-specific: the same equivalent schema matched native success
  for one model and collapsed another, names and descriptions were largely redundant when names were informative,
  and a privilege note mostly delayed risky calls while a neutral note of the same format raised them
  on two models, so every added line needs its own paired test. Several sources are unmeasured practice
  (Arcade, Block, Datadog, Fan et al., VeRO''s tool-centric template), and the example gain (72% to 90%)
  is Anthropic''s internal testing with no benchmark or n given.'
