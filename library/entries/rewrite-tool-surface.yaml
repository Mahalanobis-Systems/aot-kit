- legacy_id: P09
  name: Poka-yoke tool design
  group: Tool Design
  source: master
  family: tool
  sub_type: validation
  categories:
  - tools.misuse
  note: Enums, absolute paths, strict validation, loud failure.
  assessment:
    detection:
      static: Schemas use enums and required fields; absolute-path checks; validation code with clear
        error messages.
      traces: Invalid calls that succeeded silently; relative-path errors after a directory change.
      evals: Silent-failure rate; validation rejection rate.
      judge: Inspect tool results for silently wrong behavior.
      probes:
        what: Deliberately invalid and edge inputs.
        construct: Fuzz each argument at its type boundaries; relative paths; out-of-range numbers; empty
          strings.
      primary:
      - static
      - probes
    qa:
      unit: Validation rejects bad inputs with actionable messages.
      examples: Fuzz probes.
      benchmark: null
      production: Validation rejection rate per tool.
      primary:
      - unit
