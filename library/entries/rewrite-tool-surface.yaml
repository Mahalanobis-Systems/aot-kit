# 2.a.ii: Rewrite the tool surface: names, schemas, descriptions
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 2.a.ii
legacy_id: T35
slug: rewrite-tool-surface
name: 'Rewrite the tool surface: names, schemas, descriptions'
kind: technique
status: card
tiers:
- tier: 1
  why: when the hand-labeled set shows behavior unchanged
- tier: 3
  why: otherwise, since it changes what the model sees
levers:
- tool-surface
domains:
- tool-use
evidence_domains:
- tool-use
- code-generation
- web-research
categories:
- tools.refactor
- tools.misuse
summary: 'Change what the model sees of each tool without touching its implementation: a distinct name,
  a strict schema (enums, required fields), and a description with fixed sections (what it is for and
  when to use it versus sibling tools, defaults and limits, error modes, side effects), plus a usage example
  for complex parameters. Write for the model: distinctive terms, since search finds tools by them; error
  messages that say what to do next. One rewrite fed the misrouted cases matches hand-tuning; richer descriptions
  add steps, so slim them after. Where two tools genuinely overlap, rewording cannot separate them: consolidate
  instead (2.a.i).'
how: 1. From traces, collect misrouted cases per tool (called when it should not have been, and not called
  when it should). 2. Audit descriptions for missing purpose, missing when-to-use, and duplicate names.
  3. Rewrite once with an LLM, given the misrouted cases; add a usage example for complex parameters.
  4. Slim the result and check step count. 5. Replay the hand-labeled set, or run the paired eval; pairs
  that stay confused go to 2.a.i for consolidation.
detect:
  static: descriptions that do not state the tool's purpose (56% of audited MCP tools) or when to use
    it; duplicate or overlapping names; schemas without enums or required fields; no example for complex
    parameters
  traces: misrouted cases per tool (false positives and false negatives); failure rows labeled incorrect-tool-selection,
    malformed-arguments or suboptimal-arguments; per-tool error rate and retries (Datadog tracks these
    per tool and server)
  evals: failures attributed to tool selection or arguments; step count per task after a description change
impact:
  quality:
    effect: improves
    size: medium
    when: +5.85 pp median success (Feb 2026); complex-parameter accuracy 72% to 90% with examples (Anthropic);
      a compliant description picked 72% vs 20% among equivalents
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: augmented descriptions added 67% more steps; slim variants keep most of the gain
    basis: evidence
  performance:
    effect: mixed
    size: small
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
measure:
- method: verify-fix
  tier: 1
  how: replay the hand-labeled set
- method: experiment
  tier: 3
  how: paired eval, old against new descriptions
