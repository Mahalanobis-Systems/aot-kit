  date: '2026-07-15'
  task: Prefer dedicated tools over shell in instructions
  effect: Claude Code "Do NOT use the Bash tool to run commands when a relevant dedicated tool is provided
    ... allows the user to better understand and review your work."
  direction: supports
  measured: false
  locator: Sec 7.3 "Tool-use philosophy"
- source: 'Barbaste et al., "Harness Engineering: Anatomy, Architecture, and Evolution of Coding Agents
    -- A Source-Code Study of Eleven Systems", https://arxiv.org/abs/2609.00006'
  date: '2026-07-15'
  task: Generate tool guidance from the active toolset
  effect: Pi "each tool contributes promptSnippet/promptGuidelines, so the prompt co-varies with the active
    toolset"; whole prompt is 30–40 lines.
  direction: supports
  measured: false
  locator: Sec 7.2 (Pi)
- source: Guo et al., "Learning to Rewrite Tool Descriptions for Reliable LLM-Agent Tool Use (Trace-Free+)",
    https://arxiv.org/abs/2602.20426
  date: '2026-02-23'
  task: Rewrite tool descriptions with a trained rewriter
  effect: 'StableToolBench with 150+ candidate tools: a curriculum-trained description rewriter, needing
    no per-tool traces, cuts the accuracy lost as the catalog grows by 29.23% and raises average query-level
    success by 60.89%; complementary to agent fine-tuning. Requires training the rewriter.'
  direction: supports
  measured: true
- source: 'Wang et al., "From Docs to Descriptions: Smell-Aware Evaluation of MCP Server Descriptions",
    https://arxiv.org/abs/2602.18914'
  date: '2026-02-21'
  task: 'Fix description defects: purpose, functionality and accuracy'
  effect: '18 description smells audited over 10,831 MCP servers; 73% have repeated tool names. Controlled
    mutations: functionality and accuracy defects shift selection most (+11.6%, +8.8%, p<0.001). Among
    functionally equivalent servers, a standard-compliant description is picked 72% of the time against
    a 20% baseline.'
  direction: supports
  measured: true
- source: Hasan et al., "Model Context Protocol (MCP) Tool Descriptions Are Smelly!", https://arxiv.org/abs/2602.14878
  date: '2026-02-16'
  task: Augment tool descriptions, then slim them
  effect: '856 tools on 103 MCP servers: 97.1% of descriptions have at least one smell; 56% do not state
    their purpose. Augmented descriptions: +5.85 pp median success, +15.12% partial completion, but +67.46%
    execution steps and 16.67% of cases worse. Slimmer variants keep most of the gain.'
  direction: mixed
  measured: true
- source: 'Zhou et al., "A Single Rewrite Suffices: Empirical Lessons from Production Skill Description
    Optimization", https://arxiv.org/abs/2606.30775'
  date: '2026-06-29'
  task: Rewrite descriptions once from misrouted cases
  effect: 'Production router (9 skills, 372 test cases) and ToolBench (16k tools): one LLM rewrite fed
    the false-positive and false-negative cases reaches 79.2% F1 against 79.4% hand-tuned, at 32x less
    effort. Iteration budget, feedback mix and training-set size each move F1 by under 0.5%.'
  direction: supports
  measured: true
- source: 'Zhou et al., "A Single Rewrite Suffices: Empirical Lessons from Production Skill Description
    Optimization", https://arxiv.org/abs/2606.30775'
  date: '2026-06-29'
  task: Consolidate tools whose scopes genuinely overlap
  effect: 'Same study: where two skills genuinely overlap in scope, rewording cannot separate them; the
    paper gives a signal for detecting such pairs, which need consolidation instead.'
  direction: mixed
  measured: true
- source: Bin Wu et al. (Anthropic), "Introducing advanced tool use on the Claude Developer Platform",
    https://www.anthropic.com/engineering/advanced-tool-use
  date: '2025-11-24'
  task: Add usage examples to tool definitions
  effect: 'Internal testing: examples in tool definitions raised accuracy on complex parameters from 72%
    to 90%.'
  direction: supports
  measured: true
- source: Rizel Scarlett (Block), "8 Things You Didn't Know About Code Mode", https://goose-docs.ai/blog/2026/02/06/8-things-you-didnt-know-about-code-mode/
  date: '2026-02-06'
  task: Use code mode for multi-tool tasks only
  effect: About 30% fewer tokens on identical tasks (one author's test, Opus 4.5); little benefit on single-tool
    tasks; model-dependent. A description mentioning 'long-running task' pulled in the wrong extension;
    explicit imports prevented it.
  direction: supports
  measured: false
- source: Guillaume Lebedel (StackOne), "Comparing BM25, TF-IDF, and Hybrid Search for MCP Tool Discovery",
    https://www.stackone.com/blog/mcp-tool-search-bm25-tfidf-hybrid/
  date: '2026-02-17'
  task: Choose the tool-search method by how many results the agent sees
  effect: '270 tools, 2,700 queries: top-1 retrieval BM25 14%, hybrid 21%, embeddings 38%; top-5 85-90%
    for all three. Whether a tool is found depends on distinctive terms in its description. Retrieval
    only, not task success.'
  direction: supports
  measured: true
- source: Sattanathan, Byrro and Tahler (Arcade.dev), "54 Patterns for Building Better MCP Tools", https://www.arcade.dev/blog/mcp-tool-patterns/
  date: '2026-02-09'
  task: Write descriptions and parameters for the model; errors that say what to do next
  effect: 'From building 8,000+ tools, not measured: descriptions and parameter names written for the
    model, lenient input handling, error messages that tell the agent what to do next, consistent response
    shapes, batch operations instead of one call per item.'
  direction: supports
  measured: false
- source: Lily Chen et al. (Datadog), "Gain end-to-end visibility into MCP clients with Datadog Agent
    Observability", https://www.datadoghq.com/blog/mcp-client-monitoring/
  date: '2025-12-01'
  task: Trace tool listing and calls, linked to the model call that chose them
  effect: Traces tools/list and call_tool, each linked to the LLM call that chose the tool; per-tool and
    per-server error rate, retries and p95 latency; large registries add latency. No wrong-tool or unused-tool
    metric. Not measured.
  direction: supports
  measured: false
