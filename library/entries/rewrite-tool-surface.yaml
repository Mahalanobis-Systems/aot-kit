- source: Simon Parkinson, Mauro Vallati, Zhipeng Wang, Mustafa Mustafa, "Does Showing Agents the Privilege
    of Their Tools Reduce Over-Privileged Tool Selection?", https://arxiv.org/abs/2610.40975
  date: '2026-10-29'
  task: Append each tool's privilege class (read, write, administer) and a cost from 1 to 10 to its description,
    with or without a least-privilege instruction in the system prompt, against no signal and a same-format
    neutral note (typical response time); measure how often the agent calls a higher-privilege tool before
    trying the sufficient standard ones, any risk-tool use and completion
  effect: 'Strict over-privileged selection (a risk tool called before the sufficient standard tools were
    tried), no signal to privilege note: Qwen3-8B 56.6% to 40.6%, Qwen3-30B-A3B 63.4% to 48.0%, Llama-3.1-8B
    12.9% to 3.9%, DeepSeek-v3.2 18.6% to 5.7%, Kimi K2.5 18.0% to 5.5%, Qwen3.5-397B 38.4% to 19.1%,
    GPT-5.2 5.7% to 2.4%, all significant; Claude Sonnet 4.6 1.5% to 1.1% (ns). On four models most of
    the drop reappeared as escalation after the standard tools had been tried, with safe completion moving
    under 3 points; any risk-tool use fell on seven models and rose on DeepSeek (62.9% to 71.3%); Llama-3.1-8B''s
    completion fell from 82.0% to 45.2%. Note plus least-privilege instruction: safe completion rose on
    seven of eight models (Qwen3.5-397B 18.8% to 51.1%, DeepSeek 3.9% to 30.7%). A neutral note in the
    same format never lowered escalation and raised it on DeepSeek (+12.1 points) and Qwen3-8B (+5.7).
    With 30% of costs randomized most of the effect remained (-15 and -11 points on two local models).'
  conditions: ToolPrivBench, all 544 scenarios in eight domains, three standard and three higher-privilege
    tools each able to complete the task, the first call to each standard tool fails once, up to five
    turns, temperature 0, simulated tools, nothing enforced; 27,456 runs; privilege labels drafted by
    Claude Sonnet 5.5 blind to tool roles (rater agreement kappa 0.70); signal variants on 100 scenarios
    and two local models only; independent
  direction: supports
  measured: true
  locator: Abstract; §4.2-§4.6; Tables 4-7; Fig. 4
- source: 'Maya Ravichandran, Pragya Tripathi, Dharamendra Kumar, Adith Swaminathan, Nathan Kallus (Netflix),
    "AT-AT: Automatic Tool Optimization from Agent Traces", https://arxiv.org/abs/2610.34679'
  date: '2026-10-26'
  task: Give a coding agent (Pi, driven by Claude Opus 4.7) past agent traces with their evaluation results
    and the tool source, and let it edit tool descriptions and, where allowed, implementations in one
    offline pass; compare with description-only editing, no traces, a single-shot LLM rewrite of the tool
    file and the DRAFT, ToolObserver and GEPA optimizers, on held-out tasks
  effect: 'tau2-bench-verified held-out reward, 30 trials per task: baseline to AT-AT (descriptions and
    code) Airline 52.17% to 59.17% (p=0.23), Retail 77.00% to 74.67% (p=0.23), Telecom 29.50% to 36.75%
    (p=0.003, the only significant gain). Descriptions only: 51.33%, 74.08%, 31.17%; single-shot LLM rewrite
    of the tool file: 52.50%, 74.92%, 30.50%; DRAFT: 53.50%, 75.50%, 25.58% (Telecom significantly worse,
    p=0.003); ToolObserver: 55.83%, 75.92%, 31.67%; GEPA: 51.50%, 76.08%, 29.25%. Cost per simulation
    rose significantly for most optimized toolsets (descriptions only: 0.0618 to 0.1176 USD in Airline,
    0.0707 to 0.1453 in Retail, 0.0996 to 0.2857 in Telecom); GEPA''s Retail toolset was byte-identical
    to the original yet scored 76.08% and cost 0.0798. Averaged over five agent models, AT-AT''s changes
    were not significant (Telecom 41.42% to 40.67%). OpenCode with Claude Opus 4.5, accepted edits description-only
    (e.g. the edit tool''s failure notes rewritten as next steps: ''Re-read the file and copy the exact
    bytes''): held-out pass@1 49.32% to 51.36% on TerminalBench-2 and 75.60% to 77.20% on TBLite. Three
    production MCP servers, description-only edits: pass rate 80.0% to 80.0%, 0.0% to 0.0% and 54.5% to
    72.7%; tool calls 176 to 133, 121 to 86 and 114 to 76; tool errors 15 to 10, 73 to 37 and 0 to 0;
    session cost $0.956 to $0.737, $0.442 to $0.276 and $0.288 to $0.235; content score 88.3% to 80.0%,
    37.7% to 36.7% and 64.7% to 69.0%; one-time optimizer cost $1.34 to $7.68 per server.'
  conditions: 'tau2-bench-verified with a GPT-4.1 agent and GPT-5.1 user simulator, one optimizer run
    per method (optimizer variance not measured); the description-only ablation also dropped traces from
    the optimizer''s prompt (they stayed on its filesystem); DRAFT and ToolObserver run as one-pass offline
    adaptations; TerminalBench-2 and TBLite without significance tests; production: DeepSeek V4 Flash
    agent, Claude Sonnet 4.6 user simulator, 10, 5 and 11 held-out tasks, one run, judged by an LLM (GPT-5.6
    Luna); workshop paper; the authors'' own method'
  direction: mixed
  measured: true
  locator: Abstract; §4.1 Table 1; §4.1.1 Table 2; §4.2 Table 3; §4.3 Table 4; App. B; App. C; App. D.2;
    App. F
- source: Xiaofan Li, Fengchun Qiao, Xing Gao, "Which Metadata Matters for LLM Tool Selection in MCP?
    Evidence from Controlled Factor-Level Interventions", https://arxiv.org/abs/2610.14334
  date: '2026-10-09'
  task: Offer two, three or five functionally equivalent MCP tools that differ in exactly one metadata
    field (server name, tool name, description or parameter schema), balance their positions, and estimate
    each field's effect on which tool the model picks
  effect: 'Parameter schemas had the largest and most consistent effects: 23 of 28 estimates excluded
    zero (22 positive), the largest effect in 19 of 30 task-model conditions, median 3.82 against 1.48
    for server names. Renaming a send-email tool''s ''to'' to ''recipient_id'' cut its selection to 1.0-10.0%
    across all five models; ''receiver'' kept it at 35.2-51.0%; identical field descriptions removed the
    drop. Separate top-level fields beat a grouped object (Create Issue: 93.3-100% of trials). Descriptions
    that explain parameters raised selection (21 of 30 estimates excluded zero, all positive). Tool names
    rarely mattered (6 of 29); with only names differing, four models picked the first-listed tool in
    79-96% of Create Issue trials, and with two Place Order tools all five did in 92-100%. When only one
    schema could take a requested CC recipient, all five models chose it in every valid trial; if it also
    renamed ''to'' to ''recipient_id'', three models chose it in only 53.0-67.4%.'
  conditions: GPT-5.4 mini, Claude Sonnet 4.6, Gemini 3.5 Flash, DeepSeek V4 Pro and Qwen3.7-Plus at API
    defaults, thinking off (Gemini minimal); five tasks with 50 LLM-generated English queries each; 2,
    3 or 5 candidates, 400 to 4,000 trials per task-model pair; position-adjusted conditional logit; single-turn
    selection among functionally equivalent tools, no execution and no task outcome; run Aug-Sep 2026;
    independent
  direction: supports
  measured: true
  locator: Abstract; §5.1 Table 2; §5.2 Fig. 3; §5.3; §5.4 Fig. 5; Limitations
- source: 'Yinhong Liu, Zhili Tan, Zilin Wang, Zhijiang Guo, "Action-Space Shaping for LLM Agents: Measuring
    and Mitigating Tool-Schema Bias", https://arxiv.org/abs/2609.34971'
  date: '2026-09-28'
  task: Rewrite one native tool schema into 32 verified-equivalent variants (merge or split tools, rename,
    strip descriptions, nest or reorder arguments, multi-call protocols) with tasks and executable actions
    fixed; measure success per model, test cheap ways to predict a variant's difficulty, and try constrained
    decoding, instructions and training as fixes
  effect: 'Success ranged from complete failure to 97% depending only on the schema, and equivalent schemas
    moved both closed models by 32 points. Per-tool changes mattered little: nesting arguments, stripping
    descriptions and reordering arguments moved success by at most 4 points on each of nine open models;
    opaque names cut Qwen2.5-7B from 0.54 to 0.27 and changed every other model by at most 3 points (''names
    and descriptions are redundant routing signals''). Fully merging tools cost a median 19 points, the
    nested merged form cost every model 19 to 73 points, and multi-call protocols collapsed most earlier-generation
    models. On four real benchmarks, changes to a tool''s own representation stayed within 0.10 of native
    except stripping descriptions on BFCL (-0.23 for Qwen3.5-27B, -0.10 for Qwen3-4B). About 100 target
    queries per variant ranked variants nearly as the full set did (Spearman 0.81; 0.72 with 36), against
    0.52 and 0.57 for query-free probes. Constraining the first call to be schema-valid changed Qwen3-4B
    by 0.00 on the native schema and +0.29 on the fully merged one; training repaired only variants present
    in its data.'
  conditions: Synthetic environment with 12 domains, 168 operations and 2,748 tasks, exact native-action
    scoring, off-schema calls rejected as recoverable errors, deterministic decoding; nine open models
    (Qwen2.5 7B-32B, Qwen3-4B, Qwen3-30B-A3B, Llama-3.1-8B, Gemma-4-12B, Qwen3.5 27B and 35B-A3B with
    thinking) on 32 variants, gpt-6-luna and GLM-5.3-Flash on 13, one run each; real-benchmark check (tau2-bench,
    BFCL, AutomationBench, MCP-Atlas) with two Qwen models only; independent
  direction: mixed
  measured: true
  locator: Abstract; §5.1-§5.2; §7; §8 Table 3; App. A; App. D.3; App. D.4 Table 8
