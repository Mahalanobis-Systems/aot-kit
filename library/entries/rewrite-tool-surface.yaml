summary: 'Rewrite each tool''s name, parameters and description for the model, starting from the calls
  it gets wrong. Give each tool a distinct name, a strict schema whose parameter names say what the request
  supplies, and a description with fixed sections (what it is for and when to use it versus sibling tools,
  defaults and limits, error modes and what to do next, side effects), plus an example for complex parameters:
  in one study parameter names and structure swayed five models'' choice between equivalent tools far
  more than tool names did, examples raised complex-parameter accuracy from 72% to 90% in Anthropic''s
  testing, and one LLM rewrite fed the misrouted cases matched hand-tuning. Task-level gains are often
  small: trace-driven description edits cut tool calls 24-33% and cost 18-38% on three production servers
  but raised the pass rate on only one, description-only rewrites did not significantly lift a customer-service
  benchmark (one cut a domain from 29.5% to 25.6%), and with informative names, stripping descriptions
  moved success at most 4 points on nine open models, so slim the result and keep only what a paired test
  per model confirms. Where a failure needs a lookup or a result the tool does not provide, change the
  tool itself; where two tools genuinely overlap, rewording cannot separate them: consolidate instead
  (2.a.i).'
how: '1. Start from the baseline: from traces or the eval set, collect per tool the misrouted cases (called
  when it should not have been, not called when it should), malformed or wrong arguments, tool errors
  and retries, and calls, tokens and cost per task. Label which failures a description could fix: in one
  study most failures on a customer-service domain were reasoning errors made after the tools had returned
  what was needed, and failures that needed a lookup or a result the tools did not provide were fixed
  by changing the tool, which a description cannot do; tool pairs whose scopes genuinely overlap go to
  2.a.i. 2. Audit names, schemas and descriptions: missing purpose (56% of audited MCP tools) or when-to-use
  against sibling tools, repeated names (73% in an audit of 10,831 MCP servers), parameters without a
  type, enum, required flag or description, parameters grouped into one object, and parameter names that
  signal a different input from what requests supply (renaming a send-email tool''s ''to'' to ''recipient_id''
  cut its selection to 1-10% across five models, while ''receiver'' kept it at 35-51%). 3. Fix the schema:
  separate top-level parameters named for what the request supplies (models chose them over one grouped
  object in 93-100% of trials), a description for each parameter, types, enums and required fields, and
  the provider''s strict or constrained tool calling where offered (in one study forcing a schema-valid
  first call added nothing on the native schema and 29 points on a merged one). On tools other agents
  already call, keep names and parameter contracts and change only descriptions, as one production study
  did. 4. Write each description in fixed sections: what it is for and when to use it versus siblings,
  defaults and limits, error modes and what to do next, and side effects with a privilege level (read,
  write or administer), in the distinctive terms tool search matches on; add a usage example for complex
  parameters (72% to 90% accuracy in Anthropic''s testing). In one benchmark a privilege class and cost
  appended to each description cut premature use of a higher-privilege tool by 3.3 to 19.3 points on seven
  of eight models, mostly by delaying it; with a least-privilege instruction in the prompt as well (2.b.ii)
  safe completion rose on seven of eight (18.8% to 51.1% at best), and neither replaces enforcement (10.a.i,
  10.b.i). 5. Rewrite once from the misrouted cases with an LLM, or with a coding agent that reads the
  traces and the tool code: one rewrite matched hand-tuning (79.2% against 79.4% F1), and on a customer-service
  benchmark only a coding agent that read past traces and could also change tool code raised reward significantly
  (Telecom 29.5% to 36.8%), while description-only edits, a single-shot rewrite of the tool file and the
  DRAFT, ToolObserver and GEPA optimizers did not, and DRAFT''s rewrite cut it to 25.6%. 6. Slim the result:
  richer descriptions add steps and tokens (augmented MCP descriptions added 67.46% more execution steps;
  description-only toolsets cost 1.9 to 2.9 times as much per run in one benchmark), so drop sections
  the paired eval shows the model does not need; with informative names, stripping descriptions moved
  success at most 4 points on nine open models but cost 0.23 on BFCL, whose tools rely on them. 7. Measure:
  replay the hand-labeled set, then run a paired eval per model, old against new, on at least about 100
  target tasks (about 100 queries ranked schema variants nearly as the full set did, Spearman 0.81, against
  0.52-0.57 for query-free probes), several trials per task with a paired test (one study used 30 per
  held-out task, and an unchanged toolset rerun scored 0.92 points lower), and tool order varied (with
  only names differing, four of five models picked the first-listed tool in 79-96% of trials); report
  wrong-tool rate, argument and tool errors, pass rate overall and on previously passing tasks, and calls,
  tokens and cost per task, and re-run when the model changes. Pairs that stay confused go to 2.a.i.'
detect:
  static: descriptions that do not state the tool's purpose (56% of audited MCP tools) or when to use
    it; duplicate or overlapping names; schemas without types, enums, required fields or parameter descriptions;
    parameter names that signal a different input from what requests supply (an id where users give an
    email address) and parameters grouped into one object; no statement of side effects or privilege;
    no example for complex parameters
  traces: misrouted cases per tool (false positives and false negatives); failure rows labeled incorrect-tool-selection,
    malformed-arguments or suboptimal-arguments; per-tool error rate and retries (Datadog tracks these
    per tool and server); tool calls and cost per task; a higher-privilege tool called before the standard
    ones were tried
  evals: failures attributed to tool selection or arguments, separated from failures where the tool had
    returned what was needed; step count, tool calls and cost per task after a description change; wrong-tool
    rate under varied tool order
  probes:
    what: Requests that should route to each tool, phrased in users' terms, boundary cases between similar
      tools, and inputs in the forms users give (an email address, an owner/repo path).
    construct: For each tool write requests that need it with and without its key terms, for each similar
      pair requests that should route to each, and for each parameter inputs in the forms users supply;
      run each in several tool orders and score wrong-tool picks and argument errors.
impact:
  quality:
    effect: improves
    size: medium
    when: examples raised complex-parameter accuracy from 72% to 90% (Anthropic, Nov 2025); augmented
      MCP descriptions +5.85 pp median success, with 16.67% of cases worse (Hasan, Feb 2026); a compliant
      description was picked 72% vs 20% among equivalents (Wang, Feb 2026), and a parameter renamed 'recipient_id'
      cut a tool's selection to 1-10% (Li, Oct 2026); one rewrite matched hand-tuning, 79.2% vs 79.4%
      F1 (Zhou, Jun 2026); description edits raised held-out pass@1 from 49.3% to 51.4% on TerminalBench-2
      and the pass rate on one of three production servers (54.5% to 72.7%, 11 tasks), while description-only
      rewrites left tau2-bench reward unchanged and DRAFT's cut Telecom from 29.5% to 25.6% (Ravichandran,
      Oct 2026); with informative names, stripping descriptions moved success at most 4 points on nine
      open models (Liu, Sep 2026)
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: augmented descriptions added 67.46% more execution steps, and slim variants keep most of the
      gain (Hasan, Feb 2026); trace-driven description edits cut tool calls 24-33%, tool errors 33-49%
      and session cost 18-38% on three production MCP servers for a one-time $1.34-$7.68 each, while on
      tau2-bench description-only toolsets cost 1.9 to 2.9 times as much per run and a rerun of an unchanged
      toolset cost 13% more (Ravichandran, Oct 2026)
    basis: evidence
  performance:
    effect: mixed
    size: small
    when: a tool-testing agent's description rewrite cut task completion time 40% (Anthropic, Jun 2025);
      augmented descriptions added 67.46% more execution steps (Hasan, Feb 2026); description edits cut
      tool calls 24-33% on three production servers (Ravichandran, Oct 2026)
    basis: evidence
  security:
    effect: improves
    size: small
    when: a privilege class and cost appended to each tool description cut premature use of a higher-privilege
      tool by 3.3 to 19.3 points on seven of eight models (Claude Sonnet 4.6 unchanged at 1.5%), mostly
      by delaying it; with a least-privilege instruction too, safe completion rose on seven of eight (18.8%
      to 51.1% at best), and a neutral note of the same format raised escalation on two models (Parkinson,
      Oct 2026); nothing is enforced, so it complements enforcement (10.a.i, 10.b.i)
    basis: evidence
  governance:
    effect: unknown
