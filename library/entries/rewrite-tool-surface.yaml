  task: five follow-up benchmarks
  effect: 7 to 18 of 20 runs per benchmark.
- source: paper Table 11
  task: GAIA/FACTS/SimpleQA
  effect: The Tool-Centric template is built around docstring guidance and parameter design.
- source: Jeremy Hadfield, Barry Zhang, Kenneth Lien, Florian Scholz, Jeremy Fox, Daniel Ford (Anthropic),
