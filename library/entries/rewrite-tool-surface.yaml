    purpose and a clear description."'
  direction: supports
  measured: false
  locator: 'Prompt engineering: Tool design and selection are critical'
- source: Jeremy Hadfield, Barry Zhang, Kenneth Lien, Florian Scholz, Jeremy Fox, Daniel Ford (Anthropic),
