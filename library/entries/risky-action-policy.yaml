- source: 'Junwei Yao, Zike Yang, Zhijun Wang, Yongxi Zhou, Wenbo Ye, "When Neither Side Confirms: Destructive
    Tool Approval Across MCP Servers and Hosts", https://arxiv.org/abs/2611.02527'
  date: '2026-11-02'
  task: 'Measure from source code whether a human approves destructive MCP tool calls by default: code
    the server-side confirmation of destructive tools in a 1,000-repository sample of the official MCP
    registry and the default approval path of 41 open-source hosts and agent SDKs, combine them per host
    and tool pair, check 7 hosts live, and inject a deletion request into a read-only tool''s output through
    four agent SDKs'
  effect: 'An estimated 90% of destructive tools (95% CI 82-95) have no server-side confirmation (70%
    neither confirm nor annotate, 20% carry an annotation only); of 168 tools that elicit by default,
    130 still run when the host cannot relay the question (100 fall back to a model-settable flag, 30
    proceed). Of 41 hosts, 7 prompt before ordinary MCP calls, Codex CLI decides from annotations, Qwen
    Code uses an LLM classifier, and 32 have no approval step by default (16 of 25 applications, all 16
    SDKs). No approval is enforced in 60.7% of destructive-tool and application pairs (74.9% with all
    41 hosts). Injection: four of five low-cost models executed an injected deletion in 479 of 960 runs
    (479 of 1,200 across all five); on the annotation-only server every attempted deletion succeeded (180
    of 180), and on a server with a confirmation flag models set confirm=true themselves in 127 of 169
    attempts when the injected text did not name it. If hosts prompted for every tool not annotated read-only
    or non-destructive, the unapproved share would fall to 5.4% (at least 10.6% for all hosts once unflagged
    tools are added), while the share of pairs with a harmless flagged tool that ask the user would rise
    from 32.5% to 82.6%; universal elicitation support would leave 56.7%.'
  conditions: 'Static reading of pinned commits: 1,000 registry repositories (200 most-starred, 800 random;
    Python, TypeScript, JavaScript), 269 tools adjudicated destructive by two LLM coders with a third
    resolving disagreements, checked against a 60-tool human audit (tiers matched for 58 of 60); 41 open-source
    hosts traced by an AI agent, 20 re-traced independently; shares count host and tool pairs, not users
    or calls, and do not measure whether users read prompts. Injection runs: a stub server deleting in-memory
    notes, four SDKs, five low-cost models (Qwen3.7-Flash, Gemma 4 26B-A4B, Mistral Small 2603, GPT-4o-mini,
    DeepSeek-V4.1-Flash), 240 runs per model; independent researchers'
  direction: supports
  measured: true
  locator: Abstract; §3; §4 Table 1; §5 Tables 2 and 3; §6 Table 4 and counterfactuals; §7; Limitations
- source: Weiheng Wu, Junkai Chen, Zhensu Sun, Jieke Shi, Yunbo Lyu, David Lo (Singapore Management University),
