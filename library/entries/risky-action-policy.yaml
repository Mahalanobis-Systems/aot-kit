caveats: 'Every source comes from coding-agent harnesses (a source-code study of 11 of them, and
  one controlled study that held the policy fixed), and none measures the gate''s effect. The shell examples
  (rm -rf, sudo, git push, command parsing) are one case of the general rule. Asking too often has a cost
  of its own: approvals slow the agent, and humans who are asked constantly start approving without reading,
  so stage and batch where you can rather than prompt per action.'
