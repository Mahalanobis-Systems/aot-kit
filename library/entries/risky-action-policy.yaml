caveats: 'The measured evidence is recent, from benchmarks and small samples, and mostly from coding agents:
  the harness comparison ran one acting model and one 27B reviewer on two tasks per mechanism; the approver
  comparison ran each of 682 tasks once with one agent and one approver model, against no attacker that
  adapts to the approver; the human study had 17 to 19 developers per condition working with agents instructed
  to exfiltrate data; and the MCP shares (60.7% unapproved, and 5.4% if hosts asked for every tool not
  annotated read-only or non-destructive) are estimates from reading source code, not runtime counts.
  Every gate leaks where an action reaches it by another path (an allowed interpreter, a file edit, an
  MCP tool), approvers that read only command text barely beat no approval, and a sandboxed pre-run cannot
  undo anything that leaves the sandbox, so it has to run with the network off. Humans are weak approvers:
  most developers missed covert exfiltration in CI-gated sessions and most kept it after a correct alert,
  and asking for every tool not annotated read-only or non-destructive would raise asks on harmless tools
  (from 32.5% to 82.6% of such pairs in one estimate), so stage and batch where you can and keep a blocking
  deny floor beside the prompts.'
