# 10.b.i: Gate irreversible actions: allow, ask or deny by side effect
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 10.b.i
legacy_id: T69
slug: risky-action-policy
name: 'Gate irreversible actions: allow, ask or deny by side effect'
kind: technique
status: card
tiers:
- tier: 2
  why: safety containment
levers:
- guardrails
domains:
- general
evidence_domains:
- code-generation
categories:
- safety.approval
summary: 'Classify every action the agent can take by its side effect (read, reversible write, irreversible
  or externally visible: sending email, issuing a refund, deleting a record, posting publicly, pushing
  code) and gate by class: allow, ask a human or a policy, or deny. Where the environment already stages
  changes before they reach the world, gate only what escapes the stage. Coding agents can run on auto-approve
  because the development process contains their changes (a branch, PR review and CI stand between the
  agent and production). Most other agents (marketing, support, CRM, finance) have no such stage, so the
  gate has to sit at the action, or the harness has to build one: drafts, pending changes, batched approval.
  Keep a deny floor that auto-approve cannot switch off, and write the policy as code with tested examples.'
how: '1. List the agent''s actions and mark each one''s side effect: read, reversible write, irreversible
  or externally visible. 2. For each irreversible action, find where review can happen: an existing stage
  (branch and PR, draft, staging environment) or none. 3. Where there is no stage, add one (draft and
  approve, pending changes, batch approval) or an ask gate on the action; deny what should never run unattended,
  in a floor auto-approve cannot lift. 4. Write the policy as code with tested examples. 5. Run safety
  evals built from irreversible actions; monitor approved, denied and escalated actions in production,
  including how often humans approve without changes.'
detect:
  static: tools with irreversible or externally visible effects (send, pay, delete, publish, push) with
    no gate and no staging step; one approval setting for every tool; a deny list that auto-approve disables
  traces: irreversible actions taken without a policy or human check; failure rows labeled unauthorized-irreversible-action
    or over-initiative
  evals: safety cases built from the agent's own irreversible actions, including prompt-injected requests
    for them
impact:
