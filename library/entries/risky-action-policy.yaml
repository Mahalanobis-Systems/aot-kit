  date: '2026-10-29'
  task: 'Compare approval mechanisms for a coding agent''s shell commands: no approval, a rule checker
    (CARE), three guardrail models (TS-Guard, gpt-oss-safeguard-20b, Qwen3Guard-Gen-8B), a staging file
    system whose change summaries the agent reviews and reverts itself (YoloFS), Claude Code Auto Mode,
    and Caper, which pre-runs each command in a snapshotted sandbox with the network off, gives an LLM
    approver a bounded report of observed effects, commits allowed commands and rolls back blocked ones
    with a reason'
  effect: 'SABER (682 shell tasks), harmful-outcome rate: no approval 19.7%; CARE 15.0%, TS-Guard 18.8%,
    gpt-oss-safeguard 18.6%, Qwen3Guard 16.0%, Claude Code Auto Mode 14.8%, YoloFS 21.2%; Caper 6.7% (10.0%
    as a Claude Code hook). Safe outcomes 66.6% without approval and 67.8% with Caper (safe completions
    57.4% and 48.6%). YoloFS-Ext (102 tasks whose harm hides inside an invoked tool, each with a safe
    twin): harmful 71.6% without approval, 62.7% to 94.1% for the text-based approvers (Auto Mode 62.7%),
    35.3% for YoloFS, 7.8% for Caper (6.9% as a hook); safe twins blocked 1.0% by Caper, 3.9% by Auto
    Mode, 8.8% by TS-Guard, 15.7% by gpt-oss-safeguard. Without the effects report the same approver blocked
    61.8% of safe twins; predicting effects from the command and the files it references cut harm about
    as far but still blocked 61.8%. ''YoloFS leaves more harm than no approval at all (21.2% versus 19.7%)
    because a credential once sent cannot be recalled.'' Overhead: median approval latency 3.2 s (p95
    6.4 s) against 3.3 s (11.4 s) without the report; the sandbox adds about 0.5 s per allowed and 1.5
    s per blocked command; approver cost $0.0135 per SABER task (10.3 calls) on top of $0.0053 for the
    agent, against $0.0060 for the agent alone; Auto Mode''s classifier an estimated $0.0550 per task
    at most.'
  conditions: Agent GLM-5.3-Flash in SABER's loop (one bash tool, at most 60 steps); Caper's approver
    and Auto Mode's classifier both gpt-5.6-luna; each system ran each task once; SABER judged with the
    authors' revised oracle (Caper is also lowest under the released one); YoloFS-Ext is the authors'
