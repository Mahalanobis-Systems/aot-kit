  task: Weight verifiers by estimated accuracy, not naive averaging
  effect: 'Llama 3.3 70B, K=100, average of 4 benchmarks: Weaver 87.7% vs majority vote 72.2%, best single
    RewardBench RM 72.7%, naive top-10 RM ensemble 69.1%, first sample 68.4%, Pass@100 oracle 91.9%; o3-mini
    first sample 86.7%. Oracle-labeled weighted ensembles beat naive averaging by up to 11.2 points (3.6
    for top-K selection, 7.8 for supervised weights on average). Individual verifier success rates span
    up to 37.5 points.'
  direction: supports
