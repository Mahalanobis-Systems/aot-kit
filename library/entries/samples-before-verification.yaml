  date: '2025-06-22'
  task: Expect verifier ensembles to cost far more than voting
  effect: Majority voting plateaus around 2^2-2^3 ExaFLOPs per query while Weaver keeps improving up to
    512 ExaFLOPs (K from 1 to 100); the authors call the extra compute "prohibitive". Standard baselines
    (majority vote, single RM, self-verification, multi-agent verification) plateau after a few generations;
    self-verification averaged 66.9% and multi-agent verification 71.6% at K=100, below majority vote
    (72.2%).
