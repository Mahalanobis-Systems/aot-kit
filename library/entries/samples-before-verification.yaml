measure:
- method: experiment
  tier: 3
  how: 'paired eval on the same labeled tasks at matched dollar cost with every call charged: one run,
    N runs with a vote (or test execution for code), and N runs with a judge or verifier; report coverage,
    selection accuracy when a correct candidate exists, empty selections, cost and latency, split by difficulty
    and by whether runs disagree, with a stronger model answering once as a reference'
- method: monitor
  how: 'in production traces: answer disagreement across parallel runs per task, how often selection returns
    no usable candidate, the share of tasks stopped at the first accepted candidate, and cost and latency
    per task; rerun the labeled pilot when the model, prompt or verifier changes'
evidence:
- source: 'Singhi et al., "When To Solve, When To Verify: Compute-Optimal Problem Solving and Generative
    Verification for LLM Reasoning", https://arxiv.org/abs/2504.01005'
  date: '2025-04-01'
  task: Prefer self-consistency over generative verification at low budgets
  effect: 'Llama-3.1-8B GenRM-FT on MATH: GenRM needs 8x the compute of SC to match it, and 128x to beat
    SC''s best by 3.8%; SC plateaus around 128 solutions. Qwen-2.5-7B GenRM-FT: SC peaks with 64x less
    compute; GenRM +5.4% at 512x. Llama-3.3-70B GenRM-Base: SC peak at 4x less; GenRM +1.7% at 64x. QwQ-32B
    on AIME25: GenRM needs 4x to match, +2.5% at 16x. GPQA-Diamond (70B): +2.5% at 256x. LiveCodeBench
    (8B): 16x to match, +3.5% at 64x. Comparing at fixed solution count instead (GenRM matches SC with
    4x fewer solutions) is called misleading.'
  direction: supports
  measured: true
  locator: §5.1, Figures 1, 4, 5, 8, 9; Appendix G, H
