# 9.c.ii: Spend extra samples before extra verification: parallel attempts with a vote or judge; verify only where it pays
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 9.c.ii
legacy_id: T46
slug: samples-before-verification
name: 'Spend extra samples before extra verification: parallel attempts with a vote or judge; verify only
  where it pays'
kind: technique
status: card
tiers:
- tier: 3
  why: extra compute within the existing design
levers:
- control-flow
domains:
- general
evidence_domains:
- reasoning
- data-analysis
- planning
categories:
- verification.spend
- orchestration.extra-compute
summary: 'Running several independent attempts and picking by majority vote or a judge raised accuracy
  (Genie 73.8% to 81.4% with 8 runs, at up to 2.1x cost). Before adding a generative verifier on top,
  compare it with the vote at equal compute: it needs 4-64x the compute to match, and pays only on hard,
  medium-difficulty problems from weak-to-medium generators. If you do verify, an ensemble of diverse
  weak verifiers weighted by estimated accuracy beat one strong verifier (87.7% against 72.2%).'
how: 1. Measure variance across repeated runs on the same questions; if low, stop here. 2. Add N parallel
  attempts with a vote or aggregator; paired eval at matched compute. At a fixed thinking budget, parallel
  traces with a majority vote beat forcing one trace to think longer. 3. Only then try a verifier, at
  the same compute, on the hard slice.
detect:
  static: a single attempt per question; or a generative verifier or best-of-N step with no comparison
    against a plain vote
  traces: answer disagreement across repeated runs of the same question
  evals: accuracy of vote against verifier at equal compute, split by difficulty
