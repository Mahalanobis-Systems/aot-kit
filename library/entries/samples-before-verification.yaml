provenance:
  layer: target
  origin: observed
  change_type: workflow
  sub_type: parallelization
  harness_role: control_loop
  action: tune
caveats: 'Most of the evidence is math, code and question answering, and the agent results come from single
  runs or replays of fixed candidate pools, several by the authors of the selector or verifier being tested
  (a learned search selector, a workspace verifier) and one a single-author reanalysis of public releases.
  A vote needs comparable final answers: on open-ended artifacts it barely helped and 34% of values all
  ten runs agreed on were wrong, and any selector is capped by coverage (a 16-run search vote reached
  75.5% against 90.9% coverage). Parallel whole runs need a resettable environment, learned selectors
  need labeled pools (2,655 questions in one study), and fixed tests accept more wrong code from stronger
  generators (Spearman 0.97 across 17 models on HumanEval+), so results do not carry across models without
  re-measuring. In one sealed study a stronger model answering once beat five cheaper models given extra
  samples everywhere except programming (math 57 against 52 of 60, workflows 148 against 82 of 160).'
