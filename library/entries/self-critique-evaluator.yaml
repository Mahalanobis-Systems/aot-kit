caveats: 'Most evidence comes from instruction-following benchmarks graded by GPT-4 (AlpacaEval, Arena-Hard)
  or from judge benchmarks also used for model selection, and the agent-loop studies are small: 28 held-out
  DeepSWE tasks with one run per arm, locked sets of 40-48 items over three seeds, one model family. Gains
  shrink on strong reasoning bases (+0.6 on JudgeBench for a Qwen3-32B thinking model, which o3 still
  beat), and the largest self-play hacking appeared in a regime built to hold accuracy low; under natural
  chain-of-thought the gap between judge pass rate and true accuracy fell to 0.086-0.125. A judge from
  another family cuts self-preference but not shared blind spots: judges favor any model whose mistakes
  resemble theirs, and errors a policy learned against one judge fooled judges of other families. Several
  methods sold as label-free still used human data (Self-Rewarding''s seed evaluation examples, a ten-item
  anchor, accepted and rejected pull requests), so treat a small human set as part of the method.'
