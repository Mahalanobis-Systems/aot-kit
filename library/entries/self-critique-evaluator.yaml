caveats: 'Most evidence comes from judge benchmarks also used for model selection, instruction-following
  benchmarks graded by GPT-4, or single-run agent studies; the largest human-labeled agent test (1,019
  computer-use trajectories, one run) left the trained 9B judge at 60.2% against 69.7% for the best frontier
  judge on failure-heavy runs, and the drift and shared-weight results come from one two-author image-generation
  study and one 4B policy trained once. Gains shrink on strong bases: +0.6 on JudgeBench for a Qwen3-32B
  thinking judge, which o3 still beat, and four times the parameters added 2.4 points to a trained computer-use
  judge on failure-heavy runs; the largest self-play hacking appeared in a regime built to hold accuracy
  low, and under natural chain-of-thought the gap between judge pass rate and true accuracy fell to 0.086-0.125.
  A judge from another family cuts self-preference but not shared blind spots: judges favor any model
  whose mistakes resemble theirs, errors a policy learned against one judge fooled judges of other families,
  and judges of every family accepted failed computer-use runs that claimed success. Several methods sold
  as label-free still used human data (Self-Rewarding''s seed evaluation examples, a ten-item anchor,
  accepted and rejected pull requests), so treat a small human set as part of the method; and no source
  here times a trained judge per call against a prompted frontier judge or compares its selection with
  a plain majority vote over the generator''s samples at equal compute.'
