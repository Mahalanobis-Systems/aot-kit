summary: 'Train or tune the system''s own judge from its own outputs and synthetic judgments (contrastive
  pairs with one side deliberately degraded, the judge''s own verdicts kept only where they match the
  construction label) instead of human labels, then use it to score, select or train in the loop. It pays
  where no sound check exists and a prompted judge is too weak or too costly: synthetic-only training
  lifted a 70B judge from 75.4 to 88.3 on RewardBench and another 70B judge from 48.6 to 60.0 on JudgeBench,
  and an agent-loop verifier evolved from ten anchored examples agreed with held-out labels 0.625
  of the time against 0.55 for the bare LLM judge it contains, a gap that was not significant. The limits are the point: gains concentrate on the benchmark used for selection (human
  agreement on MT-Bench moved only from 77.8 to 78.9), and a policy optimized against its own reference-free
  judge drove the judge''s pass rate from 0.72 to 0.94 while true accuracy stayed at 0.20. Keep a human-labeled
  set the judge never trains or selects on; the agent''s downstream score cannot validate the judge.'
how: '1. Start from the baseline: a prompted judge from another model family with written criteria (7.c.iii),
  or a sound external check where one exists (9.a.i). Bootstrap your own judge only where that baseline
  disagrees with human labels too often or costs too much per call. First label two small human sets:
  one for calibration and selection, and a locked one the judge never trains or selects on (one agent-loop
  verifier was selected on ten anchored items and validated on locked sets of 40-48). 2. Build contrastive
  pairs from your own traces so the label comes from construction, not from the judge''s opinion: a good
  output against a degraded one, such as an answer to a subtly modified instruction, a sampled answer
  that fails a known-answer check, or an output cut to a bare opener (''Thought process:''). Include both
  orderings of every pair. 3. Train the judge on the pairs (fine-tune on its own verdicts that match the
  label and iterate, or RL on verdict correctness), or tune a judge prompt against them. Prefer a base
  from another family than the generator, since self-preference rises with self-recognition, but check
  it: judges also favor any model whose mistakes resemble theirs. Where answers are checkable, make the
  judge commit its own answer before it compares (false-positive rate on wrong answers 0.719 to 0.012
  in one study). 4. Gate it before use: chance-corrected agreement and true- and false-positive rates
  on the locked set; judge benchmarks other than the one used for selection; accuracy on the generator''s
  outputs against equal-quality outputs from other sources; false-positive rate on adversarial probes
  (bare openers, punctuation, padded and plausible-but-wrong answers). Never validate it by the agent''s
  downstream score: an always-pass verifier trained skills as well as a valid one. 5. In the loop, control
  length when picking preferred outputs, track the judge''s pass rate against audited accuracy, and keep
  a human-audited sample and an outer judge outside the loop (9.c.iii). 6. Refresh on a schedule from
  new traces: promote a retrained judge only if it agrees better with the locked set, add outputs the
  old judge wrongly accepted as negatives, and discard scores that depended on the replaced judge. 7.
  Measure with a paired eval on the locked set against the prompted judge and against best-of-N or majority
  vote at equal compute (9.c.ii); report the gap between the judge''s pass rate and audited accuracy at
  every iteration.'
detect:
  static: A pipeline that trains or prompt-tunes a judge on the system's own outputs or its own verdicts,
    with periodic refresh. Flag a judge from the same model or family as the generator, no human-labeled
    set held out from both training and selection, and a judge validated only by the agent's downstream
    score.
  traces: Judge pass rate and score distribution per training or refresh iteration next to accuracy on
    an audited sample; a widening gap, scores saturating near the top of the scale, and output length
    rising across iterations.
  evals: Chance-corrected agreement with a locked human-labeled set; the judge's accuracy on the generator's
    own outputs against equal-quality outputs from other sources; results on judge benchmarks other than
    the one used for model selection.
  judge: An outer judge kept outside every loop, from another family, given the task contract and checked
    against humans.
  probes:
    what: 'Outputs built to fool the judge: content-free answers, plausible-but-wrong answers and padded
      answers, plus the generator''s outputs paired with equal-quality outputs from other sources.'
    construct: Cut real outputs to a bare reasoning opener or punctuation ('Thought process:', ':'); collect
      confident wrong answers the generator produces, or that a loop optimized against the judge converges
      on; pad correct answers; pair generator outputs with equal-quality outputs from another model or
      a human. The judge must reject the first three and score the pairs evenly.
  primary:
  - evals
  - probes
impact:
  quality:
    effect: mixed
    size: medium
    when: 'gains on judge benchmarks and on what is trained against them: RewardBench 75.4 to 88.3 (Wang,
      Aug 2024); JudgeBench 48.6 to 60.0 for a 70B judge trained on 22K synthetic pairs, but +0.6 (70.8
      to 71.4) on a Qwen3-32B thinking base, still below o3''s 75.7 (Whitehouse, May 2025); AlpacaEval
      2 LC win rate 25.5% to 39.4% (Wu, Jul 2024); search with a co-evolved code reviewer found a coder
      passing 23 of 28 held-out DeepSWE tasks against 21 of 28 with a fixed evaluator, one run (Iacob,
      Jun 2026).
      Gains that do not transfer: MT-Bench human agreement 77.8 to 78.9 (Wang, Aug 2024); a self-trained
      8B judge scored 83.0 against 69.5 on RewardBench but 30.2 against 32.3 on JudgeBench (Whitehouse,
      May 2025); self-play against its own judge took the pass rate from 0.72 to 0.94 at 0.20 true accuracy
      (Zhou, Jul 2026)'
    basis: evidence
