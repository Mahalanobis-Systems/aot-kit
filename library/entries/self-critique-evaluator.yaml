summary: 'Train your own judge on your system''s outputs, labeled by construction, by execution or by
  agreeing stronger judges, instead of paying humans or a frontier judge for every verdict. It pays where
  no sound check exists and a prompted judge is too weak or too costly: synthetic-only training lifted
  a 70B judge from 75.4 to 88.3 on RewardBench, a 9B computer-use judge trained on agreement-filtered
  frontier verdicts reached 86.1% on 1,019 human-labeled trajectories against 89.7% for Claude Opus 4.8
  at 30 to 60 times lower cost, and a reward model trained on execution-labeled agent runs lifted best-of-32
  on SWE-bench Verified from 67.0% to 74.6%. The limits are the point: gains concentrate on the benchmark
  used for selection, a verifier with nearly the same best-of-N gain as another collapsed RL training,
  a policy optimized against its own judge drove the judge''s pass rate from 0.72 to 0.94 while true accuracy
  stayed at 0.20, and judges sharing weights with the policy were rewritten as it trained. Keep a human-labeled
  set the judge never trains or selects on and a small independent check inside the loop: neither the
  agent''s score nor the judge''s agreement with humans validates the loop.'
how: '1. Start from the baseline: a prompted judge from another model family with written criteria (7.c.iii),
  or a sound external check where one exists (9.a.i). Price it and see what more effort or a vote buys
  before training anything: on computer-use trajectories GPT-5.5 went from 88.99% at medium effort to
  90.36% at xhigh, a vote of the three best judges added about a point at several times the cost, and
  the strongest judges cost $2,300 to $4,000 for the 51,200 calls of one modest RL run. Bootstrap your
  own judge only where that baseline disagrees with human labels too often or costs too much per call.
  First label two small human sets: one for calibration and selection, and a locked one the judge never
  trains or selects on (one agent-loop verifier was selected on ten anchored items and validated on locked
  sets of 40-48); include a failure-heavy slice, where the best computer-use judge fell from 89.7% to
  69.7%. 2. Get labels from construction, not from the judge''s opinion. Build contrastive pairs from
  your own traces: a good output against a degraded one, such as an answer to a subtly modified instruction,
  a sampled answer that fails a known-answer check, or an output cut to a bare opener (''Thought process:''),
  with both orderings of every pair. For agent runs, label whole trajectories by execution (fail-to-pass
  tests) and mix runs from several policies, on- and off-policy: one SWE reward model picked better with
  more candidates only when trained on more than about 20k trajectories (under 5k it could get worse),
  and the best ratio tried was two positives per negative. Where no check exists, label with an ensemble
  of strong judges from different families and keep only near-unanimous verdicts with their reasoning
  (one computer-use corpus kept about 85%). 3. Train the judge on these labels (fine-tune on its own verdicts
  that match the label and iterate, or RL on verdict correctness), or tune a judge prompt against them;
  then run a short RL pass on the cases it still gets wrong, mostly false successes (about 3.1K in one
  study). Give it a context that holds whole trajectories (32k tokens fit 12.5% of SWE trajectories, 128k
  99.5%). Keep its weights apart from the policy it will reward: judges sharing weights with the policy
  were rewritten by its updates (probe AUC 0.812 to 0.630) or flipped more verdicts after training (29.9%
  to 38.5%). Prefer a base from another family than the generator, since self-preference rises with self-recognition,
  but check it: judges also favor any model whose mistakes resemble theirs. Where answers are checkable,
  make the judge commit its own answer before it compares (false-positive rate on wrong answers 0.719
  to 0.012 in one study). 4. Gate it before use: chance-corrected agreement and true- and false-positive
  rates on the locked set and its failure-heavy slice; judge benchmarks other than the one used for selection;
  accuracy on the generator''s outputs against equal-quality outputs from other sources; false-positive
  rate on adversarial probes (bare openers, punctuation, padded and plausible-but-wrong answers, failed
  runs that claim success). If it will be a training reward, also check discrimination (AUC) and calibration
  on the policy''s own outputs, and which criteria drive its verdicts there: two SWE verifiers with nearly
  the same best-of-N gain (+4.7 and +4.5 points) differed by 0.095 AUC, and the worse-calibrated one collapsed
  RL. Never validate it by the agent''s downstream score: an always-pass verifier trained skills as well
  as a valid one. 5. In the loop, control length when picking preferred outputs, track the judge''s pass
  rate against audited accuracy, and score a small share of outputs with an independent judge, chosen
  where the in-loop judge drifts most from its locked copy: in one image-generation study, the authors'' full repair
  (a locked self-reward read and dense latent self-reward, with a drift-triggered controller spending
  external scores on 1/16 of rollouts) beat a frozen external judge scoring every rollout (GenEval 0.602
  against 0.560, at 2.91 against 10.38 seconds per step), while external scores alone on 1/16 of rollouts
  reached 0.544. Keep a human-audited sample and an outer judge outside the loop (9.c.iii). 6.
  Refresh on a schedule from new traces against external labels, never the judge''s own: refreshing a
  drifted judge on its own labels gave rebounds that shrank each round (agreement peak 0.50 to 0.19 over
  five rounds, three seeds). Promote a retrained judge only if it agrees better with the locked set, add outputs the
  old judge wrongly accepted as negatives, and discard scores that depended on the replaced judge. 7.
  Measure with a paired eval on the locked set against the prompted judge and against best-of-N or majority
  vote at equal compute (9.c.ii), with cost and latency per call; grade the loop''s end quality on validity
  measures the judge does not score (a self-judged policy halved order flips while its fable accuracy
  fell from 56.5% to 53.4%), and report the gap between the judge''s pass rate and audited accuracy at
  every iteration.'
detect:
  static: A pipeline that trains or prompt-tunes a judge on the system's own outputs or its own verdicts,
    with periodic refresh. Flag a judge from the same model or family as the generator, a judge that shares
    trainable weights with the policy it rewards, a refresh trained on the judge's own labels, no human-labeled
    set held out from both training and selection, a reward model chosen only by best-of-N gains, and
    a judge validated only by the agent's downstream score.
  traces: Judge pass rate and score distribution per training or refresh iteration next to accuracy on
    an audited sample and on a small share of outputs scored by an independent judge; the judge's scores
    on a fixed probe set over time; a widening gap, scores saturating near the top of the scale, and output
    length rising across iterations.
  evals: Chance-corrected agreement with a locked human-labeled set, including a failure-heavy slice;
    AUC and calibration on the policy's own outputs where the judge is a reward; the judge's accuracy
    on the generator's own outputs against equal-quality outputs from other sources; results on judge
    benchmarks other than the one used for model selection.
  judge: An outer judge kept outside every loop, from another family, given the task contract and checked
    against humans.
  probes:
    what: 'Outputs built to fool the judge: content-free answers, plausible-but-wrong answers, failed
      agent runs that claim success, and padded answers, plus the generator''s outputs paired with equal-quality
      outputs from other sources.'
    construct: Cut real outputs to a bare reasoning opener or punctuation ('Thought process:', ':'); collect
      confident wrong answers the generator produces, or that a loop optimized against the judge converges
      on, and failed agent runs whose closing message claims success; pad correct answers; pair generator
      outputs with equal-quality outputs from another model or a human. The judge must reject the first
      three and score the pairs evenly.
  primary:
  - evals
  - probes
impact:
  quality:
    effect: mixed
    size: medium
    when: 'gains on judge benchmarks and on what is trained against them: RewardBench 75.4 to 88.3 (Wang,
      Aug 2024); JudgeBench 48.6 to 60.0 for a 70B judge trained on 22K synthetic pairs, but +0.6 (70.8
      to 71.4) on a Qwen3-32B thinking base, still below o3''s 75.7 (Whitehouse, May 2025); AlpacaEval
      2 LC win rate 25.5% to 39.4% (Wu, Jul 2024); a 9B computer-use judge trained on agreement-filtered
      frontier verdicts 76.7% to 86.1% on human-labeled trajectories against 89.7% for Claude Opus 4.8,
      and 39.4% to 60.2% against 69.7% on failure-heavy runs (Sun, Jul 2026); best-of-32 on SWE-bench
      Verified 51.6% to 62.0% and 67.0% to 74.6%, and added to the execution reward in RL 54.8% against
      51.8% (Shum, Dec 2025); search with a co-evolved code reviewer found a coder passing 23 of 28 held-out
      DeepSWE tasks against 21 of 28 with a fixed evaluator, one run (Iacob, Jun 2026). Gains that do
      not transfer: MT-Bench human agreement 77.8 to 78.9 (Wang, Aug 2024); a self-trained 8B judge scored
      83.0 against 69.5 on RewardBench but 30.2 against 32.3 on JudgeBench (Whitehouse, May 2025); self-play
      against its own judge took the pass rate from 0.72 to 0.94 at 0.20 true accuracy (Zhou, Jul 2026);
      a poorly calibrated reward model left Terminal Bench at 15.0% after RL against 30.0% with the execution
      reward (Shum, Dec 2025); a self-judged policy halved order flips (14.3% to 6.6%) while fable accuracy
      fell from 56.5% to 53.4% (Meurers, Oct 2026); unanchored self-reward cut held-out GenEval by 7.6
      to 9.4 points (Chen, Oct 2026)'
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: 'up-front generation, training and validation, repeated at every refresh: Meta-Rewarding sampled
      7 responses for each of 5,000 prompts and 11 judgments of each response per iteration, for four
      iterations (Wu, Jul 2024); Self-Taught Evaluators retrained a 70B judge for five iterations (Wang,
      Aug 2024); a computer-use judge was built from about 321K ensemble verdicts, and its 1,019-trajectory
      human-gold test set took about 800 human hours (Sun, Jul 2026); one co-evolution search with a learned
      reviewer used 587M tokens to its best coder against 429M with a fixed evaluator on DeepSWE, but
      1.35 to 1.72 times fewer on Polyglot (Iacob, Jun 2026). Per call far below a frontier judge: about
      $68 against $2,300 (GPT-5.5) to $4,000 (Claude Opus 4.8) for the 51,200 judge calls of one modest
      RL run, and $1.36 against $45 to $100 to judge 1,019 trajectories (Sun, Jul 2026)'
    basis: evidence
  performance:
    effect: none
    basis: assessment
  security:
    effect: mixed
    size: medium
    when: 'a learned judge is a gate that can be gamed: content-free answers such as ''Thought process:''
      or '':'' drew false-positive rates as high as 80%, one trained verifier 66.8% on a single blank
      space, and adding 20k truncated outputs as negatives brought trained judges near 0% (Zhao, Jul 2025);
      errors a policy learned against its own judge fooled judges of other families, and a three-family
      ensemble still accepted 55% of wrong answers on one seed, 65% over three seeds (Zhou, Jul 2026);
      judges read the agent''s own account: over-accepting incomplete computer-use tasks was two-thirds
      of all judge errors, and training on false successes (SFT, then RL on them) raised a 9B judge''s
      catch rate on failure-heavy runs from 14.1% to 57.6% (Sun, Jul 2026)'
    basis: evidence
  governance:
    effect: degrades
    size: medium
    when: 'self-referential evaluation: the system''s own score cannot show whether it improved. A collapsed
      always-pass verifier trained skills as well as a valid one, and rubric gaming that no in-loop signal
      saw was caught by an outer judge (Zhang, Oct 2026); without a held-out check a self-play judge reported
      94% correct when 20% were (Zhou, Jul 2026); a judge''s agreement with humans on human-written arguments
      did not show what drove it on the policy''s outputs, and the policy grew more consistent but not
      more valid (Meurers, Oct 2026); a drifted judge refreshed on its own labels recovered less each
      round (agreement peak 0.50 to 0.19) (Chen, Oct 2026)'
    basis: evidence
  brand:
    effect: none
    basis: assessment
  primary:
  - quality
  - governance
measure:
- method: experiment
  tier: 3
  how: 'paired eval on a locked human-labeled set the judge never trains or selects on, with a failure-heavy
    slice: the bootstrapped judge against the prompted judge it would replace (also at higher effort)
    and against majority vote or best-of-N at equal compute; chance-corrected agreement, true- and false-positive
    rates, AUC and calibration on the policy''s own outputs where it will be a reward, accuracy on the
    generator''s own outputs against equal-quality outputs from other sources, false-positive rate on
    adversarial probes, cost and latency per call; then the loop''s end quality graded on the same locked
    set and on validity measures the judge does not score, never by the judge'
- method: monitor
  how: 'per training iteration and per refresh: the judge''s pass rate against accuracy on a regularly
    audited human sample and against a small share of outputs scored by an independent judge, its scores
    on a fixed probe set, score saturation near the top of the scale, output length, and the judge''s
    acceptance rate on the generator''s outputs against outputs from other sources; promote a retrained
    judge only if it agrees better with the locked set'
