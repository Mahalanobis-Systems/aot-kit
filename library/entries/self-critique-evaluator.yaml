- source: Xing Zhang, Guanghui Wang, Yanwei Cui, Ziyuan Li, Wei Qiu, Bing Zhu, Peiyang He, "Who Verifies
    the Verifier? Co-Evolving Inspectable Graders with Self-Improving Agents", https://arxiv.org/abs/2610.11464
  date: '2026-10-08'
  task: Evolve an agent's verifier from clustered failures as a composition of small, mostly deterministic
    detectors plus narrow judge queries, selected for agreement with a ten-item anchored set and detector
    consensus on unlabeled outputs, never for the agent's score; co-evolve it with a skill-learning loop
    and compare with the same loop given ground truth or a rubric
  effect: MBPP+ held-out agreement 0.625±0.050 against 0.417±0.058 for the hand-authored seed composition
    and 0.55±0.04 for the bare LLM judge it contains (p=0.12 against the seed, with verdicts clustered by task). Removing
    the anchor guards "collapses the verifier into a vacuous always-pass grader, yet that collapsed verifier
    trains skills just as well"; "Downstream task score cannot certify a self-evolved verifier." The co-evolved
    loop retained 106%, 110% and 88% of the reference loop's lift on MBPP+, Spider 2.0 and report generation;
    Spider agreement fell to 0.500±0.026 once residual failures were wrong values under clean execution.
