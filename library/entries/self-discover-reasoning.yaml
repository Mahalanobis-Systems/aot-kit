- source: 'Zhou et al., "Self-Discover: Large Language Models Self-Compose Reasoning Structures", https://arxiv.org/abs/2402.03620'
  date: '2024-02-06'
  task: 'Stage 1, once per task: from 39 seed reasoning modules and a few unlabeled task examples, three
    meta-prompts SELECT the useful modules, ADAPT them to the task and IMPLEMENT them as a key-value (JSON)
    reasoning structure, with a human-written structure for another task as the example. Stage 2: the
    structure is appended to every instance and the model fills in each value to reach the answer'
  effect: 'Table 1, CoT -> Self-Discover (plan-and-solve in brackets): BBH PaLM 2-L 60% -> 67% (61%),
    GPT-4 75% -> 81% (73%); T4D 40% -> 69% (42%), 52% -> 85% (53%); MATH 42% -> 50.5% (49%), 71% -> 73%
    (70%). The abstract''s "by as much as 32% compared to Chain of Thought" is T4D; it beats CoT-Self-Consistency
    "by more than 20%, while requiring 10-40x fewer inference compute", a comparison (Figure 5) of GPT-4
    on 2 BBH tasks that counts inference calls per instance: 1 plus 3 task-level calls for Self-Discover,
    10 for CoT-Self-Consistency, 40 for majority voting over every module. "We acknowledge that Self-Discover
    input and output are longer than CoT and Direct prompting, increasing cost." Gains were largest on
    world-knowledge tasks and moderate on algorithmic ones; per task, GPT-4 with Self-Discover trailed
    CoT on multistep arithmetic (70 vs 92), shuffled-object tracking (68 vs 80), web of lies (71 vs 80)
    and word sorting (85 vs 90). Each of the three actions added accuracy in the ablation. Transfer: PaLM
    2-L structures used by GPT-4 beat OPRO prompts on 3 of 4 tasks (OPRO used 20% of the data); GPT-4
    structures gave Llama2-70B 52% vs 42% for CoT on disambiguation QA and GPT-3.5-turbo 56% vs 51% on
    geometry (3-shot); "We tried zero-shot meta prompting Llama2 but observed low-quality structure outputs."
    On MATH, 87.5% of structures were correct and 74.7% of errors were computation errors.'
  conditions: GPT-4 (gpt-4-turbo-preview), PaLM 2-L, GPT-3.5-turbo, Llama2-70B; BBH (23 tasks), T4D, 200-item
    MATH subsample with instance-level structures from a one-shot demonstration; zero-shot baselines direct,
    CoT and plan-and-solve; CoT-Self-Consistency (10 samples) and per-module voting on 2 BBH tasks only
  direction: supports
  locator: Abstract; §2, Figures 2-3; §3.3; Table 1; §4.1-4.3, Figures 4-5; §5.1-5.2, Figures 8-9 and
    footnote 3; Appendix A (Table 2, Stage 2 prompt); Appendix C, Table 3; Appendix D
  measured: true
