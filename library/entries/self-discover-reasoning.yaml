caveats: 'The original''s compute advantage counts inference calls on two BBH tasks, not tokens, and its
  authors note longer inputs and outputs; the headline 32% is one task (T4D), and on MATH it built a structure
  per instance. Most follow-ups are small or come from papers proposing a rival method (Auto-Evolve, SABA):
  the CFA study''s Self-Discover is a one-prompt, per-question imitation scored on 60 multiple-choice
  questions with no single-sample CoT arm, the instance-level replication had no CoT baseline, and Strategy-Induct
  sampled 25 questions per task. The reasoning-model evidence comes mostly from neighboring prompts (CoT,
  plan-and-solve, induced instructions, a hand-written TMK structure) rather than Self-Discover itself,
  and it disagrees: no gain on multiple-choice benchmarks, a gain on one obfuscated planning task,
  where o1-mini nonetheless fell from 19.1% to 16.83% on the Mystery variant. Per-question strategy prompts
  broke a reasoning model''s answer format (o3-mini on Shift Cipher, 24.64 vs 98.40 for CoT), which favors
  one cached strategy per task type.'
