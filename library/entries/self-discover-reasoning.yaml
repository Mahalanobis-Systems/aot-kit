caveats: 'The original''s compute advantage counts inference calls on two BBH tasks, not tokens, and its
  authors note longer inputs and outputs; the headline 32% is one task (T4D), and on MATH it built a structure
  per instance. Most follow-ups are small or come from papers proposing a rival method (Auto-Evolve, SABA,
  and the three 2025-2026 template and hint studies on reasoning models): the CFA study''s Self-Discover
  is a one-prompt, per-question imitation scored on 60 multiple-choice questions with no single-sample
  CoT arm, the instance-level replication had no CoT baseline, Strategy-Induct sampled 25 questions per
  task, and the contest sets in the template studies have 27 to 40 problems each. No study runs the original
  three-stage method on a reasoning model with thinking on: the reasoning-model evidence injects single
  modules or retrieved templates into the thinking of open 0.6B to 32B models, uses hand-written structures
  (a gain for o1 on one obfuscated planning task where o1-mini fell, a loss on all five frontier models
  in one enzyme-classification study with one seed), or tests neighboring prompts (CoT, plan-and-solve,
  induced instructions), and the strongest positive result picks per-question hints with a trained selector
  on contest math with 7B to 14B models. Per-question strategy prompts broke a reasoning model''s answer
  format (o3-mini on Shift Cipher, 24.64 vs 98.40 for CoT) and a hand-written structure lowered the valid-answer
  rate (0.982 to 0.931), which favors one cached, format-checked strategy per task type.'
