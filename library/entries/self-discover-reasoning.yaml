  quality:
    effect: mixed
    size: medium
    when: 'non-reasoning models: BBH 75% to 81% and T4D 52% to 85% over CoT on GPT-4 (Zhou, Feb 2024);
      BBH 91.0 vs 86.0 for CoT and 89.6 for self-consistency on DeepSeek-V3 (Fan, Apr 2026); below CoT
      on Claude 3 Sonnet, 67.7 vs 68.3 (Aswani, Oct 2024), and on GPT-4 multistep arithmetic, 70 vs 92
      (Zhou, Feb 2024); below zero-shot on long-form CFA essays, 46.32 vs 57.35 (Shetty, Jun 2025); JSON
      plans 63.50 vs 75.50 for natural-language plans on MATH, per question (Gunasekara, Jul 2025); reasoning
      models with thinking on: a Self-Discover module injected into the thinking lowered Qwen3-32B on
      all six benchmarks, AIME 2024 0.789 to 0.667, and 13 of 18 cells over three open models (Wu, Apr
      2026); a hand-written task structure with retrieved evidence lowered all five frontier reasoning models,
      four of them by 0.004 to 0.023 and glm-5.2 by 0.106 (mean 0.720 to 0.687),
      where 3-sample self-consistency over a cascade reached 0.728 (Li, Jul 2026); Buffer-of-Thoughts
      templates below CoT in 13 of 16 Qwen3 cells and below self-consistency in all 16 (Ahmed, Sep 2025);
      a plan-first prompt within 0.51 pp of direct prompting (Preet, May 2026); an induced task strategy
      -1.42 to +3.20 on o3-mini (Chen, May 2026); a hand-written structure 74.3 to 83.3 for o1 on obfuscated
