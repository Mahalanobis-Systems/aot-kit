      self-consistency ($1.701) (Shetty, Jun 2025); normalized cost 5.0 vs 2.5 for CoT and 12.0 for 5-sample
      self-consistency on DeepSeek-V3 (Fan, Apr 2026); on a thinking model, Buffer-of-Thoughts templates
      $1.51 vs $0.62 for CoT and $2.29 for self-consistency per AIME 2024 problem on Qwen3-8B (Ahmed,
