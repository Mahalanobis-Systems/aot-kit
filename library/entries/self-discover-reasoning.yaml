summary: 'Have the model write a reasoning plan once per task type (picked and adapted from 39 seed heuristics),
  then follow that cached plan on every instance, so each instance still costs one call. On non-reasoning
  models it beat CoT (GPT-4 on BBH 75% to 81%, on T4D 52% to 85%) and, in a third-party run, 5-sample
  self-consistency at under half the cost; but it trailed CoT on Claude 3 Sonnet and on multistep arithmetic,
  and trailed zero-shot prompting on long-form essays. On reasoning models with thinking on it mostly
  does not pay: no study runs the original method, but one of its 39 modules injected into the thinking
  lowered Qwen3-32B on all six math, science and coding benchmarks (AIME 2024 0.789 to 0.667), a hand-written
  four-step task structure (with a motif scan the baseline lacked, on retrieved evidence) lowered all
  five frontier reasoning models tested on an enzyme-classification benchmark, four of them slightly
  (mean 0.720 to 0.687), Buffer-of-Thoughts templates scored below self-consistency in all 16 Qwen3 cells,
  and a plan-first prompt moved mean accuracy by at most 0.51 points. The main exception is guidance chosen
  for what the target model can execute (one study: Qwen3-8B on AIME 2025 from 67.33 to 74.00 in one call,
  above 72.00 for 8-sample self-consistency), and Anthropic advises general instructions over hand-written
  step-by-step plans.'
how: '1. Start from the cheap baselines on your own labeled items: plain CoT for a non-reasoning model,
  the model''s own thinking at a chosen effort setting for a reasoning model (1.b.i), and self-consistency
  at the same token budget (9.c.ii). Expect little or a loss on reasoning models with thinking on: a plan-first
  prompt moved mean accuracy by 0.51 points or less, an induced task strategy moved o3-mini by -1.42 to
  +3.20, one of the 39 seed modules injected into the thinking lowered Qwen3-32B on all six benchmarks
  it was tested on (AIME 2024 0.789 to 0.667), and a hand-written task structure lowered all five frontier
  reasoning models on one classification task, four of them slightly (by 0.004 to 0.023; mean 0.720 to 0.687); the clearest gains were on non-reasoning
  and smaller models, on task types the baselines get wrong. 2. Group traffic into task types that are
  solved the same way, and pick a handful of unlabeled examples for each (the follow-up studies used 3
  to 10). 3. Run discovery offline, once per task type, with the strongest model you have: SELECT the
  useful modules from the paper''s 39 seed modules, ADAPT each to the task, and IMPLEMENT them as a step-by-step
  plan, showing one human-written plan for another task as the format example; that is 3 calls per task
  type. Small models wrote poor structures, while structures from a stronger model transferred (GPT-4''s
  raised Llama2-70B on disambiguation QA from 42% with CoT to 52%). Also try letting the model write its
  own task-specific modules instead of picking from the 39 seeds: in a rival team''s rerun (Auto-Evolve),
  that reached 65.4% on BBH for Claude 2.0 against 58.7% for Self-Discover and 53.7% for direct prompting.
  4. Check each structure on the target model before caching it: would following it solve a few labeled
  examples? In the original study 12.5% of MATH structures were wrong, and an instance that follows a
  wrong structure fails. A strategy that appears in good solutions often does not help when given as guidance,
  and which strategies help differs by model and by source: picking hints by their measured success on
  the target model raised Qwen3-8B on AIME 2025 from 67.33 to 74.00 in one call, above 72.00 for 8-sample
  self-consistency. 5. Cache the structure as a versioned block in that task type''s prompt, in the stable
  prefix (3.b.i; the rest of the system prompt is 3.a.iv), followed by the instance and the paper''s instruction
  to fill in each step by reasoning about the task, not to rephrase the keys, so each instance costs one
  call; keep the final answer extractable (9.b.i). On Claude with thinking on, give the structure as worked
  examples (problem, method, answer) rather than asking for it as visible output, and test it against
  thinking alone. Do not paste templates into a reasoning model''s thinking by default: a template placed
  inside the thinking cut output tokens by 44.5% to 80.3% on GPQA but lowered accuracy on four of five
  Qwen3 sizes (14B: 57.69 to 42.31), and its authors attribute the smaller gains on larger models to weaker
  adherence to external templates after more reinforcement training. Prefer a natural-language plan to
  JSON (it won on every benchmark, e.g. 75.50% vs 63.50% on MATH, in a per-question study with no CoT
  baseline), check that answers still parse (a hand-written structure cut the valid-answer rate from 0.982
  to 0.931), and leave out task types where the structure lost to the baseline, such as multistep arithmetic
  (70 vs 92 for CoT on GPT-4) and long-form rubric-graded answers (46.32 vs 57.35 zero-shot). 6. Measure
  on held-out labeled items per task type: accuracy against CoT, the model''s own thinking at matched
  tokens and self-consistency at matched cost, plus the valid-answer rate, input, thinking and output
  tokens, cost and p50 and p95 latency per item (on Qwen3-8B with thinking on, Buffer-of-Thoughts templates
  cost $1.51 against $0.62 for CoT per AIME 2024 problem and took 556.07 s against 245.56 s). Rediscover
  and re-test the structures when the model changes: the gain over CoT disappeared on a stronger model
  (Claude 3 Sonnet 67.7 vs 68.3).'
detect:
  static: A module-selection or planning step before solving, or a reasoning structure (key-value or numbered
    steps) per task type in the prompt. Flag a structure regenerated for every instance where one cached
    per task type would do, JSON structures where a natural-language plan would do, a structure or template
    stacked on a reasoning model with thinking on, or injected into its thinking, that was never compared
    against thinking alone, and no CoT or self-consistency baseline.
  traces: Structure id and version per call and the task type it was discovered for; modules selected;
    whether the output fills every key or rephrases or skips them; tokens and latency per call against
    plain CoT.
  evals: Accuracy per task type against CoT, the model's own thinking at matched tokens and self-consistency
    at matched cost; computation-heavy split from knowledge-heavy, short answers from long-form; valid-answer
    rate and thinking tokens with and without the structure.
  judge: 'Before caching, check each discovered structure: would following it solve labeled examples of
    the task? (12.5% of MATH structures were wrong in the original study.)'
  probes:
    what: A mix of task types needing different reasoning.
    construct: Interleave arithmetic, deduction, world-knowledge and planning items with known answers,
      plus some long-form rubric-graded answers, so each task type's structure can be scored against CoT
      and the model's own thinking.
  primary:
  - evals
