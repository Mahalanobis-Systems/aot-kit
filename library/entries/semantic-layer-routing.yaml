caveats: Applies only where a semantic layer already covers the metrics being asked about; building one
  is data-side work and a separate change. Both studies come from semantic-layer vendors (dbt Labs, Cube),
  and the question sets are small (11 questions x 20 runs; 99 questions). The routing policy itself, layer
  first and SQL as fallback, was recommended by dbt but not evaluated.
