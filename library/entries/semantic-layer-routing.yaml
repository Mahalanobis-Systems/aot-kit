  date: '2026-08-20'
  task: Answer DABStep questions through a model-authored Malloy semantic layer (answers submitted as Malloy
    and compiled to SQL, SQL used only to explore; a later harness allowed a SQL off-ramp) against an agent
    writing SQL from a markdown context layer, on the same data, database and scorer
  effect: 'Post: the Malloy layer "consumed 2.5x more tokens, was less accurate (95% vs. 100%), and slower";
    "The ability to compile and validate Malloy improved accuracy substantially"; "The semantic layer did not
    provide the expected retrieval advantage." Linked results (RESULTS.md, 419 held-out questions): with the
    model fixed (Gemini, low reasoning), markdown plus SQL 418/419 = 99.8% against Malloy 295/419 = 70.4% (-29.4
    points), median prompt tokens 42,370 against 106,609 (2.52x), cost $8.58 against $11.81. Best Malloy run
    (Sonnet author, Opus fixer) 382/419 = 91.2%, hard 324/348, with 56.6% of questions answered in raw SQL
    (237 SQL, 134 authored Malloy, 47 view selections); 12 of 83 layer views used in that run and 52 of 83
    never referenced by any run; a rebuild that fixed the central defect did not move the score. On one question
    template the layer view ranked by an average where the gold is a sum: 0/19 through the view, 11/19 after
    falling back to SQL, 19/19 for the baseline. Train about 94.7% against held-out 91.2%.'
  conditions: DABStep (Adyen payments, fee-rule questions), 26 train and 419 held-out questions; layer authored
