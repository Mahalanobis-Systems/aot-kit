# 7.a.i: Route metric questions through a deterministic semantic layer; fall back to text-to-SQL
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 7.a.i
legacy_id: T54
slug: semantic-layer-routing
name: Route metric questions through a deterministic semantic layer; fall back to text-to-SQL
kind: technique
status: card
tiers:
- tier: 3
  why: routing within a single agent
levers:
- control-flow
- knowledge-access
domains:
- data-analysis
evidence_domains:
- data-analysis
categories:
- orchestration.route
- retrieval.query
summary: Where a semantic layer exists, have the agent answer metric questions by choosing metrics and
  dimensions that the layer compiles to SQL, and write SQL only when the layer cannot answer. The layer
  fails with an explicit error rather than a plausible wrong answer. Higher reasoning effort or a bigger
  model did not close the gap; the layer did.
how: 1. Confirm a semantic layer covers the metrics the agent is asked about. 2. Add a first path that
  maps the question to metrics and dimensions; fall back to SQL on a layer error. 3. Paired eval on metric
  questions, tracking explicit errors against wrong answers.
detect:
  static: a data agent that writes SQL directly although a semantic or metrics layer exists
  traces: wrong numbers on questions whose metric the layer defines; failure rows labeled reasoning-failure
    on metric questions
  evals: accuracy on metric questions, split by whether the layer defines them
