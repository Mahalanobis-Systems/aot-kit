  effect: 'On questions the Semantic Layer can reach (not too many entity hops), 11-question ACME set x 20
    runs: SL 100.0% for both Sonnet 4.6 and GPT-5.3 Codex vs text-to-SQL 62.5% (Sonnet 4.6) and 51.2% (GPT-5.3
    Codex) on raw tables; 2023 GPT-4 was SL 83.1% vs text-to-SQL 26.9%. Across the model x reasoning-effort
    sweep on SL-answerable questions, SL scored 87.2-100.0% vs text-to-SQL 50.0-65.0% (SL advantage 24.7-50.0
    pp). Before extra modeling, SL scored 0.0% on the too-many-hops questions (it refused), giving 72.7% overall
    vs text-to-SQL 64.5%. Qualitative: "the Semantic Layer tells you it can''t answer. It never returns invalid
    data. Text-to-SQL will cheerfully give you a wrong number."'
