summary: 'Have a data agent answer metric questions by picking metrics and dimensions that a semantic layer
  compiles into SQL, and write SQL itself only when the layer can''t answer. On questions the layer models,
  this beat direct text-to-SQL in dbt''s benchmark (98.2% against 90.0% for Claude Sonnet 4.6, 100% against
  84.1% for GPT-5.3 Codex) and in an independent paired test on the same insurance data (all three runs right
  on 37 of 38 questions against 21, with one refusal and no wrong-but-executed result in 114 runs against 29
  wrong runs), and more reasoning effort did not close the gap. The margin is smaller with 2026 models (text-to-SQL
  78.2% to 90.9% against 80.0% to 100% for the layer in dbt''s August rerun, where GPT-5.6 Luna did better
  writing SQL), the layer path usually cost more per query, and in one vendor test on rule-heavy questions
  a compiled layer lost to SQL written from tuned documentation, with the agent in its best run bypassing the
  layer for most answers. Serve the layer as a compiler or lookup tools, not as definitions pasted into the
  prompt: in two 2026 studies a pasted layer left strong agents no better or worse. The evidence is small and
  comes mostly from the people who built the layer or system they test.'
how: '1. Start from the baseline: run your current agent writing SQL with full schema context (5.b.i) on real
  metric questions with checked answers, several runs per question, and record accuracy, answers that executed
  but were wrong, refusals, and cost and latency per question. In one paired test, direct SQL was right on
  all three runs for 21 of 38 questions and returned a wrong result that still executed on 29 of 114 runs.
  Expect raw SQL to be weakest on real warehouses: on BEAVER''s private enterprise warehouses the best end-to-end
  method reached 11.4%, and experts rated 53% of answers from LinkedIn''s production SQL assistant good. 2.
  Measure coverage before routing: mark which questions the layer can answer with one query. dbt''s layer could
  not answer 3 of its 11 benchmark questions (too many entity hops) until an LLM added 3 dbt models; in Baidu''s
  deployment a compiled query representation over generated views expressed and executed 95.3% of user queries.
  Close gaps in the layer first where they are cheap: on one small database, model-generated views took 29
  to 116 s against 28,689 s for three analysts writing them by hand, at similar accuracy (80.42% against 78.06%).
  Compile first the metrics your production model fails to derive: in one independent ablation, views compiled
  from a data contract were right on all 176 tasks they covered, while agents writing SQL from the same definitions
  fell short by 39.2, 37.3, 26.1 and 5.1 points from the weakest model to the strongest. 3. On the layer path,
  let the model only choose: metrics, dimensions, filters and grain from the layer''s catalog, or from question-specific
  options a lookup tool returns, while the layer resolves joins and compiles the SQL; the model writes no joins
  or aggregations there. Ask for a single layer query or an explicit cannot-answer (dbt''s benchmark prompt
  asks for one semantic-layer query or CANNOT_ANSWER). 4. Make the fallback explicit and logged: on a refusal
  or compile error, retry once with the reason (in one study 10 of 114 runs retried and 9 then produced SQL);
  where the model writes the query itself, check it against the layer''s definitions and abstain after a few
  failed repairs (with GPT-4 this raised accuracy from 54.2% to 72.55% with 8% of answers "I don''t know");
  then fall back to text-to-SQL with the schema in context for exploratory questions, or to a person for numbers
  that go into reports (Baidu sends the 4.7% of queries its pipeline fails on to experts). Label every answer
  with the path it took. 5. Check that the layer''s definitions match what users mean, and grow the layer from
  the fallback log: a compiled view fixes one interpretation, and in one test a view that ranked by an average
  where the questions meant a sum scored 0 of 19 (11 of 19 after falling back to SQL, 19 of 19 for SQL written
  from documentation). Add the metrics, joins or views that recurring fallbacks and misses need, and keep test
  questions the layer was not built against. 6. Budget for the catalog: with every metric and dimension in
  the prompt, the layer path cost $0.0416 against $0.0128 per query for Claude Sonnet 4.6 in dbt''s benchmark,
  and a Malloy layer used 2.52 times the median prompt tokens of SQL with documentation. Return only the options
  or views relevant to the question through lookup tools, and keep the fixed part of the prompt cacheable (3.b.i).
  Don''t paste the whole layer as text: a static layer in the prompt lowered GPT-5.6-sol by 2.3 and Claude
  Sonnet 5 by 11.9 points on DDR-Bench while the same knowledge served through tools gained, and in a seven-model
  study strong agents given a descriptive layer stopped checking the data (68% to 31% on those runs) and cost
  1.1 to 1.9 times as much. 7. Measure with paired runs on the same questions, with your production model and
  a cheaper one (in dbt''s August runs GPT-5.6 Luna scored 87.3% to 90.9% with SQL against 80.0% to 87.3% through
  the layer): accuracy per path, wrong-but-executed answers against refusals, the share of answers that bypassed
  or fell back from the layer, run-to-run spread, and cost and latency per question.'
detect:
  static: a data agent that writes SQL directly although a semantic or metrics layer exists
  traces: wrong numbers on questions whose metric the layer defines; failure rows labeled reasoning-failure
    on metric questions; with a layer in place, answers written in raw SQL for questions the layer covers,
    and layer metrics or views that no answer uses
  evals: accuracy on metric questions split by whether the layer defines them, with wrong-but-executed answers
    counted apart from refusals, over several runs per question
impact:
  quality:
    effect: improves
    size: large
    when: 'on questions the layer models: 98.2% against 90.0% (Claude Sonnet 4.6) and 100% against 84.1% (GPT-5.3
      Codex), 11 questions x 20 runs (dbt, Apr 2026); all three runs right on 37 of 38 questions against 21,
      with 0 of 114 runs wrong but executed against 29 (Ai, Aug 2026); 71.4% against 62.8% on BIRD-dev with
      a compiled query representation (Lian, Jun 2026); narrower with 2026 models, 80.0% to 100% against 78.2%
      to 90.9%, and lower than SQL at every effort for GPT-5.6 Luna (dbt, Aug 2026); 70.4% against 99.8% when
      one model answered rule-heavy questions through a model-authored Malloy layer instead of SQL with documentation
      tuned on the same benchmark (Matson, Aug 2026); on DABStep, views compiled from a data contract were
      right on all 176 tasks they covered, where agents writing SQL from the same definitions fell 5.1 to 39.2
      points short, the gap shrinking with model strength (Ye, Sep 2026); a layer pasted into the prompt as
      description lowered or left unchanged accuracy for agents that already inspect the data (Sourati, Oct
      2026)'
    basis: evidence
  cost:
    effect: degrades
    size: medium
    when: 'per query, $0.0416 against $0.0128 (Claude Sonnet 4.6) and $0.0172 against $0.0068 (GPT-5.3 Codex)
      with the whole metric catalog in the prompt (dbt, Aug 2026); 2.52 times the median prompt tokens and
      $11.81 against $8.58 for a run of 419 questions through a Malloy layer (Matson, Aug 2026); 6,112,623
      against 5,185,149 prompt tokens on BIRD-dev (Lian, Jun 2026); building the layer is extra: three analysts
      took 28,689 s to write views for one small database, against 29 to 116 s for a model (Lian, Jun 2026);
      a descriptive layer in every prompt cut tool calls 22 to 30% but raised cost 1.1 to 1.9 times (Sourati,
      Oct 2026)'
    basis: evidence
  performance:
    effect: mixed
    size: small
    when: mean latency per query 2.22 s against 2.63 s (Claude Sonnet 4.6), 1.85 s against 2.74 s (GPT-5.3
      Codex) and 3.80 s against 9.88 s (GPT-5.6 Sol, high), but 9.05 s against 5.77 s for GPT-5.6 Luna (medium)
      (dbt, Aug 2026); 8.91 s against 9.43 s per question (Lian, Jun 2026); the Malloy layer was slower, not
      quantified (Matson, Aug 2026)
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: improves
    size: medium
    when: 'for a fixed plan and layer the compiled SQL is the same every time, so a metric is computed one
      way for every user, and the planner cannot name a table, join or SQL fragment (Ai, Aug 2026); on the
      questions it could answer, the layer path scored the same on all 20 runs for three models, where text-to-SQL
      for two GPT models varied by 12.5 points between best and worst run, though on the modeled schema GPT-5.2
      still varied by 18.2 points through the layer (dbt, Aug 2026); the benefit covers only answers that go
      through the layer: the best Malloy run answered 56.6% of questions in raw SQL (Matson, Aug 2026)'
    basis: evidence
  brand:
    effect: unknown
  primary:
  - quality
  - governance
