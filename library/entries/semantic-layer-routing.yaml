caveats: 'The case for the layer path rests on small question sets from one insurance dataset (dbt''s 11 questions,
  a vendor benchmark; an independent author''s 38, whose compiler was built while inspecting those questions
  and whose layer arm also got semantics the SQL arm lacked) and on systems evaluated by their builders, with
  Baidu''s ablation also swapping the model. The routing policy itself (layer first, SQL as fallback) is still
  not tested against either path alone; the closest numbers are Baidu''s 95.3% of production queries handled
  by its compiled representation, with the rest sent to experts, and a vendor test in which the agent took
  the SQL route for 56.6% of answers. Against it: in dbt''s August 2026 rerun the margin narrowed and GPT-5.6
  Luna did better with SQL, and on DABStep''s fee-rule questions a model-authored Malloy layer lost to SQL
  written from documentation by 29.4 points with the model fixed, though that documentation had been tuned
  on the same benchmark. Cube''s paired study, often cited for semantic layers, tested a document in the prompt
  rather than a layer that compiles queries (see 5.b.i). Independent 2026 work splits the effect: the semantic
  content does most of the work (Ye, on DABStep with one run per model, found it lifted hard-task accuracy
  by 34 to 46 points) and compiling it adds most for weaker models; layers given as descriptions in the prompt
  helped agents that give up early but made thorough agents stop checking the data (Sourati, seven models,
  1,514 tasks). The ontology results that first made the case (data.world, 16.7% against 54.2% with GPT-4)
  gave the SQL arm no business context.'
