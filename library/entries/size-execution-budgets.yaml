summary: 'Set turn caps, deadlines and command timeouts from what your successful runs actually used,
  show the agent how much budget is left, and never run a command without a timeout. This is one of three
  changes that bound a run: this one lets productive runs finish and keeps the rest from running long,
  7.b.i stops runs that have stalled, and 9.b.i makes sure a run that hits the limit still returns its
  best answer, so raise a cap only together with 7.b.i. On 100 SWE-bench Verified tasks, a turn cap at
  the 75th percentile of each model''s uncapped runs, with a turns-left reminder, cut cost by 24% to 68%
  for a -5 to +2 point change in solve rate, and in another study showing the agent its remaining calls
  lifted a 50-call run from 36.8% to 55.4% resolved. The limits: a higher cap buys little where runs stop
  on their own or stall (raising four local computer-use models from 15 to 100 steps left average success
  at 24.44% and 24.91% while prompt tokens rose 5.50x), and a deadline stated only in the prompt was not
  kept (161% of a 15-minute budget used on average).'
how: '1. Start from the limits as they are: from traces, or one uncapped run on a sample of cases, take
  the distribution of turns, tool calls, wall-clock and command durations, split into runs that succeeded
  and runs that failed, and count the runs that end at each limit (turn cap, deadline, command timeout).
  2. Find the runs that ended at a limit while still progressing (new tool results, new files or a changing
  answer in their last turns); only those can be saved by a higher cap. Runs that end at the cap after
  repeating themselves are 7.b.i''s, and a higher cap only makes them longer: raising four local computer-use
  models from 15 to 100 steps left average OSWorld success at 24.44% and 24.91% while steps per task rose
  4.08x and prompt tokens 5.50x, with failures moving from cap stalls to premature false successes. Put
  7.b.i in place before raising any cap. 3. Set the turn or tool-call cap from that distribution, not
  a framework default: on 100 SWE-bench Verified tasks, a cap at the 75th percentile of each model''s
  uncapped turn counts cut cost by 24% to 68% with solve rates moving -5 to +2 points against no cap,
  while a 25th-percentile cap lost 13 to 37 points. To save more, start lower and grant one extension
  to runs that have not finished: a 50th-percentile cap with one extension to the 75th matched the fixed
  75th-percentile cap within 2 points at 12% to 24% lower cost. 4. Tell the agent its remaining budget
  every turn (turns or calls used and left, time left), not only in the first prompt: under a 50-call
  cap on SWE-bench Verified, a used-and-remaining block after each tool result lifted resolved tasks from
  36.8% to 55.4% at about the same calls and cost, and on a retail support benchmark a 10-call cap with
  the block beat a 50-call cap without it (pass^4 27.2% against 26.3%) with fewer calls. 5. Give every
  command a timeout and return a timeout to the agent as a result it can act on: a shell with no default
  timeout left 34 runs blocked in a final command that never returned, while a 300 s limit turned the
  same hang into an error the model diagnosed and fixed. Set each timeout above the longest command that
  finished in successful runs, and lower it where hung commands eat the run. 6. Enforce wall-clock deadlines
  in the harness, not only in the prompt: with the budget stated only in the prompt, runs used 161% of
  a 15-minute budget on average and 15% finished on time; harness hooks that add the time remaining to
  each tool result brought time used to 99.7% of the budget, and also clamping each command''s timeout
  to the time left gave 74% of runs on time and 90% valid submissions (78% prompt-only), since the commonest
  overrun was a command launched with a limit longer than the time remaining. Do not expect a longer deadline
  alone to raise quality: in that study it did not. 7. Re-run the cases that ended at a limit, then the
  full set, at the old and new limits on the same cases and model, and compare success, limit-ended outcomes
  by kind, turns, tool calls, tokens, cost and wall-clock per case, and how the failures shift.'
detect:
  static: caps, deadlines and command timeouts at framework defaults, unchanged since the agent was built;
    a shell with no default command timeout; a deadline stated only in the prompt, with no clock or remaining-budget
    signal in context
  traces: runs ending at the turn cap or deadline while still producing new information in their last
    turns (a run that ends at the cap after repeating itself is 7.b.i's signal, not this one); commands
    killed by a timeout that finish when re-run with a longer one; a command that never returns until
    the run's deadline; a command launched with a time limit longer than the time left; runs that stop
    on their own far below a cap that was raised
  evals: limit-ended outcomes (turn cap, deadline, command timeout) on cases where the run was still progressing;
    success and cost at two cap settings on the same cases
impact:
  quality:
    effect: mixed
    size: medium
    when: 'caps below what runs need cost the most: a 25th-percentile turn cap lost 13 to 37 points of
      solve rate and a 50-call cap held SWE-bench Verified to 36.8% against 63.0% at 70 calls, while a
      75th-percentile cap with a turns-left reminder moved solve rates by -5 to +2 points against no cap
      (Gao, Oct 2025; Liu, Nov 2025); showing the remaining budget each turn lifted the 50-call result
      to 55.4% (Liu, Nov 2025); raising caps that runs rarely reach added little (BrowseComp 10.5% at
      30 calls, 12.6% at 100; OSWorld 24.44% at 15 steps, 24.91% at 100) (Liu, Nov 2025; Lee, Jul 2026);
      a shell with no default timeout left 34 runs blocked in a command that never returned (Li, Oct 2026)'
    basis: evidence
  cost:
    effect: mixed
    size: large
    when: 'a turn cap at the 75th percentile of uncapped runs cut cost by 24% to 68%, and starting at
      the 50th percentile with one extension saved 12% to 24% more within 2 points of solve rate (Gao,
      Oct 2025); a remaining-budget signal at a 10-call cap matched a 100-call cap on BrowseComp at 31.3%
      lower cost (Liu, Nov 2025); raising a cap costs more: 15 to 100 steps raised steps per task 4.08x
      and prompt tokens 5.50x for no gain (Lee, Jul 2026), and 50 to 70 calls raised SWE-bench Verified
      cost per task from 18.50 to 21.59 cents (Liu, Nov 2025)'
    basis: evidence
  performance:
    effect: mixed
    size: medium
    when: a deadline stated only in the prompt ran to 161% of a 15-minute budget (mean 1,453 s); harness
      clocks brought it to 99.7% (897 s) and clamping command timeouts to the time left to 847 s (Wang,
      Oct 2026); a hung command with no timeout ran to the 40-minute deadline where a 300 s command timeout
      let the same task finish in 11 minutes (Li, Oct 2026); higher caps lengthen runs (steps per task
      4.08x from 15 to 100 steps) (Lee, Jul 2026)
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
  primary:
  - cost
  - quality
measure:
- method: before-after
  tier: 2
  how: the same cases and model at the current and the new limits, first the cases that ended at a limit,
    then the full set, with a remaining-budget signal (turns or calls left, time left) as its own arm;
    report success, limit-ended outcomes by kind (turn cap, deadline, command timeout), turns, tool calls,
    tokens, cost and wall-clock per case, and the failure mix, since a higher cap can turn cap stalls
    into premature false successes
- method: monitor
  how: 'in production traces: share of runs ending at each limit and whether they were still producing
    new results in their last turns; turns, tool calls and wall-clock per run against each cap, split
    by success; commands killed by a timeout and whether a re-run with a longer one finished; commands
    run with no timeout or with a timeout longer than the time left; time used against the deadline'
