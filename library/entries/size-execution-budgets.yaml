caveats: 'The measured studies are still few and narrow: the turn-cap study ran one agent on 100 SWE-bench
  Verified tasks once per setting with prompt caching off (its abstract''s extra 12% to 24% saving from
  extensions is 5.95% to 24.30% in its tables), the remaining-budget gains come only from the authors
  who propose the signal, and the frontier-model evidence is about deadlines, not turn caps (the Terminal-Bench
  2.1 sweep states no trial counts or cost per arm and its accuracies are figure labels, the working-time
  study ran each task once per request and asked for a duration as a target rather than a cap, and the
  5- to 20-minute grid covers four scientific tasks, where part of the smaller models'' score drop with
  more time was a selection effect). Whether more budget pays depends on whether runs reach the limit
  and can use the time: with 100 calls allowed a web-search agent used 14.24 searches on average, local
  computer-use models turned cap stalls into premature false successes, and the deadline-enforcement study
  on one 27B open model says quality held (47.5 to 47.0) where its table shows 49.4 against 42.1. The
  security evidence is one study on older models with constructed attacks, in which a prompt-growth detector
  rather than the caps fired first in most attacks, and it measures caps within a session, not attacks
  that persist across runs. VeRO''s counts (turn caps raised 63 times, lowered 14) show what optimizers
  changed, not what it did; client retries for transient errors are 2.b.i, and in-model thinking budgets
  are 1.b.i, not budgets in this sense.'
