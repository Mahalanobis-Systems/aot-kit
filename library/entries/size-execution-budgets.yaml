caveats: 'The measured studies are few and narrow: the turn-cap study ran one agent on 100 SWE-bench Verified
  tasks once per setting with prompt caching off, its no-reminder comparison re-scores uncapped runs rather
  than running them, and its abstract''s extra 12% to 24% saving from extensions is 5.95% to 24.30% in
  its tables; the deadline study used one 27B open model on five MLE-Bench Lite competitions, and its
  text says quality held (47.5 to 47.0) where its table shows 49.4 against 42.1. Whether a higher cap
  pays depends on whether runs reach it: with 100 calls allowed, a web-search agent used 14.24 searches
  on average and 0.8% of its questions needed more than 50, while a 50-call cap held SWE-bench Verified
  to 36.8% against 63.0% at 70 calls; for local computer-use models a higher step cap bought cost and
  turned cap stalls into premature false successes rather than passes. The remaining-budget gains come
  from the authors who propose the signal, a longer deadline did not by itself raise quality in the one
  study that tested it, and VeRO''s counts (turn caps raised 63 times, lowered 14) show what optimizers
  changed, not what it did; client retries for transient errors are 2.b.i, and in-model thinking budgets
  are 1.b.i, not budgets in this sense.'
