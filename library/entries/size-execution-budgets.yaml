caveats: 'The evidence is frequency only: VeRO''s optimizers raised turn caps far more often than they
  lowered them (MAX_TURNS 63 up, 14 down) and moved timeouts both ways, but no run measured the effect.
  Client retries for rate limits and transient errors are not a budget; they are in 2.b.i.'
