summary: 'Set turn caps, deadlines and command timeouts from what your successful runs actually used,
  show the agent how much budget is left, and never run a command without a timeout. It pays where runs
  hit a limit while still working, now also on frontier models: on Terminal-Bench 2.1, 57% of failed trials
  ended in a timeout, and raising the deadline up to 32x lifted GPT 5.4 in the benchmark''s baseline harness
  from 53.9% to 75.3% (74.2% to 74.9% in Codex); on 100 SWE-bench Verified tasks a turn cap at the 75th
  percentile of uncapped runs, with a turns-left reminder, cut cost by 24% to 68% for a -5 to +2 point
  change in solve rate; and showing the agent its remaining calls lifted a 50-call run from 36.8% to 55.4%
  resolved. Pair it with stall detection (7.b.i) and a forced answer at the limit (9.b.i), and where a
  turn or spend cap also guards against runaway cost, release more budget on progress the harness can
  verify instead of fixing it low (22 of 24 workflows completed against 13 of 24 under a fixed cap). The
  limits: more budget buys little once runs fit or where they stall (15 to 100 steps left local computer-use
  success at 24.44% and 24.91%, and a 16x longer requested duration raised frontier agents'' scores on
  about a quarter of tasks), and a time budget stated only in the prompt is not reliably kept (a 27B open
  model used 161% of a 15-minute budget, and frontier agents asked to work for a set time ended within
  5% of it in 4% to 63% of runs, depending on the model).'
how: '1. Start from the limits as they are: from traces, or one uncapped run on a sample of cases, take
  the distribution of turns, tool calls, wall-clock, spend and command durations per model and harness,
  split into runs that succeeded and runs that failed, and count the runs that end at each limit (turn
  cap, deadline, command timeout, spend cap). Expect the deadline to bind more often than it seems: on
  Terminal-Bench 2.1 at its default task timeouts, 57% of failed trials ended in a timeout across harnesses,
  from 68% under Claude Code to 18% under Gemini CLI, and 11.8% of timed-out trials still passed when
  the state they left was graded. 2. Find the runs that ended at a limit while still progressing (new
  tool results, new files or a changing answer in their last turns); only those can be saved by a higher
  cap. Runs that end at the cap after repeating themselves belong to stall detection (7.b.i), and a higher
  cap only makes them longer: raising four local computer-use models from 15 to 100 steps left average
  OSWorld success at 24.44% and 24.91% while steps per task rose 4.08x and prompt tokens 5.50x, with failures
  moving from cap stalls to premature false successes. Put stall detection in place before raising any
  cap. 3. Set the turn or tool-call cap from that distribution, not a framework default: on 100 SWE-bench
  Verified tasks, a cap at the 75th percentile of each model''s uncapped turn counts cut cost by 24% to
  68% with solve rates moving -5 to +2 points against no cap, while a 25th-percentile cap lost 13 to 37
  points. To save more, start lower and grant one extension to runs that have not finished: a 50th-percentile
  cap with one extension to the 75th matched the fixed 75th-percentile cap within 2 points at 12% to 24%
  lower cost. Base extensions on state the harness can check (whether a patch exists, which milestones
  passed), not on the agent''s own report, and do the same where a cap also guards against runaway cost:
  a fixed cap of five consecutive tool turns interrupted all 60 legitimate 8- to 12-step workflows at
  turn 6, and a fixed $0.10 spend cap completed 13 of 24 workflows against 22 of 24 when $0.13 and then
  $0.16 were released only at host-verified milestones (mean cost $0.099 against $0.113). 4. Tell the
  agent its remaining budget every turn (turns or calls used and left, time left), not only in the first
  prompt: under a 50-call cap on SWE-bench Verified, a used-and-remaining block after each tool result
  lifted resolved tasks from 36.8% to 55.4% at about the same calls and cost, and on a retail support
  benchmark a 10-call cap with the block beat a 50-call cap without it (pass^4 27.2% against 26.3%) with
  fewer calls. The model has no clock of its own and reads time from its context: with timestamps and
  other time cues stripped from finished transcripts, GPT-5.6 Sol''s estimate of how long it had run went
  from 1.07x to 5.38x off. 5. Give every command a timeout and return a timeout to the agent as a result
  it can act on: a shell with no default timeout left 34 runs blocked in a final command that never returned,
  while a 300 s limit turned the same hang into an error the model diagnosed and fixed. Set each timeout
  above the longest command that finished in successful runs, and lower it where hung commands eat the
  run. 6. Enforce wall-clock deadlines in the harness, not only in the prompt, and size them per model
  and harness. With the budget stated only in the prompt, a 27B open model used 161% of a 15-minute budget
  on average and 15% of runs finished on time; harness hooks that add the time remaining to each tool
  result brought time used to 99.7% of the budget, and also clamping each command''s timeout to the time
  left gave 74% of runs on time and 90% valid submissions (78% prompt-only), since the commonest overrun
  was a command launched with a limit longer than the time remaining. Frontier agents differ: asked in
  the prompt to work for a set time, GPT-6 Astra in Codex ended 63% of runs within 5% of it, GPT-5.6 Sol
  39% and Fable 5.1 in Claude Code 4% (41% late); swapping harnesses showed the model, not the harness,
  set this, and some on-time runs slept after finishing (14 of 158 classifiable Astra runs). Test the
  deadline at a much larger setting before trusting it: on Terminal-Bench 2.1, raising deadlines up to
  32x lifted GPT 5.4 in the benchmark''s baseline harness from 53.9% to 75.3% and GPT 5.4 mini from 37.1%
  to 62.9%, against 74.2% to 74.9% and 67.0% to 68.2% in Codex, so most of a 20-point harness gap was
  speed under the deadline. Once runs fit, do not expect more time to raise quality: a longer deadline
  did not in the MLE-Bench study, a 16x longer requested duration left frontier agents'' native scores
  unchanged on 62% to 64% of tasks, and under hard 5- to 20-minute cutoffs the longer one raised the score
  only for the largest of three open models (+0.025 of the gap to the reference closed) and lowered it
  for the two smaller ones (-0.067 and -0.030, partly because weaker runs now finished), while Claude
  Sonnet 5''s score was more sensitive to the time budget than to any other setting varied. 7. Re-run
  the cases that ended at a limit, then the full set, at the old and new limits on the same cases and
  model, and compare success, limit-ended outcomes by kind, turns, tool calls, tokens, cost and wall-clock
  per case, and how the failures shift. When comparing models or harnesses, run each at the current deadline
  and at a much larger one, so a gap that is only speed shows, and use several runs per arm: in one grid
  about 54% of score variance among genuine attempts was run-to-run noise.'
detect:
  static: caps, deadlines and command timeouts at framework defaults, unchanged since the agent was built
    or the model last changed; a shell with no default command timeout; a deadline or requested working
    time stated only in the prompt, with no clock or remaining-budget signal in context; no per-session
    turn, tool-call or spend cap, or a fixed one set to stop runaway cost without checking how long legitimate
    runs take
  traces: runs ending at the turn cap or deadline while still producing new information in their last
    turns (a run that ends at the cap after repeating itself is the stall detector's signal, 7.b.i, not
    this one); a large share of failures ending in a deadline timeout, or different shares for the same
    model in different harnesses; commands killed by a timeout that finish when re-run with a longer one;
    a command that never returns until the run's deadline; a command launched with a time limit longer
    than the time left; runs that stop on their own far below a cap that was raised; runs that end on
    time after idling (sleep or clock-polling calls once the work is done); sessions whose input grows
    several-fold turn over turn from one tool's returns
  evals: limit-ended outcomes (turn cap, deadline, command timeout, spend cap) on cases where the run
    was still progressing; success and cost at two cap or deadline settings on the same cases; model or
    harness comparisons whose order changes when the deadline is raised
  probes:
    what: Tasks whose successful runs need more turns or time than the current limits, and a tool that
      pads its returns on every call
    construct: Take cases whose successful runs went past the current cap or deadline and check they now
      finish; add a tool that returns schema-valid output padded more on each call, and check that the
      turn, tool-call or spend cap stops the session near its threshold while the long legitimate cases
      still complete.
impact:
  quality:
    effect: mixed
    size: medium
    when: 'caps below what runs need cost the most: a 25th-percentile turn cap lost 13 to 37 points of
      solve rate and a 50-call cap held SWE-bench Verified to 36.8% against 63.0% at 70 calls (Gao, Oct
      2025; Liu, Nov 2025), and on Terminal-Bench 2.1 raising the deadline up to 32x lifted GPT 5.4 from
      53.9% to 75.3% and GPT 5.4 mini from 37.1% to 62.9% in the baseline harness, against 74.2% to 74.9%
      and 67.0% to 68.2% in Codex (Buchanan, Nov 2026); a 75th-percentile cap with a turns-left reminder
      moved solve rates by -5 to +2 points against no cap (Gao, Oct 2025), and showing the remaining budget
      each turn lifted the 50-call result to 55.4% (Liu, Nov 2025); a fixed $0.10 spend cap completed
      13 of 24 workflows against 22 of 24 with extensions at verified milestones (Zhang, Sep 2026); more
      budget adds little once runs fit or where they stall: BrowseComp 10.5% at 30 calls and 12.6% at
      100, OSWorld 24.44% at 15 steps and 24.91% at 100 (Liu, Nov 2025; Lee, Jul 2026), a 16x longer requested
      duration left native scores unchanged on 62% to 64% of tasks (Ofengenden, Oct 2026), and under 5-
      to 20-minute cutoffs the longer one lowered the score of two smaller open models (-0.067 and -0.030
      of the gap closed) and raised it for the largest (+0.025), while Claude Sonnet 5 was most sensitive
      to time (Wiedmann, Oct 2026); a shell with no default timeout left 34 runs blocked in a command
      that never returned (Li, Oct 2026)'
    basis: evidence
  cost:
    effect: mixed
    size: large
    when: 'a turn cap at the 75th percentile of uncapped runs cut cost by 24% to 68%, and starting at
      the 50th percentile with one extension saved 12% to 24% more within 2 points of solve rate (Gao,
      Oct 2025); a remaining-budget signal at a 10-call cap matched a 100-call cap on BrowseComp at 31.3%
      lower cost (Liu, Nov 2025); raising a cap costs more: 15 to 100 steps raised steps per task 4.08x
      and prompt tokens 5.50x for no gain (Lee, Jul 2026), 50 to 70 calls raised SWE-bench Verified cost
      per task from 18.50 to 21.59 cents (Liu, Nov 2025), and releasing spend at verified milestones raised
      mean cost per workflow from $0.099 to $0.113 while completing 22 of 24 instead of 13 (Zhang, Sep
      2026); a spend cap bounds runaway sessions: fed by a tool that inflated its returns, 51 of 69 priced
      attack sessions passed $0.10 and the worst reached $3.40, against a $0.025 benign maximum (Zhang,
      Sep 2026)'
    basis: evidence
  performance:
    effect: mixed
    size: medium
    when: 'a deadline stated only in the prompt ran to 161% of a 15-minute budget (mean 1,453 s); harness
      clocks brought it to 99.7% (897 s) and clamping command timeouts to the time left to 847 s (Wang,
      Oct 2026); frontier agents asked to work for a set time missed it by a typical 1.18x (GPT-6 Astra
      in Codex) to 2.86x (Fable 5.1 in Claude Code) (Ofengenden, Oct 2026); a hung command with no timeout
      ran to the 40-minute deadline where a 300 s command timeout let the same task finish in 11 minutes
      (Li, Oct 2026); higher caps and deadlines lengthen runs: steps per task 4.08x from 15 to 100 steps
      (Lee, Jul 2026), median steps per run 25 to 36 and 18 to 24 from a 5- to a 20-minute cutoff (Wiedmann,
      Oct 2026)'
    basis: evidence
  security:
    effect: improves
    size: small
    when: 'a cap enforced by the host bounds denial-of-wallet attacks, which the model''s own stopping
      does not: with an admitted tool inflating its returns, cumulative input reached 14,293x the first
      call across six model families, exposure tracked how long the run survived (correlation ρ=0.79 with
      mean turns and 0.81 with tool calls), and host limits on prompt size, prompt growth, tool turns
      and spend contained all 41 recurring attacks in 123 replay evaluations, with a growth detector usually
      firing first and the turn and spend caps as backstop (worst constructed leakage $0.105 at a $0.10
      breaker) (Zhang, Sep 2026); one study, older models, constructed attacks'
    basis: evidence
  governance:
    effect: improves
    size: small
    when: 'a limit enforced by the harness holds where a stated one does not: a 27B model given a 15-minute
      budget in the prompt used 161% of it, against 99.7% with harness clocks (Wang, Oct 2026); frontier
      agents asked to work for a set time ended within 5% of it in 4% to 63% of runs, and some on-time
      runs slept after finishing (14 of 158 classifiable GPT-6 Astra runs) (Ofengenden, Oct 2026); a host
      spend breaker held constructed attacks to at most $0.105 against its $0.10 threshold, and only 71
      of 3,830 public MCP server and transport repositories showed any code-visible token, rate, turn
      or spend limit (Zhang, Sep 2026)'
    basis: evidence
  brand:
    effect: unknown
  primary:
  - cost
  - quality
measure:
- method: before-after
  tier: 2
  how: the same cases and model at the current and the new limits, first the cases that ended at a limit,
    then the full set, with a remaining-budget signal (turns or calls left, time left) as its own arm;
    when comparing models or harnesses, run each at the current deadline and at a much larger one, so
    a gap that is only speed shows; report success, limit-ended outcomes by kind (turn cap, deadline,
    command timeout, spend cap), turns, tool calls, tokens, cost and wall-clock per case, and the failure
    mix, since a higher cap can turn cap stalls into premature false successes, over several runs per
    arm; where a cap also guards against runaway cost, add a probe tool that inflates its returns and
    check that the cap stops it while legitimate long tasks still finish
- method: monitor
  how: 'in production traces: share of runs ending at each limit and whether they were still producing
    new results in their last turns; turns, tool calls, wall-clock and spend per run against each cap,
    split by success, model and harness; commands killed by a timeout and whether a re-run with a longer
    one finished; commands run with no timeout or with a timeout longer than the time left; time used
    against the deadline, and runs that finish early and then idle; sessions whose input grows several-fold
    turn over turn from one tool''s returns'
