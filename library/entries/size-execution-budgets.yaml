  task: 'Let an admitted malicious tool return schema-valid, inflated results that the host keeps in history
    and bills again on every later call (six attack vectors), measure cost amplification against run length,
    then test host-side limits enforced before each model call: per-session and per-turn token budgets,
    a prompt-growth detector, caps on consecutive tool turns, calls per turn and total calls, and a cumulative
    spend breaker, either fixed or released on host-verified progress'
  effect: 'Across 243 executions "the maximum per-session cumulative input reaches 14,293x the corresponding
    session''s complete first-call input"; "51/69 priced attack sessions cross the $0.10 circuit-breaker
    setting and exposure reaches $3.40, versus a $0.025 benign maximum"; "Observed run termination is
    highly variable and does not enforce the host''s budget." Across 24 cells amplification "is associated
    with mean turns (ρ=0.79) and tool calls (ρ=0.81)", and offline truncation of 44 malicious traces to
    two to four turns cut the high-to-low amplification ratio from 4.06x to 1.49-1.51x. The four limits
    together contained all 123 replay evaluations of 41 recurring attacks under strict, moderate and relaxed
    presets; the growth detector usually fired first (removing it raised leakage 4.2 to 14.7x), and on
    constructed low-growth attacks the worst leakage was $0.105 against the $0.10 spend breaker. Utility:
    the fixed moderate cap (five consecutive tool turns) interrupted all 60 completed 8- to 12-step workflows
    at turn 6, while a growth-gated version caused 0 of 60 interruptions and kept 41 of 41 containment;
    on 24 Mistral Small 4 workflows a fixed $0.10 spend cap completed 13/24 (54.2%) with 9/24 interrupted
    before completion, against 22/24 (91.7%) and 0/24 when $0.13 and $0.16 were released only at host-verified
    milestones (exact McNemar p=0.0039), at $0.099 against $0.113 mean cost. "Only 71 of 3,830 scanned
    public MCP server and transport repositories expose any code-visible safeguard proxy, and none cover
    all four safeguard families."'
