summary: 'Have the agent turn runs that passed a verifier into reusable skills (a code function or a SKILL.md
  procedure), store them in a library, and on later tasks show it only the few a separate selection step
  picks, reviewing what goes in and pruning what goes unused. It pays on recurring task families when
  skills come from verified successes: skills distilled from an agent''s own successful runs raised success
  on those tasks (Terminal-Bench-2 0.5935 to 0.7548 with GPT-5.3-Codex), but skills distilled from failed
  runs fell below no experience, and skills a model wrote before attempting the task scored 8.1 to 11.5
  points below no skills with Opus 4.7, GPT-5.5 and Gemini 3.1 Pro. Two costs grow with the library: agents
  stop opening the right skill (loaded-skill recall 73.6% to 27.4% with 1,000 irrelevant skills listed)
  unless a preselector chooses, and an agent that writes skills from retrieved ones copied planted malicious
  code into its own library on 20.3% to 41.8% of tasks across six models.'
how: '1. Start from the baseline: the same model and harness with no skill library, plus an arm with cleaned
  traces of past runs in context (cheaper: 95.3K fewer tokens per task than distilled skills, for 4.8
  points less success in one study), on recurring task families with a deterministic verifier, scored
  on held-out instances. Do not ask the model to write skills from what it already knows before it attempts
  the task: such self-generated skills scored 8.1 to 11.5 points below no skills with Opus 4.7, GPT-5.5
  and Gemini 3.1 Pro, because solvers never opened them or followed confident errors such as a hard-coded
  1000x unit conversion. 2. Write a skill only from a run the verifier passed: distill the trajectory
  into a code function or a SKILL.md (when to use it, preconditions, steps, failure modes, a verify step)
  with task-specific paths and values replaced by placeholders. If failed runs feed the writer, label
  them: skills distilled from failed runs alone fell below no experience in all six benchmark-model cells,
  and hiding the success and failure labels cut Gemini 3.1 Pro on Terminal-Bench-2 from 0.7462 to 0.4000.
  Voyager added a program only after self-verification passed, and removing self-verification cut discovered
  items by 73%. 3. Gate admission: keep agent-authored skills in a quarantine that retrieval cannot see
  until a reviewer or a signed admission step approves them, and tell the authoring agent that retrieved
  skills are untrusted and that banner-style "REQUIRED PATTERN" or "DO NOT MODIFY" boilerplate must not
  be copied (10.c.i). In one study that four-line instruction cut self-poisoning from 20.3% to 41.8% of
  tasks to at most 6.7% with no significant loss in task completion, while a name blocklist caught none
  of the authored copies and a code scanner fell to 7% after a one-line rewrite. 4. Retrieve a few skills
  through a separate step instead of listing them all (the same deferral idea as 2.a.i): near 100 skills,
  an LLM preselector over names and descriptions; at thousands, retrieval followed by an LLM selector;
  expose a handful (at most five in the study). With 1,000 irrelevant skills listed, loaded-skill recall
  fell from 73.6% to 27.4% although a selector given the same list found 73.9%; LLM preselection cut tokens
  per run from 1,966k to 547k and added a median 8 to 41 seconds of routing; asking the agent to plan
  its skill use first did less than preselection. 5. Prune and revise from telemetry: log which skills
  each run opens and its outcome; retire skills that are never opened or whose runs keep failing, and
  merge near-duplicates, since irrelevant descriptions suppress loading (masking them restored recall
  from 18.3% to 63.3%) and similar skills are the hardest to tell apart (top-1 precision 70.5% to 53.4%
  on similar pools). If a poisoned skill is found, scrub the agent-authored copies too: in one model the
  infection rose to 68% of tasks after the planted seeds were removed. 6. Measure paired against the baseline,
  same model and harness, on held-out tasks (not only the tasks the skills came from): pass rate, tokens
  and time per task, loaded-skill recall, zero-load rate and the misapplied-skill rate (10.0% of skill
  runs in one study); rerun with the library padded to its expected size and with planted-skill probes,
  since task success can stay flat while skill use collapses (precision 29.6% to 3.3% with success 36.4%
  to 39.3%).'
detect:
  static: A skills directory or store the agent writes to after runs; skills written without a verifier
    outcome, or from the model's own knowledge before it attempts the task; new skills retrievable with
    no review or quarantine; authoring that reads retrieved skills as templates; every skill's name and
    description listed to the agent on every run.
  traces: Skill reuse rate; skills authored per session; loaded-skill recall and zero-load rate per run;
    per-skill opens and outcomes; skills never opened; skills distilled from failed or unlabeled runs;
    authored skills that copy retrieved code verbatim.
  evals: Paired runs with and without the library on held-out tasks from recurring families (pass rate,
    tokens, time); pass rate and loaded-skill recall as the library is padded with irrelevant skills.
  judge: 'Review each new skill before it becomes retrievable: task-specific paths or values baked in,
    confident assumptions no verifier checked, boilerplate copied from retrieved skills, overlap with
    existing skills.'
  probes:
    what: Recurring task families; a growing library; planted skills.
    construct: 'Five variants of one task family with a verifier: early runs write skills, later held-out
      variants should open and benefit from them; the same probes with the library padded with irrelevant
      skills; and a planted skill with copy-me boilerplate and a harmless callback, which no authored
      skill should reproduce.'
  primary:
  - traces
  - evals
impact:
  quality:
    effect: mixed
    size: large
    when: skills distilled from an agent's own successful runs raised success on the same tasks (Terminal-Bench-2
      0.5935 to 0.7548 with GPT-5.3-Codex, 0.5000 to 0.7923 with Gemini 3.1 Pro), but skills from failed
      runs fell below no experience in all six cells and hiding outcome labels cut 0.7462 to 0.4000 (Jiang,
      Aug 2026); skills written before any attempt scored 8.1 to 11.5 points below no skills while curated
      ones added 18.2 to 24.8 (Li, Feb 2026); with 1,000 irrelevant skills listed, Pass@3 fell from 51.6%
      to 38.6% (Liu, Oct 2026); Voyager found 3.3x more unique items than prior agents (Wang, May 2023)
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: skills used 34.2K fewer tokens per task than the Raw arm but 95.3K more than cleaned traces
      of the same runs, on 83 matched tasks (Jiang, Aug 2026); listing every skill's description raised
      tokens per run from 498k to 1,966k with 1,000 irrelevant skills added, and an LLM preselector brought
      it to 547k (Liu, Oct 2026)
    basis: evidence
  performance:
    effect: mixed
    size: small
    when: Voyager reached tech-tree milestones up to 15.3x faster, counted in prompting iterations, than
      prior agents (Wang, May 2023); a run took 15.3 minutes with only the relevant skills and 17.0 with
      1,000 more listed, and preselection adds a median 8 to 41 seconds of routing (Liu, Oct 2026)
    basis: evidence
  security:
    effect: degrades
    size: large
    when: planted skills were copied into agent-authored skills on 20.3% to 41.8% of SWE-bench Verified
      tasks across six open-weight models, leaving 4.9 to 9.0 times the planted count, and one model's
      infection rose to 68% after the plants were removed; a name blocklist caught 0 of 275 authored copies;
      a four-line counter-prompt cut it to at most 6.7%, and a curator-signed quarantine stops re-retrieval
      (Wu, Aug 2026)
    basis: evidence
  governance:
    effect: mixed
    size: medium
    when: 'skills are versioned files a reviewer can read, but task success hides library failure: skill-use
      precision fell from 29.6% to 3.3% as the pool grew from 5 to 100 while success moved from 36.4%
      to 39.3% (Jiang, Aug 2026), and Claude Opus 4.6 kept Pass@3 at 62.2% (from 64.9%) while its loaded-skill
      recall fell from 81.3% to 30.9% (Liu, Oct 2026); agent-authored skills bypass submission-side review
      unless new entries wait in a curator-signed quarantine (Wu, Aug 2026)'
    basis: evidence
  brand:
    effect: none
    basis: assessment
  primary:
  - quality
  - cost
measure:
- method: experiment
  tier: 4
  how: 'paired runs, same model and harness: no library, the agent-built library, and where available
    a curated library or cleaned traces of past runs, on held-out instances of recurring task families
    scored by a deterministic verifier; pass rate, tokens and time per task, loaded-skill recall, zero-load
    rate and misapplied-skill rate; repeat with the library padded to its expected size with irrelevant
    skills, with implicit loading against a preselector, and with planted skills carrying copy-me boilerplate
    and a harmless callback to measure how often authored skills reproduce them'
- method: monitor
  how: per-skill loads and outcomes, the zero-load rate on tasks that have a matching skill, skills never
    opened (prune), skills admitted and rejected with their source run and verifier result, authored skills
    that copy retrieved code or add network or credential access, and pass rate on the task families the
    library serves
