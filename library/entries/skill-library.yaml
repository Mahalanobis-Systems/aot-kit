caveats: 'The positive evidence for agent-built skills is narrow: the strongest controlled gain scored
  skills on the same tasks whose runs they were distilled from (tasks chosen because raw runs both passed
  and failed), its 6.06-point lead is over cleaned traces with a lower bound of 0.76, and Voyager''s headline
  compares its whole system, not the library alone, with GPT-4 in Minecraft. The self-generated deficit
  comes from skills written before any attempt, so it does not test skills distilled from verified successes,
  and one configuration ran that arm at a higher effort level. The poisoning study used six open-weight
  models, attacker-planted seeds and an agent asked to author a tool on every task; the routing study
  used curated SkillsBench skills with marketplace distractors, mostly on open-weight models with a 37-task
  check on Claude Opus 4.6, Gemini 3.1 Pro and GPT-5.4. No source here measures an agent-grown library
  over months of production use.'
