caveats: 'The positive evidence for agent-built skills is narrow and mostly from the methods'' own authors:
  the largest controlled gain scored skills on the tasks whose runs they came from (its 6.06-point lead
  over cleaned traces has a lower bound of 0.76), the one cross-benchmark transfer test covers a single
  coding library (GPT-5.5 and Opus 4.8 under one harness, run count not stated, no compute-matched arm),
  and the compiled-code savings come from repeating the same 87 requests plus 66 changed ones, with each
  task''s skill supplied rather than retrieved. An independent audit found most gains from automatic harness
  and skill evolution came from benchmark shortcuts or extra inference, though on small splits (50 held-out
  SWE-bench tasks) with mostly small open-weight executors, and Voyager''s headline compares its whole
  system, not the library alone, with GPT-4 in Minecraft. The security results use open-weight executors
  (six models with attacker-planted seeds and an agent asked to author a tool on every task; four models
  adapted from 12 approved conversations each, with sandboxing off), and the routing study used curated
  skills with marketplace distractors, mostly on open-weight models with a 37-task check on Claude Opus
  4.6, Gemini 3.1 Pro and GPT-5.4. No source here measures an agent-grown library over months of production
  use, and the self-generated deficit comes from skills written before any attempt (one configuration
  ran that arm at a higher effort level).'
