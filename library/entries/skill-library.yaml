- source: 'Jinlin Liu, Wei Chen, Xiaojin Zhang, "Lost in Implicit Routing: How LLM Agents Fail to Load
    Relevant Skills at Scale", https://arxiv.org/abs/2610.18522'
  date: '2026-10-13'
  task: Hold SkillsBench tasks and their relevant skills fixed, add up to 10,000 irrelevant marketplace
    skills, and compare implicit loading from skill descriptions with a separate preselection step (LLM,
    retrieval, or retrieval then LLM) that exposes at most five skills
  effect: 'Implicit routing, 0 to 1,000 irrelevant skills: loaded-skill recall 73.6% to 27.4%, zero-load
    rate 9.3% to 51.6%, Pass@3 51.6% to 38.6% (no skills: 26.8% to 34.1% per model); the same models selecting
    from the full list without executing recalled 73.9%. Masking only distractor descriptions restored
    recall from 18.3% to 63.3% (10-task subset); a plan-first prompt recalled 39.9% against 70.6% for
    preselection. At 1,000 skills, LLM preselection: recall 62.0%, Pass@3 51.6%, 547k tokens per run against
    1,966k; retrieval then LLM was best at 1,000 and 10,000 (Pass@3 52.8% and 50.4%); median routing time
    8 to 19 s (LLM) and 33 to 41 s (hybrid) from 10 to 1,000 skills; a run took 15.3 minutes with no extra
    skills and 17.0 with 1,000. Proprietary check: Claude Opus 4.6 Pass@3 64.9% to 62.2% while loaded-skill
    recall fell from 81.3% to 30.9%.'
  conditions: SkillsBench, 82 tasks, three runs per cell, over 15,000 trajectories; executors GLM-5, Kimi
    K2.5, MiniMax M2.5; 37-task check on Claude Opus 4.6, Gemini 3.1 Pro and GPT-5.4; curated golden skills
    plus distractors sampled from more than 20,000 market skills, not agent-built skills; independent
