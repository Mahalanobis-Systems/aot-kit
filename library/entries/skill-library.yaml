measure:
- method: experiment
  tier: 4
  how: 'paired runs, same model and harness: no library, the agent-built library, a compute-matched plain
    arm given the library''s extra calls, and where available a curated library or cleaned traces of past
    runs, on held-out tasks from other sources than the skills'' own (other repositories or benchmarks),
    scored by a deterministic verifier over at least three runs; pass rate, tokens, cost and time per
    task including authoring and compiling, loaded-skill recall, zero-load rate and misapplied-skill rate;
    audit admitted skills for benchmark shortcuts; repeat with the library padded to its expected size
    with irrelevant skills, with implicit loading against a preselector, with planted skills carrying
    copy-me boilerplate and a harmless callback, and with content that carries an instruction the user
    did not ask for, and again after a model change'
- method: monitor
  how: per-skill loads and outcomes, the zero-load rate on tasks that have a matching skill, skills never
    opened (prune), skills admitted and rejected with their source run and verifier result, compiled programs
    handed back to the model and reuses per compiled skill, authored skills that copy retrieved code,
    add network or credential access or tell the agent to carry out instructions found in content, actions
    the user's request did not ask for, and pass rate on the task families the library serves
