    Ni, "EVOMAL: Self-Poisoning in Self-Evolving Coding Agents", https://arxiv.org/abs/2608.25776'
  date: '2026-08-26'
  task: Plant skills carrying a payload in the Voyager-style library of a coding agent that writes a reusable
    tool for each task by imitating retrieved skills, measure how often it re-authors the payload into
    its own stored skills, and test existing detectors and two defenses
  effect: 'Agent self-poisoning rate 20.3% to 41.8% across six models on 153 tool-relevant SWE-bench Verified
    tasks, 18.3 to 32.0 points above a payload-free control; 31 to 64 newly authored malicious skills,
    4.9 to 9.0 times the 8 planted. DeepSeek-V4-Pro reached 11.1% with the payload alone, and a single
    seed (0.4% of the library) gave it 19.6%. Targeting one task family: up to 86.7% (Qwen3, 15-task pytest
    family), 35.3% to 63.5% over the three families combined. After the seeds were removed, Qwen3 rose
    to 68% by round 5. A name blocklist caught 0 of 275 authored copies; a code scanner caught 85%, 7%
    after a one-line rewrite. A four-line counter-prompt cut the rate to at most 1.8% on the headline
    attack and at most 6.7% in every setting, with no statistically significant loss in task completion;
    a curator-signed quarantine for agent-authored skills blocks their re-retrieval.'
