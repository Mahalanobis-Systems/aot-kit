- source: Fan et al., "An Empirical Study of Harness Design for Coding Agents", https://arxiv.org/abs/2609.20804
  date: '2026-09-17'
  task: Elide stale tool outputs to stubs before summarizing
  effect: 'T4 (staged elision, then summarization) matches T1-T3 on success and has the lowest cost in
    7 of 8 model-benchmark panels. It has the lowest mean cost per task and the lowest average peak-context/budget
    ratio at every budget, and it calls summarization less than T3 at every budget. At 32k, T1/T2 (elision
    only) still reach about the full window. Example SWE 32k, Nemotron-3 550B: T4 55.6% at $1.45 vs T1
    51.4% at $2.57.'
  direction: supports
  measured: true
  locator: §2.3 Algorithm 1; §3.1 Implementation Details (thresholds); §3.2 'T4 offers the best accuracy-cost
    trade-off', Figs 4-5
