    and two least-recently-used variants), summary budgets, compactor-targeted injections and defenses'
  effect: violation@3 (cases violating in at least one of three runs) rose from 9.6% with the full history
    to 37.8% after compaction, 28.9 points of it only after compaction, while 70.1% of compacted runs
    kept the rule, 26.9% kept it partially and 3.0% lost it; compacted runs that kept the rule violated
    2.6 times as often as full-history runs. Rules delivered by a document or a policy tool were never
    violated with the full history but were after compaction. Selective compactors reached 50.2% violation@3
    and lost the rule in 84.1% of runs (first-in-first-out in every run); summary-writing strategies 21.8%,
    keeping the rule in 91.2%; pi's compaction with an added rule-preservation instruction was the only
    strategy below the full-history rate (9.0% against 11.9%). Summary budgets from 2,500 down to 750
    tokens kept the rule in at least 97.1% of runs (24.2% to 28.1% violation@3); at 300 and 200 tokens
    at least 95.1% of runs lost it (47.1% and 50.0%). A compactor-targeted injection raised violation@3
    from 37.8% to 46.3%; the strongest ('escape') raised violation@6 from 23.5% to 58.8%, and the rule-preservation
    defense brought it to 29.4% with the rule kept in 99.0% of runs.
