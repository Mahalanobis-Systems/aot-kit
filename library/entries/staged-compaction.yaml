  date: '2026-10-20'
  task: Compare text-level compaction (summarization at a standard 96K or 192K threshold, summarization
    at 48K, trimming to the latest 12 tool responses) with dropping old tool-response KV cache inside
    a serving engine (AKV on SGLang) that reuses the retained cache without re-prefill
  effect: 'Editing earlier history ''invalidates subsequent KV states, and triggers re-prefill''. Trimming
    to the latest 12 rounds of tool responses cost 1.85 times as much as the full context, and summarizing
    at 48K cut cost about 7% but lowered accuracy 5 points (GPT-OSS-120B, 100 BrowseComp-Plus tasks, four
