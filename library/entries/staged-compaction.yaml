- source: 'Jithin VG, Ditto PS (Bud Ecosystem), "Bud ContextCompact 2.0: Context Compaction for Agent
    Success and Accuracy with Small Language Models and Constrained Context Windows", https://arxiv.org/abs/2610.25516'
  date: '2026-10-18'
  task: 'A/B test of a vendor runtime''s compaction against none, with compaction the only difference:
    a background summary into fixed fields (goal, labeled facts and identifiers, work done, pending, current
    work, next step), written from the previous summary plus the newly folded messages, with literals
    checked against the source; SWE-bench Verified with a reasoning model in a tight window, plus session-budget,
    threshold and model-size probes and recall probes over recorded sessions'
  effect: 'No session budget: on long sessions (either arm crossed the threshold) compaction raised the
    resolve rate from 41.2% to 52.9% (+12.3 points, 95% CI +1.6 to +23.0, McNemar p = 0.043; discordant
    pairs 21 to 9); short sessions +1.7 (p = 1.0); all pairs +6.5 (p = 0.053). 102 of 200 uncompacted
    sessions ended when one reasoning turn used up the room the history left (85 compacted); 2 overflowed
    from history. Tokens including the summarizer were equal (108.4M against 108.7M), 13% fewer per resolved
    session (1.26M against 1.10M), and model time rose from 73.8 h to 84.2 h. Each summary took a median
    161 s (p90 263 s) with the agent''s own reasoning model as writer; under a 60-turn or 45-minute session
    budget the gain vanished (63/120 against 59/120, -3.3 points, p = 0.48) and compacted sessions hit
    the time limit more often (51 against 39). Threshold probe on a 51.7K-token input budget: compacting
    at 24K won long pairs 7 to 2 (+13.9 points, n.s.); at 48K it fired in 4 of 50 sessions and behaved
    like no compaction. Modeled prefix-cache reuse: 96% of prompt tokens with compaction against 98% without.
    Qwen3-8B stopped after about ten turns at 5-8K tokens and never needed compaction. Recall probes:
    a 1.2B model compacted to 16K scored 0.335 against 0.247 truncated and 0.176 with its full 32K history.'
  conditions: Qwen3.8-27B with thinking, 49,429-token window, vLLM on H100s with prefix caching disabled;
