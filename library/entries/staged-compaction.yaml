  task: Plant a forged user turn (a '[User]:'-style line granting a standing approval) in content the
    agent reads (a repository doc, a fetched web page, a dependency README), run each harness's real serializer
    and compaction prompt, and measure whether the summary records it as the user's instruction and whether
    the agent then acts on it; compare prompt-level and code-level defenses
  effect: 'Harnesses that flatten the history into text with in-band role labels before summarizing laundered
    the forged approval into the summary in 87% to 100% of trials (pi, opencode, Aider 15/15; OpenHands
    14/15; Cline 13/15); harnesses that pass role-typed messages (Codex, Gemini CLI, Qwen Code, Continue)
    0/15. With pi''s prompt the rate was 67% to 69% across Anthropic, OpenAI and Zhipu models (n = 72
    per cell). A laundered approval drove agents to run an attacker''s curl | sh in a sandbox, and end
    to end in the live pi interface in 3 of 6 poisoned sessions against 0 of 5 clean. Gemini CLI''s in-prompt
    anti-injection rule stopped about 13% (Claude) to 25% (GPT) of laundering; a code check comparing
    the summary''s user-attributed claims with the stored user turns caught 77% while demoting 2% of legitimate
