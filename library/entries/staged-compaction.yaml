caveats: 'Most measured evidence is narrow: the frontier-model strategy study ran two runs per configuration
  on two or three tasks per benchmark, the comparison with task records ran once on 40 tasks, rule compliance
  was measured on 17 cases with flash-tier models and an aggressive default summary target, and the loop
  and last-call results come from small open models at 1,400- to 4,096-token thresholds. Effects depend
  on the model and on what is scored: a cheaper summarizer or dropped reasoning cost one model 16 to 20
  points and left another unchanged, the 60% and 85% thresholds come from one study and were not swept,
  and benchmarks with a fixed goal and progress on disk hide the loss of rules that exist only in the
  conversation, which is where summaries fail most. Compaction also costs time (a median 161 s per summary
  with a reasoning writer, enough to erase the gain under a 45-minute cap), the cheapest measured option
  (KV-level dropping) needs a self-hosted engine, and the strongest security result is one author''s test
  of nine harnesses at 15 trials each.'
