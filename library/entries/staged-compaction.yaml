# 5.a.i: Compact conversation history in stages: elide stale tool outputs, then keep an anchored summary
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 5.a.i
legacy_id: T31
slug: staged-compaction
name: 'Compact conversation history in stages: elide stale tool outputs, then keep an anchored summary'
kind: technique
status: card
tiers:
- tier: 2
  why: stops runs dying on context overflow, a hard failure
- tier: 3
  why: it changes what the model sees, so quality must be checked
levers:
- context
domains:
- general
evidence_domains:
- code-generation
categories:
- context.lean-window
summary: Manage the history before it overflows. Past a soft threshold (about 60% of the window) replace
  old tool outputs with short stubs; only past a hard threshold (about 85%) summarize the oldest turns
  into a summary with fixed sections (goal, files touched, done, pending, errors, next step) that is updated
  incrementally, not regenerated. Keep the recent tail verbatim. The value is large at small windows and
  near zero at 128k; compaction alone does not carry multi-window work (see 4.b.iii for state kept in files).
how: 1. Measure peak context against the window on the longest runs. 2. Implement the two thresholds and
  the fixed-section summary. 3. Evaluate with post-compaction probes (recall, artifacts, next step) and
  tokens per task, not compression ratio.
detect:
  static: no compaction, or compaction that summarizes the whole history at once; a context window under
    about 64k
  traces: context-overflow outcomes; peak context over about 85% of the window; summaries that drop file
    changes or decisions; failure rows labeled context-rationale-erosion
  evals: failures concentrated in the longest trajectories
impact:
  quality:
    effect: improves
    size: large
    when: +35.7 points at 32k, +2.7 at 128k (Fan, Sep 2026); staged elision matches other strategies on
      success
    basis: evidence
  cost:
    effect: improves
    size: medium
    when: staged elision lowest cost in 7 of 8 panels, e.g. $1.45 against $2.57
    basis: evidence
  performance:
    effect: unknown
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
measure:
- method: before-after
  tier: 2
  how: context-overflow rate on the same cases
- method: experiment
  tier: 3
  how: paired eval, tokens per task, post-compaction probes
evidence:
- source: repo figure_04
  task: five follow-up benchmarks
  effect: MAX_HISTORY_CHARS lowered twice, never raised.
- source: repo figure_01
  task: five follow-up benchmarks
  effect: Context-management edits in 6 to 10 of 20 runs per benchmark.
- source: Fan et al., "An Empirical Study of Harness Design for Coding Agents", https://arxiv.org/abs/2609.20804
  date: '2026-09-17'
  task: Add context management when the window is tight
  effect: 'Managed tiers (T1-T4) vs no management (T0), averaged over 4 models (Nemotron-3 30B/120B/550B,
    Mistral-Medium-3.5-128B): the gap is 35.7, 15.9, 5.5 and 2.7 pp on SWE-Bench Verified (n=500) and
    9.5, 7.5, 4.8 and 2.8 pp on Terminal-Bench 2.1 (n=89) at 32k/64k/96k/128k. T0 overflow rate falls
    from 78.7% to 8.7% (SWE) and 61.0% to 12.1% (TB) over the same budgets. Managed tiers have zero overflow
    at every budget. Example at 32k SWE: T0 9.4/11.4/6.4/12.6% vs T1 20.6/43.0/51.4/64.4%. At 128k, managed
    tiers change trajectory shape very little (median turns 39-42 for 30B, 70-74 for 550B).'
  direction: supports
  measured: true
  locator: §3.2 'The value of context management grows as the context-window budget shrinks', Fig 3, Tables
    3-4; §4, App 9.5
- source: Fan et al., "An Empirical Study of Harness Design for Coding Agents", https://arxiv.org/abs/2609.20804
  date: '2026-09-17'
  task: Skip recoverable recall of elided outputs
  effect: 'T2 (elision+recall) vs T1 (elision) over 32 model-benchmark-window comparisons: 15 wins, 14
    losses, 3 ties. Mean -0.36 pp (+0.40 SWE, -1.12 TB). 36 of 64 T2/T4 settings never call recall_event
    and the median rate is zero. Use is concentrated at 32k in Nemotron-3 30B (TB T2 4.326 calls/task),
    and even that setting scores below T1. The 550B and Mistral models almost never recall.'
  direction: supports
  measured: true
  locator: §3.2 'Recall (M2) is rarely used...'; App 9.6 Table 13
