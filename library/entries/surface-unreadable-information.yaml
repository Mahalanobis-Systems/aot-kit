# 8.a.ii: Surface information the source holds but the agent cannot read
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 8.a.ii
legacy_id: T39
slug: surface-unreadable-information
name: Surface information the source holds but the agent cannot read
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the model can reach and sees
levers:
- knowledge-access
domains:
- retrieval
- data-analysis
- document-extraction
evidence_domains:
- data-analysis
- web-research
- code-generation
categories:
- retrieval.sources
summary: 'Find information a connected source holds that the agent never reads, and expose it. At file
  level: a reader that drops a format (PDF, Excel, Word, ZIP) or a channel (cell colors, formatting,
  comments). At warehouse level: tables and columns never queried, found by comparing what the agent queried
  against the source''s catalog and joining that to failed cases; then add them to the schema context.
  An index over existing metadata raised table discovery sharply. The runtime alternative, a catalog-search
  tool the agent calls, did not beat giving the schema up front.'
how: 1. List the source's contents (formats, catalog). 2. Diff against what the agent's tools can read
  and what its queries touched. 3. Join the gap to failed or insufficient-evidence cases. 4. Extend the
  reader, or add the missing tables to the schema context (5.b.i). 5. Paired eval on the cases that failed
  for lack of data.
detect:
  static: a file tool limited to plain-text formats; a spreadsheet reader that drops formatting; the source
    catalog lists tables or columns the agent's prompts and tools never reference
  traces: failed opens of PDF, Excel, Word or ZIP files; the set of tables and columns queried, compared
    with the catalog, joined to failures; failure rows labeled domain-knowledge-deficit or missed-read
  evals: failures where the answer existed in an unread part of the source
