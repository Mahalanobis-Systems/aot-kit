summary: 'Find what your agent''s sources hold but its readers never pass on, and expose it: file formats
  and channels a converter drops (font color, highlight, comments, footnotes, PDF or spreadsheet content)
  and, in a warehouse, tables, joins and past queries the agent never reads. It pays where the answer
  sits in the dropped part: on 76 real policy documents, recovering the requirements authors had colored
  or highlighted scored micro F1 0.690 with a parser that kept those cues, against 0.150 with docling
  and 0.075 with plain text, and in industry reports a metadata index raised table-discovery Recall@10
  from 0.075 to 0.450 and a knowledge graph over metadata raised scores from 9% to 48%. Expose the channel
  that holds the evidence, not everything: OCR text added 13 to 16 points for a small page-image reader
  on text evidence but extracted text was neutral to harmful on charts, PDF reading left one GAIA agent
  flat, and loaders widened for coverage also passed on content Office hides, which LLM file services
  then reported as fact in 48% to 76% of trials.'
how: '1. Start from the baseline: run the current agent on questions whose answers live in each part of
  the source, and record what its readers emit per file type and which tables and columns its queries
  touch. List the source''s contents: file formats and, inside each, the channels (font color, highlight,
  comments, footnotes, headers and footers, document properties, tracked changes, hidden sheets, images
  and charts); for a warehouse, the catalog and the query history. 2. Diff what the readers emit against
  the source, format by format and channel by channel, and diff the tables and columns queried against
  the catalog. In one study, docling and plain-text extraction dropped color and highlight, and headers,
  footers, footnotes and document properties were unreachable from a body-only walk of a Word file; adding
  those four raised the authors'' parser on the Word file-fidelity track of Microsoft''s Office Comprehension
  Benchmark from 0.853 to 0.959. 3. Join the gap to failed or insufficient-evidence cases, and check how
  often the channel carries meaning: 32.8% of 6,462 policy documents carried deliberate color or highlight
  (10.3% on an obligation), and those two cues carried the whole effect (+0.302 and +0.262 macro F1 when
  removed one at a time), while bold, italic, monospace and strikethrough each moved it by at most 0.003.
  4. Extend the reader for the channels that carry answers, in code where possible, and label what a cue
  means rather than passing the raw value: typed tags (critical warning, warning, deprecated) added +0.085
  macro F1 over identical raw color markers (p = 0.049; positive on five of six models, significant on
  three). At warehouse level, add the missing tables to the schema context (5.b.i), and mine the query
  history into per-table cards (join recipes, filters, example SQL): in one retailer''s warehouse, replacing
  handcrafted documentation with cards distilled from past queries raised table-selection recall from
  0.714 to 0.805 and AST similarity from 0.490 to 0.550 (Claude Sonnet 4.6). 5. Match the representation
  to where the evidence lives: for a 2B page-image reader, adding OCR text raised strict accuracy by 13
  to 16 points on text evidence (about double with the PDF text layer, which helped all six open 2B to
  8B readers tested), but extracted text was neutral to harmful on charts and figures (-0.046) and trailed
  where retrieval had missed gold pages (-0.061, p = 0.099), so add it for text evidence behind retrieval
  that works. 6. Bound what you expose: a loader widened for coverage also reads what the application
  hides (hidden sheets, rows and columns, vanished text, off-page text boxes, alt text, stale caches);
  markitdown and Apache Tika exposed 17 and 16 of 21 such mechanisms, and LLM file services reported a
  planted hidden fact in 48% to 76% of trials. Tag text from channels the author''s application does not
  show with its provenance so the model can discount it (10.c.i). 7. Measure with paired runs, current
  reader against extended reader on the same model: the cases that failed for lack of data plus questions
  whose answer lives only in each channel, stratified by evidence modality and retrieval recall; score
  precision and false positives as well as recall (a converter that dropped the cues raised the false-positive
  rate on unflagged requirements from 0.011 to 0.043), and track tokens per document (the cue-preserving
  form cost about twice plain text).'
detect:
  static: a file tool limited to plain-text formats; a converter that drops font color and highlight,
    comments, footnotes, headers and footers or document properties; a broad converter that emits hidden
    sheets, rows or off-page text with no provenance tag; the source catalog lists tables or columns the
    agent's prompts and tools never reference
  traces: failed opens of PDF, Excel, Word or ZIP files; the set of tables and columns queried, compared
    with the catalog, joined to failures; failure rows labeled domain-knowledge-deficit or missed-read
  evals: failures where the answer existed in an unread part of the source; evals that score recall but
    not false positives on unflagged items, or pool text and chart evidence into one number
impact:
  quality:
    effect: improves
    size: large
    when: 'Where the answer sits in the dropped channel: author-flagged requirements recovered at micro
      F1 0.690 with color and highlight kept, against 0.150 (docling) and 0.075 (plain text), across six
      models (Zhao, Oct 2026); OCR text added 13 to 16 points for a 2B page-image reader on text evidence
      (Xia, Oct 2026); a metadata index raised table-discovery Recall@10 from 0.075 to 0.450 (Databricks,
      May 2026, vendor) and a metadata knowledge graph raised score from 9% to 48% (Chen, Jul 2025); query-history
      cards raised AST similarity 0.490 to 0.550 (Gwimm, Aug 2026). Flat or worse where it is not: extracted
      text -0.046 on chart and figure questions and +0.004 pooled on MMLongBench-Doc (Xia, Oct 2026);
      PDF reading flat on GAIA (VeRO, Feb 2026); on BEAVER, cards plus raw SQL 9.00% against 6.33%, p
      = 0.12 (Gwimm, Aug 2026).'
    basis: evidence
  cost:
    effect: degrades
    size: medium
    when: Keeping formatting cues cost roughly twice plain-text tokens per document; parsing ran in code
      with no LLM calls (Zhao, Oct 2026). Genie's 0.23x relative cost covers its whole harness, not this
      change (Databricks, May 2026).
    basis: evidence
  performance:
    effect: unknown
  security:
    effect: degrades
    size: medium
    when: 'When a loader is widened for coverage: broad converters (markitdown, Apache Tika) emitted 17
      and 16 of 21 constructions Office does not show, four native-ingestion LLM APIs reported a planted
      hidden fact in 48% to 76% of trials, and 17.5% of 4,263 ordinary files carried at least one such
      construction (Liu, Aug 2026). Provenance tags on text from hidden channels are the authors'' suggested
      defense, untested.'
    basis: evidence
  governance:
    effect: unknown
  brand:
    effect: unknown
  primary:
  - quality
  - security
measure:
- method: experiment
  tier: 3
  how: 'paired eval, current reader against extended reader on the same model: the questions that failed
    for lack of data, plus questions whose answer lives only in one channel (color or highlight, comment,
    footnote, header, hidden sheet, chart, an unqueried table); score recall, precision and false positives
    on unflagged items, stratified by evidence modality and retrieval recall, and record tokens per document'
- method: monitor
  how: per format and channel, the share of files whose loader output lacks content present in the file
    (failed opens, cues detected in the file but absent from the output) or includes text from views the
    application hides, and the share of catalog tables and columns never queried, each joined to failure
    labels; ingestion assertions that every detected cue maps to an emitted span
