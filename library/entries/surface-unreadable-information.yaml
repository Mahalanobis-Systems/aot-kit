  date: '2026-08-26'
  task: Test whether Office-file extractors and LLM file-ingestion services pass on content that Word,
    Excel or PowerPoint store but do not show (hidden and very-hidden sheets, hidden rows and columns,
    vanished text, hidden shapes, off-page text boxes, alt text, stale formula caches, unselected compatibility
    branches)
  effect: '21 confirmed mechanisms; all 13 extractors emit at least one. Broad converters expose the most
    (markitdown 17, Apache Tika 16) while python-docx reads one Word mechanism: "a pipeline that upgrades
    its loader for better coverage can silently widen its attack surface." Over 8,400 API trials with
    a planted benign fact visible only to extraction, mean propagation into answers was 0.48 (GLM) to
    0.76 (Kimi) across four native-ingestion APIs and 0.52 to 0.76 across seven web chatbots; 0 of 840
    on matched clean files. In ordinary files, 748 of 4,263 (17.5%) carry at least one such construction;
    sixteen are rare (unseen or under 2%), five occur in 2.75% to 16.5%. Suggested defense: provenance
    that marks text drawn from a channel the reader never sees.'
  conditions: 210 constructed documents from TAT-QA financial excerpts (10 per mechanism) with benign
    factual traps; 13 extractors at pinned versions; four native-ingestion APIs and seven web chatbots;
    Sheetpedia, DocxCorp and public PPTX samples for base rates; rates describe the balanced test set,
    not real-world attack prevalence
  direction: contradicts
  measured: true
  locator: §4.2-4.6; Table 4, Table 5, Figure 4, Figure 8
- source: 'Kate Gwimm, Carson Eisenach (Amazon), "Beyond the Harness: End-to-End Optimization of Context
    Artifacts for Enterprise Text-to-SQL", https://arxiv.org/abs/2608.22830'
  date: '2026-08-24'
  task: Distill historical production query profiles into per-table SQL reference cards (join recipes,
    filter templates, example CTEs) and retrieve them for text-to-SQL, in place of handcrafted table documentation
  effect: 'Table 2 (internal benchmark of 5,176 production queries, 517-query sample, real retrieval):
    with the baseline harness, replacing documentation with cards raised table-selection recall 0.714
    to 0.805 and AST similarity 0.490 to 0.550 for Claude Sonnet 4.6 (95% CIs separated), and 0.660 to
    0.737 and 0.407 to 0.509 for Qwen Coder 3-30B; optimizing the retrieval harness alone gave AST 0.503
    and 0.456. Execution accuracy on 102 executable queries: 0.255 to 0.333 and 0.176 to 0.235, CIs overlapping.
    Table 3, BEAVER held-out 300 (Claude Sonnet 4.5): few-shot 6.33%, raw historical SQL 6.33%, cards
    6.67%, cards plus raw SQL 9.00% (p = 0.12 vs raw).'
  conditions: One online retailer's warehouse, about 100K query profiles; single-call retrieval harness,
    no agentic loop; internal results mostly structural proxies (AST, string similarity, LLM judge); the
    baseline context already included raw query profiles; BEAVER dw split; deeply compositional queries
    near 1.5% under every context
  direction: mixed
  measured: true
  locator: §4.1 Table 2, Table 4; §4.2 Table 3, Table 5
caveats: 'The file-level evidence rests on one study per claim with the authors'' own benchmarks: the
  color and highlight result comes from a task built so the answer is the cue (a text-only classifier
  reached AUC 0.664), with the authors'' own parser and labels not yet checked by humans, and typed cue
  labels helped on only three of six models. Exposing a channel helps only where the evidence lives in
  it: extracted text was neutral to harmful on charts and figures and pooled to +0.004 on MMLongBench-Doc,
  measured with open 2B to 8B readers only, and VeRO''s PDF reading left GAIA flat. The warehouse half
  rests on in-house and vendor reports (LinkedIn, Databricks, Amazon); the only public-benchmark check
  was directional (9.00% against 6.33%, p = 0.12, with cards alone tying raw historical SQL), and VeRO''s
  +4.9% FACTS row credits GAIA''s cell colors without saying how the two relate. Widening a loader also
  widens what a document can plant: hidden-view content reached LLM answers in 48% to 76% of trials on
  a constructed test set.'
