  date: '2026-10-21'
  task: Parse Word policy documents with a parser that keeps run-level cues (font color, highlight, bold,
    strikethrough) plus headers, footers, footnotes, comments and document properties, tags cues with
    typed roles, and compare it with formatting-blind converters on listing the requirements the author
    singled out
  effect: 'Table 1 (76 documents, 3 repeats, Claude Opus 4.6): micro F1 0.690 (authors'' parser) vs 0.586
    docx2python (keeps formatting as HTML), 0.150 docling, 0.075 plain text; false-positive rate on unmarked
    requirements 0.011 vs 0.043 for docling. Per-cue leave-one-out: highlight +0.302 and color +0.262
    macro F1 (Holm p < 1e-4); bold, italic, monospace and strikethrough within +/-0.003 of zero. Pre-registered
    test (79 documents, 6 repeats): typed roles +0.085 macro F1 over identical untyped markers (CI +0.035
    to +0.145, Holm p = 0.049). Six answering models: plain text 0.007 to 0.075; typing significant on
    3 of 6, no benefit on the two that barely attempt the task. Table 2, Microsoft OCB Word file-fidelity
    track (326 items): 0.959 vs 0.810 docx2python, 0.720 docling, 0.668 unstructured, 0.634 plain text;
    adding headers, footers, footnotes and document properties raised the authors'' parser from 0.853
    to 0.959. Prevalence: 32.8% of 6,462 documents carry deliberate color or highlight, 10.3% on an obligation.
    Cost: code-only, no LLM calls, roughly twice plain-text tokens.'
  conditions: 84 real .docx policy documents from a public corpus (332 marked, 4,192 unmarked requirements;
    76 to 79 scored per run), deterministic lexical scoring with no LLM judge; Claude Opus 4.6 at temperature
    0, replicated on five Claude models and GPT-5.6; labels from OOXML run properties, checked against
    rendered pages (kappa 0.72), not by humans; a text-only classifier reaches AUC 0.664, so the task
