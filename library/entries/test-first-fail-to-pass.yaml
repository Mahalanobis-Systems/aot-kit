# 9.c.iv: Write a fail-to-pass test before the fix, and harden it against wrong fixes
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 9.c.iv
slug: test-first-fail-to-pass
name: Write a fail-to-pass test before the fix, and harden it against wrong fixes
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the agent does and what it spends, so quality and cost must be checked
  proposed: true
levers:
- control-flow
domains:
- code-generation
evidence_domains:
- code-generation
categories:
- verification.spend
summary: 'Make a coding agent''s test a real check: write it before any source edit, admit it only if it fails
  on the unpatched code, then harden it against plausible wrong fixes or have a separate strong model write
  it and hold it fixed while the agent repairs. A test written together with the fix shares the fix''s mistakes
  and adds little (58.9% to 61.4% resolved for GPT-5-mini); written first and hardened, it reached 69.4%, at
  $0.84 against $0.39 per issue. Frozen tests from GPT-5.6-sol raised it from 81.5% to 85.7% on SWE-bench Verified
  but only 0.7 points on SWE-bench Pro, and tests from a weak test writer lowered a repair agent from 61.2%
  to 57.3%.'
how: '1. Start from the current agent as the baseline: resolve rate, cost and steps per issue with no test,
  and, for each check that passed after the agent''s first edit, whether it also passes when replayed on the
  unpatched code (46.0% did for GPT-5.6-sol in one study). 2. Have the agent write the test before any source
  edit, run it on the unpatched code and reject it unless it fails there. Asserting the exact expected behavior
  matters more than printing values. In one study with GPT-5-mini, a test written together with the fix gave
  61.4% resolved against 58.9% without, at $0.56 against $0.39 per issue; joint test and fix failures ran at
  1.87 times the rate expected if they were independent, and 48.2% of unresolved runs had their own test passing
  on a wrong fix. Dropping the test-first phase cost 7.0 points. 3. Harden the test against plausible wrong
  fixes: run it against a few mutated versions of the fix (symptom suppressed, incomplete fix, input-specific
  shortcut) and strengthen it until they fail. Injected reproduction tests that also passed wrong fixes added
  nothing to the fix rate (+0.0 points) while strict ones added 8.5; the full loop took GPT-5-mini from 58.9%
  to 69.4%, at $0.84 against $0.39 per issue. 4. Alternatively, separate and freeze: a separate run writes
  the test from the issue, the harness admits it only if it fails on the unpatched code, and the repair agent
  then edits source only, with the test held fixed. First check the test writer on past issues: its tests should
  fail on the unpatched code and pass on the known fix (87.8% of SWE-bench Verified issues for GPT-5.6-sol,
  61.0% for Codex-5.3, 22.2% for an untrained Qwen3.5-35B-A3B). Frozen tests from GPT-5.6-sol raised a Qwen
  repair agent from 61.2% to 65.3%, while tests from the untrained Qwen model lowered it to 57.3%. 5. A cheaper
  step on its own: have the harness tell the agent when a passing check also passes on the unpatched code (a
  median 11.0 s per run). It cut runs closing on such checks from 23.8% to 13.6% but did not change the resolve
  rate. 6. Measure with paired runs against the no-test baseline at matched spend where you can, several runs
  per arm: resolve rate, cost and steps per issue, and the share of kept tests that fail on the unpatched code
  and reject mutated fixes.'
detect:
  static: a test step that runs after or alongside the fix, with no check that the test fails on the unpatched
    code
  traces: the agent's own test passing on a fix that the reference tests reject; tests that also pass on the
    unpatched code; runs that submit right after their own new test passes
  evals: resolve rate with and without the test step at matched spend; for a separate test writer, the share
    of past issues where its test fails on the unpatched code and passes on the known fix
impact:
  quality:
    effect: improves
    size: medium
    when: written first and hardened, GPT-5-mini 58.9% to 69.4% resolved (Tan, Jul 2026); frozen tests from
      GPT-5.6-sol 81.5% to 85.7% on SWE-bench Verified but +0.7 on SWE-bench Pro, and tests from a weak writer
      cut a repair agent from 61.2% to 57.3% (Tao, Sep 2026)
    basis: evidence
  cost:
    effect: degrades
    size: medium
    when: $0.39 per issue with no test, $0.56 with a test written alongside the fix, $0.84 written first and
      hardened (GPT-5-mini; Tan, Jul 2026); the frozen-test gains are not compute-matched (Tao, Sep 2026)
    basis: evidence
  performance:
    effect: degrades
    size: small
    when: the agent took more steps when told to write the test first (Cheng, Jan 2026); replaying passing
      checks on the unpatched code added a median 11.0 s per run (Xu, Jul 2026)
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: improves
    size: small
    when: code owners reviewing Google's AI-generated fixes strongly preferred fixes with a fail-to-pass reproduction
      test (Cheng, Jan 2026)
    basis: evidence
  brand:
    effect: unknown
  primary:
  - quality
measure:
- method: experiment
  tier: 3
  how: 'paired runs against the no-test baseline, at matched spend where possible, several runs per arm: resolve
    rate, cost and steps per issue, and the share of kept tests that fail on the unpatched code and reject
    mutated fixes'
- method: monitor
  how: 'in production traces: the share of the agent''s own passing tests that also pass on the unpatched code,
    and fixes whose own test passes but whose review or reference tests fail'
evidence:
- source: 'Yuhao Tan, Zhibang Yang, Fangkai Yang, et al. (Nanjing University, Peking University, Microsoft),
    "Beyond Fail-to-Pass: Iterative Hardening of Co-Generated Bug Reproduction Tests and Fixes", https://arxiv.org/abs/2607.19843'
  date: '2026-07-22'
  task: Have the same agent write a reproduction test with its fix (cogeneration) against fix only, then write
    the test before any source edit and harden test and fix over rounds against LLM-generated mutants of the
    fix
  effect: 'Table 2 (OpenHands with GPT-5-mini, 433 issues): fix only 58.9% resolved at $0.39 per issue; fix
    plus test in one run 61.4% at $0.56, its test failing on the buggy code and passing on the reference fix
    in 72.7%; CoHarden 69.4% at $0.84 (78.9%). Table 5: without the test-first phase 62.4%; without hardening
    61.0% (82.6% fail-to-pass). §2.3: in 80 of 166 unresolved cogeneration runs (48.2%) the run''s own test
    passed on its wrong fix; joint test and fix failure 19.9%, 1.87 times the 10.6% expected if independent.
    Table 1, separately generated tests injected into the fix agent: strict tests 67.3% -> 75.8% (+8.5, 552
    pairs), lax tests that also pass wrong fixes 69.5% -> 69.5% (+0.0, 552), tests that fail the reference
    fix 44.5% -> 40.9% (-3.6, 474). Table 3: with GPT-5.4 and Claude Opus 4.5, CoHarden 76.2% and 78.7% against
    70.0% and 70.8% for fix plus test in one run, at $6.69 against $4.26 and $18.07 against $13.99. A budget-matched
    5-round self-refinement loop reached 63.8%.'
  conditions: OpenHands; GPT-5-mini for the main results, GPT-5.4 and Claude Opus 4.5 for cogeneration methods
    only (no fix-only baseline with them); 433-issue intersection of SWE-bench Verified and SWT-bench Verified,
    plus 276 SWE-bench Lite issues; one run per issue; 5 hardening rounds with up to 12 mutants per round (mutant
    generation 9.5% of cost); Python only; no significance tests; the authors propose CoHarden
  direction: supports
  measured: true
  locator: Abstract; §2.2 Table 1; §2.3 Figure 2; §3; §4.1 Table 2; §4.2 Tables 3-4; §4.3 Table 5; App. A.3;
    App. B.2
- source: 'Leitian Tao, Baolin Peng, Haorui Wang, et al. (University of Wisconsin-Madison, Microsoft Research),
    "ExecCritic: Learn to Test, Test to Improve for Coding Agents", https://arxiv.org/abs/2609.09133'
  date: '2026-09-08'
  task: Have a separate test agent write a repository-native test from the issue, admit it only if it fails
    on the unpatched code, freeze it, and let the repair agent revise source from its results; vary who writes
    the test while holding the repair agent fixed
  effect: '§5.2.1: with the untrained Qwen3.5-35B-A3B repair agent fixed, no test 61.2% resolved; tests from
    the same untrained model 57.3% (-3.9); tests from GPT-5.6-sol 65.3% (+4.1); oracle fail-to-pass tests 69.4%.
    GPT-5.6-sol with generated tests: SWE-bench Verified 81.5% -> 85.7% (+4.2), oracle 89.7%; SWE-bench Pro
    61.6% -> 62.3% (+0.7), oracle 73.4%. Table 1, tests that fail on the unpatched code and pass on the reference
    fix (one generation per issue): Qwen3.5-35B-A3B 22.2%, after SFT 39.6%, after RL 62.2%; Codex-5.3 61.0%;
    DeepSeek-V4-Flash 73.4%; GPT-5.6-sol 87.8%. Table 2: trained test and repair agents together 72.6% against
    68.3% for the trained repair agent alone. Authors: "when the same trajectory writes both the patch and
    the test, their errors can agree and create false confidence"; the composed gain "reflects the full system,
    including additional test-generation and revision computation, rather than a compute-matched improvement."'
  conditions: SWE-bench Verified (500) and SWE-bench Pro; Orchard harness; up to 5 test-submission attempts,
    up to 5 revision rounds of 40 turns, submission forced once the frozen test passes; resolved rates are
    means of three repair runs reusing one generated test per issue; issues whose test never failed on the
    unpatched code keep the no-test patch; GPT-5.6-sol at medium effort; not compute-matched; the authors propose
    the scaffold and its training recipe
  direction: mixed
  measured: true
  locator: Abstract; §1; §2; §3.1-3.2; §5.1; §5.2.1 Figure 5; §5.2.2 Table 1; §5.2.3 Table 2; App. A.3
- source: Runxiang Cheng, Michele Tufano, José Cambronero, et al. (Google), "Dynamic Cogeneration of Bug Reproduction
    Test in Agentic Program Repair", https://arxiv.org/abs/2601.19066
  date: '2026-01-27'
  task: Instruct Google's production repair agent to return a reproduction test with its fix (in any order,
