  effect: '§5.1: all three cogeneration prompts "produce at least one plausible fix for a similar number of
    bugs compared to Fix-only" (pass@k plotted in Figure 2, not tabulated); the agent took more steps when
    told to prioritize the test. Table 2: told to write the test first, the agent edited a test first in 78.66%
    of runs (test-last 4.16%, freeform 24.54%, fix only 2.27%). Table 3: probability of a plausible fix given
    a test that fails on the bug and passes on the agent''s fix, 0.53 test-first against 0.45 freeform and
