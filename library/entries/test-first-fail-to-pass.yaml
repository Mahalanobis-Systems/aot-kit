caveats: 'Each measured gain comes from its authors'' own method: CoHarden on 433 Python issues with one run
  per issue and no significance tests (with GPT-5.4 and Claude Opus 4.5 it was compared only with other test-writing
  methods), and ExecCritic, whose gain is not compute-matched and nearly vanished on SWE-bench Pro. A weak
  test writer makes results worse, so the writer must be checked first, and the quality gain costs about twice
  as much per issue. Apart from 120 internal bugs at Google, all results come from Python issue-resolution
  benchmarks.'
