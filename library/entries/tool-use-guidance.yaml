    not the instruction text.'
- source: paper Figure 15 (Orchestrator, Opus 4.5; 'Best SimpleQA')
  task: SimpleQA
  effect: 'Phase 1, ''Improved prompt, tool descriptions'', bundled with prompt changes: validation 0.577
    to 0.622, train 0.456 to 0.587. Not separable from the description changes (T35).'
- source: Jude Gao (Vercel), "AGENTS.md outperforms skills in our agent evals", https://vercel.com/blog/agents-md-outperforms-skills-in-our-agent-evals
  date: '2026-01-27'
