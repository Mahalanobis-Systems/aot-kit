# 2.b.ii: Tell the agent when to use each tool, in context it always sees
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 2.b.ii
legacy_id: T09
slug: tool-use-guidance
name: Tell the agent when to use each tool, in context it always sees
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the model sees
levers:
- tool-surface
- prompt
domains:
- tool-use
evidence_domains:
- reasoning
- web-research
- code-generation
- tool-use
categories:
- tools.misuse
summary: 'For each tool or skill that is under-used or misused, add an explicit trigger rule where the
  model always sees it (system prompt, AGENTS.md): the situation that calls for the tool, and what to
  use it instead of (e.g. the dedicated read or edit tool rather than bash). Test the wording, since results
  swing with it. It will not make a model that rarely calls tools start calling them. The cheapest form
  is one sentence per tool stating what it is for: that alone recovered most of a 34.7-point loss caused
  by offering the model an irrelevant tool.'
how: '1. From traces, list tools with a low call rate on cases where they would have helped, and tools
  chosen wrongly. 2. For each, write one rule: when to use it, and instead of what. 3. Put the rules in
  always-loaded context, not in an optional skill. 4. A/B two wordings; keep the one with the higher call
  rate and pass rate.'
detect:
  static: tools or skills whose intended use is stated nowhere the model always sees; overlapping tools
    with no rule for choosing between them
  traces: 'tool spans: a tool called on under about 5% of cases where its trigger condition held (e.g.
    a docs skill never invoked in 56% of runs); bash spans where a dedicated tool exists; failure rows
    labeled incorrect-tool-selection'
  evals: failures where the right tool existed but was not called
impact:
  quality:
    effect: improves
    size: large
    when: 'Vercel: pass rate 53% to 79% once told when to invoke the docs skill (Jan 2026); VeRO mixed:
      -5 and +4.5 points; one sentence of tool scope recovered most of a 34.7-point loss from an irrelevant
      tool (Paturi et al., Sep 2026)'
    basis: evidence
  cost:
    effect: unknown
  performance:
    effect: unknown
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
measure:
- method: experiment
  tier: 3
  how: paired eval with and without the rule, plus the tool's call rate in traces
evidence:
