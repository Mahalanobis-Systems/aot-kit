caveats: Model strength decides the sign. On weaker models the list keeps the agent working the task;
  on strong models it mainly trades a little success for a lot of cost, by cutting verification turns.
  Measure it per model, and again after a model upgrade. Keeping the plan in a file only matters when
  work outlives one context window; that is 4.b.iii.
