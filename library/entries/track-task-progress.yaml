# 7.b.iv: Track explicit progress: a task list with a status per item, re-injected each turn
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 7.b.iv
legacy_id: T62
slug: track-task-progress
name: 'Track explicit progress: a task list with a status per item, re-injected each turn'
kind: technique
status: card
tiers:
- tier: 3
  why: it changes what the model sees each turn
levers:
- control-flow
- context
domains:
