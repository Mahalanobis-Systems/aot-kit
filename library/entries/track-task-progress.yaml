caveats: 'The evidence is small: four controlled studies on coding, clinical tool and browser, and workspace
  tasks, two of them with one run per setting; none tests a frontier closed model with and without the
  list, and none compares where in the context the list is shown. The effect follows whether a model would
  otherwise stop early, not size alone: the list kept a 30B coding model and an open 120B browser agent
  working, left a 35B model''s scores unchanged (though without it the model left the required output
  missing twice as often), and on strong coding models mostly cut post-edit verification, trading a little
  success for cost. Agents do not use or honor a list reliably: one small model stated its requirements
  before the finish check in only 56.9% of attempts, a TODO list written at the start hurt one of three
  models, and a harness-kept requirement list with a finish check but without the harness''s record of
  reads did no better than the plain agent (41.36 against 41.63). Updating the list costs actions and
  tokens (maybe a third of actions in some Manus tasks, by its co-founder''s recollection), and keeping
  the plan in a file only matters when work outlives one context window (4.b.iii).'
