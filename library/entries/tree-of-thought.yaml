- source: Lijie Yang, Hongyin Luo, Jiawei Zhao, Tri Dao, Ravi Netravali, "Thought-Level Beam Search for
    Reasoning", https://arxiv.org/abs/2608.08020
  date: '2026-08-08'
  task: 'Thought-level beam search inside a thinking model''s reasoning trace (Gambit): the thinking is
    split into steps at paragraph breaks, a small MLP probe on last-layer hidden states scores each prefix,
    and every 200 tokens the 16 lowest-scoring of 256 active traces are pruned and replaced by branches
    from the highest-scoring prefixes (sharing their KV cache), with a score-weighted vote over 256 completed
    traces; compared with unweighted self-consistency over 256 traces and with pruning-only methods (Slim-SC,
    DeepConf, STEP) at the same 256-trace budget'
  effect: 'Accuracy, 256-sample self-consistency vs Gambit (Table 1): Qwen3-4B-Thinking AIME-25 86.7 vs
    90.0, AIME-26 86.7 vs 88.3, HMMT-24 50.8 vs 65.0, HMMT-25 65.0 vs 67.5, GPQA 68.2 vs 70.2; DeepSeek-R1-0528-Qwen3-8B
    83.3 vs 85.8, 83.3 vs 85.0, 55.8 vs 65.6, 70.0 vs 75.8, 67.1 vs 68.2; Phi-4-reasoning-plus 86.7 vs
    88.3, 88.5 vs 90.0, 56.7 vs 58.3, 73.3 vs 75.8, 76.3 vs 77.1. Tokens per question fell 19.7% to 68.5%
    against self-consistency (Phi-4 HMMT-25 1.75M vs 5.56M). Against the pruning-only STEP with the same
    scorer: +3.3 on AIME-25 and HMMT-24 for Qwen3-4B. Wall-clock per question on Qwen3-4B (Table 4): 1,350,
    1,177, 1,912 and 2,179 s on the four math sets vs 3,465, 3,338, 5,358 and 4,313 s for self-consistency.
    The authors say Gambit "strictly dominates" the baselines; Table 1 has DeepConf ahead on DeepSeek-R1-8B
