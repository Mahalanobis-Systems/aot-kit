- source: 'Xinzhe Li, "Chain-in-Tree: Back to Sequential Reasoning in LLM Tree Search", https://arxiv.org/abs/2509.25835'
  date: '2025-09-30'
  task: 'ToT beam search (ToT-BS: an LLM proposes steps, an LLM evaluator scores them) compared with CoT,
    then with a cheap branching-necessity check that expands the tree only where a step needs it'
  effect: 'Accuracy, ToT-BS vs CoT: Qwen3-32B GSM8K 0.98 vs 0.96, Math500 0.87 vs 0.79; LLaMA3-8B 0.79
    vs 0.68 and 0.39 vs 0.34. With the direct-prompt check (BN-DP) on Qwen3-32B, ToT-BS output tokens
    fell 78.3% and 78.9%, policy calls 78.3% and 80.0%, total runtime 77.3% and 78.2%, at accuracy 0.97
    and 0.86. Across frameworks BN-DP "reduces token generation, model calls, and runtime by 75-85%";
    a self-consistency check instead was unstable "in 1-4 out of 14 settings", all within ToT-BS, and
    "poor BN evaluation can negate the benefits of chaining or even harm performance". On LLaMA3-8B
    (Table 2) the cuts were 37.8% to 73.4%, with accuracy drops; the 75-85% is the abstract''s claim.'
  conditions: Qwen3-32B-AWQ and LLaMA3-8B-Instruct; first 100 test items of GSM8K and of Math500 (single-number
    answers); CoT not matched for compute
  direction: supports
  measured: true
