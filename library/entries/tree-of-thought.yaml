caveats: 'Most gains come from puzzles built to break left-to-right decoding (Game of 24, crosswords,
  Sudoku, Countdown) or synthetic logic, often with a programmatic move generator or checker doing part
  of the work, and the headline 74% is against single-sample CoT: self-consistency over 100 samples scored
  9.0%, and the 49% best-of-100 baseline is an oracle. The studies that compare against re-ranking or
  best-of-N (Chen, Snell, Liu, Cinquin) find tree search ties or trails re-ranking and best-of-N except
  on harder items with weaker models and a reliable evaluator; three of them use a trained PRM rather
  than the model''s own evaluation. None of these sources runs ToT on a reasoning model with thinking
  on; the closest shows thinking alone far above ToT on the same model with thinking off. Several studies
  are small (100 items per task in Hao and Li, one model in Cinquin, 1,790 items in He), and Katz''s ToT
  call counts are estimates, not runs. Branching only where a check calls for it held accuracy on Qwen3-32B
  but cost accuracy on LLaMA3-8B (Li).'
