summary: 'Replace one reasoning chain with a search: the model proposes several next steps, an evaluator
  (a rule check, a trained verifier or probe, or the model itself) scores the partial solutions, and the
  search keeps the best or backtracks. It pays on narrow tasks where early steps decide the outcome and
  partial states can be judged reliably: Game of 24 rose from 4% with CoT to 74% on GPT-4, ToT with a
  rule check on each step reached 81.8% against 75.6% for 8-sample self-consistency on Qwen3-8B at similar
  tokens, and on open-weight thinking models beam search over thinking steps scored by a hidden-state
  probe beat 256-sample self-consistency on all 15 model and benchmark pairs with 19.7% to 68.5% fewer
  tokens. Against cheaper baselines the gain often disappears: tree search needed an evaluator at least
  90% accurate to beat re-ranking, PRM-guided tree search showed no significant gain over best-of-N despite
  higher cost, DeepSeek-V3.2 with thinking on solved 92% of Game of 24 in one call against 30% for ToT
  with thinking off, and on Blocksworld GPT-5 alone solved every instance it was given while Qwen3-14B
  needed ToT with thinking on (47 of 50, against 23 in one call) at 330k tokens per instance. Its authors
  put the cost at 5 to 100 times the generated tokens of CoT.'
how: '1. Start from the cheap baselines on your own items: the same model in one call with thinking on
  or higher effort (1.b.i), and self-consistency or best-of-N at the same token budget (9.c.ii); consider
  a search only for the items those miss, where an early wrong step dooms the answer and partial states
  can be checked, and route only those to it (a low average verifier score across samples served as the
  difficulty estimate). Re-check the need on every model upgrade, since stronger models gained less: best-of-N
  beat search at 72B, and on Blocksworld GPT-5 solved in one call every instance it was given, where Qwen3-14B
  solved 23 of 50 in one call with thinking on and 47 of 50 with ToT. 2. If the moves and the goal can
  be written down, have the model write the successor function and goal test in code and run plain BFS
  or DFS: that solved all 1,362 Game of 24 instances with about 2 LLM calls in total, where ToT makes
  about 100 calls per problem. 3. Otherwise define a thought as one checkable step (an equation, a SQL
  clause, a line of code, a plan action, one derived fact), propose several candidates per node and keep
  the best b (ToT kept b = 5), scoring partial states with the most reliable evaluator you have: a rule
  or execution check first (execution feedback raised discriminator accuracy by up to 30.2 points; with
  exact arithmetic, state-transition and test checks on each step, ToT on Qwen3-8B averaged 81.8% over
  five tasks against 75.6% for 8-sample self-consistency, at 7.0k against 6.5k generated tokens), then
  a trained verifier, then the model''s own value or vote. Measure the evaluator''s ranking accuracy on
  labeled partial solutions before wiring it in; tree search needed at least 90% to beat re-ranking. 4.
  Use a search that can back up: depth-first or best-first with pruning of states rated impossible, not
  a fixed-depth breadth-first pass (ToT''s BFS won 9.47% of 5-number Countdown games against 60.00% for
  MCTS). When the checker can name the earlier decisions that make a state fail, jump back to the latest
  of them and cache the failing combination rather than revising the last step: against ToT on Qwen3-8B
  that raised mean success from 81.8% to 84.2% with 12.0 instead of 19.0 verifier calls. Cap nodes, tokens
  and wall-clock, stop on the first verified solution, and return a fallback answer when the search ends
  empty. 5. On an open-weight thinking model you serve yourself, search inside the reasoning trace rather
  than across prompts: split the thinking at paragraph breaks, score each prefix with a small probe on
  the model''s hidden states trained on labeled traces, and at fixed intervals (every 200 tokens in one
  study) prune the lowest-scoring traces and branch from the best prefixes so the children share their
  KV cache, starting only after enough reasoning has accumulated (12,000 tokens there). With 256 traces
  per question this beat 256-sample self-consistency on all 15 model and benchmark pairs (HMMT-24 on Qwen3-4B-Thinking
  50.8 to 65.0) with 19.7% to 68.5% fewer tokens; it needs hidden-state access, so it does not apply to
  API-only models. 6. Branch only where a step needs it: a cheap check before each expansion cut ToT beam-search
  output tokens by 78.3% and 78.9% on Qwen3-32B, at accuracy 0.97 and 0.86 against 0.98 and 0.87, but
  on LLaMA3-8B the cuts were 37.8% to 73.4% with accuracy drops, so re-check accuracy on your model. Run
  the b expansions and their evaluations in parallel, and to cut wall time expand the likely next branches
  before the evaluator returns and end deep straggler branches early: across four ToT and MCTS algorithms
  that gave average speedups of 1.8 to 3 times for depth-first and 1.2 to 1.9 times for breadth-first
  search, with average accuracy unchanged or slightly higher. 7. Measure on held-out items with ground
  truth the search never sees: accuracy against both baselines at matched tokens, split by difficulty,
  plus tokens, LLM and verifier calls, p50 and p95 latency, and the share of searches that end without
  a solution.'
detect:
  static: 'A search controller: several candidate next steps per node, an evaluator that scores partial
    solutions (the model''s value or vote, a trained verifier or hidden-state probe, or a rule or execution
    check), breadth-first or beam search keeping the best b, or depth-first with backtracking, and a node
    or token budget. Flag a one-prompt imitation ("imagine three experts") presented as ToT, a model self-evaluator
    where a rule or execution check exists, a search that only revises the last step when the checker
    can name the earlier decision that caused the failure, a search with no fallback answer when it ends
    empty, and no comparison against the same model in one call with thinking on or against self-consistency
    or best-of-N at equal tokens.'
  traces: Nodes expanded, depth and branching per item; pruned and backtracked branches; LLM calls, tokens
    and wall-clock per item; evaluator score of the chosen path next to the ground truth; share of searches
    that hit the budget or end without a solution.
  evals: Accuracy against the same model in one call with thinking on and against self-consistency or
    best-of-N at matched tokens, split by difficulty; evaluator ranking accuracy on labeled partial solutions;
    tokens and latency.
  judge: 'The partial-solution evaluator is the judge: check its ranking accuracy against ground truth
    before relying on it (tree search needed at least 90% to beat re-ranking).'
  probes:
    what: Puzzles with dead ends.
    construct: Tasks where the greedy first path fails and every partial state can be checked by rule
      (Game of 24, Countdown, Sudoku, constrained planning), so the evaluator's errors can be measured
      against the rule.
  primary:
  - static
  - evals
impact:
  quality:
    effect: mixed
    size: medium
    when: 'gains where one pass fails early and partial states can be judged: Game of 24 4% to 74% on
      GPT-4 (Yao, May 2023); logic proofs 72.0 to 83.1 on GPT-4o (He, Apr 2025); with a rule check per
      step 81.8% vs 75.6% for 8-sample self-consistency on Qwen3-8B (Song, Sep 2026); beam search over
      thinking steps above 256-sample self-consistency in all 15 cells, e.g. HMMT-24 50.8 to 65.0 on Qwen3-4B-Thinking
      (Yang, Aug 2026); Blocksworld 47 of 50 with ToT and thinking on vs 23 of 50 in one call on Qwen3-14B
      (Hamm, May 2026); no gain over cheaper selection when the evaluator is weak or the model strong:
      tree search 67.5 vs re-ranking 70.3 on Spider (Chen, Feb 2024), PRM beam search 71.8 vs best-of-8
      72.7 (Cinquin, Oct 2025), best-of-N best at 72B (Liu, Feb 2025); thinking on alone 92% vs ToT with
      thinking off 30% on Game of 24 (Hao, Mar 2026); GPT-5 alone solved all Blocksworld instances it
      was given (Hamm, May 2026)'
    basis: evidence
  cost:
    effect: degrades
    size: large
    when: '$0.74 and 5.5k completion tokens per Game of 24 case vs $0.47 for 100 CoT samples; 5 to 100
      times CoT''s tokens by the authors'' estimate (Yao, May 2023); about 100 LLM calls per Game of 24
      problem vs about 2 in total for a coded search (Katz, Apr 2024); PRM beam search 20.2 vs 8.2 (x10^7)
      generated tokens for best-of-8 at the same accuracy (Cinquin, Oct 2025); ToT with thinking on 330k
      tokens per Blocksworld instance vs 231k with it off (Hamm, May 2026); cheaper than wide sampling
      when branches share prefixes: 1.6M to 4.2M tokens per question for beam search over thinking steps
      vs 2.3M to 8.5M for 256-sample self-consistency, 19.7% to 68.5% fewer (Yang, Aug 2026); branching
      only where needed cut ToT output tokens 78.3% to 78.9% on Qwen3-32B; on LLaMA3-8B cuts were 37.8%
      to 73.4%, with accuracy drops (Li, Sep 2025)'
    basis: evidence
  performance:
    effect: degrades
    size: large
    when: 'serial generate-then-evaluate rounds: tree search 262.8 to 405.2 s per Bird example vs 16.4
      to 24.4 s for re-ranking (Chen, Feb 2024); ToT on GPT-4o 0.30 to 2.13 min per logic problem vs 0.08
      to 0.12 for CoT and 0.21 to 1.02 for o3-mini (He, Apr 2025); beam search over thinking steps 1,177
      to 2,179 s per competition-math question on Qwen3-4B vs 3,338 to 5,358 s for 256-sample self-consistency
      on one GPU (Yang, Aug 2026); expanding likely branches before the evaluator returns gave 1.8 to
      3 times average speedups for depth-first and 1.2 to 1.9 times for breadth-first ToT (Zhong, May
      2026)'
    basis: evidence
