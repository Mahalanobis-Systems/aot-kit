caveats: 'Most gains come from puzzles built to break left-to-right decoding (Game of 24, crosswords,
  Sudoku, Countdown, Blocksworld) or synthetic logic and contest math, often with a programmatic move
  generator or checker doing part of the work, and the headline 74% is against single-sample CoT: self-consistency
  over 100 samples scored 9.0%, and the 49% best-of-100 baseline is an oracle. The studies that compare
  against re-ranking or best-of-N with a trained or model evaluator (Chen, Snell, Liu, Cinquin) find tree
  search ties or trails them except on harder items with weaker models and a reliable evaluator; the two
  2026 studies where search beat self-consistency used a rule check on every step (Song, one team, thinking
  mode not stated) or a probe trained on the model''s own hidden states, which needs open weights and
  labeled traces (Yang, 30-problem contest sets, 256 traces and 1.6M to 4.2M tokens per question, no single-call
  baseline). The only ToT run with thinking on is one small Blocksworld study (Hamm: one model, 50 instances,
  results that swung with prompt configuration, and tables that do not match its text), and there GPT-5
  alone solved every instance it was given; the closest other evidence shows thinking alone far above
  ToT with thinking off (Hao). Several studies are small (100 items per task in Hao and Li, 50 in Hamm,
  one model in Cinquin, 1,790 items in He), Katz''s ToT call counts are estimates, not runs, and branching
  only where a check calls for it held accuracy on Qwen3-32B but cost accuracy on LLaMA3-8B (Li).'
