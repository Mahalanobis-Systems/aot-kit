summary: 'Tree-of-Thought replaces one reasoning chain with a search: the model proposes several next
  steps, an evaluator (the model itself, a trained verifier or a rule check) scores the partial solutions,
  and breadth-first or depth-first search keeps the best or backtracks. It pays on narrow tasks where
  early steps decide the outcome and partial states can be judged reliably: Game of 24 rose from 4% with
  CoT to 74% on GPT-4, and logic-proof accuracy on GPT-4o from 72.0 to 83.1. Against cheaper baselines
  the gain often disappears: tree search needed an evaluator at least 90% accurate to beat re-ranking,
  PRM-guided tree search showed no significant gain over best-of-N despite higher cost, and DeepSeek-V3.2
  with thinking on solved 92% of Game of 24 in one call against 30% for ToT on the same model with thinking
  off. Its authors put the cost at 5 to 100 times the generated tokens of CoT.'
how: '1. Start from the cheap baselines on your own items: the same model in one call with thinking on
  or higher effort (1.b.i), and self-consistency or best-of-N at the same token budget (9.c.ii); consider
  a search only for the items those miss, where an early wrong step dooms the answer and partial states
  can be checked. 2. If the moves and the goal can be written down, have the model write the successor
  function and goal test in code and run plain BFS or DFS: that solved all 1,362 Game of 24 instances
  with about 2 LLM calls in total, where ToT makes about 100 calls per problem. 3. Otherwise define a
  thought as one checkable step (an equation, a SQL clause, a line of code, one derived fact), propose
  several candidates per node and keep the best b (ToT kept b = 5), scoring partial states with the most
  reliable evaluator you have: a rule or execution check first (execution feedback raised discriminator
  accuracy by up to 30.2 points), then a trained verifier, then the model''s own value or vote. Measure
  the evaluator''s ranking accuracy on labeled partial solutions before wiring it in; tree search needed
  at least 90% to beat re-ranking. 4. Use a search that can back up: depth-first or best-first with pruning
  of states rated impossible, not a fixed-depth breadth-first pass (ToT''s BFS won 9.47% of 5-number Countdown
  games against 60.00% for MCTS). Cap nodes, tokens and wall-clock, stop on the first verified solution,
  and return a fallback answer when the search ends empty. 5. Branch only where a step needs it: a cheap
  check before each expansion cut ToT beam-search output tokens by 78.3% and 78.9% on Qwen3-32B, at accuracy
  0.97 and 0.86 against 0.98 and 0.87, but on LLaMA3-8B the cuts were 37.8% to 73.4% with accuracy drops,
  so re-check accuracy on your model; run the b expansions and their evaluations in parallel. 6. Route by difficulty:
  send only the items the cheap path is unsure about to the search (a low average verifier score across
  samples served as the difficulty estimate), and re-check the need on every model upgrade, since stronger
  models gained less (best-of-N beat search at 72B). 7. Measure on held-out items with ground truth the
  search never sees: accuracy against both baselines at matched tokens, split by difficulty, plus tokens,
  LLM calls, p50 and p95 latency, and the share of searches that end without a solution.'
detect:
  static: 'A search controller: several candidate next steps per node, an evaluator that scores partial
    solutions (the model''s value or vote, a trained verifier, or a rule or execution check), breadth-first
    or beam search keeping the best b, or depth-first with backtracking, and a node or token budget. Flag
    a one-prompt imitation ("imagine three experts") presented as ToT, a model self-evaluator where a
    rule or execution check exists, a search with no fallback answer when it ends empty, and no comparison
    against self-consistency or best-of-N at equal tokens.'
  traces: Nodes expanded, depth and branching per item; pruned and backtracked branches; LLM calls, tokens
    and wall-clock per item; evaluator score of the chosen path next to the ground truth; share of searches
    that hit the budget or end without a solution.
  evals: Accuracy against the same model in one call with thinking on and against self-consistency or
    best-of-N at matched tokens, split by difficulty; evaluator ranking accuracy on labeled partial solutions;
    tokens and latency.
  judge: 'The partial-solution evaluator is the judge: check its ranking accuracy against ground truth
    before relying on it (tree search needed at least 90% to beat re-ranking).'
  probes:
    what: Puzzles with dead ends.
    construct: Tasks where the greedy first path fails and every partial state can be checked by rule
      (Game of 24, Countdown, Sudoku, constrained planning), so the evaluator's errors can be measured
      against the rule.
  primary:
  - static
  - evals
