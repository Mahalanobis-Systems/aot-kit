- source: 'Yao et al., "Tree of Thoughts: Deliberate Problem Solving with Large Language Models", https://arxiv.org/abs/2305.10601'
  date: '2023-05-17'
  task: Search over a tree of intermediate thoughts with self-evaluation, lookahead and backtracking
  effect: '"in Game of 24, while GPT-4 with chain-of-thought prompting only solved 4% of tasks, our method
    achieved a success rate of 74%". Other Game of 24 results: CoT self-consistency over 100 samples 9.0%,
    an oracle best of 100 CoT samples 49%, ToT with breadth b = 1 45% and b = 5 74%. Per case, ToT used
    5.5k completion tokens and $0.74 against 6.7k and $0.47 for 100 CoT samples; the authors say ToT "could
    require 5-100 times more generated tokens than CoT". With GPT-3.5, ToT solved 19%; GPT-4 generation
    with GPT-3.5 evaluation 64%, GPT-3.5 generation with GPT-4 evaluation 31%. Zero-shot ToT on 100 GSM8K
    and 100 StrategyQA questions scored 90 and 83 against 86 and 82 for CoT ("only slightly, given GPT-4
    + CoT is already very good").'
  conditions: Game of 24, 100 hard games (indices 901-1,000 of 1,362); GPT-4, and GPT-3.5-turbo in the
    appendix; BFS keeping the best b candidates per step, the model's own value or vote as evaluator;
    GSM8K and StrategyQA subsets of 100
  direction: supports
  locator: Abstract; §4.1, Table 2; Appendix B.1-B.3, Tables 4, 5, 7
- source: Ziru Chen, Michael White, Raymond Mooney, Ali Payani, Yu Su, Huan Sun, "When is Tree Search
    Useful for LLM Planning? It Depends on the Discriminator", https://arxiv.org/abs/2402.10890
  date: '2024-02-16'
  task: 'A generator proposes SQL queries or Python programs step by step, a discriminator scores them,
    and three planners use the scores: re-ranking complete samples, iterative correction, and tree search
    over partial programs (best partial plan expanded first, scored by Monte Carlo completions); first
    with oracle discriminators of controlled accuracy, then with LLM discriminators'
  effect: '"advanced planning methods demand discriminators with at least 90% accuracy to achieve significant
    improvements over re-ranking"; with oracle discriminators, tree search agents "consistently underperform
    the other two when the discrimination accuracy threshold" is 0.8 or below. With the best LLM discriminators,
    tree search trailed re-ranking on text-to-SQL (Spider 67.5 vs 70.3, Bird 21.7 vs 23.7) and on GSM8K
    scored 51.0 against 47.6, a difference McNemar''s test did not find significant. Tree search "is at
    least 10–20 times slower"; on Bird it took 262.8 to 405.2 seconds per example against 16.4 to 24.4
    for re-ranking. Execution feedback raised discriminator accuracy "by up to 30.2 and 8.4 absolute points"
    on text-to-SQL and math and cut tree search latency.'
  conditions: generator CodeLlama-13B-Instruct; discriminators CodeLlama-7B/13B (prompted and fine-tuned),
    GPT-3.5-Turbo, GPT-4-Turbo; Spider (400), Bird (300) and GSM8K (500, tree search on 100) dev examples
  direction: contradicts
  measured: true
  locator: Abstract; §1; §5.2; §7; Tables 3-5
- source: 'Michael Katz, Harsha Kokel, Kavitha Srinivas, Shirin Sohrabi, "Thought of Search: Planning
    with Language Models Through The Lens of Efficiency", https://arxiv.org/abs/2404.11833'
  date: '2024-04-18'
  task: Counts the LLM calls ToT and other LLM-in-the-loop search methods make on four search problems;
    instead has GPT-4 write the successor function and goal test in Python once per domain and runs plain
    BFS or DFS with them
  effect: ToT "performs ≈100 calls to the LLM" per Game of 24 problem and about 200 per crossword in the
    worst case. Projected over the datasets, ToT would make 102K calls on Game of 24 (1,362 problems),
    5K on crosswords, 201K on BlocksWorld and 600K on PrOntoQA, against 2.2, 3.8, 3.8 and 2.6 calls in
    total for the coded search, which solved every instance; BFS solved all 1,362 Game of 24 instances
    in 1.92 to 6.83 seconds. The authors call the LLM-search methods "unsound, incomplete, and quite expensive".
  conditions: GPT-4 with a human feeding back errors (1 to 2.8 interactions per function); Game of 24
    (1,362), 5x5 crosswords (20, with 10 candidate answers per clue supplied), BlocksWorld (502), PrOntoQA
    (4,000); ToT call counts are analytical estimates, not runs
  direction: contradicts
  measured: true
  locator: §4 (24 game, Mini crosswords); §5, Table 1; §6
- source: Charlie Snell, Jaehoon Lee, Kelvin Xu, Aviral Kumar, "Scaling LLM Test-Time Compute Optimally
    can be More Effective than Scaling Model Parameters", https://arxiv.org/abs/2408.03314
  date: '2024-08-06'
  task: 'Search against a process reward model: step-level beam search (BFS over steps with a value model)
    and lookahead search compared with best-of-N weighted at equal generation budgets, binned by question
    difficulty'
  effect: '"with smaller generation budgets, beam search significantly outperforms best-of-N. However,
    as the budget is scaled up, these improvements greatly diminish, with beam search often underperforming
    the best-of-N baseline." On easy questions beam search "degrades performance as the generation budget
    increases, suggesting signs of exploitation of the PRM signal"; on levels 3 and 4 it "consistently
    outperforms best-of-N"; on the hardest "no method makes much meaningful progress". Lookahead search
    "generally underperforms other methods at the same generation budget". Choosing the strategy per difficulty
    "can nearly outperform best-of-N using up to 4x less test-time compute".'
  conditions: PaLM 2-S* (Codey); PRM trained from Monte Carlo rollouts; MATH 500-question test split;
    the evaluator is a trained PRM, not the model's self-evaluation
  direction: mixed
  measured: true
  locator: §5.2-5.3; Figures 3-4
- source: Runze Liu, Junqi Gao, Jian Zhao, Kaiyan Zhang, Xiu Li, Biqing Qi, Wanli Ouyang, Bowen Zhou,
    "Can 1B LLM Surpass 405B LLM? Rethinking Compute-Optimal Test-Time Scaling", https://arxiv.org/abs/2502.06703
  date: '2025-02-10'
  task: Best-of-N, step-level beam search and diverse verifier tree search (DVTS) compared at equal budgets
    of 4 to 256 across policy models from 0.5B to 72B, several PRMs and three difficulty levels
  effect: '"For small policy models, search-based methods outperform BoN, while for large policy models,
    BoN is more effective than search-based methods." "For policy models with 72B parameters, BoN is the
    best method for all difficulty levels"; below 7B, beam search won on harder problems and BoN on easy
    ones. "BoN outperforms other strategies most of the time when using Math-Shepherd and RLHFlow PRMs";
    for Llama-3.1-8B-Instruct, search with those PRMs stayed "relatively poor, even worse than majority
    voting".'
  conditions: Qwen2.5 0.5B to 72B and Llama 3 policy models; Math-Shepherd, RLHFlow, Skywork and Qwen2.5-Math
    PRMs; MATH-500 and AIME24; beam width 4; evaluator is a trained PRM
  direction: mixed
  measured: true
  locator: §4.2-4.3; Figures 4, 7-9
- source: 'Kang He, Kaushik Roy, "LogicTree: Structured Proof Exploration for Coherent and Rigorous Logical
    Reasoning with Large Language Models", https://arxiv.org/abs/2504.14089'
  date: '2025-04-18'
