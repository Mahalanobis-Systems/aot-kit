    when: 'a reader that keeps fetched pages queryable: BrowseComp 44.5, 52.5 and 70.5% against 27.5,
      37.5 and 62.0% with snippets only and 37.5, 48.0 and 64.0% with a page summary made at fetch time
      (Liu, Aug 2026); a no-result message cut wrong answers on unanswerable questions from 64.5% to 10.5%
      for three models that obeyed it, but moved Sonnet 5.5 and Opus 5.5 abstention only from 1.4% to
