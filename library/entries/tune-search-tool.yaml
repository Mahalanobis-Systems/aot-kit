caveats: 'The reader and no-result results come from one study each: the workspace reader on a 200-question
  BrowseComp sample with three models, reporting the best of three runs, and the no-result message on
  557 Wikipedia questions with a BM25 index, where an oracle decided when to refuse; a realistic score-based
  detector at a 5% false-refusal budget recovered only part of the gain, and false refusals cost answers
  (1% to 23% of answerable episodes for budgeted detectors). The strongest models respond differently:
  Claude Sonnet 5.5 and Opus 5.5 ignored a refusal in the tool result and answered from memory but followed
  a system-prompt instruction (+16 points of abstention), and in VeRO snippets helped on SimpleQA''s training
  split but not validation. Result count and retries rest only on VeRO''s description of a stronger agent
  (five or more results with retries, against three without, alongside other differences), and the one
  search-API comparison is 100 questions with one model and one run per provider, where equal accuracy
  hid different solved questions (44 of 100 solved by at least one). The contamination result is on Perplexity''s
  Sonar agents, its URL-based detector misses leaks from other sites, and up-front query expansion was
  tested only on table retrieval with gpt-4o.'
