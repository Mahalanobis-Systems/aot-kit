    refusal instead of its top-k passages (five wordings: a bare token, an empty list, an explanation,
    the explanation plus a sentence suggesting a different query or answering unknown, or a warning above
    the usual passages), fired by an oracle or by realistic miss detectors, and compare with a system-prompt
    instruction to answer unknown'
  effect: 'Table 1, unanswerable questions, explanation refusal with an oracle trigger: abstention averaged
    over Qwen3-8B, Qwen3-32B and Claude Haiku 4.5 rose "from 24.4% to 83.7%" (32.3% with the system-prompt
    instruction alone) and "the wrong rate falls from 64.5% to 10.5%"; the abstract gives 23% to 97% for
    the two Qwen3 models and 28% to 57% for Haiku. Table 2 abstention for Qwen3-8B (NQ / HotpotQA) and
    Haiku (NQ / HotpotQA): plain tool 15.2 / 12.3 and 15.6 / 40.7; bare token 83.3 / 96.0 and 25.3 / 74.0;
    empty list 85.6 / 96.7 and 25.3 / 71.7; explanation 90.7 / 97.3 and 34.2 / 80.3; explanation plus
    next step 94.9 / 98.7 and 69.6 / 91.7; warning above the passages 20.6 / 16.0 and 17.5 / 41.3. Claude
    Sonnet 5.5 and Opus 5.5 moved from 1.4% to 3.2% abstention under the refusal but to 17.3% with the
    system-prompt instruction, and were right from memory on 39% of unanswerable questions; Search-R1
    abstained in under 1% of episodes under the explanation refusal and searched more (2.86 to 4.60 calls
    on NQ). Searches were mostly unchanged but rose from 1.38 to 4.12 for Qwen3-8B on HotpotQA. A BM25-score
    detector held to a 5% false-refusal budget refused on 16% and 37% of unanswerable questions (NQ, HotpotQA)
    and raised abstention 69% and 109% relative to the plain tool; budgeted triggers produced false refusals
    on 1% to 23% of answerable episodes, and "each false refusal costs the answer".'
  conditions: 'Seven frozen agents: Qwen3-8B and Qwen3-32B (thinking off, greedy), Claude Haiku 4.5, Sonnet
