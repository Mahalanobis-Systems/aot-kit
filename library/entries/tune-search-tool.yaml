# 8.b.i: Tune the search tool: snippets, enough results, retries, reformulation, filters, source quality
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 8.b.i
legacy_id: T34
slug: tune-search-tool
name: 'Tune the search tool: snippets, enough results, retries, reformulation, filters, source quality'
kind: technique
status: card
tiers:
- tier: 2
  why: retries recover failed searches
- tier: 3
  why: everything else changes what the model retrieves and sees
levers:
- knowledge-access
domains:
- retrieval
- web-research
evidence_domains:
- web-research
- data-analysis
categories:
- retrieval.query
- retrieval.results
summary: Make the search tool return what the model needs to choose what to open (a snippet per result,
  not just titles; five or more results; a full-document reader beside truncated search), retry failed
  searches, and reformulate when a query returns little (start broad, then narrow; use the corpus's own
  terms) rather than retrying it verbatim. Expose the source's metadata as filter parameters (date, product,
  version, source) where the corpus has it. Drop results from sources that leak the answer or are untrustworthy.
  Expanding one question into many queries up front has not helped.
how: 1. From traces, count fetches per question, empty-result queries, and repeats of the same query.
  2. Change one parameter at a time (snippets, result count, retries, filters). 3. Paired eval scored
  on retrieval recall and answer accuracy.
detect:
  static: a search tool returning titles or URLs only; a fixed small result count; no retry; no filter
    parameters over a corpus with metadata; results passed to the model unfiltered
  traces: many page fetches per question; queries returning zero results followed by the same query or
    by giving up; results from the wrong product, version or date; failure rows labeled missed-read
  evals: retrieval recall below answer accuracy needs; failures where the answer was in an unfetched result
impact:
  quality:
