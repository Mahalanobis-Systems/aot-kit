caveats: 'Each design result comes from one study, most by the method''s authors or vendor: the per-result
  snippet harness (one run per question on closed corpora) bundles reranking, snippet selection, a different
  reader and deduplication, and its one isolating ablation is a single open model; the code-filtering
  gains are Anthropic''s test of its own tool with no run counts and higher price-weighted cost for Opus
  4.6; the workspace reader reports the best of three runs on 200 BrowseComp questions; and the no-result
  message used an oracle trigger on 557 Wikipedia questions, where a realistic detector recovered only
  part of the gain. The strongest models respond differently: Claude Sonnet 5.5 and Opus 5.5 ignored a
  refusal in the tool result but followed a system-prompt instruction (+16 points of abstention), and
  in VeRO snippets helped on SimpleQA''s training split but not validation. Result count and retries rest
  only on VeRO''s description of a stronger agent (five or more results with retries, against three without,
  alongside other differences), the one search-API comparison is 100 questions with one model and one
  run per provider, and latency is unmeasured. The poisoning and blocklist result is on open deep-research
  agents running GPT-4o-mini, where the blocklist worked by dropping all forum content and quality was
  scored by an insensitive rubric; the contamination results are Perplexity''s Sonar agents and one Anthropic
  run of Opus 4.6; and up-front query expansion was tested only on table retrieval with gpt-4o.'
