measure:
- method: experiment
  tier: 3
  how: paired runs on the same questions and model, the current search tool against one change at a time
    (a snippet and metadata per result, the best-matching segment of each result instead of its opening,
    suppression of repeated snippets, result count, a page reader that keeps fetched pages, code filtering
    of results where the model can run code, an explicit no-result message, retries and reformulation
    prompts, source filters including a block on pages anyone can edit); report answer accuracy, whether
    an answer-bearing result was returned, opened and used, searches and page opens per question, tokens
    returned per search and per question, price-weighted cost, and abstention against wrong answers on
    questions whose documents were removed from the index; when comparing search APIs, compare solved
    questions one by one, not only accuracy; for a source filter, plant a short promotional passage in
    one often-retrieved forum page and count the runs and reports it reaches with and without the filter
- method: monitor
  how: 'in production traces: searches returning nothing useful and what followed (the same query, a reformulation,
    giving up or answering anyway); near-identical consecutive queries; answers given without opening
    any result; tokens returned per search and per question; snippets returned again in later searches;
    pages fetched more than once; results from the wrong product, version or date; the share of results
    and citations from pages anyone can edit, and single such pages cited across many questions; false
    refusals if the tool can refuse; in evals with web search, results from hosts of the eval''s data
    and retrieved text that contains the eval''s name or questions'
