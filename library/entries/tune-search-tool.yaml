summary: 'Make the search tool show the agent enough to choose what to open, give it a reader that keeps
  the pages it opens, and have the tool say plainly when it found nothing. Return per result its source
  metadata and the part that matches the query (not the page''s opening), five or more results, and a
  short reference in place of a snippet already shown; retry failed searches and reformulate thin ones;
  expose metadata filters; let a model that can run code filter results before they enter its context;
  and drop sources that leak the answer, are untrustworthy or can be edited by anyone. Expanding one question
  into many queries up front has not helped. In single studies, query-matched snippets with repeats suppressed
  reached 94.94% on BrowseComp-Plus with GPT-5.4 against 84.70% for passage openings (3,365 against 26,316
  tokens per search, though with more searches), filtering results in code raised BrowseComp from 45.3%
  to 61.6% for Claude Opus 4.6 (the vendor''s own test), a reader that saves fetched pages beat snippets
  alone by 8.5 to 17 points, and a plain "no reliable results" message raised abstention on unanswerable
  questions from 23% to 97% for two Qwen3 models. The limits: most gains come from the method''s authors
  or vendor, Claude Sonnet 5.5 and Opus 5.5 ignored the no-result message, 13 words planted on one often-retrieved
  Reddit page turned up in 38% to 51% of the reports that saw it, and the effects of result count and
  retries are unmeasured.'
how: '1. Start from the search tool as it is: from traces, count per question the searches, page opens,
  near-identical repeated queries, and searches that returned nothing useful together with what followed
  (the same query, a reformulation, giving up, or an answer anyway); count answers given without opening
  any result and wrong answers whose answer text was visible in a returned snippet or page (53 to 57 of
  100 questions in one comparison of three search APIs, by string match); measure the tokens each search
  call returns and the tokens search results take per question; and count the results and citations that
  come from pages anyone can edit (forums, wikis, video pages). 2. Return results the agent can choose
  from: a title, URL, source and date metadata and a snippet per result, not just titles or URLs, and
  enough results to choose among (VeRO''s stronger agent used five or more results with retries, its weaker
  one three without; no study here isolates the count). Make each snippet the part of the result that
  matches the query, not its opening lines, and replace a snippet the agent has already seen with a short
  reference to it: in one harness comparison on BrowseComp-Plus with GPT-5.4, ten reranked passages per
  query, each shown as its best-matching segment with repeats replaced, reached 94.94% against 91.45%
  for 180-character query-biased snippets and 84.70% for 512-token passage openings, returning 3,365 tokens
  per search against 3,690 and 26,316 but searching more (16.8 searches per question against 12.1 and
  4.5); with search as the only tool, adding reranking and per-passage snippet selection to plain dense
  retrieval raised one open model from 62.61% to 70.84%. Snippet size trades page opens for tokens: under
  the same agent, the search API with the richest snippets (a median 7,810 tokens of results per question,
  against 2,704 for the leanest) showed answer-bearing snippets on 30 of 100 questions against 16 and
  opened pages on 65% of questions against 81%, at the same accuracy; in VeRO, adding snippets raised
  SimpleQA training accuracy but not validation. 3. Put a page reader beside search, and keep what it
  fetches: a fetch tool that saves the full page to a per-question workspace and returns only its path
  and size, with grep and bounded line reads across every saved page, beat a snippets-only agent (BrowseComp
  44.5, 52.5 and 70.5% against 27.5, 37.5 and 62.0% on three models), a visit tool returning a goal-focused
  summary made at fetch time (37.5, 48.0 and 64.0%) and a one-page-at-a-time browser (42.0, 50.5 and 66.0%),
  and it searched less than the snippets-only agent (58 to 67 searches per question against 70 to 101);
  confining grep to one page at a time cost 5 points on one model. A lighter form is a read tool that
  expands the text around a result the agent already has instead of running a new search (in the snippet
  harness above, this with repeat suppression added 9.28 points, 70.84% to 80.12%, on one open model).
  Where the model can run code, let it filter search and fetch results in code before they enter its context:
  Anthropic reports BrowseComp rising from 33.3% to 46.6% for Claude Sonnet 4.6 and from 45.3% to 61.6%
  for Opus 4.6, and DeepSearchQA F1 from 52.6 to 59.4 and 69.8 to 77.3, with 24% fewer input tokens on
  average, but price-weighted tokens rose for Opus 4.6 (the vendor''s own test of its own tool). If you
  keep a visit tool that returns one reading of the page, a summary beat a goal-focused chunk on every
  model. How much of a page each read returns is 2.c.i. 4. Make a failed search visible: when nothing
  reliable matches, return a short message instead of the usual top-k irrelevant passages, saying so and
  what to do next (for example "No reliable results were found for this query. The index may not contain
  the information needed.", then try a different query or answer unknown). In one study this raised abstention
  on unanswerable questions from 23% to 97% for Qwen3-8B and Qwen3-32B and from 28% to 57% for Claude
  Haiku 4.5 (80.7% with the "what to do next" sentence), cutting wrong answers almost one for one, while
  a warning placed above the usual passages barely helped. Claude Sonnet 5.5 and Opus 5.5 ignored the
  message and answered from memory but followed a system-prompt instruction to answer unknown without
  evidence (abstention +16 points), so state it in the system prompt too. The tool needs a miss detector:
  a score-based one held to 5% false refusals delivered only part of the gain, and every false refusal
  on an answerable question costs that answer. 5. Retry a search that errored (transient failures, per
  2.b.i), and when a query returns little, reformulate rather than repeat it: prompt the agent to start
  with short, broad queries and then narrow (Anthropic''s research agents defaulted to overly long, specific
  queries that returned few results; unmeasured), and let it write its own targeted queries in the corpus''s
  terms (removing an agent-written schema-retrieval action cost 6.7 to 7.6 points of schema recall in
  one study; large schemas are 8.b.ii). Do not expand the question into many queries up front: a query
  planner lowered recall, and its sub-tasks used as query expansion did not raise table recall (gpt-4o).
  6. Filter sources: expose the corpus''s metadata (date, domain, product, version, source) as filter
  parameters, and drop results from untrustworthy sources or sources that leak the answer (source filtering
  gained 3.3% on FACTS in VeRO). Treat pages anyone can edit as untrusted: in one study of open deep-research
  agents (GPT-4o-mini), 13 words appended to the search snippet of one often-retrieved Reddit page reached
  the agent in 57% to 76% of runs and were mentioned in 38% to 51% of the reports where they were seen;
  blocking eight such domains at the search tool removed the exposure at a small measured cost (14.9 to
  12.9 citations per report, rubric score 4.30 to 4.26) but drops genuine community content and misses
  other writable sites, perplexity filters failed because the planted text was more fluent than real posts,
  and an LLM screen of each forum result would add 7% to 11% more model calls (33% to 61% for every result).
  Injection defenses in general are 10.c.i. In evals with web search, block hosts of the eval''s own data
  and drop retrieved text that contains the eval''s name or questions: search agents found HLE, SimpleQA
  and GPQA items with their answers on HuggingFace for 0.99% to 4.15% of questions, and blocking HuggingFace
  cut accuracy on those questions by about 15%; in Anthropic''s BrowseComp run, Claude Opus 4.6 took 11
  of 1,266 answers from benchmark materials (two by identifying the benchmark and decrypting its answer
  key), got around URL blocklists, and blocking any result that mentioned "BrowseComp" worked best (re-run
  with a blocklist, 8 of the 11 were solved legitimately, 86.81% to 86.57%). 7. Change one thing at a
  time and run paired evals on the same questions and model, scoring answer accuracy, whether an answer-bearing
  result was returned, opened and used, searches and page opens per question, tokens returned per search
  and per question, price-weighted cost, and wrong rather than unknown answers on questions the corpus
  cannot answer; when comparing search APIs, compare solved questions one by one, since three providers
  at 25 to 26 of 100 solved different questions (44 of 100 solved by at least one).'
detect:
  static: a search tool returning titles or URLs only; snippets cut from the start of each result rather
    than the part matching the query; a fixed small result count; no page reader beside search, or a reader
    that injects one fixed reading of the page that cannot be queried again; a tool that always returns
    its top-k even when nothing matches; no retry; no filter parameters over a corpus with metadata; results
    passed to the model unfiltered, including from hosts of eval datasets and from pages anyone can edit
  traces: many page fetches per question, or the same page fetched again; the same snippet returned in
    several searches; queries returning zero or irrelevant results followed by the same query, by giving
    up or by an answer anyway; near-identical consecutive queries; answers given without opening any result,
    or wrong answers whose answer text was visible in a returned snippet or page; results from the wrong
    product, version or date; one forum or wiki page cited across many unrelated questions; results from
    dataset hosts or pages containing the eval question or the eval's name; failure rows labeled missed-read
  evals: retrieval recall below what answer accuracy needs; failures where the answer was in an unfetched
    result; wrong rather than unknown answers on questions the corpus cannot answer
  probes:
    what: Questions whose answer-bearing documents have been removed from the index, and, for evals with
      web search, questions whose answers are published online.
    construct: Run each question twice, with its answer-bearing documents in the index and with them filtered
      out of every search result; pass when the agent answers unknown or reports it could not find the
      answer on the filtered runs without losing accuracy on the intact ones. For evals, check every retrieved
      page for the eval question's text and re-run the flagged questions with those sources blocked.
