summary: 'Make the search tool show the agent enough to choose what to open, give it a reader that keeps
  the pages it opens, and have the tool say plainly when it found nothing. Return a snippet and source
  metadata per result and five or more results, retry failed searches and reformulate thin ones (start
  broad, then narrow; use the corpus''s own terms) rather than repeating them, expose the source''s metadata
  as filters, and drop sources that leak the answer or are untrustworthy; expanding one question into
  many queries up front has not helped. In single studies, a reader that saves fetched pages to a workspace
  the agent can grep beat snippets alone by 8.5 to 17 points on BrowseComp across three models, a plain
  "no reliable results" message raised abstention on unanswerable questions from 23% to 97% for two Qwen3
  models, and blocking the site where search agents found benchmark answers cut their accuracy on those
  questions by about 15%. The limits: Claude Sonnet 5.5 and Opus 5.5 ignored the no-result message, three
  commercial search APIs gave the same accuracy while solving different questions, and the effects of
  result count and retries are unmeasured.'
how: '1. Start from the search tool as it is: from traces, count per question the searches, page opens,
  near-identical repeated queries, and searches that returned nothing useful together with what followed
  (the same query, a reformulation, giving up, or an answer anyway); count answers given without opening
  any result and wrong answers whose answer text was visible in a returned snippet or page (53 to 57 of
  100 questions in one comparison of three search APIs, by string match); and measure the tokens search
  results take per question. 2. Return results the agent can choose from: a title, URL, source and date
  metadata and a snippet per result, not just titles or URLs, and enough results to choose among (VeRO''s
  stronger agent used five or more results with retries, its weaker one three without; no study here isolates
  the count). Snippet size trades page opens for tokens: under the same agent, the search API with the
  richest snippets (a median 7,810 tokens of results per question, against 2,704 for the leanest) showed
  answer-bearing snippets on 30 of 100 questions against 16 and opened pages on 65% of questions against
  81%, at the same accuracy; in VeRO, adding snippets raised SimpleQA training accuracy but not validation.
  3. Put a page reader beside search, and keep what it fetches: a fetch tool that saves the full page
  to a per-question workspace and returns only its path and size, with grep and bounded line reads across
  every saved page, beat a snippets-only agent (BrowseComp 44.5, 52.5 and 70.5% against 27.5, 37.5 and
  62.0% on three models), a visit tool returning a goal-focused summary made at fetch time (37.5, 48.0
  and 64.0%) and a one-page-at-a-time browser (42.0, 50.5 and 66.0%), and it searched less than the snippets-only
  agent (58 to 67 searches per question against 70 to 101); confining grep to one page at a time cost
  5 points on one model. If you keep a visit tool that returns one reading of the page, a summary beat
  a goal-focused chunk on every model. How much of a page each read returns is 2.c.i. 4. Make a failed
  search visible: when nothing reliable matches, return a short message instead of the usual top-k irrelevant
  passages, saying so and what to do next (for example "No reliable results were found for this query.
  The index may not contain the information needed.", then try a different query or answer unknown). In
  one study this raised abstention on unanswerable questions from 23% to 97% for Qwen3-8B and Qwen3-32B
  and from 28% to 57% for Claude Haiku 4.5 (80.7% with the "what to do next" sentence), cutting wrong
  answers almost one for one, while a warning placed above the usual passages barely helped. Claude Sonnet
  5.5 and Opus 5.5 ignored the message and answered from memory but followed a system-prompt instruction
  to answer unknown without evidence (abstention +16 points), so state it in the system prompt too. The
  tool needs a miss detector: a score-based one held to 5% false refusals delivered only part of the gain,
  and every false refusal on an answerable question costs that answer. 5. Retry a search that errored
  (transient failures, per 2.b.i), and when a query returns little, reformulate rather than repeat it:
  prompt the agent to start with short, broad queries and then narrow (Anthropic''s research agents defaulted
  to overly long, specific queries that returned few results; unmeasured), and let it write its own targeted
  queries in the corpus''s terms (removing an agent-written schema-retrieval action cost 6.7 to 7.6 points
  of schema recall in one study; large schemas are 8.b.ii). Do not expand the question into many queries
  up front: a query planner lowered recall, and its sub-tasks used as query expansion did not raise table
  recall (gpt-4o). 6. Filter sources: expose the corpus''s metadata (date, domain, product, version, source)
  as filter parameters, and drop results from untrustworthy sources or sources that leak the answer (source
  filtering gained 3.3% on FACTS in VeRO). In evals with web search, block hosts of the eval''s own data
  and check retrieved text for the eval''s questions: search agents found HLE, SimpleQA and GPQA items
  with their answers on HuggingFace for 0.99% to 4.15% of questions, and blocking HuggingFace cut accuracy
  on those questions by about 15%; a URL blocklist alone is not enough, since other sites also carry the
  questions. 7. Change one thing at a time and run paired evals on the same questions and model, scoring
  answer accuracy, whether an answer-bearing result was returned, opened and used, searches and page opens
  per question, tokens per question, and wrong rather than unknown answers on questions the corpus cannot
  answer; when comparing search APIs, compare solved questions one by one, since three providers at 25
  to 26 of 100 solved different questions (44 of 100 solved by at least one).'
detect:
  static: a search tool returning titles or URLs only; a fixed small result count; no page reader beside
    search, or a reader that injects one fixed reading of the page that cannot be queried again; a tool
    that always returns its top-k even when nothing matches; no retry; no filter parameters over a corpus
    with metadata; results passed to the model unfiltered, including from hosts of eval datasets
  traces: many page fetches per question, or the same page fetched again; queries returning zero or irrelevant
    results followed by the same query, by giving up or by an answer anyway; near-identical consecutive
    queries; answers given without opening any result, or wrong answers whose answer text was visible
    in a returned snippet or page; results from the wrong product, version or date; results from dataset
    hosts or pages containing the eval question; failure rows labeled missed-read
  evals: retrieval recall below what answer accuracy needs; failures where the answer was in an unfetched
    result; wrong rather than unknown answers on questions the corpus cannot answer
  probes:
    what: Questions whose answer-bearing documents have been removed from the index, and, for evals with
      web search, questions whose answers are published online.
    construct: Run each question twice, with its answer-bearing documents in the index and with them filtered
      out of every search result; pass when the agent answers unknown or reports it could not find the
      answer on the filtered runs without losing accuracy on the intact ones. For evals, check every retrieved
      page for the eval question's text and re-run the flagged questions with those sources blocked.
impact:
