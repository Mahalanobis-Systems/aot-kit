caveats: 'No study tests Manus-style serialization noise on an agent end to end: the history changes tested
  on current agents moved success by about two points (outcome labels 46.39% to 48.25%, a caution reminder
  48.60%, one run each), cutting repeats did not reliably raise success (self-written lesson notes, a
  description of the failed call), and clearing old history helped 8B models and GPT-4o-mini on mostly
  text games and puzzles, with settings tuned per method, while keeping only the last three steps cost
  five current models 10.4 points. Stronger models are less affected but not immune: GPT-5.6-Sol repeated
  a twice-repeated action 8.70% of the time (46 histories) against 51.36% for Qwen3-8B, thinking models
  did not self-condition on errors in their history, larger models copied a failed call less, and seven
  current search agents including Opus 5 still switched strategy 3.6-17.4 points less after a dead-end
  history; the batch-grading study used open-weight models up to 32B, and on easy items batching changed
  only 2.9-3.9% of decisions. Variation is not free: equivalent formats moved accuracy by up to 76 points,
  mixing formats lost on some task-model pairs, Google advises identical formatting across examples, a
  batch-judging study found contrast between neighbors rather than imitation, and varying entries already
  in the history breaks the append-only, cache-stable context, so vary only new entries, deterministically.'
