measure:
- method: experiment
  tier: 3
  how: 'paired runs on one batch of near-identical items with an outlier planted late (position 15 of
    20), each item also run alone as the reference: uniform template against varied templates, phrasing
    and order (and against per-item contexts); accuracy and outlier detection by position, decision flip
    rate against the single-item runs, exact-repeat rate of actions, output-format errors, tokens and
    cache hit rate; repeat over at least three template sets and report the spread, per model'
- method: monitor
