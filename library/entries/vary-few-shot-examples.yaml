caveats: 'No study tests Manus-style serialization noise on an agent end to end: the measured support
  is for the mechanism (models copy what repeats in their context) and for diverse few-shot examples,
  often on small or older models (135M-1.7B for the failed-call study, Codex for the demonstration study).
  Variation is not free: equivalent formats moved accuracy by up to 76 points, mixing formats lost on
  some task-model pairs, Google advises identical formatting across examples, and a serialization fix
  that cut repeats did not raise task success. The effect depends on the model and task: thinking models
  did not self-condition on errors in their history, larger models copied a failed call less, and a batch-judging
  study found contrast between neighbors rather than imitation. Varying entries already in the history
  also breaks the append-only, cache-stable context, so vary only new entries, deterministically.'
