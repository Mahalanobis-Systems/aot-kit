- source: 'Esmail Gumaan, "Feedback That Backfires: Why Small Language Model Agents Repeat the Call They
    Just Watched Fail", https://arxiv.org/abs/2608.23651'
  date: '2026-08-24'
  task: 'Measure whether a failed tool call kept verbatim in the transcript makes the agent repeat it,
    and compare harnesses that change only how the failure is serialized: the verbatim call plus error,
    a runtime-generated description instead of the call, the failed step deleted (clean retry), an added
    "do not repeat" instruction, and a decoder ban on previously failed strings'
  effect: 'For every model "the normalised probability of repeating the failed call rises from 0.06 to
    0.54", and greedy decoding repeated it token for token on 19% of items against 0% before. "The failed
    call''s surface form accounts for 83% of the damage." A description instead of the call "removes 76%
    of the inversion at no token cost"; the instruction left it where it was, and deleting the failed
    step was "the worst harness we measured for repetition". The authors'' rule: "the context after a
    failure must differ from the context before it, and the difference must not be the failed action."
    In end-to-end rollouts the description cut exact repeats from 31% to 16% (paired difference -14 [-32,
    +2] points) and the decoder ban to 8%, but "Neither surface-form intervention improves task success":
    success went from 0.42 to 0.33 with the description. Within a family, "Larger models copy less".'
  conditions: 6 instruction-tuned checkpoints of 135M-1.7B (Llama-3.2, Qwen2.5, Qwen3, SmolLM2); the authors'
    simulated tool-calling environment and MBPP program repair; rollouts on 24 tasks with Qwen2.5-0.5B
    and greedy decoding; frontier-scale models untested
  direction: mixed
  measured: true
  locator: Abstract; §1; §6.4; §7; §8.3 Table 8; §11
- source: 'Akshit Sinha, Arvindh Arun, Shashwat Goel, Steffen Staab, Jonas Geiping, "The Illusion of Diminishing
    Returns: Measuring Long Horizon Execution in LLMs", https://arxiv.org/abs/2509.09677'
  date: '2025-09-11'
  task: Inject a controlled rate of errors into the model's own prior turns of a long, simple execution
    task (look up values in an in-context dictionary and keep a running sum) and measure accuracy at a
    later turn
  effect: '"as we increase the rate of injected errors into the context, accuracy at turn 100 consistently
    degrades further"; the authors tie this to in-context learning, since here "the model conditions on
    its own past behaviour, which could be wrong". Large non-thinking models "remain susceptible to self-conditioning".
    "Qwen3 models with thinking enabled no longer self-condition, even when the entire prior history has
    wrong answers." Keeping only recent turns "reduces the self-conditioning effect, but relies on the
    Markovian nature of our task", and "Self-verification does not fix self-conditioning". Results are
    in figures.'
  conditions: Synthetic key-value running-sum task, 100 samples per setting; Qwen3 4-32B and Gemma3 4-27B,
    with Kimi-K2, DeepSeek-V3 and Qwen3-235B-Instruct-2507 for scale; the errors in history are injected,
    and the tested fix shrinks history rather than varying it
  direction: mixed
  measured: true
  locator: §3.2 Results 3-5, Figures 5-6; Appendix C, Figures 9-10
- source: Gilberto Sussumu Hida, Danilo Monteiro Ribeiro, Clayton Suguio Hida, "Class Imbalance and Batch
    Effects in LLM-Based Screening for Systematic Reviews", https://arxiv.org/abs/2608.14737
  date: '2026-08-13'
  task: Screen studies for systematic reviews one per call, against the same studies shuffled into batches
    of 20 in one prompt, with and without a sentence giving the expected inclusion rate
  effect: For Llama, batching changed the decision on 5.6% (rsl_1) to 26.7% (rsl_4) of studies, significant
    by McNemar (p < 0.001) in all five reviews; for GPT-5-mini 1.3% to 14.0%, significant in four of five
    (mean flip rate 0.160 for Llama against 0.057). Batching made Llama more inclusive in the four reviews
    with prevalence of 20% or less (net shift +3.5 to +10.5 points) and more restrictive in the balanced
    one (-25.3), which the authors read as "a possible tendency toward implicit normalization of decisions
    within the batch". F2 changes ranged from -0.101 to +0.096; in one review F2 rose from 0.37 to 0.46
    while at item level "29 studies improved and 85 worsened". Stating the expected inclusion rate did
    not correct the shift in the balanced review for either model.
  conditions: Llama-3.3-70B-Instruct-Turbo and GPT-5-mini; five software-engineering reviews from SESR-Eval
    (prevalence 2.9% to 53%); one batch arrangement and one run per condition; compares batching with
    one study per call (isolation), not varied serialization
  direction: mixed
  measured: true
  locator: §3.3; §4.3 RQ2; §4.4 Table 2; §4.5 RQ4; §5
- source: 'Tianxi Li, Jie Ding, "Trustworthy Method Comparison with AI Judges: Estimation and Design under
    Order, Batch, and Aggregation Effects", https://arxiv.org/abs/2610.07755'
  date: '2026-10-06'
  task: Three LLM judges each rate the same 30 research proposals accept or reject, all 30 in one context,
    in 200 randomly shuffled orders; model how each rating depends on the ratings before it
  effect: Gemini 2.5 Flash accepted an item 73.0% of the time right after a rejection and 66.6% after
    an acceptance, a difference of -6.4% (95% interval [-8.9%, -3.9%]). "The lag-1 contrast is negative
    and supported by the bootstrap for all three judges, indicating that an acceptance lowers the probability
    of a subsequent acceptance"; GPT-5.4-mini also showed a lag-3 effect and Claude Haiku 4.5 significant
    negative contrasts at all three lags. The dependence is contrast between neighbors, not imitation.
    The authors "recommend GLMM inference with a random-shuffle batch design".
  conditions: Gemini 2.5 Flash, GPT-5.4-mini, Claude Haiku 4.5; 6,000 binary ratings per judge plus 100
    new shuffled batches for out-of-sample checks; one pool of 30 items
  direction: mixed
  measured: true
  locator: §2 (Figures 1-2); §2.3; §7
- source: 'Bowei He, Weixu Zhang, Yili Jin, Xue Liu, "Beneath the Diff: Diagnosing and Mitigating Algorithmic
    Mode Collapse in Code-Level Autonomous Research Loops", https://arxiv.org/abs/2609.00077'
  date: '2026-08-31'
  task: Track the diversity of an autonomous research agent's accepted code edits over hundreds of iterations,
    then add diversity-aware proposal sampling (reweighting toward under-used edit types, a memory that
    rejects proposals too similar to recently accepted ones, and an audit-based revert gate), compared
    with raising the proposer's temperature from 0.7 to 1.2
  effect: '"surface-level edit diversity remains stable, but semantic and mechanism-level diversity collapse:
    the agent continues to edit different lines of code while repeatedly proposing the same kinds of algorithmic
    changes", and in-loop gains do not transfer (audited faithfulness 0.38-0.49). Higher temperature gave
    0.43, 0.49, 0.40 and 0.51 against 0.41, 0.46, 0.38 and 0.49: "raising temperature is not a remedy".
    The two diversity components alone raised average faithfulness from 0.44 to 0.71 and cut semantic-cluster
    decay from 0.68 to 0.28 at 0.986 of the in-loop gain; the full method reached 0.74-0.82.'
  conditions: Claude Opus 4.7 proposer (GPT-5.2 and Llama-3.3-70B in robustness runs); four single-GPU
    tasks (small-LM pretraining, instruction tuning, GSM8K tuning, prompt optimization); 300 iterations,
    3 seeds (5 for one task); autoresearch fork and Aider. The authors' "self-imitation through history
    conditioning" is part of a conceptual model, not isolated; the fix acts on proposal sampling, not
    on how history is serialized
  direction: supports
  measured: true
  locator: Abstract; §4.2 Table 2; §4.5 Table 5; Appendix A (F3)
- source: Lilian Ngweta, Kiran Kate, Jason Tsay, Yara Rizk, "Towards LLMs Robustness to Changes in Prompt
