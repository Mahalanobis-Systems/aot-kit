- source: 'Peng Xie, Amr Alanwar (Technical University of Munich), "Judged in Company: In-Context Batching
    Makes LLM Verdicts Depend on Other Items", https://arxiv.org/abs/2610.40241'
  date: '2026-10-29'
  task: Grade the same 2,000 items per task alone and in three independent random partitions into batches
    of 25 (one JSON verdict per item), plus conditions that change only the order of an item's neighbors,
    its slot or which items share its batch, against renamed item keys, a reworded instruction and one-at-a-time
    generation as baselines; then vote over up to nine orders of a batch or fifteen independent batches,
    vary the batch size (5, 10, 50), and edit single generations to swap in another batch's earlier verdicts
    or neighbor texts
  effect: On harm and short-answer grading, a new random partition changed 11-22% of decisions for five
    4-9B models, 6.5-13.3 points more than renaming the item keys or rewording the instruction, while
    AUROC against human labels moved only -0.033 to +0.010; for four 14-32B models 6-15% changed, 4.2-9.1
    points above the largest baseline. Majority votes over three, five and nine orders of a batch left
    71-76%, 60-69% and 52-60% of the flips at three, five and nine times the cost, and the majority of
    fifteen independent batches still disagreed with single-item grading on 8.4-17.8% of decisions. With
    five items per prompt 9-16% of decisions already differed from single-item grading, with fifty 12-23%.
    Swapping in another batch's earlier verdicts changed 7-23% of target decisions and its neighbors'
    texts 9-26%; shuffling the model's own earlier verdicts changed 5-19%. On easy star ratings only 2.9-3.9%
    of decisions changed. In an earlier sample, Gemma-4 flagged 58% of comments targeting a race when
    graded alone and 35% in batches (point estimates). The authors "recommend grading ambiguous items
    one per prompt, recovering most of the cost with a cached prefix, and reporting agreement with single-item
    grading whenever items are batched"; with cache reads billed at a fraction c of the input price, isolation
    adds c(1-1/k) times the shared prefix per item over a cached batch of k.
  conditions: Qwen3-4B-Instruct-2507, Qwen3-8B (thinking off), Gemma-4-E4B-it, Granite-3.3-8B-Instruct,
    GLM-4-9B-0414, and Qwen3-14B/32B (thinking off), Gemma-4-31B-it and GLM-4-32B-0414 on harm and grading
    only; greedy decoding; Measuring Hate Speech, SciEntsBank and Yelp reviews, 2,000 items each; one
    prompt template with one rewording; a closed moderation model (batches of 16) in an appendix; no frontier
    API models; varies batch membership and order, not serialization templates
  direction: supports
  measured: true
  locator: Abstract; §1; §5.1 Table 2; §5.2 Table 3; §5.4; §5.5; §5.6; §6; Appendix F; Appendix G; Appendix
    J
- source: 'Jingyu Liu, Zhiwen Wang, Yuxin Jing, Huanyu Zhou, Yong Liu (Renmin University of China, ByteDance),
    "When History Fails to Become Experience: Action Calibration in Language Agents", https://arxiv.org/abs/2610.02769'
  date: '2026-10-02'
  task: 'Change only how an agent''s history is rendered, in full rollouts from the initial state: raw
    history; only the last three steps; observations without past actions; past actions shuffled among
    earlier positions (all, or only those older than the last three); each observation labeled as the
    outcome of the preceding action; a "History caution" reminder in the prompt; and agent-written experience
    notes kept in the history. Also measure, on 1,815 fixed histories ending in two identical actions
    whose feedback does not support a third, how often the agent repeats the action'
  effect: 'Pooled success over 10,000 episodes per condition: raw 46.39%, last three steps only 35.99%,
    observations only 40.93%, all actions shuffled 43.84%, older actions shuffled 46.75%, outcome labels
    48.25%, reminder 48.60%, experience notes 45.01%; "Shuffle-All retains most of Raw''s performance,
    with an overall decrease of only 2.55 percentage points". Third repeats: raw 36.91%, outcome labels
    32.23%, experience notes 21.38%, but for the notes "this reduction in repetition does not translate
    into improved task success". GPT-5.6-Sol went from 73.30% to 74.30% with labels and repeated 8.70%
    of the time raw, against 51.36% for Qwen3-8B. With separate user and assistant messages (2,000 episodes
    per condition): raw 46.00%, labels 47.75%, all actions shuffled 43.50%. Adding a recorded later segment
    of the same failed trajectory as reference lowered recovery from 15.8% to 11.4%. The reminder reads
    in part: "Repetition is not evidence of correctness."'
  conditions: GPT-5.6-Sol, DeepSeek-V4-Pro, Qwen3.5-Plus, Qwen3-32B, Qwen3-8B; ALFWorld, ScienceWorld,
    WebShop, AppWorld; 500 tasks per model-environment cell, up to 30 actions; history rendered as one
    block of observations and actions without intermediate reasoning (separate chat messages in an appendix);
    one run per condition, no significance tests; the repetition probe was screened by GPT-5.6-Sol; the
    authors' trained calibrator is their own method and not cited here
  direction: mixed
  measured: true
  locator: Abstract; §3; §4 Table 2; §5.1-5.2 (Figures 4-5); Appendix B.1 Table 3; Appendix C Table 4;
    Appendix D.1 Table 5; Appendix F
- source: Yang Wan, Zheng Cao, Zhenhao Zhang, Zhengwen Zeng, Shuheng Shen, Changhua Meng, Linchao Zhu
    (Zhejiang University, University of Rochester, Ant Group), "Mitigating Conversational Inertia in Multi-Turn
    Agents", https://arxiv.org/abs/2602.03664
  date: '2026-02-03'
  task: 'Measure how much an agent''s current response attends to its own earlier responses as a multi-turn
    context grows, then compare inference-time context management on the same agents: the full history
    (Long), a sliding window of the last rounds, Clip (once the history reaches H rounds, cut it back
    to the last L rounds, so each cycle keeps a stable, cacheable prefix) and Clip plus summaries of the
    cleared rounds; plus a fine-tuning method (Context Preference Learning)'
  effect: '"LLMs erroneously mimic their own previous responses as few-shot examples": attention to previous
    assistant responses "grows monotonically with context length, while attention to user inputs remains
    relatively stable". Eight-environment average success, Long / Window / Summarization / Clip: Qwen3-8B
    54.4 / 64.9 / 68.8 / 68.9; Llama3.1-8B 48.3 / 58.6 / 57.9 / 59.2; GPT-4o-mini 64.6 / 66.0 / 67.5 /
    71.1. Clipping cut diagonal attention to earlier responses by 7%, and "reduced inertia from clipping
    context plays a major role in summarization methods'' performance gains, rather than the generated
    summarization". Clip "achieves 2-7x prefill speedup over window methods", which cannot reuse the prefix
    cache. Cutting back to one round at 12 scored 68.9 against 60.7 when keeping 11 (Qwen3-8B). On BrowseComp
    (128 cases, two runs) Clip-12to6 scored 29.3 against 25.0 for Window-6, while replacing all cleared
    rounds with summaries (Sum-12to0) lowered the score of early answers from 56% to 37.4%.'
  conditions: Qwen3-8B (thinking off), Llama3.1-8B-Instruct and GPT-4o-mini at temperature 0.8; eight
    AgentGym environments (Maze, ALFWorld, WebShop, TextCraft, FrozenLake, Hangman, 2048, RushHour), mostly
    text games and puzzles; settings tuned per method on the same environments; SEM about 0.4-0.6 points
    on the average; BrowseComp with Tongyi DeepResearch; no current frontier or reasoning models; the
    history is cut, not varied; numbers from v3 (May 2026)
  direction: supports
  measured: true
  locator: Abstract; §1; §2.2; §3.3 Table 1; §3.4; §3.5 Table 2; §3.9 Table 3; §3.10; Appendix F; Appendix
    H Table 7; Appendix N
