summary: 'An agent''s own history, and any examples in its prompt, act as few-shot demonstrations: when
  the context fills with near-identical action-observation pairs (twenty similar items in a row, a retried
  call), the model tends to copy their surface form instead of judging the current item. The change is
  to break that uniformity: vary the serialization, phrasing and order of examples and of newly appended
  actions and observations, describe repeated or failed actions instead of replaying them verbatim, or
  move independent items into separate contexts (5.c.ii). The measured support is mostly for the mechanism
  and for diverse examples: a failed call''s verbatim string accounted for 83% of small models'' pull
  toward repeating it, batching 20 studies flipped 5.6-26.7% of one model''s screening decisions against
  one-at-a-time runs, and diverse demonstrations beat the most similar ones by up to 23 points. No study
  tests Manus-style serialization noise on an agent end to end, and equivalent formats alone moved accuracy
  by up to 76 points, so measure the variation instead of assuming it helps.'
how: '1. Start from the baseline: run the agent with its uniform template on a batch of near-identical
  items (for example 20 resumes or abstracts in one context), plant an outlier late in the batch (position
  15 of 20), run every item alone in a fresh context as the reference, and log accuracy and decisions
  by position, repeated actions and repeats of failed calls. 2. Find where uniformity enters: tool results
  and actions serialized with one fixed template, harness messages with identical wording, few-shot examples
  that share one format and one structure, many similar items in one context, and failed calls replayed
  verbatim. 3. Diversify the examples in the prompt: choose examples that differ in structure and cover
  edge cases instead of the most similar ones; if you also vary their formatting (field names, separators,
  layout), pin the required output format with an instruction or a schema, since examples are what the
  model copies the format from. 4. Vary newly appended history, deterministically: rotate two or three
  equivalent templates and phrasings for observations and harness messages, and the order of fields that
  carry no meaning, choosing the variant from the item index or a seed at append time; never rewrite earlier
  entries, so the context stays append-only and the prefix cache-stable (see 3.b.i). 5. Do not replay repeated
  or failed actions verbatim (see 7.b.ii): replace a failed call with a short runtime-generated description
  of what failed, or block exact repeats at the decoder (see 7.b.i); an instruction not to repeat did not
  reduce repeats, and deleting the failed step made them worse. 6. Where items are independent, break
  the repetition structurally instead: process each item or small batches in fresh contexts (5.c.ii), shuffle
  item order across batches, and in proposal loops reject proposals too similar to recently accepted ones;
  raising the temperature did not add real diversity. 7. Measure with paired runs on the same items, uniform
  against varied (and against per-item contexts): accuracy and outlier detection by position, decision
  flip rate against the single-item runs, exact-repeat rate, output-format errors, tokens and cache hit
  rate, over several template sets and per model, reporting the spread rather than one number.'
detect:
  static: Every action and tool result serialized with one fixed template; harness messages with identical
    wording; few-shot examples that share one format and one structure or were picked as the most similar
    to the input; many similar items processed in one context; failed calls replayed verbatim in the history.
  traces: Identical or near-identical consecutive actions; repeats of a call that already failed; later
    outputs that copy wording or structure from earlier items; decisions that drift with position in the
    batch or toward the batch majority, or that differ from the same item run alone.
  evals: Accuracy and outlier detection by position in the batch; decision flip rate against each item
    run alone; spread across several equivalent templates.
  judge: 'Detect over-generalization: later outputs that carry over content or conclusions from earlier
    items instead of the current one.'
  probes:
    what: A batch of similar items with one outlier.
    construct: Twenty similar items with an outlier at position fifteen; run each item alone as the reference.
  primary:
  - evals
  - probes
impact:
  quality:
    effect: mixed
    size: medium
    when: diverse demonstrations beat the most similar ones by up to 23 points, 50.3 to 73.5, on compositional
      semantic parsing (Levy, Dec 2022); mixing formats across few-shot examples raised one task's worst-format
      accuracy from 0.139 to 0.712 but lost on three task-model pairs (Ngweta, Apr 2025); describing a
      failed call instead of replaying it cut exact repeats from 31% to 16% while task success went from
      42% to 33%, within noise (Gumaan, Aug 2026); rejecting near-duplicate proposals and reweighting
      toward unused edit types raised audited faithfulness from 0.44 to 0.71 where a higher temperature
      added 0.02-0.03 (He, Aug 2026); equivalent formats alone moved accuracy by up to 76 points (Sclar,
      Oct 2023)
    basis: evidence
  cost:
    effect: mixed
    size: small
    when: replacing a verbatim call with a description cost no generated tokens (Gumaan, Aug 2026); varying
      entries already in the history breaks the prompt cache, which the same Manus post warns against
      (Ji, Jul 2025); one item per call gives up the savings that are the reason to batch (Hida, Aug 2026)
    basis: evidence
  performance:
    effect: none
    when: no study reports latency; serialization changes add no generated tokens (Gumaan, Aug 2026);
      per-item contexts add calls that can run in parallel (see 5.c.ii)
    basis: evidence
