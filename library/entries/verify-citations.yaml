summary: 'Check every citation in a research agent''s report against the page it cites, and fix or drop
  what fails before the report goes out. It pays wherever readers rely on the citations: in one 14-model
  study, over 94% of frontier agents'' links worked and over 80% pointed to relevant pages, yet the page
  supported the claim only 38.9 to 76.8% of the time; in another, a URL checker in the loop cut non-resolving
  links from 4.9-16.0% to under 1%, and a writer that cites from extracted source facts cut misattributed
  claims 2.4 to 6.2 times in three systems, at 1.2 to 9.5 times the writing-stage input tokens. Cap search
  calls (GPT-5.4''s supported share fell from 78.6% at 2 calls to 16.7% at 150) and make the writer read
  what it cites: two web-search agents fetched only 2% and 19% of the pages they cited. The checks have
  limits: cheap judges matched frontier ones but rejected 18 to 47% of supported citations, and a binary
  support check passes conclusions that overstate their sources, which were at least 22% of the conclusions
  in each of seven systems.'
how: '1. Start from the baseline: run the current agent on a fixed question set and audit its reports.
  Parse claim-citation pairs deterministically with a Markdown parser (numbered, footnote, inline-link
  and range citations; a citation at the end of a passage covers the uncited sentences before it), fetch
  each cited page, and score each pair on three checks: the link works, the page is relevant, the page
  supports the claim. In one 14-model study, 12 models had over 94% working links and every frontier model
  over 80% relevant pages, but support ranged from 38.9% (GPT-5 Mini) to 76.8% (Claude Opus 4.5). Do not
  rely on a holistic report score instead: in another study a writer change cut misattributed claims 2.4
  to 6.2 times while the overall RACE score moved at most 1.8 points of 100. 2. Check links in the loop,
  before the answer is returned: give the agent a URL tool that sends HEAD (then GET), treats 403 as blocked
  rather than dead, and labels a dead URL with an archive snapshot as stale and one without as likely
  fabricated, and have the agent replace or drop failing citations. In one study on 435 questions this
  cut non-resolving citation URLs from 16.0% to 0.6% (GPT-5.1), 6.1% to 0.1% (Gemini 2.5 Pro) and 4.9%
  to 0.8% (Claude Sonnet 4.5) in a mean 1.56 to 4.06 correction rounds. 10.3 to 20.2% of URLs stayed unknown
  (bot blocking, paywalls, timeouts) and need a browser fetch or a person, and gpt-5-nano called the tool
  but kept re-proposing flagged URLs (7.5% still not live), so check that the model acts on the verdicts.
  3. Check support with a judge that sees only the claim and the fetched page text, one decision per pair,
  and choose and calibrate it on a human-labeled sample of your own claim-citation pairs (the studies
  here used 50 to 624) rather than by price. On one 624-pair benchmark, eight judges'' factual-support
  F1 ran from 0.649 to 0.750 with overlapping confidence intervals across a 49-fold spread in cost per
  decision, and GPT-5-mini, among the cheapest, had the best relevance F1 (0.908). Track false negative
  and false positive rates, not only F1: those judges rejected about 86% to nearly all deliberately falsified
  claims but also 18.3 to 47.0% of supported ones, so a strict judge understates support. Compare variants
  under one judge: on the same ten tasks, one audit measured 12.09 to 23.80% hallucinated claims with
  GPT-5.5 as judge and 45.24 to 58.72% with Gemini 3.5 Flash. 4. Act on each failure rather than only
  reporting the share: re-cite a claim to the retrieved source that supports it (in one audit, claims
  citing the wrong retrieved source were 5.9 to 24.7% of claims, against 12.1 to 27.1% that no retrieved
  source supported), and hedge or drop what nothing supports. For conclusions drawn across several sources,
  also check that the claim is no stronger or broader than the cited documents allow, which a binary support
  check passes: in one study at least 22% of conclusions in each of seven systems were overstated this
  way (22 to 35% severely for Gemini Deep Research). A no-search revision pass given the supporting and
  qualifying quotes a checker collected raised rubric scores by 4.4 and 12.0 points, against 0.4 and 1.1
  for revising without them, with a fifth to a tenth of the tokens of the full documents. 5. Make the
  writer read what it cites, and cap search calls when it synthesizes cited facts. Two web-search agents
  fetched the full page for only 19% (GPT Luna 5.6) and 2% (Claude Sonnet 5) of the documents they cited,
  working mostly from search snippets; giving them the full cited documents plus instructions to match
  each claim''s strength and scope to the evidence cut overstated conclusions from 29% to 12% and from
  61% to 25%, while either change alone did much less. In one two-model ablation, GPT-5.4''s supported
  share fell from 78.6% at 2 search calls to 45.9% at 10 and 16.7% at 150 (Claude Opus 4.6: 80.0% to 57.9%),
  while working links and relevance stayed above 92%. Prefer primary sources: Anthropic''s early research
  agents chose SEO content farms over academic PDFs until source-quality heuristics were added to the
  prompt (unmeasured). 6. If support or attribution stays low, change how the writer cites rather than
  adding checks: feed it single-source units that carry their citation. One writer that extracts facts
  from each source, assigns them to an outline drawn from the query and drafts each section with fact-level
  citation ids resolved at assembly cut misattributed claims from 22.31% to 3.62%, 18.94% to 5.43% and
  5.92% to 2.50% in three open deep research systems and hallucinated claims 2.6 to 4.5 times, at 1.2
  to 9.5 times the writing-stage input tokens and 3.8 to 5.5 points of 100 lower RACE readability (its
  authors'' own method). Cite selectively: providers whose models cited most had lower support, and more
  citations per query did not mean fewer errors per citation, though both findings compare models rather
  than test the change. 7. Measure with paired runs on the same questions, before and after, scored by
  the same calibrated judge: the share of claim-citation pairs passing each check, non-resolving, likely
  fabricated and unknown URLs, misattributed and unsupported claims, the share of synthesized conclusions
  stronger than their sources, an overall report score, and tokens, page fetches, judge calls and wall-clock
  per report; recheck the judge''s false negative and false positive rates on a fresh labeled sample.'
detect:
  static: a research or RAG agent that returns citations with no check of what they support, no URL check
    before the answer is returned, or a writer that drafts from multi-source notes or search snippets
    instead of the cited documents; no cap on search calls
  traces: search-call counts far above what the question needs; cited URLs never fetched in the run (cited
    from snippets only); cited passages that do not contain the claim; cited URLs that return 404 with
    no archive snapshot
  evals: share of citations whose source supports the claim, scored by a judge with known false negative
    and false positive rates; a holistic report score with no claim-level audit
  probes:
    what: whether the support check catches unsupported citations without rejecting supported ones
    construct: take clean cited reports and edit some claims (negate one, change a number, swap the citation
      for a relevant page that does not state the claim); the judge should reject the edited pairs and
      pass the untouched ones
impact:
  quality:
    effect: improves
    size: medium
    when: 'the checks find a real gap: cited pages supported 38.9 to 76.8% of frontier agents'' claims
      (Onweller, May 2026); fixes driven by them gained: a URL checker in the loop cut non-resolving links
      from 4.9-16.0% to 0.1-0.8% (Rao, Apr 2026), a writer citing from extracted source facts cut misattributed
      claims 2.4 to 6.2 times and hallucinated claims 2.6 to 4.5 times with overall RACE within 1.8 points
      (Hayashi, Aug 2026), and full cited documents plus calibration instructions cut overstated conclusions
      from 29% to 12% and 61% to 25% (Singha Roy, Oct 2026); no study has gated reports on the support
      check itself'
    basis: evidence
  cost:
    effect: mixed
    size: medium
    when: each claim-citation pair costs a page fetch and a judge call per check; judge cost per decision
      spanned 49 times across eight judges with no accuracy edge for the costliest (Leung, Jul 2026);
      link self-correction took a mean 1.56 to 4.06 rounds per question (Rao, Apr 2026); a claim-first
      writer used 1.2 to 9.5 times the writing-stage input tokens (Hayashi, Aug 2026); revising with checker-gathered
      evidence used 11k and 65k tokens of context against 117k and 324k for the full documents (Singha
      Roy, Oct 2026); capping search calls at 2 to 10 instead of 150 cuts search calls and kept support
      higher (Onweller, May 2026)
    basis: evidence
  performance:
    effect: mixed
    size: small
    when: link self-correction added a mean 1.56 to 4.06 correction rounds per question, up to 8 (Rao,
      Apr 2026); capping search calls cuts calls (Onweller, May 2026), whose checks ran 15 evaluators
      concurrently; no source timed the checks
    basis: evidence
