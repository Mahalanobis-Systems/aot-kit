  date: '2025-06-13'
  task: Add source-quality heuristics to the prompt
  effect: Human testers "noticed that our early agents consistently chose SEO-optimized content farms
    over authoritative but less highly-ranked sources ... Adding source quality heuristics to our prompts
    helped resolve this issue."
  direction: supports
  measured: false
