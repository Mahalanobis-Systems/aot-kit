caveats: 'No study has yet gated reports on the support check itself and measured the gain: the 14-model
  support rates come from an evaluation with an unnamed judge whose agreement with humans is not reported,
  and the tested fixes act on links (one study, URL validity only), on the writer (its authors'' own method,
  at up to 9.5 times the writing-stage input tokens and lower readability) or on revision with gathered
  evidence (one study, two models). The judge is a weak point: on one adversarial benchmark built by the
  14-model study''s team, judges rejected 18 to 47% of supported citations, so measured support rates
  may understate true support, and in another audit absolute hallucination rates differed 2.5 to 3.9 times
  between two judges on the same reports, so compare variants only under one calibrated judge. A binary
  support check also passes conclusions that overstate their sources, and the advice to cap search calls
  and cite selectively rests on one two-model ablation and on comparisons across models (within one system,
  citing more documents did not predict more overstatement).'
