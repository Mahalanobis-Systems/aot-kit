summary: 'Extract claim-citation pairs deterministically, then check each: the link resolves, the source
  is relevant, and the source actually supports the claim. Frontier agents pass the first two over 80-94%
  of the time and the third only 39-77%. Cap search calls when synthesizing cited facts and cite selectively:
  going from 2 to 150 calls cut supported citations from 78.6% to 16.7%. Prefer primary sources over content
  farms.'
how: '1. Parse the report''s claims and citations with a Markdown parser. 2. For each: fetch, check relevance,
  check support with a judge that sees only the claim and the passage. 3. Report the supported share;
  cap search calls in the agent.'
detect:
  static: a research or RAG agent that returns citations with no check of what they support; no cap on
    search calls
  traces: search-call counts far above what the question needs; cited passages that do not contain the
    claim
  evals: share of citations that factually support their claim
impact:
  quality:
    effect: improves
    size: medium
    when: factual support 39-77% before checking (May 2026)
    basis: evidence
  cost:
