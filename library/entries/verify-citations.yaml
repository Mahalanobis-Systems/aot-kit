# 9.a.ii: Verify citations claim by claim for factual support
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 9.a.ii
legacy_id: T50
slug: verify-citations
name: Verify citations claim by claim for factual support
kind: technique
status: card
tiers:
