  date: '2026-10-25'
  task: 'Compare 17 verification designs in a coding-agent harness by when and who checks: verification
    instructions at the start (L0), reminders after edits (L1), completion gates that fire on the first
    turn without a tool call and reopen the work for the same agent (inspect changes, run and check, recheck
    before finishing, or a scripted ''NOT complete, keep working'' rejection; one message, then the next
    stop is accepted) (L2), and independent review (L3): a separate critic model in a fresh context with
    read-only shell access to the live sandbox, given the task and the diff (or also the trajectory),
    that tries to falsify the agent''s claims by running the deliverable and returns findings for one
    revision before acceptance'
  effect: 'Average accuracy change over baseline, Terminal-Bench / SWE-bench Verified: L2 completion gates
    +0.7 to +6.0 / -0.5 to +6.2 points (best: the scripted rejection fired early, +6.0 / +6.2), rejection
    designs at 1.60-1.76x / 1.48-1.56x baseline cost, early user recheck at 1.13x / 1.20x; L3 independent
    review +5.9 to +9.5 / +3.9 to +6.6 at 1.13-1.25x / 1.00-1.04x cost, critic and revision included.
    Trajectory-based review scored higher than diff-based review on Terminal-Bench but not on SWE-bench
    or VisualBench, at 29-43% higher critic cost. Per model, L2 gates ranged from -10.7 to +17.9 points.
    After a user-role rejection agents took a median 12-19 more steps (4-6 after ''inspect changes'')
    and changed files in 86-96% of triggered runs. In baseline Terminal-Bench runs only 6.2% to 13.6%
    of editing turns were followed by a checking command before the next edit or the run''s end. Four
    critics added 3.1 points over one (62.7% to 65.8%) at 1.33x total cost. Authors: ''we recommend avoiding
    completion-time self-checking.'' VisualBench (18 tasks, blinded expert comparisons): early rechecking
    +2.7 net preference, independent review +13.2 to +23.8.'
