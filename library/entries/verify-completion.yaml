# 9.b.iii: Verify completion against the environment before the agent stops
# Register entry. Schema: ../schema/entry.schema.json. Vocabulary: ../vocabulary.yaml.
id: 9.b.iii
legacy_id: T44
slug: verify-completion
name: Verify completion against the environment before the agent stops
kind: technique
status: card
tiers:
- tier: 2
  why: false success and premature termination are silent hard failures
levers:
- control-flow
domains:
- general
evidence_domains:
- code-generation
- data-analysis
categories:
- verification.completion
summary: 'Never take the agent''s own report that it finished. Before it stops, check the claim against
  something it cannot write: the environment''s end state, a smoke test or end-to-end run, or its transcript
  (files it claims to have reviewed against files it opened). Veto stopping when code changed with no
  verification run; ask for an explicit scope statement; re-verify sub-agent findings before relaying
  them. Keep the checklist the agent is judged by in a form it is unlikely to rewrite (JSON, one status
  field editable), but expect rules alone to be weak: only a check the agent cannot see reliably held.'
how: 1. Define what 'done' means as an environment check (tests pass, feature works end to end, files
  reviewed). 2. Add a stop hook that runs it and refuses to stop on failure. 3. Lock the checklist format.
  4. Measure false-success and premature-stop rates.
detect:
  static: completion taken from the agent's final message or its own status flag; no stop hook; the agent
    can edit the tests or checklist it is judged by
  traces: final message claims success while the environment or transcript shows otherwise; runs ending
    right after an edit with no test or build run; edits to checklist items; failure rows labeled satisficing
    or specification-gaming
  evals: tasks scored failed where the agent reported success (false-success rate); features marked done
    that fail an end-to-end check
impact:
  quality:
    effect: improves
    size: medium
    when: 'MAST: ProgramDev 25.0 to 40.6 with reviewer sign-off (2025); Advani: false success is 45-76%
      of failures where the agent claims success, so the catch rate is large even if the fix is not (Jun
      2026)'
    basis: evidence
  cost:
    effect: degrades
    size: small
    basis: evidence
  performance:
    effect: degrades
    size: small
    basis: evidence
  security:
    effect: unknown
  governance:
    effect: unknown
  brand:
    effect: unknown
measure:
- method: before-after
  tier: 2
  how: false-success and premature-stop rate on the same cases
- method: monitor
  how: sampled completion checks in production
evidence:
- source: 'Laksh Advani, "From Confident Closing to Silent Failure: Characterizing False Success in LLM
    Agents", https://arxiv.org/abs/2606.09863'
  date: '2026-06-01'
  task: Do not treat the agent's own success status as completion
  effect: 'AppWorld (8,190 trajectories): react and plan_exec write status=success 1,503 and 1,099 times
    and status=fail zero times. Among self-assessing architectures with an explicit status, 75.8% of failures
    carry status=success (full_code_refl 74.9%, ipfuncall 77.3%; per-model 67% LLaMA-3 to 89% DeepSeekCoder).
    Easy tasks show more false success (88.2% at difficulty 1 vs 70.1% at 3), claimed after fewer API
    calls (23 vs 37).'
  direction: supports
  measured: true
  locator: §3.2, §4.1, Table 2, Appendix F Table 11
- source: 'Laksh Advani, "From Confident Closing to Silent Failure: Characterizing False Success in LLM
    Agents", https://arxiv.org/abs/2606.09863'
  date: '2026-06-01'
  task: Have an independent party verify state changes
  effect: 'Observational: false success is 45% (airline) and 48% (retail) of failures in single-control
    tau2-bench domains vs 3% in dual-control telecom, where the user simulator can verify state. Author
    treats it as a hypothesis: one dual-control domain, 15 false-success cases, other domain differences
    not controlled.'
  direction: supports
  measured: true
  locator: §1 Contributions (4), §4.1, Table 1
- source: 'Laksh Advani, "From Confident Closing to Silent Failure: Characterizing False Success in LLM
