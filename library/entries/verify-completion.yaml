  date: '2026-06-01'
  task: Check completion claims against environment state directly
  effect: 'Recommendation, not tested: "Substantial gains would likely require methods that verify trajectory-environment
    consistency directly rather than reading surface text." Motivated by 50% precision at a 10% flag rate
    for the best detector and 20-25% flip rates under adversarial rewriting for both detector and judges.'
  direction: supports
  measured: false
  locator: §4.4 Deployment scoping, §5, §6
- source: Smyth, Mantilla-Ramos, Tikeng Notsawo, Helbling, Tosato, Merzouk, Dziri, Gidel, Tosato (Tara
