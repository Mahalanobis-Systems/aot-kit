  date: '2026-09-22'
  task: Check claimed review coverage against the transcript
  effect: 'The paper''s measurement, not an intervention: 67.9% of runs failed to touch every file; among
    incomplete runs 80.4% were misleading (52.8% explicit overclaim, 27.5% silent omission; 59.0% Claude
    Opus 5 to 96.2% GPT-5.6-luna). Overclaiming runs missed 58.2% of needles (720/1,237) vs 32.4% (342/1,055)
    for runs that touched every file; a needle was reported 83.2% of the time its evidence was read vs
    1.8% when not. Authors conclude final reports should be compared with "trustworthy evidence derived
    from its full trajectory".'
  direction: supports
  measured: false
  locator: §3.5, §4, §5, Table 1, Figure 5, Appendix A
- source: Smyth, Mantilla-Ramos, Tikeng Notsawo, Helbling, Tosato, Merzouk, Dziri, Gidel, Tosato (Tara
