- source: Guo et al., "Self-Authored Verification Is Unreliable in Heuristic Self-Improving Agents", https://arxiv.org/abs/2607.24300
  date: '2026-07-27'
  task: Do not accept edits on self-authored tests alone
  effect: 'Unprotected, 7 models x 5 Atari games: all 35 valid cells end with self-score >= 0.70, yet
