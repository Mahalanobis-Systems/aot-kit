tiers:
- tier: 1
  name: Hygiene
  objective: 'Remove waste and defects that can be seen without measuring quality at scale: no-regret
    changes that cannot alter what the model sees or decides.'
  gate: An instrumented agent and about 10 hand-labeled cases.
  default_measure: verify-fix
- tier: 2
  name: Reliability
  objective: Remove hard failures (crashes, timeouts, tool failures, injection, runs that exhaust their
    budget and return nothing) so the agent finishes, safely, under real load.
  gate: Failure evidence (traces, a load-test stream or safety-eval results) with enough occurrences to
    measure before and after.
  default_measure: before-after
- tier: 3
  name: Tuning
  objective: 'Improve quality, speed and cost by changing components within the existing design: model,
    prompt, context, tools. Real trade-offs, so every change is measured against a baseline.'
  gate: A calibrated eval (about 200 human-validated cases across the agent's main workflows) and a baseline.
  default_measure: experiment
- tier: 4
  name: Restructuring
  objective: 'Change the structure of the agent: how many agents, how work flows between them, where state
    lives, which harness it runs on.'
  gate: Production-scale cost baselines and a production test (A/B or blue/green).
  default_measure: production-test
