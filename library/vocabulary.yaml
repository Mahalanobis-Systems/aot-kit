  covers: 'Reading documents: contracts, legal review, PDFs, forms'
- id: web-research
  name: Web research
  covers: Browsing the open web to answer or research
- id: computer-use
  name: Computer use
  covers: Operating GUIs, browsers, operating systems
- id: conversation
  name: Conversation
  covers: 'Multi-turn dialogue with end users: customer support, CRM assistants'
- id: planning
  name: Planning
  covers: Long-horizon, multi-step execution; staying coherent over many steps
- id: reasoning
  name: Reasoning
  covers: Math, proofs, science, abstract puzzles
- id: judging
  name: Judging
  covers: 'Evaluating, grading, verifying outputs: LLM-as-judge, graders, decision models'
- id: safety-classification
  name: Safety classification
  covers: 'Guardrail classifiers: injection, jailbreak, content safety'
- id: incident-response
  name: Incident response
  covers: 'On-call and SRE work: triage, root cause, remediation'
- id: decisioning
  name: Decisioning
  covers: 'Choosing per-user actions: personalization, recommendation, bandits'
- id: structured-output
  name: Structured output
  covers: Schema-valid typed output
- id: voice
  name: Voice
  covers: Speech and realtime audio
- id: security-research
  name: Security research
  covers: Finding vulnerabilities; cyber capability
- id: commerce
  name: Commerce
  covers: Transacting autonomously
- id: robotics
  name: Robotics
