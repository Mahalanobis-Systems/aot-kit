# The library's vocabulary: the two axes every optimization is placed on, the finer categories
# under each lever, and the four tiers. Every entry uses only the terms defined here.
#
# - levers: where in the agent a change lands, in any domain.
# - domains: what the agent is doing (capability domains). An entry lists the domains it is
#   specific to, or [general]; its evidence_domains say where it has actually been shown to work.
# - categories: the original ten-family scheme (2026-09-23), kept as the finer level under a lever.
#   Each family has a stable `number` and each sub-category a stable `letter` (2.a); entries'
#   library numbers (2.a.ii) are built on them, so never renumber or reletter. Add new ones at the end.
#   (A family's older `letter`, a-j, is the 2026-09-23 scheme's.)
#   Every sub-item names its lever. They used to mix both axes: memory.*, retrieval.* and tools.*
#   read like domains but are levers (state, knowledge-access, tool-surface).
# - tiers: what evidence a change needs before it can be recommended.

levers:
- id: model
  name: Model
  covers: Model choice, routing, cascades, reasoning effort
- id: prompt
  name: Prompt
  covers: System prompt, instructions, few-shot examples, prompt optimization, skill content
- id: context
  name: Context
  covers: 'What enters and stays in the window: compaction, filtering, isolation, cache layout'
- id: tool-surface
  name: Tool surface
  covers: Tool names, schemas, descriptions, return size, typed tools vs code execution
- id: control-flow
  name: Control flow
  covers: 'The harness loop: orchestration, multi-agent topology, budgets, stop rules, verify-and-retry'
- id: state
  name: State
  covers: 'Externalized state: plans, progress files, checkpoints, memory stores'
- id: knowledge-access
  name: Knowledge access
  covers: Connecting sources, query formulation, retriever choice, ranking
- id: guardrails
  name: Guardrails
  covers: Sandboxes, permissions, approval policies, data containment
- id: post-training
  name: Post-training
  covers: 'Changing the weights: fine-tuning, RL, distillation'
- id: serving
  name: Serving
  covers: 'Inference infrastructure: quantization, kernels, serving engines, gateways'
domains:
- id: retrieval
  name: Retrieval
  covers: 'Fetching knowledge the model lacks: RAG, search over docs, knowledge bases, customer systems'
- id: memory
  name: Memory
  covers: 'Remembering across turns and sessions: memory stores, cheatsheets, episodic memory'
- id: tool-use
